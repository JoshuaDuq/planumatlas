version: 2
updates:
  # Keeps the pinned workflow actions current; one grouped pull request a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The Svelte app in web/. Pins that must move together come in one pull request:
  # @vitest/browser-playwright requires vitest's exact version and vitest-browser-svelte its major,
  # @types/three describes one three release, and @axe-core/playwright requires axe-core's minor.
  # @playwright/test stays ungrouped because it also names the container image in tests.yml.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns: ["vitest", "vitest-browser-svelte", "@vitest/*"]
      three:
        patterns: ["three", "@types/three"]
      axe:
        patterns: ["axe-core", "@axe-core/*"]
      web-minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "@playwright/test"
          - "playwright*"
          - "vitest"
          - "vitest-browser-svelte"
          - "@vitest/*"
          - "three"
          - "@types/three"
          - "axe-core"
          - "@axe-core/*"
  # The Python pipeline and the docs build (pyproject.toml and uv.lock), grouped by role so docs
  # bumps do not open separate PRs alongside pipeline dependencies.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["sphinx*", "myst-parser", "furo"]
      python:
        patterns: ["*"]
        exclude-patterns: ["sphinx*", "myst-parser", "furo"]
