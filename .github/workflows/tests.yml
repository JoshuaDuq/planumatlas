name: Tests

on:
  pull_request:
    branches: [main]
  # Called by the deploy workflow, which publishes nothing unless this passes.
  workflow_call:
  # Runs everything, including the end-to-end tests that pull requests skip.
  workflow_dispatch:
  # The same, nightly on main: e2e is not a gate for pull requests or the deploy, so this is where
  # it runs unasked. 03:17 UTC, off the hour, when GitHub delays fewer scheduled runs.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# A newer push to a pull request cancels the run before it. Every other run is a group of its own
# and cancels nothing: a called workflow takes its caller's name, event and run id, so a deploy's
# tests are ordered by deploy.yml's groups alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Python suite and the anatomy validation take minutes, so they run only
  # when something they read has changed. A job skipped by its `if` reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      python: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.python == 'true' }}
      validate: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.validate == 'true' }}
      web: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.web == 'true' }}
      feedback: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.feedback == 'true' }}
    steps:
      # Commits and trees only: enough to list changed paths without the 400 MB of assets.
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      # On main, compare against the last commit that deployed, so a push after a
      # failed run is still checked for everything that has not passed since.
      # A manual or nightly run, or one with no deployed commit to compare against, runs everything.
      - name: Find the last deployed commit
        id: base
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == schedule || -z "$sha" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests are compared with their base branch through the API.
      - name: Detect changed paths
        id: filter
        if: steps.base.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            validate: &validate
              - brain_model/**
              - config/**
              - data/**
              - public/**
              - pyproject.toml
              - uv.lock
              - .github/workflows/tests.yml
            # Every Python file, so its ruff check runs wherever it lives. Quoted: a bare `*` starts
            # a YAML alias.
            python:
              - *validate
              - tests/**
              - '**/*.py'
            # The Svelte app and what it reads.
            web:
              - web/**
              - config/**
              - data/**
              - public/**
              - CITATION.cff
              - docs/reference/references.md
              - scripts/published-version.mjs
              - scripts/published-version.test.mjs
              - .github/scripts/**
              - .github/workflows/tests.yml
            # The Worker, its tsconfig included, and web/'s lockfile, which pins the TypeScript and
            # Node types it is checked with.
            feedback:
              - workers/feedback/**
              - web/package-lock.json
              - .github/workflows/tests.yml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint Python
        run: uv run ruff check

      # One worker per runner core; every test writes only under its own tmp_path.
      # Work stealing keeps the few 10-25 s NextBrain tests from piling onto one worker.
      - name: Run Python tests
        run: uv run pytest -n auto --dist worksteal

  validate:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # mni152 is held out until the midline septal cross-source overlap (0.574 vs 0.50) is resolved.
        anatomy: [cdmd]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # Re-checks every published asset of this anatomy against its sources.
      - name: Validate the published anatomy
        run: uv run python -m brain_model.validate --anatomy ${{ matrix.anatomy }}

  # Also on a change to the Worker alone: its unit tests hold the feedback form to the Worker's own
  # address pattern and length (COLO-10). Adding the Worker to the web filter instead would also
  # start the four browser shards, which nothing of the Worker's reaches.
  web-check:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.feedback == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Lint
        run: npm run lint --prefix web

      - name: Check formatting
        run: npm run format --prefix web -- --check

      - name: Type-check (TypeScript 6 and svelte-check)
        run: npm run check --prefix web

      - name: Type-check (TypeScript 7)
        run: npm run check:ts7 --prefix web

      - name: Run unit tests
        run: npm test --prefix web

      - name: Run the published-version tests
        run: node --test scripts/published-version.test.mjs

      # What deploy ships, checked for the chunks, the page's head and the service worker's version
      # map; it also hashes the real public/ tree. deploy.yml checks the build it publishes again.
      - name: Build the site and check it
        run: |
          npm run build --prefix web
          node .github/scripts/check-dist.mjs

      # Bits UI plus the Svelte runtime, as web/docs/decisions/0001-ui-kit.md defines the budget.
      - name: Check the UI bundle budget
        shell: bash
        run: |
          node .github/scripts/ui-bundle-budget.mjs | tee ui-budget.log
          cat ui-budget.log >> "$GITHUB_STEP_SUMMARY"

  # The feedback Worker (workers/feedback), which has no dependencies: its tests with Node's own
  # test runner, which strips their types, then the Worker and its tests type-checked with web/'s
  # TypeScript and Node types (workers/feedback/tsconfig.json).
  feedback-worker:
    needs: changes
    if: needs.changes.outputs.feedback == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            workers/feedback
            web

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run the Worker tests
        run: node --test 'workers/feedback/**/*.test.ts'

      - name: Install web's dependencies
        run: npm ci --prefix web

      - name: Type-check the Worker
        run: node web/node_modules/typescript/bin/tsc -p workers/feedback

  # In Playwright's image (Playwright's CI guide): Chromium, its system libraries and Xvfb are
  # already there, so nothing is installed per run. Installing them took 25 s, or 6 to 11 min when
  # an apt mirror was slow (12 runs in 67). The image is pulled by its digest, so its tag alone
  # changes nothing: the tag must equal the Playwright version in web/package-lock.json and the
  # digest be the one the registry gives that tag. The check after the install fails if a
  # dependency update or an edit moves one without the others.
  # Four shards: the browser suite is about 11 min on one runner (Vitest's sharding guide).
  web-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # A tag's digest: curl -sI -H 'Accept: application/vnd.oci.image.index.v1+json' https://mcr.microsoft.com/v2/playwright/manifests/<tag> | grep -i docker-content-digest
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/*/

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      # Every Playwright image in this file, web-e2e's included, against the installed Playwright
      # and the registry's digest for its tag. Run once on shard 1 instead of hitting MCR 4x.
      - name: Check the image matches Playwright
        if: matrix.shard == 1
        shell: bash
        run: |
          version=$(node -p "require('./web/node_modules/playwright-core/package.json').version")
          tag="mcr.microsoft.com/playwright:v$version-noble"
          digest=$(curl -fsSI -H 'Accept: application/vnd.oci.image.index.v1+json' "https://mcr.microsoft.com/v2/playwright/manifests/v$version-noble" | tr -d '\r' | grep -i '^docker-content-digest:' | cut -d' ' -f2) || { echo "::error::The registry gave no digest for v$version-noble"; exit 1; }
          images=$(sed -n 's/^ *image: \(mcr\.microsoft\.com\/playwright:\)/\1/p' .github/workflows/tests.yml)
          test -n "$images" || { echo "::error::No Playwright image found in tests.yml"; exit 1; }
          for image in $images; do
            test "$image" = "$tag@$digest" || { echo "::error::The container image is $image; for Playwright $version set every image in tests.yml to $tag@$digest"; exit 1; }
          done

      # Headed under Xvfb, so the browser has a mouse: headless Linux has no pointing device and
      # matches (hover: none) and (pointer: none), where a desktop matches hover and a fine pointer.
      # A launch flag cannot stand in for it, as switching touch emulation off restores the device's.
      # Includes the WebGL probe (src/boot/webgl-probe.svelte.test.ts); its renderer line goes to
      # the job summary of the shard that runs it.
      - name: Run browser tests, shard ${{ matrix.shard }}/4
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npm run test:browser --prefix web -- --browser.headless=false --shard=${{ matrix.shard }}/4 2>&1 | tee browser-tests.log
          if grep -qh 'WebGL renderer' browser-tests.log; then
            { echo '### WebGL probe'; grep -h 'WebGL renderer' browser-tests.log; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-failures-${{ matrix.shard }}
          path: |
            web/src/**/__screenshots__/
            web/.vitest/attachments/
          if-no-files-found: ignore

  # The journeys on the built Svelte preview (web/e2e/journeys), one runner per Playwright project
  # (web/playwright.config.ts): every journey in Chromium, and the phone smoke (boot, pick, cut,
  # sheet) in WebKit on an iPhone. It runs when started by hand (Actions → Tests → Run workflow) and
  # nightly, never on pull requests or pushes.
  web-e2e:
    needs: changes
    # e2e is not a gate for pull requests or the deploy. A called workflow sees its caller's event
    # and name, so a hand-started deploy must not run it.
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.workflow == 'Tests' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      # web-browser's image, which carries WebKit as well; its check covers this line.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit-iphone]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/*/

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      # The server (web/e2e/serve-site.mjs) serves web/dist at /, as the custom domain does.
      - name: Build the site
        run: npm run build --prefix web

      # Playwright's CI guide: one worker per job. One retry, and a test that needed it fails the job.
      - name: Run end-to-end tests (${{ matrix.project }})
        run: npm run test:e2e --prefix web -- --project=${{ matrix.project }} --workers=1 --retries=1 --fail-on-flaky-tests --global-timeout=2400000

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-failures-${{ matrix.project }}
          path: |
            web/test-results/
          if-no-files-found: ignore
