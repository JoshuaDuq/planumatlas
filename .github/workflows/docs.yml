name: Docs check

on:
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - .github/assets/readme/**
      - .github/workflows/docs.yml
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

# A newer push to the pull request cancels the check before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only what the build reads: the pages, the README image index.md takes as its figure, and the
      # root files cone mode always keeps (pyproject.toml for the release and uv.lock). Other blobs
      # are not fetched.
      - name: Checkout the docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            docs
            .github/assets/readme

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: uv sync --locked --group docs --no-install-project

      # Strict: any Sphinx warning fails the check. Nothing is deployed from a pull request.
      - name: Build documentation
        run: uv run sphinx-build -W -b html -d docs/_build/doctrees docs docs/_build/html
