name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Agent, design and repository notes are not part of the site or its checks.
    paths-ignore:
      - deliverables/**
      - AGENTS.md
      - CLAUDE.md
      - PRODUCT.md
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A newer push cancels the tests and build of the one before it, so a superseded
  # commit can never reach the deploy job after, and over, a newer one.
  tests:
    uses: ./.github/workflows/tests.yml
    concurrency:
      group: ${{ github.workflow }}-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: read

  # Builds while the tests run; nothing is published unless they pass.
  build:
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      entry: ${{ steps.expected.outputs.entry }}
      manifest: ${{ steps.expected.outputs.manifest }}
      version: ${{ steps.expected.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      # The checks tests.yml's web-check makes of its own build (BUILD-02 to BUILD-06 and BUILD-14 to
      # BUILD-16), made again of the build published here before it is copied.
      - name: Build static site and check it
        run: |
          npm run build --prefix web
          node .github/scripts/check-dist.mjs
          cp -r web/dist dist

      # What the live site must serve once this build is deployed (BUILD-19): the page's entry script,
      # whose name carries its content hash, and the default anatomy's manifest at the version the
      # page's head map names, the first 16 hex of its SHA-256.
      - name: Record the page and manifest this build publishes
        id: expected
        shell: bash
        run: |
          manifest="models/$(jq -r .default public/models/anatomies.json)/manifest.json"
          entry=$(grep -o '<script type="module" crossorigin src="/assets/[^"]*"' web/dist/index.html | cut -d'"' -f4)
          version=$(grep -o "\"$manifest\":\"[0-9a-f]\{16\}\"" web/dist/index.html | cut -d'"' -f4)
          test -n "$entry" || { echo "::error::No entry script in web/dist/index.html"; exit 1; }
          test -n "$version" || { echo "::error::No version for $manifest in web/dist/index.html"; exit 1; }
          { echo "entry=$entry"; echo "manifest=$manifest"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

      # The Svelte build was previewed at /neuroatlas/next/; links to it now lead to the site.
      - name: Redirect the former preview path
        run: |
          mkdir dist/next
          cp web/build/next-redirect.html dist/next/index.html

      # After the site is copied into dist/, the docs are added to it here.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: uv sync --locked --group docs --no-install-project

      - name: Build documentation into dist/docs
        run: uv run sphinx-build -W -b html -d docs/_build/doctrees docs dist/docs

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: [tests, build]
    # Deploys only what passed: tests and build cancelled by a newer push are neither.
    if: ${{ always() && needs.tests.result == 'success' && needs.build.result == 'success' }}
    # Only the deployment waits for the one before it, so a new push starts its
    # tests at once. An in-progress deployment is left to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # BUILD-19: the live site is the one just deployed. The page must name this build's entry script
  # and manifest version, and the manifest must be served at that version. Pages' CDN may keep a page
  # for up to 10 minutes, so each try asks with a query of its own, which no cache holds, until a
  # deadline: the first try normally passes, and a deploy that never shows fails here.
  live-check:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Check the live page and manifest are this deploy's
        shell: bash
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
          ENTRY: ${{ needs.build.outputs.entry }}
          MANIFEST: ${{ needs.build.outputs.manifest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          site="${SITE%/}/"
          deadline=$((SECONDS + 600))
          for try in $(seq 1 1000); do
            page=$(curl -fsS "${site}?deploy=$GITHUB_RUN_ID-$try") || page=''
            served=$(curl -fsS "${site}${MANIFEST}?v=$VERSION" | sha256sum | cut -c1-16) || served=''
            if grep -qF "src=\"$ENTRY\"" <<<"$page" && grep -qF "\"$MANIFEST\":\"$VERSION\"" <<<"$page" \
              && [[ "$served" == "$VERSION" ]]; then
              echo "$site serves $ENTRY and $MANIFEST at $VERSION (try $try)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::After 10 min $site does not serve this deploy: entry $ENTRY, $MANIFEST at $VERSION (manifest served at ${served:-nothing})"
              exit 1
            fi
            sleep 20
          done
