circuits:
  - id: vision
    name: { en: Visual pathway, fr: Voie visuelle }
    summary:
      en: Follow the pathway that carries signals from the right visual hemifield to left primary visual cortex.
      fr: Suivez le trajet des signaux de l’hémichamp visuel droit jusqu’au cortex visuel primaire gauche.
    route:
      en: Optic chiasm → left optic tract → left dorsal lateral geniculate nucleus → left V1
      fr: Chiasma optique → tractus optique gauche → noyau géniculé latéral dorsal gauche → V1 gauche
    scope:
      en: The tour starts at the midline chiasm and follows the left geniculostriate pathway. The optic radiations connect the left dorsal lateral geniculate nucleus to V1, and the tour has no separate landmark for them. The tour leaves out the retina, optic nerves and other retinal projections, including those to the superior colliculus and pretectum.
      fr: Le parcours commence au chiasma médian et suit la voie géniculostriée gauche. Les radiations optiques relient le noyau géniculé latéral dorsal gauche à V1 et le parcours ne leur consacre pas de repère distinct. Le parcours laisse de côté la rétine, les nerfs optiques et les autres projections rétiniennes, dont celles vers le colliculus supérieur et le prétectum.
    clinical:
      en: The link with homonymous visual field loss is direct when the retrochiasmal optic tract is injured. Kedar’s retrospective adult stratum included 818 homonymous visual field defects in 771 patients aged 19 to 92 at presentation. Among defects with a recorded lesion site, the occipital lobes and optic radiations were the most frequent sites. Similar patterns occurred at several retrochiasmal sites, limiting their value for locating an individual lesion. Chen and colleagues’ retrospective neuro-ophthalmology series included patients with an optic tract lesion confirmed on MRI and at least one compatible sign. The study documents contralateral homonymous field loss, including incomplete, incongruous defects, in adults with ischaemic or haemorrhagic lesions involving the tract. Some lesions extended beyond the optic tract. In Lugtmeijer and colleagues’ main atlas-based analysis after ischaemic stroke, right visual field deficits on an eye-tracked quadrant screen were associated with lesions in left HCP-MMP areas V1, V2 and V3 after correction for multiple comparisons. The comparison included nine adults with right visual field deficits and 125 with no visual field deficit detected. The screen grouped deficits affecting one or both quadrants on the same side. At the main coverage threshold, the separate voxelwise analysis found no corrected association for right field loss. A lower coverage threshold yielded a small significant cluster. After anterior temporal resection, 15 of 18 adults had a superior homonymous field defect on the side opposite surgery. The resections included several temporal structures, and only six patients had preoperative perimetry.
      fr: Le lien avec la perte homonyme du champ visuel est direct en cas d’atteinte du tractus optique en arrière du chiasma. Le groupe adulte de la série rétrospective de Kedar comprenait 818 déficits homonymes du champ visuel chez 771 patients âgés de 19 à 92 ans lors de leur première consultation. Parmi les déficits dont le siège lésionnel était renseigné, les lobes occipitaux et les radiations optiques étaient les sites les plus fréquents. Des profils campimétriques semblables correspondaient à plusieurs sites rétrochiasmatiques, ce qui limitait leur valeur pour localiser une lésion. Dans la série rétrospective de neuro-ophtalmologie de Chen et de ses collègues, les patients présentaient une lésion du tractus optique confirmée à l’IRM et au moins un signe compatible. L’étude décrit, chez des adultes dont une lésion ischémique ou hémorragique touchait le tractus, des déficits homonymes du champ visuel du côté opposé, dont certains étaient incomplets et incongruents. Certaines lésions s’étendaient au-delà du tractus optique. Dans l’analyse principale de Lugtmeijer et de ses collègues après AVC ischémique, les déficits du champ visuel droit, repérés par un test de dépistage avec suivi du regard, étaient associés à des lésions des aires V1, V2 et V3 gauches de l’atlas HCP-MMP après correction pour comparaisons multiples. La comparaison incluait neuf adultes présentant un déficit du champ visuel droit et 125 chez qui aucun déficit du champ visuel n’avait été détecté. Le dépistage regroupait les atteintes d’un ou de deux quadrants du même côté. Au seuil principal de couverture lésionnelle, l’analyse voxel par voxel distincte n’a trouvé aucune association corrigée pour la perte du champ visuel droit. Avec un seuil de couverture plus bas, un petit ensemble de voxels atteignait le seuil de significativité. Après résection temporale antérieure, 15 adultes sur 18 présentaient un déficit homonyme du champ visuel supérieur du côté opposé à l’intervention. Les résections englobaient plusieurs structures temporales, et seuls six patients avaient une périmétrie préopératoire.
    deficit: hemianopia
    references: [visual-pathways, retinotopy, chiasm-histology, optic-radiation-dissection, v1-retinotopy, clinical-kedar-2006-visual-field, clinical-chen-optic-tract-2025, clinical-lugtmeijer-2025, cortical-parcellation, visual-retinal-central-projections, clinical-krolak-salmon-2000]
    clinical_references: [clinical-kedar-2006-visual-field, clinical-chen-optic-tract-2025, clinical-lugtmeijer-2025, clinical-krolak-salmon-2000]
    steps:
      - id: chiasm
        region: learning:midline:optic-chiasm
        source_name: Optic chiasm
        name: { en: Optic chiasm, fr: Chiasma optique }
        role: { en: Partial crossing, fr: Croisement partiel }
        explanation:
          en: Fibres from the nasal half of each retina cross into the opposite optic tract. Fibres from the temporal half continue into the optic tract on the same side.
          fr: Les fibres issues de l’hémirétine nasale de chaque œil croisent la ligne médiane pour rejoindre le tractus optique opposé. Celles de l’hémirétine temporale gagnent le tractus du même côté.
        mapping:
          en: This teaching volume combines the two NextBrain chiasm labels into one midline landmark.
          fr: Ce volume pédagogique réunit les deux étiquettes chiasmatiques de NextBrain en un seul repère médian.
        view: inferior
        plane: axial
      - id: tract
        region: nextbrain:left:208
        source_name: optic_tract
        name: { en: Left optic tract, fr: Tractus optique gauche }
        role: { en: Right visual hemifield, fr: Hémichamp visuel droit }
        explanation:
          en: The left optic tract carries signals from the right nasal hemiretina and the left temporal hemiretina. The fibres that reach the left dorsal lateral geniculate nucleus convey information about the right visual hemifield.
          fr: Le tractus optique gauche véhicule les signaux de l’hémirétine nasale droite et de l’hémirétine temporale gauche. Les fibres qui rejoignent le noyau géniculé latéral dorsal gauche transmettent les informations de l’hémichamp visuel droit.
        mapping:
          en: NextBrain shows the outline of the optic tract as a single segmented volume.
          fr: NextBrain délimite le tractus optique en un seul volume segmenté.
        view: inferior
        plane: axial
      - id: lgn
        region: nextbrain:left:484
        source_name: dorsal_lateral_geniculate_nucleus
        name: { en: Left dorsal lateral geniculate nucleus, fr: Noyau géniculé latéral dorsal gauche }
        role: { en: Thalamic relay, fr: Relais thalamique }
        explanation:
          en: Axons from this left thalamic nucleus reach left V1 through the optic radiations. Human fibre dissections show the gross course of this bundle.
          fr: Les axones issus de ce noyau thalamique gauche gagnent l’aire V1 gauche par les radiations optiques. Les dissections humaines montrent le trajet macroscopique de ce faisceau.
        mapping:
          en: NextBrain groups the layers of the dorsal nucleus under a single atlas label.
          fr: NextBrain regroupe les couches du noyau dorsal sous une seule étiquette d’atlas.
        view: posterior
        plane: coronal
      - id: v1
        region: hcp-mmp:left:1
        source_name: L_V1_ROI
        name: { en: Left primary visual cortex, fr: Cortex visuel primaire gauche }
        role: { en: Cortical visual map, fr: Carte visuelle corticale }
        explanation:
          en: Left V1 extends along the banks of the calcarine sulcus and represents the right visual hemifield.
          fr: V1 gauche s’étend le long des berges du sillon calcarin et représente l’hémichamp visuel droit.
        mapping:
          en: The HCP-MMP parcel transfers the group atlas boundary onto this brain’s cortical surface. An individual functional map would require measuring visual responses.
          fr: La parcelle HCP-MMP transpose les limites de l’atlas de groupe sur la surface corticale de ce cerveau. Une carte fonctionnelle individuelle nécessiterait de mesurer les réponses visuelles.
        view: right
        plane: coronal
        map: visual-field

  - id: memory
    name: { en: Hippocampal–diencephalic pathway, fr: Voie hippocampo-diencéphalique }
    summary:
      en: Follow a branch from the left subiculum through the mammillary body to the anterior thalamus.
      fr: Suivez une branche qui relie le subiculum gauche au thalamus antérieur en passant par le corps mamillaire.
    route:
      en: Left caudal subiculum → fornix → mammillary body → mammillothalamic tract → anteroventral thalamic nucleus
      fr: Subiculum caudal gauche → fornix → corps mamillaire → faisceau mamillothalamique → noyau antéroventral du thalamus
    scope:
      en: This tour follows one branch on the left. The fimbria continues into the crus of the fornix between the first two landmarks. Human dissection shows the gross course of the fornix and mammillothalamic tract. Macaque tracing identifies the origins and targets at regional scale. The precommissural fornix, direct subicular projections to the anterior thalamus and connections beyond the anterior thalamus lie outside this branch.
      fr: Ce parcours suit une branche du côté gauche. La fimbria se poursuit par le pilier postérieur du fornix entre les deux premiers repères. La dissection humaine montre le trajet macroscopique du fornix et du faisceau mamillothalamique. Les traçages chez le macaque situent les origines et les cibles à l’échelle régionale. Le fornix précommissural, les projections directes du subiculum vers le thalamus antérieur et les connexions au-delà du thalamus antérieur sortent du cadre de cette branche.
    clinical:
      en: The link with anterograde amnesia is direct at the fornix, based on bilateral injury. The contribution of the postcommissural fibres in isolation remains unresolved. R.B. had lasting anterograde amnesia after ischaemic injury mainly affecting CA1 on both sides. In a series of 12 patients after colloid cyst surgery, the three with bilateral fornix interruption on MRI had difficulty learning and recalling new material. Some patients had other abnormalities on MRI. In one adult with an isolated infarct of both anterior fornix columns, anterograde amnesia persisted at nine months. In a separate bilateral fornix infarct case, delayed recall improved during hospitalisation, while the verbal memory score remained low at the assessment before discharge. In a post-mortem comparison, estimated neuron counts in the anterior principal thalamic nucleus were lower in eight cases with alcohol-related Korsakoff amnesia than in five non-amnesic Wernicke cases. Both groups had neuronal loss in the medial mammillary and mediodorsal thalamic nuclei. Danet and colleagues assessed 12 patients at least three months after a first symptomatic left thalamic infarct. The seven with reduced left mammillothalamic tract volume on MRI scored lower on verbal recall and recognition than the five with tract sparing. In six of those seven patients, the infarct overlapped the tract in the Morel atlas. The group with tract involvement had larger infarcts on average and more extensive injury to the lateral group of thalamic nuclei. Vidal and colleagues analysed 40 patients with chronic thalamic infarcts, drawn partly from the same recruitment cohort. In voxel-based lesion–symptom mapping adjusted for overall lesion volume and corrected for multiple comparisons, poorer delayed free recall of words was associated with a left thalamic cluster overlapping the estimated position of the tract and parts of the ventral anterior and ventral lateral posterior nuclei. The respective contributions of the tract and nearby nuclei remain unresolved.
      fr: Le lien avec l’amnésie antérograde est direct à l’échelle du fornix, sur la base d’atteintes bilatérales. La contribution propre des fibres postcommissurales reste indéterminée. R.B. a présenté une amnésie antérograde durable après une lésion ischémique touchant principalement le champ CA1 des deux côtés. Dans une série de 12 patients opérés d’un kyste colloïde, les trois dont l’IRM montrait une interruption bilatérale du fornix avaient des difficultés à apprendre et à rappeler de nouvelles informations. Certains patients présentaient d’autres anomalies à l’IRM. Chez un adulte ayant présenté un infarctus isolé des deux colonnes antérieures du fornix, l’amnésie antérograde persistait à neuf mois. Dans un autre cas d’infarctus bilatéral du fornix, le rappel différé s’est amélioré pendant l’hospitalisation, tandis que le score de mémoire verbale restait faible lors de l’évaluation précédant la sortie. Dans une comparaison post-mortem, le nombre estimé de neurones du noyau principal antérieur du thalamus était inférieur chez les huit personnes présentant une amnésie de Korsakoff liée à l’alcool à celui des cinq personnes atteintes d’une encéphalopathie de Wernicke sans amnésie. Une perte neuronale touchait le noyau mamillaire médial et le noyau médiodorsal du thalamus dans les deux groupes. Danet et ses collègues ont examiné 12 patients au moins trois mois après un premier infarctus thalamique gauche symptomatique. Les sept patients dont le volume du faisceau mamillothalamique gauche était réduit à l’IRM obtenaient de moins bons résultats aux épreuves verbales de rappel et de reconnaissance que les cinq dont le faisceau était épargné. Chez six de ces sept patients, l’infarctus recoupait le faisceau dans l’atlas de Morel. Dans le groupe où le faisceau était atteint, les infarctus étaient en moyenne plus volumineux et l’atteinte du groupe latéral des noyaux thalamiques était plus étendue. Vidal et ses collègues ont analysé les données de 40 patients examinés à distance d’un infarctus thalamique, dont une partie provenait de la même cohorte de recrutement. La cartographie voxel par voxel des relations entre lésions et symptômes, ajustée sur le volume lésionnel total et corrigée pour les comparaisons multiples, associait de moins bons résultats au rappel libre différé de mots à un ensemble de voxels du thalamus gauche. Cet ensemble recouvrait la position estimée du faisceau et des portions des noyaux ventral antérieur et ventral latéral postérieur. Les contributions respectives du faisceau et des noyaux voisins restent indéterminées.
    deficit: amnesia
    references: [memory-anatomy, memory-network, fornix, memory-subicular-tracing, memory-human-dissection, memory-mammillothalamic-dissection, memory-mammillothalamic-tracing, clinical-zola-morgan-1986, clinical-aggleton-2000, clinical-harding-2000, clinical-danet-mammillothalamic-2015, clinical-vidal-thalamic-recall-2025, clinical-bradshaw-2024, clinical-koike-2025]
    clinical_references: [clinical-zola-morgan-1986, clinical-aggleton-2000, clinical-harding-2000, clinical-danet-mammillothalamic-2015, clinical-vidal-thalamic-recall-2025, clinical-bradshaw-2024, clinical-koike-2025]
    steps:
      - id: hippocampus
        region: nextbrain:left:576
        source_name: caudal_subiculum
        name: { en: Left caudal subiculum, fr: Subiculum caudal gauche }
        role: { en: Subicular origin, fr: Origine subiculaire }
        explanation:
          en: In macaques, retrograde tracer injections centred on the medial mammillary nucleus labelled more neurons in the posterior than in the anterior subiculum. The reaction product extended beyond the medial nucleus. Subicular fibres reach the mammillary body through the postcommissural fornix.
          fr: Chez le macaque, des injections de traceur rétrograde centrées sur le noyau mamillaire médial ont marqué davantage de neurones dans le subiculum postérieur que dans le subiculum antérieur. Le produit de réaction s’étendait au-delà du noyau médial. Des fibres subiculaires gagnent le corps mamillaire par le fornix postcommissural.
        mapping:
          en: NextBrain shows the caudal human subiculum. Macaque tracing showed a gradient along the subiculum.
          fr: NextBrain délimite le subiculum caudal humain. Le traçage chez le macaque montrait un gradient le long du subiculum.
        view: right
        plane: coronal
      - id: fornix
        region: nextbrain:left:199
        source_name: fornix
        name: { en: Left fornix, fr: Fornix gauche }
        role: { en: Postcommissural route, fr: Trajet postcommissural }
        explanation:
          en: This branch descends behind the anterior commissure in the postcommissural fornix. In macaques, subicular fibres take this route to the mammillary bodies.
          fr: Cette branche descend en arrière de la commissure antérieure dans le fornix postcommissural. Chez le macaque, des fibres issues du subiculum empruntent ce trajet vers les corps mamillaires.
        mapping:
          en: The NextBrain label covers the fornix on this side. The postcommissural fibres occupy only part of that volume.
          fr: Le volume NextBrain délimite le fornix de ce côté. Les fibres postcommissurales n’occupent qu’une partie de ce volume.
        view: left
        plane: sagittal
      - id: mammillary
        region: learning:left:mammillary
        source_name: Mammillary nuclei
        name: { en: Left mammillary body, fr: Corps mamillaire gauche }
        role: { en: Hypothalamic relay, fr: Relais hypothalamique }
        explanation:
          en: In macaques, subicular fibres reach the medial mammillary nucleus. Neurons in that nucleus send fibres into the mammillothalamic tract.
          fr: Chez le macaque, des fibres issues du subiculum atteignent le noyau mamillaire médial. Des neurones de ce noyau envoient des fibres dans le faisceau mamillothalamique.
        mapping:
          en: This teaching volume combines the three atlas subdivisions of the medial mammillary nucleus and the lateral mammillary nucleus. The medial nucleus is the relay described here.
          fr: Ce volume pédagogique réunit les trois subdivisions du noyau mamillaire médial et le noyau mamillaire latéral. Le relais décrit ici est le noyau médial.
        view: inferior
        plane: sagittal
      - id: mammillothalamic
        region: nextbrain:left:276
        source_name: mammillothalamic_tract
        name: { en: Left mammillothalamic tract, fr: Faisceau mamillothalamique gauche }
        role: { en: Ascent to the anterior thalamus, fr: Ascension vers le thalamus antérieur }
        explanation:
          en: In human dissections, this bundle rises from the mammillary body into the anterior thalamic nuclear group. It runs behind the descending fornix.
          fr: Dans les dissections humaines, ce faisceau monte du corps mamillaire et pénètre dans le groupe des noyaux antérieurs du thalamus. Il passe en arrière de la colonne descendante du fornix.
        mapping:
          en: NextBrain segments the bundle as a single volume. Fibres bound for different thalamic nuclei share the label.
          fr: NextBrain segmente le faisceau en un seul volume. La même étiquette regroupe les fibres destinées aux différents noyaux thalamiques.
        view: left
        plane: sagittal
      - id: thalamus
        region: nextbrain:left:220
        source_name: anteroventral_nucleus_of_thalamus
        name: { en: Left anteroventral thalamic nucleus, fr: Noyau antéroventral gauche du thalamus }
        role: { en: Thalamic target of the medial mammillary nucleus, fr: Cible thalamique du noyau mamillaire médial }
        explanation:
          en: In macaques, projections from the medial mammillary nucleus reach the anteroventral thalamic nucleus on the same side.
          fr: Chez le macaque, des projections du noyau mamillaire médial atteignent le noyau antéroventral du thalamus du même côté.
        mapping:
          en: NextBrain displays the anteroventral nucleus as a single volume. The anteromedial and anterodorsal labels appear on cut faces.
          fr: NextBrain représente le noyau antéroventral en un seul volume. Les étiquettes des noyaux antéromédial et antérodorsal apparaissent sur les faces de coupe.
        view: superior
        plane: coronal

  - id: motor
    name: { en: Basal ganglia motor loops, fr: Boucles motrices des ganglions de la base }
    summary:
      en: Follow cortical input and pallidal output on the left, then explore two relays of the indirect branch.
      fr: Suivez les afférences corticales et les efférences pallidales à gauche, puis explorez deux relais de la voie indirecte.
    route:
      en: Direct branch · left primary motor cortex → putamen → GPi → motor thalamus (VApc) → frontal motor areas. Indirect branch · left putamen → GPe → subthalamic nucleus → GPi.
      fr: Voie directe · cortex moteur primaire gauche → putamen → GPi → thalamus moteur (VApc) → aires motrices frontales. Voie indirecte · putamen gauche → GPe → noyau sous-thalamique → GPi.
    scope:
      en: The first four landmarks show cortical input, the direct striatopallidal projection and pallidal output to the thalamus. The final two landmarks show the pallidal and subthalamic relays of the indirect branch, which begins in the putamen. The tour omits nigral output, nigrostriatal dopamine input, the hyperdirect pathway and nonmotor loops.
      fr: Les quatre premiers repères montrent les afférences corticales, la projection striatopallidale directe et les efférences pallidales vers le thalamus. Les deux derniers repères montrent les relais pallidal et sous-thalamique de la voie indirecte, qui débute dans le putamen. Le parcours laisse de côté les efférences nigriques, les afférences dopaminergiques nigrostriées, la voie hyperdirecte et les boucles non motrices.
    clinical:
      en: In a post-mortem comparison, Fearnley and Lees studied 20 people with Parkinson’s disease. Pigmented neuron loss at a caudal level of the substantia nigra pars compacta was greatest in the lateral part of its ventral tier. Bhatia and Marsden reported parkinsonism in 6% of 240 published cases with lesions involving the caudate, putamen or globus pallidus, and in 19% of those with bilateral lentiform lesions. These percentages describe the published cases included in the review. Holm and colleagues prospectively followed 15 adults after an ischaemic stroke treated with reperfusion. All had a unilateral infarct involving the posterior putamen, and 14 also had caudate involvement. Parkinsonism was present in four patients at about three months and ten at about one year. At one year, nine of those ten had signs only on the side opposite the infarct. One had signs on both sides, more pronounced on the side opposite the infarct. The study enrolled a small group with infarcts confined to the striatum and NIH Stroke Scale scores below six at discharge. The effect of an infarct confined to the putamen remains uncertain.
      fr: Dans une comparaison neuropathologique post mortem, Fearnley et Lees ont étudié 20 personnes atteintes de la maladie de Parkinson. À un niveau caudal de la pars compacta de la substance noire, la perte de neurones pigmentés prédominait dans la partie latérale de l’étage ventral. Bhatia et Marsden ont relevé un syndrome parkinsonien dans 6 % des 240 cas publiés de lésions touchant le noyau caudé, le putamen ou le globus pallidus, et dans 19 % des cas avec des lésions lenticulaires bilatérales. Ces pourcentages portent sur les cas publiés inclus dans la revue. Dans une étude prospective, Holm et ses collègues ont suivi 15 adultes après un AVC ischémique traité par reperfusion. Tous présentaient un infarctus unilatéral touchant la partie postérieure du putamen, associé à une atteinte du noyau caudé dans 14 cas. Un syndrome parkinsonien était présent chez quatre patients à environ trois mois et chez dix à environ un an. À un an, neuf de ces dix patients présentaient des signes uniquement du côté opposé à l’infarctus. Chez le dixième, les signes étaient bilatéraux, avec une prédominance du côté opposé à l’infarctus. L’étude a retenu un petit groupe de patients dont l’infarctus était limité au striatum et dont le score NIHSS à la sortie de l’hôpital était inférieur à six. L’effet d’un infarctus limité au putamen reste indéterminé.
    deficit: parkinsonism
    references: [basal-ganglia, motor-learning, striatal-input, motor-corticostriatal, motor-striatopallidal, motor-pallidosubthalamic, motor-pallidothalamic, motor-thalamocortical, cerebellothalamic-course, cortical-parcellation, clinical-fearnley-1991, clinical-bhatia-1994, clinical-holm-2025]
    clinical_references: [clinical-fearnley-1991, clinical-bhatia-1994, clinical-holm-2025]
    # The landmarks on a grid and the sign of each projection between them, as each landmark's
    # explanation states it. Connected landmarks sit in neighbouring cells.
    diagram:
      nodes:
        - { step: cortex, column: 1, row: 1, label: { en: Motor cortex, fr: Cortex moteur } }
        - { step: putamen, column: 1, row: 2, label: { en: Putamen, fr: Putamen } }
        - { step: gpi, column: 1, row: 3, label: { en: GPi, fr: GPi } }
        - { step: thalamus, column: 1, row: 4, label: { en: Thalamus, fr: Thalamus } }
        - { step: gpe, column: 2, row: 2, label: { en: GPe, fr: GPe } }
        - { step: stn, column: 2, row: 3, label: { en: Subthalamic nucleus, fr: Noyau sous-thalamique } }
      edges:
        - { from: cortex, to: putamen, sign: excitatory }
        - { from: putamen, to: gpi, sign: inhibitory }
        - { from: gpi, to: thalamus, sign: inhibitory }
        - { from: putamen, to: gpe, sign: inhibitory }
        - { from: gpe, to: stn, sign: inhibitory }
        - { from: stn, to: gpi, sign: excitatory }
    steps:
      - id: cortex
        region: hcp-mmp:left:8
        source_name: L_4_ROI
        name: { en: Left primary motor cortex · area 4, fr: Cortex moteur primaire gauche · aire 4 }
        role: { en: Cortical input to the putamen, fr: Afférences corticales vers le putamen }
        explanation:
          en: In macaques, retrograde tracing identifies a projection from primary motor cortex to the dorsolateral postcommissural putamen. Cortical inputs to the striatum are excitatory.
          fr: Chez le macaque, le traçage rétrograde met en évidence une projection du cortex moteur primaire vers la partie dorsolatérale du putamen postcommissural. Les afférences corticales vers le striatum sont excitatrices.
        mapping:
          en: This group-based HCP-MMP parcel estimates the location of area 4 on this cortical surface.
          fr: Cette parcelle HCP-MMP, établie à partir de données de groupe, estime la localisation de l’aire 4 sur cette surface corticale.
        view: left
        plane: coronal
      - id: putamen
        region: nextbrain:left:79
        source_name: putamen
        name: { en: Left putamen, fr: Putamen gauche }
        role: { en: Striatal relay of cortical input, fr: Relais striatal des afférences corticales }
        explanation:
          en: In the classical circuit, putaminal projections reach GPi in the direct branch and GPe in the indirect branch. Single-axon tracing in squirrel monkeys found putaminal axons with branches in both pallidal segments.
          fr: Dans le schéma classique, les projections du putamen atteignent le GPi par la voie directe et le GPe par la voie indirecte. Chez le singe écureuil, le traçage d’axones individuels a montré que certains axones du putamen se ramifient dans les deux segments du globus pallidus.
        mapping:
          en: The main NextBrain putamen parcel serves as an anatomical landmark for the dorsolateral postcommissural motor territory. The parcel extends beyond that territory. NextBrain labels the posteroventral portion separately.
          fr: La parcelle principale du putamen de NextBrain sert de repère anatomique pour le territoire moteur dorsolatéral postcommissural. Elle s’étend au-delà de ce territoire. NextBrain délimite séparément la portion postéroventrale.
        view: anterior
        plane: coronal
      - id: gpi
        region: nextbrain:left:206
        source_name: internal_segment_of_globus_pallidus
        name: { en: Left internal globus pallidus · GPi, fr: Segment interne du globus pallidus gauche · GPi }
        role: { en: Inhibitory output to the thalamus, fr: Efférences inhibitrices vers le thalamus }
        explanation:
          en: GPi neurons receive inhibitory input from the striatum in the direct branch and send inhibitory projections to the thalamus. Human post-mortem histology traces pallidothalamic fibres from the internal pallidum into the thalamus.
          fr: Dans la voie directe, les neurones du GPi reçoivent des afférences inhibitrices du striatum et envoient des projections inhibitrices vers le thalamus. L’histologie humaine post mortem montre le trajet des fibres pallidothalamiques du globus pallidus interne jusqu’au thalamus.
        mapping:
          en: NextBrain displays the entire internal segment. The motor territory occupies part of this volume.
          fr: NextBrain représente le segment interne dans son ensemble. Le territoire moteur occupe une partie de ce volume.
        view: anterior
        plane: coronal
      - id: thalamus
        region: nextbrain:left:222
        source_name: parvocellular_division_of_va
        name: { en: Parvocellular division of the left ventral anterior thalamic nucleus · VApc, fr: Portion parvocellulaire du noyau ventral antérieur du thalamus gauche · VApc }
        role: { en: Relay toward frontal motor areas, fr: Relais vers les aires motrices frontales }
        explanation:
          en: In macaques, anterograde tracing from the ventrolateral GPi labels terminals in the parvocellular ventral anterior nucleus (VApc). Tracing from caudal VApc shows projections to the supplementary motor area and lateral premotor cortex.
          fr: Chez le macaque, le traçage antérograde depuis la partie ventrolatérale du GPi révèle des terminaisons dans la portion parvocellulaire du noyau ventral antérieur (VApc). Le traçage depuis la partie caudale du VApc montre des projections vers l’aire motrice supplémentaire et le cortex prémoteur latéral.
        mapping:
          en: The NextBrain parcel outlines VApc, one of several pallidal-recipient territories of the motor thalamus.
          fr: Cette parcelle de NextBrain délimite le VApc, l’un des territoires du thalamus moteur qui reçoivent des afférences pallidales.
        view: anterior
        plane: coronal
      - id: gpe
        region: nextbrain:left:119
        source_name: external_segment_of_globus_pallidus
        name: { en: Left external globus pallidus · GPe, fr: Segment externe du globus pallidus gauche · GPe }
        role: { en: Pallidal relay of the indirect branch, fr: Relais pallidal de la voie indirecte }
        explanation:
          en: The indirect branch runs from the putamen to GPe, where striatal afferents inhibit GPe neurons. In squirrel monkeys, tracing and GABA immunolabelling identify GABAergic terminals from GPe in the subthalamic nucleus.
          fr: Dans la voie indirecte, les afférences du putamen inhibent les neurones du GPe. Chez le saïmiri, le traçage axonal et l’immunomarquage du GABA révèlent des terminaisons GABAergiques du GPe dans le noyau sous-thalamique.
        mapping:
          en: NextBrain displays the entire external segment. The projecting motor territory occupies part of this volume.
          fr: NextBrain représente le segment externe dans son ensemble. Le territoire moteur d’où partent ces projections occupe une partie de ce volume.
        view: anterior
        plane: coronal
      - id: stn
        region: nextbrain:left:316
        source_name: laterodorsal_portion_of_sth
        name: { en: Dorsolateral portion of the left subthalamic nucleus, fr: Portion dorsolatérale du noyau sous-thalamique gauche }
        role: { en: Excitatory projection to GPi, fr: Projection excitatrice vers le GPi }
        explanation:
          en: In squirrel monkeys, retrograde tracing from the sensorimotor GPi labels neurons chiefly in the dorsolateral subthalamic nucleus. Subthalamic projections to GPi are excitatory.
          fr: Chez le saïmiri, le traçage rétrograde depuis le territoire sensorimoteur du GPi marque des neurones surtout dans la portion dorsolatérale du noyau sous-thalamique. Les projections du noyau sous-thalamique vers le GPi sont excitatrices.
        mapping:
          en: The NextBrain parcel is an anatomical landmark for the dorsolateral subthalamic region identified by tracing in squirrel monkeys.
          fr: La parcelle de NextBrain sert de repère anatomique pour la région sous-thalamique dorsolatérale mise en évidence par traçage chez le saïmiri.
        view: anterior
        plane: axial

  - id: cerebellar
    name: { en: Cerebellar output and crossing, fr: Sortie cérébelleuse et croisement }
    summary:
      en: Follow a crossed output branch from the left cerebellum to the right thalamus and primary motor cortex.
      fr: Suivez une voie efférente croisée du cervelet gauche au thalamus et au cortex moteur primaire droits.
    route:
      en: Left cerebellar cortex → left dentate nucleus → left superior cerebellar peduncle → midbrain crossing, then right red nucleus waypoint → right motor thalamus → right primary motor cortex.
      fr: Cortex cérébelleux gauche → noyau dentelé gauche → pédoncule cérébelleux supérieur gauche → décussation mésencéphalique puis passage au niveau du noyau rouge droit → thalamus moteur droit → cortex moteur primaire droit.
    scope:
      en: Purkinje cells provide inhibitory input to the left dentate nucleus. The dentate fibres shown here cross in the caudal midbrain and relay in the right motor thalamus. Human fibre dissection and histology establish the macroscopic course. In tufted capuchins, retrograde transneuronal tracing supports the sequence of relays to the arm representation of primary motor cortex. The tour omits mossy and climbing inputs, other cerebellar outputs and the return pathway.
      fr: Les cellules de Purkinje fournissent des afférences inhibitrices au noyau dentelé gauche. Les fibres dentelées suivies ici croisent dans le mésencéphale caudal et font relais dans le thalamus moteur droit. La dissection des fibres et l’histologie humaines établissent le trajet macroscopique. Chez le capucin brun, le traçage transneuronal rétrograde étaye la succession des relais jusqu’à la représentation du bras dans le cortex moteur primaire. Le parcours laisse de côté les afférences moussues et grimpantes, les autres efférences cérébelleuses et la voie de retour.
    clinical:
      en: The link with limb ataxia is direct at the level of the superior cerebellar peduncle, based on individual cases. A woman with an isolated unilateral peduncular infarct had severe limb ataxia on the side of the lesion. In another adult, MRI showed focal lesions in both peduncles. He had truncal ataxia and limb ataxia, which was worse on the left. The authors suspected infarction. The cases leave the contribution of individual fibre populations unresolved. In 90 patients with focal cerebellar lesions, Schoch and colleagues analysed ischaemic lesions (43 patients) separately from surgical lesions (47 patients), with acute and chronic subgroups in both groups. The surgical group included 38 patients who had undergone tumour resection in childhood or adolescence. Limb ataxia was associated with lesions of the interposed nuclei and part of the dentate nucleus. The most statistically significant lesion–symptom associations occurred in the acute ischaemic subgroup. The chronic subgroups showed similar associations involving the deep nuclei and fewer cortical associations. In a 70-year-old man, Alalousi and Bonnan observed mild left lower-limb ataxia on heel-to-shin testing and a tendency to fall to the right when walking. MRI showed a small left anterior paravermal infarct just behind and above the superior cerebellar peduncle. The fibre pathways affected by the infarct remain uncertain. The connections followed in this tour come from anatomical studies.
      fr: Le lien avec l’ataxie des membres est direct à l’échelle du pédoncule cérébelleux supérieur et repose sur des observations individuelles. Une femme présentant un infarctus pédonculaire unilatéral isolé avait une ataxie sévère des membres du côté de la lésion. Chez un autre adulte, l’IRM a montré des lésions circonscrites des deux pédoncules. Il présentait une ataxie du tronc et des membres, plus marquée aux membres gauches. Les auteurs ont évoqué une origine ischémique. La contribution propre des différents contingents de fibres reste indéterminée. Chez 90 patients présentant une lésion cérébelleuse focale, Schoch et ses collègues ont analysé séparément les lésions ischémiques (43 patients) et les lésions chirurgicales (47 patients), avec des sous-groupes aigus et chroniques dans les deux cas. Le groupe chirurgical comprenait 38 patients opérés d’une tumeur dans l’enfance ou l’adolescence. L’ataxie des membres était associée à des lésions des noyaux interposés et d’une partie du noyau dentelé. Les associations entre lésions et symptômes étaient les plus significatives sur le plan statistique dans le sous-groupe ischémique aigu. Dans les sous-groupes chroniques, les associations avec les lésions des noyaux profonds étaient similaires et les associations avec les lésions corticales étaient moins nombreuses. Chez un homme de 70 ans, Alalousi et Bonnan ont observé une légère ataxie du membre inférieur gauche à l’épreuve talon-genou et une tendance à chuter vers la droite à la marche. L’IRM a montré un petit infarctus de la région paravermienne antérieure gauche, juste en arrière et au-dessus du pédoncule cérébelleux supérieur. Les faisceaux atteints restent indéterminés. Les connexions suivies dans ce parcours sont décrites dans les études anatomiques.
    deficit: ataxia
    references: [cerebellar-organization, cerebellar-local-circuits, cerebellar-projections, cerebellar-peduncles, cerebellothalamic-course, cerebellar-motor-loops, cortical-parcellation, clinical-schoch-2006, clinical-alalousi-rostral-infarct-2024, clinical-lee-superior-peduncle-2015, clinical-kong-superior-peduncles-2023]
    clinical_references: [clinical-schoch-2006, clinical-alalousi-rostral-infarct-2024, clinical-lee-superior-peduncle-2015, clinical-kong-superior-peduncles-2023]
    steps:
      - id: cortex
        region: learning:cerebellar-cortex-left
        source_name: Cerebellar cortex
        name: { en: Left cerebellar cortex, fr: Cortex cérébelleux gauche }
        role: { en: Inhibitory cortical output, fr: Efférences corticales inhibitrices }
        explanation:
          en: Purkinje cells send inhibitory output to the deep cerebellar nuclei. The lateral cerebellar hemisphere provides Purkinje-cell input to the dentate nucleus on the same side.
          fr: Les cellules de Purkinje envoient des projections inhibitrices vers les noyaux profonds du cervelet. Les cellules de Purkinje de la partie latérale de l’hémisphère cérébelleux projettent vers le noyau dentelé du même côté.
        mapping:
          en: The volume shows the whole left cerebellar cortex. The lateral territory projecting to the dentate occupies part of this volume.
          fr: Le volume représente l’ensemble du cortex cérébelleux gauche. Le territoire latéral qui projette vers le noyau dentelé n’en occupe qu’une partie.
        view: posterior
        plane: coronal
        # Where the brain publishes cerebellar lobules, the whole cortex is no single landmark.
        alternatives:
          - region: learning:lobule-v-left
            source_name: Lobule V
            name: { en: Left lobule V, fr: Lobule V gauche }
            explanation:
              en: Purkinje cells in the lateral cerebellar hemisphere provide inhibitory input to the ipsilateral dentate nucleus. In tufted capuchins, tracing linked Purkinje cells chiefly in lobules IV–VI to the arm area of contralateral primary motor cortex through cerebellar nuclear and thalamic relays.
              fr: Les cellules de Purkinje de la partie latérale de l’hémisphère cérébelleux exercent une action inhibitrice sur le noyau dentelé du même côté. Chez le capucin brun, le traçage a relié les cellules de Purkinje situées principalement dans les lobules IV à VI à l’aire du bras du cortex moteur primaire controlatéral, par des relais dans les noyaux cérébelleux et le thalamus.
            mapping:
              en: The CerebNet label includes the hemispheric part of lobule V and the corresponding part of the anterior vermis. It spans a larger territory than the patches of Purkinje cells identified within lobule V by tracing.
              fr: L’étiquette CerebNet comprend la portion hémisphérique du lobule V et la partie correspondante du vermis antérieur. Elle couvre un territoire plus étendu que les groupes de cellules de Purkinje repérés par traçage dans ce lobule.
      - id: dentate
        region: learning:left:dentate
        source_name: Cerebellar dentate nucleus
        covering_regions: [learning:cerebellar-cortex-left]
        name: { en: Left cerebellar dentate nucleus, fr: Noyau dentelé cérébelleux gauche }
        role: { en: Deep cerebellar output, fr: Efférences d’un noyau profond du cervelet }
        explanation:
          en: The model hides the overlying cerebellar cortex to expose this nucleus. Dentate axons ascend in the superior cerebellar peduncle. The branch followed here crosses towards the opposite thalamus.
          fr: Le modèle masque le cortex cérébelleux qui recouvre ce noyau. Les axones du noyau dentelé montent dans le pédoncule cérébelleux supérieur. La branche suivie ici croise la ligne médiane en direction du thalamus controlatéral.
        mapping:
          en: The volume shows the whole dentate, including territories beyond the motor output branch. Returning to the cerebellar cortex landmark restores the overlying label. Linked MRI retains the complete tissue volume.
          fr: Le volume représente le noyau dentelé entier, au-delà du territoire de la branche motrice. Revenir au repère cortical réaffiche la structure qui le recouvre. L’IRM liée conserve le volume tissulaire complet.
        view: posterior
        plane: coronal
        alternatives:
          - covering_regions:
              - learning:lobules-i-iv-left
              - learning:lobule-v-left
              - learning:lobule-vi-left
              - learning:crus-i-left
              - learning:crus-ii-left
              - learning:lobule-viib-left
              - learning:lobule-viiia-left
              - learning:lobule-viiib-left
              - learning:lobule-ix-left
              - learning:lobule-x-left
            explanation:
              en: The model hides the left lobular labels to expose this nucleus. Dentate axons ascend in the superior cerebellar peduncle. The branch followed here crosses towards the opposite thalamus.
              fr: Le modèle masque les étiquettes des lobules gauches pour dégager ce noyau. Les axones du noyau dentelé montent dans le pédoncule cérébelleux supérieur. La branche suivie ici croise la ligne médiane en direction du thalamus controlatéral.
            mapping:
              en: The volume shows the whole dentate, including territories beyond the motor output branch. Returning to lobule V restores the hidden labels, including the anterior vermis grouped with the left lobules I–IV and V. Linked MRI retains the complete tissue volume.
              fr: Le volume représente le noyau dentelé entier, au-delà du territoire de la branche motrice. Revenir au lobule V réaffiche les étiquettes masquées, dont la portion du vermis antérieur comprise dans les lobules gauches I à IV et V. L’IRM liée conserve le volume tissulaire complet.
      - id: superior-peduncle
        region: learning:left:superior-cerebellar-peduncle
        source_name: Superior cerebellar peduncle
        name: { en: Left superior cerebellar peduncle, fr: Pédoncule cérébelleux supérieur gauche }
        role: { en: Ascent before the crossing, fr: Trajet ascendant avant la décussation }
        explanation:
          en: This peduncle carries much of the cerebellar output towards the midbrain. The branch crosses in the caudal midbrain, and the next landmark is on the right.
          fr: Ce pédoncule conduit une grande partie des efférences cérébelleuses vers le mésencéphale. La branche croise dans le mésencéphale caudal et le repère suivant se situe à droite.
        mapping:
          en: The segmented volume outlines the left peduncle, which carries several groups of fibres. It serves as a landmark before the decussation.
          fr: Le volume segmenté délimite le pédoncule gauche, qui contient plusieurs groupes de fibres. Il sert de repère en amont de la décussation.
        view: posterior
        plane: coronal
      - id: red-nucleus
        region: learning:right:red-nucleus
        source_name: Red nucleus
        covering_regions: [learning:right:midbrain, learning:right:vta]
        name: { en: Right red nucleus, fr: Noyau rouge droit }
        role: { en: Right-sided waypoint after the crossing, fr: Repère droit après la décussation }
        explanation:
          en: In human postmortem material, the crossed cerebellothalamic fibres pass through and in front of the red nucleus. In the branch shown here, the next synaptic relay is in the right motor thalamus.
          fr: Sur les coupes humaines post mortem, les fibres cérébellothalamiques croisées passent par le noyau rouge et en avant de celui-ci. Dans la branche suivie ici, le relais synaptique suivant se situe dans le thalamus moteur droit.
        mapping:
          en: The red nucleus marks the fibre course described in human post-mortem sections. The model hides the surrounding midbrain territory and ventral tegmental area here and restores them at other landmarks.
          fr: Le noyau rouge sert de repère sur le trajet des fibres décrit en histologie humaine post mortem. Le modèle masque ici le territoire mésencéphalique environnant et l’aire tegmentale ventrale, puis les réaffiche aux autres repères.
        view: left
        plane: axial
      - id: thalamus
        region: learning:right:thalamus
        source_name: Thalamus
        name: { en: Right thalamus, fr: Thalamus droit }
        role: { en: Contralateral motor relay territory, fr: Territoire de relais moteur controlatéral }
        explanation:
          en: Human myelin-stained sections show cerebellothalamic fibres entering the ventral division of the posterior ventrolateral nucleus, called VLpv in Morel’s atlas. In tufted capuchins, retrograde tracing from the arm representation of primary motor cortex labelled neurons in ventrolateral thalamic nuclei. The exact human relay cells remain unresolved.
          fr: Sur les coupes humaines avec coloration de la myéline, les fibres cérébellothalamiques gagnent la subdivision ventrale du noyau ventrolatéral postérieur, appelée VLpv dans l’atlas de Morel. Chez le capucin brun, le traçage rétrograde depuis la représentation du bras dans le cortex moteur primaire a marqué des neurones des noyaux thalamiques ventrolatéraux. Les neurones qui assurent ce relais chez l’humain restent indéterminés.
        mapping:
          en: The teaching volume groups right thalamic regions across and beyond the posterior ventrolateral relay territory.
          fr: Le volume pédagogique regroupe des régions du thalamus droit et s’étend au-delà du territoire de relais ventrolatéral postérieur.
        view: anterior
        plane: coronal
      - id: motor-cortex
        region: hcp-mmp:right:8
        source_name: R_4_ROI
        name: { en: Right primary motor area 4, fr: Aire motrice primaire 4 droite }
        role: { en: Cortical target of the crossed branch, fr: Cible corticale de la branche croisée }
        explanation:
          en: In capuchins, tracing linked the arm area of primary motor cortex across several synapses to the opposite dentate nucleus and cerebellar cortex. Right area 4 marks the cortical end of the branch on this atlas.
          fr: Chez le capucin, le traçage a mis en évidence une connexion, à travers plusieurs synapses, entre l’aire du bras du cortex moteur primaire, le noyau dentelé et le cortex cérébelleux controlatéraux. L’aire 4 droite repère la cible corticale de cette branche dans l’atlas.
        mapping:
          en: The HCP-MMP parcel outlines area 4 on this brain’s cortical surface. The arm representation occupies part of that area.
          fr: La parcelle HCP-MMP délimite l’aire 4 sur la surface corticale de ce cerveau. La représentation du bras en occupe une partie.
        view: right
        plane: axial

  - id: corticospinal
    name: { en: Corticospinal descent and crossing, fr: Descente corticospinale et croisement }
    summary:
      en: Follow the main crossed branch from the left primary motor cortex through the brainstem to the right side of the cervical cord.
      fr: Suivez la principale branche croisée du cortex moteur primaire gauche jusqu’au côté droit de la moelle cervicale, en passant par le tronc cérébral.
    route:
      en: Left primary motor cortex → left midbrain → pyramidal decussation in the caudal medulla → right lateral corticospinal tract
      fr: Cortex moteur primaire gauche → mésencéphale gauche → décussation pyramidale dans le bulbe caudal → faisceau corticospinal latéral droit
    scope:
      en: The internal capsule and pons lie along the route between stops. On CDMD, the diffusion overlay at the first three stops shows this subject’s estimated left corticospinal streamlines down to the caudal medulla. The tour omits other cortical origins, the other corticospinal branches and the spinal terminations.
      fr: La capsule interne et le pont se trouvent sur le trajet entre les repères. Sur CDMD, la tractographie montre aux trois premiers repères les trajectoires estimées du faisceau corticospinal gauche de ce sujet jusqu’au bulbe caudal. Le parcours laisse de côté les autres origines corticales, les autres branches corticospinales et les terminaisons spinales.
    clinical:
      en: The link with hemiparesis is direct at the level of the corticospinal tract. In 41 adults aged 38–77 years with upper-limb paresis and elbow-flexor spasticity in the subacute phase of a first stroke involving the middle cerebral artery territory, lower upper-limb Fugl–Meyer scores were associated with lesions along the corticospinal tract in the superior corona radiata and posterior limb of the internal capsule, and with lesions in other regions including the insula and putamen. The Fugl–Meyer associations survived correction for multiple comparisons. The separate map of biceps spasticity was exploratory. In a separate cohort of 272 adults assessed six months after stroke, a multivariate lesion analysis associated left-sided limb weakness, classified from a combined arm-and-leg NIHSS score, with injury involving the right corticospinal tract, internal capsule and corticopontocerebellar bundle. Corticospinal and capsular lesion involvement were strongly correlated. The lesion studies leave the individual contribution of fibres from area 4 unresolved. In a case report, a 64-year-old man had right arm and leg weakness and later developed a right extensor plantar response. MRI showed a right lateral medullary infarct extending from the rostral medulla into the upper cervical cord, alongside a right cerebellar infarct. The authors attributed the weakness to corticospinal injury in the upper cervical cord, below the decussation. The infarct spanned several levels, leaving the precise site responsible for the weakness uncertain.
      fr: Le lien avec l’hémiparésie est direct à l’échelle du faisceau corticospinal. Chez 41 adultes de 38 à 77 ans présentant une parésie du membre supérieur et une spasticité des fléchisseurs du coude en phase subaiguë après un premier AVC touchant le territoire de l’artère cérébrale moyenne, des scores plus faibles à l’évaluation de Fugl–Meyer du membre supérieur étaient associés à des lésions sur le trajet du faisceau corticospinal dans la couronne rayonnante supérieure et le bras postérieur de la capsule interne, ainsi qu’à des lésions d’autres régions, dont l’insula et le putamen. Les associations avec les scores de Fugl–Meyer restaient significatives après correction pour comparaisons multiples. La carte distincte de la spasticité du biceps brachial avait une valeur exploratoire. Dans une autre cohorte de 272 adultes évalués six mois après un AVC, une analyse lésionnelle multivariée associait une faiblesse des membres gauches définie à partir d’un score NIHSS combinant les items moteurs du bras et de la jambe à des lésions touchant le faisceau corticospinal, la capsule interne et le faisceau corticopontocérébelleux dans l’hémisphère droit. Les atteintes corticospinale et capsulaire étaient fortement corrélées. La contribution propre des fibres issues de l’aire 4 reste indéterminée dans ces études lésionnelles. Dans une observation clinique, un homme de 64 ans présentait une faiblesse du bras et de la jambe à droite. Un signe de Babinski droit est apparu par la suite. L’IRM montrait un infarctus latérobulbaire droit s’étendant de l’étage rostral du bulbe à la moelle cervicale haute, ainsi qu’un infarctus du cervelet droit. Les auteurs ont attribué la faiblesse à une atteinte du faisceau corticospinal dans la moelle cervicale haute, sous la décussation. L’étendue de l’infarctus laissait indéterminé le siège précis de l’atteinte responsable de la faiblesse.
    deficit: hemiparesis
    references: [corticospinal-anatomy, corticospinal-brainstem, corticospinal-primary-motor, corticospinal-decussation, motor-weakness, cortical-parcellation, clinical-kim-opalski-2006, clinical-toba-2025]
    clinical_references: [motor-weakness, clinical-kim-opalski-2006, clinical-toba-2025]
    steps:
      - id: motor-cortex
        region: hcp-mmp:left:8
        source_name: L_4_ROI
        tract: cst-left
        name: { en: Left primary motor cortex, fr: Cortex moteur primaire gauche }
        role: { en: One cortical source, fr: Une source corticale }
        explanation:
          en: Area 4 is the primary motor cortex and contributes fibres to the corticospinal tract. Human diffusion studies also estimate contributions from premotor and primary somatosensory cortex.
          fr: L’aire 4 correspond au cortex moteur primaire et donne naissance à des fibres corticospinales. Les études humaines en IRM de diffusion suggèrent aussi des contributions des cortex prémoteur et somatosensoriel primaire.
        mapping:
          en: HCP-MMP delineates area 4 on this cortical surface.
          fr: La parcelle HCP-MMP délimite l’aire 4 sur cette surface corticale.
        view: left
        plane: axial
      - id: midbrain
        region: learning:left:midbrain
        source_name: Midbrain territory
        tract: cst-left
        name: { en: Left midbrain, fr: Mésencéphale gauche }
        role: { en: Passage through the left cerebral peduncle, fr: Passage par le pédoncule cérébral gauche }
        explanation:
          en: In humans, these fibres descend through the left cerebral peduncle at the base of the midbrain, pass through the pontine base and gather in the left medullary pyramid.
          fr: Chez l’humain, ces fibres descendent dans le pédoncule cérébral gauche à la base du mésencéphale, traversent la base du pont et se rassemblent dans la pyramide bulbaire gauche.
        mapping:
          en: This teaching volume combines NextBrain’s broad left midbrain label with the periaqueductal grey, pretectal region, peripeduncular nucleus and dorsal raphe. It is far broader than the cerebral peduncle.
          fr: Ce volume pédagogique réunit l’étiquette générale du mésencéphale gauche de NextBrain avec la substance grise périaqueducale, la région prétectale, le noyau péripédonculaire et le raphé dorsal. Il couvre un territoire bien plus étendu que le pédoncule cérébral.
        view: anterior
        plane: axial
      - id: crossing
        region: learning:caudal-medulla
        source_name: Caudal medulla
        tract: cst-left
        name: { en: Caudal medulla, fr: Bulbe caudal }
        role: { en: Pyramidal decussation level, fr: Niveau de la décussation pyramidale }
        explanation:
          en: Most fibres in the medullary pyramids cross the midline in the caudal medulla. Fibres that cross from the left join the right lateral corticospinal tract.
          fr: La plupart des fibres des pyramides bulbaires franchissent la ligne médiane dans le bulbe caudal. Les fibres qui croisent depuis le côté gauche rejoignent le faisceau corticospinal latéral droit.
        mapping:
          en: This midline teaching label uses the portion of FreeSurfer’s brainstem label below NextBrain’s medullary coverage. Published human anatomy identifies the decussation and its continuation into the right lateral corticospinal tract.
          fr: Ce repère pédagogique médian correspond à la partie de la segmentation du tronc cérébral de FreeSurfer située sous la portion du bulbe couverte par NextBrain. Les études anatomiques humaines situent la décussation et décrivent le trajet qui se poursuit dans le faisceau corticospinal latéral droit.
        view: anterior
        plane: axial
      - id: spinal-tract
        region: pam50:right:lateral-corticospinal-tract
        source_name: right lateral corticospinal tract
        name: { en: Right lateral corticospinal tract, fr: Faisceau corticospinal latéral droit }
        role: { en: Spinal descent after crossing, fr: Descente spinale après croisement }
        explanation:
          en: After crossing, fibres from the left cortex descend in the right lateral funiculus of the spinal cord.
          fr: Après leur décussation, les fibres issues du cortex gauche descendent dans le cordon latéral droit de la moelle épinière.
        mapping:
          en: The registered PAM50 atlas locates the right lateral corticospinal tract in the displayed cord, from vertebral level C1 through part of C5.
          fr: L’atlas PAM50 recalé sur la moelle situe le faisceau corticospinal latéral droit dans la portion affichée de la moelle, du niveau vertébral C1 jusqu’à une partie de C5.
        view: anterior
        plane: axial

  - id: touch
    name: { en: Dorsal column–medial lemniscus pathway, fr: Voie des colonnes dorsales et du lemnisque médial }
    summary:
      en: Follow touch signals from the right side of the body, carried by the dorsal columns and the medial lemniscus, along one branch through the left thalamus and cortex.
      fr: Du thalamus au cortex de l’hémisphère gauche, suivez une branche qui transmet les signaux tactiles du côté droit du corps, acheminés par les colonnes dorsales et le lemnisque médial.
    route:
      en: Left ventral posterolateral thalamic nucleus → area 3b → parietal opercular area OP1 → area OP4
      fr: Noyau ventral postérolatéral gauche → aire 3b → aire OP1 de l’opercule pariétal → aire OP4
    scope:
      en: The tour starts in the left thalamus. Before reaching it, right-sided dorsal-column fibres relay in the gracile and cuneate nuclei in the lower medulla. The relay axons cross as internal arcuate fibres and ascend in the left medial lemniscus. The arrows follow projections traced in macaques. OP1 and OP4 are the proposed human homologues of macaque S2 and PV, respectively. The tour omits the spinal and brainstem segments, facial pathways, parallel thalamic inputs and cortical return projections.
      fr: Le parcours commence dans le thalamus gauche. En amont, les fibres des colonnes dorsales droites font relais dans les noyaux gracile et cunéiforme du bulbe caudal. Les axones de ces relais croisent la ligne médiane sous forme de fibres arquées internes et remontent dans le lemnisque médial gauche. Les flèches suivent des projections mises en évidence par traçage chez le macaque. OP1 et OP4 sont les homologues humains proposés de S2 et de PV, respectivement. Le parcours laisse de côté le trajet dans la moelle spinale et le tronc cérébral, les voies sensitives de la face, les afférences thalamiques parallèles et les projections corticales de retour.
    clinical:
      en: The link to reduced touch sensation is partial. Taskin and colleagues found reduced light-touch sensitivity in the opposite hand or forearm of six adults selected for sensory symptoms after stroke. All six had marked VPL involvement, and one also had minor involvement of VPM and VPI. Functional MRI still detected responses in contralateral secondary somatosensory cortex when the affected index finger was stimulated. In 101 adults studied after a first ischaemic stroke, corrected lesion analyses associated poorer acute somatosensory scores with lesions involving primary and secondary somatosensory cortex and dorsal insula. The study represented left-sided lesions on the right for pooled analysis. In 38 patients assessed in the first week after a first stroke, Meyer and colleagues associated arm and hand sensory deficits with lesions in central parietal white matter and in the parietal operculum near the insula. In the overlay of the four sensory tests, the opercular peak lay near the border of cytoarchitectonic areas OP2 and OP3. The authors pooled lesions from both hemispheres. Too few lesions involved the thalamus or primary somatosensory cortex to assess either region. A selected series of adults with cortical stroke found predominantly impaired position sense and discrimination after postcentral injury, and predominantly impaired pain and temperature sensation after operculo-insular injury. The effects of injury limited to a single atlas region, including the caudal VPL, or to one of the projections remain unresolved.
      fr: Le lien avec l’hypoesthésie tactile est partiel. Chez six adultes sélectionnés pour des troubles sensitifs après un AVC, Taskin et ses collègues ont relevé une sensibilité réduite au toucher léger de la main ou de l’avant-bras du côté opposé à la lésion. Les six patients présentaient une atteinte marquée du VPL. Chez l’un d’eux, la lésion atteignait aussi le VPM et le VPI dans une moindre mesure. L’IRM fonctionnelle détectait encore des réponses dans le cortex somatosensoriel secondaire controlatéral à la stimulation de l’index atteint. Chez 101 adultes évalués après un premier AVC ischémique, les analyses lésionnelles corrigées associaient une moins bonne sensibilité somatique en phase aiguë à des lésions des cortex somatosensoriels primaire et secondaire et de l’insula dorsale. Les auteurs ont reporté les lésions gauches par symétrie à droite pour l’analyse regroupée. Chez 38 patients évalués dans la semaine suivant un premier AVC, Meyer et ses collègues ont associé les troubles sensitifs du bras et de la main à des lésions de la substance blanche pariétale centrale et de l’opercule pariétal près de l’insula. Dans la carte de superposition des quatre épreuves sensitives, le pic opérculaire se situait près de la limite entre les aires cytoarchitectoniques OP2 et OP3. Les auteurs ont regroupé les lésions des deux hémisphères. Trop peu de lésions atteignaient le thalamus ou le cortex somatosensoriel primaire pour évaluer ces régions. Dans une série sélectionnée d’adultes ayant subi un AVC cortical, les lésions postcentrales s’accompagnaient surtout de troubles du sens de position et de la discrimination sensitive. Après une lésion opérculo-insulaire, la perte prédominait pour les sensibilités douloureuse et thermique. Les effets d’une lésion limitée à une seule région de l’atlas, dont la division caudale du VPL, ou à une seule des projections restent à déterminer.
    deficit: somatosensory
    references: [dorsal-column-anatomy, touch-thalamocortical, touch-opercular-tracing, touch-opercular-homology, cortical-parcellation, clinical-meyer-2016, clinical-taskin-2006, clinical-kessner-2019-somatosensory, clinical-kim-2007-cortical-sensory]
    clinical_references: [clinical-meyer-2016, clinical-taskin-2006, clinical-kessner-2019-somatosensory, clinical-kim-2007-cortical-sensory]
    steps:
      - id: thalamus
        region: nextbrain:left:458
        source_name: caudal_division_of_ventral_posterior_lateral_nucleus
        name: { en: Caudal division of the left ventral posterolateral nucleus, fr: Division caudale du noyau ventral postérolatéral gauche }
        role: { en: Thalamic relay for body touch, fr: Relais thalamique de la sensibilité tactile du corps }
        explanation:
          en: The medial lemniscus carries tactile signals from the right side of the body to the left ventral posterolateral nucleus (VPL). Tracing in macaques shows projections from VPL to area 3b on the same side.
          fr: Le lemnisque médial transmet au noyau ventral postérolatéral gauche (VPL) des signaux tactiles provenant du côté droit du corps. Chez le macaque, le traçage montre des projections du VPL vers l’aire 3b du même côté.
        mapping:
          en: The NextBrain volume shows the caudal division of the human VPL. The macaque tracing identifies the source of the projection at the level of the VPL nucleus.
          fr: Le volume NextBrain représente la division caudale du VPL humain. Le traçage chez le macaque situe l’origine de la projection à l’échelle du noyau VPL.
        view: anterior
        plane: coronal
      - id: area3b
        region: hcp-mmp:left:9
        source_name: L_3b_ROI
        name: { en: Left somatosensory area 3b, fr: Aire somatosensorielle 3b gauche }
        role: { en: Primary cortical recipient of cutaneous input, fr: Cible corticale primaire des afférences cutanées }
        explanation:
          en: In macaques, tracing identifies projections from cutaneous representations in area 3b to S2 in the parietal operculum of the same hemisphere.
          fr: Chez le macaque, le traçage met en évidence des projections des territoires cutanés de l’aire 3b vers S2, dans l’opercule pariétal du même hémisphère.
        mapping:
          en: The HCP-MMP parcel shows atlas area 3b as one cortical region.
          fr: La parcelle HCP-MMP représente l’aire 3b de l’atlas en une seule région corticale.
        view: left
        plane: axial
      - id: op1
        region: hcp-mmp:left:101
        source_name: L_OP1_ROI
        name: { en: Left parietal opercular area OP1, fr: Aire OP1 de l’opercule pariétal gauche }
        role: { en: Opercular recipient of area 3b projections, fr: Cible opérculaire des projections de l’aire 3b }
        explanation:
          en: In macaques, S2 receives projections from area 3b and sends fibres to the neighbouring parietal ventral area, PV. Tracing also shows projections from PV back to S2.
          fr: Chez le macaque, S2 reçoit des projections de l’aire 3b et envoie des fibres vers l’aire pariétale ventrale voisine, appelée PV. Le traçage montre aussi des projections de PV vers S2.
        mapping:
          en: The HCP-MMP OP1 parcel marks the proposed human homologue of macaque S2 on the cortical surface.
          fr: La parcelle HCP-MMP OP1 situe sur la surface corticale l’homologue humain proposé de S2 chez le macaque.
        view: inferior
        plane: coronal
      - id: op4
        region: hcp-mmp:left:100
        source_name: L_OP4_ROI
        name: { en: Left parietal opercular area OP4, fr: Aire OP4 de l’opercule pariétal gauche }
        role: { en: Parietal ventral target of S2 projections, fr: Cible pariétale ventrale des projections de S2 }
        explanation:
          en: In macaques, PV forms a distinct somatosensory area in the operculum. Tracer injected into S2 labelled axon endings in PV, including in regions representing the upper limb.
          fr: Chez le macaque, PV forme une aire somatosensorielle distincte dans l’opercule. Un traceur injecté dans S2 a marqué des terminaisons axonales dans PV, notamment dans des régions qui représentent le membre supérieur.
        mapping:
          en: The HCP-MMP OP4 parcel marks the proposed human homologue of macaque PV on the cortical surface.
          fr: La parcelle HCP-MMP OP4 situe sur la surface corticale l’homologue humain proposé de PV chez le macaque.
        view: inferior
        plane: coronal
  - id: spinothalamic
    name: { en: Spinothalamic pathway, fr: Voie spinothalamique }
    summary:
      en: Follow pain- and temperature-related signals across the spinal cord to the right thalamus, then explore a possible continuation to the right parietal operculum.
      fr: Suivez des signaux liés à la douleur et à la température qui croisent dans la moelle et gagnent le thalamus droit, puis explorez un prolongement possible vers l’opercule pariétal droit.
    route:
      en: Left dorsal horn → right spinal lemniscus after the spinal crossing → right ventral posterior inferior thalamic nucleus → right parietal opercular area OP1 (proposed continuation)
      fr: Corne dorsale gauche → lemnisque spinal droit après la décussation spinale → noyau ventro-postéro-inférieur droit du thalamus → aire OP1 de l’opercule pariétal droit (prolongement proposé)
    scope:
      en: Human studies support the crossed anterolateral route in the cervical cord. Separate macaque studies support spinal input to the VPI and a projection from the VPI to S2. The tour joins those findings at the level of the nucleus. It remains unresolved whether the VPI neurons that receive spinal input also project to S2. Human OP1 is a proposed counterpart of macaque S2. The tour omits peripheral nerves, brainstem landmarks, facial pathways and other thalamic targets.
      fr: Des études chez l’humain étayent le trajet croisé dans la région antérolatérale de la moelle cervicale. Des études distinctes chez le macaque mettent en évidence des afférences issues de la moelle qui atteignent le VPI et une projection du VPI vers S2. Le parcours rapproche ces résultats à l’échelle du noyau. On ignore si les neurones du VPI qui reçoivent les afférences spinales se projettent aussi vers S2. OP1 est un homologue humain proposé de S2 chez le macaque. Le parcours laisse de côté les nerfs périphériques, les repères du tronc cérébral, les voies sensitives de la face et les autres cibles thalamiques.
    clinical:
      en: A single case provides partial evidence at the VPI stop. The infarct involved several nuclei, leaving the contribution of the VPI itself unresolved. In Kim and colleagues’ selected series of four adults with small posterior thalamic infarcts, three had central post-stroke pain and cold allodynia (pain provoked by normally innocuous cooling). Atlas-based MRI mapping located two of those patients’ thalamic lesions mainly in the posterior part of the ventral caudal nucleus (Vc). In one of these patients, the stroke also involved the medial occipital and posteromedial temporal lobes. After a left thalamic infarct, one adult developed right-sided central pain and allodynia. Atlas-based MRI placed the infarct mainly in the anterior two thirds of the VPL, with smaller extensions into VPM and VPI. Karoam and colleagues used published lesion images, including this case and material from Kim’s series, to refine a region of interest extending from the brainstem to the posterior insula and adjacent operculum. In each of two cohorts, lesions in patients with central post-stroke pain overlapped this region more than lesions in stroke comparison patients (72 with pain and 123 comparison patients in total). Pooled lesion mapping associated pain with injury in the ventrocaudal thalamus and nearby white matter. The clinical roles of individual thalamic nuclei and the projection to OP1 remain unresolved.
      fr: Un seul cas apporte un appui partiel au niveau du VPI. L’infarctus atteignait plusieurs noyaux, si bien que la contribution propre du VPI reste indéterminée. Kim et ses collègues ont étudié quatre adultes sélectionnés après un petit infarctus du thalamus postérieur. Trois présentaient une douleur centrale post-AVC et une allodynie au froid (douleur provoquée par un refroidissement normalement indolore). Après recalage des IRM sur un atlas, les lésions thalamiques de deux de ces patients se situaient principalement dans la partie postérieure du noyau ventrocaudal (Vc). Chez l’un de ces patients, l’AVC touchait aussi la partie médiale du lobe occipital et la partie postéromédiale du lobe temporal. Après un infarctus thalamique gauche, un adulte a développé une douleur centrale et une allodynie du côté droit. Le recalage de l’IRM sur un atlas situait la lésion principalement dans les deux tiers antérieurs du VPL, avec une atteinte plus limitée du VPM et du VPI. Karoam et ses collègues ont utilisé des images de lésions publiées, notamment celles de ce cas et de la série de Kim, pour affiner une région d’intérêt allant du tronc cérébral à l’insula postérieure et à l’opercule adjacent. Dans chacune des deux cohortes, les lésions des patients présentant une douleur centrale post-AVC chevauchaient davantage cette région que celles des témoins ayant subi un AVC (72 patients avec douleur et 123 témoins au total). La cartographie lésionnelle sur les deux cohortes réunies a associé la douleur à des lésions du thalamus ventrocaudal et de la substance blanche voisine. Le rôle clinique des différents noyaux thalamiques et de la projection vers OP1 reste à déterminer.
    deficit: central-pain
    references: [spinothalamic-anatomy, spinothalamic-crossing-human, spinothalamic-cervical-human, spinothalamic-vpi, spinothalamic-opercular, touch-opercular-homology, cortical-parcellation, clinical-karoam-2025, clinical-kim-2007-ventral-caudal, clinical-montes-2005]
    clinical_references: [clinical-karoam-2025, clinical-kim-2007-ventral-caudal, clinical-montes-2005]
    steps:
      - id: dorsal-horn
        region: pam50:left:dorsal-horn
        source_name: left dorsal horn
        name: { en: Left dorsal horn, fr: Corne dorsale gauche }
        role: { en: Spinal relay for incoming sensory signals, fr: Relais spinal des afférences sensitives }
        explanation:
          en: Sensory fibres carrying pain and temperature signals from the left side of the body enter the cord and contact neurons in the left dorsal horn. In macaques, a study of the lumbar dorsal horn located neurons projecting to the ventral posterior inferior nucleus in its superficial marginal zone.
          fr: Les fibres sensitives qui transmettent les signaux de douleur et de température du côté gauche du corps entrent dans la moelle et contactent des neurones de la corne dorsale gauche. Chez le macaque, une étude de la corne dorsale lombaire a localisé dans sa zone marginale superficielle des neurones qui se projettent vers le noyau ventro-postéro-inférieur.
        mapping:
          en: The registered PAM50 label outlines the whole dorsal horn at the displayed vertebral levels, from C1 through part of C5. The marginal zone forms a small part of this label.
          fr: L’étiquette recalée de PAM50 représente toute la corne dorsale aux niveaux vertébraux affichés, de C1 jusqu’à une partie de C5. La zone marginale n’en occupe qu’une petite partie.
        view: posterior
        plane: axial
      - id: spinal-lemniscus
        region: pam50:right:spinal-lemniscus
        source_name: right spinal lemniscus (spinothalamic and spinoreticular tracts)
        name: { en: Right spinal lemniscus, fr: Lemnisque spinal droit }
        role: { en: Spinal ascent after crossing, fr: Ascension spinale après la décussation }
        explanation:
          en: Axons from the left dorsal horn cross the midline within the spinal cord and ascend toward the thalamus in the right anterolateral white matter. In a small human study of the upper cervical cord, sites linked to leg sensations were farther back and more lateral than sites linked to hand sensations.
          fr: Des axones issus de la corne dorsale gauche franchissent la ligne médiane de la moelle, puis remontent vers le thalamus dans la substance blanche antérolatérale droite. Dans une petite étude de la moelle cervicale haute chez l’humain, les sites associés aux sensations de la jambe se situaient plus en arrière et plus latéralement que ceux associés aux sensations de la main.
        mapping:
          en: This registered PAM50 label estimates the combined location of the spinothalamic and spinoreticular tracts in the displayed cervical cord.
          fr: Cette étiquette PAM50 recalée estime la localisation conjointe des faisceaux spinothalamique et spinoréticulaire dans la portion cervicale affichée.
        view: anterior
        plane: axial
      - id: vpi
        region: nextbrain:right:10424
        source_name: ventral_posterior_inferior_nucleus
        name: { en: Right ventral posterior inferior thalamic nucleus, fr: Noyau ventro-postéro-inférieur droit du thalamus }
        role: { en: Spinothalamic target in macaques, fr: Cible spinothalamique chez le macaque }
        explanation:
          en: Electrophysiological mapping in macaques identified estimated termination zones of spinothalamic axons within the ventral posterior inferior nucleus, or VPI. This is one of several thalamic targets of the spinothalamic tract.
          fr: Chez le macaque, la cartographie électrophysiologique a situé des zones de terminaison estimées des axones spinothalamiques dans le noyau ventro-postéro-inférieur, ou VPI. Ce noyau est l’une des cibles thalamiques du faisceau spinothalamique.
        mapping:
          en: The NextBrain parcel estimates the extent of the whole VPI in this brain.
          fr: La parcelle NextBrain estime l’étendue du VPI entier dans ce cerveau.
        view: anterior
        plane: coronal
      - id: op1
        region: hcp-mmp:right:101
        source_name: R_OP1_ROI
        name: { en: Right parietal opercular area OP1, fr: Aire OP1 de l’opercule pariétal droit }
        role: { en: Proposed human counterpart of macaque S2, fr: Homologue humain proposé de S2 chez le macaque }
        explanation:
          en: Tracing in macaques shows that the VPI sends fibres to the second somatosensory area, S2, in the parietal operculum of the same hemisphere.
          fr: Chez le macaque, le traçage montre que le VPI envoie des fibres vers l’aire somatosensorielle secondaire, S2, dans l’opercule pariétal du même hémisphère.
        mapping:
          en: The HCP-MMP OP1 parcel marks the proposed human homologue of macaque S2 on the cortical surface.
          fr: La parcelle HCP-MMP OP1 situe sur la surface corticale l’homologue humain proposé de S2 chez le macaque.
        view: inferior
        plane: coronal
  - id: pontine-motor
    name: { en: Motor corticopontocerebellar pathway, fr: Voie corticopontocérébelleuse motrice }
    summary:
      en: Follow a branch from the left primary motor cortex through the pons to the right cerebellar cortex.
      fr: Suivez une branche du cortex moteur primaire gauche au cortex cérébelleux droit en passant par le pont.
    route:
      en: Left primary motor cortex → left pontine nuclei → right ventral pons after the crossing → right cerebellar lobule V
      fr: Cortex moteur primaire gauche → noyaux pontiques gauches → pont ventral droit après la décussation → lobule V droit du cervelet
    scope:
      en: This branch ends at one cerebellar target. The right middle cerebellar peduncle carries these fibres into the cerebellum and has no separate CDMD or MNI152 landmark. In humans, diffusion tractography estimated trajectories through the middle cerebellar peduncle using left cerebellar lobule V as a seed and the whole pons as the target mask. The tracking was truncated at the opposite pontine shell. It leaves the pontine endpoints, direction of signalling and proportion of fibres crossing unresolved. The tour omits the weaker projection to the opposite pontine nuclei traced in macaques and the return pathways from the cerebellum. In humans, the specific pontine neurons relaying motor cortical input to lobule V remain unresolved.
      fr: Cette branche se termine dans un seul territoire cérébelleux. Le pédoncule cérébelleux moyen droit conduit ces fibres au cervelet et ne dispose pas de repère propre dans CDMD ni dans MNI152. Chez l’humain, la tractographie de diffusion a estimé des trajectoires passant par le pédoncule cérébelleux moyen, avec le lobule V gauche du cervelet comme région d’amorçage et l’ensemble du pont comme masque cible. Les trajectoires étaient tronquées à la limite pontique controlatérale. Leurs terminaisons dans le pont, le sens de transmission et la proportion de fibres qui croisent restent indéterminés. Le parcours laisse de côté la projection moins fournie vers les noyaux pontiques controlatéraux mise en évidence chez le macaque et les voies de retour du cervelet. Chez l’humain, les neurones pontiques précis qui relaient les afférences du cortex moteur vers le lobule V restent indéterminés.
    clinical:
      en: The clinical link with ataxic hemiparesis is partial and concerns the ventromedial pontine base. Moulin and colleagues studied 100 consecutive patients with a first stroke presenting as ataxic hemiparesis. Among 77 patients with an identified stroke lesion, 15 had a pontine lesion. Other lesion sites included the internal capsule. Among the 23 patients assessed with MRI, five had both a pontine and an internal capsular lesion. Marx and colleagues used MRI in a separate series of 49 patients with acute limb ataxia after isolated unilateral brainstem infarction. Limb ataxia accompanied by hemiparesis on the same side was associated with lesions of the ventromedial pontine base on the opposite side. These imaging studies leave the specific pontine nuclei and fibres involved unresolved.
      fr: Le lien clinique avec l’hémiparésie ataxique est partiel et concerne la partie ventromédiale de la base du pont. Moulin et ses collègues ont étudié une série consécutive de 100 patients présentant une hémiparésie ataxique lors d’un premier AVC. Parmi les 77 patients dont la lésion vasculaire a été localisée, 15 avaient une lésion pontique. D’autres lésions siégeaient notamment dans la capsule interne. Parmi les 23 patients examinés par IRM, cinq avaient à la fois une lésion du pont et une lésion de la capsule interne. Dans une autre série, Marx et ses collègues ont étudié par IRM 49 patients présentant une ataxie aiguë des membres après un infarctus unilatéral isolé du tronc cérébral. L’ataxie des membres accompagnée d’une hémiparésie du même côté était associée à des lésions de la partie ventromédiale de la base du pont, du côté opposé aux signes. Les noyaux pontiques et les fibres précisément en cause restent indéterminés.
    deficit: ataxic-hemiparesis
    references: [corticopontine-motor, pontocerebellar-dissection, pontocerebellar-human-lobular-tractography, cerebellar-motor-loops, cortical-parcellation, clinical-moulin-1995, clinical-marx-2008, cerebellar-organization]
    clinical_references: [clinical-moulin-1995, clinical-marx-2008]
    steps:
      - id: motor-cortex
        region: hcp-mmp:left:8
        source_name: L_4_ROI
        name: { en: Left primary motor cortex, fr: Cortex moteur primaire gauche }
        role: { en: Origin of corticopontine fibres, fr: Origine des fibres corticopontiques }
        explanation:
          en: In rhesus macaques, the corticopontine projection from the arm and hand region of primary motor cortex chiefly reaches pontine nuclei on the same side.
          fr: Chez le macaque rhésus, la représentation du bras et de la main dans le cortex moteur primaire projette principalement vers les noyaux pontiques du même côté.
        mapping:
          en: On this cortical surface, the HCP-MMP parcel approximates area 4. The arm and hand representation occupies part of the parcel.
          fr: Sur cette surface corticale, la parcelle HCP-MMP délimite approximativement l’aire 4. La représentation du bras et de la main en occupe une partie.
        view: left
        plane: axial
      - id: left-pons
        region: nextbrain:left:414
        source_name: pontine_nucleus
        name: { en: Left pontine nuclei, fr: Noyaux pontiques gauches }
        role: { en: Ipsilateral relay, fr: Relais ipsilatéral }
        explanation:
          en: Corticopontine fibres from the left motor cortex reach the left pontine nuclei. Pontocerebellar fibres emerging from these nuclei carry the branch towards the opposite cerebellum.
          fr: Les fibres corticopontiques du cortex moteur gauche atteignent les noyaux pontiques gauches. Les fibres pontocérébelleuses issues de ces noyaux prolongent cette branche vers le cervelet controlatéral.
        mapping:
          en: The NextBrain label groups the left pontine nuclei. Motor input reaches territories within this group.
          fr: L’étiquette NextBrain regroupe les noyaux pontiques gauches. Les afférences motrices atteignent certains territoires de cet ensemble.
        view: anterior
        plane: axial
      - id: right-pons
        region: nextbrain:right:10580
        source_name: pons
        tract: mcp
        name: { en: Right pontine territory, fr: Territoire pontique droit }
        role: { en: Passage after the pontine crossing, fr: Passage après la décussation pontique }
        explanation:
          en: These pontocerebellar fibres cross the midline within the ventral pons and travel rightwards into the right middle cerebellar peduncle.
          fr: Ces fibres pontocérébelleuses franchissent la ligne médiane dans la partie ventrale du pont et cheminent vers la droite jusqu’au pédoncule cérébelleux moyen droit.
        mapping:
          en: The broad NextBrain pons parcel locates the right side after the crossing. The highlighted tissue extends beyond the course of the transverse fibres.
          fr: La parcelle pontique de NextBrain repère le côté droit après la décussation. Le volume affiché dépasse le territoire des fibres transversales.
        view: anterior
        plane: axial
      - id: cerebellar-lobule-v
        region: learning:lobule-v-right
        source_name: Lobule V
        name: { en: Right cerebellar lobule V, fr: Lobule V droit du cervelet }
        role: { en: Cerebellar cortical target, fr: Cible corticale cérébelleuse }
        explanation:
          en: In tufted capuchins, anterograde transsynaptic tracing from the arm area of primary motor cortex labelled granule cells in the opposite cerebellar cortex, chiefly in lobules V and VI. A smaller group was labelled in lobules HVIIB–HVIII.
          fr: Chez le capucin brun, un traçage transsynaptique antérograde depuis la représentation du bras dans le cortex moteur primaire a marqué des cellules granulaires du cortex cérébelleux controlatéral, principalement dans les lobules V et VI. Un groupe plus restreint a été marqué dans les lobules HVIIB–HVIII.
        mapping:
          en: The CerebNet label includes the right hemispheric lobule and its corresponding anterior vermis. The labelled granule cells in the capuchin study occupied parts of the lobule.
          fr: L’étiquette CerebNet inclut le lobule hémisphérique droit et la partie correspondante du vermis antérieur. Dans l’étude chez le capucin, les cellules granulaires marquées occupaient certaines parties du lobule.
        view: posterior
        plane: coronal
  - id: nigrostriatal
    name: { en: Nigrostriatal projection to the putamen, fr: Projection nigrostriée vers le putamen }
    summary:
      en: Follow the dopaminergic projection from the substantia nigra to a sensorimotor territory of the putamen.
      fr: Suivez la projection dopaminergique de la substance noire vers un territoire sensorimoteur du putamen.
    route:
      en: Left substantia nigra pars compacta → left putamen (dorsolateral postcommissural territory)
      fr: Pars compacta de la substance noire gauche → putamen gauche (territoire dorsolatéral postcommissural)
    scope:
      en: Retrograde tracing in long-tailed macaques identified the dopaminergic projection to the dorsolateral postcommissural putamen. In post-mortem sections from people with Parkinson’s disease, Yamada and colleagues found tyrosine hydroxylase–positive fibres near the internal capsule. In 430 adults from the Human Connectome Project, diffusion tractography estimated trajectories between the lateral pars compacta and posterior putamen. Dense intersecting fibres in the internal capsule limit this estimate. The precise course and endings in humans remain unresolved. The tour shows the two atlas landmarks and omits intervening fibres and other striatal targets, including the caudate.
      fr: Le traçage rétrograde chez le macaque crabier a identifié la projection dopaminergique vers le putamen dorsolatéral postcommissural. Dans des coupes post mortem de personnes atteintes de la maladie de Parkinson, Yamada et ses collègues ont repéré, près de la capsule interne, des fibres immunopositives pour la tyrosine hydroxylase. Chez 430 adultes du Human Connectome Project, la tractographie de diffusion a estimé des trajets entre la partie latérale de la pars compacta et le putamen postérieur. L’entrecroisement de fibres denses dans la capsule interne limite cette estimation. Le trajet précis et les terminaisons chez l’humain restent indéterminés. Le parcours montre les deux repères dans l’atlas et laisse de côté les fibres qui les relient et les autres cibles striatales, dont le noyau caudé.
    clinical:
      en: The link with parkinsonism is partial at the putamen. Fearnley and Lees examined post-mortem tissue from 20 people with Parkinson’s disease and compared it with tissue from 36 controls. At the sampled caudal level of the pars compacta, pigmented neuron loss was greatest in the lateral part of the ventral tier. Counts came from one nigral section per person. Kordower and colleagues examined post-mortem tissue from 28 people with Parkinson’s disease and nine controls. In the available Parkinson’s samples at least four years after diagnosis, fibre staining for tyrosine hydroxylase and the dopamine transporter was very faint or absent in the dorsal postcommissural putamen and better preserved ventrally. The samples came from different people at different times after diagnosis. The decline in staining leaves the relative contributions of fibre loss and reduced marker expression unresolved. In a prospective study of 15 adults with unilateral striatal infarcts involving the posterior putamen, four had parkinsonism at three months and ten at one year. At one year, nine of the ten had signs only on the side opposite the infarct. Fourteen infarcts also involved the caudate. Visual assessment showed reduced dopamine transporter tracer uptake at the infarct in all 15 patients, including those without parkinsonism. The result concerns striatal injury. The status of the incoming nigral fibres remains unresolved.
      fr: Le lien avec le syndrome parkinsonien est partiel et concerne le putamen. Dans leur étude neuropathologique post mortem, Fearnley et Lees ont comparé 20 personnes atteintes de la maladie de Parkinson à 36 témoins. Au niveau caudal de la pars compacta étudié, la perte de neurones pigmentés était maximale dans la partie latérale de l’étage ventral. Le comptage reposait sur une coupe de la substance noire par personne. Kordower et ses collègues ont examiné les tissus post mortem de 28 personnes atteintes de la maladie de Parkinson et de neuf témoins. Dans les prélèvements disponibles de personnes décédées au moins quatre ans après le diagnostic, le marquage des fibres pour la tyrosine hydroxylase et le transporteur de la dopamine était très faible ou absent dans la portion dorsale du putamen postcommissural et mieux préservé dans sa portion ventrale. Les prélèvements provenaient de personnes distinctes, décédées à des délais différents après le diagnostic. La diminution du marquage laisse indéterminées les parts respectives de la perte de fibres et de la diminution de l’expression des marqueurs. Dans une étude prospective portant sur 15 adultes ayant un infarctus striatal unilatéral touchant le putamen postérieur, quatre présentaient un syndrome parkinsonien à trois mois et dix à un an. À un an, neuf de ces dix patients présentaient des signes uniquement du côté opposé à l’infarctus. Quatorze infarctus touchaient aussi le noyau caudé. À la lecture visuelle, la fixation du traceur du transporteur de la dopamine était réduite au niveau de l’infarctus chez les 15 patients, y compris chez ceux sans syndrome parkinsonien. Ce résultat concerne une atteinte striatale. L’état des fibres afférentes issues de la substance noire reste indéterminé.
    deficit: parkinsonism
    references: [nigrostriatal-putamen-tracing, nigrostriatal-human-histology, clinical-fearnley-1991, clinical-kordower-2013, basal-ganglia, nigrostriatal-human-tractography, clinical-holm-2025]
    clinical_references: [clinical-fearnley-1991, clinical-kordower-2013, clinical-holm-2025]
    steps:
      - id: snc
        region: nextbrain:left:352
        source_name: substantia_nigra__compact_part
        name: { en: Left substantia nigra pars compacta · SNc, fr: Pars compacta de la substance noire gauche · SNc }
        role: { en: Origin of the dopaminergic projection, fr: Origine de la projection dopaminergique }
        explanation:
          en: In long-tailed macaques, retrograde tracing from the putamen labelled dopaminergic neurons in the dorsal and ventral tiers of the pars compacta on the same side.
          fr: Chez le macaque crabier, le traçage rétrograde depuis le putamen a marqué des neurones dopaminergiques dans les étages dorsal et ventral de la pars compacta du même côté.
        mapping:
          en: NextBrain shows the pars compacta as a single volume. The label does not distinguish the dorsal and ventral tiers.
          fr: NextBrain représente la pars compacta par un seul volume. L’étiquette ne distingue pas les étages dorsal et ventral.
        view: anterior
