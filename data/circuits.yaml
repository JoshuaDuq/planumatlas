  - id: dentate-thalamo-putamen
    name: { en: Crossed dentate–putamen pathway, fr: Voie dentato-putaminale croisée }
    summary:
      en: Follow a cerebellar output branch from the left dentate nucleus through the right thalamus to the right putamen.
      fr: Suivez une voie efférente du cervelet qui relie le noyau dentelé gauche au putamen droit par le thalamus droit.
    route:
      en: Left dentate nucleus → crossing to the right thalamus → right putamen
      fr: Noyau dentelé gauche → décussation vers le thalamus droit → putamen droit
    scope:
      en: Macaque tracing links the dentate nucleus to the opposite putamen through a thalamic relay, across two synapses. In humans, diffusion tractography reconstructed streamlines from the dentate to the opposite putamen using the contralateral thalamus as a required waypoint. These streamlines passed through the superior cerebellar peduncle and crossed in the midbrain. The peduncle and crossing have no separate stops here. The precise relay cells and putaminal endings of the human pathway remain unresolved. The tour ends at the putamen, before any pallidal relay.
      fr: Chez le macaque, le traçage anatomique relie le noyau dentelé au putamen controlatéral par un relais thalamique, en deux synapses. Chez l’humain, la tractographie de diffusion a estimé des trajectoires entre le noyau dentelé et le putamen opposé en imposant un passage par le thalamus controlatéral. Ces trajectoires empruntaient le pédoncule cérébelleux supérieur et croisaient la ligne médiane dans le mésencéphale. Le pédoncule et la décussation ne font pas l’objet de repères distincts. Les neurones relais et les terminaisons putaminales de la voie humaine restent indéterminés. Le parcours s’arrête au putamen, en amont des relais pallidaux.
    clinical:
      en: In Bhatia and Marsden’s review of 240 published cases with basal ganglia lesions, dystonia was reported in 49% of cases with lentiform lesions and in 63% of cases with putamen involvement. Some lesions extended into adjacent white matter. In an MRI study by Krystkowiak and colleagues, four of five selected adults with delayed dystonia after stroke had infarcts that involved the postcommissural putamen. Each of these four infarcts also involved the external globus pallidus and at least one additional structure. The contribution of injury to this cerebellar input remains unresolved.
      fr: Dans la revue de 240 cas publiés de lésions des noyaux gris centraux, Bhatia et Marsden ont relevé une dystonie dans 49 % des cas de lésion du noyau lenticulaire et dans 63 % des cas avec atteinte putaminale. Certaines lésions s’étendaient à la substance blanche voisine. Dans une étude en IRM de Krystkowiak et de ses collègues, quatre des cinq adultes sélectionnés pour une dystonie apparue à distance d’un AVC présentaient des infarctus touchant le putamen postcommissural. Ces quatre infarctus touchaient aussi le segment externe du globus pallidus et, dans chaque cas, au moins une autre structure. La contribution d’une atteinte des afférences cérébelleuses décrites ici reste indéterminée.
    deficit: dystonia
    references: [dentatoputaminal-macaque-tracing, dentatoputaminal-comparative-anatomy, dentatoputaminal-human-tractography, clinical-bhatia-1994, clinical-krystkowiak-dystonia-1998]
    clinical_references: [clinical-bhatia-1994, clinical-krystkowiak-dystonia-1998]
    steps:
      - id: dentate
        region: nextbrain:left:721
        source_name: dentate_(lateral)_nucleus
        name: { en: Left dentate nucleus, fr: Noyau dentelé gauche }
        role: { en: Cerebellar origin, fr: Origine cérébelleuse }
        explanation:
          en: In the macaque putamen experiments, most of the labelled cerebellar neurons were on the side opposite the putamen. Most of those contralateral neurons were in the dentate nucleus, with the greatest concentration in its dorsal and ventral rostral portions.
          fr: Chez le macaque, la plupart des neurones cérébelleux marqués par traçage depuis le putamen se trouvaient du côté opposé. La majorité de ces neurones controlatéraux se situaient dans le noyau dentelé, où leur densité était maximale dans les portions dorsale et ventrale de sa partie rostrale.
        mapping:
          en: NextBrain shows the entire left dentate nucleus. The labelled territories in macaques occupied parts of the nucleus.
          fr: NextBrain représente le noyau dentelé gauche dans son ensemble. Les territoires marqués chez le macaque n’occupaient qu’une partie du noyau.
        view: posterior
        plane: coronal
      - id: thalamus
        region: learning:right:thalamus
        source_name: Thalamus
        name: { en: Right thalamus, fr: Thalamus droit }
        role: { en: Relay on the side opposite the dentate, fr: Relais du côté opposé au noyau dentelé }
        explanation:
          en: The route crosses to the right before reaching this landmark. Macaque tracing from the putamen identified first-order thalamic neurons and second-order cerebellar neurons. A separate experiment tracing from the external globus pallidus found labelled neurons in intralaminar and ventral anterior and ventral lateral thalamic territories. The precise nuclei relaying dentate input to the sampled putamen remain unresolved.
          fr: Le trajet croise la ligne médiane avant d’atteindre ce repère à droite. Chez le macaque, le traçage depuis le putamen a identifié des neurones thalamiques de premier ordre et des neurones cérébelleux de deuxième ordre. Une autre expérience, à partir du segment externe du globus pallidus, a révélé des neurones marqués dans les territoires intralaminaires, ventral antérieur et ventral latéral du thalamus. L’identité précise des noyaux qui transmettent les afférences dentelées aux sites étudiés du putamen reste indéterminée.
        mapping:
          en: This teaching volume groups thalamic subdivisions on the right, including several candidate relay territories. It extends beyond the part that relays dentate input to the putamen.
          fr: Ce volume pédagogique regroupe des subdivisions du thalamus droit, dont plusieurs territoires de relais possibles. Il s’étend au-delà de la partie qui transmet au putamen les projections du noyau dentelé.
        view: anterior
        plane: coronal
      - id: putamen
        region: nextbrain:right:10079
        source_name: putamen
        name: { en: Right putamen, fr: Putamen droit }
        role: { en: Striatal target, fr: Cible striatale }
        explanation:
          en: The sampled putamen sites in the two macaques lay mainly in its sensorimotor territory. This is the striatal end of the traced branch.
          fr: Chez les deux macaques, les sites étudiés dans le putamen se situaient surtout dans son territoire sensorimoteur. Le trajet suivi aboutit à cette partie du striatum.
        mapping:
          en: The main NextBrain putamen parcel serves as a regional landmark. It extends beyond the sites sampled in the macaque study. The atlas segments the posteroventral portion separately.
          fr: La parcelle principale du putamen de NextBrain sert de repère régional. Elle s’étend au-delà des sites étudiés chez le macaque. L’atlas délimite séparément la portion postéroventrale.
        view: anterior
        plane: coronal

  - id: ca1-subiculum
    name: { en: Hippocampal CA1 projection to the subiculum, fr: Projection du champ CA1 de l’hippocampe vers le subiculum }
    summary:
      en: Follow one projection traced in rats from the pyramidal layer of ventral CA1 through the alveus to the subiculum on the same side.
      fr: Suivez une projection étudiée par traçage chez le rat, de la couche pyramidale du champ CA1 ventral au subiculum du même côté, en passant par l’alvéus.
    route:
      en: Ventral CA1 pyramidal layer → alveus → ipsilateral ventral subiculum (rat projection illustrated with left-sided human atlas landmarks)
      fr: Couche pyramidale de CA1 ventral → alvéus → subiculum ventral ipsilatéral (projection du rat illustrée par des repères gauches de l’atlas humain)
    scope:
      en: The three left-sided landmarks represent one local branch demonstrated in rats. Post-mortem diffusion tractography of right human hippocampi estimated longitudinal streamlines in the molecular layer in the region of CA1 and the subicular complex. The subicular complex was outside that study’s quantitative analysis. The exact human axonal course, endpoints and direction of the displayed pathway remain unresolved. The tour ends at the subiculum. It leaves out fibres that continue to the entorhinal cortex and the route through the fornix.
      fr: Les trois repères gauches représentent une branche locale mise en évidence chez le rat. La tractographie par IRM de diffusion d’hippocampes droits humains prélevés post mortem a estimé des trajectoires longitudinales dans la couche moléculaire, dans la région du champ CA1 et du complexe subiculaire. Ce complexe n’entrait pas dans l’analyse quantitative de l’étude. Le trajet axonal précis, les extrémités et le sens de la voie représentée restent indéterminés chez l’humain. Le parcours s’arrête au subiculum. Il laisse de côté les fibres qui se prolongent jusqu’au cortex entorhinal et la voie qui emprunte le fornix.
    clinical:
      en: R.B. developed persistent anterograde amnesia after an ischaemic episode. Post-mortem examination showed extensive loss of CA1 pyramidal cells on both sides, with slight extension into the subiculum and CA3 in two caudal sections and small lesions elsewhere. In a later series that reused R.B. as a comparator, G.D. had persistent anterograde amnesia with bilateral injury centred on CA1 and extending into the proximal subiculum. The authors also reported possible very slight cell loss in the left entorhinal cortex. The effects of an injury confined to this projection remain unresolved.
      fr: Après un épisode ischémique, R.B. a présenté une amnésie antérograde persistante. L’examen post mortem a révélé une perte étendue de cellules pyramidales de CA1 des deux côtés, avec une légère extension au subiculum et à CA3 sur deux coupes caudales ainsi que de petites lésions ailleurs. Dans une série ultérieure qui reprend les données de R.B. à titre de comparaison, G.D. présentait une amnésie antérograde persistante et une atteinte bilatérale prédominant dans le champ CA1, avec une extension au subiculum proximal. Les auteurs ont aussi signalé une possible perte cellulaire très légère dans le cortex entorhinal gauche. Les effets d’une lésion limitée à cette projection restent indéterminés.
    deficit: amnesia
    references: [ca1-subiculum-cenquizca-swanson, ca1-subiculum-arszovszki, entorhinal-ca1-human-fibres, ca1-subiculum-modo-human-diffusion, clinical-zola-morgan-1986, clinical-rempel-clower-1996]
    clinical_references: [clinical-zola-morgan-1986, clinical-rempel-clower-1996]
    steps:
      - id: ca1-pyramidal-layer
        region: nextbrain:left:345
        source_name: stratum_pyramidale_of_rostral_ca1
        name: { en: Pyramidal layer of left rostral CA1, fr: Couche pyramidale du champ CA1 rostral gauche }
        role: { en: Origin of the subicular projection, fr: Origine de la projection vers le subiculum }
        explanation:
          en: In rat single-cell reconstructions, axons of ventral CA1 pyramidal cells gave off branches in the subiculum on the same side.
          fr: Chez le rat, la reconstruction de neurones individuels a montré que des axones de cellules pyramidales du champ CA1 ventral se ramifiaient dans le subiculum du même côté.
        mapping:
          en: NextBrain shows the pyramidal layer of left rostral CA1. This human region serves as a comparison for the traced population in ventral CA1 in rats.
          fr: NextBrain représente la couche pyramidale du champ CA1 rostral gauche. Cette région humaine sert de repère comparatif pour la population étudiée par traçage dans le champ CA1 ventral du rat.
        view: right
        plane: coronal
      - id: alveus
        region: nextbrain:left:354
        source_name: alveus
        name: { en: Left alveus, fr: Alvéus gauche }
        role: { en: Passage toward the subiculum, fr: Passage vers le subiculum }
        explanation:
          en: In rat anterograde tracing from ventral CA1, labelled axons entered the alveus and ran caudally toward the subiculum. Human polarized-light microscopy shows groups of longitudinally oriented myelinated fibres in the alveus.
          fr: Chez le rat, après un traçage antérograde depuis le champ CA1 ventral, des axones marqués pénétraient dans l’alvéus et se dirigeaient vers l’arrière, en direction du subiculum. En microscopie en lumière polarisée, les coupes humaines montrent dans l’alvéus des groupes de fibres myélinisées orientées longitudinalement.
        mapping:
          en: The NextBrain parcel represents the segmented left alveus. It contains multiple fibre populations and serves here as a regional waypoint.
          fr: La parcelle de NextBrain représente l’alvéus gauche segmenté. Elle contient plusieurs populations de fibres et sert ici de repère sur le trajet.
        view: right
        plane: coronal
      - id: subiculum
        region: nextbrain:left:347
        source_name: rostral_subiculum
        name: { en: Left rostral subiculum, fr: Subiculum rostral gauche }
        role: { en: Subicular target of CA1 fibres, fr: Cible subiculaire des fibres de CA1 }
        explanation:
          en: In rat anterograde tracing, the labelled fibres formed a dense terminal field in the ventral subiculum. The field extended through the pyramidal layer and into the adjacent deep zone of the molecular layer.
          fr: Chez le rat, le traçage antérograde a montré un champ terminal dense dans le subiculum ventral. Ce champ s’étendait sur toute l’épaisseur de la couche pyramidale et jusque dans la zone profonde adjacente de la couche moléculaire.
        mapping:
          en: The NextBrain parcel shows the left rostral subiculum as one volume. The receiving layers described in rats have no separate landmark here.
          fr: La parcelle de NextBrain représente le subiculum rostral gauche en un seul volume. Les couches cibles décrites chez le rat ne font pas l’objet de repères distincts ici.
        view: right
        plane: coronal

  - id: dorsal-geniculate-mt
    name: { en: Direct geniculate input to visual area MT, fr: Afférences géniculées directes vers l’aire visuelle MT }
    summary:
      en: Follow a direct projection from the dorsal lateral geniculate nucleus to visual area MT identified by tracing in macaques. Locate both ends with right-sided landmarks in the human atlas.
      fr: Suivez une projection directe du noyau géniculé latéral dorsal vers l’aire visuelle MT mise en évidence par traçage chez le macaque. Situez ses deux extrémités à l’aide de repères de l’hémisphère droit dans l’atlas humain.
    route:
      en: Dorsal lateral geniculate nucleus → visual area MT (macaque projection shown with right-sided human atlas landmarks)
      fr: Noyau géniculé latéral dorsal → aire visuelle MT (projection du macaque illustrée par des repères du côté droit dans l’atlas humain)
    scope:
      en: The traced projection reaches MT directly within the same hemisphere. The retina and the separate routes to MT via V1 or the inferior pulvinar are outside the display. In adults with acquired unilateral V1 damage and in healthy controls, diffusion tractography estimated same-hemisphere streamlines between LGN and hMT+ regions. The V1 lesion study examined residual detection of moving stimuli in the blind field. The geniculate cell types, precise endpoints and direction of the corresponding human projection remain unresolved.
      fr: La projection mise en évidence par traçage atteint directement MT dans le même hémisphère. La rétine et les voies distinctes qui gagnent MT par V1 ou par le pulvinar inférieur sont hors du parcours. Chez des adultes présentant une lésion acquise unilatérale de V1 et chez des témoins sains, la tractographie par IRM de diffusion a estimé des trajectoires entre les régions du noyau géniculé latéral et de hMT+ du même hémisphère. L’étude portant sur les lésions de V1 a examiné la détection résiduelle de stimuli en mouvement dans le champ visuel aveugle. Les types de cellules géniculées, les extrémités précises et le sens de la projection correspondante restent indéterminés chez l’humain.
    clinical:
      en: L.M. had persistent difficulty perceiving visual motion after bilateral injury involving the upper parts of the occipital gyri and adjacent parts of the middle temporal gyri, with associated occipital and occipitoparietal white-matter changes. In a separate study of adults with acquired focal brain lesions, one patient whose lesions overlapped the left and right hMT+ template masks had marked difficulty judging the direction of moving dots. The effects of selective injury to the geniculate input to MT remain unresolved.
      fr: L.M. a présenté un trouble persistant de la perception visuelle du mouvement après des lésions bilatérales touchant la partie supérieure des gyrus occipitaux et la partie adjacente des gyrus temporaux moyens, avec des anomalies de la substance blanche occipitale et occipitopariétale. Dans une autre étude portant sur des adultes présentant des lésions cérébrales focales acquises, les lésions d’un patient recoupaient les masques de référence gauche et droit du complexe hMT+. Ce patient éprouvait une difficulté marquée à indiquer le sens du déplacement de points en mouvement. Les effets d’une atteinte sélective des afférences géniculées vers MT restent indéterminés.
    deficit: akinetopsia
    references: [geniculate-mt-macaque-tracing, geniculate-mt-marmoset-retinal, geniculate-mt-human-diffusion, cortical-parcellation, clinical-zihl-1991, clinical-prabhakar-motion-2025]
    clinical_references: [clinical-zihl-1991, clinical-prabhakar-motion-2025]
    steps:
      - id: dorsal-lgn
        region: nextbrain:right:10484
        source_name: dorsal_lateral_geniculate_nucleus
        name: { en: Right dorsal lateral geniculate nucleus, fr: Noyau géniculé latéral dorsal droit }
        role: { en: Thalamic source of direct input to MT, fr: Origine thalamique des afférences directes vers MT }
        explanation:
          en: In macaques, injections of retrograde tracer confined to MT labelled geniculate neurons on the same side. Most of the counted cells were in intercalated layers. The labelled population included cells that expressed the koniocellular marker CaMK2 and cells that lacked it. In marmosets, confocal microscopy identified retinal terminals carrying a presynaptic marker close to MT-projecting cells in layers K1 and K3.
          fr: Chez le macaque, des injections de traceur rétrograde limitées à MT ont marqué des neurones géniculés du même côté. La plupart des cellules dénombrées se trouvaient dans les couches intercalaires. La population marquée comprenait des cellules exprimant le marqueur koniocellulaire CaMK2 et des cellules dépourvues de ce marqueur. Chez des ouistitis, la microscopie confocale a mis en évidence des terminaisons rétiniennes portant un marqueur présynaptique à proximité de cellules des couches K1 et K3 qui se projettent vers MT.
        mapping:
          en: The NextBrain parcel covers the dorsal nucleus. The intercalated layers and the cells projecting to MT occupy only part of the displayed volume.
          fr: La parcelle de NextBrain représente le noyau dorsal. Les couches intercalaires et les cellules qui se projettent vers MT n’occupent qu’une partie du volume affiché.
        view: posterior
        plane: coronal
      - id: mt
        region: hcp-mmp:right:23
        source_name: R_MT_ROI
        name: { en: Right middle temporal visual area (MT or V5), fr: Aire visuelle temporale moyenne droite (MT ou V5) }
        role: { en: Cortical target of the geniculate projection, fr: Cible corticale de la projection géniculée }
        explanation:
          en: In macaques, very few geniculate neurons carried both tracers where the labelling from MT and from the corresponding part of V1 overlapped. The result supports a distinct population of geniculate neurons projecting to MT.
          fr: Chez le macaque, très peu de neurones géniculés portaient les deux traceurs dans les zones où se recoupaient les marquages à partir de MT et de la partie correspondante de V1. Ce résultat étaye l’existence d’une population distincte de neurones géniculés qui se projettent vers MT.
        mapping:
          en: The HCP-MMP parcel marks MT within the wider human MT+ complex. The human tractography study defined its cortical region of interest using a Jülich hMT+ probability map.
          fr: La parcelle HCP-MMP situe l’aire MT au sein du complexe visuel MT+ humain, plus étendu. L’étude de tractographie chez l’humain a défini sa région d’intérêt corticale à l’aide d’une carte probabiliste hMT+ de l’atlas de Jülich.
        view: right
        plane: axial

  - id: subthalamic-crus-ii
    name: { en: Crossed subthalamic projection to Crus II, fr: Projection sous-thalamo-cérébelleuse croisée vers le Crus II }
    summary:
      en: Follow a two-synapse projection traced in capuchins from the subthalamic nucleus to posterior Crus II on the opposite side. Locate both ends with left subthalamic and right cerebellar landmarks in the human atlas.
      fr: Suivez une projection à deux synapses mise en évidence par traçage chez le capucin, du noyau sous-thalamique à la partie postérieure du Crus II controlatéral. Situez ses deux extrémités dans l’atlas humain à l’aide des repères sous-thalamique gauche et cérébelleux droit.
    route:
      en: Left subthalamic nucleus → posterior right Crus II (after crossing)
      fr: Noyau sous-thalamique gauche → partie postérieure du Crus II droit (après franchissement de la ligne médiane)
    scope:
      en: Anatomical tracing in capuchins identifies candidate relays in the pons. The precise relay and the crossing level remain unresolved in those experiments. Human diffusion tractography with opposite-side endpoint regions estimated trajectories from the subthalamic nucleus to Crus II through the basilar pons and middle cerebellar peduncle. The estimated trajectories leave the synaptic relay and direction unresolved. The tour omits the intervening brainstem and the separate branch to lobule VIIb.
      fr: Le traçage anatomique chez le capucin indique des relais possibles dans le pont. Ces expériences laissent indéterminés le relais précis et le niveau du croisement. Chez l’humain, la tractographie par IRM de diffusion a estimé des trajectoires entre des régions d’intérêt choisies de part et d’autre de la ligne médiane, du noyau sous-thalamique au Crus II, par la partie basilaire du pont et le pédoncule cérébelleux moyen. Ces estimations laissent indéterminés le relais synaptique et le sens de la projection. Le trajet dans le tronc cérébral et la branche distincte vers le lobule VIIb restent hors du parcours.
    clinical:
      en: Schmahmann and Sherman’s series of 20 patients with cerebellar pathology included 13 adults after cerebellar stroke. Cognitive and affective changes were prominent with posterior-lobe and vermal involvement. In a separate study of 22 adults with chronic isolated cerebellar stroke, lesion mapping associated poorer verbal category-switching scores with damage in lateral right Crus I and II and lobule VIIb. The difference on that task between patients and 22 healthy volunteers fell below the threshold for statistical significance after adjustment for articulation rate. The contribution of injury confined to the subthalamic projection remains unresolved.
      fr: La série de Schmahmann et Sherman, consacrée à 20 patients présentant une atteinte cérébelleuse, comprenait 13 adultes ayant subi un AVC cérébelleux. Les troubles cognitifs et affectifs étaient marqués en cas d’atteinte du lobe postérieur et du vermis. Dans une étude distincte menée chez 22 adultes en phase chronique après un AVC limité au cervelet, la cartographie lésionnelle a associé de moins bons scores à une épreuve d’alternance entre catégories sémantiques à des lésions des portions latérales de Crus I, Crus II et du lobule VIIb à droite. L’écart à cette épreuve entre patients et 22 témoins sains n’atteignait plus le seuil de signification statistique après ajustement sur le débit articulatoire. L’effet d’une lésion limitée à la projection sous-thalamique reste indéterminé.
    deficit: cerebellar-cognitive
    references: [subthalamic-crus-ii-capuchin-tracing, dentatoputaminal-comparative-anatomy, dentatoputaminal-human-tractography, clinical-schmahmann-1998, clinical-chirino-perez-2022]
    clinical_references: [clinical-schmahmann-1998, clinical-chirino-perez-2022]
    steps:
      - id: subthalamic-nucleus
        region: learning:left:subthalamic
        source_name: Subthalamic nucleus
        name: { en: Left subthalamic nucleus, fr: Noyau sous-thalamique gauche }
        role: { en: Subthalamic origin of the projection, fr: Origine sous-thalamique de la projection }
        explanation:
          en: In capuchins, the subthalamic neurons linked to posterior Crus II were more numerous in the rostral half of the nucleus. Comparing the distribution with functional subdivisions placed most of these neurons in the associative territory.
          fr: Chez le capucin, les neurones sous-thalamiques reliés à la partie postérieure du Crus II étaient plus nombreux dans la moitié rostrale du noyau. La comparaison avec les subdivisions fonctionnelles a situé la plupart de ces neurones dans le territoire associatif.
        mapping:
          en: The teaching volume combines the medial, laterodorsal and lateroventral NextBrain labels. It serves as a regional landmark for the territory traced in capuchins.
          fr: Le volume pédagogique réunit les portions médiale, latérodorsale et latéroventrale de NextBrain. Il sert de repère régional pour le territoire étudié par traçage chez le capucin.
        view: anterior
        plane: axial
      - id: posterior-crus-ii
        region: learning:crus-ii-right
        source_name: Crus II
        name: { en: Right Crus II, fr: Crus II droit }
        role: { en: Cerebellar target after crossing, fr: Cible cérébelleuse après le croisement }
        explanation:
          en: In two capuchins, most of the second-order neurons labelled in the subthalamic nucleus after tracing from posterior Crus II were contralateral to the cerebellar site. The right landmark illustrates the receiving side of this crossed connection.
          fr: Chez deux capucins, la plupart des neurones de deuxième ordre marqués dans le noyau sous-thalamique après traçage depuis la partie postérieure du Crus II se trouvaient du côté opposé au site cérébelleux. Le repère droit représente le côté où aboutit cette connexion croisée.
        mapping:
          en: CerebNet shows the whole right Crus II. The posterior sector sampled in capuchins occupies part of Crus II.
          fr: CerebNet représente l’ensemble du Crus II droit. Le territoire postérieur étudié chez le capucin n’occupe qu’une partie du Crus II.
        view: posterior
        plane: coronal
