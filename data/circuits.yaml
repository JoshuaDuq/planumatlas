  - id: basal-amygdala-mediodorsal
    name: { en: Amygdalar input to the mediodorsal thalamus, fr: Afférences amygdaliennes au thalamus médiodorsal }
    summary:
      en: Follow the projection from the basal nucleus of the amygdala to the magnocellular part of the mediodorsal thalamic nucleus.
      fr: Suivez la projection du noyau basal de l’amygdale vers la partie magnocellulaire du noyau médiodorsal du thalamus.
    route:
      en: Right basal nucleus of the amygdala → right magnocellular mediodorsal thalamic nucleus
      fr: Noyau basal de l’amygdale droite → partie magnocellulaire du noyau médiodorsal du thalamus droit
    scope:
      en: The two right-sided landmarks represent a same-side projection described by tracing in macaques. In cynomolgus macaques, most traced amygdalothalamic fibres joined the inferior thalamic peduncle. Human fibre dissection describes amygdalothalamic fibres above the anterior perforated substance within the extracapsular inferior thalamic peduncle. A human diffusion tractography study estimated same-side streamlines between a region combining the medial and lateral mediodorsal subdivisions and a basolateral amygdalar region containing the lateral, basal and accessory basal nuclei. The precise endpoints and direction of the corresponding human projection remain unresolved. The intervening white matter and the onward thalamocortical projection are outside the tour.
      fr: Les deux repères du côté droit représentent une projection ipsilatérale mise en évidence par traçage chez le macaque. Chez le macaque crabier, la plupart des fibres amygdalothalamiques marquées rejoignaient le pédoncule thalamique inférieur. La dissection chez l’humain décrit des fibres amygdalothalamiques au-dessus de la substance perforée antérieure, dans le pédoncule thalamique inférieur extracapsulaire. Une étude de tractographie par IRM de diffusion chez l’humain a estimé des trajectoires ipsilatérales entre une région regroupant les subdivisions médiale et latérale du noyau médiodorsal et une région amygdalienne comprenant les noyaux latéral, basal et basal accessoire. Les extrémités précises et le sens de la projection correspondante restent indéterminés chez l’humain. Le trajet dans la substance blanche et la projection thalamocorticale en aval restent hors du parcours.
    clinical:
      en: The clinical link with anterograde amnesia is partial at the mediodorsal endpoint. A man with right mediodorsal thalamic damage and probable involvement of the mammillothalamic tract on the same side was impaired on tests of visual recall and recognition, compared with healthy volunteers matched for demographic characteristics and premorbid IQ. His verbal recall and recognition were not significantly impaired. Later reports on the same patient describe a lesion centred on the magnocellular division that also involved the parvocellular division and intralaminar and midline nuclei. The evidence rests on one patient whose cause of injury the accessible reports do not state, and the contribution of the amygdalar input to this division remains unresolved.
      fr: Le lien clinique avec l’amnésie antérograde est partiel, au niveau de la cible médiodorsale. Un homme présentant une atteinte médiodorsale droite du thalamus, avec une atteinte probable du faisceau mamillothalamique du même côté, avait des résultats déficitaires aux épreuves de rappel et de reconnaissance visuelles, comparativement à des volontaires sains appariés pour les caractéristiques démographiques et le quotient intellectuel prémorbide. Son rappel et sa reconnaissance verbaux n’étaient pas significativement altérés. D’autres publications sur ce patient décrivent une lésion centrée sur la subdivision magnocellulaire, qui touchait aussi la subdivision parvocellulaire et des noyaux intralaminaires et médians. Ces données reposent sur un seul patient, dont les publications accessibles ne précisent pas la cause de la lésion, et la contribution des afférences amygdaliennes à cette subdivision reste indéterminée.
    deficit: amnesia
    references: [amygdalothalamic-aggleton-1984, amygdalothalamic-russchen-1987, amygdalothalamic-relay-tracing-2015, amygdalothalamic-synapses-2020, amygdalothalamic-ribas-human-dissection-2018, amygdalothalamic-kosteletou-kassotaki-human-diffusion-2026, clinical-edelstyn-2012, clinical-edelstyn-2014, clinical-edelstyn-2016]
    clinical_references: [clinical-edelstyn-2012, clinical-edelstyn-2014, clinical-edelstyn-2016]
    steps:
      - id: basal-amygdala
        region: nextbrain:right:10216
        source_name: basolateral_nucleus_(basal_nucleus)
        name: { en: Right basal amygdalar nucleus, fr: Noyau basal de l’amygdale droite }
        role: { en: Amygdalar source of thalamic input, fr: Origine amygdalienne des afférences thalamiques }
        explanation:
          en: In one rhesus macaque, an injection mainly in the left magnocellular division and extending into the parvicellular division retrogradely labelled neurons in the basal nucleus and neighbouring amygdalar nuclei. In cynomolgus macaques, tracing identified projections from the parvicellular and magnocellular parts of the basal nucleus to the ventromedial and ventrolateral parts of the magnocellular thalamic division, respectively.
          fr: Chez un macaque rhésus, une injection dans la partie magnocellulaire gauche, débordant sur la partie parvocellulaire, a marqué par voie rétrograde des neurones du noyau basal et de noyaux amygdaliens voisins. Chez le macaque crabier, le traçage a mis en évidence des projections de la partie parvocellulaire du noyau basal vers la région ventromédiale de la partie magnocellulaire du thalamus médiodorsal, et de la partie magnocellulaire du noyau basal vers la région ventrolatérale.
        mapping:
          en: NextBrain displays the basal nucleus as a single volume under the name basolateral nucleus. The subregions identified by tracing in macaques have no separate landmarks.
          fr: NextBrain représente le noyau basal par un seul volume, sous le nom de noyau basolatéral. Les subdivisions distinguées par traçage chez le macaque n’ont pas de repère séparé.
        view: left
        plane: coronal
      - id: magnocellular-mediodorsal
        region: nextbrain:right:10282
        source_name: magnocellular_(medial)_division_of_md
        name: { en: Magnocellular division of the right mediodorsal thalamic nucleus, fr: Partie magnocellulaire du noyau médiodorsal du thalamus droit }
        role: { en: Thalamic target of the amygdalar projection, fr: Cible thalamique de la projection amygdalienne }
        explanation:
          en: In rhesus macaques, axons labelled from amygdalar injections formed clusters of terminations in this thalamic division. Serial electron microscopy showed labelled amygdalar boutons forming synapses on thalamic relay dendrites after injections involving multiple amygdalar nuclei.
          fr: Chez le macaque rhésus, les axones marqués par des injections dans l’amygdale formaient des amas de terminaisons dans cette partie du thalamus. La microscopie électronique en coupes sériées a montré des boutons amygdaliens marqués formant des synapses sur des dendrites de neurones de relais thalamiques après des injections touchant plusieurs noyaux de l’amygdale.
        mapping:
          en: NextBrain shows a segmented volume for the medial magnocellular division. The macaque study identifies discrete groups of terminations within the division.
          fr: NextBrain délimite un volume pour la partie magnocellulaire médiale. Le traçage chez le macaque montre des groupes distincts de terminaisons au sein de cette partie.
        view: anterior
        plane: coronal

  - id: frontal-aslant-opercular
    name: { en: Frontal aslant tract · opercular branch, fr: Faisceau frontal oblique · branche operculaire }
    summary:
      en: Follow an association pathway through the left frontal lobe between the inferior frontal gyrus and the pre-supplementary motor region.
      fr: Suivez une voie d’association du lobe frontal gauche entre le gyrus frontal inférieur et la région motrice présupplémentaire.
    route:
      en: Left inferior frontal area 44 → left pre-supplementary motor region (direction traced in a rhesus macaque)
      fr: Aire 44 du gyrus frontal inférieur gauche → région motrice présupplémentaire gauche (sens de projection établi par traçage chez un macaque rhésus)
    scope:
      en: Comparative diffusion tractography estimates broad precentral and prefrontal segments of the frontal aslant tract. In eight patients operated on in the hemisphere dominant for language, stimulation in the opercular or triangular part of the inferior frontal gyrus evoked responses in the superior frontal gyrus. Responses were recorded at supplementary motor sites in four patients. In a separate case, stimulation near the posterior pre-SMA evoked responses in the right posterior inferior frontal gyrus within 30 ms. The fibres carrying these responses, the precise correspondence of this branch between species and the direction of its fibres in humans remain unresolved. The tour leaves out branches to SMA proper and other inferior frontal territories.
      fr: Les comparaisons par tractographie de diffusion estiment de larges segments précentral et préfrontal du faisceau frontal oblique. Chez huit patients opérés dans l’hémisphère dominant pour le langage, la stimulation de la région operculaire ou triangulaire du gyrus frontal inférieur a évoqué des réponses dans le gyrus frontal supérieur. Des réponses ont été enregistrées dans les aires motrices supplémentaires chez quatre patients. Dans une observation distincte, la stimulation à proximité de la partie postérieure de la pré-AMS a évoqué des réponses dans la partie postérieure du gyrus frontal inférieur droit en moins de 30 ms. Les fibres à l’origine de ces réponses, la correspondance précise de cette branche entre les espèces et le sens de projection de ses fibres chez l’humain restent indéterminés. Le parcours laisse de côté les branches qui rejoignent l’aire motrice supplémentaire proprement dite et les autres territoires frontaux inférieurs.
    clinical:
      en: The clinical link with supplementary motor area syndrome is partial and concerns the whole left frontal aslant tract. Two adults developed the syndrome after left frontal tumour surgery that injured the tract on diffusion imaging while postoperative MRI showed the supplementary motor area intact. One operation resected a left frontal opercular tumour and the other passed through the superior frontal sulcus to reach a ventricular tumour. Both patients had impaired speech and right-sided weakness of voluntary movement after surgery and walked independently one month later. In a series of 56 patients after resection of gliomas in the supplementary motor area region, all those whose tract was disrupted during surgery developed the syndrome, compared with half of those whose tract was preserved, a difference that did not reach statistical significance. Neither report separates the opercular branch to the pre-supplementary motor region from the rest of the tract, and its own contribution remains unresolved.
      fr: Le lien clinique avec le syndrome de l’aire motrice supplémentaire est partiel et concerne l’ensemble du faisceau frontal oblique gauche. Deux adultes ont présenté ce syndrome après une chirurgie tumorale frontale gauche qui avait atteint le faisceau à l’imagerie de diffusion, alors que l’IRM postopératoire montrait une aire motrice supplémentaire intacte. L’une des interventions a réséqué une tumeur operculaire frontale gauche et l’autre a traversé le sillon frontal supérieur pour atteindre une tumeur ventriculaire. Après l’intervention, les deux patientes avaient une parole altérée et une faiblesse des mouvements volontaires du côté droit, et toutes deux marchaient de façon autonome un mois plus tard. Dans une série de 56 patients opérés d’un gliome de la région de l’aire motrice supplémentaire, tous ceux dont le faisceau avait été interrompu pendant l’intervention ont présenté le syndrome, contre la moitié de ceux dont le faisceau était préservé, une différence qui n’atteignait pas le seuil de signification statistique. Aucune de ces publications ne distingue la branche operculaire qui rejoint la région motrice présupplémentaire du reste du faisceau, et sa contribution propre reste indéterminée.
    deficit: sma-syndrome
    references: [frontal-aslant-macaque-tracing, sma-callosal-bozkurt-2017, sma-callosal-vergani-2014, frontal-aslant-tractography, cortical-parcellation, frontal-aslant-comparative, frontal-aslant-human-evoked-potential-series, frontal-aslant-human-evoked-potential-case, clinical-agyemang-2023, clinical-young-2022]
    clinical_references: [clinical-agyemang-2023, clinical-young-2022]
    steps:
      - id: inferior-frontal-area-44
        region: hcp-mmp:left:74
        source_name: L_44_ROI
        name: { en: Left inferior frontal area 44, fr: Aire 44 du gyrus frontal inférieur gauche }
        role: { en: Cortical origin in the tracer study, fr: Origine corticale dans l’étude de traçage }
        explanation:
          en: In a rhesus macaque, a retrograde tracer injected into the pre-supplementary motor area (pre-SMA) labelled neurons in area 44 on the caudal bank of the inferior limb of the arcuate sulcus.
          fr: Chez un macaque rhésus, l’injection d’un traceur rétrograde dans l’aire motrice présupplémentaire (pré-AMS) a marqué des neurones de l’aire 44 sur la berge caudale de la branche inférieure du sillon arqué.
        mapping:
          en: HCP-MMP area 44 overlaps substantially with human cytoarchitectonic area 44. The parcel locates the inferior frontal attachment at the scale of the atlas.
          fr: La parcelle 44 de HCP-MMP recouvre en grande partie l’aire cytoarchitectonique 44 humaine. Elle situe l’extrémité frontale inférieure du faisceau à l’échelle de l’atlas.
        view: left
        plane: axial
      - id: pre-sma
        region: hcp-mmp:left:44
        source_name: L_6ma_ROI
        name: { en: Left pre-supplementary motor region · 6ma, fr: Région motrice présupplémentaire gauche · 6ma }
        role: { en: Cortical target in the tracer study, fr: Cible corticale dans l’étude de traçage }
        explanation:
          en: Human dissections follow oblique fibres between the pars opercularis of the inferior frontal gyrus and the pre-SMA. One series placed the attachment in the superior frontal gyrus at the boundary between the pre-SMA and SMA proper. Human diffusion tractography estimated streamlines between areas 44 and 6ma on the left.
          fr: Les dissections chez l’humain permettent de suivre des fibres obliques entre la partie operculaire du gyrus frontal inférieur et la pré-AMS. Dans une série, l’attache dans le gyrus frontal supérieur se trouvait à la limite entre la pré-AMS et l’aire motrice supplémentaire proprement dite. Chez l’humain, la tractographie de diffusion a reconstruit des trajectoires probables entre les aires 44 et 6ma de l’hémisphère gauche.
        mapping:
          en: HCP-MMP area 6ma partly overlaps the rostral supplementary motor region in a previous anatomical map and extends farther anteriorly and laterally, with less inferior extent on the medial surface. The parcel serves as a landmark for the superior attachment.
          fr: L’aire 6ma de HCP-MMP recouvre en partie le territoire moteur supplémentaire rostral décrit par une carte anatomique antérieure et s’étend davantage en avant et latéralement, avec une extension inférieure plus limitée sur la face médiale. La parcelle sert de repère pour l’extrémité frontale supérieure du faisceau.
        view: right
        plane: coronal

  - id: motor-hyperdirect
    name: { en: Motor hyperdirect pathway, fr: Voie hyperdirecte motrice }
    summary:
      en: Follow the projection traced in macaques from the forelimb representation of primary motor cortex to the subthalamic nucleus on the same side.
      fr: Suivez la projection mise en évidence par traçage chez le macaque, de la représentation du membre supérieur dans le cortex moteur primaire jusqu’au noyau sous-thalamique ipsilatéral.
    route:
      en: Left primary motor cortex → dorsolateral portion of the left subthalamic nucleus
      fr: Cortex moteur primaire gauche → portion dorsolatérale du noyau sous-thalamique gauche
    scope:
      en: The atlas labels the regions at either end of the route. In cynomolgus macaques, most reconstructed parent axons travelled through the internal capsule. In a study of 15 people with Parkinson’s disease, bipolar stimulation between the contact closest to primary motor cortex and its anterior neighbour produced an evoked response on the ipsilateral subthalamic lead. Among the ten participants recorded both on and off dopaminergic medication, the first subthalamic deflection averaged 2.6 ± 0.7 ms across the two medication conditions. In a separate study, stimulation in the subthalamic region evoked short-latency cortical potentials (2–10 ms), consistent with antidromic activation of corticosubthalamic fibres. The precise human forelimb terminal field remains unresolved. Other cortical inputs and the onward connections of the subthalamic nucleus lie outside this tour. Sparse terminal labelling in the medial half of the nucleus in Japanese macaques also lies outside the tour.
      fr: L’atlas délimite les régions aux deux extrémités du trajet. Chez le macaque crabier, la plupart des axones principaux reconstruits cheminaient dans la capsule interne. Dans une étude menée chez 15 personnes atteintes de la maladie de Parkinson, une stimulation bipolaire entre le contact le plus proche du cortex moteur primaire et son voisin antérieur a évoqué une réponse enregistrée sur l’électrode sous-thalamique ipsilatérale. Chez les dix participants enregistrés avec et sans traitement dopaminergique, la première déflexion sous-thalamique survenait en moyenne après 2,6 ± 0,7 ms, les deux conditions étant regroupées. Dans une autre étude, la stimulation de la région sous-thalamique a évoqué des potentiels corticaux de courte latence (2 à 10 ms), compatibles avec une activation antidromique des fibres cortico-sous-thalamiques. Le champ précis de terminaison des fibres issues de la représentation du membre supérieur reste indéterminé chez l’humain. Les autres afférences corticales et les efférences du noyau sous-thalamique restent hors du parcours. Le marquage clairsemé des terminaisons dans la moitié médiale du noyau chez le macaque japonais reste aussi hors du parcours.
    clinical:
      en: The clinical link to hemichorea and hemiballism is partial at the subthalamic endpoint. In two adults, focal haemorrhages in the left and right subthalamic nuclei accompanied abrupt hemiballism on the opposite side. A left subthalamic-region infarct accompanied acute right-sided chorea and ballism in another adult with older ischaemic lesions. A systematic review found subthalamic involvement in 99 of 477 published stroke cases with chorea or ballism. The consequences of selectively interrupting the motor cortical projection remain uncertain.
      fr: Le lien clinique avec l’hémichorée et l’hémiballisme est partiel, au niveau de la cible sous-thalamique. Chez deux adultes, une hémorragie focale du noyau sous-thalamique, gauche chez l’un et droite chez l’autre, s’accompagnait d’un hémiballisme brutal controlatéral. Chez un autre adulte ayant d’anciennes lésions ischémiques, un infarctus de la région sous-thalamique gauche s’accompagnait de mouvements choréiques et balliques aigus à droite. Une revue systématique a relevé une atteinte sous-thalamique dans 99 des 477 cas publiés de chorée ou de ballisme après AVC. Les conséquences d’une interruption sélective de la projection issue du cortex moteur restent indéterminées.
    deficit: hemichorea
    references: [hyperdirect-m1-single-axon, hyperdirect-m1-subthalamic-tracing, hyperdirect-human-tractography, hyperdirect-human-subthalamic-topography, hyperdirect-human-orthodromic-physiology, hyperdirect-human-antidromic-physiology, cortical-parcellation, subthalamic-comparative-anatomy, clinical-noda-subthalamic-2015, clinical-maeda-subthalamic-2018, clinical-etemadifar-subthalamic-2012, clinical-myller-hemichorea-2026]
    clinical_references: [clinical-noda-subthalamic-2015, clinical-maeda-subthalamic-2018, clinical-etemadifar-subthalamic-2012, clinical-myller-hemichorea-2026]
    steps:
      - id: primary-motor-cortex
        region: hcp-mmp:left:8
        source_name: L_4_ROI
        name: { en: Left primary motor cortex, fr: Cortex moteur primaire gauche }
        role: { en: Origin of the corticosubthalamic projection, fr: Origine de la projection cortico-sous-thalamique }
        explanation:
          en: In cynomolgus macaques, anterograde tracer injections centred on layer V mainly sampled the forelimb representation of primary motor cortex. Most reconstructed axons sent collaterals to the subthalamic nucleus from a main branch descending toward the lower brainstem.
          fr: Chez le macaque crabier, les injections de traceur antérograde centrées sur la couche V concernaient surtout la représentation du membre supérieur dans le cortex moteur primaire. La plupart des axones reconstruits émettaient des collatérales vers le noyau sous-thalamique à partir d’une branche principale descendant vers les étages inférieurs du tronc cérébral.
        mapping:
          en: The HCP-MMP parcel outlines area 4 on this cortical surface. The forelimb representation occupies part of that area.
          fr: La parcelle HCP-MMP délimite l’aire 4 sur cette surface corticale. La représentation du membre supérieur n’en occupe qu’une partie.
        view: left
        plane: axial
      - id: dorsolateral-subthalamic
        region: nextbrain:left:316
        source_name: laterodorsal_portion_of_sth
        name: { en: Dorsolateral portion of the left subthalamic nucleus, fr: Portion dorsolatérale du noyau sous-thalamique gauche }
        role: { en: Subthalamic target of the motor projection, fr: Cible sous-thalamique de la projection motrice }
        explanation:
          en: In Japanese macaques, fibres traced from the forelimb representation reached the ipsilateral subthalamic nucleus. Dense terminal labelling occupied the central zone of its lateral half. In cynomolgus macaques, single-axon reconstructions show thin collaterals with boutons along their course in the dorsal part of the nucleus. In five healthy participants, diffusion tractography estimated trajectories to the ipsilateral subthalamic nucleus using the posterior limb of the internal capsule as a required waypoint. Tracking stopped at the surface of the nucleus because of limited image resolution.
          fr: Chez le macaque japonais, les fibres marquées depuis la représentation du membre supérieur atteignaient le noyau sous-thalamique ipsilatéral. Le marquage des terminaisons était dense dans la zone centrale de sa moitié latérale. Chez le macaque crabier, la reconstruction d’axones individuels montre de fines collatérales portant des boutons le long de leur trajet dans la partie dorsale du noyau. Chez cinq volontaires sains, la tractographie de diffusion a estimé des trajectoires vers le noyau sous-thalamique ipsilatéral en imposant leur passage par le bras postérieur de la capsule interne. Le suivi s’arrêtait à la surface du noyau en raison de la résolution limitée des images.
        mapping:
          en: The NextBrain parcel outlines the dorsolateral portion of the nucleus and serves as an approximate landmark for the terminal field traced in macaques. In people with Parkinson’s disease, 7 T diffusion tractography linked a superior posterolateral territory to a combined mask of primary motor, supplementary motor and premotor cortex. That estimated territory partly overlapped the territory linked to associative cortex.
          fr: La parcelle NextBrain délimite la portion dorsolatérale du noyau et sert de repère approximatif pour le champ de terminaison observé chez le macaque. Chez des patients atteints de la maladie de Parkinson, la tractographie de diffusion à 7 T a associé un territoire postérolatéral supérieur à un masque réunissant le cortex moteur primaire, l’aire motrice supplémentaire et le cortex prémoteur. Ce territoire estimé chevauchait en partie celui associé au cortex associatif.
        view: anterior
        plane: axial

  - id: anterior-commissure-temporal
    name: { en: Intertemporal projection through the anterior commissure, fr: Projection intertemporale par la commissure antérieure }
    summary:
      en: Follow a projection between corresponding regions of anterior auditory association cortex in the rhesus macaque. Locate its midline crossing on the human atlas.
      fr: Suivez une projection entre deux territoires homologues du cortex auditif associatif antérieur chez le macaque rhésus. Repérez son passage médian sur l’atlas humain.
    route:
      en: Right rostral auditory association cortex (TA) → right anterior commissure → left anterior commissure (across the midline) → left rostral auditory association cortex (TA)
      fr: Partie antérieure de l’aire auditive associative TA droite → commissure antérieure du côté droit → commissure antérieure du côté gauche (franchissement de la ligne médiane) → partie antérieure de l’aire auditive associative TA gauche
    scope:
      en: The rhesus macaque degeneration study described a projection to the opposite hemisphere. The human atlas illustrates it from right to left. Other anterior commissural branches, callosal auditory projections and other targets of rostral TA fall outside this route.
      fr: L’étude de dégénérescence axonale chez le macaque rhésus a décrit une projection vers l’hémisphère opposé. L’atlas humain l’illustre de droite à gauche. Les autres branches de la commissure antérieure, les projections auditives calleuses et les autres cibles de la partie rostrale de l’aire TA restent hors du parcours.
    clinical:
      en: Pflugshaupt and colleagues compared 55 people with left spatial neglect after a first right-hemisphere stroke with 55 healthy controls. The stroke group gave less plausible numerical estimates of everyday quantities. The right half of the anterior commissure, as defined in the study’s atlas, was one of four regions associated with impaired overall estimation in a separate region-based lesion analysis corrected for multiple comparisons. The effect of a lesion confined to this temporal branch remains unresolved.
      fr: Pflugshaupt et ses collègues ont comparé 55 personnes présentant une négligence spatiale gauche après un premier AVC de l’hémisphère droit à 55 témoins sains. Les personnes ayant subi un AVC donnaient des estimations numériques moins plausibles de grandeurs de la vie courante. Dans une analyse lésionnelle distincte par régions avec correction pour comparaisons multiples, la moitié droite de la commissure antérieure délimitée dans l’atlas de l’étude figurait parmi les quatre régions dont l’atteinte était associée aux difficultés globales d’estimation. L’effet d’une lésion limitée à cette branche temporale reste indéterminé.
    deficit: cognitive-estimation
    references: [anterior-commissure-rostral-ta-1969, anterior-commissure-rostral-ta-reappraisal, anterior-commissure-rostral-ta-case-context, anterior-commissure-superior-temporal-tracing, anterior-commissure-human-dissection, anterior-commissure-human-pallidal-course, cortical-parcellation, clinical-pflugshaupt-2020]
    clinical_references: [clinical-pflugshaupt-2020]
    steps:
      - id: right-rostral-ta
        region: hcp-mmp:right:123
        source_name: R_STGa_ROI
        name: { en: Right anterior superior temporal gyrus, fr: Partie antérieure du gyrus temporal supérieur droit }
        role: { en: Cortical origin of the branch, fr: Origine corticale de la branche }
        explanation:
          en: In the rhesus macaque, TA denotes auditory association cortex on the superior temporal gyrus and supratemporal plane. In the degeneration series, fibres from rostral auditory association cortex crossed mainly through the anterior commissure.
          fr: Chez le macaque rhésus, l’aire TA désigne le cortex auditif associatif du gyrus temporal supérieur et du plan supratemporal. Dans cette série expérimentale, les fibres du cortex auditif associatif rostral franchissaient la ligne médiane principalement par la commissure antérieure.
        mapping:
          en: Human HCP-MMP area STGa lies anterior to Heschl’s gyrus and lateral to area TA2. Its location provides a comparative landmark for the gyral part of the macaque field. The anatomical correspondence between the human parcel and the macaque field remains unresolved.
          fr: Chez l’humain, l’aire STGa du HCP-MMP se situe en avant du gyrus de Heschl et latéralement à l’aire TA2. Sa position fournit un repère comparatif pour la partie gyrale du territoire décrit chez le macaque. La correspondance anatomique entre ces deux territoires reste indéterminée.
        view: right
        plane: coronal
      - id: right-anterior-commissure
        region: nextbrain:right:10130
        source_name: anterior_commissure
        name: { en: Right side of the anterior commissure, fr: Partie droite de la commissure antérieure }
        role: { en: Approach to the midline, fr: Trajet vers la ligne médiane }
        explanation:
          en: In human dissections, the temporal extension of the posterior limb runs through the temporal stem toward the commissural body. Dissections of left human hemispheres place the posterior limb in Gratiolet’s canal below the anterior border of the globus pallidus.
          fr: Dans les dissections humaines, le contingent temporal de la branche postérieure passe par le pédoncule temporal en direction du corps de la commissure. Les dissections d’hémisphères gauches situent la branche postérieure dans le canal de Gratiolet, sous le bord antérieur du globus pallidus.
        mapping:
          en: NextBrain groups this side of the anterior commissure in one label. The label serves as a waypoint for the temporal fibres approaching the midline.
          fr: NextBrain représente ce côté de la commissure antérieure par un seul volume. Il sert de repère sur le trajet des fibres temporales vers la ligne médiane.
        view: anterior
        plane: sagittal
      - id: left-anterior-commissure
        region: nextbrain:left:130
        source_name: anterior_commissure
        name: { en: Left side of the anterior commissure, fr: Partie gauche de la commissure antérieure }
        role: { en: Passage into the left hemisphere, fr: Passage dans l’hémisphère gauche }
        explanation:
          en: The branch crosses the midline between the two atlas landmarks and enters the left hemisphere. In rhesus macaques, autoradiography places fibres from the superior temporal region in the ventral part of the commissure at the midline.
          fr: La branche franchit la ligne médiane entre les deux repères de l’atlas et gagne l’hémisphère gauche. Chez le macaque rhésus, l’autoradiographie situe les fibres issues de la région temporale supérieure dans la partie ventrale de la commissure au niveau du plan médian.
        mapping:
          en: The left NextBrain volume marks the opposite side of the same commissure. The atlas anchor lies lateral to the crossing.
          fr: Le volume NextBrain gauche repère le côté opposé de la même commissure. Le point de repère de l’atlas se situe latéralement au croisement.
        view: anterior
        plane: sagittal
      - id: left-rostral-ta
        region: hcp-mmp:left:123
        source_name: L_STGa_ROI
        name: { en: Left anterior superior temporal gyrus, fr: Partie antérieure du gyrus temporal supérieur gauche }
        role: { en: Contralateral cortical target, fr: Cible corticale controlatérale }
        explanation:
          en: In the same rhesus macaque degeneration series, the corresponding rostral part of TA was a target in the opposite hemisphere. The tour places this target on the left.
          fr: Dans la même série d’expériences chez le macaque rhésus, la partie rostrale homologue de l’aire TA constituait une cible dans l’hémisphère opposé. Le parcours situe cette cible à gauche.
        mapping:
          en: The left STGa parcel is a comparative landmark for the gyral part of the macaque target field. The macaque definition of TA also includes cortex on the supratemporal plane. The location of an equivalent human terminal field remains unresolved by these studies.
          fr: La parcelle STGa gauche sert de repère comparatif pour la partie gyrale du territoire cible chez le macaque. Chez cette espèce, l’aire TA s’étend aussi au plan supratemporal. Ces études laissent indéterminée la localisation d’un champ de terminaison équivalent chez l’humain.
        view: left
        plane: coronal

  - id: slf2-dorsal-frontoparietal
    name: { en: Dorsal frontoparietal branch · SLF II, fr: Branche frontopariétale dorsale · faisceau longitudinal supérieur II }
    summary:
      en: Follow a projection traced in macaques from caudal area 8Ad to area Opt in the posterior inferior parietal lobule. Use two parcels in the right human hemisphere as landmarks for this comparison.
      fr: Suivez une projection mise en évidence par traçage chez le macaque, de la partie caudale de l’aire 8Ad à l’aire Opt de la partie postérieure du lobule pariétal inférieur. Prenez pour repères deux parcelles de l’hémisphère droit dans l’atlas humain.
    route:
      en: Caudal area 8Ad → area Opt via the superior longitudinal fasciculus II (macaque projection shown with right-sided landmarks in the human atlas)
      fr: Partie caudale de l’aire 8Ad → aire Opt par le faisceau longitudinal supérieur II (projection du macaque illustrée par des repères à droite dans l’atlas humain)
    scope:
      en: Human diffusion tractography estimates the broader course of the superior longitudinal fasciculus II between dorsolateral frontal cortex and posterior inferior parietal cortex. The precise endpoints and direction of the corresponding projection in humans remain unresolved. The tour shows two cortical landmarks. The intervening fibres and other branches lie outside the display.
      fr: Chez l’humain, la tractographie de diffusion estime le trajet d’ensemble du faisceau longitudinal supérieur II entre le cortex frontal dorsolatéral et la partie postérieure du cortex pariétal inférieur. Les extrémités précises et le sens de la projection correspondante chez l’humain restent indéterminés. Le parcours montre deux repères corticaux. Les fibres qui les relient et les autres branches ne sont pas affichées.
    clinical:
      en: Chechlacz and colleagues combined published lesion coordinates for left visual neglect. Their analysis of object-centred neglect excluding line bisection found convergence in the right angular gyrus, right temporoparietal junction and region of the right superior longitudinal fasciculus. Thiebaut de Schotten and colleagues studied 58 people in the subacute or chronic phase after stroke in the right middle cerebral artery territory. Chronic left spatial neglect was associated with lesions overlapping the estimated core of the right superior longitudinal fasciculus II in a diffusion MRI atlas, after adjusting for lesion volume and chronic visual field defects. The contribution of the specific projection shown here remains unresolved.
      fr: Chechlacz et ses collègues ont regroupé les coordonnées lésionnelles publiées pour la négligence visuelle gauche. Dans leur analyse de la négligence centrée sur l’objet, qui excluait les épreuves de bissection de lignes, les lésions convergeaient dans le gyrus angulaire droit, la jonction temporopariétale droite et la région du faisceau longitudinal supérieur droit. Thiebaut de Schotten et ses collègues ont étudié 58 personnes en phase subaiguë ou chronique après un AVC dans le territoire de l’artère cérébrale moyenne droite. La négligence spatiale gauche chronique était associée à des lésions recouvrant la partie centrale du faisceau longitudinal supérieur II droit, estimée par un atlas d’IRM de diffusion, après ajustement sur le volume lésionnel et les déficits chroniques du champ visuel. La contribution de la projection précise illustrée ici reste à déterminer.
    deficit: neglect
    references: [arcuate-caudal-prefrontal-tracing, slf2-macaque-route-account, slf2-macaque-pathway, slf3-probabilistic-endpoints, slf3-inferior-parietal-comparative-architectonics, cortical-parcellation, clinical-chechlacz-2012, clinical-thiebaut-de-schotten-slf2-2014]
    clinical_references: [clinical-chechlacz-2012, clinical-thiebaut-de-schotten-slf2-2014]
    steps:
      - id: area-8ad
        region: hcp-mmp:right:68
        source_name: R_8Ad_ROI
        name: { en: Right frontal area 8Ad, fr: Aire frontale 8Ad droite }
        role: { en: Frontal origin of the traced projection, fr: Origine frontale de la projection tracée }
        explanation:
          en: In their later account of macaque tracing, Yeterian and colleagues describe axons from caudal area 8Ad reaching area Opt through the superior longitudinal fasciculus II. The bundle runs deep to the upper lip of the lateral sulcus.
          fr: Dans leur synthèse ultérieure des traçages chez le macaque, Yeterian et ses collègues décrivent des axones issus de la partie caudale de l’aire 8Ad qui atteignent l’aire Opt par le faisceau longitudinal supérieur II. Le faisceau chemine dans la substance blanche en profondeur par rapport à la lèvre supérieure du sillon latéral.
        mapping:
          en: HCP-MMP takes the name 8Ad from comparative architectonic work. The label shows the whole right human parcel.
          fr: La dénomination 8Ad de HCP-MMP vient de travaux d’architectonique comparative. L’étiquette couvre toute la parcelle humaine droite.
        view: right
        plane: coronal
      - id: area-pgp
        region: hcp-mmp:right:143
        source_name: R_PGp_ROI
        name: { en: Right inferior parietal area PGp, fr: Aire pariétale inférieure PGp droite }
        role: { en: Regional landmark for the traced parietal target, fr: Repère régional de la cible pariétale tracée }
        explanation:
          en: Area Opt lies at the caudal end of the macaque inferior parietal lobule. The account by Yeterian and colleagues identifies Opt as one of the parietal territories reached through the superior longitudinal fasciculus II from caudal area 8Ad.
          fr: L’aire Opt se situe à l’extrémité caudale du lobule pariétal inférieur chez le macaque. La synthèse de Yeterian et de ses collègues décrit l’aire Opt comme l’un des territoires pariétaux atteints par des fibres de la partie caudale de l’aire 8Ad empruntant le faisceau longitudinal supérieur II.
        mapping:
          en: A receptor architecture comparison found macaque Opt more similar to human cytoarchitectonic PGp than to PGa. The HCP-MMP parcel is smaller than the cytoarchitectonic PGp and gives a regional landmark for that comparison.
          fr: Les profils de récepteurs de l’aire Opt du macaque étaient plus proches de ceux de l’aire cytoarchitectonique humaine PGp que de ceux de l’aire PGa. La parcelle HCP-MMP est plus petite que l’aire cytoarchitectonique PGp et sert de repère régional pour cette comparaison.
        view: right
        plane: coronal

  - id: inferior-pulvinar-mt
    name: { en: Inferior pulvinar projection to visual area MT, fr: Projection du pulvinar inférieur vers l’aire visuelle MT }
    summary:
      en: Follow a projection from the medial subdivision of the inferior pulvinar to visual area MT identified in macaques. Locate its two endpoints using right-sided landmarks in the human atlas.
      fr: Suivez une projection de la subdivision médiale du pulvinar inférieur vers l’aire visuelle MT mise en évidence chez le macaque. Repérez ses deux extrémités à l’aide de repères de l’hémisphère droit dans l’atlas humain.
    route:
      en: Medial subdivision of the inferior pulvinar → visual area MT (macaque projection shown with right-sided landmarks in the human atlas)
      fr: Subdivision médiale du pulvinar inférieur → aire visuelle MT (projection chez le macaque, illustrée par des repères de l’hémisphère droit dans l’atlas humain).
    scope:
      en: Earlier anatomical tracing found little or no input from the superior colliculus to PIm. Macaque stimulation and recordings identified some relay neurons in PIm and in the adjacent posterior subdivision. The display follows the forward projection from PIm to MT and omits the superior colliculus, other pulvinar subdivisions and cortical feedback. Human diffusion tractography estimated ipsilateral streamlines between pulvinar and MT regions defined by atlas masks. The inferior pulvinar mask includes the whole nucleus. The location of any corresponding human PIm terminals and the direction of transmission remain unresolved.
      fr: Les études anatomiques par traçage avaient mis en évidence peu ou pas d’afférences du colliculus supérieur à la PIm. Chez le macaque, la stimulation et les enregistrements ont permis d’identifier des neurones relais dans la PIm et dans la subdivision postérieure adjacente. Le parcours suit la projection de la PIm vers l’aire MT et laisse de côté le colliculus supérieur, les autres subdivisions du pulvinar et les projections de retour du cortex. Chez l’humain, la tractographie par IRM de diffusion a estimé des trajectoires entre des régions du pulvinar et de l’aire MT du même hémisphère, définies par des masques d’atlas. Le masque du pulvinar inférieur englobe le noyau entier. La localisation des terminaisons humaines correspondantes de la PIm et le sens de transmission restent indéterminés.
    clinical:
      en: The clinical link is partial. L.M. had persistent difficulty perceiving visual motion after bilateral posterior brain injury. A later comparison of her structural MRI with published V5 locations placed much or all of the expected V5 territory within the lesions on both sides. The lesions extended into adjacent cortex and white matter. The effects of damage confined to MT, the inferior pulvinar or its projection to MT remain unknown.
      fr: Le lien clinique est partiel. L.M. présentait un trouble persistant de la perception visuelle du mouvement après des lésions cérébrales postérieures bilatérales. Une comparaison ultérieure de son IRM anatomique avec les localisations publiées de V5 a situé la majeure partie, voire la totalité, du territoire attendu de cette aire dans les lésions des deux hémisphères. Celles-ci s’étendaient au cortex et à la substance blanche adjacents. Les effets d’une lésion circonscrite à l’aire MT, au pulvinar inférieur ou à sa projection vers MT restent indéterminés.
    deficit: akinetopsia
    references: [pulvinar-mt-primate-review, pulvinar-mt-macaque-tracing, pulvinar-mt-macaque-physiology, human-inferior-pulvinar-chemoarchitecture, pulvinar-mt-human-diffusion, visual-motion-human-retinotopy, cortical-parcellation, clinical-zihl-1991, clinical-shipp-1994]
    clinical_references: [clinical-zihl-1991, clinical-shipp-1994]
    steps:
      - id: inferior-pulvinar
        region: nextbrain:right:10519
        source_name: inferior_nucleus_of_pulvinar
        name: { en: Right inferior pulvinar, fr: Pulvinar inférieur droit }
        role: { en: Thalamic origin of the traced projection, fr: Origine thalamique de la projection étudiée }
        explanation:
          en: Retrograde tracers injected into macaque MT labelled neurons in the medial subdivision of the inferior pulvinar (PIm). The injections probably also reached part of the adjacent area FST. Histochemical staining of human tissue identified a region comparable to macaque PIm.
          fr: Des traceurs rétrogrades injectés dans l’aire MT du macaque ont marqué des neurones de la subdivision médiale du pulvinar inférieur (PIm). Les injections ont probablement aussi atteint une partie de l’aire voisine FST. Des colorations histochimiques du tissu humain ont mis en évidence une région comparable à la subdivision PIm du macaque.
        mapping:
          en: The NextBrain label outlines the right inferior pulvinar as a whole. It serves as a regional landmark for the medial subdivision studied in macaques.
          fr: L’étiquette NextBrain délimite l’ensemble du pulvinar inférieur droit. Elle sert de repère régional pour la subdivision médiale étudiée chez le macaque.
        view: posterior
        plane: coronal
      - id: mt
        region: hcp-mmp:right:23
        source_name: R_MT_ROI
        name: { en: Right middle temporal visual area (MT or V5), fr: Aire visuelle temporale moyenne droite (MT ou V5) }
        role: { en: Cortical target of the traced projection, fr: Cible corticale de la projection étudiée }
        explanation:
          en: In macaques, stimulation in MT elicited antidromic responses in pulvinar neurons, identifying axons projecting toward MT. By matching recording sites to stained sections in the right hemisphere of one macaque, the investigators localized some relay neurons from the superior colliculus to MT in PIm and others in the adjacent posterior subdivision, PIp.
          fr: Chez le macaque, la stimulation de l’aire MT a déclenché des réponses antidromiques dans des neurones du pulvinar, révélant leur projection vers cette aire. En reportant les sites d’enregistrement sur les coupes colorées de l’hémisphère droit d’un macaque, les chercheurs ont situé certains neurones relais du colliculus supérieur vers l’aire MT dans la subdivision PIm et d’autres dans la subdivision postérieure voisine, PIp.
        mapping:
          en: The HCP-MMP parcel marks MT within the wider human MT+ complex. It provides a cortical landmark for the macaque target.
          fr: La parcelle HCP-MMP situe MT au sein du complexe MT+ humain, plus étendu. Elle sert de repère cortical pour la cible étudiée chez le macaque.
        view: right
        plane: axial

  - id: rubrospinal-crossed
    name: { en: Rubrospinal descent and crossing, fr: Descente rubrospinale et décussation }
    summary:
      en: Follow the rubrospinal projection from the right red nucleus across the midline to the left upper cervical cord.
      fr: Suivez la projection rubrospinale issue du noyau rouge droit, qui franchit la ligne médiane et descend du côté gauche de la moelle cervicale haute.
    route:
      en: Right red nucleus → left upper cervical rubrospinal tract after the midbrain crossing
      fr: Noyau rouge droit → faisceau rubrospinal gauche dans la moelle cervicale haute après la décussation mésencéphalique
    scope:
      en: In macaques, tracer studies identified the origin and cervical targets of this projection. In a series of ten human anatomical cases, few rubrospinal fibres could be traced into the cord. These were usually traceable only in the upper cervical segments. The crossing, intervening brainstem course and spinal terminations lie outside the displayed landmarks.
      fr: Chez le macaque, les études de traçage ont identifié l’origine et les cibles cervicales de cette projection. Dans une série anatomique de dix cas humains, peu de fibres rubrospinales ont pu être suivies jusque dans la moelle épinière. Leur suivi se limitait généralement aux segments cervicaux supérieurs. La décussation, le trajet intermédiaire dans le tronc cérébral et les terminaisons médullaires ne font pas l’objet de repères distincts.
    clinical:
      en: The link to Holmes tremor is partial. An adult developed a coarse tremor of the left arm at rest, during posture and with action after a right midbrain infarct involving the red nucleus and cerebral peduncle. A second adult had a contralateral tremor with the same components and a cavernoma involving the left red nucleus and adjacent structures. Other reports found lesions near the red nucleus or in different structures. These cases leave the effects of injury confined to the magnocellular subdivision or cervical rubrospinal tract unresolved.
      fr: Le lien avec le tremblement de Holmes est partiel. Une adulte a présenté un tremblement ample du bras gauche au repos, au maintien d’une posture et à l’action après un infarctus du mésencéphale droit touchant le noyau rouge et le pédoncule cérébral. Un autre adulte présentait un tremblement controlatéral avec les mêmes composantes et un cavernome touchant le noyau rouge gauche et des structures voisines. D’autres observations décrivent des lésions près du noyau rouge ou dans d’autres structures. Ces cas laissent indéterminés les effets d’une lésion limitée à la partie magnocellulaire ou au faisceau rubrospinal cervical.
    deficit: holmes-tremor
    references: [rubrospinal-human-anatomy, rubrospinal-macaque-origin, rubrospinal-macaque-cervical, rubrospinal-midbrain-crossing, rubrospinal-red-nucleus-histology, rubrospinal-human-dye-labelling, spinocerebellar-human-tractography, clinical-raina-holmes-tremor-2016, clinical-nieuwhof-holmes-tremor-2020, clinical-genc-holmes-tremor-2017, clinical-adhikari-holmes-tremor-2022, clinical-nsengiyumva-holmes-tremor-2021]
    clinical_references: [clinical-raina-holmes-tremor-2016, clinical-nieuwhof-holmes-tremor-2020, clinical-genc-holmes-tremor-2017, clinical-adhikari-holmes-tremor-2022, clinical-nsengiyumva-holmes-tremor-2021]
    steps:
      - id: red-nucleus
        region: nextbrain:right:10385
        source_name: red_nucleus
        name: { en: Right red nucleus, fr: Noyau rouge droit }
        role: { en: Origin of the crossed spinal projection, fr: Origine de la projection spinale croisée }
        explanation:
          en: In macaques, retrograde tracing from the spinal cord labelled neurons in the magnocellular part of the red nucleus. In human tissue, histology identified small clusters of magnocellular neurons at the caudal edge of the parvocellular part or farther caudally. In a human postmortem study, dye placed in the caudal red nucleus spread into nearby tissue and labelled fibres at the ventral tegmental decussation. The authors described the labelled crossing as a group of rubrobulbar and rubrospinal fibres.
          fr: Chez le macaque, des traceurs rétrogrades injectés dans la moelle épinière ont marqué des neurones de la partie magnocellulaire du noyau rouge. Dans le tissu humain, l’histologie a révélé de petits groupes de neurones magnocellulaires au bord caudal de la partie parvocellulaire ou plus caudalement. Dans une étude post mortem chez l’humain, un colorant déposé dans la partie caudale du noyau rouge a diffusé dans les tissus voisins et a marqué des fibres à la décussation tegmentale ventrale. Les auteurs ont attribué ce marquage à un ensemble de fibres rubrobulbaires et rubrospinales.
        mapping:
          en: NextBrain labels the right red nucleus as one region. It provides a regional landmark for the small magnocellular subdivision.
          fr: NextBrain représente le noyau rouge droit par un seul volume. Celui-ci sert de repère pour la petite subdivision magnocellulaire.
        view: left
        plane: axial
      - id: cervical-tract
        region: pam50:left:rubrospinal-tract
        source_name: left rubrospinal tract
        name: { en: Left cervical rubrospinal tract, fr: Faisceau rubrospinal cervical gauche }
        role: { en: Descent on the left after the crossing, fr: Descente à gauche après la décussation }
        explanation:
          en: Fibres from the right red nucleus cross the midline at the ventral tegmental decussation in the caudal midbrain and descend on the left. In a pilot study of four healthy volunteers, diffusion tractography using a region of interest in the mediocaudal red nucleus estimated a crossed course into the lateral funiculus of the cervical cord. These reconstructions leave the direction of signal travel and the spinal endings of individual axons unresolved. In rhesus macaques, an anterograde tracer injected into the red nucleus labelled terminals in the ventral horn of the cervical enlargement.
          fr: Les fibres issues du noyau rouge droit franchissent la ligne médiane à la décussation tegmentale ventrale du mésencéphale caudal, puis descendent à gauche. Dans une étude pilote menée chez quatre volontaires sains, une tractographie de diffusion utilisant une région d’intérêt dans la partie médiocaudale du noyau rouge a permis d’estimer un trajet croisé jusque dans le cordon latéral de la moelle cervicale. Le sens de propagation des signaux et les terminaisons médullaires des axones restent indéterminés avec cette méthode. Chez le macaque rhésus, un traceur antérograde injecté dans le noyau rouge a marqué des terminaisons dans la corne ventrale du renflement cervical.
        mapping:
          en: The registered PAM50 atlas estimates the location of the left rubrospinal territory in the lateral funiculus. The cord display spans vertebral level C1 through part of C5.
          fr: L’atlas PAM50 recalé sur la moelle situe approximativement le territoire rubrospinal gauche dans le cordon latéral. La portion de moelle affichée s’étend du niveau vertébral C1 jusqu’à une partie de C5.
        view: anterior
        plane: axial

  - id: mediodorsal-prefrontal
    name: { en: Mediodorsal thalamic projection to dorsal prefrontal cortex, fr: Projection du thalamus médiodorsal vers le cortex préfrontal dorsal }
    summary:
      en: Follow a projection from the parvocellular part of the mediodorsal thalamic nucleus to dorsal area 46, identified by tracing in macaques.
      fr: Suivez une projection de la partie parvocellulaire du noyau médiodorsal du thalamus vers la partie dorsale de l’aire 46, mise en évidence par traçage chez le macaque.
    route:
      en: Left parvocellular mediodorsal thalamic nucleus → middle portion of left dorsal area 46
      fr: Partie parvocellulaire du noyau médiodorsal gauche du thalamus → portion moyenne de la partie dorsale de l’aire 46 gauche
    scope:
      en: The two landmarks represent an ipsilateral projection traced in macaques. A human diffusion tractography study used the whole mediodorsal nucleus as its thalamic seed and estimated streamlines connecting it to area 9-46d through the anterior limb of the internal capsule. A separate human tractography study compared four regions of the mediodorsal nucleus defined by diffusion data. The estimated connectivity to area 46 in the Brainnetome atlas was stronger for the dorsal region than for the medial and central regions. The dorsal and lateral estimates did not differ significantly. That study used different boundaries for both the thalamic and cortical regions. The exact course, endpoints and direction of the corresponding human projection remain unresolved. The streamlines drawn are the whole left anterior thalamic radiation, not this projection alone. The tour omits other thalamic inputs to dorsal area 46.
      fr: Les deux repères représentent une projection ipsilatérale mise en évidence par traçage chez le macaque. Une étude de tractographie de diffusion chez l’humain a pris l’ensemble du noyau médiodorsal comme région de départ thalamique et a estimé des trajectoires reliant ce noyau à l’aire 9-46d par le bras antérieur de la capsule interne. Une autre étude de tractographie chez l’humain a comparé quatre territoires du noyau médiodorsal délimités à partir de données de diffusion. La connectivité estimée avec l’aire 46 de l’atlas Brainnetome était plus forte pour le territoire dorsal que pour les territoires médial et central. La différence entre les territoires dorsal et latéral n’atteignait pas le seuil de signification statistique. Cette étude utilisait d’autres délimitations pour les territoires thalamique et cortical. Le trajet précis, les extrémités et le sens de la projection correspondante chez l’humain restent indéterminés. Les trajectoires affichées sont l’ensemble de la radiation thalamique antérieure gauche, et non cette seule projection. Le parcours laisse de côté les autres afférences thalamiques de la partie dorsale de l’aire 46.
    clinical:
      en: The clinical link with anterograde amnesia is partial at the parvocellular mediodorsal stop. In 17 adults tested more than a year after thalamic infarction, recognition of studied picture pairs and cued recall of the paired picture were poorer than in 28 matched healthy controls. Among nine patients with unilateral lesions involving the parvocellular mediodorsal nucleus, greater estimated volume loss there was associated with poorer cued recall. That association pooled left and right lesions and came from regression through the origin; ordinary regression with an intercept was not significant. The lesions also involved other thalamic nuclei, and the contribution of the projection to dorsal prefrontal cortex remains unresolved.
      fr: Le lien clinique avec l’amnésie antérograde est partiel, au niveau du repère médiodorsal parvocellulaire. Chez 17 adultes évalués plus d’un an après un infarctus thalamique, la reconnaissance de paires d’images étudiées et le rappel indicé de l’image associée étaient moins bons que chez 28 témoins sains appariés. Parmi neuf patients présentant une lésion unilatérale touchant le noyau médiodorsal parvocellulaire, une perte de volume estimée plus importante dans ce noyau était associée à un rappel indicé plus faible. Cette association regroupait des lésions gauches et droites et reposait sur une régression passant par l’origine ; une régression ordinaire avec ordonnée à l’origine n’était pas significative. Les lésions touchaient aussi d’autres noyaux thalamiques, et la contribution de la projection vers le cortex préfrontal dorsal reste indéterminée.
    deficit: amnesia
    references: [mediodorsal-prefrontal-macaque-tracing, mediodorsal-prefrontal-human-diffusion, mediodorsal-prefrontal-human-subdivision, mediodorsal-human-transcriptomic-divisions, cortical-parcellation, clinical-pergola-2012]
    clinical_references: [clinical-pergola-2012]
    steps:
      - id: parvocellular-mediodorsal
        region: nextbrain:left:313
        source_name: parvocellular_(central)_division_of_md
        tract: atr-left
        name: { en: Parvocellular division of the left mediodorsal thalamic nucleus, fr: Partie parvocellulaire du noyau médiodorsal gauche du thalamus }
        role: { en: Thalamic source of the projection, fr: Origine thalamique de la projection }
        explanation:
          en: In macaques, retrograde tracer injections into dorsal area 46 labelled neurons mainly in the middle of the dorsal part of the parvocellular division.
          fr: Chez le macaque, les injections de traceur rétrograde dans l’aire 46 dorsale ont surtout marqué des neurones dans la portion moyenne de la partie dorsale de la division parvocellulaire.
        mapping:
          en: The human mediodorsal nucleus is traditionally divided into a medial magnocellular, a lateral-ventral parvocellular and a lateral-dorsal multiform part. In two coronal sections of post-mortem human thalamus, spatial transcriptomics mapped distinct excitatory neuron populations preferentially onto the magnocellular and parvocellular parts. NextBrain labels the whole parvocellular division. The traced neurons were concentrated in a subregion of this division.
          fr: Le noyau médiodorsal humain est classiquement divisé en une partie magnocellulaire médiale, une partie parvocellulaire latéro-ventrale et une partie multiforme latéro-dorsale. Sur deux coupes coronales de thalamus humain post mortem, la transcriptomique spatiale a situé des populations distinctes de neurones excitateurs de préférence dans les parties magnocellulaire et parvocellulaire. NextBrain délimite l’ensemble de la division parvocellulaire. Les neurones marqués se concentraient dans une région de cette division.
        view: anterior
        plane: coronal
      - id: dorsal-prefrontal
        region: hcp-mmp:left:86
        source_name: L_9-46d_ROI
        tract: atr-left
        name: { en: Left dorsolateral prefrontal cortex (9-46d), fr: Cortex préfrontal dorsolatéral gauche (9-46d) }
        role: { en: Cortical target of the traced projection, fr: Cible corticale de la projection mise en évidence par traçage }
        explanation:
          en: In one macaque, a tracer injection in the middle portion of left dorsal area 46 labelled thalamic neurons on the same side. The labelled cell bodies identify the source of fibres projecting to the injected cortical region.
          fr: Chez un macaque, une injection de traceur dans la portion moyenne de l’aire 46 dorsale gauche a marqué des neurones thalamiques du même côté. Les corps cellulaires marqués indiquent l’origine des fibres qui se projettent vers la région corticale injectée.
        mapping:
          en: HCP-MMP area 9-46d lies in the central part of the human dorsolateral prefrontal cortex. It provides a regional comparison for the injection site in the dorsal part of Walker’s area 46 in the macaque.
          fr: L’aire 9-46d de la parcellisation HCP-MMP se situe dans la partie centrale du cortex préfrontal dorsolatéral humain. Elle sert de repère régional pour le site d’injection dans la partie dorsale de l’aire 46 de Walker chez le macaque.
        view: left
        plane: coronal

  - id: dorsal-spinocerebellar
    name: { en: Dorsal spinocerebellar entry into the cerebellum, fr: Entrée cérébelleuse du faisceau spinocérébelleux dorsal }
    summary:
      en: Follow the same-side branch of the dorsal spinocerebellar tract from the inferior cerebellar peduncle to the anterior vermis. The right-sided landmarks illustrate the course described in macaques.
      fr: Suivez la branche ipsilatérale du faisceau spinocérébelleux dorsal du pédoncule cérébelleux inférieur jusqu’au vermis antérieur. Les repères droits illustrent le trajet décrit chez le macaque.
    route:
      en: Restiform body of the right inferior cerebellar peduncle → right part of the anterior cerebellar vermis
      fr: Corps restiforme du pédoncule cérébelleux inférieur droit → partie droite du vermis cérébelleux antérieur
    scope:
      en: The spinal origin and ascent, other cerebellar destinations and fibres that cross within the cerebellum lie outside the tour. Human diffusion tractography estimates the regional course between the inferior cerebellar peduncle and cerebellum. The spinal origins and specific vermal terminal field remain unresolved.
      fr: Le parcours laisse de côté l’origine et l’ascension spinales, les autres cibles cérébelleuses et les fibres qui croisent dans le cervelet. La tractographie de diffusion chez l’humain donne une estimation du trajet régional entre le pédoncule cérébelleux inférieur et le cervelet. L’origine spinale des fibres et leur territoire précis de terminaison dans le vermis restent indéterminés.
    clinical:
      en: The link with cerebellar ataxia is partial. In 21 adults examined 2–56 days after cerebellar infarction, Schoch and colleagues found the strongest association with gait ataxia in vermal lobule III. The associated area extended into vermal and paravermal white matter and the fastigial and interposed nuclei. In a series of 49 adults with acute limb ataxia after isolated unilateral brainstem infarction, Marx and colleagues associated limb ataxia on the side of the lesion with rostral dorsolateral medullary lesions overlapping the inferior cerebellar peduncle and the dorsal and ventral spinocerebellar tracts. Naoi and colleagues observed right-leg ataxia and rightward body lateropulsion in a 69-year-old man. MRI showed an infarct initially limited to the right lateral surface of the lower medulla that had enlarged by day 3. Day-4 motion analysis showed dysmetria during repeated right heel taps on the opposite knee. Finger-to-nose testing was normal. The authors inferred possible involvement of nearby dorsal spinocerebellar fibres. The effects of injury restricted to those fibres remain unresolved.
      fr: Le lien avec l’ataxie cérébelleuse est partiel. Chez 21 adultes examinés de 2 à 56 jours après un infarctus cérébelleux, Schoch et ses collègues ont relevé l’association la plus forte avec l’ataxie de la marche dans le lobule vermien III. La zone associée s’étendait à la substance blanche vermienne et paravermienne ainsi qu’aux noyaux fastigiaux et interposés. Dans une série de 49 adultes présentant une ataxie aiguë des membres après un infarctus unilatéral limité au tronc cérébral, Marx et ses collègues ont associé l’ataxie des membres du côté de la lésion à des lésions dorsolatérales du bulbe rostral chevauchant le pédoncule cérébelleux inférieur et les faisceaux spinocérébelleux dorsal et ventral. Naoi et ses collègues ont observé une ataxie du membre inférieur droit et une latéropulsion vers la droite chez un homme de 69 ans. L’IRM a montré un infarctus initialement limité à la surface latérale droite du bulbe caudal, puis une extension de l’infarctus au troisième jour. Au quatrième jour, l’analyse du mouvement a mis en évidence une dysmétrie lors de contacts répétés du talon droit avec le genou opposé. L’épreuve doigt-nez était normale. Les auteurs ont déduit de la topographie de l’infarctus une possible atteinte des fibres spinocérébelleuses dorsales voisines. Les effets d’une atteinte limitée à ces fibres restent indéterminés.
    deficit: ataxia
    references: [spinocerebellar-cord-course, spinocerebellar-macaque-peduncular-course, dorsal-spinocerebellar-human-tractography, clinical-schoch-2006, clinical-marx-2008, clinical-naoi-2025, cerebellar-organization, dorsal-spinocerebellar-macaque-yoss, spinocerebellar-dorsal-teaching]
    clinical_references: [clinical-schoch-2006, clinical-marx-2008, clinical-naoi-2025]
    steps:
      - id: inferior-peduncle
        region: learning:right:inferior-cerebellar-peduncle
        source_name: Inferior cerebellar peduncle
        tract: icp-right
        name: { en: Right inferior cerebellar peduncle, fr: Pédoncule cérébelleux inférieur droit }
        role: { en: Entry of dorsal spinocerebellar fibres, fr: Entrée des fibres spinocérébelleuses dorsales }
        explanation:
          en: In cats, retrograde tracing after spinal cord or restiform body lesions identified dorsal spinocerebellar fibres from thoracic and upper lumbar levels passing through the restiform body. In one macaque, a lesion targeting the left dorsal tract at C2 produced degeneration that the author followed into the left inferior cerebellar peduncle. The targeted lesion also produced some degeneration in adjacent fibres.
          fr: Chez le chat, le traçage rétrograde après des lésions de la moelle épinière ou du corps restiforme a mis en évidence des fibres spinocérébelleuses dorsales issues des segments thoraciques et lombaires supérieurs qui passent par le corps restiforme. Chez un macaque, une lésion ciblant le faisceau dorsal gauche à hauteur de C2 a entraîné une dégénérescence que l’auteur a suivie jusque dans le pédoncule cérébelleux inférieur gauche. La lésion ciblée a également entraîné une dégénérescence de certaines fibres voisines.
        mapping:
          en: This teaching volume is NextBrain’s outline of the whole right inferior cerebellar peduncle. The dorsal spinocerebellar tract occupies part of this region.
          fr: Ce volume pédagogique reprend le contour de l’ensemble du pédoncule cérébelleux inférieur droit dans NextBrain. Le faisceau spinocérébelleux dorsal n’occupe qu’une partie de ce volume.
        view: posterior
        plane: axial
      - id: anterior-vermis
        region: learning:lobules-i-iv-right
        source_name: Lobules I–IV
        name: { en: Right cerebellar lobules I–IV, fr: Lobules cérébelleux I à IV droits }
        role: { en: Landmark for the same-side anterior vermal terminal field, fr: Repère du territoire de terminaison dans le vermis antérieur du même côté }
        explanation:
          en: After this left-sided lesion, degeneration of dorsal spinocerebellar fibres was greatest in vermal lobules II and III, with fewer fibres reaching lobule IV. The right-sided landmarks mirror the same-side branch documented on the left. A separate macaque study followed degenerating fibres to the anterior vermis, especially the dorsal part of the central lobule and rostral culmen.
          fr: Après cette lésion à gauche, la dégénérescence des fibres spinocérébelleuses dorsales était surtout marquée dans les lobules vermiens II et III et atteignait le lobule IV dans une moindre mesure. Les repères droits illustrent en miroir la branche ipsilatérale observée à gauche. Dans une autre étude chez le macaque, les fibres en dégénérescence ont été suivies jusqu’au vermis antérieur, surtout dans la partie dorsale du lobule central et la partie rostrale du culmen.
        mapping:
          en: CerebNet groups the right hemispheric lobules I–IV with the corresponding part of the anterior vermis, giving a regional landmark for the more restricted vermal field.
          fr: CerebNet regroupe les lobules hémisphériques I à IV droits et la partie correspondante du vermis antérieur. Cette parcelle sert de repère pour le territoire vermien, plus restreint.
        view: superior
        plane: coronal

  - id: mdlf-parietotemporal
    name: { en: Parietotemporal branch · middle longitudinal fasciculus, fr: Branche pariétotemporale · faisceau longitudinal moyen }
    summary:
      en: Follow a projection traced in rhesus macaques from the caudal inferior parietal lobule to the upper bank of the superior temporal sulcus. Use two left-sided landmarks in the human atlas to locate the regions compared.
      fr: Suivez une projection décrite par traçage chez le macaque rhésus, de la partie caudale du lobule pariétal inférieur à la berge supérieure du sillon temporal supérieur. Repérez les régions comparées du côté gauche dans l’atlas humain.
    route:
      en: Caudal inferior parietal lobule (PG–Opt injection region) → area TPO in the upper bank of the superior temporal sulcus via the middle longitudinal fasciculus (ipsilateral projection traced in a rhesus macaque)
      fr: Partie caudale du lobule pariétal inférieur (site d’injection PG–Opt) → aire TPO de la berge supérieure du sillon temporal supérieur, par le faisceau longitudinal moyen (projection ipsilatérale étudiée par traçage chez un macaque rhésus)
    scope:
      en: One human dissection study described fibres of the middle longitudinal fasciculus between the angular gyrus and the superior and middle temporal gyri. A second dissection study found fibres of the fasciculus above the superior temporal sulcus, at the level of the superior part of the angular gyrus. A third dissection study reported superior parietal and occipital endpoints. The exact cortical endpoints and direction of the displayed branch in humans remain unresolved. The tour shows the two cortical landmarks and leaves out the connecting white matter and the other branches.
      fr: Une étude de dissection chez l’humain a décrit des fibres du faisceau longitudinal moyen entre le gyrus angulaire et les gyrus temporaux supérieur et moyen. Une deuxième étude de dissection a situé des fibres du faisceau au-dessus du sillon temporal supérieur, à hauteur de la partie supérieure du gyrus angulaire. Une troisième étude de dissection a décrit des terminaisons dans le lobule pariétal supérieur et le cortex occipital. Les extrémités corticales précises et le sens de la branche illustrée restent indéterminés chez l’humain. Le parcours présente les deux repères corticaux et laisse de côté la substance blanche qui les relie ainsi que les autres branches.
    clinical:
      en: Dronkers and colleagues studied 64 people with chronic left-hemisphere stroke. In their voxelwise analysis, poorer sentence comprehension was associated with lesions in several left-hemisphere regions, including a region spanning the posterior superior temporal sulcus and the angular gyrus. The effect of injury confined to this branch remains unresolved.
      fr: Dronkers et ses collègues ont étudié 64 personnes en phase chronique après un AVC de l’hémisphère gauche. Dans leur analyse voxel par voxel, de moins bons résultats à une épreuve de compréhension de phrases étaient associés à des lésions de plusieurs régions de l’hémisphère gauche, dont une région qui s’étend de la partie postérieure du sillon temporal supérieur au gyrus angulaire. L’effet d’une atteinte limitée à cette branche reste indéterminé.
    deficit: aphasia
    references: [mdlf-macaque-parietotemporal-tracing, slf2-macaque-pathway, mdlf-macaque-temporal-retrograde, mdlf-human-parietal-dissection, mdlf-human-superior-angular-dissection, mdlf-human-dissection-terminations, destrieux-parcellation, clinical-dronkers-2004]
    clinical_references: [clinical-dronkers-2004]
    steps:
      - id: caudal-inferior-parietal
        region: destrieux:left:25
        source_name: G_pariet_inf-Angular
        name: { en: Left angular gyrus, fr: Gyrus angulaire gauche }
        role: { en: Parietal landmark for the source of the traced projection, fr: Repère pariétal de l’origine de la projection tracée }
        explanation:
          en: Autoradiographic tracing in rhesus macaques identified the caudal inferior parietal lobule as the main parietal source of temporal projections in the series. The parietal tracer injection covered caudal area PG and area Opt. Labelled fibres coursed in the middle longitudinal fasciculus within the white matter of the superior temporal gyrus.
          fr: Chez le macaque rhésus, le traçage autoradiographique a situé la principale origine pariétale des projections temporales de la série dans la partie caudale du lobule pariétal inférieur. L’injection pariétale du traceur concernait la partie caudale de l’aire PG et l’aire Opt. Les fibres marquées empruntaient le faisceau longitudinal moyen dans la substance blanche du gyrus temporal supérieur.
        mapping:
          en: Destrieux outlines the human angular gyrus. It serves as a regional landmark for the caudal inferior parietal field traced in macaques.
          fr: Destrieux délimite le gyrus angulaire humain. Celui-ci sert de repère régional pour le territoire pariétal inférieur caudal étudié par traçage chez le macaque.
        view: left
        plane: coronal
      - id: superior-temporal-sulcus
        region: destrieux:left:74
        source_name: S_temporal_sup
        name: { en: Left superior temporal sulcus, fr: Sillon temporal supérieur gauche }
        role: { en: Temporal landmark for the receiving field, fr: Repère temporal du champ cible }
        explanation:
          en: In rhesus macaques, the traced parietal fibres reach area TPO in the upper bank of the superior temporal sulcus. A separate retrograde tracer study found inputs to middle TPO sites from the caudal inferior parietal lobule.
          fr: Chez le macaque rhésus, les fibres pariétales suivies par traçage atteignent l’aire TPO dans la berge supérieure du sillon temporal supérieur. Une autre étude par traçage rétrograde a identifié des afférences du lobule pariétal inférieur caudal vers la partie moyenne de l’aire TPO.
        mapping:
          en: The Destrieux parcel marks the human superior temporal sulcus as a regional comparison for macaque area TPO. It extends beyond the upper-bank target.
          fr: La parcelle de Destrieux délimite le sillon temporal supérieur humain, qui sert de repère régional pour l’aire TPO du macaque. Elle s’étend au-delà du territoire cible de la berge supérieure.
        view: left
        plane: coronal

  - id: septohippocampal-ca1-oriens
    name:
      en: Septohippocampal projection to CA1
      fr: Projection septohippocampique vers CA1
    summary:
      en: Follow a septal input to the stratum oriens of CA1, traced in macaques and rats and illustrated with human landmarks.
      fr: Suivez une afférence septale vers le stratum oriens de CA1, mise en évidence par traçage chez le macaque et le rat et illustrée par des repères humains.
    route:
      en: Medial septal nucleus → CA1 stratum oriens (macaque and rat tracing shown with right-sided human landmarks)
      fr: Noyau septal médial → stratum oriens du champ CA1 (traçages chez le macaque et le rat illustrés par des repères humains du côté droit)
    scope:
      en: The tour shows one origin and one receiving layer of the septohippocampal pathway. It omits the intervening fibres, other hippocampal targets and the return projection from the hippocampus to the septum. Human dissection shows the precommissural fornix reaching the septal nuclei in front of the anterior commissure. A human diffusion tractography study used a septal region and the crus of the fornix to estimate precommissural streamlines and placed the highest-probability hippocampal point in CA1. The direction and receiving layer of a corresponding human projection remain unresolved.
      fr: Le parcours montre une origine et une couche cible de la voie septohippocampique. Il laisse de côté les fibres intermédiaires, les autres cibles hippocampiques et la projection de retour de l’hippocampe vers le septum. Chez l’humain, la dissection montre que le fornix précommissural rejoint les noyaux septaux en avant de la commissure antérieure. Une étude humaine de tractographie par IRM de diffusion a utilisé une région septale et le pilier postérieur du fornix pour estimer les trajectoires précommissurales et a situé dans CA1 le point de plus forte probabilité au niveau de l’hippocampe. Le sens et la couche cible d’une projection correspondante chez l’humain restent indéterminés.
    clinical:
      en: The clinical link is partial. In a neuropathological series, one adult with enduring amnesia had medial septal cell loss alongside extensive hippocampal injury. Another had gliosis in CA1 stratum oriens and radiatum alongside extensive bilateral loss of CA1 pyramidal cells. After clipping of an unruptured anterior communicating artery aneurysm, a separate patient developed predominantly anterograde amnesia. MRI showed a lesion centred on the right diagonal band of Broca, extending into the septal region and anterior hypothalamus, with patchy injury on the left. In a series of ten adults selected for amnesia after treatment of an anterior communicating artery aneurysm, infarcts involved the fornix columns in all ten and the diagonal band in five. Clip artefact obscured the diagonal band on both sides in one patient, and the series had no non-amnesic comparison group. The cases link amnesia to injuries involving the landmark regions. The effect of selectively injuring this projection remains unresolved.
      fr: Le lien clinique est partiel. Dans une série anatomoclinique, un adulte présentant une amnésie durable avait une perte neuronale dans les noyaux septaux médiaux associée à une atteinte hippocampique étendue. Chez un autre patient, une gliose du stratum oriens et du stratum radiatum de CA1 accompagnait une perte bilatérale étendue des cellules pyramidales de CA1. Un autre patient a présenté une amnésie à prédominance antérograde après le clippage d’un anévrisme non rompu de l’artère communicante antérieure. L’IRM montrait une lésion centrée sur la bande diagonale de Broca droite, étendue à la région septale et à l’hypothalamus antérieur, ainsi qu’une atteinte en plages à gauche. Dans une série de dix adultes sélectionnés pour une amnésie après traitement d’un anévrisme de l’artère communicante antérieure, les infarctus touchaient les colonnes du fornix chez les dix patients et la bande diagonale chez cinq. Un artéfact lié au clip masquait la bande diagonale des deux côtés chez un patient et la série ne comprenait aucun groupe comparatif non amnésique. Ces cas associent l’amnésie à des lésions qui intéressent les régions représentées par les repères. L’effet d’une atteinte sélective de cette projection reste indéterminé.
    deficit: amnesia
    references: [septohippocampal-gulyas-1991, septohippocampal-amaral-cowan-1980, septohippocampal-nyakas-1987, septohippocampal-muller-remy-2018, septohippocampal-butler-human-septal-2014, septohippocampal-gonzalez-arnay-human-ca1-2024, septohippocampal-barany-human-dissection-2024, septohippocampal-jang-yeo-human-diffusion-2017, clinical-rempel-clower-1996, clinical-abe-basal-forebrain-1998, clinical-mugikura-basal-forebrain-2014]
    clinical_references: [clinical-rempel-clower-1996, clinical-abe-basal-forebrain-1998, clinical-mugikura-basal-forebrain-2014]
    steps:
      - id: medial-septal-nucleus
        region: nextbrain:right:10103
        source_name: medial_septal_nucleus
        name: { en: Right medial septal nucleus, fr: Noyau septal médial droit }
        role: { en: Septal origin, fr: Origine septale }
        explanation:
          en: In rhesus macaques, anterograde tracer injections involving the medial septal nucleus labelled fibres in the hippocampus. The most strongly labelled case had an injection that also involved the lateral septal nucleus. In a separate study in cynomolgus macaques, retrograde tracing from the hippocampal formation labelled cells in the medial septal nucleus on the same side.
          fr: Chez le macaque rhésus, des injections de traceur antérograde intéressant le noyau septal médial ont marqué des fibres dans l’hippocampe. Chez l’animal dont le marquage était le plus net, une injection intéressait aussi le noyau septal latéral. Dans une autre étude chez le macaque crabier, le traçage rétrograde à partir de la formation hippocampique a marqué des neurones dans le noyau septal médial du même côté.
        mapping:
          en: Human histology distinguishes the medial septal nucleus from the adjacent diagonal band. The atlas shows the whole right medial septal nucleus.
          fr: L’histologie humaine distingue le noyau septal médial de la bande diagonale adjacente. L’atlas montre l’ensemble du noyau septal médial droit.
        view: left
        plane: coronal
      - id: ca1-stratum-oriens
        region: nextbrain:right:10346
        source_name: stratum_oriens_of_rostral_ca1
        name: { en: Stratum oriens of right rostral CA1, fr: Stratum oriens du champ CA1 droit à son niveau rostral }
        role: { en: Receiving layer in animal tracing, fr: Couche cible repérée par traçage chez l’animal }
        explanation:
          en: In rhesus macaques, anterograde tracing labelled septal fibres in CA1 stratum oriens. Light microscopy showed labelled fibres apposed to parvalbumin-positive non-pyramidal cells in this layer. In rats, anterograde tracer injected into the lateral part of the medial septal nucleus labelled fibres in ventral CA1 stratum oriens.
          fr: Chez le macaque rhésus, le traçage antérograde a mis en évidence des fibres septales dans le stratum oriens de CA1. En microscopie optique, des fibres marquées étaient en apposition à des cellules non pyramidales positives pour la parvalbumine dans cette couche. Chez le rat, une injection de traceur antérograde dans la partie latérale du noyau septal médial a marqué des fibres dans le stratum oriens de la partie ventrale de CA1.
        mapping:
          en: Human histology identifies the CA1 stratum oriens. The atlas shows one rostral example of this layer. The precise rostrocaudal level of the macaque labelling remains unresolved.
          fr: L’histologie humaine identifie le stratum oriens de CA1. L’atlas en montre un exemple dans la partie rostrale du champ. Le niveau rostrocaudal précis du marquage chez le macaque reste indéterminé.
        view: left
        plane: coronal

  - id: valuation
    name: { en: Comparing area 25 and the ventral pallidal relay, fr: Comparaison de l’aire 25 et du relais pallidal ventral }
    summary:
      en: Follow a cortical projection identified in macaques and a pallidal relay identified in mice, using corresponding landmarks in the human atlas.
      fr: Suivez une projection corticale décrite chez le macaque et un relais pallidal décrit chez la souris, à l’aide des repères correspondants dans l’atlas humain.
    route:
      en: Left area 25 → left accumbens core → left ventral pallidum → left ventral tegmental area
      fr: Aire 25 gauche → cœur du noyau accumbens gauche → pallidum ventral gauche → aire tegmentale ventrale gauche
    scope:
      en: The human atlas shows four left-sided regional landmarks. Macaque tracing identified the connection from area 25 to the accumbens core. Mouse tracing identified the relay from the core through the ventral pallidum to the ipsilateral ventral tegmental area. The continuity of the full sequence within one species and its presence in humans remain unresolved by these studies. The displayed route ends at the ventral tegmental area and leaves out the accumbens shell and the pallidal projection to the lateral habenula.
      fr: L’atlas humain montre quatre repères régionaux du côté gauche. Le traçage chez le macaque a mis en évidence la connexion entre l’aire 25 et le cœur du noyau accumbens. Le traçage chez la souris a mis en évidence un relais du cœur du noyau accumbens vers l’aire tegmentale ventrale ipsilatérale par le pallidum ventral. Ces études laissent ouverte la question de la continuité du parcours complet au sein d’une même espèce et de sa présence chez l’humain. Le parcours présenté s’arrête à l’aire tegmentale ventrale et laisse de côté la coquille du noyau accumbens et la projection pallidale vers l’habénula latérale.
    clinical:
      en: Adults with bilateral ventromedial prefrontal lesions scored lower in a comparison pooled across three versions of the Iowa Gambling Task. Another analysis of the same Iowa registry associated lower scores with predominantly left ventromedial prefrontal injury, and a Philadelphia series found poorer performance after ventromedial or dorsolateral frontal damage. The contribution of area 25 and the remaining landmarks to the task remains unresolved.
      fr: Des adultes ayant des lésions préfrontales ventromédianes bilatérales obtenaient des scores plus faibles dans une comparaison groupant trois versions de la tâche de jeu de l’Iowa. Une autre analyse du même registre de l’Iowa a associé de moins bons scores à une atteinte préfrontale ventromédiane prédominant à gauche, et une série de Philadelphie a montré des résultats plus faibles après une atteinte frontale ventromédiane ou dorsolatérale. La contribution de l’aire 25 et des autres repères à l’épreuve reste indéterminée.
    deficit: decision-making
    references: [valuation-area25-core-tracing, valuation-area25-efferents, olfactory-orbitofrontal-human-architecture, cortical-parcellation, valuation-pallidal-tracing, control-lesions, decision-qualifier, decision-adult-igt]
    clinical_references: [control-lesions, decision-qualifier, decision-adult-igt]
    steps:
      - id: ventromedial
        region: hcp-mmp:left:164
        source_name: L_25_ROI
        name: { en: Left area 25, fr: Aire 25 gauche }
        role: { en: Subgenual cortical origin, fr: Origine corticale sous-génuale }
        explanation:
          en: In macaques, infralimbic area 25 projects to the accumbens core. Retrograde tracer injections in the core labeled neurons in area 25.
          fr: Chez le macaque, l’aire infralimbique 25 se projette vers le cœur du noyau accumbens. Des injections de traceur rétrograde dans le cœur ont marqué des neurones de l’aire 25.
        mapping:
          en: The HCP-MMP parcel delineates human area 25 beneath the genu of the corpus callosum for comparison with macaque area 25.
          fr: La parcelle HCP-MMP délimite l’aire 25 humaine sous le genou du corps calleux, pour la comparer à l’aire 25 du macaque.
        view: right
        plane: sagittal
      - id: accumbens
        region: nextbrain:left:101
        source_name: core_of_nucleus_accumbens
        name: { en: Left nucleus accumbens core, fr: Cœur du noyau accumbens gauche }
        role: { en: Ventral striatal relay, fr: Relais striatal ventral }
        explanation:
          en: In mice, some neurons in the accumbens core directly innervate ventral pallidal neurons that project to the ventral tegmental area.
          fr: Chez la souris, des neurones du cœur du noyau accumbens innervent directement des neurones du pallidum ventral qui se projettent vers l’aire tegmentale ventrale.
        mapping:
          en: The NextBrain label shows the human accumbens core as an anatomical compartment.
          fr: La parcelle NextBrain représente le cœur du noyau accumbens humain comme un compartiment anatomique.
        view: anterior
        plane: coronal
      - id: ventral-pallidum
        region: nextbrain:left:120
        source_name: ventral_pallidus
        name: { en: Left ventral pallidum, fr: Pallidum ventral gauche }
        role: { en: Pallidal relay to the midbrain, fr: Relais pallidal vers le mésencéphale }
        explanation:
          en: In mice, the pallidal neurons traced in this relay express dopamine D3 receptors and project to the ventral tegmental area on the same side.
          fr: Chez la souris, les neurones pallidaux tracés dans ce relais expriment le récepteur dopaminergique D3 et projettent vers l’aire tegmentale ventrale du même côté.
        mapping:
          en: NextBrain delineates the human ventral pallidum as a regional landmark for this projection-defined cell population.
          fr: NextBrain délimite le pallidum ventral humain, qui sert de repère régional pour cette population de neurones définie par sa projection.
        view: anterior
        plane: coronal
      - id: vta
        region: nextbrain:left:435
        source_name: ventral_tegmental_area
        name: { en: Left ventral tegmental area, fr: Aire tegmentale ventrale gauche }
        role: { en: Midbrain target of the pallidal projection, fr: Cible mésencéphalique de la projection pallidale }
        explanation:
          en: In mouse brain slices, stimulating the axon terminals of pallidal neurons expressing dopamine D3 receptors evoked inhibitory postsynaptic currents in some ventral tegmental neurons.
          fr: Dans des coupes de cerveau de souris, la stimulation des terminaisons axonales de neurones pallidaux exprimant le récepteur dopaminergique D3 a déclenché des courants postsynaptiques inhibiteurs dans certains neurones de l’aire tegmentale ventrale.
        mapping:
          en: The NextBrain label delineates the human ventral tegmental area at the regional scale.
          fr: La parcelle NextBrain délimite l’aire tegmentale ventrale humaine à l’échelle régionale.
        view: anterior
        plane: axial

  - id: associative-frontocaudate
    name: { en: Associative corticostriatal projection to the caudate head, fr: Projection corticostriatale associative vers la tête du noyau caudé }
    summary:
      en: Follow a focal projection from rostral prefrontal area 46 to the head of the caudate nucleus, mapped by tracing in macaques.
      fr: Suivez une projection focale de la partie rostrale de l’aire préfrontale 46 vers la tête du noyau caudé, mise en évidence par traçage chez le macaque.
    route:
      en: Rostral part of left prefrontal area 46 → central and medial parts of the left caudate head
      fr: Partie rostrale de l’aire préfrontale 46 gauche → parties centrale et médiale de la tête du noyau caudé gauche
    scope:
      en: This is the initial corticostriatal segment of an associative basal ganglia loop. The left atlas landmarks illustrate an ipsilateral projection traced in macaques. Human diffusion tractography estimated connections between the rostral middle frontal gyrus and the caudate nucleus in each hemisphere. The precise human terminal field remains unresolved. The tour omits the intervening white matter, more caudal terminal fields, diffuse striatal projections and later basal ganglia relays.
      fr: Cette projection constitue le segment corticostriatal initial d’une boucle associative des noyaux gris centraux. Les repères gauches de l’atlas illustrent une projection ipsilatérale mise en évidence par traçage chez le macaque. Chez l’humain, la tractographie de diffusion a estimé des connexions entre la partie rostrale du gyrus frontal moyen et le noyau caudé dans chaque hémisphère. Le territoire précis des terminaisons chez l’humain reste indéterminé. Le parcours laisse de côté la substance blanche intermédiaire, les territoires de terminaison plus caudaux, les projections striatales diffuses et les relais suivants des noyaux gris centraux.
    clinical:
      en: The clinical link with working memory is partial and rests on evidence at the scale of the caudate head. A group of seven veterans with focal left dorsolateral prefrontal lesions scored lower than uninjured veterans on a task that required reordering letters and numbers from memory. Lesion overlap in that group peaked in Brodmann area 9. The focal lesion groups had no reliable deficits on forward span or N-back tasks. In a separate study of 61 people with acute stroke, damage to the right caudate head was associated with a greater decline in hit rate corrected for false alarms when patients had to remember five visual locations instead of three in trials without distractors. The lesion maps also implicated the right inferior frontal gyrus, insula and frontal white matter. The caudate-head result concerned the right hemisphere. The tour illustrates the left hemisphere. These studies leave the effects of selective injury to this projection unresolved.
      fr: Le lien clinique avec la mémoire de travail est partiel et repose sur des données à l’échelle de la tête du noyau caudé. Un groupe de sept anciens combattants présentant des lésions focales du cortex préfrontal dorsolatéral gauche a obtenu des scores inférieurs à ceux des témoins sans lésion cérébrale à une épreuve où il fallait remettre en ordre, de mémoire, des lettres et des chiffres. Dans ce groupe, le chevauchement des lésions était maximal dans l’aire 9 de Brodmann. Les groupes présentant des lésions focales ne présentaient pas de déficit fiable aux épreuves d’empan direct ou aux tâches N-back. Dans une autre étude menée chez 61 personnes en phase aiguë d’un AVC, une lésion de la tête du noyau caudé droit était associée à une baisse plus marquée du taux de détection corrigé des fausses alarmes lorsqu’il fallait retenir cinq positions visuelles au lieu de trois, dans des essais sans distracteurs. La cartographie lésionnelle impliquait aussi le gyrus frontal inférieur, l’insula et la substance blanche frontale du côté droit. Le résultat concernant la tête du noyau caudé portait sur l’hémisphère droit. Le parcours illustre l’hémisphère gauche. Les effets d’une lésion sélective de cette projection restent indéterminés.
    deficit: working-memory
    references: [frontocaudate-macaque-tracing, frontocaudate-rhesus-topography, frontocaudate-comparative-cytoarchitecture, cortical-parcellation, clinical-barbey-working-memory-2013, clinical-baier-working-memory-2010, frontocaudate-associative-teaching, frontocaudate-human-tractography]
    clinical_references: [clinical-barbey-working-memory-2013, clinical-baier-working-memory-2010]
    steps:
      - id: rostral-area-46
        region: hcp-mmp:left:84
        source_name: L_46_ROI
        name: { en: Left prefrontal area 46, fr: Aire préfrontale 46 gauche }
        role: { en: Cortical origin of the traced projection, fr: Origine corticale de la projection tracée }
        explanation:
          en: In adult macaques, anterograde tracer injections in rostral area 46 labelled terminals in the caudate nucleus.
          fr: Chez des macaques adultes, des injections de traceurs antérogrades dans la partie rostrale de l’aire 46 ont marqué des terminaisons dans le noyau caudé.
        mapping:
          en: Comparative cytoarchitecture supports using the whole human HCP-MMP area 46 as an approximate landmark for the sampled rostral site in the macaque.
          fr: La cytoarchitecture comparée permet d’utiliser l’ensemble de l’aire 46 humaine de la parcellisation HCP-MMP comme repère approximatif du site rostral étudié chez le macaque.
        view: left
        plane: coronal
      - id: caudate-head
        region: nextbrain:left:48
        source_name: head_of_caudate
        name: { en: Head of the left caudate nucleus, fr: Tête du noyau caudé gauche }
        role: { en: Striatal target of the traced projection, fr: Cible striatale de la projection tracée }
        explanation:
          en: At rostral levels, the macaque tracer study located dense terminal patches in the central and medial parts of the caudate.
          fr: Aux niveaux rostraux, le traçage chez le macaque a mis en évidence des amas denses de terminaisons dans les parties centrale et médiale du noyau caudé.
        mapping:
          en: NextBrain represents the whole caudate head. The focal terminal patches occupied part of the rostral caudate in the macaque.
          fr: NextBrain représente l’ensemble de la tête du noyau caudé. Chez le macaque, les amas de terminaisons occupaient une partie du noyau caudé rostral.
        view: anterior
        plane: coronal

  - id: olivocerebellar-flocculus
    name: { en: Olivocerebellar input to the flocculus, fr: Afférences olivocérébelleuses du flocculus }
    summary:
      en: Follow the final part of a climbing-fibre projection traced in rabbits. Two left-sided landmarks in the human atlas mark its course after the medullary crossing, from the inferior cerebellar peduncle to the flocculus.
      fr: Suivez la partie terminale d’une projection de fibres grimpantes mise en évidence par traçage chez le lapin. Deux repères à gauche dans l’atlas humain situent son trajet après le croisement bulbaire, du pédoncule cérébelleux inférieur au flocculus.
    route:
      en: Left inferior cerebellar peduncle (restiform region) → left cerebellar flocculus
      fr: Pédoncule cérébelleux inférieur gauche (région du corps restiforme) → flocculus cérébelleux gauche
    scope:
      en: In the orientation shown, the projection starts in the right inferior olive and crosses the medullary midline before reaching the left inferior cerebellar peduncle. The atlas has no drawable labels for the olivary subregions that supply the flocculus or for the crossing. The tour ends in the floccular cortex.
      fr: Le trajet illustré part de l’olive inférieure droite et croise la ligne médiane du bulbe rachidien avant d’atteindre le pédoncule cérébelleux inférieur gauche. L’atlas n’offre pas de repère affichable pour les sous-régions olivaires qui projettent vers le flocculus ni pour le croisement. Le parcours s’arrête dans le cortex du flocculus.
    clinical:
      en: The clinical link is partial at the flocculus. A 67-year-old man with an acute infarct confined on MRI to the right flocculus had spontaneous right-beating nystagmus on video-oculography. It increased in right gaze and reversed briefly on left gaze. The spontaneous nystagmus resolved by day 11, and a small rebound on return from left gaze remained visible up to the fourth week. The lesion involved the right flocculus, the counterpart of the tour’s left-sided landmark. Vestibular abnormalities accompanied the acute change in gaze holding, and the contribution of the flocculus’s olivary input remains unresolved.
      fr: Le lien clinique est partiel au niveau du flocculus. Chez un homme de 67 ans avec infarctus aigu limité au flocculus droit à l’IRM, la vidéo-oculographie a mis en évidence un nystagmus spontané battant à droite. Il s’accentuait dans le regard à droite et s’inversait brièvement dans le regard à gauche. Le nystagmus spontané avait disparu au onzième jour, et un faible nystagmus de rebond au retour depuis le regard à gauche restait visible jusqu’à la quatrième semaine. La lésion touchait le flocculus droit, homologue du repère gauche du parcours. Des anomalies vestibulaires accompagnaient la perturbation aiguë du maintien du regard, et la contribution des afférences olivaires du flocculus reste indéterminée.
    deficit: gaze-evoked-nystagmus
    references: [olivocerebellar-rabbit-floccular-course, olivocerebellar-macaque-floccular-origins, olivocerebellar-human-peduncle-pathology, clinical-yacovino-2018]
    clinical_references: [clinical-yacovino-2018]
    steps:
      - id: inferior-peduncle
        region: learning:left:inferior-cerebellar-peduncle
        source_name: Inferior cerebellar peduncle
        tract: icp-left
        name: { en: Left inferior cerebellar peduncle, fr: Pédoncule cérébelleux inférieur gauche }
        role: { en: Passage for crossed olivocerebellar fibres, fr: Passage des fibres olivocérébelleuses croisées }
        explanation:
          en: In rabbits, an injection that included the caudal dorsal cap labelled fibres crossing the midline and following the opposite restiform body toward the flocculus. An injection that included the rostral medial accessory olive labelled fibres through the ventromedial restiform body and into the caudal flocculus. In one human pathology report, the ventromedial inferior cerebellar peduncle opposite the affected olive showed degeneration and the juxtarestiform body was spared.
          fr: Chez le lapin, une injection intéressant la partie caudale de la coiffe dorsale a marqué des fibres qui croisaient la ligne médiane et longeaient le corps restiforme opposé vers le flocculus. Une injection intéressant la partie rostrale de l’olive accessoire médiale a marqué des fibres qui traversaient la partie ventromédiale du corps restiforme et gagnaient la partie caudale du flocculus. Dans une étude anatomopathologique humaine, la partie ventromédiale du pédoncule cérébelleux inférieur opposé à l’olive atteinte présentait une dégénérescence et le corps juxtarestiforme était épargné.
        mapping:
          en: This teaching volume is NextBrain’s parcel for the whole left inferior cerebellar peduncle. The restiform region occupies part of this parcel.
          fr: Ce volume pédagogique reprend la parcelle de NextBrain qui représente l’ensemble du pédoncule cérébelleux inférieur gauche. La région du corps restiforme occupe une partie de cette parcelle.
        view: posterior
        plane: axial
      - id: flocculus
        region: learning:lobule-x-left
        source_name: Lobule X (flocculus)
        name: { en: Left cerebellar flocculus, fr: Flocculus cérébelleux gauche }
        role: { en: Cortical target of the climbing fibres, fr: Cible corticale des fibres grimpantes }
        explanation:
          en: Retrograde tracing in macaques identified the dorsal cap as the main source of olivary input to the flocculus and the medial accessory olive as a smaller source. In rabbits, labelled fibres entered the floccular white matter and terminated as climbing fibres on Purkinje cells in the molecular layer.
          fr: Chez le macaque, le traçage rétrograde a identifié la coiffe dorsale comme principale source des afférences olivaires du flocculus et l’olive accessoire médiale comme source secondaire. Chez le lapin, les fibres marquées pénétraient dans la substance blanche du flocculus et se terminaient sous forme de fibres grimpantes sur les cellules de Purkinje dans la couche moléculaire.
        mapping:
          en: The Learning atlas uses the CerebNet left flocculus label for the entire lobule. The cortical layers and terminal zones are finer than this parcel.
          fr: L’atlas pédagogique reprend l’étiquette du flocculus gauche de CerebNet pour l’ensemble du lobule. Les couches corticales et les zones de terminaison sont des subdivisions plus fines que cette parcelle.
        view: inferior
        plane: axial

  - id: basal-amygdala-area25
    name: { en: Basal amygdalar projection to subgenual area 25, fr: Projection du noyau basal de l’amygdale vers l’aire 25 sous-génuale }
    summary:
      en: Follow a direct projection from the basal nucleus of the amygdala to subgenual area 25, traced in macaques and illustrated with human atlas landmarks.
      fr: Suivez une projection directe du noyau basal de l’amygdale vers l’aire 25 sous-génuale, mise en évidence par traçage chez le macaque et illustrée par des repères de l’atlas humain.
    route:
      en: Left basal nucleus of the amygdala → left subgenual area 25
      fr: Noyau basal de l’amygdale gauche → aire 25 sous-génuale gauche
    scope:
      en: The two left-sided landmarks illustrate a same-side projection traced in macaques. Human diffusion tractography estimates a ventral amygdalofugal fibre field in the white matter beside area 25. The exact course of the traced branch and the endpoints and direction of a corresponding human projection remain unresolved. The tour leaves out the intervening white matter, the input from the accessory basal nucleus and other cortical targets.
      fr: Les deux repères gauches illustrent une projection ipsilatérale mise en évidence par traçage chez le macaque. Chez l’humain, la tractographie de diffusion estime le trajet de fibres de la voie amygdalofuge ventrale dans la substance blanche adjacente à l’aire 25. Le trajet précis de la branche mise en évidence par traçage ainsi que l’origine, la terminaison et le sens d’une projection correspondante chez l’humain restent indéterminés. Le parcours laisse de côté la substance blanche intermédiaire, les afférences issues du noyau basal accessoire et les autres cibles corticales.
    clinical:
      en: The clinical link is partial at the basal amygdala. A 51-year-old woman with ongoing epilepsy, tested years after partial bilateral amygdalotomy, had difficulty matching and labelling photographed facial expressions compared with 20 age-matched healthy controls. MRI showed injury involving the left basal nuclear group, smaller right amygdalar lesions and damage to neighbouring structures. Later reports on the same patient do not replicate the finding independently. The contribution of area 25 and of this projection remains unresolved.
      fr: Le lien clinique est partiel au niveau de l’amygdale basale. Une femme de 51 ans présentant une épilepsie persistante, évaluée plusieurs années après une amygdalotomie bilatérale partielle, avait du mal à apparier et à identifier des expressions faciales photographiées, comparativement à 20 témoins sains appariés sur l’âge. L’IRM montrait une atteinte du groupe nucléaire basal gauche, des lésions amygdaliennes droites plus petites et des lésions de structures voisines. Les publications ultérieures sur la même patiente ne reproduisent pas ce résultat de façon indépendante. La contribution de l’aire 25 et de cette projection reste indéterminée.
    deficit: emotion-recognition
    references: [basal-amygdala-area25-sharma, basal-amygdala-area25-aggleton, amygdalofugal-folloni, cortical-parcellation, clinical-young-1995-amygdalotomy]
    clinical_references: [clinical-young-1995-amygdalotomy]
    steps:
      - id: basal-amygdala
        region: nextbrain:left:216
        source_name: basolateral_nucleus_(basal_nucleus)
        name: { en: Left basal nucleus of the amygdala, fr: Noyau basal de l’amygdale gauche }
        role: { en: Amygdalar origin of the projection, fr: Origine amygdalienne de la projection }
        explanation:
          en: In a cynomolgus macaque, a retrograde tracer injection confined to caudal area 25 labelled neurons in the intermediate division of the basal nucleus and in the magnocellular division of the accessory basal nucleus.
          fr: Chez un macaque crabier, une injection de traceur rétrograde limitée à la partie caudale de l’aire 25 a marqué des neurones dans la partie intermédiaire du noyau basal et dans la partie magnocellulaire du noyau basal accessoire.
        mapping:
          en: NextBrain displays the whole human basal nucleus under the name basolateral nucleus. The whole nucleus serves as a regional landmark for the intermediate division traced in macaques.
          fr: NextBrain représente le noyau basal humain dans son ensemble sous le nom de noyau basolatéral. Ce volume sert de repère pour la partie intermédiaire étudiée par traçage chez le macaque.
        view: right
        plane: coronal
      - id: subgenual-area25
        region: hcp-mmp:left:164
        source_name: L_25_ROI
        name: { en: Left subgenual area 25, fr: Aire 25 sous-génuale gauche }
        role: { en: Subgenual cortical target, fr: Cible corticale sous-génuale }
        explanation:
          en: In macaques, tracer injections confined to the intermediate division of the basal nucleus labelled fibres in area 25. Labelled terminals were seen in its superficial layers.
          fr: Chez le macaque, des injections de traceur limitées à la partie intermédiaire du noyau basal ont marqué des fibres dans l’aire 25. Des terminaisons marquées ont été observées dans ses couches superficielles.
        mapping:
          en: The HCP-MMP parcel marks human area 25 beneath the genu of the corpus callosum for comparison with macaque area 25.
          fr: La parcelle HCP-MMP délimite l’aire 25 humaine sous le genou du corps calleux, pour la comparer à l’aire 25 du macaque.
        view: right
        plane: sagittal

  - id: dentate-thalamo-putamen
    name: { en: Crossed dentate–putamen pathway, fr: Voie dentato-putaminale croisée }
    summary:
      en: Follow a cerebellar output branch from the left dentate nucleus through the right thalamus to the right putamen.
      fr: Suivez une voie efférente du cervelet qui relie le noyau dentelé gauche au putamen droit par le thalamus droit.
    route:
      en: Left dentate nucleus → crossing to the right thalamus → right putamen
      fr: Noyau dentelé gauche → décussation vers le thalamus droit → putamen droit
    scope:
      en: Macaque tracing links the dentate nucleus to the opposite putamen through a thalamic relay, across two synapses. In humans, diffusion tractography reconstructed streamlines from the dentate to the opposite putamen using the contralateral thalamus as a required waypoint. These streamlines passed through the superior cerebellar peduncle and crossed in the midbrain. The authors report that these estimated trajectories passed mainly through the centromedian region. Diffusion tractography cannot identify the thalamic neurons that relay to the putamen. The peduncle and crossing have no separate stops here. The precise relay cells and putaminal endings of the human pathway remain unresolved. The tour ends at the putamen, before any pallidal relay.
      fr: Chez le macaque, le traçage anatomique relie le noyau dentelé au putamen controlatéral par un relais thalamique, en deux synapses. Chez l’humain, la tractographie de diffusion a estimé des trajectoires entre le noyau dentelé et le putamen opposé en imposant un passage par le thalamus controlatéral. Ces trajectoires empruntaient le pédoncule cérébelleux supérieur et croisaient la ligne médiane dans le mésencéphale. Les auteurs situent ces trajectoires estimées principalement dans la région centromédiane. La tractographie de diffusion ne permet pas d’identifier les neurones thalamiques qui transmettent les afférences au putamen. Le pédoncule et la décussation ne font pas l’objet de repères distincts. Les neurones relais et les terminaisons putaminales de la voie humaine restent indéterminés. Le parcours s’arrête au putamen, en amont des relais pallidaux.
    clinical:
      en: The clinical link is partial and concerns injury involving the putamen. In Bhatia and Marsden’s review of 240 published cases with basal ganglia lesions, dystonia was reported in 49% of cases with lentiform lesions and in 63% of cases with putamen involvement. Some lesions extended into adjacent white matter. In an MRI study of five adults selected for dystonia after a focal stroke, four had striatopallidal involvement. One of these four also had thalamic involvement. In a separate imaging series, a man developed left hemidystonia one year after a focal right putaminal infarct. The contribution of injury to this cerebellar input remains unresolved.
      fr: Le lien clinique est partiel et repose sur des lésions touchant le putamen. Dans la revue de 240 cas publiés de lésions des noyaux gris centraux, Bhatia et Marsden ont relevé une dystonie dans 49 % des cas de lésion du noyau lenticulaire et dans 63 % des cas avec atteinte putaminale. Certaines lésions s’étendaient à la substance blanche voisine. Dans une étude en IRM menée chez cinq adultes sélectionnés pour une dystonie après un AVC focal, quatre présentaient une atteinte striatopallidale. L’atteinte s’étendait au thalamus chez l’un de ces quatre patients. Dans une série distincte avec imagerie, un homme a présenté une hémidystonie gauche un an après un infarctus focal du putamen droit. La contribution d’une atteinte des afférences cérébelleuses décrites ici reste indéterminée.
    deficit: dystonia
    references: [dentatoputaminal-macaque-tracing, dentatoputaminal-comparative-anatomy, dentatoputaminal-human-tractography, clinical-bhatia-1994, clinical-krystkowiak-dystonia-1998, dentatoputaminal-mouse-tracing, clinical-kostic-putaminal-dystonia-1996]
    clinical_references: [clinical-bhatia-1994, clinical-krystkowiak-dystonia-1998, clinical-kostic-putaminal-dystonia-1996]
    steps:
      - id: dentate
        region: nextbrain:left:721
        source_name: dentate_(lateral)_nucleus
        name: { en: Left dentate nucleus, fr: Noyau dentelé gauche }
        role: { en: Cerebellar origin, fr: Origine cérébelleuse }
        explanation:
          en: In the macaque putamen experiments, most of the labelled cerebellar neurons were on the side opposite the putamen. Most of those contralateral neurons were in the dentate nucleus, with the greatest concentration in its dorsal and ventral rostral portions.
          fr: Chez le macaque, la plupart des neurones cérébelleux marqués par traçage depuis le putamen se trouvaient du côté opposé. La majorité de ces neurones controlatéraux se situaient dans le noyau dentelé, où leur densité était maximale dans les portions dorsale et ventrale de sa partie rostrale.
        mapping:
          en: NextBrain shows the entire left dentate nucleus. The labelled territories in macaques occupied parts of the nucleus.
          fr: NextBrain représente le noyau dentelé gauche dans son ensemble. Les territoires marqués chez le macaque n’occupaient qu’une partie du noyau.
        view: posterior
        plane: coronal
      - id: thalamus
        region: learning:right:thalamus
        source_name: Thalamus
        name: { en: Right thalamus, fr: Thalamus droit }
        role: { en: Relay on the side opposite the dentate, fr: Relais du côté opposé au noyau dentelé }
        explanation:
          en: The route crosses to the right before reaching this landmark. Macaque tracing from the putamen identified first-order thalamic neurons and second-order cerebellar neurons. A separate experiment tracing from the external globus pallidus found labelled neurons in intralaminar and ventral anterior and ventral lateral thalamic territories. In mice, anatomical tracing also identified a two-synapse connection from deep cerebellar nuclei to the opposite dorsal striatum via intralaminar thalamic neurons. The precise nuclei relaying dentate input to the sampled putamen remain unresolved.
          fr: Le trajet croise la ligne médiane avant d’atteindre ce repère à droite. Chez le macaque, le traçage depuis le putamen a identifié des neurones thalamiques de premier ordre et des neurones cérébelleux de deuxième ordre. Une autre expérience, à partir du segment externe du globus pallidus, a révélé des neurones marqués dans les territoires intralaminaires, ventral antérieur et ventral latéral du thalamus. Chez la souris, le traçage anatomique a aussi mis en évidence une voie à deux synapses des noyaux cérébelleux profonds vers le striatum dorsal controlatéral, par des neurones thalamiques intralaminaires. L’identité précise des noyaux qui transmettent les afférences dentelées aux sites étudiés du putamen reste indéterminée.
        mapping:
          en: This teaching volume groups thalamic subdivisions on the right, including several candidate relay territories. The exact site of a human relay remains unresolved.
          fr: Ce volume pédagogique regroupe des subdivisions du thalamus droit, dont plusieurs territoires de relais possibles. Le site précis d’un relais chez l’humain reste indéterminé.
        view: anterior
        plane: coronal
      - id: putamen
        region: nextbrain:right:10079
        source_name: putamen
        name: { en: Right putamen, fr: Putamen droit }
        role: { en: Striatal target, fr: Cible striatale }
        explanation:
          en: The sampled putamen sites in the two macaques lay mainly in its sensorimotor territory. This is the striatal end of the traced branch.
          fr: Chez les deux macaques, les sites étudiés dans le putamen se situaient surtout dans son territoire sensorimoteur. Le trajet suivi aboutit à cette partie du striatum.
        mapping:
          en: The main NextBrain putamen parcel serves as a regional landmark. It extends beyond the sites sampled in the macaque study. The atlas segments the posteroventral portion separately.
          fr: La parcelle principale du putamen de NextBrain sert de repère régional. Elle s’étend au-delà des sites étudiés chez le macaque. L’atlas délimite séparément la portion postéroventrale.
        view: anterior
        plane: coronal

  - id: ca1-subiculum
    name: { en: Hippocampal CA1 projection to the subiculum, fr: Projection du champ CA1 de l’hippocampe vers le subiculum }
    summary:
      en: Follow one projection traced in rats from the pyramidal layer of ventral CA1 through the alveus to the subiculum on the same side.
      fr: Suivez une projection étudiée par traçage chez le rat, de la couche pyramidale du champ CA1 ventral au subiculum du même côté, en passant par l’alvéus.
    route:
      en: Ventral CA1 pyramidal layer → alveus → ipsilateral ventral subiculum (rat projection illustrated with left-sided human atlas landmarks)
      fr: Couche pyramidale de CA1 ventral → alvéus → subiculum ventral ipsilatéral (projection du rat illustrée par des repères gauches de l’atlas humain)
    scope:
      en: The ventral rat hippocampus broadly corresponds to the anterior human hippocampus along the long axis. The left-sided human landmarks illustrate the rat projection. The precise course, direction and terminal field of a corresponding human projection remain unresolved. The tour ends at the subiculum and omits other CA1 fibres to the subiculum, fibres that continue to the entorhinal cortex and the route through the fornix.
      fr: Le long de l’axe longitudinal, l’hippocampe ventral du rat correspond dans les grandes lignes à l’hippocampe antérieur humain. Les repères humains à gauche illustrent la projection décrite chez le rat. Le trajet précis, le sens et le champ terminal d’une projection correspondante chez l’humain restent indéterminés. Le parcours s’arrête au subiculum et laisse de côté les autres fibres de CA1 qui atteignent le subiculum, celles qui se prolongent jusqu’au cortex entorhinal et la voie qui emprunte le fornix.
    clinical:
      en: The clinical link is partial. R.B. and G.D. developed persistent anterograde amnesia after ischaemic episodes. Post-mortem examination showed extensive bilateral loss of CA1 pyramidal cells. In R.B., cell loss extended slightly into the subiculum and CA3 in two caudal sections. In G.D., it extended into the proximal subiculum, with possible very slight cell loss in the left entorhinal cortex. The later series used R.B. as a historical comparator. The alveus appeared intact on fibre staining in both cases. The cases link injury involving the origin of the projection to amnesia. The contribution of this particular projection remains unresolved.
      fr: Le lien clinique est partiel. R.B. et G.D. ont présenté une amnésie antérograde persistante après des épisodes ischémiques. L’examen post mortem a montré une perte étendue de cellules pyramidales de CA1 des deux côtés. Chez R.B., la perte cellulaire s’étendait légèrement au subiculum et à CA3 sur deux coupes caudales. Chez G.D., elle touchait aussi le subiculum proximal, avec une possible perte cellulaire très légère dans le cortex entorhinal gauche. La série ultérieure a repris le cas de R.B. à titre de comparaison. L’alvéus paraissait intact sur les coupes colorées pour les fibres dans les deux cas. Ces observations associent une atteinte de la région d’origine de la projection à l’amnésie. La contribution de cette projection précise reste indéterminée.
    deficit: amnesia
    references: [ca1-subiculum-omara-anatomy, ca1-subiculum-cenquizca-swanson, ca1-subiculum-arszovszki, memory-anatomy, ca1-subiculum-bienkowski-homology, entorhinal-ca1-human-fibres, clinical-zola-morgan-1986, clinical-rempel-clower-1996]
    clinical_references: [clinical-zola-morgan-1986, clinical-rempel-clower-1996]
    steps:
      - id: ca1-pyramidal-layer
        region: nextbrain:left:345
        source_name: stratum_pyramidale_of_rostral_ca1
        name: { en: Pyramidal layer of left rostral CA1, fr: Couche pyramidale du champ CA1 rostral gauche }
        role: { en: Origin of the subicular projection, fr: Origine de la projection vers le subiculum }
        explanation:
          en: In rat single-cell reconstructions, axons of ventral CA1 pyramidal cells gave off branches in the subiculum on the same side.
          fr: Chez le rat, la reconstruction de neurones individuels a montré que des axones de cellules pyramidales du champ CA1 ventral se ramifiaient dans le subiculum du même côté.
        mapping:
          en: NextBrain shows the pyramidal layer of left rostral CA1. The parcel marks the broadly corresponding part of the human hippocampal long axis at the scale of a whole cell layer.
          fr: NextBrain délimite la couche pyramidale du champ CA1 rostral gauche. La parcelle repère le segment de l’hippocampe humain qui correspond dans les grandes lignes à celui du rat, à l’échelle d’une couche cellulaire entière.
        view: right
        plane: coronal
      - id: alveus
        region: nextbrain:left:354
        source_name: alveus
        name: { en: Left alveus, fr: Alvéus gauche }
        role: { en: Passage toward the subiculum, fr: Passage vers le subiculum }
        explanation:
          en: In rat anterograde tracing from ventral CA1, labelled axons entered the alveus and ran caudally toward the subiculum. Polarized-light microscopy of post-mortem human sections shows longitudinally oriented myelinated fibres in the alveus.
          fr: Chez le rat, après un traçage antérograde depuis le champ CA1 ventral, des axones marqués pénétraient dans l’alvéus et se dirigeaient vers l’arrière, en direction du subiculum. En microscopie en lumière polarisée, les coupes humaines post mortem montrent des fibres myélinisées orientées longitudinalement dans l’alvéus.
        mapping:
          en: The NextBrain parcel represents the segmented left alveus. It contains multiple fibre populations and serves here as a regional waypoint.
          fr: La parcelle de NextBrain représente l’alvéus gauche segmenté. Elle contient plusieurs populations de fibres et sert ici de repère sur le trajet.
        view: right
        plane: coronal
      - id: subiculum
        region: nextbrain:left:347
        source_name: rostral_subiculum
        name: { en: Left rostral subiculum, fr: Subiculum rostral gauche }
        role: { en: Subicular target of CA1 fibres, fr: Cible subiculaire des fibres de CA1 }
        explanation:
          en: In rat anterograde tracing, the labelled fibres formed a dense terminal field in the ventral subiculum. The field extended through the pyramidal layer and into the adjacent deep zone of the molecular layer.
          fr: Chez le rat, le traçage antérograde a montré un champ terminal dense dans le subiculum ventral. Ce champ s’étendait sur toute l’épaisseur de la couche pyramidale et jusque dans la zone profonde adjacente de la couche moléculaire.
        mapping:
          en: The NextBrain parcel shows the left rostral subiculum as one volume. The receiving layers described in rats have no separate landmark here.
          fr: La parcelle de NextBrain représente le subiculum rostral gauche en un seul volume. Les couches cibles décrites chez le rat ne font pas l’objet de repères distincts ici.
        view: right
        plane: coronal

  - id: dorsal-geniculate-mt
    name: { en: Direct geniculate input to visual area MT, fr: Afférences géniculées directes vers l’aire visuelle MT }
    summary:
      en: Follow a direct projection from the dorsal lateral geniculate nucleus to visual area MT identified by tracing in macaques. Locate both ends with right-sided landmarks in the human atlas.
      fr: Suivez une projection directe du noyau géniculé latéral dorsal vers l’aire visuelle MT mise en évidence par traçage chez le macaque. Situez ses deux extrémités à l’aide de repères de l’hémisphère droit dans l’atlas humain.
    route:
      en: Dorsal lateral geniculate nucleus → visual area MT (macaque projection shown with right-sided human atlas landmarks)
      fr: Noyau géniculé latéral dorsal → aire visuelle MT (projection du macaque illustrée par des repères du côté droit dans l’atlas humain)
    scope:
      en: This traced extrastriate branch reaches MT directly in the same hemisphere, bypassing V1. The display omits the retina and the separate inputs to MT from V1 and the inferior pulvinar. In adults with acquired unilateral V1 damage and in healthy controls, diffusion tractography estimated same-hemisphere streamlines between LGN and hMT+ regions. The study tested whether patients could detect a moving stimulus in the blind field. The human geniculate cells that project to MT, their precise endpoints and the direction of the connection remain unresolved.
      fr: Cette branche géniculo-extrastriée mise en évidence par traçage atteint directement l’aire MT du même hémisphère en contournant V1. Le parcours laisse de côté la rétine et les afférences distinctes de V1 et du pulvinar inférieur vers MT. Chez des adultes présentant une lésion acquise unilatérale de V1 et chez des témoins sains, la tractographie par IRM de diffusion a estimé des trajectoires entre les régions du noyau géniculé latéral et de hMT+ du même hémisphère. L’étude a évalué la capacité des patients à détecter un stimulus en mouvement dans le champ visuel aveugle. Les cellules géniculées qui se projettent vers MT, leurs terminaisons précises et le sens de la connexion restent à établir chez l’humain.
    clinical:
      en: The clinical link is partial. L.M. had persistent difficulty perceiving motion after bilateral occipitotemporal injury. A comparison with published V5 locations placed much or all of the expected territory within her lesions, which extended into adjacent cortex and white matter. In a separate study, one patient whose lesions overlapped both hMT+ template masks and spared the posterior superior temporal sulcus masks had difficulty judging the direction of moving dots. Among 113 participants with stroke who had lesion and motion-coherence data, no association between lesion location and performance survived correction. Few participants had lesions involving MT. The effects of selective injury to the geniculate input to MT remain unresolved.
      fr: Le lien clinique est partiel. L.M. présentait un trouble persistant de la perception du mouvement après des lésions occipitotemporales bilatérales. Une comparaison avec les localisations publiées de V5 a situé la majeure partie, voire la totalité, du territoire attendu dans ses lésions, qui s’étendaient au cortex et à la substance blanche adjacents. Dans une autre étude, les lésions d’un patient recoupaient les deux masques de référence du complexe hMT+ et épargnaient les masques du sillon temporal supérieur postérieur. Ce patient éprouvait une difficulté à indiquer le sens du déplacement de points en mouvement. Chez 113 participants ayant subi un AVC et disposant de données lésionnelles et de résultats à l’épreuve de mouvement cohérent, aucune association entre le siège de la lésion et les résultats à l’épreuve n’a franchi le seuil statistique corrigé. Peu de participants avaient une lésion de l’aire MT. Les effets d’une atteinte sélective des afférences géniculées vers MT restent indéterminés.
    deficit: akinetopsia
    references: [geniculate-mt-teaching-review, geniculate-mt-macaque-tracing, geniculate-mt-marmoset-retinal, dorsal-geniculate-human-macaque, visual-motion-mt-human-homology, geniculate-mt-human-diffusion, cortical-parcellation, clinical-zihl-1991, clinical-shipp-1994, clinical-prabhakar-motion-2025, clinical-lugtmeijer-2025]
    clinical_references: [clinical-zihl-1991, clinical-shipp-1994, clinical-prabhakar-motion-2025, clinical-lugtmeijer-2025]
    steps:
      - id: dorsal-lgn
        region: nextbrain:right:10484
        source_name: dorsal_lateral_geniculate_nucleus
        name: { en: Right dorsal lateral geniculate nucleus, fr: Noyau géniculé latéral dorsal droit }
        role: { en: Thalamic source of direct input to MT, fr: Origine thalamique des afférences directes vers MT }
        explanation:
          en: In macaques, injections of retrograde tracer confined to MT labelled geniculate neurons on the same side. Most of the counted cells were in intercalated layers. The labelled population included cells that expressed the koniocellular marker CaMK2 and cells that lacked it. In marmosets, confocal microscopy identified retinal terminals carrying a presynaptic marker close to MT-projecting cells in layers K1 and K3.
          fr: Chez le macaque, des injections de traceur rétrograde limitées à MT ont marqué des neurones géniculés du même côté. La plupart des cellules dénombrées se trouvaient dans les couches intercalaires. La population marquée comprenait des cellules exprimant le marqueur koniocellulaire CaMK2 et des cellules dépourvues de ce marqueur. Chez des ouistitis, la microscopie confocale a mis en évidence des terminaisons rétiniennes portant un marqueur présynaptique à proximité de cellules des couches K1 et K3 qui se projettent vers MT.
        mapping:
          en: The NextBrain parcel outlines the whole human dorsal lateral geniculate nucleus. Human and macaque tissue studies identify corresponding cell types in this nucleus. The macaque cells traced to MT occupy only part of the nucleus.
          fr: La parcelle NextBrain représente l’ensemble du noyau géniculé latéral dorsal humain. Des études tissulaires ont identifié des types cellulaires correspondants dans ce noyau chez l’humain et le macaque. Les cellules dont la projection vers MT a été mise en évidence chez le macaque n’occupent qu’une partie du noyau.
        view: posterior
        plane: coronal
      - id: mt
        region: hcp-mmp:right:23
        source_name: R_MT_ROI
        name: { en: Right middle temporal visual area (MT or V5), fr: Aire visuelle temporale moyenne droite (MT ou V5) }
        role: { en: Cortical target of the geniculate projection, fr: Cible corticale de la projection géniculée }
        explanation:
          en: In macaques, very few geniculate neurons carried both tracers where the labelling from MT and from the corresponding part of V1 overlapped. The result supports a distinct population of geniculate neurons projecting to MT.
          fr: Chez le macaque, très peu de neurones géniculés portaient les deux traceurs dans les zones où se recoupaient les marquages à partir de MT et de la partie correspondante de V1. Ce résultat étaye l’existence d’une population distincte de neurones géniculés qui se projettent vers MT.
        mapping:
          en: The HCP-MMP parcel marks MT within the wider human MT+ complex. Human MT and macaque MT have similar retinotopic organization. The tractography study used a Jülich hMT+ probability map to define its cortical region of interest.
          fr: La parcelle HCP-MMP situe l’aire MT au sein du complexe visuel MT+ humain, plus étendu. L’organisation rétinotopique de l’aire MT est comparable chez l’humain et le macaque. L’étude de tractographie a utilisé une carte probabiliste hMT+ de l’atlas de Jülich pour définir sa région d’intérêt corticale.
        view: right
        plane: axial

  - id: subthalamic-crus-ii
    name: { en: Crossed subthalamic projection to Crus II, fr: Projection sous-thalamo-cérébelleuse croisée vers le Crus II }
    summary:
      en: Follow a crossed component of the subthalamic projection to the cerebellum. Retrograde transneuronal tracing in capuchins identified a two-synapse projection reaching posterior Crus II. Comparable human atlas regions mark the two ends.
      fr: Suivez une composante croisée de la projection sous-thalamo-cérébelleuse. Chez le capucin, un traçage transneuronal rétrograde a mis en évidence une projection à deux synapses jusqu’à la partie postérieure du Crus II. Des régions comparables de l’atlas humain repèrent les deux extrémités.
    route:
      en: Left subthalamic nucleus → posterior right Crus II (capuchin example)
      fr: Noyau sous-thalamique gauche → partie postérieure du Crus II droit (exemple chez le capucin)
    scope:
      en: Anatomical tracing in capuchins identifies candidate relays in the pons. The precise relay and the crossing level remain unresolved in those experiments. In mice, retrograde transsynaptic tracing from a wider posterolateral cerebellar region labelled subthalamic neurons on both sides. In rats, tracing from Crus II yielded much less subthalamic labelling than tracing from vermal lobule VII. Human diffusion tractography with opposite-side endpoint regions estimated trajectories from the subthalamic nucleus to Crus II through the basilar pons and middle cerebellar peduncle. The estimated trajectories leave the synaptic relay and direction unresolved. The tour omits the intervening brainstem and the separate branch to lobule VIIb.
      fr: Le traçage anatomique chez le capucin indique des relais possibles dans le pont. Ces expériences laissent indéterminés le relais précis et le niveau du croisement. Chez la souris, un traçage transsynaptique rétrograde depuis une région cérébelleuse postérolatérale plus étendue a marqué des neurones sous-thalamiques des deux côtés. Chez le rat, le traçage depuis le Crus II a donné un marquage sous-thalamique bien moins important que depuis le lobule VII du vermis. Chez l’humain, la tractographie par IRM de diffusion a estimé des trajectoires entre des régions d’intérêt choisies de part et d’autre de la ligne médiane, du noyau sous-thalamique au Crus II, par la partie basilaire du pont et le pédoncule cérébelleux moyen. Ces estimations laissent indéterminés le relais synaptique et le sens de la projection. Le trajet dans le tronc cérébral et la branche distincte vers le lobule VIIb restent hors du parcours.
    clinical:
      en: The clinical link with cerebellar cognitive affective syndrome is partial at the cerebellar endpoint. In Schmahmann and Sherman’s series, the most evident cognitive and behavioural changes in adult focal cases followed large or bilateral posterior inferior cerebellar artery infarcts. One adult had cognitive, behavioural and affective changes after resection involving the vermis and adjacent tissue. A separate lesion-mapping study of 22 adults assessed after isolated chronic cerebellar stroke associated poorer verbal category switching with damage in lateral right Crus I and II and lobule VIIb. The minimum age at stroke was unreported. The main associations for the overall syndrome scale score were in lateral right lobule VI and Crus I. The category-switching difference from 22 healthy volunteers fell below the significance threshold after adjustment for articulation rate. The effect of injury confined to the subthalamic projection remains unresolved.
      fr: Le lien clinique avec le syndrome cérébelleux cognitivo-affectif est partiel au niveau du repère cérébelleux. Dans les cas adultes avec lésion focale de la série de Schmahmann et Sherman, les changements cognitifs et comportementaux étaient les plus manifestes après de grands infarctus ou des infarctus bilatéraux du territoire de l’artère cérébelleuse postéro-inférieure. Une adulte a présenté des changements cognitifs, comportementaux et affectifs après une résection touchant le vermis et les tissus adjacents. Dans une autre étude, la cartographie lésionnelle de 22 adultes en phase chronique après un AVC limité au cervelet a associé de moins bons résultats à une épreuve d’alternance entre catégories sémantiques à des lésions des parties latérales du Crus I, du Crus II et du lobule VIIb droits. L’âge minimal au moment de l’AVC n’était pas précisé. Le score global à l’échelle du syndrome était principalement associé aux parties latérales du lobule VI et du Crus I droits. L’écart à l’épreuve d’alternance par rapport à 22 témoins sains n’atteignait plus le seuil de signification après ajustement sur le débit articulatoire. L’effet d’une lésion limitée à la projection sous-thalamique reste indéterminé.
    deficit: cerebellar-cognitive
    references: [subthalamic-crus-ii-capuchin-tracing, dentatoputaminal-comparative-anatomy, dentatoputaminal-human-tractography, clinical-schmahmann-1998, clinical-chirino-perez-2022, subthalamic-cerebellar-mouse-tracing, subthalamic-cerebellar-rat-tracing, subthalamic-comparative-anatomy, crus-ii-comparative-anatomy]
    clinical_references: [clinical-schmahmann-1998, clinical-chirino-perez-2022]
    steps:
      - id: subthalamic-nucleus
        region: learning:left:subthalamic
        source_name: Subthalamic nucleus
        name: { en: Left subthalamic nucleus, fr: Noyau sous-thalamique gauche }
        role: { en: Subthalamic origin of the projection, fr: Origine sous-thalamique de la projection }
        explanation:
          en: In capuchins, the subthalamic neurons linked to posterior Crus II were more numerous in the rostral half of the nucleus. Comparing the distribution with functional subdivisions placed most of these neurons in the associative territory.
          fr: Chez le capucin, les neurones sous-thalamiques reliés à la partie postérieure du Crus II étaient plus nombreux dans la moitié rostrale du noyau. La comparaison avec les subdivisions fonctionnelles a situé la plupart de ces neurones dans le territoire associatif.
        mapping:
          en: The teaching volume combines the medial, laterodorsal and lateroventral NextBrain labels. It serves as a regional landmark for the territory traced in capuchins.
          fr: Le volume pédagogique réunit les portions médiale, latérodorsale et latéroventrale de NextBrain. Il sert de repère régional pour le territoire étudié par traçage chez le capucin.
        view: anterior
        plane: axial
      - id: posterior-crus-ii
        region: learning:crus-ii-right
        source_name: Crus II
        name: { en: Right Crus II, fr: Crus II droit }
        role: { en: Cerebellar target after crossing, fr: Cible cérébelleuse après le croisement }
        explanation:
          en: In two capuchins, most of the second-order neurons labelled in the subthalamic nucleus after tracing from posterior Crus II were contralateral to the cerebellar site. The right landmark illustrates the receiving side of this crossed connection.
          fr: Chez deux capucins, la plupart des neurones de deuxième ordre marqués dans le noyau sous-thalamique après traçage depuis la partie postérieure du Crus II se trouvaient du côté opposé au site cérébelleux. Le repère droit représente le côté où aboutit cette connexion croisée.
        mapping:
          en: CerebNet shows the whole right Crus II. The posterior sector sampled in capuchins occupies part of Crus II.
          fr: CerebNet représente l’ensemble du Crus II droit. Le territoire postérieur étudié chez le capucin n’occupe qu’une partie du Crus II.
        view: posterior
        plane: coronal

  - id: posterior-ilf-reading
    name: { en: Visual input for reading via the posterior inferior longitudinal fasciculus, fr: Afférences visuelles de la lecture par la partie postérieure du faisceau longitudinal inférieur }
    summary:
      en: Follow the proposed route from left occipital visual cortex to the left ventral occipitotemporal cortex involved in visual word recognition.
      fr: Suivez le trajet proposé du cortex visuel occipital gauche vers le cortex occipitotemporal ventral gauche impliqué dans la reconnaissance visuelle des mots.
    route:
      en: Left occipital cortex (occipital pole landmark) → left ventral occipitotemporal reading cortex (proposed visual input via the posterior inferior longitudinal fasciculus)
      fr: Cortex occipital gauche (repère du pôle occipital) → cortex occipitotemporal ventral gauche de la lecture (afférence visuelle proposée par la partie postérieure du faisceau longitudinal inférieur)
    scope:
      en: Human dissection identifies the inferior longitudinal fasciculus as an occipitotemporal association bundle. Human diffusion tractography estimates a link between posterior occipital cortex and ventral occipitotemporal reading cortex. The order shown follows the proposed flow of visual input. The direction of individual axons and the exact endpoints remain unresolved. The display shows the estimated left fasciculus as a whole. The tour omits its anterior temporal connections, visual input from the other hemisphere and pathways beyond ventral occipitotemporal cortex.
      fr: La dissection humaine identifie le faisceau longitudinal inférieur comme un faisceau d’association occipitotemporal. La tractographie de diffusion chez l’humain estime une liaison entre le cortex occipital postérieur et le cortex occipitotemporal ventral de la lecture. L’ordre des repères suit le sens proposé des afférences visuelles. Le sens des axones individuels et les terminaisons précises restent indéterminés. Le tracé représente le faisceau gauche estimé dans son ensemble. Le parcours laisse de côté ses connexions temporales antérieures, les afférences visuelles de l’autre hémisphère et les voies qui se prolongent au-delà du cortex occipitotemporal ventral.
    clinical:
      en: The clinical link is direct and rests on small surgical studies. After left glioma resection, two patients with cavities overlapping the estimated posterior fasciculus still read regular words, irregular words and pseudowords slowly and made some errors at three months. Imaging showed that the lateral occipitotemporal sulcus was spared in both. The study estimated tract overlap with a normative atlas and reported descriptive reading results. In a separate epilepsy-surgery case reported by Gaillard and Epelbaum, letter-by-letter reading began after a resection just posterior to the main visual word form area response. Diffusion MRI showed progressive loss of reconstructed streamlines between that area and the occipital cortex. These studies leave the effects of an injury confined to the fasciculus unresolved. In a separate stroke and traumatic brain injury study, posterior tract lesions in four patients were associated with poorer performance on Chinese orthographic tasks. Anterior injury was also associated with poorer orthographic performance.
      fr: Le lien clinique est direct et repose sur de petites études chirurgicales. Après résection d’un gliome gauche, deux patients dont les cavités recouvraient le trajet estimé de la partie postérieure du faisceau lisaient encore lentement les mots réguliers, les mots irréguliers et les pseudomots à trois mois et faisaient quelques erreurs. L’imagerie montrait que le sillon occipitotemporal latéral était épargné chez les deux patients. L’étude a estimé l’atteinte du faisceau à partir d’un atlas normatif et a présenté des résultats descriptifs de la lecture. Dans un autre cas de chirurgie de l’épilepsie, rapporté par Gaillard puis Epelbaum, une lecture lettre à lettre est apparue après une résection juste en arrière du principal foyer d’activation de l’aire de la forme visuelle des mots. L’IRM de diffusion a montré une diminution progressive du nombre de trajectoires reconstruites entre cette aire et le cortex occipital. Les effets d’une lésion limitée au faisceau restent indéterminés. Dans une étude distincte menée après AVC ou traumatisme crânien, les quatre patients ayant une lésion de la partie postérieure du faisceau obtenaient de moins bonnes performances aux épreuves orthographiques en chinois. Une atteinte antérieure était aussi associée à de moins bonnes performances orthographiques.
    deficit: alexia
    references: [posterior-ilf-herbet-review, posterior-ilf-latini-dissection, posterior-ilf-bouhali-tractography, clinical-gaillard-reading-2006, clinical-epelbaum-ilf-2008, clinical-zemmoura-ilf-2015, clinical-wang-ilf-2020]
    clinical_references: [clinical-gaillard-reading-2006, clinical-epelbaum-ilf-2008, clinical-zemmoura-ilf-2015, clinical-wang-ilf-2020]
    steps:
      - id: occipital-pole
        region: 'destrieux:left:43'
        source_name: Pole_occipital
        name: { en: Left occipital pole, fr: Pôle occipital gauche }
        role: { en: Landmark for posterior visual input, fr: Repère des afférences visuelles postérieures }
        explanation:
          en: One human diffusion study estimated streamlines from a posterior part of the ventral occipitotemporal reading system to the left occipital pole. In a separate preoperative patient scan, the estimated posterior inferior longitudinal fasciculus reached the inferomedial occipital cortex from the visual word form area. Dissection identifies several occipital components of the inferior longitudinal fasciculus.
          fr: Une étude de tractographie par IRM de diffusion chez l’humain a estimé des trajectoires entre une partie postérieure du système occipitotemporal ventral de la lecture et le pôle occipital gauche. Chez un patient examiné lors d’une étude distincte, l’IRM préopératoire situait le trajet estimé de la partie postérieure du faisceau longitudinal inférieur entre l’aire de la forme visuelle des mots et le cortex occipital inféromédial. La dissection identifie plusieurs composantes occipitales du faisceau longitudinal inférieur.
        mapping:
          en: The Destrieux parcel marks the whole occipital pole. It approximates one posterior visual territory supplying the proposed route.
          fr: La parcelle de Destrieux délimite le pôle occipital dans son ensemble. Elle représente approximativement l’un des territoires visuels postérieurs qui alimenteraient cette voie.
        view: posterior
        plane: axial
      - id: lateral-occipitotemporal-sulcus
        region: 'destrieux:left:61'
        source_name: S_oc-temp_lat
        name: { en: Left lateral occipitotemporal sulcus, fr: Sillon occipitotemporal latéral gauche }
        role: { en: Landmark for visual word recognition cortex, fr: Repère du cortex de la reconnaissance visuelle des mots }
        explanation:
          en: In humans, functional MRI localizes word-responsive cortex near the lateral occipitotemporal sulcus. Diffusion tractography estimates inferior longitudinal fasciculus streamlines near this cortex.
          fr: Chez l’humain, l’IRM fonctionnelle repère le cortex qui répond aux mots près du sillon occipitotemporal latéral. La tractographie par IRM de diffusion estime des trajectoires du faisceau longitudinal inférieur à proximité de ce cortex.
        mapping:
          en: The Destrieux parcel marks the whole sulcus. The functionally defined word form area occupies a smaller territory whose location varies among individuals. The tract display includes the whole estimated left inferior longitudinal fasciculus.
          fr: La parcelle de Destrieux représente le sillon dans son ensemble. L’aire fonctionnelle de la forme visuelle des mots occupe un territoire plus restreint, dont la position varie selon les personnes. Le tracé comprend le faisceau longitudinal inférieur gauche estimé dans son ensemble.
        view: inferior
        plane: coronal
        tract: ilf-left

  - id: transcallosal-auditory-core
    name: { en: Callosal connection between primary auditory regions, fr: Connexion calleuse entre les régions auditives primaires }
    summary:
      en: Follow the connection between the two primary auditory regions through the corpus callosum.
      fr: Suivez la connexion entre les deux régions auditives primaires par le corps calleux.
    route:
      en: Right primary auditory region → corpus callosum → left primary auditory region
      fr: Région auditive primaire droite → corps calleux → région auditive primaire gauche
    scope:
      en: The tour follows the right-to-left direction of a reciprocal connection documented by primate tracing. Human diffusion tractography estimates a posterior callosal crossing between the two Heschl gyri. The precise endpoints and direction of individual human fibres remain unresolved. The reciprocal direction, other auditory cortical targets and the anterior commissure are outside the route.
      fr: Le parcours suit de droite à gauche une connexion réciproque mise en évidence par traçage chez des primates. Chez l’humain, la tractographie de diffusion estime un passage par la partie postérieure du corps calleux entre les deux gyrus de Heschl. Les terminaisons précises et le sens de parcours des fibres individuelles restent indéterminés. Le sens inverse, les autres cibles corticales auditives et la commissure antérieure restent hors du parcours.
    clinical:
      en: The link to pure word deafness is partial. In one adult with infarcts involving both primary auditory cortices, the authors reported pure word deafness and relatively preserved environmental-sound recognition. A separate adult developed pure word deafness after a left temporal stroke. That injury involved cortex and white matter, with fewer reconstructed callosal streamlines reaching the left temporal lobe. The contribution of injury confined to the illustrated connection remains unresolved.
      fr: Le lien avec la surdité verbale pure est partiel. Chez un adulte présentant des infarctus des deux cortex auditifs primaires, les auteurs ont rapporté une surdité verbale pure et une reconnaissance relativement préservée des bruits environnants. Une autre adulte a présenté une surdité verbale pure après un AVC temporal gauche. La lésion touchait le cortex et la substance blanche, et la tractographie a reconstruit moins de trajectoires calleuses atteignant le lobe temporal gauche. Les effets d’une atteinte limitée à la connexion illustrée restent indéterminés.
    deficit: word-deafness
    references: [auditory-callosal-tamarin, auditory-callosal-owl-monkey, auditory-core-teaching, auditory-callosal-human-diffusion, cortical-parcellation, clinical-coslett-1984, clinical-maffei-2017]
    clinical_references: [clinical-coslett-1984, clinical-maffei-2017]
    steps:
      - id: right-a1
        region: hcp-mmp:right:24
        source_name: R_A1_ROI
        name: { en: Right primary auditory region, fr: Région auditive primaire droite }
        role: { en: Origin of the illustrated callosal direction, fr: Origine du trajet calleux illustré }
        explanation:
          en: In tamarins, tracer placed in primary auditory cortex labelled neurons and terminals in the opposite primary auditory cortex. The densest labelling generally lay in regions with similar preferred frequencies.
          fr: Chez le tamarin, un traceur déposé dans le cortex auditif primaire a marqué des neurones et des terminaisons dans le cortex auditif primaire opposé. Le marquage le plus dense concernait généralement des régions ayant des fréquences préférentielles similaires.
        mapping:
          en: The HCP-MMP A1 parcel marks a heavily myelinated region on the medial part of Heschl’s gyrus that approximates primary auditory cortex. Individual field boundaries and tonotopy remain unresolved.
          fr: La parcelle A1 du HCP-MMP repère une région fortement myélinisée de la partie médiale du gyrus de Heschl, qui correspond approximativement au cortex auditif primaire. Les limites des champs individuels et la tonotopie restent indéterminées.
        view: right
        plane: coronal
      - id: corpus-callosum
        region: learning:corpus-callosum
        source_name: Corpus callosum
        name: { en: Corpus callosum, fr: Corps calleux }
        role: { en: Crossing from right to left, fr: Franchissement de la ligne médiane de droite à gauche }
        explanation:
          en: In owl monkeys, anterograde tracing showed that axons from A1 crossed in the corpus callosum. In healthy adults, diffusion tractography estimated a crossing in the posterior fifth of the corpus callosum for streamlines connecting the two Heschl gyri as defined by the Harvard–Oxford atlas.
          fr: Chez le singe de nuit, le traçage antérograde a montré que des axones issus d’A1 franchissaient la ligne médiane dans le corps calleux. Chez des adultes sains, la tractographie de diffusion a estimé que les trajectoires reliant les deux gyrus de Heschl délimités par l’atlas Harvard–Oxford traversaient le cinquième postérieur du corps calleux.
        mapping:
          en: The teaching volume shows the whole corpus callosum. It marks the midline crossing at the scale of the commissure.
          fr: Le volume pédagogique représente le corps calleux entier. Il situe le franchissement de la ligne médiane à l’échelle de la commissure.
        view: right
        plane: sagittal
      - id: left-a1
        region: hcp-mmp:left:24
        source_name: L_A1_ROI
        name: { en: Left primary auditory region, fr: Région auditive primaire gauche }
        role: { en: Contralateral receiving region, fr: Région réceptrice controlatérale }
        explanation:
          en: In owl monkeys, regions of primary auditory cortex received labelled terminals from the opposite A1. The landmark illustrates the receiving side of the callosal connection.
          fr: Chez le singe de nuit, des régions du cortex auditif primaire recevaient des terminaisons marquées provenant de l’aire A1 opposée. Le repère illustre le côté récepteur de la connexion calleuse.
        mapping:
          en: The HCP-MMP A1 parcel marks the left auditory core region. The terminal fields of the crossed projection remain unresolved inside this parcel.
          fr: La parcelle A1 du HCP-MMP repère la région auditive centrale gauche. Les champs de terminaison de la projection croisée restent indéterminés à l’intérieur de cette parcelle.
        view: left
        plane: coronal
