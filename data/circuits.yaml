      - id: putamen
        region: nextbrain:left:79
        source_name: putamen
        name: { en: Left putamen, fr: Putamen gauche }
        role: { en: Striatal target of the dopaminergic projection, fr: Cible striatale de la projection dopaminergique }
        explanation:
          en: The macaque tracing study sampled the dorsolateral postcommissural putamen, within the sensorimotor striatum.
          fr: Chez le macaque, le traçage a porté sur la partie dorsolatérale du putamen postcommissural, au sein du striatum sensorimoteur.
        mapping:
          en: The main NextBrain putamen parcel extends beyond the sampled dorsolateral postcommissural territory. NextBrain labels the posteroventral portion separately.
          fr: La parcelle principale du putamen de NextBrain s’étend au-delà du territoire dorsolatéral postcommissural étudié. NextBrain délimite séparément la portion postéroventrale.
        view: anterior
        plane: coronal
  - id: vestibular
    name: { en: Direct vestibular input to the cerebellar nodulus, fr: Afférences vestibulaires directes vers le nodule cérébelleux }
    summary:
      en: Follow a branch carrying balance signals from the left inferior cerebellar peduncle to the nodulus of the cerebellar vermis.
      fr: Suivez une branche qui transmet des signaux de l’équilibre du pédoncule cérébelleux inférieur gauche au nodule du vermis cérébelleux.
    route:
      en: Left inferior cerebellar peduncle (juxtarestiform body) → left side of the cerebellar nodulus (vermis X)
      fr: Pédoncule cérébelleux inférieur gauche (corps juxtarestiforme) → partie gauche du nodule cérébelleux (vermis X)
    scope:
      en: In macaques, degeneration after vestibular ganglion lesions traced primary fibres through the juxtarestiform body to the nodulus on the same side. Their peripheral course and brainstem entry precede the first landmark. In 31 healthy adults, Park and colleagues used diffusion tractography to estimate an ipsilateral course through the inferior cerebellar peduncle from a seed in the pontine superior and medial vestibular nuclei to a combined uvula–nodulus target. The nuclear seed leaves the ganglion origin and exact endings of the direct primary afferents unresolved. The tour omits parallel terminations in the ventral uvula and secondary projections from the vestibular nuclei.
      fr: Chez le macaque, l’étude de la dégénérescence après des lésions du ganglion vestibulaire a permis de suivre des fibres primaires jusqu’au nodule ipsilatéral, en passant par le corps juxtarestiforme. Leur trajet périphérique et leur entrée dans le tronc cérébral précèdent le premier repère. Chez 31 adultes en bonne santé, Park et ses collègues ont utilisé la tractographie de diffusion pour estimer un trajet ipsilatéral passant par le pédoncule cérébelleux inférieur, depuis les noyaux vestibulaires supérieur et médial au niveau du pont jusqu’à une cible réunissant la luette cérébelleuse et le nodule. Le point de départ choisi dans les noyaux laisse indéterminées l’origine ganglionnaire et les terminaisons précises des afférences primaires directes. Le parcours laisse de côté les terminaisons parallèles dans la partie ventrale de la luette cérébelleuse et les projections secondaires issues des noyaux vestibulaires.
    clinical:
      en: The link with vertigo from cerebellar infarction is partial at the nodulus. In Moon and colleagues’ MRI-based series, eight adults with isolated nodular infarcts had sudden vertigo and moderate to severe imbalance. Three infarcts were left-sided, three right-sided and two bilateral. In a separate series of six adults with isolated nodular infarcts, Lee and colleagues found five cases of acute vestibular syndrome and one case of episodic vertigo triggered by changes in position. The authors rated the overall video head-impulse responses normal in all six. One patient had mildly reduced angular vestibulo-ocular reflex gains on testing both horizontal semicircular canals. These series leave the contributions of individual fibre pathways unresolved.
      fr: Le lien avec le vertige d’origine cérébelleuse est partiel et concerne le nodule. Dans la série de Moon et de ses collègues, huit adultes atteints d’un infarctus isolé du nodule à l’IRM ont présenté un vertige soudain et un déséquilibre modéré à sévère. Trois infarctus étaient à gauche, trois à droite et deux bilatéraux. Dans une autre série de six adultes ayant un infarctus isolé du nodule, Lee et ses collègues ont relevé cinq syndromes vestibulaires aigus et un vertige épisodique déclenché par les changements de position. Les auteurs ont jugé globalement normales les réponses au test vidéo d’impulsion céphalique chez les six patients. Chez l’un d’eux, le gain du réflexe vestibulo-oculaire angulaire était légèrement diminué lors du test de chacun des deux canaux semi-circulaires horizontaux. La contribution propre à chaque faisceau reste indéterminée.
    deficit: cerebellar-vertigo
    references: [vestibular-primary-entry, vestibular-primary-termination, vestibular-human-tractography, vestibular-human-juxtarestiform-pathology, clinical-moon-2009, clinical-lee-nodular-2023, vestibular-pathways-teaching, vestibular-otolith-macaque-tracing]
    clinical_references: [clinical-moon-2009, clinical-lee-nodular-2023]
    steps:
      - id: inferior-peduncle
        region: learning:left:inferior-cerebellar-peduncle
        source_name: Inferior cerebellar peduncle
        tract: icp-left
        name: { en: Left inferior cerebellar peduncle, fr: Pédoncule cérébelleux inférieur gauche }
        role: { en: Entry of primary vestibular fibres into the cerebellum, fr: Entrée des fibres vestibulaires primaires dans le cervelet }
        explanation:
          en: Anatomical studies in nonhuman primates show that primary vestibular fibres enter the cerebellum through the juxtarestiform body. In one human autopsy, metastatic lesions involving the left juxtarestiform body and cerebellar tonsil accompanied partial degeneration of the left vestibular nerve root. The report leaves the destination of those fibres unresolved.
          fr: Les études anatomiques chez les primates non humains montrent que les fibres vestibulaires primaires pénètrent dans le cervelet par le corps juxtarestiforme. À l’autopsie d’un patient, des lésions métastatiques du corps juxtarestiforme et de la tonsille cérébelleuse à gauche s’accompagnaient d’une dégénérescence partielle de la racine du nerf vestibulaire gauche. La destination de ces fibres reste indéterminée.
        mapping:
          en: This teaching volume is NextBrain’s single parcel for the left inferior cerebellar peduncle, a broader landmark for the juxtarestiform body.
          fr: Ce volume pédagogique reprend la parcelle unique de NextBrain pour le pédoncule cérébelleux inférieur gauche, plus étendue que le corps juxtarestiforme.
        view: posterior
        plane: axial
      - id: nodulus
        region: learning:vermis-x
        source_name: Vermis X (nodulus)
        name: { en: Cerebellar nodulus, fr: Nodule cérébelleux }
        role: { en: Same-side target in the cerebellar cortex, fr: Cible du même côté dans le cortex cérébelleux }
        explanation:
          en: Radiolabelled amino-acid tracing in nonhuman primates identified primary vestibular mossy fibre endings in the granular layer of the ipsilateral nodulus. Independent transganglionic tracing in rhesus and cynomolgus macaques found a strong nodular projection from the utricular nerve.
          fr: Le traçage par des acides aminés radiomarqués chez des primates non humains a mis en évidence des terminaisons moussues d’afférences vestibulaires primaires dans la couche granulaire du nodule ipsilatéral. Un traçage transganglionnaire indépendant chez les macaques rhésus et crabier a montré une importante projection du nerf utriculaire vers le nodule.
        mapping:
          en: A single midline CerebNet parcel marks the whole vermis X. The branch reaches its left side.
          fr: Une seule parcelle médiane de CerebNet représente l’ensemble du vermis X. La branche atteint sa partie gauche.
        view: inferior
        plane: sagittal
  - id: ventral-spinocerebellar
    name: { en: Ventral spinocerebellar input, fr: Afférences spinocérébelleuses ventrales }
    summary:
      en: Follow a branch traced in cats that ascends opposite its lumbar origin and reaches the anterior vermis on the side of origin after an inferred second crossing.
      fr: Suivez une branche décrite par traçage chez le chat. Elle remonte du côté opposé à son origine lombaire et gagne le vermis antérieur du côté d’origine après un second croisement déduit de ces données.
    route:
      en: Right cervical ventral spinocerebellar tract after the spinal crossing → right superior cerebellar peduncle → left lateral anterior vermis after an inferred cerebellar recrossing
      fr: Faisceau spinocérébelleux ventral droit dans la moelle cervicale après le croisement dans la moelle → pédoncule cérébelleux supérieur droit → partie latérale gauche du vermis antérieur après un second croisement déduit des traçages
    scope:
      en: The anterior vermal branch is based on tracing from lower lumbar spinal border cells in cats. Cat tracing identified labelled axons in the superior cerebellar peduncle opposite the lumbar injections. Most of the labelled anterior-lobe terminals were on the side of the injections. These observations support an inferred return crossing for the selected branch. The lumbar origin and spinal crossing lie below the cervical scan, which covers vertebral levels C1 through part of C5. The intervening brainstem course and the inferred second crossing are outside the displayed landmarks. This tour omits other terminal fields and routes through the inferior cerebellar peduncle.
      fr: Cette branche vers le vermis antérieur repose sur des traçages à partir des cellules bordantes de la moelle lombaire basse chez le chat. Chez le chat, le traçage a identifié des axones marqués dans le pédoncule cérébelleux supérieur opposé aux injections lombaires. La plupart des terminaisons marquées dans le lobe antérieur se trouvaient du côté des injections. Ces observations permettent d’inférer un second croisement pour la branche illustrée. L’origine lombaire et le croisement spinal se situent sous le champ cervical de l’IRM, qui couvre les niveaux vertébraux de C1 jusqu’à une partie de C5. Le trajet intermédiaire dans le tronc cérébral et le second croisement déduit des traçages se situent hors des repères affichés. Le parcours laisse de côté les autres territoires de terminaison et les voies passant par le pédoncule cérébelleux inférieur.
    clinical:
      en: The link with cerebellar ataxia is partial and concerns the anterior vermal region. In a study of 90 people with cerebellar lesions, Schoch and colleagues analysed acute and chronic ischaemic and surgical groups separately. In the 21 adults examined after acute or subacute cerebellar ischaemia, the gait-ataxia association peaked in vermal lobule III and extended into vermal and paravermal white matter and the fastigial and interposed nuclei. The association with postural ataxia peaked in vermal white matter involving those nuclei. Gheihman and colleagues reported ataxic gait in a 65-year-old woman with a small infarct of the right superior vermis. These studies leave the effects of selective injury to these fibres unresolved.
      fr: Le lien avec l’ataxie cérébelleuse est partiel et concerne la région du vermis antérieur. Schoch et ses collègues ont étudié 90 personnes présentant des lésions cérébelleuses. Ils ont analysé séparément les groupes ischémiques et postopératoires, en phase aiguë et en phase chronique. Chez les 21 adultes examinés en phase aiguë ou subaiguë après une ischémie cérébelleuse, l’association avec l’ataxie de la marche culminait dans le lobule III du vermis et s’étendait à la substance blanche vermienne et paravermienne ainsi qu’aux noyaux fastigiaux et interposés. L’association avec l’ataxie posturale culminait dans la substance blanche vermienne, avec atteinte de ces mêmes noyaux. Gheihman et ses collègues ont décrit une marche ataxique chez une femme de 65 ans présentant un petit infarctus de la partie supérieure droite du vermis. Les effets d’une atteinte sélective de ces fibres restent indéterminés.
    deficit: ataxia
    references: [spinocerebellar-border-projections, spinocerebellar-peduncular-entry, spinocerebellar-cord-course, spinocerebellar-vermal-fields, spinocerebellar-macaque-peduncular-course, spinocerebellar-human-tractography, clinical-schoch-2006, clinical-gheihman-2023, spinocerebellar-dorsal-teaching]
    clinical_references: [clinical-schoch-2006, clinical-gheihman-2023]
    steps:
      - id: cervical-tract
        region: pam50:right:ventral-spinocerebellar-tract
        source_name: right ventral spinocerebellar tract
        name: { en: Right cervical ventral spinocerebellar tract, fr: Faisceau spinocérébelleux ventral droit dans la moelle cervicale }
        role: { en: Spinal ascent after the first crossing, fr: Ascension spinale après le premier croisement }
        explanation:
          en: In cats, traced axons of lower lumbar spinal border cells ascended on the opposite side of the cord. In this illustrated branch, fibres from the left lumbar cord have crossed and ascend on the right.
          fr: Chez le chat, le traçage montre que les axones des cellules bordantes de la moelle lombaire basse montent du côté opposé de la moelle. Dans la branche illustrée, les fibres issues de la moelle lombaire gauche ont déjà croisé et montent à droite.
        mapping:
          en: The registered PAM50 label estimates the position of the right ventral spinocerebellar tract in the displayed cervical cord.
          fr: L’étiquette PAM50 recalée estime la position du faisceau spinocérébelleux ventral droit dans la moelle cervicale affichée.
        view: posterior
        plane: axial
      - id: superior-peduncle
        region: learning:right:superior-cerebellar-peduncle
        source_name: Superior cerebellar peduncle
        name: { en: Right superior cerebellar peduncle, fr: Pédoncule cérébelleux supérieur droit }
        role: { en: Cerebellar entry on the side of spinal ascent, fr: Entrée dans le cervelet du côté de l’ascension spinale }
        explanation:
          en: In cats, tracing indicates that these fibres enter mainly by way of the superior cerebellar peduncle on the side of spinal ascent. In macaques, a degeneration study followed the ventral spinocerebellar tract along the superomedial aspect of this peduncle to the cerebellum. For the cat branch shown here, the predominance of terminals on the side of the lumbar origin implies a second crossing in the cerebellum. A diffusion tractography study of four healthy volunteers used the superior peduncle as a tracking region and reconstructed a few streamlines crossing at the level of the cerebellum. Their cells of origin and terminal fields remain unresolved.
          fr: Chez le chat, le traçage indique que ces fibres entrent principalement par le pédoncule cérébelleux supérieur du côté où elles remontent dans la moelle. Chez le macaque, une étude de dégénérescence axonale a suivi le faisceau spinocérébelleux ventral le long du versant supéromédial de ce pédoncule jusqu’au cervelet. Pour la branche illustrée chez le chat, la prédominance des terminaisons du côté de l’origine lombaire permet d’inférer un second croisement dans le cervelet. Une étude de tractographie par IRM de diffusion chez quatre volontaires en bonne santé a utilisé le pédoncule supérieur comme région d’intérêt et reconstruit quelques trajectoires croisées au niveau du cervelet. L’origine cellulaire et les territoires de terminaison de ces trajectoires restent indéterminés.
        mapping:
          en: This teaching volume is NextBrain’s outline of the whole right peduncle and provides a landmark for the entry of these fibres.
          fr: Ce volume pédagogique reprend le contour de l’ensemble du pédoncule droit dans NextBrain, qui sert de repère pour l’entrée de ces fibres.
        view: posterior
        plane: coronal
      - id: anterior-vermis
        region: learning:lobules-i-iv-left
        source_name: Lobules I–IV
        name: { en: Left cerebellar lobules I–IV, fr: Lobules cérébelleux I à IV gauches }
        role: { en: Landmark for the lateral anterior vermal terminal field, fr: Repère du territoire de terminaison latéral du vermis antérieur }
        explanation:
          en: Cat tracing showed terminal fields in the lateral anterior vermis, including parts of lobules II–IV. The selected left-sided field is on the side of the lumbar origin, across the cerebellar midline from the right peduncle.
          fr: Chez le chat, le traçage a montré des territoires de terminaison dans la partie latérale du vermis antérieur, notamment dans des portions des lobules II à IV. Le territoire gauche retenu est du côté de l’origine lombaire, de l’autre côté de la ligne médiane cérébelleuse par rapport au pédoncule droit.
        mapping:
          en: The left CerebNet parcel combines hemispheric lobules I–IV with the corresponding part of the anterior vermis. It provides a broad human landmark for the field traced in cats.
          fr: La parcelle gauche de CerebNet réunit les lobules hémisphériques I à IV et la partie correspondante du vermis antérieur. Elle fournit un repère général chez l’humain pour le territoire décrit par traçage chez le chat.
        view: superior
        plane: coronal

  - id: entorhinal-ca1
    name: { en: Direct entorhinal input to CA1, fr: Afférences entorhinales directes vers CA1 }
    summary:
      en: Follow fibres from the left entorhinal cortex through the subiculum to caudal hippocampal field CA1.
      fr: Suivez les fibres du cortex entorhinal gauche jusqu’à la partie caudale du champ hippocampique CA1 en passant par le subiculum.
    route:
      en: Left entorhinal cortex → through the left caudal subiculum → left caudal CA1 (stratum lacunosum-moleculare landmark)
      fr: Cortex entorhinal gauche → traversée du subiculum caudal gauche → champ CA1 caudal gauche (repéré par le stratum lacunosum-moleculare)
    scope:
      en: This tour illustrates the branch of the perforant pathway that crosses the subiculum to reach CA1. The angular bundle lies between the first two landmarks. Human polarized-light microscopy shows the orientation of myelinated fibre bundles. Macaque tracing establishes the entorhinal origin and direction of the projection. The tour leaves out the alvear route and branches to the dentate gyrus.
      fr: Le parcours illustre la branche de la voie perforante qui traverse le subiculum pour atteindre le champ CA1. Le faisceau angulaire se situe entre les deux premiers repères. La microscopie en lumière polarisée montre l’orientation des faisceaux de fibres myélinisées dans des coupes humaines. Le traçage chez le macaque établit l’origine entorhinale et le sens de la projection. Le parcours laisse de côté la voie alvéaire et les branches vers le gyrus denté.
    clinical:
      en: R.B. developed marked anterograde amnesia that persisted for five years after an ischaemic episode. Post-mortem examination showed extensive bilateral loss of CA1 pyramidal cells, with slight extension into the subiculum and CA3 in two caudal sections and small lesions elsewhere. Myelin staining showed apparently preserved fibres passing through CA1 to the dentate gyrus and CA3. In a later series that used R.B. as a historical comparator, G.D. had persistent anterograde amnesia with bilateral injury centred on CA1 and extending into the proximal subiculum. There was also possible very slight cell loss in layers III and V of the left entorhinal cortex and minor abnormalities elsewhere. The link to this route is partial. These cases support a link between bilateral CA1 injury and amnesia. The effects of injury confined to this perforant branch or to left caudal CA1 remain unresolved.
      fr: Après un épisode ischémique, R.B. a présenté une amnésie antérograde marquée qui a persisté pendant cinq ans. L’examen post mortem a montré une perte étendue de cellules pyramidales de CA1 des deux côtés, avec une légère extension au subiculum et à CA3 sur deux coupes caudales ainsi que de petites lésions ailleurs. La coloration de la myéline montrait des fibres apparemment préservées qui traversaient CA1 en direction du gyrus denté et du champ CA3. Dans une série ultérieure qui reprenait le cas de R.B. à titre de comparaison, G.D. présentait une amnésie antérograde persistante et une atteinte bilatérale prédominant dans le champ CA1, avec une extension au subiculum proximal. Une très légère perte cellulaire était possible dans les couches III et V du cortex entorhinal gauche, et des anomalies mineures étaient présentes ailleurs. Le lien avec ce trajet est partiel. Ces cas associent l’amnésie à une atteinte bilatérale de CA1. Les effets d’une lésion limitée à cette branche de la voie perforante ou au seul champ CA1 caudal gauche restent indéterminés.
    deficit: amnesia
    references: [entorhinal-ca1-laminar-anatomy, entorhinal-ca1-human-fibres, entorhinal-ca1-macaque-tracing, cortical-parcellation, clinical-zola-morgan-1986, clinical-rempel-clower-1996]
    clinical_references: [clinical-zola-morgan-1986, clinical-rempel-clower-1996]
    steps:
      - id: entorhinal
        region: hcp-mmp:left:118
        source_name: L_EC_ROI
        name: { en: Left entorhinal cortex, fr: Cortex entorhinal gauche }
        role: { en: Cortical origin of the projection, fr: Origine corticale de la projection }
        explanation:
          en: In macaques, anterograde and retrograde tracing identified layers III and V of the entorhinal cortex as the main sources of the projection to CA1. Lateral entorhinal regions projected to more caudal parts of the recipient fields. Human polarized-light microscopy shows the orientation of fibres between the entorhinal cortex and the angular bundle.
          fr: Chez le macaque, le traçage antérograde et rétrograde a situé l’origine de la projection vers CA1 principalement dans les couches III et V du cortex entorhinal. Les régions latérales du cortex entorhinal projetaient vers des parties plus caudales des champs cibles. Dans des coupes humaines, la microscopie en lumière polarisée montre l’orientation des fibres entre le cortex entorhinal et le faisceau angulaire.
        mapping:
          en: The HCP-MMP surface parcel marks the entorhinal area as a whole.
          fr: La parcelle surfacique HCP-MMP représente l’aire entorhinale dans son ensemble.
        view: inferior
        plane: coronal
      - id: subiculum
        region: nextbrain:left:576
        source_name: caudal_subiculum
        name: { en: Left caudal subiculum, fr: Subiculum caudal gauche }
        role: { en: Passage of perforant fibres, fr: Passage des fibres de la voie perforante }
        explanation:
          en: Polarized-light microscopy of human tissue shows myelinated fibre bundles crossing the subiculum from the angular bundle towards the subicular molecular layer. The caudal subiculum marks part of this passage.
          fr: En microscopie en lumière polarisée, les coupes humaines montrent des faisceaux de fibres myélinisées qui traversent le subiculum depuis le faisceau angulaire en direction de la couche moléculaire du subiculum. Le subiculum caudal situe une partie de ce trajet.
        mapping:
          en: The NextBrain parcel shows the caudal subiculum as an anatomical region through which the fibres pass.
          fr: La parcelle NextBrain représente la région anatomique du subiculum caudal traversée par les fibres.
        view: right
        plane: coronal
      - id: ca1
        region: nextbrain:left:562
        source_name: stratum_lacunosum-moleculare_of_caudal_ca1
        name: { en: Stratum lacunosum-moleculare of left caudal CA1, fr: Stratum lacunosum-moleculare du champ CA1 caudal gauche }
        role: { en: Landmark within the receiving CA1 field, fr: Repère dans le champ cible CA1 }
        explanation:
          en: In a sagittal section of the right human hippocampal tail, perforant fibres curve through the stratum radiatum towards the CA1 pyramidal layer. A coronal section from the posterior part of the left hippocampal head shows a comparable bend. The stratum lacunosum-moleculare contains the distal portions of CA1 pyramidal cells’ apical dendrites.
          fr: Dans une coupe sagittale de la queue de l’hippocampe droit chez l’humain, des fibres de la voie perforante décrivent un arc dans le stratum radiatum en direction de la couche pyramidale de CA1. Une coupe coronale de la partie postérieure de la tête de l’hippocampe gauche montre une courbure comparable. Le stratum lacunosum-moleculare contient les portions distales des dendrites apicales des cellules pyramidales de CA1.
        mapping:
          en: NextBrain outlines one layer of caudal CA1 as a landmark in the recipient field. The microscopy leaves individual terminal sites unresolved.
          fr: NextBrain délimite une couche du champ CA1 caudal qui sert de repère dans le champ cible. La microscopie laisse indéterminés les sites de terminaison des axones individuels.
        view: right
        plane: coronal

  - id: stria-terminalis
    name: { en: Amygdalar output through the stria terminalis, fr: Efférences amygdaliennes par la strie terminale }
    summary:
      en: Follow the curved course of the stria terminalis from the left amygdala to the bed nucleus in the basal forebrain.
      fr: Suivez le trajet courbe de la strie terminale depuis l’amygdale gauche jusqu’au noyau du lit de la strie terminale du même côté, dans le prosencéphale basal.
    route:
      en: Left amygdala → left stria terminalis → left bed nucleus of the stria terminalis
      fr: Amygdale gauche → strie terminale gauche → noyau gauche du lit de la strie terminale
    scope:
      en: Dissection of human brains shows a continuous bundle between the amygdala and the bed nucleus. The tour follows it on the left. In cynomolgus macaques, fibres labelled by an injection centred on the central amygdalar nucleus travel through the stria terminalis and intermingle with ventral amygdalofugal fibres within the bed nucleus. The contribution of each route to the labelled terminal fields remains unresolved in that study. Anterograde tracing from the medial central nucleus in rats also labelled fibres reaching the bed nucleus through both routes. The tour leaves out the ventral amygdalofugal pathway and other targets.
      fr: La dissection de cerveaux humains montre la continuité du faisceau entre l’amygdale et le noyau du lit de la strie terminale. Le parcours suit le faisceau à gauche. Chez le macaque crabier, des fibres marquées par une injection centrée sur le noyau central de l’amygdale empruntent la strie terminale et se mêlent aux fibres de la voie amygdalofuge ventrale dans le noyau du lit. Dans cette étude, la part de chaque voie dans les champs de terminaison marqués reste indéterminée. Chez le rat, un traçage antérograde à partir de la subdivision médiale du noyau central a aussi marqué des fibres qui rejoignaient le noyau du lit par les deux voies. Le parcours laisse de côté la voie amygdalofuge ventrale et les autres cibles.
    clinical:
      en: The clinical link is partial and concerns the amygdalar origin within larger bilateral lesions. After herpes simplex encephalitis, three adults with bilateral anterior temporal damage were less accurate as a group than six healthy controls at labelling fear and sadness in photographs of faces. Their lesions involved both amygdalae, the hippocampal region and nearby temporal cortex. At autopsy in one of the same patients (E.P.), the amygdalar complex was almost entirely absent bilaterally. The stria terminalis and ventral amygdalofugal pathway showed atrophy and gliosis. After nonherpetic encephalitis, only one of two adults with bilateral amygdalar and hippocampal damage scored significantly below healthy controls at identifying fear in both still and moving faces. In a study of 30 patients with acute right-hemisphere ischemic stroke, mean accuracy for fearful faces was 34%, compared with 54% in 30 healthy controls. The association between right amygdala damage and fear recognition was inconclusive. These studies leave unresolved how injury confined to the central amygdalar nucleus, stria terminalis or bed nucleus affects recognition of facial emotions.
      fr: Le lien clinique est partiel et concerne l’origine amygdalienne au sein de lésions bilatérales plus étendues. Après une encéphalite herpétique, trois adultes présentant des lésions temporales antérieures bilatérales identifiaient en moyenne moins bien que six témoins sains la peur et la tristesse sur des photographies de visages. Leurs lésions touchaient les deux amygdales, la région hippocampique et le cortex temporal adjacent. À l’autopsie de l’un de ces mêmes patients (E.P.), le complexe amygdalien avait presque entièrement disparu des deux côtés. La strie terminale et la voie amygdalofuge ventrale présentaient une atrophie et une gliose. Après une encéphalite non herpétique, un seul des deux adultes présentant des lésions bilatérales des amygdales et des hippocampes a obtenu des scores significativement inférieurs à ceux des témoins sains pour la reconnaissance de la peur sur des photographies comme sur des vidéos de visages. Dans une étude portant sur 30 patients ayant subi un AVC ischémique aigu de l’hémisphère droit, le taux moyen de bonnes réponses pour les visages exprimant la peur était de 34 %, contre 54 % chez 30 témoins sains. Le lien entre une lésion de l’amygdale droite et la reconnaissance de la peur restait incertain. Ces études laissent indéterminés les effets d’une lésion limitée au noyau central de l’amygdale, à la strie terminale ou au noyau du lit sur la reconnaissance des émotions faciales.
    deficit: emotion-recognition
    references: [stria-terminalis-primate-1981, stria-terminalis-human-histology-2017, stria-terminalis-human-dissection-2025, clinical-schmolck-2001, clinical-hayakawa-2010, clinical-tippett-2018, stria-terminalis-rat-anatomy, stria-terminalis-bed-nucleus-cytoarchitecture, clinical-insausti-ep-neuropathology-2013]
    clinical_references: [clinical-schmolck-2001, clinical-hayakawa-2010, clinical-tippett-2018, clinical-insausti-ep-neuropathology-2013]
    steps:
      - id: amygdala
        region: nextbrain:left:277
        source_name: medial_subdivision_of_central_nucleus
        name: { en: Medial subdivision of the left central amygdalar nucleus, fr: Subdivision médiale du noyau central de l’amygdale gauche }
        role: { en: Landmark at the amygdalar origin, fr: Repère à l’origine amygdalienne }
        explanation:
          en: Serial sections matched to postmortem MRI in a human specimen show the stria terminalis at the caudal surface of the amygdala. In cynomolgus macaques, anterograde tracing from the central amygdalar nucleus labels fibres in the bundle.
          fr: Dans un cerveau humain, des coupes sériées comparées à l’IRM post mortem montrent la strie terminale à la face caudale de l’amygdale. Chez le macaque crabier, un traçage antérograde à partir du noyau central de l’amygdale marque des fibres dans le faisceau.
        mapping:
          en: NextBrain shows the medial subdivision as a landmark for the central nucleus. The macaque injection that labelled fibres in the stria terminalis covered most of the central nucleus.
          fr: NextBrain délimite la subdivision médiale, qui sert de repère pour le noyau central. Chez le macaque, l’injection qui a marqué des fibres de la strie terminale englobait la majeure partie du noyau central.
        view: right
        plane: coronal
      - id: stria
        region: nextbrain:left:184
        source_name: stria_terminalis
        name: { en: Left stria terminalis, fr: Strie terminale gauche }
        role: { en: Curved course through the forebrain, fr: Trajet courbe dans le prosencéphale }
        explanation:
          en: In human dissections, the bundle runs posteriorly from the amygdala on the medial side of the caudate tail. It ascends and follows the upper border of the thalamus anteriorly, then turns down towards the bed nucleus.
          fr: Dans les dissections de cerveaux humains, le faisceau se dirige vers l’arrière depuis l’amygdale en passant du côté médial de la queue du noyau caudé. Il remonte, longe le bord supérieur du thalamus vers l’avant, puis redescend vers le noyau du lit.
        mapping:
          en: NextBrain displays the stria terminalis as a segmented tissue volume.
          fr: NextBrain délimite la strie terminale sous la forme d’un volume tissulaire.
        view: right
        plane: coronal
      - id: bed-nucleus
        region: nextbrain:left:117
        source_name: bed_nucleus_of_stria_terminalis
        name: { en: Left bed nucleus of the stria terminalis, fr: Noyau gauche du lit de la strie terminale }
        role: { en: Destination in the basal forebrain, fr: Cible dans le prosencéphale basal }
        explanation:
          en: In human dissections, the stria terminalis reaches the posterolateral surface of the bed nucleus near the anterior commissure.
          fr: En dissection humaine, la strie terminale atteint la face postérolatérale du noyau du lit, à proximité de la commissure antérieure.
        mapping:
          en: NextBrain segments the bed nucleus as one volume. Human cytoarchitecture distinguishes several subdivisions of this nucleus. An injection centred on the central amygdalar nucleus labels several parts of the bed nucleus in cynomolgus macaques.
          fr: NextBrain délimite le noyau du lit en un seul volume. La cytoarchitecture humaine distingue plusieurs subdivisions de ce noyau. Chez le macaque crabier, une injection centrée sur le noyau central de l’amygdale a marqué plusieurs parties du noyau du lit.
        view: right
        plane: coronal

  - id: motion-mt-mst
    name: { en: Cortical visual motion pathway, fr: Voie corticale de la vision du mouvement }
    summary:
      en: Follow a branch for visual motion from primary visual cortex through areas MT and MST.
      fr: Suivez une branche corticale de la vision du mouvement, de V1 à MST en passant par MT.
    route:
      en: Right V1 → right MT (V5) → right MST
      fr: V1 droite → MT (V5) droite → MST droite
    scope:
      en: Tracing in macaques identifies two successive forward projections in the same hemisphere. The tour shows the right hemisphere using comparative landmarks from the human atlas. In adults with occipital stroke, diffusion tractography estimated streamlines passing through functionally defined V1 and MT regions in the affected hemisphere. The direction and precise course of the corresponding human projections remain unresolved in the cited human studies. The tour leaves out inputs to MT from V2, V3 and the thalamus, interhemispheric connections, feedback projections and projections beyond MST.
      fr: Le traçage chez le macaque met en évidence deux projections successives qui remontent la hiérarchie visuelle dans le même hémisphère. Le parcours utilise les repères de l’atlas humain pour les situer dans l’hémisphère droit. Chez des adultes ayant subi un AVC occipital, la tractographie par IRM de diffusion a fourni une estimation des trajectoires passant par des régions de V1 et de MT repérées en IRM fonctionnelle dans l’hémisphère lésé. Le sens et le trajet précis des projections correspondantes restent indéterminés dans les études chez l’humain citées ici. Le parcours laisse de côté les afférences de V2, de V3 et du thalamus à MT, les connexions interhémisphériques, les rétroprojections et les projections au-delà de MST.
    clinical:
      en: The clinical link with akinetopsia is partial and concerns the lateral occipitotemporal region that contains MT/V5. L.M. had a lasting impairment of visual motion perception after bilateral injury to the upper parts of the occipital gyri and the adjacent parts of the middle temporal gyri, with associated occipital and occipitoparietal white-matter changes. In the same patient, Shipp and colleagues found that the lesions overlapped V5 locations previously identified with PET in control participants. In a separate stroke case, T.D. had a larger right occipitotemporal infarct and a smaller left occipital infarct. Both overlapped a meta-analytic V5 map superimposed on structural MRI. The right lesion also involved part of the optic radiation. In a moving-dot task, T.D. correctly reported the direction on all 48 trials at each of the three slowest speeds (2, 4.5 and 9°/s) and on 25 of 48 trials at 15°/s. At 24°/s, she reported the opposite direction on 47 of 48 trials. A third patient still had motion blindness about five months after a postoperative right temporoparietal subcortical haemorrhage adjacent to an earlier infarct. In another lesion series, injury to posterior middle temporal cortex was associated with poorer discrimination of the direction of coherently moving dots. One patient whose lesions overlapped the left and right hMT+ template masks and spared the posterior superior temporal sulcus template masks had marked difficulty judging dot-motion direction. In a separate stroke cohort, no association between lesion location and performance on a task judging the direction of dots at varying levels of motion coherence survived correction. Lesions rarely involved the MT/MST region. The effects of damage confined to MT, MST or this branch remain unresolved.
      fr: Le lien clinique avec l’akinétopsie est partiel et concerne la région occipitotemporale latérale qui comprend MT/V5. L.M. a présenté un trouble durable de la perception visuelle du mouvement après des lésions bilatérales touchant la partie supérieure des gyrus occipitaux et la partie adjacente des gyrus temporaux moyens, avec des anomalies de la substance blanche occipitale et occipitopariétale. Chez la même patiente, Shipp et ses collègues ont constaté que les lésions recoupaient des localisations de V5 repérées auparavant en TEP chez des témoins. Dans un autre cas d’AVC, T.D. présentait un infarctus occipitotemporal droit plus étendu et un infarctus occipital gauche plus petit. Les deux lésions recoupaient une carte de V5 issue d’une méta-analyse et superposée à l’IRM anatomique. La lésion droite touchait aussi une partie des radiations optiques. Lors d’une épreuve avec des points en mouvement, T.D. a correctement indiqué le sens du déplacement lors des 48 essais à chacune des trois vitesses les plus faibles (2 °/s, 4,5 °/s et 9 °/s) et lors de 25 essais sur 48 à 15 °/s. À 24 °/s, elle a indiqué le sens opposé dans 47 essais sur 48. Chez un troisième patient, la cécité au mouvement persistait environ cinq mois après une hémorragie postopératoire dans la région sous-corticale temporopariétale droite, au voisinage d’un infarctus antérieur. Dans une autre série de patients, des lésions de la partie postérieure du cortex temporal moyen étaient associées à une moins bonne discrimination du sens de déplacement de points se déplaçant de façon cohérente. Chez l’un des patients, qui éprouvait une difficulté marquée à indiquer le sens du déplacement des points, les lésions recoupaient les masques de référence gauche et droit du complexe hMT+ et épargnaient ceux du sillon temporal supérieur postérieur. Dans une cohorte distincte de patients ayant subi un AVC, aucune association entre le site des lésions et les résultats à une épreuve de jugement du sens du déplacement de points à plusieurs niveaux de cohérence n’a franchi le seuil statistique corrigé. Les lésions touchaient rarement la région MT/MST. Les effets de lésions circonscrites à MT, à MST ou à cette branche restent indéterminés.
    deficit: akinetopsia
    references: [visual-motion-mt-tracing, visual-motion-mst-tracing, visual-motion-human-retinotopy, cortical-parcellation, visual-motion-v1-mt-human-tractography, clinical-zihl-1991, clinical-heutink-2019, clinical-otsuka-hirota-2014, clinical-prabhakar-motion-2025, clinical-lugtmeijer-2025, geniculate-mt-teaching-review, visual-motion-mt-human-homology, clinical-shipp-1994]
    clinical_references: [clinical-zihl-1991, clinical-heutink-2019, clinical-otsuka-hirota-2014, clinical-prabhakar-motion-2025, clinical-lugtmeijer-2025, clinical-shipp-1994]
    steps:
      - id: v1
        region: hcp-mmp:right:1
        source_name: R_V1_ROI
        name: { en: Right primary visual cortex (V1), fr: Cortex visuel primaire droit (V1) }
        role: { en: Origin of the direct projection to MT, fr: Origine de la projection directe vers MT }
        explanation:
          en: In cynomolgus macaques, retrograde tracing from MT labelled V1 neurons mainly in layer 4B, with a few in upper layer 6.
          fr: Chez le macaque crabier, un traceur rétrograde injecté dans MT a marqué des neurones de V1, surtout dans la couche 4B et en petit nombre dans la partie supérieure de la couche 6.
        mapping:
          en: The HCP-MMP surface parcel represents the estimated boundaries of human V1.
          fr: La parcelle surfacique HCP-MMP représente les limites estimées de V1 chez l’humain.
        view: left
        plane: coronal
      - id: mt
        region: hcp-mmp:right:23
        source_name: R_MT_ROI
        name: { en: Right middle temporal visual area (MT or V5), fr: Aire visuelle temporale moyenne droite (MT ou V5) }
        role: { en: Recipient of V1 input and source of the MST projection, fr: Cible des afférences de V1 et origine de la projection vers MST }
        explanation:
          en: In cynomolgus macaques, tracers injected into MT labelled V1 neurons representing the same part of the visual field as the injection site. The injections also labelled projections from MT to MST.
          fr: Chez le macaque crabier, les traceurs injectés dans MT ont marqué des neurones de V1 qui représentent la même portion du champ visuel que le site d’injection. Les injections ont aussi marqué des projections de MT vers MST.
        mapping:
          en: The HCP-MMP parcel marks MT within the human MT+ complex. Visual field mapping distinguishes MT from its neighbours.
          fr: La parcelle HCP-MMP situe MT au sein du complexe MT+ humain. La cartographie du champ visuel permet de distinguer MT des aires voisines.
        view: right
        plane: axial
      - id: mst
        region: hcp-mmp:right:2
        source_name: R_MST_ROI
        name: { en: Right medial superior temporal area (MST), fr: Aire temporale supérieure médiale droite (MST) }
        role: { en: Target of the projection from MT, fr: Cible de la projection issue de MT }
        explanation:
          en: In cynomolgus macaques, anterograde labelling from MT was densest in layer 4 of the sampled MST territory.
          fr: Chez le macaque crabier, le marquage antérograde à partir de MT était le plus dense dans la couche 4 du territoire de MST étudié.
        mapping:
          en: HCP-MMP places MST just anterior to MT in the human MT+ complex. Human retinotopic mapping places a putative ventral MST area (pMSTv) immediately anterior to MT. The exact correspondence between the HCP-MMP parcel and macaque MST subdivisions remains uncertain.
          fr: HCP-MMP situe MST juste en avant de MT dans le complexe MT+ humain. La cartographie rétinotopique chez l’humain situe une aire ventrale présumée de MST (pMSTv) juste en avant de MT. La correspondance précise entre la parcelle HCP-MMP et les subdivisions de MST chez le macaque reste incertaine.
        view: right
        plane: axial

  - id: colour
    name: { en: Ventral visual branch to V4, fr: Branche visuelle ventrale vers V4 }
    summary:
      en: Follow a branch of the ventral visual stream from V1 through V2 to V4 and see how tracer studies in macaques identify each projection.
      fr: Suivez une branche de la voie visuelle ventrale de V1 à V4 en passant par V2 et voyez comment les études de traçage chez le macaque ont mis en évidence chaque projection.
    route:
      en: Right V1 → right V2 → right V4
      fr: V1 droite → V2 droite → V4 droite
    scope:
      en: The branch combines two projections traced separately in macaque cortex representing central vision. The studies identify an anatomical sequence at the level of the V2 thin-stripe compartment. The right-hemisphere parcels in the human atlas show whole cortical areas. The route stops at V4 and leaves out feedback and onward projections to temporal cortex.
      fr: Cette branche réunit deux projections tracées séparément dans les régions du cortex du macaque qui représentent le champ visuel central. Les études établissent une succession anatomique à l’échelle des bandes fines de V2. Les parcelles de l’hémisphère droit de l’atlas humain délimitent des aires corticales entières. Le parcours s’arrête à V4 et laisse de côté les rétroprojections et les projections vers le cortex temporal.
    clinical:
      en: The clinical link is partial in ventral occipital cortex around human V4. An adult with bilateral infarcts involving the lingual and fusiform gyri had impaired hue sorting and described colours as desaturated. She also had visual field loss and injury beyond those gyri. Bouvier and Engel reviewed 92 published cases of acquired achromatopsia. The lesion maps for 46 of these cases showed a small region of high overlap in ventral occipital cortex. An erratum corrects the coordinates of two small foci affected in 8 of 11 mapped cases with intact face recognition. Most reports with detailed psychophysical testing of spatial vision described additional deficits. In a stroke series of adults at assessment with preserved central visual fields, Spang and colleagues associated injury near human V4 at the lingual–fusiform boundary with impaired detection of colour-defined targets. Thirty-six of 51 patients contributed to this analysis. The detection association survived statistical correction. The researchers reflected right-sided lesions to the left and found no corrected association for colour-defined form discrimination. In a separate cohort recruited by lesion location, Munk and colleagues analysed 63 patients with posterior cerebral artery stroke. Fourteen patients scored significantly worse than the 45 controls on the Farnsworth D-15 colour-sorting test. This included 9 of 32 patients with left-hemisphere lesions, 1 of 22 with right-hemisphere lesions and 4 of 9 with bilateral lesions. An exploratory stepwise regression using lesion measurements from selected regions and tracts in the posterior cerebral artery territory associated poorer scores with damage to the left occipital fusiform gyrus and the left temporo-occipital portion of the inferior temporal gyrus, among other predictors. With free binocular viewing, the test could not establish whether the colour deficits affected part or all of the visual field. In a separate cohort of 153 stroke patients, no parcel association survived correction for the red–green discrimination task, including right V4, which had lesion coverage in 21 patients. The contribution of the specific connections shown in this tour remains unresolved.
      fr: Le lien clinique est partiel dans le cortex occipital ventral autour de l’aire hV4. Une adulte dont les infarctus bilatéraux touchaient les gyrus lingual et fusiforme classait mal les teintes et percevait des couleurs désaturées. Elle présentait aussi une perte du champ visuel et des lésions au-delà de ces gyrus. Bouvier et Engel ont recensé 92 cas publiés d’achromatopsie acquise. La cartographie des lésions de 46 de ces cas a révélé une petite région de fort chevauchement dans le cortex occipital ventral. Un erratum corrige les coordonnées de deux petits foyers lésés dans 8 des 11 cas cartographiés où la reconnaissance des visages était préservée. La plupart des publications qui comprenaient des tests psychophysiques approfondis de la vision spatiale décrivaient des déficits supplémentaires. Dans une série après AVC comprenant des adultes à l’évaluation dont le champ visuel central était préservé, Spang et ses collègues ont associé une lésion à la jonction des gyrus lingual et fusiforme, près de hV4, à des difficultés de détection de cibles définies par la couleur. L’analyse portait sur 36 des 51 patients. L’association avec la détection a franchi le seuil statistique corrigé. Les chercheurs ont reporté les lésions droites par symétrie à gauche. Aucune association avec la discrimination de formes définies par la couleur n’a franchi le seuil corrigé. Dans une autre cohorte recrutée selon le siège de la lésion, Munk et ses collègues ont analysé les données de 63 patients ayant subi un AVC dans le territoire de l’artère cérébrale postérieure. Quatorze patients ont obtenu des scores significativement moins bons que ceux des 45 témoins au test de classement de pastilles colorées de Farnsworth D-15. Ces scores concernaient 9 des 32 patients présentant une lésion de l’hémisphère gauche, 1 des 22 présentant une lésion de l’hémisphère droit et 4 des 9 présentant des lésions bilatérales. Une régression exploratoire par sélection pas à pas utilisant des mesures lésionnelles dans des régions et des faisceaux présélectionnés du territoire de l’artère cérébrale postérieure a associé les moins bons scores à des lésions du gyrus fusiforme occipital gauche et de la portion temporo-occipitale du gyrus temporal inférieur gauche, parmi les facteurs retenus. Le test se déroulait en vision binoculaire libre et ne permettait pas d’établir si les déficits de la vision des couleurs touchaient une partie ou la totalité du champ visuel. Dans une cohorte distincte de 153 patients ayant subi un AVC, aucune association avec une parcelle n’a franchi le seuil corrigé à l’épreuve de discrimination rouge-vert. La parcelle V4 droite était comprise dans l’analyse et était lésée chez 21 patients. La contribution propre des connexions illustrées dans ce parcours reste indéterminée.
    deficit: achromatopsia
    references: [visual-v1-v2-tracing, visual-v2-v4-retrograde, visual-v2-v4-anterograde, visual-v4-retinotopy, cortical-parcellation, clinical-bouvier-2006, clinical-munk-colour-stroke-2023, visual-v4-teaching-review, clinical-spang-v4-stroke-2021, clinical-lugtmeijer-2025, clinical-crognale-2013]
    clinical_references: [clinical-bouvier-2006, clinical-munk-colour-stroke-2023, clinical-spang-v4-stroke-2021, clinical-lugtmeijer-2025, clinical-crognale-2013]
    steps:
      - id: v1
        region: hcp-mmp:right:1
        source_name: R_V1_ROI
        name: { en: Right primary visual cortex, fr: Cortex visuel primaire droit }
        role: { en: Cortical source of input to V2, fr: Origine corticale des projections vers V2 }
        explanation:
          en: In rhesus and cynomolgus macaques, retrograde tracers placed in thin stripes of V2 labelled neurons in V1 patches rich in cytochrome oxidase.
          fr: Chez les macaques rhésus et crabier, des traceurs rétrogrades déposés dans les bandes fines de V2 ont marqué des neurones dans des îlots de V1 riches en cytochrome oxydase.
        mapping:
          en: HCP-MMP shows the whole right V1 parcel around the calcarine sulcus. The patches supplying the thin stripes are finer divisions identified in macaque tissue.
          fr: HCP-MMP montre l’ensemble de la parcelle V1 droite autour du sillon calcarin. Les îlots qui projettent vers les bandes fines sont des subdivisions plus petites repérées dans le tissu cortical du macaque.
        view: left
        plane: coronal
      - id: v2
        region: hcp-mmp:right:4
        source_name: R_V2_ROI
        name: { en: Right visual area V2, fr: Aire visuelle V2 droite }
        role: { en: Link through V2 thin stripes, fr: Relais par les bandes fines de V2 }
        explanation:
          en: In the foveal and parafoveal representation of cynomolgus macaques, anterograde tracer injected into an optically identified V2 thin stripe labelled axons in V4.
          fr: Dans la représentation fovéale et parafovéale du macaque crabier, un traceur antérograde injecté dans une bande fine de V2 repérée par imagerie optique a marqué des axones dans V4.
        mapping:
          en: The parcel covers the superior and inferior parts of human V2. The thin stripes are subdivisions within macaque V2, below the atlas scale.
          fr: La parcelle couvre les parties supérieure et inférieure de V2 chez l’humain. Les bandes fines sont des subdivisions de V2 chez le macaque, plus petites que les parcelles de l’atlas.
        view: left
        plane: coronal
      - id: v4
        region: hcp-mmp:right:6
        source_name: R_V4_ROI
        name: { en: Right visual area V4, fr: Aire visuelle V4 droite }
        role: { en: Extrastriate target of projections from V2, fr: Cible extrastriée des projections de V2 }
        explanation:
          en: In macaques, some parts of V4 receive input from both the thin stripes and the pale regions between stripes in V2.
          fr: Chez le macaque, certaines parties de V4 reçoivent des projections des bandes fines de V2 et des zones pâles qui séparent les bandes.
        mapping:
          en: The inferior part of HCP-MMP V4 substantially overlaps hV4 as mapped by retinotopic fMRI in humans. The full parcel includes a superior part that overlaps several other areas in the same retinotopic map.
          fr: La partie inférieure de V4 dans HCP-MMP recouvre largement hV4, délimitée par cartographie rétinotopique en IRM fonctionnelle chez l’humain. La parcelle entière comprend aussi une partie supérieure qui chevauche plusieurs autres aires de cette même carte rétinotopique.
        view: inferior
        plane: coronal

  - id: transcallosal-sma
    name: { en: Callosal pathway between supplementary motor areas, fr: Voie calleuse entre les aires motrices supplémentaires }
    summary:
      en: Follow the route from the left caudal supplementary motor area (SMA proper) across the corpus callosum to its right counterpart.
      fr: Suivez, à travers le corps calleux, la branche qui relie la partie caudale de l’aire motrice supplémentaire (AMS) gauche à son homologue dans l’hémisphère droit.
    route:
      en: Left caudal supplementary motor area → corpus callosum (midline crossing) → right caudal supplementary motor area
      fr: Partie caudale de l’aire motrice supplémentaire gauche → corps calleux (passage de la ligne médiane) → partie caudale de l’aire motrice supplémentaire droite
    scope:
      en: The tour leaves out the pre-SMA’s callosal projections and the SMA’s connections with other motor areas. Human dissection shows the gross course of fibres from the supplementary motor complex. Human diffusion tractography estimates paths between the caudal SMA regions, and macaque tracing shows connections of the hand representation.
      fr: Le parcours laisse de côté les projections calleuses de la pré-AMS et les connexions de l’AMS avec d’autres aires motrices. La dissection chez l’humain montre le trajet macroscopique des fibres du complexe moteur supplémentaire. La tractographie de diffusion chez l’humain permet d’estimer des trajets entre les deux AMS caudales, et le traçage chez le macaque montre les connexions de la représentation de la main.
    clinical:
      en: The clinical link is partial at the caudal supplementary motor area. After medial frontal surgery, 11 of 23 adults showed reduced spontaneous movement opposite the operated side. Their resection cavities involved the posterior supplementary motor area identified by a preoperative finger-movement task. In a separate series of 24 adults operated on for glioma near the supplementary motor area, five of the eight whose resections included the supplementary motor area, cingulate gyrus and corpus callosum had severe upper-limb paresis. None of the five whose resections were confined to the supplementary motor area did. The resection groups were small, no operation interrupted this callosal branch alone, and its own contribution remains unresolved.
      fr: Le lien clinique est partiel au niveau de la partie caudale de l’aire motrice supplémentaire. Après une chirurgie frontale médiale, onze adultes sur vingt-trois présentaient une réduction des mouvements spontanés du côté opposé à l’intervention. Leurs cavités de résection touchaient la partie postérieure de l’aire motrice supplémentaire repérée par une tâche préopératoire de mouvements des doigts. Dans une autre série de 24 adultes opérés d’un gliome proche de l’aire motrice supplémentaire, cinq des huit patients dont la résection incluait l’aire motrice supplémentaire, le gyrus cingulaire et le corps calleux avaient une parésie sévère du membre supérieur. Aucun des cinq dont la résection se limitait à l’aire motrice supplémentaire n’en avait. Les groupes de résection étaient petits, aucune intervention n’interrompait cette seule branche calleuse, et sa contribution propre reste indéterminée.
    deficit: sma-syndrome
    references: [sma-callosal-vergani-2014, sma-callosal-bozkurt-2017, sma-callosal-ruddy-2017, sma-callosal-xiong-2024, sma-callosal-rouiller-1994, cortical-parcellation, clinical-krainik-2001, clinical-kakuta-2025]
    clinical_references: [clinical-krainik-2001, clinical-kakuta-2025]
    steps:
      - id: left-sma-proper
        region: hcp-mmp:left:55
        source_name: L_6mp_ROI
        name: { en: Left caudal supplementary motor area, fr: Partie caudale de l’aire motrice supplémentaire gauche }
        role: { en: Cortical origin of the branch, fr: Origine corticale de la branche }
        explanation:
          en: Human dissections show fibres between SMA proper, the caudal part of the supplementary motor complex, and the corpus callosum. In macaques, retrograde tracer injected into the hand representation of one SMA labelled neurons in the opposite SMA.
          fr: La dissection chez l’humain montre des fibres entre l’AMS proprement dite, qui forme la partie caudale du complexe moteur supplémentaire, et le corps calleux. Chez le macaque, l’injection d’un traceur rétrograde dans la représentation de la main d’une AMS a marqué des neurones dans l’AMS opposée.
        mapping:
          en: HCP-MMP area 6mp overlaps the caudal SMA on the medial surface and extends onto the superolateral surface. The landmark shows the whole cortical parcel.
          fr: L’aire 6mp du HCP-MMP recouvre en partie l’AMS caudale sur la face médiale et se prolonge sur la face supérolatérale. Le repère montre la parcelle corticale entière.
        view: right
        plane: coronal
      - id: corpus-callosum
        region: learning:corpus-callosum
        source_name: Corpus callosum
        name: { en: Corpus callosum, fr: Corps calleux }
        role: { en: Midline crossing of the fibres, fr: Franchissement de la ligne médiane }
        explanation:
          en: Here the branch crosses from the left hemisphere to the right. In one human dissection series, fibres from both the pre-SMA and the SMA proper converged on the rostrum and anterior callosal body. Human diffusion tractography estimated paths passing through the regions defined as caudal SMA on both sides. A group diffusion tractography atlas mapped the midline crossings of reconstructed streamlines linking the two HCP-MMP 6mp parcels. The voxel where these crossings were reconstructed in the highest proportion of participants lay in the posterior midbody, as defined by Witelson.
          fr: La branche franchit ici la ligne médiane de l’hémisphère gauche vers le droit. Dans une série de dissections chez l’humain, les fibres de la pré-AMS et de l’AMS proprement dite convergeaient vers le rostre et la partie antérieure du tronc du corps calleux. La tractographie de diffusion chez l’humain a permis d’estimer des trajets passant par la région définie comme AMS caudale dans chaque hémisphère. Un atlas de groupe établi par tractographie de diffusion a cartographié le passage médian des trajectoires reconstruites entre les deux parcelles 6mp du HCP-MMP. Le voxel où un tel passage a été retrouvé chez la plus grande proportion de participants se situait dans la partie postérieure du tronc calleux selon le découpage de Witelson.
        mapping:
          en: The teaching label combines the five FreeSurfer callosal regions to mark the midline passage at the scale of the corpus callosum.
          fr: Le repère réunit les cinq subdivisions calleuses de FreeSurfer et situe le passage médian à l’échelle du corps calleux.
        view: right
        plane: sagittal
      - id: right-sma-proper
        region: hcp-mmp:right:55
        source_name: R_6mp_ROI
        name: { en: Right caudal supplementary motor area, fr: Partie caudale de l’aire motrice supplémentaire droite }
        role: { en: Contralateral cortical target, fr: Cible corticale controlatérale }
        explanation:
          en: In macaques, an anterograde tracer injected into the hand representation of one SMA labelled axon terminals widely distributed in the opposite SMA.
          fr: Chez le macaque, l’injection d’un traceur antérograde dans la représentation de la main d’une AMS a marqué des terminaisons axonales réparties sur une grande partie de l’AMS opposée.
        mapping:
          en: The right 6mp parcel marks the contralateral caudal SMA at the scale of a cortical area. The full parcel includes the superolateral extension of area 6mp.
          fr: La parcelle 6mp droite situe l’AMS caudale controlatérale à l’échelle d’une aire corticale. Elle comprend le prolongement supérolatéral de l’aire 6mp.
        view: left
        plane: coronal

  - id: schaffer-collaterals
    name: { en: Schaffer collaterals from CA3 to CA1, fr: Collatérales de Schaffer de CA3 vers CA1 }
    summary:
      en: Follow the Schaffer collaterals from CA3 to CA1, the third connection in the hippocampal trisynaptic circuit.
      fr: Suivez les collatérales de Schaffer de CA3 vers CA1, troisième connexion du circuit trisynaptique hippocampique.
    route:
      en: Left rostral CA3 (stratum pyramidale) → left rostral CA1 (stratum radiatum)
      fr: Champ CA3 rostral gauche (stratum pyramidale) → champ CA1 rostral gauche (stratum radiatum)
    scope:
      en: The left-sided human landmarks represent two layers identified by histology in the hippocampal head. Macaque tracing establishes the direction of the projection. The tour omits the mossy-fibre input from the dentate gyrus, other CA1 receiving layers and projections to other levels of the hippocampus. Post-mortem diffusion tractography of right human hippocampi estimated streamlines in the pyramidal layer that the authors interpreted as Schaffer collaterals. The direction and precise terminations in the human hippocampal head remain unresolved.
      fr: Les repères humains du côté gauche représentent deux couches identifiées par histologie dans la tête de l’hippocampe. Le traçage chez le macaque établit le sens de la projection. Le parcours laisse de côté les afférences des fibres moussues du gyrus denté, les autres couches cibles de CA1 et les projections vers d’autres niveaux de l’hippocampe. La tractographie par IRM de diffusion d’hippocampes droits humains prélevés post mortem a estimé des trajectoires dans la couche pyramidale, que les auteurs ont attribuées aux collatérales de Schaffer. Le sens et les terminaisons précises de la projection dans la tête de l’hippocampe humain restent indéterminés.
    clinical:
      en: The clinical link is partial. R.B. and G.D. developed persistent anterograde amnesia after ischaemic episodes. G.D.’s post-mortem examination showed bilateral CA1 pyramidal-cell loss, increased glial cell density in the stratum radiatum and stratum oriens, and some loss of cells in the adjacent subiculum. The series also used R.B.’s published data for comparison. L.M., another patient in the series, had persistent anterograde amnesia and retrograde amnesia affecting memories from at least 15 years before onset with more extensive bilateral injury that included rostral CA3 pyramidal-cell loss. In a separate study after autoimmune limbic encephalitis, 7 T MRI showed a 29% lower mean CA3 volume across both hippocampi in 15 patients than in 15 controls. The smaller CA1 difference fell below the threshold after correction for multiple comparisons. The volume difference was measured across the whole subfield. In the autobiographical interview, the 16 patients recalled fewer event-specific details than 16 controls across the past year and three earlier periods from age 11 onward. The effects of a lesion confined to the Schaffer collaterals remain unknown.
      fr: Le lien clinique est partiel. R.B. et G.D. ont présenté une amnésie antérograde persistante après des épisodes ischémiques. Chez G.D., l’examen post mortem a montré une perte bilatérale des cellules pyramidales de CA1, une densité accrue de cellules gliales dans le stratum radiatum et le stratum oriens, ainsi qu’une certaine perte neuronale dans le subiculum adjacent. La série a également repris les données déjà publiées de R.B. à titre de comparaison. L.M., un autre patient de la série, présentait une amnésie antérograde persistante et une amnésie rétrograde touchant des souvenirs qui remontaient à au moins 15 ans avant les premiers symptômes et une atteinte bilatérale plus étendue, avec une perte de cellules pyramidales dans le champ CA3 rostral. Dans une étude distincte menée après une encéphalite limbique auto-immune, l’IRM à 7 T a montré que le volume moyen de CA3, calculé sur les deux hippocampes, était inférieur de 29 % chez 15 patients par rapport à 15 témoins. La différence, plus faible pour CA1, restait sous le seuil de signification après correction pour comparaisons multiples. La différence de volume a été mesurée à l’échelle du champ entier. Lors de l’entretien autobiographique, les 16 patients ont rapporté moins de détails propres aux événements que 16 témoins pour l’ensemble des souvenirs de l’année précédente et des trois périodes antérieures étudiées à partir de l’âge de 11 ans. Les effets d’une lésion limitée aux collatérales de Schaffer restent indéterminés.
    deficit: amnesia
    references: [schaffer-ca3-witter-review, schaffer-human-hippocampal-layers, schaffer-macaque-ca3-tracing, entorhinal-ca1-human-fibres, ca1-subiculum-modo-human-diffusion, clinical-zola-morgan-1986, clinical-rempel-clower-1996, clinical-miller-ca3-amnesia-2020]
    clinical_references: [clinical-zola-morgan-1986, clinical-rempel-clower-1996, clinical-miller-ca3-amnesia-2020]
    steps:
      - id: ca3-pyramidal-layer
        region: nextbrain:left:420
        source_name: stratum_pyramidale_of_rostral_ca3
        name: { en: Pyramidal layer of left rostral CA3, fr: Couche pyramidale du champ CA3 rostral gauche }
        role: { en: Origin of the Schaffer collaterals, fr: Origine des collatérales de Schaffer }
        explanation:
          en: In macaques, anterograde tracer injections involving the pyramidal layer of rostral CA3 labelled fibres and terminals in the stratum radiatum of rostral CA1. Some injections also included adjacent dentate tissue.
          fr: Chez le macaque, des injections de traceur antérograde intéressant la couche pyramidale du champ CA3 rostral ont marqué des fibres et des terminaisons dans le stratum radiatum du champ CA1 rostral. Certains sites d’injection englobaient aussi une partie du gyrus denté adjacent.
        mapping:
          en: NextBrain outlines the pyramidal cell layer of left rostral CA3. The layer marks the origin of the projection at the scale of the atlas.
          fr: NextBrain délimite la couche des cellules pyramidales du champ CA3 rostral gauche. Cette couche situe l’origine de la projection à l’échelle de l’atlas.
        view: right
        plane: coronal
      - id: ca1-stratum-radiatum
        region: nextbrain:left:344
        source_name: stratum_radiatum_of_rostral_ca1
        name: { en: Stratum radiatum of left rostral CA1, fr: Stratum radiatum du champ CA1 rostral gauche }
        role: { en: One receiving layer of the CA3 projection, fr: Une des couches cibles de la projection issue de CA3 }
        explanation:
          en: In the human hippocampal body, polarized-light microscopy shows a band of fibres along the stratum radiatum between CA3 and CA1. The authors interpret it as the likely counterpart of the Schaffer collaterals. Some fibres of the endfolial pathway appear to follow the same local course as this band. The microscopy shows fibre orientation. The direction shown here comes from macaque tracing.
          fr: Dans le corps de l’hippocampe humain, la microscopie en lumière polarisée montre une bande de fibres entre CA3 et CA1, le long du stratum radiatum. Les auteurs y voient l’équivalent probable des collatérales de Schaffer. Certaines fibres de la voie endofoliale semblent suivre localement le même trajet. La microscopie renseigne sur l’orientation des fibres. Le sens de la projection est tiré du traçage chez le macaque.
        mapping:
          en: NextBrain outlines the stratum radiatum of left rostral CA1. This human parcel marks one layer in which Schaffer collaterals terminate in macaques.
          fr: NextBrain délimite le stratum radiatum du champ CA1 rostral gauche. Cette parcelle humaine situe l’une des couches où se terminent les collatérales de Schaffer chez le macaque.
        view: right
        plane: coronal

  - id: navigation
    name: { en: Retrosplenial pathway to the presubiculum, fr: Voie rétrospléniale vers le présubiculum }
    summary:
      en: Follow two projections traced in macaques. One runs from posterior parahippocampal area TF to retrosplenial area 30 and the other from area 30 to the posterior presubiculum.
      fr: Suivez deux projections mises en évidence par traçage chez le macaque. La première relie l’aire TF du cortex parahippocampique postérieur à l’aire 30 du cortex rétrosplénial. La seconde relie l’aire 30 à la partie postérieure du présubiculum.
    route:
      en: Right posterior parahippocampal cortex → right retrosplenial area 30 → right posterior presubiculum
      fr: Cortex parahippocampique postérieur droit → aire 30 du cortex rétrosplénial droit → partie postérieure du présubiculum droit
    scope:
      en: The right-sided human landmarks illustrate two projections traced in different macaque species. The projections share area 30 at the scale of cortical areas. The exact overlap of their territories within area 30 and the involvement of the same relay neurons remain unresolved. The tour ends in the presubiculum. Reciprocal projections and other targets of area 30 lie outside this branch.
      fr: Les repères humains de l’hémisphère droit illustrent deux projections étudiées par traçage chez deux espèces de macaques. Les deux projections ont en commun l’aire 30 du cortex rétrosplénial. Le chevauchement précis de leurs territoires dans cette aire et la participation des mêmes neurones relais restent indéterminés. Le parcours s’arrête au présubiculum. Les projections réciproques et les autres cibles de l’aire 30 sont hors de cette branche.
    clinical:
      en: The clinical link is partial at the retrosplenial and posterior parahippocampal landmarks. After small haemorrhages extending from the right retrosplenial region into the medial parietal lobe, three patients recognised familiar buildings and landscapes and had difficulty recalling directions between familiar places. In a separate case, a patient with a right posteromedial infarct extending to the anterior bank of the parieto-occipital sulcus scored 28/30 when replacing cards without turning and 14/30 after turning at his first assessment. The authors described very limited involvement of the retrosplenial and posterior cingulate cortices. The patient also had left homonymous hemianopia and mild visual memory difficulty. In a retrospective study of seven patients with topographical disorientation, the greatest descriptive lesion overlap was in the right posterior parahippocampal gyrus and nearby cortex, with overlap in six of seven patients. Two patients had bilateral lesions. The effects of interrupting either projection remain unresolved.
      fr: Le lien clinique est partiel et concerne les régions rétrospléniale et parahippocampique postérieure. Après de petites hémorragies s’étendant de la région rétrospléniale droite au lobe pariétal médial, trois patients reconnaissaient les bâtiments et paysages familiers et éprouvaient des difficultés à se rappeler la direction d’un lieu familier à l’autre. Dans une autre observation, un patient dont l’infarctus postéromédial droit atteignait la berge antérieure du sillon pariéto-occipital a obtenu 28/30 en replaçant des cartes sans changer d’orientation et 14/30 après avoir pivoté sur lui-même, lors de la première évaluation. Les auteurs rapportaient une atteinte minime des cortex rétrosplénial et cingulaire postérieur. Le patient présentait aussi une hémianopsie latérale homonyme gauche et un léger trouble de la mémoire visuelle. Dans une étude rétrospective portant sur sept patients présentant une désorientation topographique, le chevauchement lésionnel descriptif était maximal dans la partie postérieure du gyrus parahippocampique droit et le cortex voisin, avec un chevauchement chez six patients sur sept. Deux patients présentaient des lésions bilatérales. Les effets d’une interruption de l’une ou l’autre projection restent indéterminés.
    deficit: topographical-disorientation
    references: [navigation-tf-retrosplenial, navigation-area30-tracing, navigation-retrosplenial-efferents, navigation-cingulum-anatomy, destrieux-parcellation, cortical-parcellation, navigation-lesions, navigation-medial-temporal-lesions, clinical-hashimoto-heading-2015, memory-anatomy, navigation-parahippocampal-homology]
    clinical_references: [navigation-lesions, navigation-medial-temporal-lesions, clinical-hashimoto-heading-2015]
    steps:
      - id: parahippocampal
        region: destrieux:right:23
        source_name: G_oc-temp_med-Parahip
        name: { en: Right posterior parahippocampal cortex, fr: Cortex parahippocampique postérieur droit }
        role: { en: Origin of the projection to area 30, fr: Origine de la projection vers l’aire 30 }
        explanation:
          en: In cynomolgus macaques, anterograde tracer injections in parahippocampal area TF labelled fibres and terminals in retrosplenial area 30.
          fr: Chez le macaque crabier, des injections de traceur antérograde dans l’aire parahippocampique TF ont marqué des fibres et des terminaisons dans l’aire rétrospléniale 30.
        mapping:
          en: The Destrieux parcel outlines the human parahippocampal gyrus as a whole. It provides a regional landmark for the origin of the projection in macaque area TF.
          fr: La parcelle de Destrieux délimite l’ensemble du gyrus parahippocampique humain. Elle sert de repère régional pour l’origine de la projection dans l’aire TF du macaque.
        view: inferior
        plane: coronal
      - id: retrosplenial
        region: hcp-mmp:right:14
        source_name: R_RSC_ROI
        name: { en: Right retrosplenial area 30, fr: Aire 30 du cortex rétrosplénial droit }
        role: { en: Target of TF and origin of the projection to the presubiculum, fr: Cible de l’aire TF et origine de la projection vers le présubiculum }
        explanation:
          en: In one rhesus macaque, an anterograde tracer injection confined to posteroventral area 30 labelled fibres that joined the cingulum on their way to the presubiculum.
          fr: Chez un macaque rhésus, une injection de traceur antérograde limitée à la partie postéroventrale de l’aire 30 a marqué des fibres qui empruntaient le cingulum en direction du présubiculum.
        mapping:
          en: The human HCP-MMP RSC parcel includes areas 29 and 30. It provides a regional landmark for the traced area 30 territory.
          fr: La parcelle humaine RSC de HCP-MMP comprend les aires 29 et 30. Elle situe approximativement le territoire de l’aire 30 étudié par traçage.
        view: left
        plane: sagittal
      - id: hippocampus
        region: hcp-mmp:right:119
        source_name: R_PreS_ROI
        name: { en: Right presubiculum, fr: Présubiculum droit }
        role: { en: Termination of the retrosplenial projection, fr: Terminaison de la projection rétrospléniale }
        explanation:
          en: The tracer labelled terminals in the posterior presubiculum, part of the hippocampal formation.
          fr: Le traceur a marqué des terminaisons dans la partie postérieure du présubiculum, une composante de la formation hippocampique.
        mapping:
          en: The human HCP-MMP PreS parcel represents the presubicular region. It provides an approximate landmark for the posterior termination field traced in the macaque.
          fr: La parcelle PreS de l’atlas HCP-MMP repère la région présubiculaire humaine. Elle situe approximativement le territoire de terminaison postérieur décrit par traçage chez le macaque.
        view: left
        plane: coronal

  - id: slf3-opercular
    name: { en: SLF III to the frontal operculum, fr: Faisceau longitudinal supérieur III vers l’opercule frontal }
    summary:
      en: Follow a branch of the left superior longitudinal fasciculus III (SLF III) from the supramarginal gyrus to the frontal operculum.
      fr: Suivez une branche du faisceau longitudinal supérieur III (FLS III) gauche, du gyrus supramarginal à l’opercule frontal.
    route:
      en: Left supramarginal gyrus → left inferior frontal area 44 via SLF III
      fr: Gyrus supramarginal gauche → aire 44 du gyrus frontal inférieur gauche par le FLS III
    scope:
      en: The tour focuses on the frontal opercular endpoint. Other SLF III fibres reach the ventral precentral gyrus. In the human dissections, the arcuate fasciculus ran deeper and medial to SLF III. The arrow follows the direction shown by tracing in macaques. Human fibre dissection and diffusion tractography support the regional comparison. The precise human endpoints and direction of the traced branch remain unresolved.
      fr: Le parcours se limite à la terminaison dans l’opercule frontal. D’autres fibres du FLS III atteignent la partie ventrale du gyrus précentral. Dans les dissections humaines, le faisceau arqué cheminait plus en profondeur, médialement au FLS III. La flèche indique le sens de la projection établi par traçage chez le macaque. La dissection de fibres et la tractographie de diffusion étayent la comparaison régionale chez l’humain. Les terminaisons précises et le sens de cette branche chez l’humain restent indéterminés.
    clinical:
      en: The link to limb apraxia is partial. A meta-analysis linked impaired tool-use pantomime on visual cues, sometimes paired with verbal instructions, to lesions that included the left supramarginal and middle temporal gyri. Across three lesion-mapping studies of tool-use pantomime on verbal command alone, the meta-analysis reported a lesion cluster labelled as the opercular part of the left inferior frontal gyrus. The archived analysis places most of the cluster in white matter. The synthesis included a longitudinal study of 90 patients after left-hemisphere stroke. In that study’s lesion-volume-adjusted analysis of chronic performance, pantomime production errors were associated with lesions of the left supramarginal, postcentral and posterior superior temporal gyri. The effect of injury confined to this branch of SLF III remains unresolved.
      fr: Le lien avec l’apraxie gestuelle est partiel. Une méta-analyse a associé les difficultés à mimer l’utilisation d’outils sur présentation visuelle, parfois accompagnée d’une consigne verbale, à des lésions touchant notamment les gyri supramarginal et temporal moyen gauches. Dans trois études de cartographie lésionnelle de la pantomime d’utilisation d’outils sur seule consigne verbale, la méta-analyse a rapporté un amas lésionnel attribué à la partie operculaire du gyrus frontal inférieur gauche. Dans l’analyse archivée, l’amas se situe principalement dans la substance blanche. La synthèse incluait une étude longitudinale portant sur 90 patients après un AVC de l’hémisphère gauche. Dans l’analyse des performances en phase chronique, ajustée sur le volume lésionnel, les erreurs d’exécution de la pantomime étaient associées à des lésions du gyrus supramarginal, du gyrus postcentral et de la partie postérieure du gyrus temporal supérieur, dans l’hémisphère gauche. L’effet d’une lésion limitée à cette branche du FLS III reste indéterminé.
    deficit: apraxia
    references: [slf3-parietofrontal-tracing, slf3-human-dissection, slf3-probabilistic-endpoints, slf3-inferior-parietal-comparative-architectonics, slf3-parietofrontal-evoked-responses, destrieux-parcellation, cortical-parcellation, clinical-metaireau-2024, clinical-dressing-2021, slf3-anatomy-teaching]
    clinical_references: [clinical-metaireau-2024, clinical-dressing-2021]
    steps:
      - id: supramarginal-gyrus
        region: destrieux:left:26
        source_name: G_pariet_inf-Supramar
        name: { en: Left supramarginal gyrus, fr: Gyrus supramarginal gauche }
        role: { en: Parietal origin in the tracer study, fr: Origine pariétale dans l’étude de traçage }
        explanation:
          en: In one rhesus macaque, an anterograde tracer injection in left ventral area PFG of the inferior parietal lobule labelled SLF III fibres above the circular sulcus of the insula. Human fibre dissection identifies the supramarginal gyrus as a posterior endpoint of the bundle.
          fr: Chez un macaque rhésus, l’injection d’un traceur antérograde dans la partie ventrale de l’aire PFG du lobule pariétal inférieur gauche a marqué des fibres du FLS III au-dessus du sillon circulaire de l’insula. La dissection des fibres chez l’humain situe une terminaison postérieure du faisceau dans le gyrus supramarginal.
        mapping:
          en: The Destrieux parcel serves as a gyral landmark for the parietal end of the bundle. Among the human areas compared, PF and PFm had receptor profiles closest to macaque PFG. The exact human counterpart of the tracer injection site in ventral PFG remains unresolved.
          fr: La parcelle de Destrieux sert de repère pour l’extrémité pariétale du faisceau à l’échelle du gyrus supramarginal. Parmi les aires humaines comparées, PF et PFm présentaient les profils de récepteurs les plus proches de celui de l’aire PFG du macaque. L’équivalent précis chez l’humain du site d’injection dans la partie ventrale de l’aire PFG reste indéterminé.
        view: left
        plane: coronal
      - id: inferior-frontal-area-44
        region: hcp-mmp:left:74
        source_name: L_44_ROI
        name: { en: Left inferior frontal area 44, fr: Aire 44 du gyrus frontal inférieur gauche }
        role: { en: Frontal target in the tracer study, fr: Cible frontale dans l’étude de traçage }
        explanation:
          en: In that macaque, most terminal label in the ventral portion of the inferior limb of the arcuate sulcus lay in area 44 at the fundus. Human dissection follows SLF III to the opercular part of the inferior frontal gyrus. Probabilistic diffusion tractography estimates endpoints in left area 44 and neighbouring frontal areas. During presurgical mapping, stimulation of some left supramarginal sites assigned to PF or PFm elicited early cortical responses in left area 44. The fibres carrying those responses remain unresolved.
          fr: Chez ce macaque, dans la partie ventrale de la branche inférieure du sillon arqué, la plupart des terminaisons marquées se trouvaient dans l’aire 44, au fond du sillon. La dissection chez l’humain permet de suivre le FLS III jusqu’à la partie operculaire du gyrus frontal inférieur. La tractographie probabiliste de diffusion situe des terminaisons probables dans l’aire 44 gauche et les territoires frontaux voisins. Lors d’une cartographie préchirurgicale, la stimulation de certains sites du gyrus supramarginal gauche attribués aux aires PF ou PFm a déclenché des réponses corticales précoces dans l’aire 44 gauche. Les fibres qui véhiculent ces réponses restent indéterminées.
        mapping:
          en: HCP-MMP area 44 overlaps substantially with human cytoarchitectonic area 44. The parcel serves as a landmark within the frontal opercular territory.
          fr: La parcelle 44 de HCP-MMP recouvre en grande partie l’aire cytoarchitectonique 44 humaine. Elle sert de repère dans le territoire de l’opercule frontal.
        view: left
        plane: axial

  - id: gustatory-insulo-orbitofrontal
    name: { en: Insulo-orbitofrontal gustatory pathway, fr: Voie gustative insulo-orbitofrontale }
    summary:
      en: Use two right-hemisphere landmarks to follow a direct projection traced in macaques from the insular and frontal opercular taste region to the caudolateral orbitofrontal taste region.
      fr: Suivez, à l’aide de deux repères dans l’hémisphère droit, une projection directe mise en évidence par traçage chez le macaque, de la région gustative insulaire et operculaire frontale à la région gustative orbitofrontale postérolatérale.
    route:
      en: In the cynomolgus macaque, anterior insular and frontal opercular taste region → middle and posterior thirds of the caudolateral orbitofrontal taste region
      fr: Chez le macaque crabier, région gustative de l’insula antérieure et de l’opercule frontal → tiers moyen et postérieur de la région gustative orbitofrontale postérolatérale
    scope:
      en: This branch ends in the middle and posterior thirds of the macaque caudolateral orbitofrontal taste region. The brainstem and thalamic stages and other inputs to orbitofrontal cortex lie outside the tour. The two human parcels serve as anatomical landmarks for the projection traced in macaques. A separate tracer study in macaques found input from the anterior insula to caudal area 47/12 in ventrolateral prefrontal cortex. Its injection sites were selected by anatomy for a study of the salience network.
      fr: Cette branche se termine dans les tiers moyen et postérieur de la région gustative orbitofrontale postérolatérale chez le macaque. Les relais du tronc cérébral et du thalamus ainsi que les autres afférences du cortex orbitofrontal sont hors de ce parcours. Les deux parcelles humaines servent de repères anatomiques pour la projection étudiée par traçage chez le macaque. Une autre étude par traçage chez le macaque a mis en évidence des afférences de l’insula antérieure vers l’aire 47/12 caudale du cortex préfrontal ventrolatéral. Les sites d’injection ont été choisis d’après l’anatomie pour étudier le réseau de saillance.
    clinical:
      en: The clinical link is partial. Adults with unilateral insular injury can have impaired taste intensity, discrimination or recognition. The reported effects vary with the task and side tested. Pritchard and colleagues compared six patients with unilateral insular lesions, three with lesions outside the insula and 11 age-matched healthy participants. Tastants were applied separately to each side of the front of the tongue. Right insular lesions were associated with poorer intensity judgments and taste recognition on the right. With left insular lesions, intensity judgments were poorer on the left and taste recognition was poorer on both sides. Stevenson and colleagues compared seven patients with left insular lesions, seven with right insular lesions and 42 healthy controls. Both patient groups performed worse than controls on taste discrimination, taste-quality judgments and recognition of taste names with stimuli applied to either side of the tongue tip. Among the three patients with frontal lesions involving orbitofrontal cortex in Stevenson and Miller’s study, one had impaired taste discrimination on the right side of the tongue after surgery for a left mucocele that extended into the frontal lobe. Two neuroradiologists found no visible insular damage in that case. One adult with a right insular and frontal opercular infarct reported altered taste but showed no significant impairment on the quantitative intensity and recognition tests. Among 112 patients with supratentorial stroke in a separate 128-patient cohort, insular involvement was associated with patient-reported taste changes on a questionnaire. The effects of injury confined to area 47s or to this projection remain unresolved.
      fr: Le lien clinique est partiel. Chez l’adulte, une lésion insulaire unilatérale peut altérer la perception de l’intensité, la discrimination ou la reconnaissance des saveurs. Les effets rapportés varient selon la tâche et le côté testé. Pritchard et ses collègues ont comparé six patients présentant une lésion insulaire unilatérale, trois présentant une lésion hors de l’insula et onze témoins sains appariés selon l’âge. Les stimuli gustatifs ont été appliqués séparément de chaque côté de la partie antérieure de la langue. Les lésions insulaires droites étaient associées à une altération du jugement d’intensité et de la reconnaissance des saveurs à droite. En cas de lésion insulaire gauche, le jugement d’intensité était altéré à gauche et la reconnaissance des saveurs des deux côtés. Stevenson et ses collègues ont comparé sept patients présentant une lésion insulaire gauche, sept présentant une lésion insulaire droite et 42 témoins sains. Les deux groupes de patients obtenaient de moins bons résultats que les témoins en discrimination des saveurs, en jugement de leur qualité et en reconnaissance de leur nom, pour des stimuli appliqués d’un côté ou de l’autre de la pointe de la langue. Parmi les trois patients de l’étude de Stevenson et Miller dont la lésion frontale touchait le cortex orbitofrontal, un présentait un déficit de discrimination des saveurs du côté droit de la langue après l’ablation d’une mucocèle gauche qui s’étendait au lobe frontal. Deux neuroradiologues n’ont décelé aucune lésion insulaire sur les images de ce patient. Une adulte présentant un infarctus de l’insula droite et de l’opercule frontal a signalé une modification du goût, sans déficit significatif aux épreuves quantitatives d’intensité et de reconnaissance. Dans une autre série de 128 personnes après un AVC, l’analyse des 112 AVC supratentoriels a associé l’atteinte insulaire à des changements du goût signalés dans un questionnaire. Les effets d’une lésion limitée à l’aire 47s ou à cette projection restent indéterminés.
    deficit: taste-impairment
    references: [gustatory-orbitofrontal-tracing, gustatory-insula-architecture, macaque-frontal-architecture, olfactory-orbitofrontal-human-architecture, destrieux-parcellation, cortical-parcellation, taste-lesions, clinical-stevenson-insular-taste-2013, clinical-stevenson-orbitofrontal-taste-2013, gustatory-insulo-orbital-teaching, gustatory-insulo-orbital-regional-tracing, clinical-couto-insular-2015, clinical-schon-taste-2025]
    clinical_references: [taste-lesions, clinical-stevenson-insular-taste-2013, clinical-stevenson-orbitofrontal-taste-2013, clinical-couto-insular-2015, clinical-schon-taste-2025]
    steps:
      - id: short-insular-gyri
        region: destrieux:right:18
        source_name: G_insular_short
        name: { en: Right short insular gyri, fr: Gyri courts de l’insula droite }
        role: { en: Landmark for the insular origin, fr: Repère de l’origine insulaire }
        explanation:
          en: In cynomolgus macaques, tracer deposits in the middle and posterior portions of the orbitofrontal taste region labelled neurons in the anterior insula and frontal operculum. After one posterior deposit, the labelled region in the dysgranular insula extended beyond the area where taste-responsive neurons had been recorded.
          fr: Chez le macaque crabier, les dépôts de traceur dans les parties moyenne et postérieure de la région gustative orbitofrontale ont marqué des neurones de l’insula antérieure et de l’opercule frontal. Après un dépôt postérieur, la région marquée dans l’insula dysgranulaire dépassait la zone où des neurones sensibles aux saveurs avaient été enregistrés.
        mapping:
          en: The Destrieux parcel groups the human short insular gyri, which include dysgranular cortex. It provides a broad landmark for the insular part of the traced origin. The adjacent frontal operculum lies outside the parcel.
          fr: La parcelle de Destrieux regroupe les gyri courts de l’insula humaine, qui comprennent du cortex dysgranulaire. Elle situe approximativement la composante insulaire de l’origine de la projection. L’opercule frontal voisin se trouve hors de cette parcelle.
        view: right
        plane: coronal
      - id: lateral-orbitofrontal
        region: hcp-mmp:right:94
        source_name: R_47s_ROI
        name: { en: Right lateral orbitofrontal area 47s, fr: Aire orbitofrontale latérale 47s droite }
        role: { en: Landmark for the orbitofrontal target, fr: Repère de la cible orbitofrontale }
        explanation:
          en: Deposits of retrograde tracer at taste-responsive sites in the middle and posterior thirds of the caudolateral orbitofrontal taste region labelled many insular and opercular neurons. The two more anterior deposits produced either no label or very sparse label in the primary taste region.
          fr: Les dépôts de traceur rétrograde en des sites répondant aux saveurs dans les tiers moyen et postérieur de la région gustative orbitofrontale postérolatérale ont marqué de nombreux neurones insulaires et operculaires. Les deux dépôts plus antérieurs n’ont donné qu’un marquage très clairsemé ou nul dans la région gustative primaire.
        mapping:
          en: Human HCP-MMP area 47s approximates the architectonic area 47/12s, which comparative histology relates to macaque area 12o. The tracer study placed its deposits in Walker’s broader area 12. Their exact relation to area 12o remains uncertain.
          fr: L’aire 47s de l’atlas humain HCP-MMP correspond approximativement à l’aire architectonique 47/12s, que l’histologie comparée rapproche de l’aire 12o chez le macaque. Les dépôts de traceur se situaient dans l’aire 12 de Walker, plus étendue. Leur position précise par rapport à l’aire 12o reste incertaine.
        view: inferior
        plane: coronal

  - id: uncinate-temporopolar
    name: { en: Orbitofrontal–temporopolar branch of the uncinate fasciculus, fr: Branche orbitofrontale–temporopolaire du faisceau unciné }
    summary:
      en: Follow a macaque projection from orbitofrontal cortex to the temporal pole through the uncinate fasciculus, using two human right-hemisphere landmarks.
      fr: Suivez une projection tracée chez le macaque, du cortex orbitofrontal au pôle temporal par le faisceau unciné, à l’aide de deux repères dans l’hémisphère droit humain.
    route:
      en: In macaques, orbitofrontal area 11 → uncinate fasciculus around the limen of the insula → temporopolar proisocortex
      fr: Chez le macaque, aire orbitofrontale 11 → faisceau unciné contournant le seuil de l’insula → pro-isocortex temporopolaire
    scope:
      en: The tour follows one macaque projection and leaves out the other destinations of the uncinate fasciculus and the separate temporal–frontal projections through the extreme capsule. The two human landmarks approximate the regions identified by tracing. Human fibre dissection shows the gross course of the uncinate around the limen of the insula between the orbital gyri and the temporal pole. The human diffusion tractography study treated the dorsal and ventral temporal-pole areas (TGd and TGv) together as the regional counterpart to macaque temporopolar proisocortex. Among the region pairs tested with human diffusion tractography, the greatest mean proportion of estimated uncinate streamlines linked dorsal temporal pole area TGd to the middle orbitofrontal region combining areas 11l and 13l. The precise cortical endpoints and direction of the corresponding human projection remain unresolved.
      fr: Le parcours suit une projection décrite chez le macaque. Il laisse de côté les autres destinations du faisceau unciné et les projections temporo-frontales distinctes qui empruntent la capsule extrême. Les deux repères humains situent approximativement les régions étudiées par traçage. La dissection chez l’humain montre le trajet macroscopique du faisceau unciné autour du seuil de l’insula, entre les gyri orbitaires et le pôle temporal. L’étude de tractographie de diffusion chez l’humain a considéré les aires dorsale et ventrale du pôle temporal (TGd et TGv) comme l’équivalent régional du pro-isocortex temporopolaire du macaque. Parmi les paires de régions étudiées en tractographie de diffusion chez l’humain, la proportion moyenne de trajectoires estimées du faisceau unciné était la plus élevée entre l’aire TGd, dans la partie dorsale du pôle temporal, et la région orbitofrontale moyenne regroupant les aires 11l et 13l. Les extrémités corticales précises et le sens de la projection correspondante chez l’humain restent indéterminés.
    clinical:
      en: The clinical link with impaired cognitive estimation is partial and rests on lesions involving the right temporal pole. In a study of 55 patients with left spatial neglect after a first right-hemisphere stroke and 55 healthy controls, the patients made less plausible estimates of everyday quantities on the Cognitive Estimation Test (CET-A). For overall estimation performance, voxel-based lesion mapping found a cluster in the right anterior temporal lobe. A separate region-based analysis associated impaired performance with lesions overlapping the right uncinate fasciculus, right superior temporal pole, orbital part of the right inferior frontal gyrus and right half of the anterior commissure after correction for multiple comparisons. No lesion-volume adjustment was reported for that analysis. The frontal result concerns the atlas region for the orbital inferior frontal gyrus and leaves involvement of area 11l unresolved. In a separate study of adults with lesions due to stroke or tumour, the 34 patients with frontal lesions had higher adjusted CET-A error scores than the 19 patients with posterior lesions and the 39 healthy controls. The study found no significant difference in overall scores between left and right frontal lesion groups. The contribution of selective damage to the displayed branch and the functional laterality of this ability remain unresolved.
      fr: Le lien clinique avec le trouble de l’estimation cognitive est partiel et repose sur des lésions touchant le pôle temporal droit. Dans une étude comparant 55 patients présentant une négligence spatiale gauche après un premier AVC de l’hémisphère droit à 55 témoins sains, les patients ont donné des estimations moins plausibles de grandeurs quotidiennes au test d’estimation cognitive (CET-A). Pour la performance globale, la cartographie lésionnelle par voxels a révélé un amas dans le lobe temporal antérieur droit. Une analyse distincte par régions a associé les difficultés d’estimation à des lésions chevauchant le faisceau unciné droit, la partie supérieure du pôle temporal droit, la partie orbitaire du gyrus frontal inférieur droit et la moitié droite de la commissure antérieure, après correction pour comparaisons multiples. Aucun ajustement en fonction du volume des lésions n’a été rapporté pour cette analyse. Le résultat frontal concerne la région d’atlas correspondant à la partie orbitaire du gyrus frontal inférieur et laisse indéterminée l’implication de l’aire 11l. Dans une autre étude menée chez des adultes présentant une lésion due à un AVC ou à une tumeur, les 34 patients présentant une lésion frontale ont obtenu des scores d’erreur ajustés au CET-A plus élevés que ceux des 19 patients présentant une lésion postérieure et des 39 témoins sains. L’étude n’a pas relevé de différence significative entre les scores globaux des groupes présentant une lésion frontale gauche ou droite. La contribution d’une atteinte sélective de la branche illustrée et la latéralisation fonctionnelle de cette capacité restent indéterminées.
    deficit: cognitive-estimation
    references: [uncinate-rostral-orbitofrontal-tracing, uncinate-temporal-pole-tracing, uncinate-human-dissection, uncinate-human-tractography, cortical-parcellation, olfactory-orbitofrontal-human-architecture, destrieux-parcellation, clinical-pflugshaupt-2020, clinical-cipolotti-2018, uncinate-anatomy-teaching]
    clinical_references: [clinical-pflugshaupt-2020, clinical-cipolotti-2018]
    steps:
      - id: orbitofrontal-area-11
        region: hcp-mmp:right:91
        source_name: R_11l_ROI
        name: { en: Right lateral orbitofrontal area 11l, fr: Aire orbitofrontale latérale 11l droite }
        role: { en: Landmark for the orbitofrontal origin, fr: Repère de l’origine orbitofrontale }
        explanation:
          en: In a rhesus macaque, an anterograde tracer injection in orbital area 11 labelled fibres that entered the uncinate fasciculus and curved around the limen of the insula.
          fr: Chez un macaque rhésus, une injection de traceur antérograde dans l’aire orbitaire 11 a marqué des fibres qui empruntaient le faisceau unciné et contournaient le seuil de l’insula.
        mapping:
          en: The HCP-MMP parcel marks the lateral area 11l of human orbitofrontal cortex. It is a comparative landmark for the macaque origin, which the tract-tracing study reported at the scale of area 11.
          fr: La parcelle HCP-MMP repère l’aire latérale 11l du cortex orbitofrontal humain. Elle sert de repère comparatif pour l’origine chez le macaque, située à l’échelle de l’aire 11 dans l’étude de traçage du faisceau.
        view: inferior
        plane: coronal
      - id: temporal-pole
        region: destrieux:right:44
        source_name: Pole_temporal
        name: { en: Right temporal pole, fr: Pôle temporal droit }
        role: { en: Landmark for the traced temporopolar target, fr: Repère de la terminaison temporopolaire tracée }
        explanation:
          en: Labelled fibres of the uncinate fasciculus terminated in the temporopolar proisocortex in the area 11 tracing case. In a separate macaque experiment, an injection in area 11l labelled axons and varicosities near the rostral tip of the superior temporal sulcus.
          fr: Dans le cas de traçage depuis l’aire 11, des fibres marquées du faisceau unciné se terminaient dans le pro-isocortex temporopolaire. Dans une autre expérience chez le macaque, une injection dans l’aire 11l a marqué des axones et des varicosités près de l’extrémité antérieure du sillon temporal supérieur.
        mapping:
          en: The Destrieux parcel outlines the temporal pole. It marks the general location of the macaque target at a broader scale than the proisocortical territory traced in that species.
          fr: La parcelle de Destrieux délimite le pôle temporal. Elle situe la cible décrite chez le macaque à une échelle plus large que le territoire pro-isocortical étudié par traçage chez cette espèce.
        view: right
        plane: coronal

  - id: arcuate-dorsal-frontotemporal
    name: { en: Dorsal frontotemporal branch of the arcuate fasciculus, fr: Branche frontotemporale dorsale du faisceau arqué }
    summary:
      en: Follow a projection traced from dorsolateral prefrontal cortex to posterior superior temporal cortex in macaques, using two landmarks in the left hemisphere of the human atlas.
      fr: Suivez une projection du cortex préfrontal dorsolatéral vers le cortex temporal supérieur postérieur mise en évidence par traçage chez le macaque, à l’aide de deux repères dans l’hémisphère gauche de l’atlas humain.
    route:
      en: In macaques, rostral area 8Ad → caudal superior temporal gyrus via the arcuate fasciculus
      fr: Chez le macaque, partie rostrale de l’aire 8Ad → partie caudale du gyrus temporal supérieur par le faisceau arqué
    scope:
      en: Human dissection shows the long arcuate fasciculus curving around the posterior insula beneath the inferior parietal lobule. Human diffusion tractography has estimated a dorsal branch between posterior temporal cortex and dorsal area 8A and neighbouring area 6. A comparative diffusion study supports regional correspondence at the illustrated landmarks. The exact human endpoints and direction of this branch remain unresolved. The tour omits fibres to the adjoining superior temporal sulcus and other arcuate connections.
      fr: La dissection humaine montre la courbure du faisceau arqué autour de la partie postérieure de l’insula, en profondeur du lobule pariétal inférieur. La tractographie de diffusion chez l’humain a estimé un trajet dorsal entre le cortex temporal postérieur et la partie dorsale de l’aire 8A ainsi que l’aire 6 voisine. Une étude comparative en IRM de diffusion étaye la correspondance régionale des repères présentés. Les extrémités précises et le sens de cette branche chez l’humain restent indéterminés. Les fibres destinées au sillon temporal supérieur voisin et les autres connexions du faisceau arqué sont hors du parcours.
    clinical:
      en: The clinical link with impaired speech repetition is partial and rests on evidence involving the left posterior superior temporal gyrus. In a coordinate-based analysis of six studies of repetition after stroke involving the left hemisphere, Na and colleagues reported a significant cluster in the left posterior superior temporal gyrus. One of the studies contributed three coordinates relating repetition scores to grey matter volume in spared right-hemisphere tissue. In 39 adults after a first left-hemisphere ischaemic stroke, Fridriksson and colleagues found the strongest structural association with poor repetition in the white matter beneath the left supramarginal gyrus. The structural peak lay within a probabilistic diffusion tractography map between Brodmann areas 22 and 45 based on data from 54 older adults. In the perfusion analysis, poorer repetition was most strongly associated with hypoperfusion in the inferior part of the same gyrus. Kim and colleagues described a patient with an infarct involving the left posterior superior temporal gyrus and underlying white matter. On the Korean Western Aphasia Battery on the fourth hospital day, only sentences of at least five words were still difficult to repeat. In 54 adults assessed at least six months after a first left-hemisphere stroke, Mei and colleagues found that the lesion maps for poorer sentence repetition and poorer auditory short-term memory overlapped in left inferior parietal cortex and underlying white matter. The association between sentence repetition and lesion load in a tractography estimate of the whole left arcuate fasciculus depended on the threshold used. The effect of injury confined to this branch of the arcuate fasciculus remains unresolved.
      fr: Le lien clinique avec le trouble de la répétition orale est partiel et repose sur des données concernant la portion postérieure du gyrus temporal supérieur gauche. Dans une analyse des coordonnées issues de six études sur la répétition après un AVC touchant l’hémisphère gauche, Na et ses collègues ont rapporté un amas significatif dans la partie postérieure du gyrus temporal supérieur gauche. L’une des études a fourni trois coordonnées associant les scores de répétition au volume de substance grise dans des régions épargnées de l’hémisphère droit. Chez 39 adultes ayant eu un premier AVC ischémique de l’hémisphère gauche, Fridriksson et ses collègues ont trouvé que les difficultés de répétition étaient le plus fortement associées à une lésion de la substance blanche sous le gyrus supramarginal gauche. Le pic de l’association structurale se situait dans une carte probabiliste du faisceau arqué entre les aires 22 et 45 de Brodmann, établie par tractographie de diffusion chez 54 adultes âgés. Dans l’analyse de la perfusion, l’association la plus forte concernait une hypoperfusion de la partie inférieure du même gyrus. Kim et ses collègues ont décrit un patient dont l’infarctus touchait la partie postérieure du gyrus temporal supérieur gauche et la substance blanche sous-jacente. Au quatrième jour d’hospitalisation, dans la version coréenne de la Western Aphasia Battery, seules les phrases d’au moins cinq mots restaient difficiles à répéter. Chez 54 adultes évalués au moins six mois après un premier AVC de l’hémisphère gauche, Mei et ses collègues ont trouvé que les cartes lésionnelles de la répétition de phrases et de la mémoire auditive à court terme se recouvraient dans le cortex pariétal inférieur gauche et la substance blanche sous-jacente. L’association entre la répétition de phrases et la charge lésionnelle dans une estimation tractographique de l’ensemble du faisceau arqué gauche variait selon le seuil retenu. L’effet d’une lésion limitée à cette branche du faisceau arqué reste indéterminé.
    deficit: aphasia
