circuits:
  - id: vision
    name: { en: Visual pathway, fr: Voie visuelle }
    summary:
      en: Follow the pathway that carries signals from the right visual hemifield to left primary visual cortex.
      fr: Suivez le trajet des signaux de l’hémichamp visuel droit jusqu’au cortex visuel primaire gauche.
    route:
      en: Optic chiasm → left optic tract → left dorsal lateral geniculate nucleus → left V1
      fr: Chiasma optique → tractus optique gauche → noyau géniculé latéral dorsal gauche → V1 gauche
    scope:
      en: The tour starts at the midline chiasm and follows the left branch to V1. The retina, optic nerves and optic radiations fall outside the displayed landmarks.
      fr: Le parcours débute au chiasma médian et suit la branche gauche jusqu’à V1. La rétine, les nerfs optiques et les radiations optiques sont hors du parcours.
    clinical:
      en: Zhang’s retrospective series counted 904 homonymous visual field defects in 852 patients. Lesions were most frequent in the occipital lobes and optic radiations. Similar patterns occurred at several retrochiasmal sites, limiting their value for locating an individual lesion. Chen and colleagues’ retrospective neuro-ophthalmology series included patients with an optic tract lesion confirmed on MRI and at least one compatible sign. The study documents contralateral homonymous field loss, including incomplete, incongruous defects, in adults with ischaemic or haemorrhagic lesions involving the tract. Some lesions extended beyond the optic tract. In Lugtmeijer and colleagues’ main atlas-based analysis after ischaemic stroke, right visual field deficits on an eye-tracked quadrant screen were associated with lesions in left HCP-MMP areas V1, V2 and V3 after correction for multiple comparisons. The comparison included nine adults with right visual field deficits and 125 with no visual field deficit detected. The screen grouped deficits affecting one or both quadrants on the same side.
      fr: Dans la série rétrospective de Zhang, 852 patients présentaient au total 904 déficits homonymes du champ visuel. Les lésions siégeaient le plus souvent dans les lobes occipitaux et les radiations optiques. Des profils campimétriques semblables correspondaient à plusieurs sites rétrochiasmatiques, ce qui limitait leur valeur pour localiser une lésion. Dans la série rétrospective de neuro-ophtalmologie de Chen et de ses collègues, les patients présentaient une lésion du tractus optique confirmée à l’IRM et au moins un signe compatible. L’étude décrit, chez des adultes dont une lésion ischémique ou hémorragique touchait le tractus, des déficits homonymes du champ visuel du côté opposé, dont certains étaient incomplets et incongruents. Certaines lésions s’étendaient au-delà du tractus optique. Dans l’analyse principale de Lugtmeijer et de ses collègues après AVC ischémique, les déficits du champ visuel droit, repérés par un test de dépistage avec suivi du regard, étaient associés à des lésions des aires V1, V2 et V3 gauches de l’atlas HCP-MMP après correction pour comparaisons multiples. La comparaison incluait neuf adultes présentant un déficit du champ visuel droit et 125 chez qui aucun déficit du champ visuel n’avait été détecté. Le dépistage regroupait les atteintes d’un ou de deux quadrants du même côté.
    deficit: hemianopia
    references: [visual-pathways, retinotopy, chiasm-histology, optic-radiation-dissection, v1-retinotopy, clinical-zhang-2006, clinical-chen-optic-tract-2025, clinical-lugtmeijer-2025]
    clinical_references: [clinical-zhang-2006, clinical-chen-optic-tract-2025, clinical-lugtmeijer-2025]
    steps:
      - id: chiasm
        region: learning:midline:optic-chiasm
        source_name: Optic chiasm
        name: { en: Optic chiasm, fr: Chiasma optique }
        role: { en: Partial crossing, fr: Croisement partiel }
        explanation:
          en: Fibres from the nasal half of each retina cross into the opposite optic tract. Fibres from the temporal half continue into the optic tract on the same side.
          fr: Les fibres issues de l’hémirétine nasale de chaque œil croisent la ligne médiane pour rejoindre le tractus optique opposé. Celles de l’hémirétine temporale gagnent le tractus du même côté.
        mapping:
          en: This teaching volume combines the two NextBrain chiasm labels into one midline landmark.
          fr: Ce volume pédagogique réunit les deux étiquettes chiasmatiques de NextBrain en un seul repère médian.
        view: inferior
        plane: axial
      - id: tract
        region: nextbrain:left:208
        source_name: optic_tract
        name: { en: Left optic tract, fr: Tractus optique gauche }
        role: { en: Right visual hemifield, fr: Hémichamp visuel droit }
        explanation:
          en: The left optic tract carries signals from the right nasal hemiretina and the left temporal hemiretina. The fibres that reach the left dorsal lateral geniculate nucleus convey information about the right visual hemifield.
          fr: Le tractus optique gauche véhicule les signaux de l’hémirétine nasale droite et de l’hémirétine temporale gauche. Les fibres qui rejoignent le noyau géniculé latéral dorsal gauche transmettent les informations de l’hémichamp visuel droit.
        mapping:
          en: NextBrain shows the outline of the optic tract as a single segmented volume.
          fr: NextBrain délimite le tractus optique en un seul volume segmenté.
        view: inferior
        plane: axial
      - id: lgn
        region: nextbrain:left:484
        source_name: dorsal_lateral_geniculate_nucleus
        name: { en: Left dorsal lateral geniculate nucleus, fr: Noyau géniculé latéral dorsal gauche }
        role: { en: Thalamic relay, fr: Relais thalamique }
        explanation:
          en: This left thalamic nucleus relays visual signals to left V1 through the optic radiations.
          fr: Ce noyau thalamique gauche transmet les signaux visuels à V1 gauche par les radiations optiques.
        mapping:
          en: NextBrain groups the layers of the dorsal nucleus under a single atlas label.
          fr: NextBrain regroupe les couches du noyau dorsal sous une seule étiquette d’atlas.
        view: posterior
        plane: coronal
      - id: v1
        region: hcp-mmp:left:1
        source_name: L_V1_ROI
        name: { en: Left primary visual cortex, fr: Cortex visuel primaire gauche }
        role: { en: Cortical visual map, fr: Carte visuelle corticale }
        explanation:
          en: Left V1 extends along the banks of the calcarine sulcus and represents the right visual hemifield.
          fr: V1 gauche s’étend le long des berges du sillon calcarin et représente l’hémichamp visuel droit.
        mapping:
          en: The HCP-MMP parcel transfers the group atlas boundary onto this brain’s cortical surface. An individual functional map would require measuring visual responses.
          fr: La parcelle HCP-MMP transpose les limites de l’atlas de groupe sur la surface corticale de ce cerveau. Une carte fonctionnelle individuelle nécessiterait de mesurer les réponses visuelles.
        view: right
        plane: coronal
        map: visual-field

  - id: memory
    name: { en: Hippocampal–diencephalic pathway, fr: Voie hippocampo-diencéphalique }
    summary:
      en: Follow a branch from the left subiculum through the mammillary body to the anterior thalamus.
      fr: Suivez une branche qui relie le subiculum gauche au thalamus antérieur en passant par le corps mamillaire.
    route:
      en: Left caudal subiculum → fornix → mammillary body → mammillothalamic tract → anteroventral thalamic nucleus
      fr: Subiculum caudal gauche → fornix → corps mamillaire → faisceau mamillothalamique → noyau antéroventral du thalamus
    scope:
      en: This tour follows one branch on the left. Human dissection shows the gross course of the fornix and mammillothalamic tract. Macaque tracing identifies the origins and targets of the projections described here. Direct projections from the subiculum to the anterior thalamus and connections beyond the anterior thalamus lie outside this branch.
      fr: Ce parcours suit une branche du côté gauche. La dissection humaine montre le trajet macroscopique du fornix et du faisceau mamillothalamique. Les traçages chez le macaque identifient l’origine et les cibles des projections décrites ici. Les projections directes du subiculum vers le thalamus antérieur et les connexions au-delà du thalamus antérieur sortent du cadre de cette branche.
    clinical:
      en: R.B. had lasting anterograde amnesia after ischaemic injury mainly affecting CA1 on both sides. In a series of 12 patients after colloid cyst surgery, the three with bilateral fornix interruption on MRI had difficulty learning and recalling new material. In a post-mortem comparison, estimated neuron counts in the anterior principal thalamic nucleus were lower in eight cases with alcohol-related Korsakoff amnesia than in five non-amnesic Wernicke cases. Both groups had neuronal loss in the medial mammillary and mediodorsal thalamic nuclei. Danet and colleagues assessed 12 patients at least three months after a first symptomatic left thalamic infarct. The seven with reduced left mammillothalamic tract volume on MRI scored lower on verbal recall and recognition than the five with tract sparing. The group with tract involvement had larger infarcts on average and more extensive injury to the lateral group of thalamic nuclei. Vidal and colleagues analysed 40 patients with chronic thalamic infarcts, drawn partly from the same recruitment cohort. In voxel-based lesion–symptom mapping adjusted for overall lesion volume and corrected for multiple comparisons, poorer delayed free recall of words was associated with a left thalamic cluster overlapping the estimated position of the tract and parts of the ventral anterior and ventral lateral posterior nuclei. The respective contributions of the tract and nearby nuclei remain unresolved.
      fr: R.B. a présenté une amnésie antérograde durable après une lésion ischémique touchant principalement le champ CA1 des deux côtés. Dans une série de 12 patients opérés d’un kyste colloïde, les trois dont l’IRM montrait une interruption bilatérale du fornix avaient des difficultés à apprendre et à rappeler de nouvelles informations. Dans une comparaison post-mortem, le nombre estimé de neurones du noyau principal antérieur du thalamus était inférieur chez les huit personnes présentant une amnésie de Korsakoff liée à l’alcool à celui des cinq personnes atteintes d’une encéphalopathie de Wernicke sans amnésie. Une perte neuronale touchait le noyau mamillaire médial et le noyau médiodorsal du thalamus dans les deux groupes. Danet et ses collègues ont examiné 12 patients au moins trois mois après un premier infarctus thalamique gauche symptomatique. Les sept patients dont le volume du faisceau mamillothalamique gauche était réduit à l’IRM obtenaient de moins bons résultats aux épreuves verbales de rappel et de reconnaissance que les cinq dont le faisceau était épargné. Dans le groupe où le faisceau était atteint, les infarctus étaient en moyenne plus volumineux et l’atteinte du groupe latéral des noyaux thalamiques était plus étendue. Vidal et ses collègues ont analysé les données de 40 patients examinés à distance d’un infarctus thalamique, dont une partie provenait de la même cohorte de recrutement. La cartographie voxel par voxel des relations entre lésions et symptômes, ajustée sur le volume lésionnel total et corrigée pour les comparaisons multiples, associait de moins bons résultats au rappel libre différé de mots à un ensemble de voxels du thalamus gauche. Cet ensemble recouvrait la position estimée du faisceau et des portions des noyaux ventral antérieur et ventral latéral postérieur. Les contributions respectives du faisceau et des noyaux voisins restent indéterminées.
    deficit: amnesia
    references: [memory-anatomy, memory-network, fornix, memory-subicular-tracing, memory-human-dissection, memory-mammillothalamic-dissection, memory-mammillothalamic-tracing, clinical-zola-morgan-1986, clinical-aggleton-2000, clinical-harding-2000, clinical-danet-mammillothalamic-2015, clinical-vidal-thalamic-recall-2025]
    clinical_references: [clinical-zola-morgan-1986, clinical-aggleton-2000, clinical-harding-2000, clinical-danet-mammillothalamic-2015, clinical-vidal-thalamic-recall-2025]
    steps:
      - id: hippocampus
        region: nextbrain:left:576
        source_name: caudal_subiculum
        name: { en: Left caudal subiculum, fr: Subiculum caudal gauche }
        role: { en: Subicular origin, fr: Origine subiculaire }
        explanation:
          en: In macaques, tracer injections into the medial mammillary nucleus labelled more neurons in the posterior than in the anterior subiculum. Their axons join the fornix.
          fr: Chez le macaque, les injections de traceur dans le noyau mamillaire médial ont marqué davantage de neurones dans le subiculum postérieur que dans le subiculum antérieur. Leurs axones rejoignent le fornix.
        mapping:
          en: NextBrain shows the caudal part of the human subiculum. The macaque tracing study described a gradient along the subiculum.
          fr: NextBrain délimite la partie caudale du subiculum humain. Le traçage chez le macaque décrit un gradient le long du subiculum.
        view: right
        plane: coronal
      - id: fornix
        region: nextbrain:left:199
        source_name: fornix
        name: { en: Left fornix, fr: Fornix gauche }
        role: { en: Postcommissural route, fr: Trajet postcommissural }
        explanation:
          en: This branch descends behind the anterior commissure in the postcommissural fornix. In macaques, subicular fibres take this route to the mammillary bodies.
          fr: Cette branche descend en arrière de la commissure antérieure dans le fornix postcommissural. Chez le macaque, des fibres issues du subiculum empruntent ce trajet vers les corps mamillaires.
        mapping:
          en: The NextBrain label covers the fornix on this side. The postcommissural fibres occupy only part of that volume.
          fr: Le volume NextBrain délimite le fornix de ce côté. Les fibres postcommissurales n’occupent qu’une partie de ce volume.
        view: left
        plane: sagittal
      - id: mammillary
        region: learning:left:mammillary
        source_name: Mammillary nuclei
        name: { en: Left mammillary body, fr: Corps mamillaire gauche }
        role: { en: Hypothalamic relay, fr: Relais hypothalamique }
        explanation:
          en: In macaques, subicular fibres reach the medial mammillary nucleus. Neurons in that nucleus send fibres into the mammillothalamic tract.
          fr: Chez le macaque, des fibres issues du subiculum atteignent le noyau mamillaire médial. Des neurones de ce noyau envoient des fibres dans le faisceau mamillothalamique.
        mapping:
          en: This teaching volume combines the three atlas subdivisions of the medial mammillary nucleus and the lateral mammillary nucleus. The medial nucleus is the relay described here.
          fr: Ce volume pédagogique réunit les trois subdivisions du noyau mamillaire médial et le noyau mamillaire latéral. Le relais décrit ici est le noyau médial.
        view: inferior
        plane: sagittal
      - id: mammillothalamic
        region: nextbrain:left:276
        source_name: mammillothalamic_tract
        name: { en: Left mammillothalamic tract, fr: Faisceau mamillothalamique gauche }
        role: { en: Ascent to the anterior thalamus, fr: Ascension vers le thalamus antérieur }
        explanation:
          en: In human dissections, this bundle rises from the mammillary body into the anterior thalamic nuclear group. It runs behind the descending fornix.
          fr: Dans les dissections humaines, ce faisceau monte du corps mamillaire et pénètre dans le groupe des noyaux antérieurs du thalamus. Il passe en arrière de la colonne descendante du fornix.
        mapping:
          en: NextBrain segments the bundle as a single volume. Fibres bound for different thalamic nuclei share the label.
          fr: NextBrain segmente le faisceau en un seul volume. La même étiquette regroupe les fibres destinées aux différents noyaux thalamiques.
        view: left
        plane: sagittal
      - id: thalamus
        region: nextbrain:left:220
        source_name: anteroventral_nucleus_of_thalamus
        name: { en: Left anteroventral thalamic nucleus, fr: Noyau antéroventral gauche du thalamus }
        role: { en: Thalamic target of the medial mammillary nucleus, fr: Cible thalamique du noyau mamillaire médial }
        explanation:
          en: In macaques, projections from the medial mammillary nucleus reach the anteroventral thalamic nucleus on the same side.
          fr: Chez le macaque, des projections du noyau mamillaire médial atteignent le noyau antéroventral du thalamus du même côté.
        mapping:
          en: NextBrain displays the anteroventral nucleus as a single volume. The anteromedial and anterodorsal labels appear on cut faces.
          fr: NextBrain représente le noyau antéroventral en un seul volume. Les étiquettes des noyaux antéromédial et antérodorsal apparaissent sur les faces de coupe.
        view: superior
        plane: coronal

  - id: motor
    name: { en: Basal ganglia motor loops, fr: Boucles motrices des ganglions de la base }
    summary:
      en: Follow cortical input and pallidal output on the left, then explore two relays of the indirect branch.
      fr: Suivez les afférences corticales et les efférences pallidales à gauche, puis explorez deux relais de la voie indirecte.
    route:
      en: Direct branch · left primary motor cortex → putamen → GPi → motor thalamus (VApc) → frontal motor areas. Indirect branch · left putamen → GPe → subthalamic nucleus → GPi.
      fr: Voie directe · cortex moteur primaire gauche → putamen → GPi → thalamus moteur (VApc) → aires motrices frontales. Voie indirecte · putamen gauche → GPe → noyau sous-thalamique → GPi.
    scope:
      en: The first four landmarks show cortical input, the direct striatopallidal projection and pallidal output to the thalamus. The final two landmarks show the pallidal and subthalamic relays of the indirect branch, which begins in the putamen. The tour omits nigral output, nigrostriatal dopamine input, the hyperdirect pathway and nonmotor loops.
      fr: Les quatre premiers repères montrent les afférences corticales, la projection striatopallidale directe et les efférences pallidales vers le thalamus. Les deux derniers repères montrent les relais pallidal et sous-thalamique de la voie indirecte, qui débute dans le putamen. Le parcours laisse de côté les efférences nigriques, les afférences dopaminergiques nigrostriées, la voie hyperdirecte et les boucles non motrices.
    clinical:
      en: In a post-mortem comparison, Fearnley and Lees studied 20 people with Parkinson’s disease. Pigmented neuron loss at a caudal level of the substantia nigra pars compacta was greatest in the lateral part of its ventral tier. Bhatia and Marsden reported parkinsonism in 6% of 240 published cases with lesions involving the caudate, putamen or globus pallidus, and in 19% of those with bilateral lentiform lesions. Holm and colleagues prospectively followed 15 adults after an ischaemic stroke treated with reperfusion. All had a unilateral infarct involving the posterior putamen, and 14 also had caudate involvement. Parkinsonism was present in four patients at about three months and ten at about one year. At one year, nine of those ten had signs only on the side opposite the infarct. One had signs on both sides, more pronounced on the side opposite the infarct. The study enrolled a small group with infarcts confined to the striatum and NIH Stroke Scale scores below six at discharge. The effect of an infarct confined to the putamen remains uncertain.
      fr: Dans une comparaison neuropathologique post mortem, Fearnley et Lees ont étudié 20 personnes atteintes de la maladie de Parkinson. À un niveau caudal de la pars compacta de la substance noire, la perte de neurones pigmentés prédominait dans la partie latérale de l’étage ventral. Bhatia et Marsden ont relevé un syndrome parkinsonien dans 6 % des 240 cas publiés de lésions touchant le noyau caudé, le putamen ou le globus pallidus, et dans 19 % des cas avec des lésions lenticulaires bilatérales. Dans une étude prospective, Holm et ses collègues ont suivi 15 adultes après un AVC ischémique traité par reperfusion. Tous présentaient un infarctus unilatéral touchant la partie postérieure du putamen, associé à une atteinte du noyau caudé dans 14 cas. Un syndrome parkinsonien était présent chez quatre patients à environ trois mois et chez dix à environ un an. À un an, neuf de ces dix patients présentaient des signes uniquement du côté opposé à l’infarctus. Chez le dixième, les signes étaient bilatéraux, avec une prédominance du côté opposé à l’infarctus. L’étude a retenu un petit groupe de patients dont l’infarctus était limité au striatum et dont le score NIHSS à la sortie de l’hôpital était inférieur à six. L’effet d’un infarctus limité au putamen reste indéterminé.
    deficit: parkinsonism
    references: [basal-ganglia, motor-learning, striatal-input, motor-corticostriatal, motor-striatopallidal, motor-pallidosubthalamic, motor-pallidothalamic, motor-thalamocortical, cerebellothalamic-course, cortical-parcellation, clinical-fearnley-1991, clinical-bhatia-1994, clinical-holm-2025]
    clinical_references: [clinical-fearnley-1991, clinical-bhatia-1994, clinical-holm-2025]
    # The landmarks on a grid and the sign of each projection between them, as each landmark's
    # explanation states it. Connected landmarks sit in neighbouring cells.
    diagram:
      nodes:
        - { step: cortex, column: 1, row: 1, label: { en: Motor cortex, fr: Cortex moteur } }
        - { step: putamen, column: 1, row: 2, label: { en: Putamen, fr: Putamen } }
        - { step: gpi, column: 1, row: 3, label: { en: GPi, fr: GPi } }
        - { step: thalamus, column: 1, row: 4, label: { en: Thalamus, fr: Thalamus } }
        - { step: gpe, column: 2, row: 2, label: { en: GPe, fr: GPe } }
        - { step: stn, column: 2, row: 3, label: { en: Subthalamic nucleus, fr: Noyau sous-thalamique } }
      edges:
        - { from: cortex, to: putamen, sign: excitatory }
        - { from: putamen, to: gpi, sign: inhibitory }
        - { from: gpi, to: thalamus, sign: inhibitory }
        - { from: putamen, to: gpe, sign: inhibitory }
        - { from: gpe, to: stn, sign: inhibitory }
        - { from: stn, to: gpi, sign: excitatory }
    steps:
      - id: cortex
        region: hcp-mmp:left:8
        source_name: L_4_ROI
        name: { en: Left primary motor cortex · area 4, fr: Cortex moteur primaire gauche · aire 4 }
        role: { en: Cortical input to the putamen, fr: Afférences corticales vers le putamen }
        explanation:
          en: In macaques, retrograde tracing identifies a projection from primary motor cortex to the dorsolateral postcommissural putamen. Cortical inputs to the striatum are excitatory.
          fr: Chez le macaque, le traçage rétrograde met en évidence une projection du cortex moteur primaire vers la partie dorsolatérale du putamen postcommissural. Les afférences corticales vers le striatum sont excitatrices.
        mapping:
          en: This group-based HCP-MMP parcel estimates the location of area 4 on this cortical surface.
          fr: Cette parcelle HCP-MMP, établie à partir de données de groupe, estime la localisation de l’aire 4 sur cette surface corticale.
        view: left
        plane: coronal
      - id: putamen
        region: nextbrain:left:79
        source_name: putamen
        name: { en: Left putamen, fr: Putamen gauche }
        role: { en: Striatal relay of cortical input, fr: Relais striatal des afférences corticales }
        explanation:
          en: In the classical circuit, putaminal projections reach GPi in the direct branch and GPe in the indirect branch. Single-axon tracing in squirrel monkeys found putaminal axons with branches in both pallidal segments.
          fr: Dans le schéma classique, les projections du putamen atteignent le GPi par la voie directe et le GPe par la voie indirecte. Chez le singe écureuil, le traçage d’axones individuels a montré que certains axones du putamen se ramifient dans les deux segments du globus pallidus.
        mapping:
          en: The main NextBrain putamen parcel serves as an anatomical landmark for the dorsolateral postcommissural motor territory. The parcel extends beyond that territory. NextBrain labels the posteroventral portion separately.
          fr: La parcelle principale du putamen de NextBrain sert de repère anatomique pour le territoire moteur dorsolatéral postcommissural. Elle s’étend au-delà de ce territoire. NextBrain délimite séparément la portion postéroventrale.
        view: anterior
        plane: coronal
      - id: gpi
        region: nextbrain:left:206
        source_name: internal_segment_of_globus_pallidus
        name: { en: Left internal globus pallidus · GPi, fr: Segment interne du globus pallidus gauche · GPi }
        role: { en: Inhibitory output to the thalamus, fr: Efférences inhibitrices vers le thalamus }
        explanation:
          en: GPi neurons receive inhibitory input from the striatum in the direct branch and send inhibitory projections to the thalamus. Human post-mortem histology traces pallidothalamic fibres from the internal pallidum into the thalamus.
          fr: Dans la voie directe, les neurones du GPi reçoivent des afférences inhibitrices du striatum et envoient des projections inhibitrices vers le thalamus. L’histologie humaine post mortem montre le trajet des fibres pallidothalamiques du globus pallidus interne jusqu’au thalamus.
        mapping:
          en: NextBrain displays the entire internal segment. The motor territory occupies part of this volume.
          fr: NextBrain représente le segment interne dans son ensemble. Le territoire moteur occupe une partie de ce volume.
        view: anterior
        plane: coronal
      - id: thalamus
        region: nextbrain:left:222
        source_name: parvocellular_division_of_va
        name: { en: Parvocellular division of the left ventral anterior thalamic nucleus · VApc, fr: Portion parvocellulaire du noyau ventral antérieur du thalamus gauche · VApc }
        role: { en: Relay toward frontal motor areas, fr: Relais vers les aires motrices frontales }
        explanation:
          en: In macaques, anterograde tracing from the ventrolateral GPi labels terminals in the parvocellular ventral anterior nucleus (VApc). Tracing from caudal VApc shows projections to the supplementary motor area and lateral premotor cortex.
          fr: Chez le macaque, le traçage antérograde depuis la partie ventrolatérale du GPi révèle des terminaisons dans la portion parvocellulaire du noyau ventral antérieur (VApc). Le traçage depuis la partie caudale du VApc montre des projections vers l’aire motrice supplémentaire et le cortex prémoteur latéral.
        mapping:
          en: The NextBrain parcel outlines VApc, one of several pallidal-recipient territories of the motor thalamus.
          fr: Cette parcelle de NextBrain délimite le VApc, l’un des territoires du thalamus moteur qui reçoivent des afférences pallidales.
        view: anterior
        plane: coronal
      - id: gpe
        region: nextbrain:left:119
        source_name: external_segment_of_globus_pallidus
        name: { en: Left external globus pallidus · GPe, fr: Segment externe du globus pallidus gauche · GPe }
        role: { en: Pallidal relay of the indirect branch, fr: Relais pallidal de la voie indirecte }
        explanation:
          en: The indirect branch runs from the putamen to GPe, where striatal afferents inhibit GPe neurons. In squirrel monkeys, tracing and GABA immunolabelling identify GABAergic terminals from GPe in the subthalamic nucleus.
          fr: Dans la voie indirecte, les afférences du putamen inhibent les neurones du GPe. Chez le saïmiri, le traçage axonal et l’immunomarquage du GABA révèlent des terminaisons GABAergiques du GPe dans le noyau sous-thalamique.
        mapping:
          en: NextBrain displays the entire external segment. The projecting motor territory occupies part of this volume.
          fr: NextBrain représente le segment externe dans son ensemble. Le territoire moteur d’où partent ces projections occupe une partie de ce volume.
        view: anterior
        plane: coronal
      - id: stn
        region: nextbrain:left:316
        source_name: laterodorsal_portion_of_sth
        name: { en: Dorsolateral portion of the left subthalamic nucleus, fr: Portion dorsolatérale du noyau sous-thalamique gauche }
        role: { en: Excitatory projection to GPi, fr: Projection excitatrice vers le GPi }
        explanation:
          en: In squirrel monkeys, retrograde tracing from the sensorimotor GPi labels neurons chiefly in the dorsolateral subthalamic nucleus. Subthalamic projections to GPi are excitatory.
          fr: Chez le saïmiri, le traçage rétrograde depuis le territoire sensorimoteur du GPi marque des neurones surtout dans la portion dorsolatérale du noyau sous-thalamique. Les projections du noyau sous-thalamique vers le GPi sont excitatrices.
        mapping:
          en: The NextBrain parcel is an anatomical landmark for the dorsolateral subthalamic region identified by tracing in squirrel monkeys.
          fr: La parcelle de NextBrain sert de repère anatomique pour la région sous-thalamique dorsolatérale mise en évidence par traçage chez le saïmiri.
        view: anterior
        plane: axial

  - id: cerebellar
    name: { en: Cerebellar output and crossing, fr: Sortie cérébelleuse et croisement }
    summary:
      en: Follow a crossed output branch from the left cerebellum to the right thalamus and primary motor cortex.
      fr: Suivez une voie efférente croisée du cervelet gauche au thalamus et au cortex moteur primaire droits.
    route:
      en: Left cerebellar cortex → left dentate nucleus → left superior cerebellar peduncle → midbrain crossing, then right red nucleus waypoint → right motor thalamus → right primary motor cortex.
      fr: Cortex cérébelleux gauche → noyau dentelé gauche → pédoncule cérébelleux supérieur gauche → décussation mésencéphalique puis passage au niveau du noyau rouge droit → thalamus moteur droit → cortex moteur primaire droit.
    scope:
      en: This branch passes through the dentate nucleus. Human histology shows the course towards the thalamus. Tracing in capuchins links cerebellar output to primary motor cortex. Mossy and climbing inputs, output through other cerebellar nuclei and the return pathway lie outside the tour.
      fr: Cette branche efférente passe par le noyau dentelé. L’histologie humaine décrit le trajet vers le thalamus. Le traçage anatomique chez le capucin relie les efférences cérébelleuses au cortex moteur primaire. Les afférences moussues et grimpantes, les voies issues des autres noyaux cérébelleux et la voie de retour restent hors du parcours.
    clinical:
      en: In 90 patients with focal cerebellar lesions, Schoch and colleagues analysed ischaemic lesions (43 patients) separately from surgical lesions (47 patients), with acute and chronic subgroups in both groups. The surgical group included 38 patients who had undergone tumour resection in childhood or adolescence. Limb ataxia was associated with lesions of the interposed nuclei and part of the dentate nucleus. The most statistically significant lesion–symptom associations occurred in the acute ischaemic subgroup. The chronic subgroups showed similar associations involving the deep nuclei and fewer cortical associations. In a 70-year-old man, Alalousi and Bonnan observed mild left lower-limb ataxia on heel-to-shin testing and a tendency to fall to the right when walking. MRI showed a small left anterior paravermal infarct just behind and above the superior cerebellar peduncle. The fibre pathways affected by the infarct remain uncertain. The connections followed in this tour come from anatomical studies.
      fr: Chez 90 patients présentant une lésion cérébelleuse focale, Schoch et ses collègues ont analysé séparément les lésions ischémiques (43 patients) et les lésions chirurgicales (47 patients), avec des sous-groupes aigus et chroniques dans les deux cas. Le groupe chirurgical comprenait 38 patients opérés d’une tumeur dans l’enfance ou l’adolescence. L’ataxie des membres était associée à des lésions des noyaux interposés et d’une partie du noyau dentelé. Les associations entre lésions et symptômes étaient les plus significatives sur le plan statistique dans le sous-groupe ischémique aigu. Dans les sous-groupes chroniques, les associations avec les lésions des noyaux profonds étaient similaires et les associations avec les lésions corticales étaient moins nombreuses. Chez un homme de 70 ans, Alalousi et Bonnan ont observé une légère ataxie du membre inférieur gauche à l’épreuve talon-genou et une tendance à chuter vers la droite à la marche. L’IRM a montré un petit infarctus de la région paravermienne antérieure gauche, juste en arrière et au-dessus du pédoncule cérébelleux supérieur. Les faisceaux atteints restent indéterminés. Les connexions suivies dans ce parcours sont décrites dans les études anatomiques.
    deficit: ataxia
    references: [cerebellar-organization, cerebellar-local-circuits, cerebellar-projections, cerebellar-peduncles, cerebellothalamic-course, cerebellar-motor-loops, cortical-parcellation, clinical-schoch-2006, clinical-alalousi-rostral-infarct-2024]
    clinical_references: [clinical-schoch-2006, clinical-alalousi-rostral-infarct-2024]
    steps:
      - id: cortex
        region: learning:cerebellar-cortex-left
        source_name: Cerebellar cortex
        name: { en: Left cerebellar cortex, fr: Cortex cérébelleux gauche }
        role: { en: Inhibitory cortical output, fr: Efférences corticales inhibitrices }
        explanation:
          en: Purkinje cells send inhibitory output to the deep cerebellar nuclei. The lateral cerebellar hemisphere provides Purkinje-cell input to the dentate nucleus on the same side.
          fr: Les cellules de Purkinje envoient des projections inhibitrices vers les noyaux profonds du cervelet. Les cellules de Purkinje de la partie latérale de l’hémisphère cérébelleux projettent vers le noyau dentelé du même côté.
        mapping:
          en: The volume shows the whole left cerebellar cortex. The lateral territory projecting to the dentate occupies part of this volume.
          fr: Le volume représente l’ensemble du cortex cérébelleux gauche. Le territoire latéral qui projette vers le noyau dentelé n’en occupe qu’une partie.
        view: posterior
        plane: coronal
        # Where the brain publishes cerebellar lobules, the whole cortex is no single landmark.
        alternatives:
          - region: learning:lobule-v-left
            source_name: Lobule V
            name: { en: Left lobule V, fr: Lobule V gauche }
            explanation:
              en: Purkinje cells in the lateral cerebellar hemisphere provide inhibitory input to the ipsilateral dentate nucleus. In tufted capuchins, tracing linked Purkinje cells chiefly in lobules IV–VI to the arm area of contralateral primary motor cortex through cerebellar nuclear and thalamic relays.
              fr: Les cellules de Purkinje de la partie latérale de l’hémisphère cérébelleux exercent une action inhibitrice sur le noyau dentelé du même côté. Chez le capucin brun, le traçage a relié les cellules de Purkinje situées principalement dans les lobules IV à VI à l’aire du bras du cortex moteur primaire controlatéral, par des relais dans les noyaux cérébelleux et le thalamus.
            mapping:
              en: The CerebNet label includes the hemispheric part of lobule V and the corresponding part of the anterior vermis. It spans a larger territory than the patches of Purkinje cells identified within lobule V by tracing.
              fr: L’étiquette CerebNet comprend la portion hémisphérique du lobule V et la partie correspondante du vermis antérieur. Elle couvre un territoire plus étendu que les groupes de cellules de Purkinje repérés par traçage dans ce lobule.
      - id: dentate
        region: learning:left:dentate
        source_name: Cerebellar dentate nucleus
        covering_regions: [learning:cerebellar-cortex-left]
        name: { en: Left cerebellar dentate nucleus, fr: Noyau dentelé cérébelleux gauche }
        role: { en: Deep cerebellar output, fr: Efférences d’un noyau profond du cervelet }
        explanation:
          en: The model hides the overlying cerebellar cortex to expose this nucleus. Dentate axons ascend in the superior cerebellar peduncle. The branch followed here crosses towards the opposite thalamus.
          fr: Le modèle masque le cortex cérébelleux qui recouvre ce noyau. Les axones du noyau dentelé montent dans le pédoncule cérébelleux supérieur. La branche suivie ici croise la ligne médiane en direction du thalamus controlatéral.
        mapping:
          en: The volume shows the whole dentate, including territories beyond the motor output branch. Returning to the cerebellar cortex landmark restores the overlying label. Linked MRI retains the complete tissue volume.
          fr: Le volume représente le noyau dentelé entier, au-delà du territoire de la branche motrice. Revenir au repère cortical réaffiche la structure qui le recouvre. L’IRM liée conserve le volume tissulaire complet.
        view: posterior
        plane: coronal
        alternatives:
          - covering_regions:
              - learning:lobules-i-iv-left
              - learning:lobule-v-left
              - learning:lobule-vi-left
              - learning:crus-i-left
              - learning:crus-ii-left
              - learning:lobule-viib-left
              - learning:lobule-viiia-left
              - learning:lobule-viiib-left
              - learning:lobule-ix-left
              - learning:lobule-x-left
            explanation:
              en: The model hides the left lobular labels to expose this nucleus. Dentate axons ascend in the superior cerebellar peduncle. The branch followed here crosses towards the opposite thalamus.
              fr: Le modèle masque les étiquettes des lobules gauches pour dégager ce noyau. Les axones du noyau dentelé montent dans le pédoncule cérébelleux supérieur. La branche suivie ici croise la ligne médiane en direction du thalamus controlatéral.
            mapping:
              en: The volume shows the whole dentate, including territories beyond the motor output branch. Returning to lobule V restores the hidden labels, including the anterior vermis grouped with the left lobules I–IV and V. Linked MRI retains the complete tissue volume.
              fr: Le volume représente le noyau dentelé entier, au-delà du territoire de la branche motrice. Revenir au lobule V réaffiche les étiquettes masquées, dont la portion du vermis antérieur comprise dans les lobules gauches I à IV et V. L’IRM liée conserve le volume tissulaire complet.
      - id: superior-peduncle
        region: learning:left:superior-cerebellar-peduncle
        source_name: Superior cerebellar peduncle
        name: { en: Left superior cerebellar peduncle, fr: Pédoncule cérébelleux supérieur gauche }
        role: { en: Ascent before the crossing, fr: Trajet ascendant avant la décussation }
        explanation:
          en: This peduncle carries much of the cerebellar output towards the midbrain. The branch crosses in the caudal midbrain, and the next landmark is on the right.
          fr: Ce pédoncule conduit une grande partie des efférences cérébelleuses vers le mésencéphale. La branche croise dans le mésencéphale caudal et le repère suivant se situe à droite.
        mapping:
          en: The segmented volume outlines the left peduncle, which carries several groups of fibres. It serves as a landmark before the decussation.
          fr: Le volume segmenté délimite le pédoncule gauche, qui contient plusieurs groupes de fibres. Il sert de repère en amont de la décussation.
        view: posterior
        plane: coronal
      - id: red-nucleus
        region: learning:right:red-nucleus
        source_name: Red nucleus
        covering_regions: [learning:right:midbrain, learning:right:vta]
        name: { en: Right red nucleus, fr: Noyau rouge droit }
        role: { en: Right-sided waypoint after the crossing, fr: Repère droit après la décussation }
        explanation:
          en: After the crossing, cerebellothalamic fibres pass through and in front of the right red nucleus before ascending to the thalamus. The thalamus is the next relay in this branch.
          fr: Après la décussation, les fibres cérébellothalamiques passent par le noyau rouge droit et en avant de celui-ci avant de monter vers le thalamus. Le thalamus est le relais suivant de cette branche.
        mapping:
          en: The red nucleus marks the fibre course described in human post-mortem sections. The model hides the surrounding midbrain territory and ventral tegmental area here and restores them at other landmarks.
          fr: Le noyau rouge sert de repère sur le trajet des fibres décrit en histologie humaine post mortem. Le modèle masque ici le territoire mésencéphalique environnant et l’aire tegmentale ventrale, puis les réaffiche aux autres repères.
        view: left
        plane: axial
      - id: thalamus
        region: learning:right:thalamus
        source_name: Thalamus
        name: { en: Right thalamus, fr: Thalamus droit }
        role: { en: Contralateral motor relay territory, fr: Territoire de relais moteur controlatéral }
        explanation:
          en: Human histology shows cerebellothalamic fibres entering the ventral division of the posterior ventrolateral nucleus, called VLpv in Morel’s atlas. In tufted capuchins, tracing identified neurons in ventral thalamic nuclei that project to the arm area of primary motor cortex.
          fr: L’histologie humaine situe l’entrée des fibres cérébellothalamiques dans la partie ventrale du noyau ventrolatéral postérieur du thalamus, appelée VLpv dans l’atlas de Morel. Chez le capucin brun, le traçage a identifié des neurones des noyaux ventraux du thalamus qui projettent vers l’aire du bras du cortex moteur primaire.
        mapping:
          en: The teaching volume groups right thalamic regions across and beyond the posterior ventrolateral relay territory.
          fr: Le volume pédagogique regroupe des régions du thalamus droit et s’étend au-delà du territoire de relais ventrolatéral postérieur.
        view: anterior
        plane: coronal
      - id: motor-cortex
        region: hcp-mmp:right:8
        source_name: R_4_ROI
        name: { en: Right primary motor area 4, fr: Aire motrice primaire 4 droite }
        role: { en: Cortical target of the crossed branch, fr: Cible corticale de la branche croisée }
        explanation:
          en: In capuchins, tracing linked the arm area of primary motor cortex across several synapses to the opposite dentate nucleus and cerebellar cortex. Right area 4 marks the cortical end of the branch on this atlas.
          fr: Chez le capucin, le traçage a mis en évidence une connexion, à travers plusieurs synapses, entre l’aire du bras du cortex moteur primaire, le noyau dentelé et le cortex cérébelleux controlatéraux. L’aire 4 droite repère la cible corticale de cette branche dans l’atlas.
        mapping:
          en: The HCP-MMP parcel outlines area 4 on this brain’s cortical surface. The arm representation occupies part of that area.
          fr: La parcelle HCP-MMP délimite l’aire 4 sur la surface corticale de ce cerveau. La représentation du bras en occupe une partie.
        view: right
        plane: axial

  - id: corticospinal
    name: { en: Corticospinal descent and crossing, fr: Descente corticospinale et croisement }
    summary:
      en: Follow the main crossed branch from the left primary motor cortex through the brainstem to the right side of the cervical cord.
      fr: Suivez la principale branche croisée du cortex moteur primaire gauche jusqu’au côté droit de la moelle cervicale, en passant par le tronc cérébral.
    route:
      en: Left primary motor cortex → left midbrain → pyramidal decussation in the caudal medulla → right lateral corticospinal tract
      fr: Cortex moteur primaire gauche → mésencéphale gauche → décussation pyramidale dans le bulbe caudal → faisceau corticospinal latéral droit
    scope:
      en: The internal capsule and pons lie along the route between stops. The tour omits the anterior corticospinal tract and spinal terminations. The first three stops overlay this subject’s left corticospinal diffusion MRI estimates down to the lower brainstem.
      fr: La capsule interne et le pont se trouvent sur le trajet entre les repères. Le parcours laisse de côté le faisceau corticospinal antérieur et les terminaisons spinales. Les trois premiers repères montrent les trajectoires du faisceau corticospinal gauche estimées par IRM de diffusion chez ce sujet jusqu’à la partie inférieure du tronc cérébral.
    clinical:
      en: In 41 adults aged 38–77 years with upper-limb paresis and elbow-flexor spasticity in the subacute phase of a first stroke involving the middle cerebral artery territory, lower upper-limb Fugl–Meyer scores were associated with lesions along the corticospinal tract in the superior corona radiata and posterior limb of the internal capsule, and with lesions in other regions including the insula and putamen. The Fugl–Meyer associations survived correction for multiple comparisons. The separate map of biceps spasticity was exploratory. In a case report, a 64-year-old man had right arm and leg weakness and later developed a right extensor plantar response. MRI showed a right lateral medullary infarct extending from the rostral medulla into the upper cervical cord, alongside a right cerebellar infarct. The authors attributed the weakness to corticospinal injury in the upper cervical cord, below the decussation. The infarct spanned several levels, leaving the precise site responsible for the weakness uncertain.
      fr: Chez 41 adultes de 38 à 77 ans présentant une parésie du membre supérieur et une spasticité des fléchisseurs du coude en phase subaiguë après un premier AVC touchant le territoire de l’artère cérébrale moyenne, des scores plus faibles à l’évaluation de Fugl–Meyer du membre supérieur étaient associés à des lésions sur le trajet du faisceau corticospinal dans la couronne rayonnante supérieure et le bras postérieur de la capsule interne, ainsi qu’à des lésions d’autres régions, dont l’insula et le putamen. Les associations avec les scores de Fugl–Meyer restaient significatives après correction pour comparaisons multiples. La carte distincte de la spasticité du biceps brachial avait une valeur exploratoire. Dans une observation clinique, un homme de 64 ans présentait une faiblesse du bras et de la jambe à droite. Un signe de Babinski droit est apparu par la suite. L’IRM montrait un infarctus latérobulbaire droit s’étendant de l’étage rostral du bulbe à la moelle cervicale haute, ainsi qu’un infarctus du cervelet droit. Les auteurs ont attribué la faiblesse à une atteinte du faisceau corticospinal dans la moelle cervicale haute, sous la décussation. L’étendue de l’infarctus laissait indéterminé le siège précis de l’atteinte responsable de la faiblesse.
    deficit: hemiparesis
    references: [corticospinal-anatomy, corticospinal-brainstem, corticospinal-primary-motor, corticospinal-decussation, motor-weakness, cortical-parcellation, clinical-kim-opalski-2006]
    clinical_references: [motor-weakness, clinical-kim-opalski-2006]
    steps:
      - id: motor-cortex
        region: hcp-mmp:left:8
        source_name: L_4_ROI
        tract: cst-left
        name: { en: Left primary motor cortex, fr: Cortex moteur primaire gauche }
        role: { en: One cortical source, fr: Une source corticale }
        explanation:
          en: Area 4 is the primary motor cortex and contributes fibres to the corticospinal tract. Human diffusion studies also estimate contributions from premotor and primary somatosensory cortex.
          fr: L’aire 4 correspond au cortex moteur primaire et donne naissance à des fibres corticospinales. Les études humaines en IRM de diffusion suggèrent aussi des contributions des cortex prémoteur et somatosensoriel primaire.
        mapping:
          en: HCP-MMP delineates area 4 on this cortical surface.
          fr: La parcelle HCP-MMP délimite l’aire 4 sur cette surface corticale.
        view: left
        plane: axial
      - id: midbrain
        region: learning:left:midbrain
        source_name: Midbrain territory
        tract: cst-left
        name: { en: Left midbrain, fr: Mésencéphale gauche }
        role: { en: Passage through the left cerebral peduncle, fr: Passage par le pédoncule cérébral gauche }
        explanation:
          en: Fibres descend through the left cerebral peduncle at the base of the midbrain, then pass through the base of the pons and enter the left medullary pyramid.
          fr: Les fibres descendent dans le pédoncule cérébral gauche, à la base du mésencéphale, puis traversent la base du pont et gagnent la pyramide bulbaire gauche.
        mapping:
          en: This teaching volume combines NextBrain’s broad left midbrain label with the periaqueductal grey, pretectal region, peripeduncular nucleus and dorsal raphe. It is far broader than the cerebral peduncle.
          fr: Ce volume pédagogique réunit l’étiquette générale du mésencéphale gauche de NextBrain avec la substance grise périaqueducale, la région prétectale, le noyau péripédonculaire et le raphé dorsal. Il couvre un territoire bien plus étendu que le pédoncule cérébral.
        view: anterior
        plane: axial
      - id: crossing
        region: learning:caudal-medulla
        source_name: Caudal medulla
        tract: cst-left
        name: { en: Caudal medulla, fr: Bulbe caudal }
        role: { en: Pyramidal decussation level, fr: Niveau de la décussation pyramidale }
        explanation:
          en: Most fibres in the medullary pyramids cross the midline in the caudal medulla. Fibres that cross from the left join the right lateral corticospinal tract.
          fr: La plupart des fibres des pyramides bulbaires franchissent la ligne médiane dans le bulbe caudal. Les fibres qui croisent depuis le côté gauche rejoignent le faisceau corticospinal latéral droit.
        mapping:
          en: This midline teaching label uses the portion of FreeSurfer’s brainstem label below NextBrain’s medullary coverage. Published human anatomy identifies the decussation and its continuation into the right lateral corticospinal tract.
          fr: Ce repère pédagogique médian correspond à la partie de la segmentation du tronc cérébral de FreeSurfer située sous la portion du bulbe couverte par NextBrain. Les études anatomiques humaines situent la décussation et décrivent le trajet qui se poursuit dans le faisceau corticospinal latéral droit.
        view: anterior
        plane: axial
      - id: spinal-tract
        region: pam50:right:lateral-corticospinal-tract
        source_name: right lateral corticospinal tract
        name: { en: Right lateral corticospinal tract, fr: Faisceau corticospinal latéral droit }
        role: { en: Spinal descent after crossing, fr: Descente spinale après croisement }
        explanation:
          en: After crossing, fibres from the left cortex descend in the right lateral funiculus of the spinal cord.
          fr: Après leur décussation, les fibres issues du cortex gauche descendent dans le cordon latéral droit de la moelle épinière.
        mapping:
          en: The registered PAM50 atlas locates the right lateral corticospinal tract in the displayed cord, from vertebral level C1 through part of C5.
          fr: L’atlas PAM50 recalé sur la moelle situe le faisceau corticospinal latéral droit dans la portion affichée de la moelle, du niveau vertébral C1 jusqu’à une partie de C5.
        view: anterior
        plane: axial

  - id: touch
    name: { en: Dorsal column–medial lemniscus pathway, fr: Voie des colonnes dorsales et du lemnisque médial }
    summary:
      en: Follow touch signals from the right side of the body, carried by the dorsal columns and the medial lemniscus, along one branch through the left thalamus and cortex.
      fr: Du thalamus au cortex de l’hémisphère gauche, suivez une branche qui transmet les signaux tactiles du côté droit du corps, acheminés par les colonnes dorsales et le lemnisque médial.
    route:
      en: Left ventral posterolateral thalamic nucleus → area 3b → parietal opercular area OP1 → area OP4
      fr: Noyau ventral postérolatéral gauche → aire 3b → aire OP1 de l’opercule pariétal → aire OP4
    scope:
      en: This branch begins in the left thalamus after the medullary crossing. The arrows follow projections traced in macaques. OP1 and OP4 are the proposed human homologues of macaque S2 and PV, respectively. The tour omits the spinal and brainstem segments, facial pathways, parallel thalamic inputs and cortical return projections.
      fr: Cette branche commence dans le thalamus gauche après la décussation bulbaire. Les flèches suivent des projections mises en évidence par traçage chez le macaque. OP1 et OP4 sont les homologues humains proposés de S2 et de PV, respectivement. Le parcours laisse de côté le trajet dans la moelle spinale et le tronc cérébral, les voies sensitives de la face, les afférences thalamiques parallèles et les projections corticales de retour.
    clinical:
      en: Taskin and colleagues found reduced light-touch sensitivity in the opposite hand or forearm of six people selected for sensory symptoms after strokes involving the VPL and neighbouring thalamic nuclei. In 70 people with chronic unilateral lesions in and around the postcentral gyrus, Rullmann and colleagues associated reduced perception of brush strokes with lesions overlapping cytoarchitectonic area 3b and nearby regions. They pooled lesion sides. The area 3b overlap persisted in a sensitivity analysis for spatial neglect. In 38 patients assessed in the first week after a first stroke, Meyer and colleagues associated arm and hand sensory deficits with lesions in central parietal white matter and in the parietal operculum near the insula. The opercular cluster peaked near the OP2–OP3 border. The authors pooled lesions from both hemispheres. Too few lesions involved the thalamus or primary somatosensory cortex to assess either region. Preusser and colleagues studied 61 people with chronic unilateral brain lesions from stroke or other causes. The study excluded lesions of the postcentral gyrus or its ascending inputs. In corrected lesion analyses run separately by hemisphere, reduced light touch on the opposite side was associated with lesion clusters that overlapped all four parietal opercular areas, chiefly OP4 and OP3, and extended into the insula, putamen and white matter. The effects of injury limited to a single atlas region, including the caudal VPL, or to one of the projections remain unresolved.
      fr: Chez six personnes sélectionnées pour des troubles sensitifs après un AVC touchant le VPL et des noyaux thalamiques voisins, Taskin et ses collègues ont relevé une sensibilité réduite au toucher léger de la main ou de l’avant-bras du côté opposé à la lésion. Chez 70 personnes présentant des lésions unilatérales chroniques dans la région du gyrus postcentral, Rullmann et ses collègues ont associé une perception atténuée du toucher au pinceau à des lésions recouvrant l’aire cytoarchitectonique 3b et des régions voisines. Les auteurs ont regroupé les lésions des deux hémisphères. Le recouvrement de l’aire 3b persistait dans l’analyse de sensibilité consacrée à la négligence spatiale. Chez 38 patients évalués dans la semaine suivant un premier AVC, Meyer et ses collègues ont associé les troubles sensitifs du bras et de la main à des lésions de la substance blanche pariétale centrale et de l’opercule pariétal près de l’insula. Dans l’opercule, le pic se situait près de la limite entre OP2 et OP3. Les auteurs ont regroupé les lésions des deux hémisphères. Trop peu de lésions atteignaient le thalamus ou le cortex somatosensoriel primaire pour évaluer ces régions. Preusser et ses collègues ont étudié 61 personnes présentant une lésion cérébrale unilatérale chronique due à un AVC ou à une autre cause. L’étude excluait les lésions du gyrus postcentral et de ses afférences ascendantes. Dans les analyses lésionnelles corrigées et menées séparément par hémisphère, l’hypoesthésie tactile controlatérale était associée à des zones lésionnelles recouvrant les quatre aires de l’opercule pariétal, surtout OP4 et OP3, et s’étendant à l’insula, au putamen et à la substance blanche. Les effets d’une lésion limitée à une seule région de l’atlas, dont la division caudale du VPL, ou à une seule des projections restent à déterminer.
    deficit: somatosensory
    references: [dorsal-column-anatomy, touch-thalamocortical, touch-opercular-tracing, touch-opercular-homology, cortical-parcellation, clinical-meyer-2016, clinical-preusser-2015, clinical-taskin-2006, clinical-rullmann-2019]
    clinical_references: [clinical-meyer-2016, clinical-preusser-2015, clinical-taskin-2006, clinical-rullmann-2019]
    steps:
      - id: thalamus
        region: nextbrain:left:458
        source_name: caudal_division_of_ventral_posterior_lateral_nucleus
        name: { en: Caudal division of the left ventral posterolateral nucleus, fr: Division caudale du noyau ventral postérolatéral gauche }
        role: { en: Thalamic relay for body touch, fr: Relais thalamique de la sensibilité tactile du corps }
        explanation:
          en: The medial lemniscus carries tactile signals from the right side of the body to the left ventral posterolateral nucleus (VPL). Tracing in macaques shows projections from VPL to area 3b on the same side.
          fr: Le lemnisque médial transmet au noyau ventral postérolatéral gauche (VPL) des signaux tactiles provenant du côté droit du corps. Chez le macaque, le traçage montre des projections du VPL vers l’aire 3b du même côté.
        mapping:
          en: The NextBrain volume shows the caudal division of VPL, one part of the thalamic relay.
          fr: Le volume NextBrain montre la division caudale du VPL, qui représente une partie du relais thalamique.
        view: anterior
        plane: coronal
      - id: area3b
        region: hcp-mmp:left:9
        source_name: L_3b_ROI
        name: { en: Left somatosensory area 3b, fr: Aire somatosensorielle 3b gauche }
        role: { en: Primary cortical recipient of cutaneous input, fr: Cible corticale primaire des afférences cutanées }
        explanation:
          en: In macaques, tracing identifies projections from cutaneous representations in area 3b to S2 in the parietal operculum of the same hemisphere.
          fr: Chez le macaque, le traçage met en évidence des projections des territoires cutanés de l’aire 3b vers S2, dans l’opercule pariétal du même hémisphère.
        mapping:
          en: The HCP-MMP parcel shows atlas area 3b as one cortical region.
          fr: La parcelle HCP-MMP représente l’aire 3b de l’atlas en une seule région corticale.
        view: left
        plane: axial
      - id: op1
        region: hcp-mmp:left:101
        source_name: L_OP1_ROI
        name: { en: Left parietal opercular area OP1, fr: Aire OP1 de l’opercule pariétal gauche }
        role: { en: Opercular recipient of area 3b projections, fr: Cible opérculaire des projections de l’aire 3b }
        explanation:
          en: In macaques, S2 receives projections from area 3b and sends fibres to the neighbouring parietal ventral area, PV. Tracing also shows projections from PV back to S2.
          fr: Chez le macaque, S2 reçoit des projections de l’aire 3b et envoie des fibres vers l’aire pariétale ventrale voisine, appelée PV. Le traçage montre aussi des projections de PV vers S2.
        mapping:
          en: The HCP-MMP OP1 parcel marks the proposed human homologue of macaque S2 on the cortical surface.
          fr: La parcelle HCP-MMP OP1 situe sur la surface corticale l’homologue humain proposé de S2 chez le macaque.
        view: inferior
        plane: coronal
      - id: op4
        region: hcp-mmp:left:100
        source_name: L_OP4_ROI
        name: { en: Left parietal opercular area OP4, fr: Aire OP4 de l’opercule pariétal gauche }
        role: { en: Parietal ventral target of S2 projections, fr: Cible pariétale ventrale des projections de S2 }
        explanation:
          en: In macaques, PV forms a distinct somatosensory area in the operculum. Tracer injected into S2 labelled axon endings in PV, including in regions representing the upper limb.
          fr: Chez le macaque, PV forme une aire somatosensorielle distincte dans l’opercule. Un traceur injecté dans S2 a marqué des terminaisons axonales dans PV, notamment dans des régions qui représentent le membre supérieur.
        mapping:
          en: The HCP-MMP OP4 parcel marks the proposed human homologue of macaque PV on the cortical surface.
          fr: La parcelle HCP-MMP OP4 situe sur la surface corticale l’homologue humain proposé de PV chez le macaque.
        view: inferior
        plane: coronal
  - id: spinothalamic
    name: { en: Spinothalamic pathway, fr: Voie spinothalamique }
    summary:
      en: Follow pain- and temperature-related signals across the spinal cord to the right thalamus, then explore a possible continuation to the right parietal operculum.
      fr: Suivez des signaux liés à la douleur et à la température qui croisent dans la moelle et gagnent le thalamus droit, puis explorez un prolongement possible vers l’opercule pariétal droit.
    route:
      en: Left dorsal horn → right spinal lemniscus after the spinal crossing → right ventral posterior inferior thalamic nucleus → right parietal opercular area OP1 (proposed continuation)
      fr: Corne dorsale gauche → lemnisque spinal droit après la décussation spinale → noyau ventro-postéro-inférieur droit du thalamus → aire OP1 de l’opercule pariétal droit (prolongement proposé)
    scope:
      en: Human studies support the crossed anterolateral route in the cervical cord. Separate macaque studies support spinal input to the VPI and a projection from the VPI to S2. The tour joins those findings at the level of the nucleus. Human OP1 is a proposed counterpart of macaque S2. The tour omits peripheral nerves, brainstem landmarks, facial pathways and other thalamic targets.
      fr: Des études chez l’humain étayent le trajet croisé dans la région antérolatérale de la moelle cervicale. Des études distinctes chez le macaque mettent en évidence des afférences issues de la moelle qui atteignent le VPI et une projection du VPI vers S2. Le parcours rapproche ces résultats à l’échelle du noyau. OP1 est un homologue humain proposé de S2 chez le macaque. Le parcours laisse de côté les nerfs périphériques, les repères du tronc cérébral, les voies sensitives de la face et les autres cibles thalamiques.
    clinical:
      en: In Kim and colleagues’ selected series of four adults with small posterior thalamic infarcts, three had central post-stroke pain and cold allodynia (pain provoked by normally innocuous cooling). Atlas-based MRI mapping located two of those patients’ thalamic lesions mainly in the posterior part of the ventral caudal nucleus (Vc). In one of these patients, the stroke also involved the medial occipital and posteromedial temporal lobes. Karoam and colleagues used published lesion images, including material from Kim’s series, to refine a region of interest extending from the brainstem to the posterior insula and adjacent operculum. In each of two cohorts, lesions in patients with central post-stroke pain overlapped this region more than lesions in stroke comparison patients (72 with pain and 123 comparison patients in total). Pooled lesion mapping associated pain with injury in the ventrocaudal thalamus and nearby white matter. The clinical roles of individual thalamic nuclei and the projection to OP1 remain unresolved.
      fr: Kim et ses collègues ont étudié quatre adultes sélectionnés après un petit infarctus du thalamus postérieur. Trois présentaient une douleur centrale post-AVC et une allodynie au froid (douleur provoquée par un refroidissement normalement indolore). Après recalage des IRM sur un atlas, les lésions thalamiques de deux de ces patients se situaient principalement dans la partie postérieure du noyau ventrocaudal (Vc). Chez l’un de ces patients, l’AVC touchait aussi la partie médiale du lobe occipital et la partie postéromédiale du lobe temporal. Karoam et ses collègues ont utilisé des images de lésions publiées, notamment celles de la série de Kim, pour affiner une région d’intérêt allant du tronc cérébral à l’insula postérieure et à l’opercule adjacent. Dans chacune des deux cohortes, les lésions des patients présentant une douleur centrale post-AVC chevauchaient davantage cette région que celles des témoins ayant subi un AVC (72 patients avec douleur et 123 témoins au total). La cartographie lésionnelle sur les deux cohortes réunies a associé la douleur à des lésions du thalamus ventrocaudal et de la substance blanche voisine. Le rôle clinique des différents noyaux thalamiques et de la projection vers OP1 reste à déterminer.
    deficit: central-pain
    references: [spinothalamic-anatomy, spinothalamic-crossing-human, spinothalamic-cervical-human, spinothalamic-vpi, spinothalamic-opercular, touch-opercular-homology, cortical-parcellation, clinical-karoam-2025, clinical-kim-2007-ventral-caudal]
    clinical_references: [clinical-karoam-2025, clinical-kim-2007-ventral-caudal]
    steps:
      - id: dorsal-horn
        region: pam50:left:dorsal-horn
        source_name: left dorsal horn
        name: { en: Left dorsal horn, fr: Corne dorsale gauche }
        role: { en: Spinal relay for incoming sensory signals, fr: Relais spinal des afférences sensitives }
        explanation:
          en: Sensory fibres carrying pain and temperature signals from the left side of the body enter the cord and contact neurons in the left dorsal horn. In macaques, a study of the lumbar dorsal horn located neurons projecting to the ventral posterior inferior nucleus in its superficial marginal zone.
          fr: Les fibres sensitives qui transmettent les signaux de douleur et de température du côté gauche du corps entrent dans la moelle et contactent des neurones de la corne dorsale gauche. Chez le macaque, une étude de la corne dorsale lombaire a localisé dans sa zone marginale superficielle des neurones qui se projettent vers le noyau ventro-postéro-inférieur.
        mapping:
          en: The registered PAM50 label outlines the whole dorsal horn at the displayed vertebral levels, from C1 through part of C5. The marginal zone forms a small part of this label.
          fr: L’étiquette recalée de PAM50 représente toute la corne dorsale aux niveaux vertébraux affichés, de C1 jusqu’à une partie de C5. La zone marginale n’en occupe qu’une petite partie.
        view: posterior
        plane: axial
      - id: spinal-lemniscus
        region: pam50:right:spinal-lemniscus
        source_name: right spinal lemniscus (spinothalamic and spinoreticular tracts)
        name: { en: Right spinal lemniscus, fr: Lemnisque spinal droit }
        role: { en: Spinal ascent after crossing, fr: Ascension spinale après la décussation }
        explanation:
          en: Axons from the left dorsal horn cross the midline within the spinal cord and ascend toward the thalamus in the right anterolateral white matter. In a small human study of the upper cervical cord, sites linked to leg sensations were farther back and more lateral than sites linked to hand sensations.
          fr: Des axones issus de la corne dorsale gauche franchissent la ligne médiane de la moelle, puis remontent vers le thalamus dans la substance blanche antérolatérale droite. Dans une petite étude de la moelle cervicale haute chez l’humain, les sites associés aux sensations de la jambe se situaient plus en arrière et plus latéralement que ceux associés aux sensations de la main.
        mapping:
          en: This registered PAM50 label estimates the combined location of the spinothalamic and spinoreticular tracts in the displayed cervical cord.
          fr: Cette étiquette PAM50 recalée estime la localisation conjointe des faisceaux spinothalamique et spinoréticulaire dans la portion cervicale affichée.
        view: anterior
        plane: axial
      - id: vpi
        region: nextbrain:right:10424
        source_name: ventral_posterior_inferior_nucleus
        name: { en: Right ventral posterior inferior thalamic nucleus, fr: Noyau ventro-postéro-inférieur droit du thalamus }
        role: { en: Spinothalamic target in macaques, fr: Cible spinothalamique chez le macaque }
        explanation:
          en: Electrophysiological mapping in macaques identified estimated termination zones of spinothalamic axons within the ventral posterior inferior nucleus, or VPI. This is one of several thalamic targets of the spinothalamic tract.
          fr: Chez le macaque, la cartographie électrophysiologique a situé des zones de terminaison estimées des axones spinothalamiques dans le noyau ventro-postéro-inférieur, ou VPI. Ce noyau est l’une des cibles thalamiques du faisceau spinothalamique.
        mapping:
          en: The NextBrain parcel estimates the extent of the whole VPI in this brain.
          fr: La parcelle NextBrain estime l’étendue du VPI entier dans ce cerveau.
        view: anterior
        plane: coronal
      - id: op1
        region: hcp-mmp:right:101
        source_name: R_OP1_ROI
        name: { en: Right parietal opercular area OP1, fr: Aire OP1 de l’opercule pariétal droit }
        role: { en: Proposed human counterpart of macaque S2, fr: Homologue humain proposé de S2 chez le macaque }
        explanation:
          en: Tracing in macaques shows that the VPI sends fibres to the second somatosensory area, S2, in the parietal operculum of the same hemisphere.
          fr: Chez le macaque, le traçage montre que le VPI envoie des fibres vers l’aire somatosensorielle secondaire, S2, dans l’opercule pariétal du même hémisphère.
        mapping:
          en: The HCP-MMP OP1 parcel marks the proposed human homologue of macaque S2 on the cortical surface.
          fr: La parcelle HCP-MMP OP1 situe sur la surface corticale l’homologue humain proposé de S2 chez le macaque.
        view: inferior
        plane: coronal
  - id: pontine-motor
    name: { en: Motor corticopontocerebellar pathway, fr: Voie corticopontocérébelleuse motrice }
    summary:
      en: Follow a branch from the left primary motor cortex through the pons to the right cerebellar cortex.
      fr: Suivez une branche du cortex moteur primaire gauche au cortex cérébelleux droit en passant par le pont.
    route:
      en: Left primary motor cortex → left pontine nuclei → right ventral pons after the crossing → right cerebellar lobule V
      fr: Cortex moteur primaire gauche → noyaux pontiques gauches → pont ventral droit après la décussation → lobule V droit du cervelet
    scope:
      en: This branch ends at one cerebellar target. The right middle cerebellar peduncle carries these fibres into the cerebellum and has no separate CDMD landmark. In humans, diffusion tractography estimated trajectories through the middle cerebellar peduncle using left cerebellar lobule V as a seed and the whole pons as the target mask. The tracking left the trajectories’ endpoints within the pons, the specific relay nuclei and the direction of signalling unresolved. The tour omits the weaker projection to the opposite pontine nuclei traced in macaques and the return pathways from the cerebellum.
      fr: Cette branche se termine dans un seul territoire cérébelleux. Le pédoncule cérébelleux moyen droit conduit ces fibres au cervelet et ne dispose pas de repère propre dans CDMD. Chez l’humain, la tractographie de diffusion a estimé des trajectoires passant par le pédoncule cérébelleux moyen, avec le lobule V gauche du cervelet comme région d’amorçage et l’ensemble du pont comme masque cible. Les points de terminaison des trajectoires dans le pont, les noyaux pontiques de relais et le sens de transmission restaient indéterminés. Le parcours laisse de côté la projection moins fournie vers les noyaux pontiques controlatéraux mise en évidence chez le macaque et les voies de retour du cervelet.
    clinical:
      en: Moulin and colleagues studied 100 consecutive patients with a first stroke presenting as ataxic hemiparesis. Among 77 patients with an identified stroke lesion, 15 had a pontine lesion. Other lesion sites included the internal capsule. Marx and colleagues used MRI in a separate series of 49 patients with acute limb ataxia after isolated unilateral brainstem infarction. Limb ataxia accompanied by hemiparesis on the same side was associated with lesions of the ventromedial pontine base on the opposite side. These imaging studies leave the specific pontine nuclei and fibres involved unresolved.
      fr: Moulin et ses collègues ont étudié une série consécutive de 100 patients présentant une hémiparésie ataxique lors d’un premier AVC. Parmi les 77 patients dont la lésion vasculaire a été localisée, 15 avaient une lésion pontique. D’autres lésions siégeaient notamment dans la capsule interne. Dans une autre série, Marx et ses collègues ont étudié par IRM 49 patients présentant une ataxie aiguë des membres après un infarctus unilatéral isolé du tronc cérébral. L’ataxie des membres accompagnée d’une hémiparésie du même côté était associée à des lésions de la partie ventromédiale de la base du pont, du côté opposé aux signes. Les noyaux pontiques et les fibres précisément en cause restent indéterminés.
    deficit: ataxic-hemiparesis
    references: [corticopontine-motor, pontocerebellar-dissection, pontocerebellar-human-lobular-tractography, cerebellar-motor-loops, cortical-parcellation, clinical-moulin-1995, clinical-marx-2008]
    clinical_references: [clinical-moulin-1995, clinical-marx-2008]
    steps:
      - id: motor-cortex
        region: hcp-mmp:left:8
        source_name: L_4_ROI
        name: { en: Left primary motor cortex, fr: Cortex moteur primaire gauche }
        role: { en: Origin of corticopontine fibres, fr: Origine des fibres corticopontiques }
        explanation:
          en: In rhesus macaques, the corticopontine projection from the arm and hand region of primary motor cortex chiefly reaches pontine nuclei on the same side.
          fr: Chez le macaque rhésus, la représentation du bras et de la main dans le cortex moteur primaire projette principalement vers les noyaux pontiques du même côté.
        mapping:
          en: On this cortical surface, the HCP-MMP parcel approximates area 4. The arm and hand representation occupies part of the parcel.
          fr: Sur cette surface corticale, la parcelle HCP-MMP délimite approximativement l’aire 4. La représentation du bras et de la main en occupe une partie.
        view: left
        plane: axial
      - id: left-pons
        region: nextbrain:left:414
        source_name: pontine_nucleus
        name: { en: Left pontine nuclei, fr: Noyaux pontiques gauches }
        role: { en: Ipsilateral relay, fr: Relais ipsilatéral }
        explanation:
          en: Corticopontine fibres from the left motor cortex reach the left pontine nuclei. Pontocerebellar fibres emerging from these nuclei carry the branch towards the opposite cerebellum.
          fr: Les fibres corticopontiques du cortex moteur gauche atteignent les noyaux pontiques gauches. Les fibres pontocérébelleuses issues de ces noyaux prolongent cette branche vers le cervelet controlatéral.
        mapping:
          en: The NextBrain label groups the left pontine nuclei. Motor input reaches territories within this group.
          fr: L’étiquette NextBrain regroupe les noyaux pontiques gauches. Les afférences motrices atteignent certains territoires de cet ensemble.
        view: anterior
        plane: axial
      - id: right-pons
        region: nextbrain:right:10580
        source_name: pons
        tract: mcp
        name: { en: Right pontine territory, fr: Territoire pontique droit }
        role: { en: Passage after the pontine crossing, fr: Passage après la décussation pontique }
        explanation:
          en: These pontocerebellar fibres cross the midline within the ventral pons and travel rightwards into the right middle cerebellar peduncle.
          fr: Ces fibres pontocérébelleuses franchissent la ligne médiane dans la partie ventrale du pont et cheminent vers la droite jusqu’au pédoncule cérébelleux moyen droit.
        mapping:
          en: The broad NextBrain pons parcel locates the right side after the crossing. The highlighted tissue extends beyond the course of the transverse fibres.
          fr: La parcelle pontique de NextBrain repère le côté droit après la décussation. Le volume affiché dépasse le territoire des fibres transversales.
        view: anterior
        plane: axial
      - id: cerebellar-lobule-v
        region: learning:lobule-v-right
        source_name: Lobule V
        name: { en: Right cerebellar lobule V, fr: Lobule V droit du cervelet }
        role: { en: Cerebellar cortical target, fr: Cible corticale cérébelleuse }
        explanation:
          en: In tufted capuchins, transsynaptic tracing from the arm area of primary motor cortex labelled granule cells in the opposite cerebellar cortex, chiefly in lobules V and VI.
          fr: Chez le capucin brun, un traçage transsynaptique à partir de la représentation du bras dans le cortex moteur primaire a marqué des cellules granulaires du cortex cérébelleux controlatéral, principalement dans les lobules V et VI.
        mapping:
          en: The CerebNet label includes the right hemispheric lobule and its corresponding anterior vermis. The labelled granule cells in the capuchin study occupied parts of the lobule.
          fr: L’étiquette CerebNet inclut le lobule hémisphérique droit et la partie correspondante du vermis antérieur. Dans l’étude chez le capucin, les cellules granulaires marquées occupaient certaines parties du lobule.
        view: posterior
        plane: coronal
  - id: nigrostriatal
    name: { en: Nigrostriatal projection to the putamen, fr: Projection nigrostriée vers le putamen }
    summary:
      en: Follow the dopaminergic projection from the substantia nigra to a sensorimotor territory of the putamen.
      fr: Suivez la projection dopaminergique de la substance noire vers un territoire sensorimoteur du putamen.
    route:
      en: Left substantia nigra pars compacta → left putamen (dorsolateral postcommissural territory)
      fr: Pars compacta de la substance noire gauche → putamen gauche (territoire dorsolatéral postcommissural)
    scope:
      en: Tracing in long-tailed macaques identifies this branch. In post-mortem tissue from people with Parkinson’s disease, Yamada and colleagues identified part of the nigrostriatal tract near the internal capsule. The available atlas labels mark the origin and destination of this branch. The intervening fibres and other striatal targets, including the caudate, fall outside this tour.
      fr: Le traçage chez le macaque crabier identifie cette branche. À l’examen histologique post mortem de cerveaux de personnes atteintes de la maladie de Parkinson, Yamada et ses collègues ont repéré une partie du faisceau nigrostrié près de la capsule interne. Les étiquettes de l’atlas situent l’origine et la cible de cette branche. Le parcours laisse de côté les fibres entre ces deux repères et les autres cibles striatales, dont le noyau caudé.
    clinical:
      en: Fearnley and Lees examined post-mortem tissue from 20 people with Parkinson’s disease and compared it with tissue from controls. At the sampled caudal level of the pars compacta, pigmented neuron loss was greatest in the lateral part of the ventral tier. Counts came from one nigral section per person. Kordower and colleagues examined post-mortem tissue from 28 people with Parkinson’s disease and nine controls. In the available Parkinson’s samples at least four years after diagnosis, fibre staining for tyrosine hydroxylase and the dopamine transporter was very faint or absent in the dorsal postcommissural putamen and better preserved ventrally. The samples came from different people at different times after diagnosis. The decline in staining leaves the relative contributions of fibre loss and reduced marker expression unresolved.
      fr: Dans leur étude neuropathologique post mortem, Fearnley et Lees ont comparé 20 personnes atteintes de la maladie de Parkinson à des témoins. Au niveau caudal de la pars compacta étudié, la perte de neurones pigmentés était maximale dans la partie latérale de l’étage ventral. Le comptage reposait sur une coupe de la substance noire par personne. Kordower et ses collègues ont examiné les tissus post mortem de 28 personnes atteintes de la maladie de Parkinson et de neuf témoins. Dans les prélèvements disponibles de personnes décédées au moins quatre ans après le diagnostic, le marquage des fibres pour la tyrosine hydroxylase et le transporteur de la dopamine était très faible ou absent dans la portion dorsale du putamen postcommissural et mieux préservé dans sa portion ventrale. Les prélèvements provenaient de personnes distinctes, décédées à des délais différents après le diagnostic. La diminution du marquage laisse indéterminées les parts respectives de la perte de fibres et de la diminution de l’expression des marqueurs.
    deficit: parkinsonism
    references: [nigrostriatal-putamen-tracing, nigrostriatal-human-histology, clinical-fearnley-1991, clinical-kordower-2013]
    clinical_references: [clinical-fearnley-1991, clinical-kordower-2013]
    steps:
      - id: snc
        region: nextbrain:left:352
        source_name: substantia_nigra__compact_part
        name: { en: Left substantia nigra pars compacta · SNc, fr: Pars compacta de la substance noire gauche · SNc }
        role: { en: Origin of the dopaminergic projection, fr: Origine de la projection dopaminergique }
        explanation:
          en: In long-tailed macaques, retrograde tracing from the putamen labelled dopaminergic neurons in the dorsal and ventral tiers of the pars compacta on the same side.
          fr: Chez le macaque crabier, le traçage rétrograde depuis le putamen a marqué des neurones dopaminergiques dans les étages dorsal et ventral de la pars compacta du même côté.
        mapping:
          en: NextBrain shows the pars compacta as a single volume. The label does not distinguish the dorsal and ventral tiers.
          fr: NextBrain représente la pars compacta par un seul volume. L’étiquette ne distingue pas les étages dorsal et ventral.
        view: anterior
        plane: axial
      - id: putamen
        region: nextbrain:left:79
        source_name: putamen
        name: { en: Left putamen, fr: Putamen gauche }
        role: { en: Striatal target of the dopaminergic projection, fr: Cible striatale de la projection dopaminergique }
        explanation:
          en: The macaque tracing study sampled the dorsolateral postcommissural putamen, within the sensorimotor striatum.
          fr: Chez le macaque, le traçage a porté sur la partie dorsolatérale du putamen postcommissural, au sein du striatum sensorimoteur.
        mapping:
          en: The main NextBrain putamen parcel extends beyond the sampled dorsolateral postcommissural territory. NextBrain labels the posteroventral portion separately.
          fr: La parcelle principale du putamen de NextBrain s’étend au-delà du territoire dorsolatéral postcommissural étudié. NextBrain délimite séparément la portion postéroventrale.
        view: anterior
        plane: coronal
  - id: vestibular
    name: { en: Direct vestibular input to the cerebellar nodulus, fr: Afférences vestibulaires directes vers le nodule cérébelleux }
    summary:
      en: Follow a branch carrying balance signals from the left inferior cerebellar peduncle to the nodulus of the cerebellar vermis.
      fr: Suivez une branche qui transmet des signaux de l’équilibre du pédoncule cérébelleux inférieur gauche au nodule du vermis cérébelleux.
    route:
      en: Left inferior cerebellar peduncle (juxtarestiform body) → left side of the cerebellar nodulus (vermis X)
      fr: Pédoncule cérébelleux inférieur gauche (corps juxtarestiforme) → partie gauche du nodule cérébelleux (vermis X)
    scope:
      en: In nonhuman primates, this branch arises from the vestibular ganglion and stays on the same side. The peripheral course and brainstem entry precede the first landmark. In humans, Park and colleagues’ diffusion tractography estimated an ipsilateral course through the inferior cerebellar peduncle from a seed in the superior and medial vestibular nuclei at the level of the pons to a combined uvula–nodulus target. The streamlines leave the fibres’ cellular origin and exact endings unresolved. The tour omits parallel terminations in the ventral uvula and secondary projections from vestibular nuclei.
      fr: Chez les primates non humains, cette branche naît dans le ganglion vestibulaire et reste du même côté. Le trajet périphérique et l’entrée dans le tronc cérébral précèdent le premier repère. Chez l’humain, la tractographie par IRM de diffusion de Park et de ses collègues estime un trajet ipsilatéral passant par le pédoncule cérébelleux inférieur, depuis une région de départ située dans les noyaux vestibulaires supérieur et médial au niveau du pont jusqu’à une cible réunissant la luette cérébelleuse et le nodule. Cette reconstruction laisse indéterminées l’origine cellulaire et les terminaisons précises des fibres. Le parcours laisse de côté les terminaisons parallèles dans la partie ventrale de la luette cérébelleuse et les projections secondaires issues des noyaux vestibulaires.
    clinical:
      en: In Moon and colleagues’ MRI-based series, eight adults with isolated nodular infarcts had sudden vertigo and moderate to severe imbalance. Three infarcts were left-sided, three right-sided and two bilateral. In a separate series of six adults with isolated nodular infarcts, Lee and colleagues found five cases of acute vestibular syndrome and one case of episodic vertigo triggered by changes in position. The authors rated the overall video head-impulse responses normal in all six. One patient had mildly reduced angular vestibulo-ocular reflex gains on testing both horizontal semicircular canals. These series leave the contributions of individual fibre pathways unresolved.
      fr: Dans la série de Moon et de ses collègues, huit adultes atteints d’un infarctus isolé du nodule à l’IRM ont présenté un vertige soudain et un déséquilibre modéré à sévère. Trois infarctus étaient à gauche, trois à droite et deux bilatéraux. Dans une autre série de six adultes ayant un infarctus isolé du nodule, Lee et ses collègues ont relevé cinq syndromes vestibulaires aigus et un vertige épisodique déclenché par les changements de position. Les auteurs ont jugé globalement normales les réponses au test vidéo d’impulsion céphalique chez les six patients. Chez l’un d’eux, le gain du réflexe vestibulo-oculaire angulaire était légèrement diminué lors du test de chacun des deux canaux semi-circulaires horizontaux. La contribution propre à chaque faisceau reste indéterminée.
    deficit: cerebellar-vertigo
    references: [vestibular-primary-entry, vestibular-primary-termination, vestibular-human-tractography, vestibular-human-juxtarestiform-pathology, clinical-moon-2009, clinical-lee-nodular-2023]
    clinical_references: [clinical-moon-2009, clinical-lee-nodular-2023]
    steps:
      - id: inferior-peduncle
        region: learning:left:inferior-cerebellar-peduncle
        source_name: Inferior cerebellar peduncle
        tract: icp-left
        name: { en: Left inferior cerebellar peduncle, fr: Pédoncule cérébelleux inférieur gauche }
        role: { en: Entry of primary vestibular fibres into the cerebellum, fr: Entrée des fibres vestibulaires primaires dans le cervelet }
        explanation:
          en: Anatomical studies in nonhuman primates show that primary vestibular fibres enter the cerebellum through the juxtarestiform body. In one human autopsy, metastatic lesions involving the left juxtarestiform body and cerebellar tonsil accompanied partial degeneration of the left vestibular nerve root. The report leaves the destination of those fibres unresolved.
          fr: Les études anatomiques chez les primates non humains montrent que les fibres vestibulaires primaires pénètrent dans le cervelet par le corps juxtarestiforme. À l’autopsie d’un patient, des lésions métastatiques du corps juxtarestiforme et de la tonsille cérébelleuse à gauche s’accompagnaient d’une dégénérescence partielle de la racine du nerf vestibulaire gauche. La destination de ces fibres reste indéterminée.
        mapping:
          en: This teaching volume is NextBrain’s single parcel for the left inferior cerebellar peduncle, a broader landmark for the juxtarestiform body.
          fr: Ce volume pédagogique reprend la parcelle unique de NextBrain pour le pédoncule cérébelleux inférieur gauche, plus étendue que le corps juxtarestiforme.
        view: posterior
        plane: axial
      - id: nodulus
        region: learning:vermis-x
        source_name: Vermis X (nodulus)
        name: { en: Cerebellar nodulus, fr: Nodule cérébelleux }
        role: { en: Same-side target in the cerebellar cortex, fr: Cible du même côté dans le cortex cérébelleux }
        explanation:
          en: In nonhuman primates, primary vestibular fibres reach the nodulus on the same side and form mossy fibre endings in its granular layer.
          fr: Chez les primates non humains, les fibres vestibulaires primaires atteignent le nodule du même côté et y forment des terminaisons moussues dans la couche granulaire.
        mapping:
          en: A single midline CerebNet parcel marks the whole vermis X. The branch reaches its left side.
          fr: Une seule parcelle médiane de CerebNet représente l’ensemble du vermis X. La branche atteint sa partie gauche.
        view: inferior
        plane: sagittal
  - id: ventral-spinocerebellar
    name: { en: Ventral spinocerebellar input, fr: Afférences spinocérébelleuses ventrales }
    summary:
      en: Follow a branch traced in cats that ascends opposite its lumbar origin and reaches the anterior vermis on the side of origin after an inferred second crossing.
      fr: Suivez une branche décrite par traçage chez le chat. Elle remonte du côté opposé à son origine lombaire et gagne le vermis antérieur du côté d’origine après un second croisement déduit de ces données.
    route:
      en: Right cervical ventral spinocerebellar tract after the spinal crossing → right superior cerebellar peduncle → left lateral anterior vermis after an inferred cerebellar recrossing
      fr: Faisceau spinocérébelleux ventral droit après le croisement dans la moelle → pédoncule cérébelleux supérieur droit → partie latérale gauche du vermis antérieur après un second croisement déduit des traçages
    scope:
      en: The anterior vermal branch is based on tracing from lower lumbar spinal border cells in cats. The lumbar origin and spinal crossing lie below the cervical scan, which covers vertebral levels C1 through part of C5. The intervening brainstem course and the inferred second crossing are outside the displayed landmarks. This tour omits other terminal fields and routes through the inferior cerebellar peduncle.
      fr: Cette branche vers le vermis antérieur repose sur des traçages à partir des cellules bordantes de la moelle lombaire basse chez le chat. L’origine lombaire et le croisement spinal se situent sous le champ cervical de l’IRM, qui couvre les niveaux vertébraux de C1 jusqu’à une partie de C5. Le trajet intermédiaire dans le tronc cérébral et le second croisement déduit des traçages se situent hors des repères affichés. Le parcours laisse de côté les autres territoires de terminaison et les voies passant par le pédoncule cérébelleux inférieur.
    clinical:
      en: In a study of 90 people with cerebellar lesions, Schoch and colleagues analysed acute and chronic ischaemic and surgical groups separately. In the 21 adults examined after acute or subacute cerebellar ischaemia, the gait-ataxia association peaked in vermal lobule III and extended into vermal and paravermal white matter and the fastigial and interposed nuclei. The association with postural ataxia peaked in vermal white matter involving those nuclei. Gheihman and colleagues reported ataxic gait in a 65-year-old woman with a small infarct of the right superior vermis. These studies leave the effects of selective injury to these fibres unresolved.
      fr: Schoch et ses collègues ont étudié 90 personnes présentant des lésions cérébelleuses. Ils ont analysé séparément les groupes ischémiques et postopératoires, en phase aiguë et en phase chronique. Chez les 21 adultes examinés en phase aiguë ou subaiguë après une ischémie cérébelleuse, l’association avec l’ataxie de la marche culminait dans le lobule III du vermis et s’étendait à la substance blanche vermienne et paravermienne ainsi qu’aux noyaux fastigiaux et interposés. L’association avec l’ataxie posturale culminait dans la substance blanche vermienne, avec atteinte de ces mêmes noyaux. Gheihman et ses collègues ont décrit une marche ataxique chez une femme de 65 ans présentant un petit infarctus de la partie supérieure droite du vermis. Les effets d’une atteinte sélective de ces fibres restent indéterminés.
    deficit: ataxia
    references: [spinocerebellar-border-projections, spinocerebellar-peduncular-entry, spinocerebellar-cord-course, spinocerebellar-vermal-fields, spinocerebellar-macaque-peduncular-course, spinocerebellar-human-tractography, clinical-schoch-2006, clinical-gheihman-2023]
    clinical_references: [clinical-schoch-2006, clinical-gheihman-2023]
    steps:
      - id: cervical-tract
        region: pam50:right:ventral-spinocerebellar-tract
        source_name: right ventral spinocerebellar tract
        name: { en: Right cervical ventral spinocerebellar tract, fr: Faisceau spinocérébelleux ventral droit dans la moelle cervicale }
        role: { en: Spinal ascent after the first crossing, fr: Ascension spinale après le premier croisement }
        explanation:
          en: In cats, traced axons of lower lumbar spinal border cells ascended on the opposite side of the cord. In this illustrated branch, fibres from the left lumbar cord have crossed and ascend on the right.
          fr: Chez le chat, le traçage montre que les axones des cellules bordantes de la moelle lombaire basse montent du côté opposé de la moelle. Dans la branche illustrée, les fibres issues de la moelle lombaire gauche ont déjà croisé et montent à droite.
        mapping:
          en: The registered PAM50 label estimates the position of the right ventral spinocerebellar tract in the displayed cervical cord.
          fr: L’étiquette PAM50 recalée estime la position du faisceau spinocérébelleux ventral droit dans la moelle cervicale affichée.
        view: posterior
        plane: axial
      - id: superior-peduncle
        region: learning:right:superior-cerebellar-peduncle
        source_name: Superior cerebellar peduncle
        name: { en: Right superior cerebellar peduncle, fr: Pédoncule cérébelleux supérieur droit }
        role: { en: Cerebellar entry on the side of spinal ascent, fr: Entrée dans le cervelet du côté de l’ascension spinale }
        explanation:
          en: In cats, tracing indicates that these fibres enter mainly by way of the superior cerebellar peduncle on the side of spinal ascent. In macaques, a degeneration study followed the ventral spinocerebellar tract along the superomedial aspect of this peduncle to the cerebellum. For the cat branch shown here, the predominance of terminals on the side of the lumbar origin implies a second crossing in the cerebellum. A diffusion tractography study of four healthy volunteers used the superior peduncle as a tracking region and reconstructed a few streamlines crossing at the level of the cerebellum. Their cells of origin and terminal fields remain unresolved.
          fr: Chez le chat, le traçage indique que ces fibres entrent principalement par le pédoncule cérébelleux supérieur du côté où elles remontent dans la moelle. Chez le macaque, une étude de dégénérescence axonale a suivi le faisceau spinocérébelleux ventral le long du versant supéromédial de ce pédoncule jusqu’au cervelet. Pour la branche illustrée chez le chat, la prédominance des terminaisons du côté de l’origine lombaire permet d’inférer un second croisement dans le cervelet. Une étude de tractographie par IRM de diffusion chez quatre volontaires en bonne santé a utilisé le pédoncule supérieur comme région d’intérêt et reconstruit quelques trajectoires croisées au niveau du cervelet. L’origine cellulaire et les territoires de terminaison de ces trajectoires restent indéterminés.
        mapping:
          en: This teaching volume is NextBrain’s outline of the whole right peduncle and provides a landmark for the entry of these fibres.
          fr: Ce volume pédagogique reprend le contour de l’ensemble du pédoncule droit dans NextBrain, qui sert de repère pour l’entrée de ces fibres.
        view: posterior
        plane: coronal
      - id: anterior-vermis
        region: learning:lobules-i-iv-left
        source_name: Lobules I–IV
        name: { en: Left cerebellar lobules I–IV, fr: Lobules cérébelleux I à IV gauches }
        role: { en: Landmark for the lateral anterior vermal terminal field, fr: Repère du territoire de terminaison latéral du vermis antérieur }
        explanation:
          en: Cat tracing showed terminal fields in the lateral anterior vermis, including parts of lobules II–IV. The selected left-sided field is on the side of the lumbar origin, across the cerebellar midline from the right peduncle.
          fr: Chez le chat, le traçage a montré des territoires de terminaison dans la partie latérale du vermis antérieur, notamment dans des portions des lobules II à IV. Le territoire gauche retenu est du côté de l’origine lombaire, de l’autre côté de la ligne médiane cérébelleuse par rapport au pédoncule droit.
        mapping:
          en: The left CerebNet parcel combines hemispheric lobules I–IV with the corresponding part of the anterior vermis. It provides a broad human landmark for the field traced in cats.
          fr: La parcelle gauche de CerebNet réunit les lobules hémisphériques I à IV et la partie correspondante du vermis antérieur. Elle fournit un repère général chez l’humain pour le territoire décrit par traçage chez le chat.
        view: superior
        plane: coronal

  - id: entorhinal-ca1
    name: { en: Direct entorhinal input to CA1, fr: Afférences entorhinales directes vers CA1 }
    summary:
      en: Follow fibres from the left entorhinal cortex through the subiculum to caudal hippocampal field CA1.
      fr: Suivez les fibres du cortex entorhinal gauche jusqu’à la partie caudale du champ hippocampique CA1 en passant par le subiculum.
    route:
      en: Left entorhinal cortex → through the left caudal subiculum → left caudal CA1 (stratum lacunosum-moleculare landmark)
      fr: Cortex entorhinal gauche → traversée du subiculum caudal gauche → champ CA1 caudal gauche (repéré par le stratum lacunosum-moleculare)
    scope:
      en: The left-sided landmarks illustrate one branch of the perforant pathway. The angular bundle lies between the first two landmarks. Human polarized-light microscopy shows the local orientation of myelinated fibre bundles along the route. Macaque tracing establishes the entorhinal origin of the projection to CA1. The alvear route and branches to the dentate gyrus lie outside the tour.
      fr: Les repères à gauche illustrent une branche de la voie perforante. Le faisceau angulaire se situe entre les deux premiers repères. La microscopie en lumière polarisée montre l’orientation locale des faisceaux myélinisés dans des coupes humaines. Le traçage chez le macaque établit l’origine entorhinale de la projection vers CA1. La voie alvéaire et les branches vers le gyrus denté sont hors du parcours.
    clinical:
      en: R.B. developed marked, persistent anterograde amnesia after an ischaemic episode. Post-mortem examination showed extensive bilateral loss of CA1 pyramidal cells, with slight extension into the subiculum and CA3 in two caudal sections and small lesions elsewhere. Myelin staining showed an apparently preserved alveus and perforant fibres passing through CA1 to the dentate gyrus and CA3. G.D. had persistent anterograde amnesia with bilateral injury centred on CA1 and extending into the proximal subiculum. There was also possible very slight cell loss in layers III and V of the left entorhinal cortex and minor abnormalities elsewhere. The effects of a lesion confined to left CA1 or to this perforant branch remain unresolved.
      fr: Après un épisode ischémique, R.B. a présenté une amnésie antérograde marquée et persistante. L’examen post mortem a montré une perte étendue de cellules pyramidales de CA1 des deux côtés, avec une légère extension au subiculum et à CA3 sur deux coupes caudales ainsi que de petites lésions ailleurs. Les coupes colorées pour la myéline montraient un alvéus apparemment préservé et des fibres de la voie perforante traversant le champ CA1 vers le gyrus denté et le champ CA3. G.D. présentait une amnésie antérograde persistante et une atteinte bilatérale prédominant dans le champ CA1, avec une extension au subiculum proximal. Une très légère perte cellulaire était possible dans les couches III et V du cortex entorhinal gauche, et des anomalies mineures étaient présentes ailleurs. Les effets d’une lésion limitée au champ CA1 gauche ou à cette branche de la voie perforante restent indéterminés.
    deficit: amnesia
    references: [entorhinal-ca1-human-fibres, entorhinal-ca1-macaque-tracing, cortical-parcellation, clinical-zola-morgan-1986, clinical-rempel-clower-1996]
    clinical_references: [clinical-zola-morgan-1986, clinical-rempel-clower-1996]
    steps:
      - id: entorhinal
        region: hcp-mmp:left:118
        source_name: L_EC_ROI
        name: { en: Left entorhinal cortex, fr: Cortex entorhinal gauche }
        role: { en: Cortical origin of the projection, fr: Origine corticale de la projection }
        explanation:
          en: In macaques, tracing places the origin of the CA1 projection mainly in layers III and V of the entorhinal cortex. In the same study, lateral entorhinal regions projected to caudal parts of the recipient fields. Human polarized-light microscopy shows the orientation of fibres between the entorhinal cortex and the angular bundle.
          fr: Chez le macaque, le traçage situe l’origine de la projection vers CA1 principalement dans les couches III et V du cortex entorhinal. Dans la même étude, les régions latérales du cortex entorhinal projetaient vers les parties caudales des champs cibles. Dans des coupes humaines, la microscopie en lumière polarisée montre l’orientation des fibres entre le cortex entorhinal et le faisceau angulaire.
        mapping:
          en: The HCP-MMP surface parcel marks the entorhinal area as a whole.
          fr: La parcelle surfacique HCP-MMP représente l’aire entorhinale dans son ensemble.
        view: inferior
        plane: coronal
      - id: subiculum
        region: nextbrain:left:576
        source_name: caudal_subiculum
        name: { en: Left caudal subiculum, fr: Subiculum caudal gauche }
        role: { en: Passage of perforant fibres, fr: Passage des fibres de la voie perforante }
        explanation:
          en: Polarized light microscopy in human sections shows perforant fibre bundles crossing the subiculum toward hippocampal layers. The caudal subiculum marks part of this passage.
          fr: En microscopie en lumière polarisée, les coupes humaines montrent des faisceaux de la voie perforante qui traversent le subiculum vers les couches hippocampiques. Le subiculum caudal situe une partie de ce trajet.
        mapping:
          en: The NextBrain parcel shows the caudal subiculum as an anatomical region through which the fibres pass.
          fr: La parcelle NextBrain représente la région anatomique du subiculum caudal traversée par les fibres.
        view: right
        plane: coronal
      - id: ca1
        region: nextbrain:left:562
        source_name: stratum_lacunosum-moleculare_of_caudal_ca1
        name: { en: Stratum lacunosum-moleculare of left caudal CA1, fr: Stratum lacunosum-moleculare du champ CA1 caudal gauche }
        role: { en: Landmark within the receiving CA1 field, fr: Repère dans le champ cible CA1 }
        explanation:
          en: In a sagittal section of the right human hippocampus, perforant fibres in the tail curve through the stratum radiatum toward the CA1 pyramidal layer. A more anterior left coronal section shows a similar curve toward the CA fields. A more lateral sagittal section shows fibres running lengthwise in the CA1 stratum lacunosum-moleculare.
          fr: Dans une coupe sagittale de l’hippocampe droit chez l’humain, des fibres de la voie perforante décrivent un arc dans le stratum radiatum de la queue de l’hippocampe en direction de la couche pyramidale de CA1. Une coupe coronale gauche plus antérieure montre une courbure comparable vers les champs CA. Une coupe sagittale plus latérale montre des fibres longitudinales dans le stratum lacunosum-moleculare de CA1.
        mapping:
          en: NextBrain outlines one layer of caudal CA1 as a landmark in the recipient field. The microscopy leaves individual terminal sites unresolved.
          fr: NextBrain délimite une couche du champ CA1 caudal qui sert de repère dans le champ cible. La microscopie laisse indéterminés les sites de terminaison des axones individuels.
        view: right
        plane: coronal

  - id: stria-terminalis
    name: { en: Amygdalar output through the stria terminalis, fr: Efférences amygdaliennes par la strie terminale }
    summary:
      en: Follow the curved course of the stria terminalis from the left amygdala to the bed nucleus in the basal forebrain.
      fr: Suivez le trajet courbe de la strie terminale depuis l’amygdale gauche jusqu’au noyau du lit de la strie terminale du même côté, dans le prosencéphale basal.
    route:
      en: Left amygdala → left stria terminalis → left bed nucleus of the stria terminalis
      fr: Amygdale gauche → strie terminale gauche → noyau gauche du lit de la strie terminale
    scope:
      en: Dissection of human brains shows a continuous bundle between the amygdala and the bed nucleus. The tour follows it on the left. In cynomolgus macaques, fibres labelled by an injection centred on the central amygdalar nucleus travel through the stria terminalis and intermingle with ventral amygdalofugal fibres within the bed nucleus. The contribution of each route to the labelled terminal fields remains unresolved in that study. The tour leaves out the ventral amygdalofugal pathway and other targets.
      fr: La dissection de cerveaux humains montre la continuité du faisceau entre l’amygdale et le noyau du lit de la strie terminale. Le parcours suit le faisceau à gauche. Chez le macaque crabier, des fibres marquées par une injection centrée sur le noyau central de l’amygdale empruntent la strie terminale et se mêlent aux fibres de la voie amygdalofuge ventrale dans le noyau du lit. Dans cette étude, la part de chaque voie dans les champs de terminaison marqués reste indéterminée. Le parcours laisse de côté la voie amygdalofuge ventrale et les autres cibles.
    clinical:
      en: After herpes simplex encephalitis, three adults with bilateral anterior temporal damage were less accurate as a group than six healthy controls at labelling fear and sadness in photographs of faces. Their lesions involved both amygdalae, the hippocampal region and nearby temporal cortex. After nonherpetic encephalitis, only one of two adults with bilateral amygdalar and hippocampal damage scored significantly below healthy controls at identifying fear in both still and moving faces. In a study of 30 patients with acute right-hemisphere ischemic stroke, mean accuracy for fearful faces was 34%, compared with 54% in 30 healthy controls. The association with right amygdala damage was inconclusive. These studies leave unresolved how injury confined to the central amygdalar nucleus, stria terminalis or bed nucleus affects recognition of facial emotions.
      fr: Après une encéphalite herpétique, trois adultes présentant des lésions temporales antérieures bilatérales identifiaient en moyenne moins bien que six témoins sains la peur et la tristesse sur des photographies de visages. Leurs lésions touchaient les deux amygdales, la région hippocampique et le cortex temporal adjacent. Après une encéphalite non herpétique, un seul des deux adultes présentant des lésions bilatérales des amygdales et des hippocampes a obtenu des scores significativement inférieurs à ceux des témoins sains pour la reconnaissance de la peur sur des photographies comme sur des vidéos de visages. Dans une étude portant sur 30 patients ayant subi un AVC ischémique aigu de l’hémisphère droit, le taux moyen de bonnes réponses pour les visages exprimant la peur était de 34 %, contre 54 % chez 30 témoins sains. Le lien avec une lésion de l’amygdale droite restait incertain. Ces études laissent indéterminés les effets d’une lésion limitée au noyau central de l’amygdale, à la strie terminale ou au noyau du lit sur la reconnaissance des émotions faciales.
    deficit: emotion-recognition
    references: [stria-terminalis-primate-1981, stria-terminalis-human-histology-2017, stria-terminalis-human-dissection-2025, clinical-schmolck-2001, clinical-hayakawa-2010, clinical-tippett-2018]
    clinical_references: [clinical-schmolck-2001, clinical-hayakawa-2010, clinical-tippett-2018]
    steps:
      - id: amygdala
        region: nextbrain:left:277
        source_name: medial_subdivision_of_central_nucleus
        name: { en: Medial subdivision of the left central amygdalar nucleus, fr: Subdivision médiale du noyau central de l’amygdale gauche }
        role: { en: Landmark at the amygdalar origin, fr: Repère à l’origine amygdalienne }
        explanation:
          en: Serial sections matched to postmortem MRI in a human specimen show the stria terminalis at the caudal surface of the amygdala. In cynomolgus macaques, anterograde tracing from the central amygdalar nucleus labels fibres in the bundle.
          fr: Dans un cerveau humain, des coupes sériées comparées à l’IRM post mortem montrent la strie terminale à la face caudale de l’amygdale. Chez le macaque crabier, un traçage antérograde à partir du noyau central de l’amygdale marque des fibres dans le faisceau.
        mapping:
          en: NextBrain shows the medial subdivision as a landmark for the central nucleus. The macaque injection that labelled fibres in the stria terminalis covered most of the central nucleus.
          fr: NextBrain délimite la subdivision médiale, qui sert de repère pour le noyau central. Chez le macaque, l’injection qui a marqué des fibres de la strie terminale englobait la majeure partie du noyau central.
        view: right
        plane: coronal
      - id: stria
        region: nextbrain:left:184
        source_name: stria_terminalis
        name: { en: Left stria terminalis, fr: Strie terminale gauche }
        role: { en: Curved course through the forebrain, fr: Trajet courbe dans le prosencéphale }
        explanation:
          en: In human dissections, the bundle runs posteriorly from the amygdala on the medial side of the caudate tail. It ascends and follows the upper border of the thalamus anteriorly, then turns down towards the bed nucleus.
          fr: Dans les dissections de cerveaux humains, le faisceau se dirige vers l’arrière depuis l’amygdale en passant du côté médial de la queue du noyau caudé. Il remonte, longe le bord supérieur du thalamus vers l’avant, puis redescend vers le noyau du lit.
        mapping:
          en: NextBrain displays the stria terminalis as a segmented tissue volume.
          fr: NextBrain délimite la strie terminale sous la forme d’un volume tissulaire.
        view: right
        plane: coronal
      - id: bed-nucleus
        region: nextbrain:left:117
        source_name: bed_nucleus_of_stria_terminalis
        name: { en: Left bed nucleus of the stria terminalis, fr: Noyau gauche du lit de la strie terminale }
        role: { en: Destination in the basal forebrain, fr: Cible dans le prosencéphale basal }
        explanation:
          en: In human dissections, the stria terminalis reaches the posterolateral surface of the bed nucleus near the anterior commissure.
          fr: En dissection humaine, la strie terminale atteint la face postérolatérale du noyau du lit, à proximité de la commissure antérieure.
        mapping:
          en: NextBrain segments the bed nucleus as one volume. An injection centred on the central amygdalar nucleus labels several parts of the bed nucleus in cynomolgus macaques.
          fr: NextBrain délimite le noyau du lit en un seul volume. Chez le macaque crabier, une injection centrée sur le noyau central de l’amygdale a marqué plusieurs parties du noyau du lit.
        view: right
        plane: coronal

  - id: motion-mt-mst
    name: { en: Cortical visual motion pathway, fr: Voie corticale de la vision du mouvement }
    summary:
      en: Follow a branch for visual motion from primary visual cortex through areas MT and MST.
      fr: Suivez une branche corticale de la vision du mouvement, de V1 à MST en passant par MT.
    route:
      en: Right V1 → right MT (V5) → right MST
      fr: V1 droite → MT (V5) droite → MST droite
    scope:
      en: Tracing in macaques identifies two successive forward projections in the same hemisphere. The tour shows the right hemisphere using comparative landmarks from the human atlas. In adults with occipital stroke, diffusion tractography estimated streamlines passing through functionally defined V1 and MT regions in the affected hemisphere. The direction and precise course of the corresponding human projections remain unresolved in the cited human studies. The tour leaves out inputs to MT from V2 and V3, feedback projections and projections beyond MST.
      fr: Le traçage chez le macaque met en évidence deux projections successives qui remontent la hiérarchie visuelle dans le même hémisphère. Le parcours utilise les repères de l’atlas humain pour les situer dans l’hémisphère droit. Chez des adultes ayant subi un AVC occipital, la tractographie par IRM de diffusion a fourni une estimation des trajectoires passant par des régions de V1 et de MT repérées en IRM fonctionnelle dans l’hémisphère lésé. Le sens et le trajet précis des projections correspondantes restent indéterminés dans les études chez l’humain citées ici. Le parcours laisse de côté les afférences de V2 et V3 à MT, les projections en retour et les projections au-delà de MST.
    clinical:
      en: L.M. had a lasting impairment of visual motion perception after bilateral injury to the upper parts of the occipital gyri and the adjacent parts of the middle temporal gyri, with associated occipital and occipitoparietal white-matter changes. In a separate stroke case, T.D. had a larger right occipitotemporal infarct and a smaller left occipital infarct. Both overlapped a meta-analytic V5 map superimposed on structural MRI. The right lesion also involved part of the optic radiation. In a moving-dot task, T.D. correctly reported the direction on all 48 trials at each of the three slowest speeds (2, 4.5 and 9°/s) and on 25 of 48 trials at 15°/s. At 24°/s, she reported the opposite direction on 47 of 48 trials. A third patient still had motion blindness about five months after a postoperative right temporoparietal subcortical haemorrhage adjacent to an earlier infarct. In another lesion series, injury to posterior middle temporal cortex was associated with poorer discrimination of dot-motion direction. One patient whose lesions overlapped the left and right hMT+ template masks and spared the posterior superior temporal sulcus template masks had marked difficulty judging dot-motion direction. In a separate stroke cohort, no association between lesion location and performance on a motion-coherence task survived correction. The MT and MST parcels fell below the lesion-coverage threshold for the main analysis. The effects of damage confined to MT, MST or this branch remain unresolved.
      fr: L.M. a présenté un trouble durable de la perception visuelle du mouvement après des lésions bilatérales touchant la partie supérieure des gyrus occipitaux et la partie adjacente des gyrus temporaux moyens, avec des anomalies de la substance blanche occipitale et occipitopariétale. Dans un autre cas d’AVC, T.D. présentait un infarctus occipitotemporal droit plus étendu et un infarctus occipital gauche plus petit. Les deux lésions recoupaient une carte de V5 issue d’une méta-analyse et superposée à l’IRM anatomique. La lésion droite touchait aussi une partie des radiations optiques. Lors d’une épreuve avec des points en mouvement, T.D. a correctement indiqué le sens du déplacement lors des 48 essais à chacune des trois vitesses les plus faibles (2 °/s, 4,5 °/s et 9 °/s) et lors de 25 essais sur 48 à 15 °/s. À 24 °/s, elle a indiqué le sens opposé dans 47 essais sur 48. Chez un troisième patient, la cécité au mouvement persistait environ cinq mois après une hémorragie postopératoire dans la région sous-corticale temporopariétale droite, au voisinage d’un infarctus antérieur. Dans une autre série de patients, des lésions de la partie postérieure du cortex temporal moyen étaient associées à une moins bonne discrimination du sens de déplacement de points en mouvement. Chez l’un des patients, qui éprouvait une difficulté marquée à indiquer le sens du déplacement des points, les lésions recoupaient les masques de référence gauche et droit du complexe hMT+ et épargnaient ceux du sillon temporal supérieur postérieur. Dans une cohorte distincte de patients ayant subi un AVC, aucune association entre le site des lésions et les résultats à une épreuve de perception du mouvement cohérent n’a franchi le seuil statistique corrigé. Les lésions recouvraient trop rarement les parcelles MT et MST pour les inclure dans l’analyse principale. Les effets de lésions circonscrites à MT, à MST ou à cette branche restent indéterminés.
    deficit: akinetopsia
    references: [visual-motion-mt-tracing, visual-motion-mst-tracing, visual-motion-human-retinotopy, cortical-parcellation, visual-motion-v1-mt-human-tractography, clinical-zihl-1991, clinical-heutink-2019, clinical-otsuka-hirota-2014, clinical-prabhakar-motion-2025, clinical-lugtmeijer-2025]
    clinical_references: [clinical-zihl-1991, clinical-heutink-2019, clinical-otsuka-hirota-2014, clinical-prabhakar-motion-2025, clinical-lugtmeijer-2025]
    steps:
      - id: v1
        region: hcp-mmp:right:1
        source_name: R_V1_ROI
        name: { en: Right primary visual cortex (V1), fr: Cortex visuel primaire droit (V1) }
        role: { en: Origin of the direct projection to MT, fr: Origine de la projection directe vers MT }
        explanation:
          en: In macaques, retrograde tracing from MT labelled V1 neurons mainly in layer 4B, with a few in upper layer 6.
          fr: Chez le macaque, un traceur rétrograde injecté dans MT a marqué des neurones de V1, surtout dans la couche 4B et en petit nombre dans la partie supérieure de la couche 6.
        mapping:
          en: The HCP-MMP surface parcel represents the estimated boundaries of human V1.
          fr: La parcelle surfacique HCP-MMP représente les limites estimées de V1 chez l’humain.
        view: left
        plane: coronal
      - id: mt
        region: hcp-mmp:right:23
        source_name: R_MT_ROI
        name: { en: Right middle temporal visual area (MT or V5), fr: Aire visuelle temporale moyenne droite (MT ou V5) }
        role: { en: Recipient of V1 input and source of the MST projection, fr: Cible des afférences de V1 et origine de la projection vers MST }
        explanation:
          en: In macaques, tracers injected into MT labelled V1 neurons representing the same part of the visual field as the injection site. The injections also labelled projections from MT to MST.
          fr: Chez le macaque, les traceurs injectés dans MT ont marqué des neurones de V1 qui représentent la même portion du champ visuel que le site d’injection. Les injections ont aussi marqué des projections de MT vers MST.
        mapping:
          en: The HCP-MMP parcel marks MT within the human MT+ complex. Visual field mapping distinguishes MT from its neighbours.
          fr: La parcelle HCP-MMP situe MT au sein du complexe MT+ humain. La cartographie du champ visuel permet de distinguer MT des aires voisines.
        view: right
        plane: axial
      - id: mst
        region: hcp-mmp:right:2
        source_name: R_MST_ROI
        name: { en: Right medial superior temporal area (MST), fr: Aire temporale supérieure médiale droite (MST) }
        role: { en: Target of the projection from MT, fr: Cible de la projection issue de MT }
        explanation:
          en: In macaques, anterograde labelling from MT was densest in layer 4 of the sampled MST territory.
          fr: Chez le macaque, le marquage antérograde à partir de MT était le plus dense dans la couche 4 du territoire de MST étudié.
        mapping:
          en: HCP-MMP places MST just anterior to MT in the human MT+ complex. Human retinotopic mapping places a putative ventral MST area (pMSTv) immediately anterior to MT. The exact correspondence between the HCP-MMP parcel and macaque MST subdivisions remains uncertain.
          fr: HCP-MMP situe MST juste en avant de MT dans le complexe MT+ humain. La cartographie rétinotopique chez l’humain situe une aire ventrale présumée de MST (pMSTv) juste en avant de MT. La correspondance précise entre la parcelle HCP-MMP et les subdivisions de MST chez le macaque reste incertaine.
        view: right
        plane: axial

  - id: colour
    name: { en: Ventral visual branch to V4, fr: Branche visuelle ventrale vers V4 }
    summary:
      en: Follow a branch of the ventral visual stream from V1 through V2 to V4 and see how tracer studies in macaques identify each projection.
      fr: Suivez une branche de la voie visuelle ventrale de V1 à V4 en passant par V2 et voyez comment les études de traçage chez le macaque ont mis en évidence chaque projection.
    route:
      en: Right V1 → right V2 → right V4
      fr: V1 droite → V2 droite → V4 droite
    scope:
      en: The branch combines projections traced separately in macaque cortex representing central vision. The two projections meet at the level of the V2 thin-stripe compartment. The right-hemisphere parcels in the human atlas show whole cortical areas. The route stops at V4 and leaves out feedback and onward projections to temporal cortex.
      fr: Cette branche réunit des projections tracées séparément dans les régions du cortex du macaque qui représentent le champ visuel central. Les deux projections se rejoignent au niveau des bandes fines de V2. Les parcelles de l’hémisphère droit de l’atlas humain délimitent des aires corticales entières. Le parcours s’arrête à V4 et laisse de côté les rétroprojections et les projections vers le cortex temporal.
    clinical:
      en: Bouvier and Engel reviewed 92 published cases of acquired achromatopsia. The lesion maps for 46 of these cases showed a small region of high overlap in ventral occipital cortex. An erratum corrects the coordinates of two small foci affected in 8 of 11 mapped cases with intact face recognition. Most reports with detailed psychophysical testing of spatial vision described additional deficits. In a separate cohort recruited by lesion location, Munk and colleagues analysed 63 patients with posterior cerebral artery stroke. Fourteen patients scored significantly worse than the 45 controls on the Farnsworth D-15 colour-sorting test. This included 9 of 32 patients with left-hemisphere lesions, 1 of 22 with right-hemisphere lesions and 4 of 9 with bilateral lesions. An exploratory stepwise regression using lesion measurements from selected regions and tracts in the posterior cerebral artery territory associated poorer scores with damage to the left occipital fusiform gyrus and the left temporo-occipital portion of the inferior temporal gyrus, among other predictors. With free binocular viewing, the test could not establish whether the colour deficits affected part or all of the visual field. The contribution of the specific connections shown in this tour remains unresolved.
      fr: Bouvier et Engel ont recensé 92 cas publiés d’achromatopsie acquise. La cartographie des lésions de 46 de ces cas a révélé une petite région de fort chevauchement dans le cortex occipital ventral. Un erratum corrige les coordonnées de deux petits foyers lésés dans 8 des 11 cas cartographiés où la reconnaissance des visages était préservée. La plupart des publications qui comprenaient des tests psychophysiques approfondis de la vision spatiale décrivaient des déficits supplémentaires. Dans une autre cohorte recrutée selon le siège de la lésion, Munk et ses collègues ont analysé les données de 63 patients ayant subi un AVC dans le territoire de l’artère cérébrale postérieure. Quatorze patients ont obtenu des scores significativement moins bons que ceux des 45 témoins au test de classement de pastilles colorées de Farnsworth D-15. Ces scores concernaient 9 des 32 patients présentant une lésion de l’hémisphère gauche, 1 des 22 présentant une lésion de l’hémisphère droit et 4 des 9 présentant des lésions bilatérales. Une régression exploratoire par sélection pas à pas utilisant des mesures lésionnelles dans des régions et des faisceaux présélectionnés du territoire de l’artère cérébrale postérieure a associé les moins bons scores à des lésions du gyrus fusiforme occipital gauche et de la portion temporo-occipitale du gyrus temporal inférieur gauche, parmi les facteurs retenus. Le test se déroulait en vision binoculaire libre et ne permettait pas d’établir si les déficits de la vision des couleurs touchaient une partie ou la totalité du champ visuel. La contribution propre des connexions illustrées dans ce parcours reste indéterminée.
    deficit: achromatopsia
    references: [visual-v1-v2-tracing, visual-v2-v4-retrograde, visual-v2-v4-anterograde, visual-v4-retinotopy, cortical-parcellation, clinical-bouvier-2006, clinical-munk-colour-stroke-2023]
    clinical_references: [clinical-bouvier-2006, clinical-munk-colour-stroke-2023]
    steps:
      - id: v1
        region: hcp-mmp:right:1
        source_name: R_V1_ROI
        name: { en: Right primary visual cortex, fr: Cortex visuel primaire droit }
        role: { en: Cortical source of input to V2, fr: Origine corticale des projections vers V2 }
        explanation:
          en: In macaques, retrograde tracers placed in thin stripes of V2 labelled neurons in V1 patches rich in cytochrome oxidase.
          fr: Chez le macaque, des traceurs rétrogrades déposés dans les bandes fines de V2 ont marqué des neurones dans des îlots de V1 riches en cytochrome oxydase.
        mapping:
          en: HCP-MMP shows the whole right V1 parcel around the calcarine sulcus. The patches supplying the thin stripes are finer divisions identified in macaque tissue.
          fr: HCP-MMP montre l’ensemble de la parcelle V1 droite autour du sillon calcarin. Les îlots qui projettent vers les bandes fines sont des subdivisions plus petites repérées dans le tissu cortical du macaque.
        view: left
        plane: coronal
      - id: v2
        region: hcp-mmp:right:4
        source_name: R_V2_ROI
        name: { en: Right visual area V2, fr: Aire visuelle V2 droite }
        role: { en: Link through V2 thin stripes, fr: Relais par les bandes fines de V2 }
        explanation:
          en: In the macaque representation of central vision, some neurons in V2 thin stripes send axons to V4. An anterograde tracer injected into a thin stripe labelled axons in V4.
          fr: Dans la représentation du champ visuel central chez le macaque, certains neurones des bandes fines de V2 envoient des axones vers V4. Un traceur antérograde injecté dans une bande fine a marqué des axones dans V4.
        mapping:
          en: The parcel covers the superior and inferior parts of human V2. The thin stripes are subdivisions within macaque V2, below the atlas scale.
          fr: La parcelle couvre les parties supérieure et inférieure de V2 chez l’humain. Les bandes fines sont des subdivisions de V2 chez le macaque, plus petites que les parcelles de l’atlas.
        view: left
        plane: coronal
      - id: v4
        region: hcp-mmp:right:6
        source_name: R_V4_ROI
        name: { en: Right visual area V4, fr: Aire visuelle V4 droite }
        role: { en: Extrastriate target of projections from V2, fr: Cible extrastriée des projections de V2 }
        explanation:
          en: In macaques, some parts of V4 receive input from both the thin stripes and the pale regions between stripes in V2.
          fr: Chez le macaque, certaines parties de V4 reçoivent des projections des bandes fines de V2 et des zones pâles qui séparent les bandes.
        mapping:
          en: The inferior part of HCP-MMP V4 substantially overlaps hV4 as mapped by retinotopic fMRI in humans. The full parcel includes a superior part that overlaps several other areas in the same retinotopic map.
          fr: La partie inférieure de V4 dans HCP-MMP recouvre largement hV4, délimitée par cartographie rétinotopique en IRM fonctionnelle chez l’humain. La parcelle entière comprend aussi une partie supérieure qui chevauche plusieurs autres aires de cette même carte rétinotopique.
        view: inferior
        plane: coronal

  - id: transcallosal-sma
    name: { en: Callosal pathway between supplementary motor areas, fr: Voie calleuse entre les aires motrices supplémentaires }
    summary:
      en: Follow the route from the left caudal supplementary motor area (SMA proper) across the corpus callosum to its right counterpart.
      fr: Suivez, à travers le corps calleux, la branche qui relie la partie caudale de l’aire motrice supplémentaire (AMS) gauche à son homologue dans l’hémisphère droit.
    route:
      en: Left caudal supplementary motor area → corpus callosum (midline crossing) → right caudal supplementary motor area
      fr: Partie caudale de l’aire motrice supplémentaire gauche → corps calleux (passage de la ligne médiane) → partie caudale de l’aire motrice supplémentaire droite
    scope:
      en: The tour leaves out the pre-SMA’s callosal projections and the SMA’s connections with other motor areas. Human dissection shows the gross course of fibres from the supplementary motor complex. Human diffusion tractography estimates paths between the caudal SMA regions, and macaque tracing shows connections of the hand representation.
      fr: Le parcours laisse de côté les projections calleuses de la pré-AMS et les connexions de l’AMS avec d’autres aires motrices. La dissection chez l’humain montre le trajet macroscopique des fibres du complexe moteur supplémentaire. La tractographie de diffusion chez l’humain permet d’estimer des trajets entre les deux AMS caudales, et le traçage chez le macaque montre les connexions de la représentation de la main.
    clinical:
      en: In one woman, CT showed an infarct extending from the junction of the genu and body through much of the callosal body. Ten months after onset, she had severe left-hand ideomotor apraxia affecting gestures on command, imitation and object use. She performed those tasks normally with the right hand. In three adults tested after complete callosotomy, errors were more frequent with the left hand when they mimed using objects they were shown. When handling the objects, they performed the appropriate actions with either hand, with some execution errors. Complete callosotomy interrupted many pathways, and some patients also had extracallosal damage. The contribution of this specific SMA branch remains unresolved.
      fr: Chez une patiente, la TDM montrait un infarctus qui partait de la jonction entre le genou et le tronc du corps calleux et occupait une grande partie du tronc. Dix mois après le début des symptômes, elle présentait une apraxie idéomotrice sévère de la main gauche lors des gestes sur consigne, de l’imitation et de l’utilisation d’objets. Elle réalisait normalement ces tâches de la main droite. Chez trois adultes examinés après une callosotomie complète, les erreurs étaient plus fréquentes de la main gauche lorsqu’ils mimaient l’utilisation des objets présentés. Avec les objets en main, ils réalisaient les gestes appropriés de l’une ou l’autre main, avec quelques erreurs d’exécution. La callosotomie complète avait interrompu de nombreuses voies et certains patients présentaient aussi des lésions extracalleuses. La contribution propre de cette branche entre les deux AMS reste indéterminée.
    deficit: callosal-apraxia
    references: [sma-callosal-vergani-2014, sma-callosal-bozkurt-2017, sma-callosal-ruddy-2017, sma-callosal-xiong-2024, sma-callosal-rouiller-1994, cortical-parcellation, clinical-rothi-callosal-followup-1985, clinical-lausberg-callosotomy-2003]
    clinical_references: [clinical-rothi-callosal-followup-1985, clinical-lausberg-callosotomy-2003]
    steps:
      - id: left-sma-proper
        region: hcp-mmp:left:55
        source_name: L_6mp_ROI
        name: { en: Left caudal supplementary motor area, fr: Partie caudale de l’aire motrice supplémentaire gauche }
        role: { en: Cortical origin of the branch, fr: Origine corticale de la branche }
        explanation:
          en: Human dissections show fibres between SMA proper, the caudal part of the supplementary motor complex, and the corpus callosum. In macaques, retrograde tracer injected into the hand representation of one SMA labelled neurons in the opposite SMA.
          fr: La dissection chez l’humain montre des fibres entre l’AMS proprement dite, qui forme la partie caudale du complexe moteur supplémentaire, et le corps calleux. Chez le macaque, l’injection d’un traceur rétrograde dans la représentation de la main d’une AMS a marqué des neurones dans l’AMS opposée.
        mapping:
          en: HCP-MMP area 6mp overlaps the caudal SMA on the medial surface and extends onto the superolateral surface. The landmark shows the whole cortical parcel.
          fr: L’aire 6mp du HCP-MMP recouvre en partie l’AMS caudale sur la face médiale et se prolonge sur la face supérolatérale. Le repère montre la parcelle corticale entière.
        view: right
        plane: coronal
      - id: corpus-callosum
        region: learning:corpus-callosum
        source_name: Corpus callosum
        name: { en: Corpus callosum, fr: Corps calleux }
        role: { en: Midline crossing of the fibres, fr: Franchissement de la ligne médiane }
        explanation:
          en: Here the branch crosses from the left hemisphere to the right. In one human dissection series, fibres from both the pre-SMA and the SMA proper converged on the rostrum and anterior callosal body. Human diffusion tractography estimated paths passing through the regions defined as caudal SMA on both sides. A group diffusion tractography atlas mapped the midline crossings of reconstructed streamlines linking the two HCP-MMP 6mp parcels. The voxel where these crossings were reconstructed in the highest proportion of participants lay in the posterior midbody, as defined by Witelson.
          fr: La branche franchit ici la ligne médiane de l’hémisphère gauche vers le droit. Dans une série de dissections chez l’humain, les fibres de la pré-AMS et de l’AMS proprement dite convergeaient vers le rostre et la partie antérieure du tronc du corps calleux. La tractographie de diffusion chez l’humain a permis d’estimer des trajets passant par la région définie comme AMS caudale dans chaque hémisphère. Un atlas de groupe établi par tractographie de diffusion a cartographié le passage médian des trajectoires reconstruites entre les deux parcelles 6mp du HCP-MMP. Le voxel où un tel passage a été retrouvé chez la plus grande proportion de participants se situait dans la partie postérieure du tronc calleux selon le découpage de Witelson.
        mapping:
          en: The teaching label combines the five FreeSurfer callosal regions to mark the midline passage at the scale of the corpus callosum.
          fr: Le repère réunit les cinq subdivisions calleuses de FreeSurfer et situe le passage médian à l’échelle du corps calleux.
        view: right
        plane: sagittal
      - id: right-sma-proper
        region: hcp-mmp:right:55
        source_name: R_6mp_ROI
        name: { en: Right caudal supplementary motor area, fr: Partie caudale de l’aire motrice supplémentaire droite }
        role: { en: Contralateral cortical target, fr: Cible corticale controlatérale }
        explanation:
          en: In macaques, an anterograde tracer injected into the hand representation of one SMA labelled axon terminals widely distributed in the opposite SMA.
          fr: Chez le macaque, l’injection d’un traceur antérograde dans la représentation de la main d’une AMS a marqué des terminaisons axonales réparties sur une grande partie de l’AMS opposée.
        mapping:
          en: The right 6mp parcel marks the contralateral caudal SMA at the scale of a cortical area. The full parcel includes the superolateral extension of area 6mp.
          fr: La parcelle 6mp droite situe l’AMS caudale controlatérale à l’échelle d’une aire corticale. Elle comprend le prolongement supérolatéral de l’aire 6mp.
        view: left
        plane: coronal

  - id: piriform-orbitofrontal
    name: { en: Piriform–orbitofrontal olfactory pathway, fr: Voie olfactive piriforme–orbitofrontale }
    summary:
      en: Use two right-sided landmarks to follow the direct olfactory projection traced from the piriform cortex to orbitofrontal area 13a in macaques.
      fr: Suivez, à l’aide de deux repères dans l’hémisphère droit, la projection olfactive directe que le traçage a mise en évidence chez le macaque entre le cortex piriforme et l’aire orbitofrontale 13a.
    route:
      en: Right piriform cortex → right posterior orbitofrontal cortex
      fr: Cortex piriforme droit → cortex orbitofrontal postérieur droit
    scope:
      en: The tour starts downstream of the olfactory bulb and lateral olfactory tract and covers one of several piriform projections. The two human atlas parcels approximate the origin and target of the branch traced in macaques. The exact course and endings of the projection in humans remain unresolved.
      fr: Le parcours débute en aval du bulbe et du tractus olfactif latéral et suit l’une des projections du cortex piriforme. Les deux parcelles de l’atlas humain situent approximativement l’origine et la cible de la branche tracée chez le macaque. Le trajet précis et les terminaisons de cette projection chez l’humain restent indéterminés.
    clinical:
      en: In one surgical series, recognition of previously presented odours was impaired after right orbitofrontal or right temporal excision. In a separate lesion study, patients with medial orbitofrontal involvement scored lower on a forced-choice odour identification test than patients with frontal lesions sparing that region and healthy controls. The analysis excluded two patients with olfactory nerve or bulb damage and adjusted for age and nonverbal IQ. Adults with unilateral temporal lobe epilepsy scored lower overall than matched controls on odour identification and on matching odours after delays of 10 to 60 seconds. In the subsets tested before and after anterior temporal resection, scores on both tests fell overall after surgery. The extent of the lesions and resections leaves the contributions of area 13a and this projection unresolved.
      fr: Dans une série chirurgicale, la reconnaissance d’odeurs déjà présentées était altérée après une exérèse orbitofrontale droite ou temporale droite. Dans une autre étude, les patients dont la lésion touchait le cortex orbitofrontal médial obtenaient des scores inférieurs à ceux des patients dont la lésion frontale épargnait cette région et à ceux des témoins sains à une épreuve d’identification des odeurs à choix forcé. L’analyse excluait deux patients présentant une lésion du nerf ou du bulbe olfactif et tenait compte de l’âge et du QI non verbal. Chez les adultes atteints d’épilepsie temporale unilatérale, les scores d’identification des odeurs et d’appariement après un délai de 10 à 60 secondes étaient globalement inférieurs à ceux des témoins appariés. Dans les sous-groupes évalués avant et après résection temporale antérieure, les scores aux deux épreuves ont globalement diminué après l’intervention. L’étendue des lésions et des résections laisse indéterminées les contributions de l’aire 13a et de cette projection.
    deficit: olfactory-recognition
    references: [olfactory-piriform-orbitofrontal-tracing, cortical-parcellation, olfactory-orbitofrontal-human-architecture, olfactory-memory, olfactory-medial-orbitofrontal-identification, olfactory-temporal-resection]
    clinical_references: [olfactory-memory, olfactory-medial-orbitofrontal-identification, olfactory-temporal-resection]
    steps:
      - id: piriform
        region: hcp-mmp:right:110
        source_name: R_Pir_ROI
        name: { en: Right piriform cortex, fr: Cortex piriforme droit }
        role: { en: Cortical origin of the projection, fr: Origine corticale de la projection }
        explanation:
          en: In macaques, an anterograde tracer injection confined to the anterior piriform cortex just behind the limen insulae labelled fibres in the caudal orbital cortex.
          fr: Chez le macaque, une injection de traceur antérograde limitée au cortex piriforme antérieur, juste en arrière du seuil de l’insula, a marqué des fibres dans le cortex orbital caudal.
        mapping:
          en: HCP-MMP locates Pir at the limen insulae and identifies it as a likely region of piriform cortex. The parcel provides an approximate human landmark for the origin traced in macaques.
          fr: Au seuil de l’insula, la parcelle Pir de HCP-MMP correspond vraisemblablement au cortex piriforme. Elle situe approximativement chez l’humain l’origine de la projection tracée chez le macaque.
        view: inferior
        plane: coronal
      - id: posterior-orbitofrontal
        region: hcp-mmp:right:166
        source_name: R_pOFC_ROI
        name: { en: Right posterior orbitofrontal cortex, fr: Cortex orbitofrontal postérieur droit }
        role: { en: Cortical target of piriform fibres, fr: Cible corticale des fibres piriformes }
        explanation:
          en: In macaques, a retrograde tracer injection in orbitofrontal area 13a labelled neurons in the anterior piriform cortex.
          fr: Chez le macaque, une injection de traceur rétrograde dans l’aire orbitofrontale 13a a marqué des neurones du cortex piriforme antérieur.
        mapping:
          en: The human HCP-MMP posterior orbitofrontal complex overlaps areas 13a and 14c. It provides a broader landmark for area 13a, a small field in the olfactory sulcus near the attachment of the olfactory stalk.
          fr: Le complexe orbitofrontal postérieur de HCP-MMP chevauche les aires 13a et 14c décrites chez l’humain. Il sert de repère plus large pour l’aire 13a, un petit territoire du sillon olfactif près de l’attache du pédoncule olfactif.
        view: inferior
        plane: coronal

  - id: schaffer-collaterals
    name: { en: Schaffer collaterals from CA3 to CA1, fr: Collatérales de Schaffer de CA3 vers CA1 }
    summary:
      en: Follow the Schaffer collaterals from their origin in CA3 to a receiving layer of CA1 in the left hippocampus.
      fr: Suivez les collatérales de Schaffer depuis leur origine dans le champ CA3 jusqu’à une couche du champ CA1 qui les reçoit dans l’hippocampe gauche.
    route:
      en: Left rostral CA3 (stratum pyramidale) → left rostral CA1 (stratum radiatum)
      fr: Champ CA3 rostral gauche (stratum pyramidale) → champ CA1 rostral gauche (stratum radiatum)
    scope:
      en: The tour focuses on one receiving layer in rostral CA1. It omits the upstream mossy-fibre input from the dentate gyrus to CA3. Macaque tracing shows Schaffer collateral terminals in the CA1 pyramidal layer and stratum oriens as well, with projections extending farther along the hippocampus. Post-mortem diffusion tractography of right human hippocampi estimated trajectories in the pyramidal cell layer that the authors interpreted as Schaffer collaterals. These estimates leave the direction and precise terminations of the human rostral projection unresolved.
      fr: Le parcours se limite à une couche cible du champ CA1 rostral. Il laisse de côté les afférences des fibres moussues du gyrus denté vers CA3. Chez le macaque, le traçage met aussi en évidence des terminaisons des collatérales de Schaffer dans la couche pyramidale et le stratum oriens de CA1, ainsi que des projections qui s’étendent plus loin le long de l’hippocampe. La tractographie par IRM de diffusion sur des hippocampes droits humains prélevés post mortem a estimé des trajectoires dans la couche pyramidale que les auteurs ont interprétées comme des collatérales de Schaffer. Ces estimations laissent indéterminés le sens et les terminaisons précises de la projection rostrale chez l’humain.
    clinical:
      en: R.B. developed persistent anterograde amnesia after an ischaemic episode. Post-mortem examination showed extensive loss of pyramidal cells in CA1 on both sides, with minor damage elsewhere. A later series described comparable anterograde amnesia in G.D., whose bilateral injury centred on CA1 and extended into the proximal subiculum. In a separate study of adults with chronic amnesia after autoimmune limbic encephalitis, 7 T MRI showed that mean CA3 volume, pooled across both hippocampi, was 29% lower in the 15 patients with usable segmentations than in 15 controls. The smaller mean CA1 difference did not reach statistical significance after correction for multiple comparisons. On an autobiographical interview, the 16 tested patients recalled fewer event-specific details than 16 controls across the previous year and three earlier periods from age 11 onward. The effects of injury confined to the left CA1 stratum radiatum or to the Schaffer collaterals remain unresolved.
      fr: R.B. a présenté une amnésie antérograde persistante après un épisode ischémique. L’examen post mortem a montré une perte étendue de cellules pyramidales de CA1 des deux côtés, ainsi que des lésions mineures ailleurs. Dans une série ultérieure, G.D. présentait une amnésie antérograde comparable et une atteinte bilatérale prédominant dans le champ CA1, avec une extension au subiculum proximal. Dans une autre étude portant sur des adultes présentant une amnésie chronique après une encéphalite limbique auto-immune, l’IRM à 7 T a montré que, chez les 15 patients dont la segmentation était exploitable, le volume moyen de CA3 calculé en regroupant les deux hippocampes était inférieur de 29 % à celui des 15 témoins. La différence moyenne pour CA1, plus faible, restait sous le seuil de signification après correction pour comparaisons multiples. Lors d’un entretien autobiographique, les 16 patients testés ont rapporté moins de détails propres aux événements que 16 témoins pour l’ensemble des souvenirs de l’année précédente et des trois périodes antérieures étudiées à partir de 11 ans. Les effets d’une lésion limitée au stratum radiatum du champ CA1 gauche ou aux collatérales de Schaffer restent indéterminés.
    deficit: amnesia
    references: [schaffer-macaque-ca3-tracing, entorhinal-ca1-human-fibres, ca1-subiculum-modo-human-diffusion, clinical-zola-morgan-1986, clinical-rempel-clower-1996, clinical-miller-ca3-amnesia-2020]
    clinical_references: [clinical-zola-morgan-1986, clinical-rempel-clower-1996, clinical-miller-ca3-amnesia-2020]
    steps:
      - id: ca3-pyramidal-layer
        region: nextbrain:left:420
        source_name: stratum_pyramidale_of_rostral_ca3
        name: { en: Pyramidal layer of left rostral CA3, fr: Couche pyramidale du champ CA3 rostral gauche }
        role: { en: Origin of the Schaffer collaterals, fr: Origine des collatérales de Schaffer }
        explanation:
          en: In macaques, anterograde tracer injections involving the pyramidal layer of rostral CA3 labelled fibres and terminals in the stratum radiatum of rostral CA1. Some injections also included adjacent dentate tissue.
          fr: Chez le macaque, des injections de traceur antérograde intéressant la couche pyramidale du champ CA3 rostral ont marqué des fibres et des terminaisons dans le stratum radiatum du champ CA1 rostral. Certains sites d’injection englobaient aussi une partie du gyrus denté adjacent.
        mapping:
          en: NextBrain outlines the pyramidal cell layer of left rostral CA3. The layer marks the origin of the projection at the scale of the atlas.
          fr: NextBrain délimite la couche des cellules pyramidales du champ CA3 rostral gauche. Cette couche situe l’origine de la projection à l’échelle de l’atlas.
        view: right
        plane: coronal
      - id: ca1-stratum-radiatum
        region: nextbrain:left:344
        source_name: stratum_radiatum_of_rostral_ca1
        name: { en: Stratum radiatum of left rostral CA1, fr: Stratum radiatum du champ CA1 rostral gauche }
        role: { en: One receiving layer of the CA3 projection, fr: Une des couches cibles de la projection issue de CA3 }
        explanation:
          en: In the human hippocampal body, polarized-light microscopy shows a band of fibres along the stratum radiatum between CA3 and CA1. The authors interpret it as the likely counterpart of the Schaffer collaterals. Some fibres of the endfolial pathway appear to follow the same local course as this band. The microscopy shows fibre orientation. The direction shown here comes from macaque tracing.
          fr: Dans le corps de l’hippocampe humain, la microscopie en lumière polarisée montre une bande de fibres entre CA3 et CA1, le long du stratum radiatum. Les auteurs y voient l’équivalent probable des collatérales de Schaffer. Certaines fibres de la voie endofoliale semblent suivre localement le même trajet. La microscopie renseigne sur l’orientation des fibres. Le sens de la projection est tiré du traçage chez le macaque.
        mapping:
          en: NextBrain outlines the stratum radiatum of left rostral CA1. This human parcel marks one layer in which Schaffer collaterals terminate in macaques.
          fr: NextBrain délimite le stratum radiatum du champ CA1 rostral gauche. Cette parcelle humaine situe l’une des couches où se terminent les collatérales de Schaffer chez le macaque.
        view: right
        plane: coronal

  - id: navigation
    name: { en: Retrosplenial pathway to the presubiculum, fr: Voie rétrospléniale vers le présubiculum }
    summary:
      en: Follow two projections traced in macaques. One runs from posterior parahippocampal area TF to retrosplenial area 30 and the other from area 30 to the posterior presubiculum.
      fr: Suivez deux projections mises en évidence par traçage chez le macaque. La première relie l’aire TF du cortex parahippocampique postérieur à l’aire 30 du cortex rétrosplénial. La seconde relie l’aire 30 à la partie postérieure du présubiculum.
    route:
      en: Right posterior parahippocampal cortex → right retrosplenial area 30 → right presubiculum
      fr: Cortex parahippocampique postérieur droit → aire 30 du cortex rétrosplénial droit → présubiculum droit
    scope:
      en: The right-sided human landmarks illustrate two projections traced in different macaque species. The projections share area 30 at the scale of cortical areas. The exact overlap of their territories within area 30 and the involvement of the same relay neurons remain unresolved. The tour ends in the presubiculum. Reciprocal projections and other targets of area 30 lie outside this branch.
      fr: Les repères humains de l’hémisphère droit illustrent deux projections étudiées par traçage chez deux espèces de macaques. Les deux projections ont en commun l’aire 30 du cortex rétrosplénial. Le chevauchement précis de leurs territoires dans cette aire et la participation des mêmes neurones relais restent indéterminés. Le parcours s’arrête au présubiculum. Les projections réciproques et les autres cibles de l’aire 30 sont hors de cette branche.
    clinical:
      en: After small haemorrhages extending from the right retrosplenial region into the medial parietal lobe, three patients recognised familiar buildings and landscapes and had difficulty recalling directions between familiar places. In a separate case, a patient with a right posteromedial infarct extending to the anterior bank of the parieto-occipital sulcus scored 28/30 when replacing cards without turning and 14/30 after turning at his first assessment. The authors described very limited involvement of the retrosplenial and posterior cingulate cortices. The patient also had left homonymous hemianopia and mild visual memory difficulty. In a study of seven patients with topographical disorientation, descriptive lesion overlap was greatest in the right posterior parahippocampal gyrus and nearby cortex. The effects of interrupting either projection remain unresolved.
      fr: Après de petites hémorragies s’étendant de la région rétrospléniale droite au lobe pariétal médial, trois patients reconnaissaient les bâtiments et paysages familiers et éprouvaient des difficultés à se rappeler la direction d’un lieu familier à l’autre. Dans une autre observation, un patient dont l’infarctus postéromédial droit atteignait la berge antérieure du sillon pariéto-occipital a obtenu 28/30 en replaçant des cartes sans changer d’orientation et 14/30 après avoir pivoté sur lui-même, lors de la première évaluation. Les auteurs rapportaient une atteinte minime des cortex rétrosplénial et cingulaire postérieur. Le patient présentait aussi une hémianopsie latérale homonyme gauche et un léger trouble de la mémoire visuelle. Dans une étude portant sur sept patients présentant une désorientation topographique, la zone de chevauchement maximal des lésions, déterminée par une analyse descriptive, se situait dans la partie postérieure du gyrus parahippocampique droit et le cortex voisin. Les effets d’une interruption de l’une ou l’autre projection restent indéterminés.
    deficit: topographical-disorientation
    references: [navigation-tf-retrosplenial, navigation-area30-tracing, navigation-retrosplenial-efferents, navigation-cingulum-anatomy, destrieux-parcellation, cortical-parcellation, navigation-lesions, navigation-medial-temporal-lesions, clinical-hashimoto-heading-2015]
    clinical_references: [navigation-lesions, navigation-medial-temporal-lesions, clinical-hashimoto-heading-2015]
    steps:
      - id: parahippocampal
        region: destrieux:right:23
        source_name: G_oc-temp_med-Parahip
        name: { en: Right posterior parahippocampal cortex, fr: Cortex parahippocampique postérieur droit }
        role: { en: Origin of the projection to area 30, fr: Origine de la projection vers l’aire 30 }
        explanation:
          en: In cynomolgus macaques, anterograde tracer injections in parahippocampal area TF labelled fibres and terminals in retrosplenial area 30.
          fr: Chez le macaque crabier, des injections de traceur antérograde dans l’aire parahippocampique TF ont marqué des fibres et des terminaisons dans l’aire rétrospléniale 30.
        mapping:
          en: The Destrieux parcel shows the human parahippocampal gyrus. It provides a broad regional landmark for the macaque area TF origin.
          fr: La parcelle de Destrieux représente le gyrus parahippocampique humain. Elle situe approximativement l’origine de la projection dans l’aire TF chez le macaque.
        view: inferior
        plane: coronal
      - id: retrosplenial
        region: hcp-mmp:right:14
        source_name: R_RSC_ROI
        name: { en: Right retrosplenial area 30, fr: Aire 30 du cortex rétrosplénial droit }
        role: { en: Target of TF and origin of the projection to the presubiculum, fr: Cible de l’aire TF et origine de la projection vers le présubiculum }
        explanation:
          en: In one rhesus macaque, an anterograde tracer injection confined to posteroventral area 30 labelled fibres that joined the cingulum on their way to the presubiculum.
          fr: Chez un macaque rhésus, une injection de traceur antérograde limitée à la partie postéroventrale de l’aire 30 a marqué des fibres qui empruntaient le cingulum en direction du présubiculum.
        mapping:
          en: The human HCP-MMP RSC parcel includes areas 29 and 30. It provides a regional landmark for the traced area 30 territory.
          fr: La parcelle humaine RSC de HCP-MMP comprend les aires 29 et 30. Elle situe approximativement le territoire de l’aire 30 étudié par traçage.
        view: left
        plane: sagittal
      - id: hippocampus
        region: hcp-mmp:right:119
        source_name: R_PreS_ROI
        name: { en: Right presubiculum, fr: Présubiculum droit }
        role: { en: Termination of the retrosplenial projection, fr: Terminaison de la projection rétrospléniale }
        explanation:
          en: The tracer labelled terminals in the posterior presubiculum, part of the hippocampal formation.
          fr: Le traceur a marqué des terminaisons dans la partie postérieure du présubiculum, une composante de la formation hippocampique.
        mapping:
          en: The human HCP-MMP PreS parcel represents the presubicular region. It provides an approximate landmark for the posterior termination field traced in the macaque.
          fr: La parcelle PreS de l’atlas HCP-MMP repère la région présubiculaire humaine. Elle situe approximativement le territoire de terminaison postérieur décrit par traçage chez le macaque.
        view: left
        plane: coronal

  - id: slf3-opercular
    name: { en: SLF III to the frontal operculum, fr: Faisceau longitudinal supérieur III vers l’opercule frontal }
    summary:
      en: Follow a branch of the left superior longitudinal fasciculus III (SLF III) from the supramarginal gyrus to the frontal operculum.
      fr: Suivez une branche du faisceau longitudinal supérieur III (FLS III) gauche, du gyrus supramarginal à l’opercule frontal.
    route:
      en: Left supramarginal gyrus → left inferior frontal area 44 via SLF III
      fr: Gyrus supramarginal gauche → aire 44 du gyrus frontal inférieur gauche par le FLS III
    scope:
      en: The tour focuses on the frontal opercular endpoint. Other SLF III fibres reach the ventral precentral gyrus. In the human dissections, the arcuate fasciculus ran deeper and medial to SLF III. The arrow follows the direction shown by tracing in macaques.
      fr: Le parcours se limite à la terminaison dans l’opercule frontal. D’autres fibres du FLS III atteignent la partie ventrale du gyrus précentral. Dans les dissections humaines, le faisceau arqué cheminait plus en profondeur, médialement au FLS III. La flèche indique le sens de la projection établi par traçage chez le macaque.
    clinical:
      en: A meta-analysis linked impaired tool-use pantomime on visual cues, sometimes paired with verbal instructions, to lesions that included the left supramarginal and middle temporal gyri. The synthesis included a longitudinal study of 90 patients after left-hemisphere stroke. In that study’s lesion-volume-adjusted analysis of chronic performance, pantomime production errors were associated with lesions of the left supramarginal, postcentral and posterior superior temporal gyri. The effect of injury confined to this branch of SLF III remains unresolved.
      fr: Une méta-analyse a associé les difficultés à mimer l’utilisation d’outils sur présentation visuelle, parfois accompagnée d’une consigne verbale, à des lésions touchant notamment les gyri supramarginal et temporal moyen gauches. La synthèse incluait une étude longitudinale portant sur 90 patients après un AVC de l’hémisphère gauche. Dans l’analyse des performances en phase chronique, ajustée sur le volume lésionnel, les erreurs d’exécution de la pantomime étaient associées à des lésions du gyrus supramarginal, du gyrus postcentral et de la partie postérieure du gyrus temporal supérieur, dans l’hémisphère gauche. L’effet d’une lésion limitée à cette branche du FLS III reste indéterminé.
    deficit: apraxia
    references: [slf3-parietofrontal-tracing, slf3-human-dissection, slf3-probabilistic-endpoints, slf3-inferior-parietal-comparative-architectonics, slf3-parietofrontal-evoked-responses, destrieux-parcellation, cortical-parcellation, clinical-metaireau-2024, clinical-dressing-2021]
    clinical_references: [clinical-metaireau-2024, clinical-dressing-2021]
    steps:
      - id: supramarginal-gyrus
        region: destrieux:left:26
        source_name: G_pariet_inf-Supramar
        name: { en: Left supramarginal gyrus, fr: Gyrus supramarginal gauche }
        role: { en: Parietal origin in the tracer study, fr: Origine pariétale dans l’étude de traçage }
        explanation:
          en: In one rhesus macaque, an anterograde tracer injection in left ventral area PFG of the inferior parietal lobule labelled SLF III fibres above the circular sulcus of the insula. Human fibre dissection identifies the supramarginal gyrus as a posterior endpoint of the bundle.
          fr: Chez un macaque rhésus, l’injection d’un traceur antérograde dans la partie ventrale de l’aire PFG du lobule pariétal inférieur gauche a marqué des fibres du FLS III au-dessus du sillon circulaire de l’insula. La dissection des fibres chez l’humain situe une terminaison postérieure du faisceau dans le gyrus supramarginal.
        mapping:
          en: The Destrieux parcel serves as a gyral landmark for the parietal end of the bundle. Among the human areas compared, PF and PFm had receptor profiles closest to macaque PFG. The exact human counterpart of the tracer injection site in ventral PFG remains unresolved.
          fr: La parcelle de Destrieux sert de repère pour l’extrémité pariétale du faisceau à l’échelle du gyrus supramarginal. Parmi les aires humaines comparées, PF et PFm présentaient les profils de récepteurs les plus proches de celui de l’aire PFG du macaque. L’équivalent précis chez l’humain du site d’injection dans la partie ventrale de l’aire PFG reste indéterminé.
        view: left
        plane: coronal
      - id: inferior-frontal-area-44
        region: hcp-mmp:left:74
        source_name: L_44_ROI
        name: { en: Left inferior frontal area 44, fr: Aire 44 du gyrus frontal inférieur gauche }
        role: { en: Frontal target in the tracer study, fr: Cible frontale dans l’étude de traçage }
        explanation:
          en: In that macaque, most terminal label in the ventral portion of the inferior limb of the arcuate sulcus lay in area 44 at the fundus. Human dissection follows SLF III to the opercular part of the inferior frontal gyrus. Probabilistic diffusion tractography estimates endpoints in left area 44 and neighbouring frontal areas. During presurgical mapping, stimulation of some left supramarginal sites assigned to PF or PFm elicited early cortical responses in left area 44. The fibres carrying those responses remain unresolved.
          fr: Chez ce macaque, dans la partie ventrale de la branche inférieure du sillon arqué, la plupart des terminaisons marquées se trouvaient dans l’aire 44, au fond du sillon. La dissection chez l’humain permet de suivre le FLS III jusqu’à la partie operculaire du gyrus frontal inférieur. La tractographie probabiliste de diffusion situe des terminaisons probables dans l’aire 44 gauche et les territoires frontaux voisins. Lors d’une cartographie préchirurgicale, la stimulation de certains sites du gyrus supramarginal gauche attribués aux aires PF ou PFm a déclenché des réponses corticales précoces dans l’aire 44 gauche. Les fibres qui véhiculent ces réponses restent indéterminées.
        mapping:
          en: HCP-MMP area 44 overlaps substantially with human cytoarchitectonic area 44. The parcel serves as a landmark within the frontal opercular territory.
          fr: La parcelle 44 de HCP-MMP recouvre en grande partie l’aire cytoarchitectonique 44 humaine. Elle sert de repère dans le territoire de l’opercule frontal.
        view: left
        plane: axial

  - id: gustatory-insulo-orbitofrontal
    name: { en: Insulo-orbitofrontal gustatory pathway, fr: Voie gustative insulo-orbitofrontale }
    summary:
      en: Use two right-hemisphere landmarks to follow a direct projection traced in macaques from the insular and frontal opercular taste region to the caudolateral orbitofrontal taste region.
      fr: Suivez, à l’aide de deux repères dans l’hémisphère droit, une projection directe mise en évidence par traçage chez le macaque, de la région gustative insulaire et operculaire frontale à la région gustative orbitofrontale postérolatérale.
    route:
      en: In the macaque, anterior insular and frontal opercular taste region → middle and posterior thirds of the caudolateral orbitofrontal taste region
      fr: Chez le macaque, région gustative de l’insula antérieure et de l’opercule frontal → tiers moyen et postérieur de la région gustative orbitofrontale postérolatérale
    scope:
      en: This branch ends in the middle and posterior thirds of the macaque caudolateral orbitofrontal taste region. The brainstem and thalamic stages and other inputs to orbitofrontal cortex lie outside the tour. The two human parcels serve as anatomical landmarks for the projection traced in macaques.
      fr: Cette branche se termine dans les tiers moyen et postérieur de la région gustative orbitofrontale postérolatérale chez le macaque. Les relais du tronc cérébral et du thalamus ainsi que les autres afférences du cortex orbitofrontal sont hors de ce parcours. Les deux parcelles humaines servent de repères anatomiques pour la projection étudiée par traçage chez le macaque.
    clinical:
      en: Pritchard and colleagues compared six patients with unilateral insular lesions, three with lesions outside the insula and 11 age-matched healthy participants. Tastants were applied separately to each side of the front of the tongue. Right insular lesions were associated with poorer intensity judgments and taste recognition on the right. With left insular lesions, intensity judgments were poorer on the left and taste recognition was poorer on both sides. Stevenson and colleagues compared seven patients with left insular lesions, seven with right insular lesions and 42 healthy controls. Both patient groups performed worse than controls on taste discrimination, taste-quality judgments and recognition of taste names with stimuli applied to either side of the tongue tip. Among the three patients with frontal lesions involving orbitofrontal cortex in Stevenson and Miller’s study, one had impaired taste discrimination on the right side of the tongue after surgery for a left mucocele that extended into the frontal lobe. Two neuroradiologists found no visible insular damage in that case. The effects of injury confined to area 47s or to this projection remain unresolved.
      fr: Pritchard et ses collègues ont comparé six patients présentant une lésion insulaire unilatérale, trois présentant une lésion hors de l’insula et onze témoins sains appariés selon l’âge. Les stimuli gustatifs ont été appliqués séparément de chaque côté de la partie antérieure de la langue. Les lésions insulaires droites étaient associées à une altération du jugement d’intensité et de la reconnaissance des saveurs à droite. En cas de lésion insulaire gauche, le jugement d’intensité était altéré à gauche et la reconnaissance des saveurs des deux côtés. Stevenson et ses collègues ont comparé sept patients présentant une lésion insulaire gauche, sept présentant une lésion insulaire droite et 42 témoins sains. Les deux groupes de patients obtenaient de moins bons résultats que les témoins en discrimination des saveurs, en jugement de leur qualité et en reconnaissance de leur nom, pour des stimuli appliqués d’un côté ou de l’autre de la pointe de la langue. Parmi les trois patients de l’étude de Stevenson et Miller dont la lésion frontale touchait le cortex orbitofrontal, un présentait un déficit de discrimination des saveurs du côté droit de la langue après l’ablation d’une mucocèle gauche qui s’étendait au lobe frontal. Deux neuroradiologues n’ont décelé aucune lésion insulaire sur les images de ce patient. Les effets d’une lésion limitée à l’aire 47s ou à cette projection restent indéterminés.
    deficit: taste-impairment
    references: [gustatory-orbitofrontal-tracing, gustatory-insula-architecture, macaque-frontal-architecture, olfactory-orbitofrontal-human-architecture, destrieux-parcellation, cortical-parcellation, taste-lesions, clinical-stevenson-insular-taste-2013, clinical-stevenson-orbitofrontal-taste-2013]
    clinical_references: [taste-lesions, clinical-stevenson-insular-taste-2013, clinical-stevenson-orbitofrontal-taste-2013]
    steps:
      - id: short-insular-gyri
        region: destrieux:right:18
        source_name: G_insular_short
        name: { en: Right short insular gyri, fr: Gyri courts de l’insula droite }
        role: { en: Landmark for the insular origin, fr: Repère de l’origine insulaire }
        explanation:
          en: In cynomolgus macaques, tracer deposits in the middle and posterior portions of the orbitofrontal taste region labelled neurons in the anterior insula and frontal operculum. After one posterior deposit, the labelled region in the dysgranular insula extended beyond the area where taste-responsive neurons had been recorded.
          fr: Chez le macaque crabier, les dépôts de traceur dans les parties moyenne et postérieure de la région gustative orbitofrontale ont marqué des neurones de l’insula antérieure et de l’opercule frontal. Après un dépôt postérieur, la région marquée dans l’insula dysgranulaire dépassait la zone où des neurones sensibles aux saveurs avaient été enregistrés.
        mapping:
          en: The Destrieux parcel groups the human short insular gyri, which include dysgranular cortex. It provides a broad landmark for the insular part of the traced origin. The adjacent frontal operculum lies outside the parcel.
          fr: La parcelle de Destrieux regroupe les gyri courts de l’insula humaine, qui comprennent du cortex dysgranulaire. Elle situe approximativement la composante insulaire de l’origine de la projection. L’opercule frontal voisin se trouve hors de cette parcelle.
        view: right
        plane: coronal
      - id: lateral-orbitofrontal
        region: hcp-mmp:right:94
        source_name: R_47s_ROI
        name: { en: Right lateral orbitofrontal area 47s, fr: Aire orbitofrontale latérale 47s droite }
        role: { en: Landmark for the orbitofrontal target, fr: Repère de la cible orbitofrontale }
        explanation:
          en: Deposits of retrograde tracer at taste-responsive sites in the middle and posterior thirds of the caudolateral orbitofrontal taste region labelled many insular and opercular neurons. The two more anterior deposits produced either no label or very sparse label in the primary taste region.
          fr: Les dépôts de traceur rétrograde en des sites répondant aux saveurs dans les tiers moyen et postérieur de la région gustative orbitofrontale postérolatérale ont marqué de nombreux neurones insulaires et operculaires. Les deux dépôts plus antérieurs n’ont donné qu’un marquage très clairsemé ou nul dans la région gustative primaire.
        mapping:
          en: Human HCP-MMP area 47s approximates the architectonic area 47/12s, which comparative histology relates to macaque area 12o. The tracer study placed its deposits in Walker’s broader area 12. Their exact relation to area 12o remains uncertain.
          fr: L’aire 47s de l’atlas humain HCP-MMP correspond approximativement à l’aire architectonique 47/12s, que l’histologie comparée rapproche de l’aire 12o chez le macaque. Les dépôts de traceur se situaient dans l’aire 12 de Walker, plus étendue. Leur position précise par rapport à l’aire 12o reste incertaine.
        view: inferior
        plane: coronal

  - id: uncinate-temporopolar
    name: { en: Orbitofrontal–temporopolar branch of the uncinate fasciculus, fr: Branche orbitofrontale–temporopolaire du faisceau unciné }
    summary:
      en: Follow a macaque projection from orbitofrontal cortex to the temporal pole through the uncinate fasciculus, using two human right-hemisphere landmarks.
      fr: Suivez une projection tracée chez le macaque, du cortex orbitofrontal au pôle temporal par le faisceau unciné, à l’aide de deux repères dans l’hémisphère droit humain.
    route:
      en: In macaques, orbitofrontal area 11 → uncinate fasciculus around the limen of the insula → temporopolar proisocortex
      fr: Chez le macaque, aire orbitofrontale 11 → faisceau unciné contournant le seuil de l’insula → pro-isocortex temporopolaire
    scope:
      en: The tour follows one macaque projection and leaves out the other destinations of the uncinate fasciculus and the separate temporal–frontal projections through the extreme capsule. The two human landmarks approximate the regions identified by tracing. Human fibre dissection shows the gross course of the uncinate around the limen of the insula between the orbital gyri and the temporal pole. Among the region pairs tested with human diffusion tractography, the greatest mean proportion of estimated uncinate streamlines linked dorsal temporal pole area TGd to the middle orbitofrontal region combining areas 11l and 13l. The precise cortical endpoints and direction of the corresponding human projection remain unresolved.
      fr: Le parcours suit une projection décrite chez le macaque. Il laisse de côté les autres destinations du faisceau unciné et les projections temporo-frontales distinctes qui empruntent la capsule extrême. Les deux repères humains situent approximativement les régions étudiées par traçage. La dissection chez l’humain montre le trajet macroscopique du faisceau unciné autour du seuil de l’insula, entre les gyri orbitaires et le pôle temporal. Parmi les paires de régions étudiées en tractographie de diffusion chez l’humain, la proportion moyenne de trajectoires estimées du faisceau unciné était la plus élevée entre l’aire TGd, dans la partie dorsale du pôle temporal, et la région orbitofrontale moyenne regroupant les aires 11l et 13l. Les extrémités corticales précises et le sens de la projection correspondante chez l’humain restent indéterminés.
    clinical:
      en: In a study of 55 patients with left spatial neglect after a first right-hemisphere stroke and 55 healthy controls, the patients made less plausible estimates of everyday quantities on the Cognitive Estimation Test (CET-A). For overall estimation performance, voxel-based lesion mapping found a cluster in the right anterior temporal lobe. A separate region-based analysis associated impaired performance with lesions overlapping the right uncinate fasciculus, right superior temporal pole, orbital part of the right inferior frontal gyrus and right half of the anterior commissure after correction for multiple comparisons. The frontal result concerns the atlas region for the orbital inferior frontal gyrus and leaves involvement of area 11l unresolved. In a separate study of adults with lesions due to stroke or tumour, the 34 patients with frontal lesions had higher adjusted CET-A error scores than the 19 patients with posterior lesions and the 39 healthy controls. The study found no significant difference in overall scores between left and right frontal lesion groups. The contribution of selective damage to the displayed branch and the functional laterality of this ability remain unresolved.
      fr: Dans une étude comparant 55 patients présentant une négligence spatiale gauche après un premier AVC de l’hémisphère droit à 55 témoins sains, les patients ont donné des estimations moins plausibles de grandeurs quotidiennes au test d’estimation cognitive (CET-A). Pour la performance globale, la cartographie lésionnelle par voxels a révélé un amas dans le lobe temporal antérieur droit. Une analyse distincte par régions a associé les difficultés d’estimation à des lésions chevauchant le faisceau unciné droit, la partie supérieure du pôle temporal droit, la partie orbitaire du gyrus frontal inférieur droit et la moitié droite de la commissure antérieure, après correction pour comparaisons multiples. Le résultat frontal concerne la région d’atlas correspondant à la partie orbitaire du gyrus frontal inférieur et laisse indéterminée l’implication de l’aire 11l. Dans une autre étude menée chez des adultes présentant une lésion due à un AVC ou à une tumeur, les 34 patients présentant une lésion frontale ont obtenu des scores d’erreur ajustés au CET-A plus élevés que ceux des 19 patients présentant une lésion postérieure et des 39 témoins sains. L’étude n’a pas relevé de différence significative entre les scores globaux des groupes présentant une lésion frontale gauche ou droite. La contribution d’une atteinte sélective de la branche illustrée et la latéralisation fonctionnelle de cette capacité restent indéterminées.
    deficit: cognitive-estimation
    references: [uncinate-rostral-orbitofrontal-tracing, uncinate-temporal-pole-tracing, uncinate-human-dissection, uncinate-human-tractography, cortical-parcellation, olfactory-orbitofrontal-human-architecture, destrieux-parcellation, clinical-pflugshaupt-2020, clinical-cipolotti-2018]
    clinical_references: [clinical-pflugshaupt-2020, clinical-cipolotti-2018]
    steps:
      - id: orbitofrontal-area-11
        region: hcp-mmp:right:91
        source_name: R_11l_ROI
        name: { en: Right lateral orbitofrontal area 11l, fr: Aire orbitofrontale latérale 11l droite }
        role: { en: Landmark for the orbitofrontal origin, fr: Repère de l’origine orbitofrontale }
        explanation:
          en: In a rhesus macaque, an anterograde tracer injection in orbital area 11 labelled fibres that entered the uncinate fasciculus and curved around the limen of the insula.
          fr: Chez un macaque rhésus, une injection de traceur antérograde dans l’aire orbitaire 11 a marqué des fibres qui empruntaient le faisceau unciné et contournaient le seuil de l’insula.
        mapping:
          en: The HCP-MMP parcel marks the lateral area 11l of human orbitofrontal cortex. It is a comparative landmark for the macaque origin, which the tract-tracing study reported at the scale of area 11.
          fr: La parcelle HCP-MMP repère l’aire latérale 11l du cortex orbitofrontal humain. Elle sert de repère comparatif pour l’origine chez le macaque, située à l’échelle de l’aire 11 dans l’étude de traçage du faisceau.
        view: inferior
        plane: coronal
      - id: temporal-pole
        region: destrieux:right:44
        source_name: Pole_temporal
        name: { en: Right temporal pole, fr: Pôle temporal droit }
        role: { en: Landmark for the traced temporopolar target, fr: Repère de la terminaison temporopolaire tracée }
        explanation:
          en: Labelled fibres of the uncinate fasciculus terminated in the temporopolar proisocortex in the area 11 tracing case. In a separate macaque experiment, an injection in area 11l labelled axons and varicosities near the rostral tip of the superior temporal sulcus.
          fr: Dans le cas de traçage depuis l’aire 11, des fibres marquées du faisceau unciné se terminaient dans le pro-isocortex temporopolaire. Dans une autre expérience chez le macaque, une injection dans l’aire 11l a marqué des axones et des varicosités près de l’extrémité antérieure du sillon temporal supérieur.
        mapping:
          en: The Destrieux parcel outlines the temporal pole. It marks the general location of the macaque target at a broader scale than the proisocortical territory traced in that species.
          fr: La parcelle de Destrieux délimite le pôle temporal. Elle situe la cible décrite chez le macaque à une échelle plus large que le territoire pro-isocortical étudié par traçage chez cette espèce.
        view: right
        plane: coronal

  - id: arcuate-dorsal-frontotemporal
    name: { en: Dorsal frontotemporal branch of the arcuate fasciculus, fr: Branche frontotemporale dorsale du faisceau arqué }
    summary:
      en: Follow a projection traced from dorsolateral prefrontal cortex to posterior superior temporal cortex in macaques, using two landmarks in the left hemisphere of the human atlas.
      fr: Suivez une projection du cortex préfrontal dorsolatéral vers le cortex temporal supérieur postérieur mise en évidence par traçage chez le macaque, à l’aide de deux repères dans l’hémisphère gauche de l’atlas humain.
    route:
      en: In macaques, rostral area 8Ad → caudal superior temporal gyrus via the arcuate fasciculus
      fr: Chez le macaque, partie rostrale de l’aire 8Ad → partie caudale du gyrus temporal supérieur par le faisceau arqué
    scope:
      en: Human dissection shows the long arcuate fasciculus curving around the posterior insula beneath the inferior parietal lobule. One human diffusion tractography study estimated a dorsal branch between posterior temporal and posterior dorsolateral frontal regions. This tour covers the connection to the caudal superior temporal gyrus. The fibres to the adjacent superior temporal sulcus and other arcuate connections lie outside the tour.
      fr: La dissection humaine montre la courbure du faisceau arqué autour de la partie postérieure de l’insula, en profondeur du lobule pariétal inférieur. Une étude de tractographie de diffusion chez l’humain a estimé un trajet dorsal entre la région temporale postérieure et la partie postérieure du cortex frontal dorsolatéral. Le parcours suit la projection vers la partie caudale du gyrus temporal supérieur. Les fibres destinées au sillon temporal supérieur voisin et les autres connexions du faisceau arqué sont hors du parcours.
    clinical:
      en: In a coordinate-based analysis of six studies of repetition after stroke involving the left hemisphere, Na and colleagues reported a significant cluster in the left posterior superior temporal gyrus. One of the studies contributed coordinates relating repetition scores to grey matter volume in spared right-hemisphere tissue. In 39 adults after a first left-hemisphere ischaemic stroke, Fridriksson and colleagues found the strongest structural association with poor repetition in the white matter beneath the left supramarginal gyrus. The structural peak lay within a probabilistic diffusion tractography map between Brodmann areas 22 and 45 based on data from 54 older adults. In the perfusion analysis, poorer repetition was most strongly associated with hypoperfusion in the inferior part of the same gyrus. Kim and colleagues described a patient with an infarct involving the left posterior superior temporal gyrus and underlying white matter. On the Korean Western Aphasia Battery on the fourth hospital day, only sentences of at least five words were still difficult to repeat. The effect of injury confined to this branch of the arcuate fasciculus remains unresolved.
      fr: Dans une analyse des coordonnées issues de six études sur la répétition après un AVC touchant l’hémisphère gauche, Na et ses collègues ont rapporté un amas significatif dans la partie postérieure du gyrus temporal supérieur gauche. L’une des études a fourni des coordonnées associant les scores de répétition au volume de substance grise dans des régions épargnées de l’hémisphère droit. Chez 39 adultes ayant eu un premier AVC ischémique de l’hémisphère gauche, Fridriksson et ses collègues ont trouvé que les difficultés de répétition étaient le plus fortement associées à une lésion de la substance blanche sous le gyrus supramarginal gauche. Le pic de l’association structurale se situait dans une carte probabiliste du faisceau arqué entre les aires 22 et 45 de Brodmann, établie par tractographie de diffusion chez 54 adultes âgés. Dans l’analyse de la perfusion, l’association la plus forte concernait une hypoperfusion de la partie inférieure du même gyrus. Kim et ses collègues ont décrit un patient dont l’infarctus touchait la partie postérieure du gyrus temporal supérieur gauche et la substance blanche sous-jacente. Au quatrième jour d’hospitalisation, dans la version coréenne de la Western Aphasia Battery, seules les phrases d’au moins cinq mots restaient difficiles à répéter. L’effet d’une lésion limitée à cette branche du faisceau arqué reste indéterminé.
    deficit: aphasia
    references: [arcuate-caudal-prefrontal-tracing, arcuate-temporofrontal-dissection, arcuate-dorsal-tractography, cortical-parcellation, destrieux-parcellation, clinical-na-2022, clinical-xing-repetition-2016, clinical-fridriksson-repetition-2010, clinical-kim-temporal-repetition-2002]
    clinical_references: [clinical-na-2022, clinical-xing-repetition-2016, clinical-fridriksson-repetition-2010, clinical-kim-temporal-repetition-2002]
    steps:
      - id: frontal-8ad
        region: hcp-mmp:left:68
        source_name: L_8Ad_ROI
        name: { en: Left dorsolateral prefrontal area 8Ad, fr: Aire préfrontale dorsolatérale 8Ad gauche }
        role: { en: Origin of the traced arcuate projection, fr: Origine de la projection étudiée par traçage }
        explanation:
          en: In macaques, tracing from rostral area 8Ad showed fibres travelling through the arcuate fasciculus to caudal superior temporal cortex.
          fr: Chez le macaque, un traçage depuis la partie rostrale de l’aire 8Ad a mis en évidence des fibres qui empruntent le faisceau arqué vers le cortex temporal supérieur caudal.
        mapping:
          en: HCP-MMP shows the whole human area 8Ad. It provides an approximate landmark for the rostral part of macaque area 8Ad where the projection originates.
          fr: La parcelle 8Ad de l’atlas HCP-MMP délimite l’ensemble de l’aire 8Ad humaine. Elle sert de repère approximatif pour la partie rostrale de l’aire 8Ad du macaque d’où provient la projection.
        view: left
        plane: coronal
      - id: posterior-superior-temporal
        region: destrieux:left:34
        source_name: G_temp_sup-Lateral
        name: { en: Left posterior superior temporal region, fr: Région temporale supérieure postérieure gauche }
        role: { en: Gyral target of the traced projection, fr: Cible gyrale de la projection étudiée par traçage }
        explanation:
          en: In macaques, arcuate fibres traced from rostral area 8Ad reach the caudal superior temporal gyrus.
          fr: Chez le macaque, des fibres du faisceau arqué issues de la partie rostrale de l’aire 8Ad atteignent la partie caudale du gyrus temporal supérieur.
        mapping:
          en: The Destrieux parcel covers the entire lateral surface of the superior temporal gyrus. Its posterior portion serves as the human landmark for the gyral target of the macaque projection.
          fr: La parcelle de Destrieux couvre l’ensemble de la face latérale du gyrus temporal supérieur. Sa partie postérieure sert de repère humain pour la cible gyrale de la projection tracée chez le macaque.
        view: left
        plane: coronal

  - id: basal-amygdala-mediodorsal
    name: { en: Amygdalar input to the mediodorsal thalamus, fr: Afférences amygdaliennes au thalamus médiodorsal }
    summary:
      en: Follow the projection from the basal nucleus of the amygdala to the magnocellular part of the mediodorsal thalamic nucleus.
      fr: Suivez la projection du noyau basal de l’amygdale vers la partie magnocellulaire du noyau médiodorsal du thalamus.
    route:
      en: Right basal nucleus of the amygdala → right magnocellular mediodorsal thalamic nucleus
      fr: Noyau basal de l’amygdale droite → partie magnocellulaire du noyau médiodorsal du thalamus droit
    scope:
      en: The two right-sided landmarks represent a same-side projection described by tracing in macaques. In cynomolgus macaques, most traced amygdalothalamic fibres joined the inferior thalamic peduncle. Human fibre dissection describes amygdalothalamic fibres above the anterior perforated substance within the extracapsular inferior thalamic peduncle. A human diffusion tractography study estimated same-side streamlines between a region combining the medial and lateral mediodorsal subdivisions and a basolateral amygdalar region containing the lateral, basal and accessory basal nuclei. The precise endpoints and direction of the corresponding human projection remain unresolved. The intervening white matter and the onward thalamocortical projection are outside the tour.
      fr: Les deux repères du côté droit représentent une projection ipsilatérale mise en évidence par traçage chez le macaque. Chez le macaque crabier, la plupart des fibres amygdalothalamiques marquées rejoignaient le pédoncule thalamique inférieur. La dissection chez l’humain décrit des fibres amygdalothalamiques au-dessus de la substance perforée antérieure, dans le pédoncule thalamique inférieur extracapsulaire. Une étude de tractographie par IRM de diffusion chez l’humain a estimé des trajectoires ipsilatérales entre une région regroupant les subdivisions médiale et latérale du noyau médiodorsal et une région amygdalienne comprenant les noyaux latéral, basal et basal accessoire. Les extrémités précises et le sens de la projection correspondante restent indéterminés chez l’humain. Le trajet dans la substance blanche et la projection thalamocorticale en aval restent hors du parcours.
    clinical:
      en: After herpes simplex encephalitis, three adults with large bilateral anterior temporal lesions labelled fear and sadness in photographs of faces less accurately as a group than six healthy controls in a six-choice task. The lesions involved both amygdalae, the hippocampal region and nearby temporal cortex. In a separate study of 30 adults with acute right-hemisphere ischaemic stroke and 30 healthy controls, mean accuracy for fearful faces was 34% in the stroke group and 54% in controls. The association with right amygdala damage was inconclusive. The effects of injury confined to the basal nucleus or its thalamic projection remain unresolved.
      fr: Après une encéphalite herpétique, trois adultes présentant des lésions temporales antérieures bilatérales étendues identifiaient en moyenne moins bien que six témoins sains la peur et la tristesse sur des photographies de visages, dans une épreuve à six choix. Les lésions touchaient les deux amygdales, la région hippocampique et le cortex temporal adjacent. Dans une étude distincte portant sur 30 adultes ayant subi un AVC ischémique aigu de l’hémisphère droit et 30 témoins sains, l’exactitude moyenne pour les visages exprimant la peur était de 34 % après AVC et de 54 % chez les témoins. Le lien avec une lésion de l’amygdale droite restait incertain. Les effets d’une lésion limitée au noyau basal ou à sa projection thalamique restent indéterminés.
    deficit: emotion-recognition
    references: [amygdalothalamic-aggleton-1984, amygdalothalamic-russchen-1987, amygdalothalamic-relay-tracing-2015, amygdalothalamic-synapses-2020, amygdalothalamic-ribas-human-dissection-2018, amygdalothalamic-kosteletou-kassotaki-human-diffusion-2026, clinical-schmolck-2001, clinical-tippett-2018]
    clinical_references: [clinical-schmolck-2001, clinical-tippett-2018]
    steps:
      - id: basal-amygdala
        region: nextbrain:right:10216
        source_name: basolateral_nucleus_(basal_nucleus)
        name: { en: Right basal amygdalar nucleus, fr: Noyau basal de l’amygdale droite }
        role: { en: Amygdalar source of thalamic input, fr: Origine amygdalienne des afférences thalamiques }
        explanation:
          en: In one rhesus macaque, an injection mainly in the left magnocellular division and extending into the parvicellular division retrogradely labelled neurons in the basal nucleus and neighbouring amygdalar nuclei. In cynomolgus macaques, tracing identified projections from the parvicellular and magnocellular parts of the basal nucleus to the ventromedial and ventrolateral parts of the magnocellular thalamic division, respectively.
          fr: Chez un macaque rhésus, une injection dans la partie magnocellulaire gauche, débordant sur la partie parvocellulaire, a marqué par voie rétrograde des neurones du noyau basal et de noyaux amygdaliens voisins. Chez le macaque crabier, le traçage a mis en évidence des projections de la partie parvocellulaire du noyau basal vers la région ventromédiale de la partie magnocellulaire du thalamus médiodorsal, et de la partie magnocellulaire du noyau basal vers la région ventrolatérale.
        mapping:
          en: NextBrain displays the basal nucleus as a single volume under the name basolateral nucleus. The subregions identified by tracing in macaques have no separate landmarks.
          fr: NextBrain représente le noyau basal par un seul volume, sous le nom de noyau basolatéral. Les subdivisions distinguées par traçage chez le macaque n’ont pas de repère séparé.
        view: left
        plane: coronal
      - id: magnocellular-mediodorsal
        region: nextbrain:right:10282
        source_name: magnocellular_(medial)_division_of_md
        name: { en: Magnocellular division of the right mediodorsal thalamic nucleus, fr: Partie magnocellulaire du noyau médiodorsal du thalamus droit }
        role: { en: Thalamic target of the amygdalar projection, fr: Cible thalamique de la projection amygdalienne }
        explanation:
          en: In rhesus macaques, axons labelled from amygdalar injections formed clusters of terminations in this thalamic division. Serial electron microscopy showed labelled amygdalar boutons forming synapses on thalamic relay dendrites after injections involving multiple amygdalar nuclei.
          fr: Chez le macaque rhésus, les axones marqués par des injections dans l’amygdale formaient des amas de terminaisons dans cette partie du thalamus. La microscopie électronique en coupes sériées a montré des boutons amygdaliens marqués formant des synapses sur des dendrites de neurones de relais thalamiques après des injections touchant plusieurs noyaux de l’amygdale.
        mapping:
          en: NextBrain shows a segmented volume for the medial magnocellular division. The macaque study identifies discrete groups of terminations within the division.
          fr: NextBrain délimite un volume pour la partie magnocellulaire médiale. Le traçage chez le macaque montre des groupes distincts de terminaisons au sein de cette partie.
        view: anterior
        plane: coronal

  - id: frontal-aslant-opercular
    name: { en: Frontal aslant tract · opercular branch, fr: Faisceau frontal oblique · branche operculaire }
    summary:
      en: Follow an association pathway through the left frontal lobe between the inferior frontal gyrus and the pre-supplementary motor region.
      fr: Suivez une voie d’association du lobe frontal gauche entre le gyrus frontal inférieur et la région motrice présupplémentaire.
    route:
      en: Left inferior frontal area 44 → left pre-supplementary motor region (direction traced in a rhesus macaque)
      fr: Aire 44 du gyrus frontal inférieur gauche → région motrice présupplémentaire gauche (sens de projection établi par traçage chez un macaque rhésus)
    scope:
      en: Comparative diffusion tractography estimates broad precentral and prefrontal segments of the frontal aslant tract. In eight patients operated on in the hemisphere dominant for language, stimulation in the opercular or triangular part of the inferior frontal gyrus evoked responses in the superior frontal gyrus. Responses were recorded at supplementary motor sites in four patients. In a separate case, stimulation near the posterior pre-SMA evoked responses in the right posterior inferior frontal gyrus within 30 ms. The fibres carrying these responses, the precise correspondence of this branch between species and the direction of its fibres in humans remain unresolved. The tour leaves out branches to SMA proper and other inferior frontal territories.
      fr: Les comparaisons par tractographie de diffusion estiment de larges segments précentral et préfrontal du faisceau frontal oblique. Chez huit patients opérés dans l’hémisphère dominant pour le langage, la stimulation de la région operculaire ou triangulaire du gyrus frontal inférieur a évoqué des réponses dans le gyrus frontal supérieur. Des réponses ont été enregistrées dans les aires motrices supplémentaires chez quatre patients. Dans une observation distincte, la stimulation à proximité de la partie postérieure de la pré-AMS a évoqué des réponses dans la partie postérieure du gyrus frontal inférieur droit en moins de 30 ms. Les fibres à l’origine de ces réponses, la correspondance précise de cette branche entre les espèces et le sens de projection de ses fibres chez l’humain restent indéterminés. Le parcours laisse de côté les branches qui rejoignent l’aire motrice supplémentaire proprement dite et les autres territoires frontaux inférieurs.
    clinical:
      en: In 80 patients with acute non-lacunar left-hemisphere stroke, apraxia of speech was associated with injury or hypoperfusion of the left posterior inferior frontal gyrus. In 32 patients with chronic aphasia after left-hemisphere stroke, greater overlap of the lesion with the atlas-defined left frontal aslant tract was associated with apraxia of speech after adjustment for total lesion volume and sex. The model that included nearby cortical lesions and sex dropped the tract-overlap measure. The contribution of the specific branch shown here remains unresolved.
      fr: Chez 80 patients examinés à la phase aiguë d’un AVC non lacunaire de l’hémisphère gauche, l’apraxie de la parole était associée à une lésion ou à une hypoperfusion de la partie postérieure du gyrus frontal inférieur gauche. Chez 32 patients présentant une aphasie chronique après un AVC de l’hémisphère gauche, un chevauchement plus important de la lésion avec le faisceau frontal oblique gauche délimité dans un atlas était associé à l’apraxie de la parole, après ajustement sur le volume lésionnel total et le sexe. Le modèle intégrant les lésions corticales voisines et le sexe a écarté la mesure du chevauchement avec le faisceau. La contribution propre de la branche présentée ici reste indéterminée.
    deficit: speech-apraxia
    references: [frontal-aslant-macaque-tracing, sma-callosal-bozkurt-2017, sma-callosal-vergani-2014, frontal-aslant-tractography, cortical-parcellation, frontal-aslant-comparative, frontal-aslant-human-evoked-potential-series, frontal-aslant-human-evoked-potential-case, speech-frontal, clinical-zhong-2022]
    clinical_references: [speech-frontal, clinical-zhong-2022]
    steps:
      - id: inferior-frontal-area-44
        region: hcp-mmp:left:74
        source_name: L_44_ROI
        name: { en: Left inferior frontal area 44, fr: Aire 44 du gyrus frontal inférieur gauche }
        role: { en: Cortical origin in the tracer study, fr: Origine corticale dans l’étude de traçage }
        explanation:
          en: In a rhesus macaque, a retrograde tracer injected into the pre-supplementary motor area (pre-SMA) labelled neurons in area 44 on the caudal bank of the inferior limb of the arcuate sulcus.
          fr: Chez un macaque rhésus, l’injection d’un traceur rétrograde dans l’aire motrice présupplémentaire (pré-AMS) a marqué des neurones de l’aire 44 sur la berge caudale de la branche inférieure du sillon arqué.
        mapping:
          en: HCP-MMP area 44 overlaps substantially with human cytoarchitectonic area 44. The parcel locates the inferior frontal attachment at the scale of the atlas.
          fr: La parcelle 44 de HCP-MMP recouvre en grande partie l’aire cytoarchitectonique 44 humaine. Elle situe l’extrémité frontale inférieure du faisceau à l’échelle de l’atlas.
        view: left
        plane: axial
      - id: pre-sma
        region: hcp-mmp:left:44
        source_name: L_6ma_ROI
        name: { en: Left pre-supplementary motor region · 6ma, fr: Région motrice présupplémentaire gauche · 6ma }
        role: { en: Cortical target in the tracer study, fr: Cible corticale dans l’étude de traçage }
        explanation:
          en: Human dissections follow oblique fibres between the pars opercularis of the inferior frontal gyrus and the pre-SMA. One series placed the attachment in the superior frontal gyrus at the boundary between the pre-SMA and SMA proper. Human diffusion tractography estimated streamlines between areas 44 and 6ma on the left.
          fr: Les dissections chez l’humain permettent de suivre des fibres obliques entre la partie operculaire du gyrus frontal inférieur et la pré-AMS. Dans une série, l’attache dans le gyrus frontal supérieur se trouvait à la limite entre la pré-AMS et l’aire motrice supplémentaire proprement dite. Chez l’humain, la tractographie de diffusion a reconstruit des trajectoires probables entre les aires 44 et 6ma de l’hémisphère gauche.
        mapping:
          en: HCP-MMP area 6ma partly overlaps the rostral supplementary motor region in a previous anatomical map and extends farther anteriorly and laterally, with less inferior extent on the medial surface. The parcel serves as a landmark for the superior attachment.
          fr: L’aire 6ma de HCP-MMP recouvre en partie le territoire moteur supplémentaire rostral décrit par une carte anatomique antérieure et s’étend davantage en avant et latéralement, avec une extension inférieure plus limitée sur la face médiale. La parcelle sert de repère pour l’extrémité frontale supérieure du faisceau.
        view: right
        plane: coronal

  - id: motor-hyperdirect
    name: { en: Motor hyperdirect pathway, fr: Voie hyperdirecte motrice }
    summary:
      en: Follow the projection traced in macaques from the forelimb representation of primary motor cortex to the subthalamic nucleus on the same side.
      fr: Suivez la projection mise en évidence par traçage chez le macaque, de la représentation du membre supérieur dans le cortex moteur primaire jusqu’au noyau sous-thalamique ipsilatéral.
    route:
      en: Left primary motor cortex → dorsolateral portion of the left subthalamic nucleus
      fr: Cortex moteur primaire gauche → portion dorsolatérale du noyau sous-thalamique gauche
    scope:
      en: The atlas labels the regions at either end of the route. In macaques, the traced fibres pass through the internal capsule. In ten people with Parkinson’s disease with paired recordings on and off medication, bipolar stimulation between the contact closest to primary motor cortex and its anterior neighbour produced an evoked response on the ipsilateral subthalamic lead. The first deflection occurred after a mean of 2.6 ms. In a separate study, stimulation in the subthalamic region evoked short-latency cortical potentials (2–10 ms), consistent with antidromic activation of corticosubthalamic fibres. The precise human forelimb terminal field remains unresolved. Other cortical inputs and the onward connections of the subthalamic nucleus lie outside this tour.
      fr: L’atlas délimite les régions aux deux extrémités du trajet. Chez le macaque, les fibres mises en évidence par traçage traversent la capsule interne. Chez dix personnes atteintes de la maladie de Parkinson, enregistrées avec et sans traitement dopaminergique, une stimulation bipolaire entre le contact le plus proche du cortex moteur primaire et son voisin antérieur a évoqué une réponse enregistrée sur l’électrode sous-thalamique ipsilatérale. La première déflexion survenait en moyenne après 2,6 ms. Dans une autre étude, la stimulation de la région sous-thalamique a évoqué des potentiels corticaux de courte latence (2 à 10 ms), compatibles avec une activation antidromique des fibres cortico-sous-thalamiques. Le champ précis de terminaison des fibres issues de la représentation du membre supérieur reste indéterminé chez l’humain. Les autres afférences corticales et les efférences du noyau sous-thalamique restent hors du parcours.
    clinical:
      en: Lee and Marsden reviewed 17 published cases of ballism or chorea associated with thalamic or subthalamic lesions. In 15 of those cases, a unilateral lesion of the subthalamic nucleus or region accompanied hemichorea or hemiballism on the opposite side. In a separate case of nonketotic hyperglycaemia, left hemiballism accompanied an MRI signal abnormality in the right subthalamic nucleus. The caudate and putamen appeared normal on those images. The effects of selectively interrupting this cortical projection remain uncertain.
      fr: Lee et Marsden ont analysé 17 cas publiés de ballisme ou de chorée associés à une lésion thalamique ou sous-thalamique. Dans 15 de ces cas, une lésion unilatérale du noyau ou de la région sous-thalamique s’accompagnait d’une hémichorée ou d’un hémiballisme du côté opposé. Dans une autre observation, chez une patiente présentant une hyperglycémie non cétosique, l’hémiballisme gauche s’accompagnait d’une anomalie de signal à l’IRM du noyau sous-thalamique droit. Le noyau caudé et le putamen étaient d’aspect normal sur ces images. Les effets d’une interruption sélective de cette projection corticale restent indéterminés.
    deficit: hemichorea
    references: [hyperdirect-m1-single-axon, hyperdirect-m1-subthalamic-tracing, hyperdirect-human-tractography, hyperdirect-human-subthalamic-topography, hyperdirect-human-orthodromic-physiology, hyperdirect-human-antidromic-physiology, cortical-parcellation, clinical-lee-marsden-subthalamic-1994, clinical-kim-subthalamic-hemiballism-2008]
    clinical_references: [clinical-lee-marsden-subthalamic-1994, clinical-kim-subthalamic-hemiballism-2008]
    steps:
      - id: primary-motor-cortex
        region: hcp-mmp:left:8
        source_name: L_4_ROI
        name: { en: Left primary motor cortex, fr: Cortex moteur primaire gauche }
        role: { en: Origin of the corticosubthalamic projection, fr: Origine de la projection cortico-sous-thalamique }
        explanation:
          en: In cynomolgus macaques, anterograde tracer injections centred on layer V mainly sampled the forelimb representation of primary motor cortex. Most reconstructed axons sent collaterals to the subthalamic nucleus from a main branch descending toward the lower brainstem.
          fr: Chez le macaque crabier, les injections de traceur antérograde centrées sur la couche V concernaient surtout la représentation du membre supérieur dans le cortex moteur primaire. La plupart des axones reconstruits émettaient des collatérales vers le noyau sous-thalamique à partir d’une branche principale descendant vers les étages inférieurs du tronc cérébral.
        mapping:
          en: The HCP-MMP parcel outlines area 4 on this cortical surface. The forelimb representation occupies part of that area.
          fr: La parcelle HCP-MMP délimite l’aire 4 sur cette surface corticale. La représentation du membre supérieur n’en occupe qu’une partie.
        view: left
        plane: axial
      - id: dorsolateral-subthalamic
        region: nextbrain:left:316
        source_name: laterodorsal_portion_of_sth
        name: { en: Dorsolateral portion of the left subthalamic nucleus, fr: Portion dorsolatérale du noyau sous-thalamique gauche }
        role: { en: Subthalamic target of the motor projection, fr: Cible sous-thalamique de la projection motrice }
        explanation:
          en: In macaques, fibres traced from the forelimb representation reached the ipsilateral subthalamic nucleus. Dense terminal labelling occupied the central zone of its lateral half. Single-axon reconstructions show thin collaterals with boutons along their course in the dorsal part of the nucleus. In five healthy participants, diffusion tractography estimated trajectories to the ipsilateral subthalamic nucleus using the posterior limb of the internal capsule as a required waypoint. Tracking stopped at the surface of the nucleus because of limited image resolution.
          fr: Chez le macaque, les fibres marquées depuis la représentation du membre supérieur atteignaient le noyau sous-thalamique ipsilatéral. Le marquage des terminaisons était dense dans la zone centrale de sa moitié latérale. La reconstruction d’axones individuels montre de fines collatérales portant des boutons le long de leur trajet dans la partie dorsale du noyau. Chez cinq volontaires sains, la tractographie de diffusion a estimé des trajectoires vers le noyau sous-thalamique ipsilatéral en imposant leur passage par le bras postérieur de la capsule interne. Le suivi s’arrêtait à la surface du noyau en raison de la résolution limitée des images.
        mapping:
          en: The NextBrain parcel outlines the dorsolateral portion of the nucleus and serves as an approximate landmark for the terminal field traced in macaques. In people with Parkinson’s disease, 7 T diffusion tractography linked a superior posterolateral territory to a combined mask of primary motor, supplementary motor and premotor cortex. That estimated territory partly overlapped the territory linked to associative cortex.
          fr: La parcelle NextBrain délimite la portion dorsolatérale du noyau et sert de repère approximatif pour le champ de terminaison observé chez le macaque. Chez des patients atteints de la maladie de Parkinson, la tractographie de diffusion à 7 T a associé un territoire postérolatéral supérieur à un masque réunissant le cortex moteur primaire, l’aire motrice supplémentaire et le cortex prémoteur. Ce territoire estimé chevauchait en partie celui associé au cortex associatif.
        view: anterior
        plane: axial

  - id: anterior-commissure-temporal
    name: { en: Intertemporal projection through the anterior commissure, fr: Projection intertemporale par la commissure antérieure }
    summary:
      en: Follow a projection between corresponding regions of anterior auditory association cortex in the rhesus macaque. Locate its midline crossing on the human atlas.
      fr: Suivez une projection entre deux territoires homologues du cortex auditif associatif antérieur chez le macaque rhésus. Repérez son passage médian sur l’atlas humain.
    route:
      en: Right rostral auditory association cortex (TA) → right anterior commissure → left anterior commissure (across the midline) → left rostral auditory association cortex (TA)
      fr: Partie antérieure de l’aire auditive associative TA droite → commissure antérieure du côté droit → commissure antérieure du côté gauche (franchissement de la ligne médiane) → partie antérieure de l’aire auditive associative TA gauche
    scope:
      en: The rhesus macaque degeneration study described a projection to the opposite hemisphere. The human atlas illustrates it from right to left. Other anterior commissural branches, callosal auditory projections and other targets of rostral TA fall outside this route.
      fr: L’étude de dégénérescence axonale chez le macaque rhésus a décrit une projection vers l’hémisphère opposé. L’atlas humain l’illustre de droite à gauche. Les autres branches de la commissure antérieure, les projections auditives calleuses et les autres cibles de la partie rostrale de l’aire TA restent hors du parcours.
    clinical:
      en: Pflugshaupt and colleagues compared 55 people with left spatial neglect after a first right-hemisphere stroke with 55 healthy controls. The stroke group gave less plausible numerical estimates of everyday quantities. The right half of the anterior commissure, as defined in the study’s atlas, was one of four regions associated with impaired overall estimation in a separate region-based lesion analysis corrected for multiple comparisons. The effect of a lesion confined to this temporal branch remains unresolved.
      fr: Pflugshaupt et ses collègues ont comparé 55 personnes présentant une négligence spatiale gauche après un premier AVC de l’hémisphère droit à 55 témoins sains. Les personnes ayant subi un AVC donnaient des estimations numériques moins plausibles de grandeurs de la vie courante. Dans une analyse lésionnelle distincte par régions avec correction pour comparaisons multiples, la moitié droite de la commissure antérieure délimitée dans l’atlas de l’étude figurait parmi les quatre régions dont l’atteinte était associée aux difficultés globales d’estimation. L’effet d’une lésion limitée à cette branche temporale reste indéterminé.
    deficit: cognitive-estimation
    references: [anterior-commissure-rostral-ta-1969, anterior-commissure-rostral-ta-reappraisal, anterior-commissure-rostral-ta-case-context, anterior-commissure-superior-temporal-tracing, anterior-commissure-human-dissection, anterior-commissure-human-pallidal-course, cortical-parcellation, clinical-pflugshaupt-2020]
    clinical_references: [clinical-pflugshaupt-2020]
    steps:
      - id: right-rostral-ta
        region: hcp-mmp:right:123
        source_name: R_STGa_ROI
        name: { en: Right anterior superior temporal gyrus, fr: Partie antérieure du gyrus temporal supérieur droit }
        role: { en: Cortical origin of the branch, fr: Origine corticale de la branche }
        explanation:
          en: In the rhesus macaque, TA denotes auditory association cortex on the superior temporal gyrus and supratemporal plane. In the degeneration series, fibres from rostral auditory association cortex crossed mainly through the anterior commissure.
          fr: Chez le macaque rhésus, l’aire TA désigne le cortex auditif associatif du gyrus temporal supérieur et du plan supratemporal. Dans cette série expérimentale, les fibres du cortex auditif associatif rostral franchissaient la ligne médiane principalement par la commissure antérieure.
        mapping:
          en: Human HCP-MMP area STGa lies anterior to Heschl’s gyrus and lateral to area TA2. Its location provides a comparative landmark for the gyral part of the macaque field. The anatomical correspondence between the human parcel and the macaque field remains unresolved.
          fr: Chez l’humain, l’aire STGa du HCP-MMP se situe en avant du gyrus de Heschl et latéralement à l’aire TA2. Sa position fournit un repère comparatif pour la partie gyrale du territoire décrit chez le macaque. La correspondance anatomique entre ces deux territoires reste indéterminée.
        view: right
        plane: coronal
      - id: right-anterior-commissure
        region: nextbrain:right:10130
        source_name: anterior_commissure
        name: { en: Right side of the anterior commissure, fr: Partie droite de la commissure antérieure }
        role: { en: Approach to the midline, fr: Trajet vers la ligne médiane }
        explanation:
          en: In human dissections, the temporal extension of the posterior limb runs through the temporal stem toward the commissural body. Dissections of left human hemispheres place the posterior limb in Gratiolet’s canal below the anterior border of the globus pallidus.
          fr: Dans les dissections humaines, le contingent temporal de la branche postérieure passe par le pédoncule temporal en direction du corps de la commissure. Les dissections d’hémisphères gauches situent la branche postérieure dans le canal de Gratiolet, sous le bord antérieur du globus pallidus.
        mapping:
          en: NextBrain groups this side of the anterior commissure in one label. The label serves as a waypoint for the temporal fibres approaching the midline.
          fr: NextBrain représente ce côté de la commissure antérieure par un seul volume. Il sert de repère sur le trajet des fibres temporales vers la ligne médiane.
        view: anterior
        plane: sagittal
      - id: left-anterior-commissure
        region: nextbrain:left:130
        source_name: anterior_commissure
        name: { en: Left side of the anterior commissure, fr: Partie gauche de la commissure antérieure }
        role: { en: Passage into the left hemisphere, fr: Passage dans l’hémisphère gauche }
        explanation:
          en: The branch crosses the midline between the two atlas landmarks and enters the left hemisphere. In rhesus macaques, autoradiography places fibres from the superior temporal region in the ventral part of the commissure at the midline.
          fr: La branche franchit la ligne médiane entre les deux repères de l’atlas et gagne l’hémisphère gauche. Chez le macaque rhésus, l’autoradiographie situe les fibres issues de la région temporale supérieure dans la partie ventrale de la commissure au niveau du plan médian.
        mapping:
          en: The left NextBrain volume marks the opposite side of the same commissure. The atlas anchor lies lateral to the crossing.
          fr: Le volume NextBrain gauche repère le côté opposé de la même commissure. Le point de repère de l’atlas se situe latéralement au croisement.
        view: anterior
        plane: sagittal
      - id: left-rostral-ta
        region: hcp-mmp:left:123
        source_name: L_STGa_ROI
        name: { en: Left anterior superior temporal gyrus, fr: Partie antérieure du gyrus temporal supérieur gauche }
        role: { en: Contralateral cortical target, fr: Cible corticale controlatérale }
        explanation:
          en: In the same rhesus macaque degeneration series, the corresponding rostral part of TA was a target in the opposite hemisphere. The tour places this target on the left.
          fr: Dans la même série d’expériences chez le macaque rhésus, la partie rostrale homologue de l’aire TA constituait une cible dans l’hémisphère opposé. Le parcours situe cette cible à gauche.
        mapping:
          en: The left STGa parcel is a comparative landmark for the gyral part of the macaque target field. The macaque definition of TA also includes cortex on the supratemporal plane. The location of an equivalent human terminal field remains unresolved by these studies.
          fr: La parcelle STGa gauche sert de repère comparatif pour la partie gyrale du territoire cible chez le macaque. Chez cette espèce, l’aire TA s’étend aussi au plan supratemporal. Ces études laissent indéterminée la localisation d’un champ de terminaison équivalent chez l’humain.
        view: left
        plane: coronal

  - id: thalamocingulate-posterior
    name: { en: Anteroventral thalamic projection to the posterior cingulate cortex, fr: Du noyau antéroventral du thalamus au cortex cingulaire postérieur }
    summary:
      en: Follow a projection traced in macaques from the rostral part of the anteroventral thalamic nucleus to posteroventral area 23b. Use two right-sided landmarks in the human atlas to locate the regions at either end.
      fr: Suivez une projection mise en évidence par traçage chez le macaque, de la partie rostrale du noyau antéroventral du thalamus à l’aire 23b postéroventrale. Repérez les régions correspondantes à droite dans l’atlas humain.
    route:
      en: Right anteroventral thalamic nucleus → right ventral posterior cingulate cortex
      fr: Noyau antéroventral droit du thalamus → partie ventrale du cortex cingulaire postérieur droit
    scope:
      en: Human fibre dissection shows that the anterior thalamic radiations reach the cingulum. The precise white-matter course of the projection to area 23b remains unresolved. Other cingulate afferents and reciprocal projections lie outside this tour.
      fr: La dissection des fibres chez l’humain montre que les radiations thalamiques antérieures rejoignent le cingulum. Le trajet précis dans la substance blanche de la projection vers l’aire 23b reste indéterminé. Les autres afférences cingulaires et les projections réciproques sortent du cadre de ce parcours.
    clinical:
      en: In a post-mortem comparison of people with alcohol-related Wernicke encephalopathy, the group with Korsakoff amnesia had lower estimated neuron counts in the anterior principal thalamic nucleus than the group without amnesia. Both groups showed neuronal loss in the medial mammillary and mediodorsal thalamic nuclei. In a separate case, a 75-year-old woman had severe anterograde memory impairment after a left anterolateral thalamic infarct, with difficulty recalling short stories immediately and after a delay. MRI one month after the stroke showed anterior and lateral left thalamic foci and extensive white-matter changes consistent with small-vessel disease. The mammillothalamic tract appeared spared on MRI, according to the authors. The contribution of the specific thalamocingulate projection remains unresolved.
      fr: Dans une comparaison post-mortem chez des personnes atteintes d’une encéphalopathie de Wernicke liée à l’alcool, le nombre estimé de neurones du noyau principal antérieur du thalamus était plus faible dans le groupe présentant une amnésie de Korsakoff que dans le groupe sans amnésie. Les deux groupes présentaient une perte neuronale dans le noyau mamillaire médial et le noyau médiodorsal du thalamus. Dans une observation distincte, une patiente de 75 ans présentait une amnésie antérograde sévère après un infarctus thalamique antérolatéral gauche, avec notamment des difficultés au rappel immédiat et différé de courts récits. L’IRM à un mois montrait des foyers thalamiques gauches, l’un antérieur et l’autre latéral, ainsi que d’importantes anomalies de la substance blanche d’allure microangiopathique. Selon les auteurs, le faisceau mamillothalamique paraissait épargné à l’IRM. La contribution propre de cette projection thalamocingulaire reste indéterminée.
    deficit: amnesia
    references: [thalamocingulate-ventral-23b-tracing, thalamocingulate-cingulum-tracing, memory-mammillothalamic-dissection, cortical-parcellation, clinical-harding-2000, clinical-grulich-anterolateral-thalamus-2025]
    clinical_references: [clinical-harding-2000, clinical-grulich-anterolateral-thalamus-2025]
    steps:
      - id: anteroventral
        region: nextbrain:right:10220
        source_name: anteroventral_nucleus_of_thalamus
        name: { en: Right anteroventral thalamic nucleus, fr: Noyau antéroventral droit du thalamus }
        role: { en: Thalamic origin of the projection to posteroventral area 23b, fr: Origine thalamique de la projection vers l’aire 23b postéroventrale }
        explanation:
          en: In a separate macaque study, a tracer injection involving both the anteroventral and laterodorsal thalamic nuclei labelled fibres that travelled through the internal capsule and dorsal cingulum to the posterior cingulate cortex. The mixed injection identifies the route of the combined projections.
          fr: Dans une autre étude chez le macaque, une injection de traceur intéressant à la fois les noyaux antéroventral et latérodorsal du thalamus a marqué des fibres qui empruntaient la capsule interne et la portion dorsale du cingulum pour atteindre le cortex cingulaire postérieur. Cette injection renseigne sur le trajet des projections issues de l’ensemble des deux noyaux.
        mapping:
          en: NextBrain displays the entire anteroventral nucleus. The macaque neurons traced from posteroventral area 23b were in its rostral part.
          fr: NextBrain représente le noyau antéroventral dans son ensemble. Chez le macaque, les neurones marqués depuis l’aire 23b postéroventrale se trouvaient dans sa partie rostrale.
        view: superior
        plane: coronal
      - id: ventral-posterior-cingulate
        region: hcp-mmp:right:33
        source_name: R_v23ab_ROI
        name: { en: Right ventral posterior cingulate cortex, fr: Partie ventrale du cortex cingulaire postérieur droit }
        role: { en: Regional landmark for the cortical target, fr: Repère régional de la cible corticale }
        explanation:
          en: In macaques, a retrograde tracer injection involving posteroventral area 23b labelled neurons in the rostral part of the anteroventral thalamic nucleus.
          fr: Chez le macaque, une injection de traceur rétrograde intéressant l’aire 23b postéroventrale a marqué des neurones dans la partie rostrale du noyau antéroventral du thalamus.
        mapping:
          en: The human HCP-MMP parcel v23ab combines the ventral parts of areas 23a and 23b. It provides a regional landmark for the traced area 23b territory.
          fr: La parcelle v23ab de l’atlas humain HCP-MMP réunit les parties ventrales des aires 23a et 23b. Elle situe approximativement le territoire de l’aire 23b étudié par traçage.
        view: left
        plane: sagittal

  - id: vertical-occipital-v3a-v4
    name: { en: V3A to ventral V4 · comparison with the vertical occipital fasciculus, fr: De V3A à V4 ventrale · comparaison avec le faisceau occipital vertical }
    summary:
      en: Follow a projection from dorsal V3A to ventral V4 traced in macaques. Compare its cortical landmarks with the regions described in human studies of the vertical occipital fasciculus.
      fr: Suivez une projection de V3A dorsale vers V4 ventrale mise en évidence par traçage chez le macaque. Comparez ses repères corticaux aux régions décrites dans les études du faisceau occipital vertical chez l’humain.
    route:
      en: Dorsal V3A → peripheral upper-field sector of ventral V4 (macaque projection shown with left-sided landmarks in the human atlas)
      fr: V3A dorsale → secteur de V4 ventrale qui représente la périphérie du champ visuel supérieur (projection du macaque illustrée par des repères à gauche dans l’atlas humain)
    scope:
      en: In macaques, diffusion tractography places some estimated endpoints of the vertical occipital fasciculus near dorsal V3A and others near ventral V4. Human dissection follows the fasciculus toward the transverse occipital sulcus dorsally and the posterior fusiform gyrus ventrally. Human diffusion tractography estimates streamlines between the V3A and V4 atlas parcels. Using individual retinotopic maps, another study found estimated endpoints near V3A and V3B dorsally and near hV4 and VO-1 ventrally. The precise course of the traced macaque axons and the existence of the same directed projection in humans remain unresolved. The tour shows two cortical landmarks and describes the fasciculus for comparison.
      fr: Chez le macaque, la tractographie de diffusion situe des extrémités estimées du faisceau occipital vertical près de V3A dorsale et d’autres près de V4 ventrale. Chez l’humain, la dissection permet de suivre le faisceau vers le sillon occipital transverse dorsalement et vers le gyrus fusiforme postérieur ventralement. La tractographie de diffusion estime des trajectoires entre les parcelles V3A et V4 de l’atlas. Une autre étude a utilisé des cartes rétinotopiques individuelles pour situer des extrémités estimées près de V3A et de V3B dorsalement et près de hV4 et de VO-1 ventralement. Il reste à déterminer le trajet précis des axones marqués chez le macaque et à établir si la même projection existe dans le même sens chez l’humain. Le parcours présente deux repères corticaux et décrit le faisceau à titre de comparaison.
    clinical:
      en: Leff and colleagues compared structural MRI in six people with pure alexia and seven with hemianopic alexia after left occipital stroke. They selected patients with contrasting reading profiles. Both groups had damage in the medial left occipital lobe. The pure alexia group had additional damage in the posterior fusiform gyrus and adjacent tissue. In a separate case, letter-by-letter reading began during insertion of a tubular retractor to access a left occipitotemporal metastasis. At onset, intraoperative imaging localized the retractor to the course of the fasciculus estimated from preoperative diffusion MRI. The specific fibres affected in that case and the role of the V3A-to-V4 projection in reading remain unresolved.
      fr: Leff et ses collègues ont comparé les IRM structurelles de six personnes atteintes d’alexie pure et de sept personnes atteintes d’alexie hémianopsique après un AVC occipital gauche. Ils ont sélectionné des profils de lecture contrastés. Les deux groupes présentaient des lésions dans la partie médiale du lobe occipital gauche. Le groupe atteint d’alexie pure présentait aussi des lésions du gyrus fusiforme postérieur et des tissus adjacents. Dans un autre cas, une lecture lettre par lettre est apparue lors de l’insertion d’un écarteur tubulaire pour accéder à une métastase occipitotemporale gauche. À l’apparition du trouble, l’imagerie peropératoire situait l’écarteur sur le trajet du faisceau estimé par tractographie préopératoire. Les fibres atteintes dans ce cas et le rôle de la projection de V3A vers V4 dans la lecture restent indéterminés.
    deficit: alexia
    references: [visual-v3a-v4-tracing, vof-human-macaque, vof-vervet-histology, vof-human-dissection, vof-human-retinotopic-maps, cortical-parcellation, reading-lesions, clinical-sabsevitz-vof-alexia]
    clinical_references: [reading-lesions, clinical-sabsevitz-vof-alexia]
    steps:
      - id: v3a
        region: hcp-mmp:left:13
        source_name: L_V3A_ROI
        name: { en: Left visual area V3A, fr: Aire visuelle V3A gauche }
        role: { en: Dorsal source of the traced projection, fr: Origine dorsale de la projection tracée }
        explanation:
          en: A retrograde tracer injected into ventral V4 in a macaque labelled neurons in V3A. Polarized-light microscopy in vervet tissue identifies fibres of the vertical occipital fasciculus in the white matter near V3A and neighbouring dorsal visual areas.
          fr: Chez un macaque, un traceur rétrograde injecté dans V4 ventrale a marqué des neurones de V3A. Chez le vervet, la microscopie en lumière polarisée repère des fibres du faisceau occipital vertical dans la substance blanche près de V3A et des aires visuelles dorsales voisines.
        mapping:
          en: The HCP-MMP parcel covers left V3A in the human atlas. It gives an approximate landmark for the macaque region where neurons were labelled.
          fr: La parcelle HCP-MMP couvre V3A gauche dans l’atlas humain. Elle sert de repère approximatif pour la région où des neurones ont été marqués chez le macaque.
        view: posterior
        plane: axial
      - id: v4
        region: hcp-mmp:left:6
        source_name: L_V4_ROI
        name: { en: Left visual area V4, fr: Aire visuelle V4 gauche }
        role: { en: Ventral target of the traced projection, fr: Cible ventrale de la projection tracée }
        explanation:
          en: In macaque case 6p, the tracer was injected into ventral V4 at a site representing the upper visual field at 20° eccentricity. Human dissection follows fibres of the fasciculus toward the posterior transverse collateral sulcus, an anatomical landmark for the hV4/VO-1 boundary.
          fr: Chez le macaque du cas 6p, le site d’injection dans V4 ventrale correspondait à une excentricité de 20° dans le champ visuel supérieur. La dissection chez l’humain suit des fibres du faisceau jusqu’au sillon collatéral transverse postérieur, un repère anatomique de la limite entre hV4 et VO-1.
        mapping:
          en: The inferior part of HCP-MMP V4 largely overlaps hV4 as mapped by retinotopic fMRI in humans. The atlas shows the entire parcel, including its superior part.
          fr: La partie inférieure de V4 dans HCP-MMP recouvre largement hV4, délimitée par cartographie rétinotopique en IRM fonctionnelle chez l’humain. L’atlas montre la parcelle entière, y compris sa partie supérieure.
        view: inferior
        plane: coronal

  - id: slf2-dorsal-frontoparietal
    name: { en: Dorsal frontoparietal branch · SLF II, fr: Branche frontopariétale dorsale · faisceau longitudinal supérieur II }
    summary:
      en: Follow a projection traced in macaques from caudal area 8Ad to area Opt in the posterior inferior parietal lobule. Use two parcels in the right human hemisphere as landmarks for this comparison.
      fr: Suivez une projection mise en évidence par traçage chez le macaque, de la partie caudale de l’aire 8Ad à l’aire Opt de la partie postérieure du lobule pariétal inférieur. Prenez pour repères deux parcelles de l’hémisphère droit dans l’atlas humain.
    route:
      en: Caudal area 8Ad → area Opt via the superior longitudinal fasciculus II (macaque projection shown with right-sided landmarks in the human atlas)
      fr: Partie caudale de l’aire 8Ad → aire Opt par le faisceau longitudinal supérieur II (projection du macaque illustrée par des repères à droite dans l’atlas humain)
    scope:
      en: Human diffusion tractography estimates the broader course of the superior longitudinal fasciculus II between dorsolateral frontal cortex and posterior inferior parietal cortex. The precise endpoints and direction of the corresponding projection in humans remain unresolved. The tour shows two cortical landmarks. The intervening fibres and other branches lie outside the display.
      fr: Chez l’humain, la tractographie de diffusion estime le trajet d’ensemble du faisceau longitudinal supérieur II entre le cortex frontal dorsolatéral et la partie postérieure du cortex pariétal inférieur. Les extrémités précises et le sens de la projection correspondante chez l’humain restent indéterminés. Le parcours montre deux repères corticaux. Les fibres qui les relient et les autres branches ne sont pas affichées.
    clinical:
      en: Chechlacz and colleagues combined published lesion coordinates for left visual neglect. Their analysis of object-centred neglect excluding line bisection found convergence in the right angular gyrus, right temporoparietal junction and region of the right superior longitudinal fasciculus. Thiebaut de Schotten and colleagues studied 58 people in the subacute or chronic phase after stroke in the right middle cerebral artery territory. Chronic left spatial neglect was associated with lesions overlapping the estimated core of the right superior longitudinal fasciculus II in a diffusion MRI atlas, after adjusting for lesion volume and chronic visual field defects. The contribution of the specific projection shown here remains unresolved.
      fr: Chechlacz et ses collègues ont regroupé les coordonnées lésionnelles publiées pour la négligence visuelle gauche. Dans leur analyse de la négligence centrée sur l’objet, qui excluait les épreuves de bissection de lignes, les lésions convergeaient dans le gyrus angulaire droit, la jonction temporopariétale droite et la région du faisceau longitudinal supérieur droit. Thiebaut de Schotten et ses collègues ont étudié 58 personnes en phase subaiguë ou chronique après un AVC dans le territoire de l’artère cérébrale moyenne droite. La négligence spatiale gauche chronique était associée à des lésions recouvrant la partie centrale du faisceau longitudinal supérieur II droit, estimée par un atlas d’IRM de diffusion, après ajustement sur le volume lésionnel et les déficits chroniques du champ visuel. La contribution de la projection précise illustrée ici reste à déterminer.
    deficit: neglect
    references: [arcuate-caudal-prefrontal-tracing, slf2-macaque-route-account, slf2-macaque-pathway, slf3-probabilistic-endpoints, slf3-inferior-parietal-comparative-architectonics, cortical-parcellation, clinical-chechlacz-2012, clinical-thiebaut-de-schotten-slf2-2014]
    clinical_references: [clinical-chechlacz-2012, clinical-thiebaut-de-schotten-slf2-2014]
    steps:
      - id: area-8ad
        region: hcp-mmp:right:68
        source_name: R_8Ad_ROI
        name: { en: Right frontal area 8Ad, fr: Aire frontale 8Ad droite }
        role: { en: Frontal origin of the traced projection, fr: Origine frontale de la projection tracée }
        explanation:
          en: In their later account of macaque tracing, Yeterian and colleagues describe axons from caudal area 8Ad reaching area Opt through the superior longitudinal fasciculus II. The bundle runs deep to the upper lip of the lateral sulcus.
          fr: Dans leur synthèse ultérieure des traçages chez le macaque, Yeterian et ses collègues décrivent des axones issus de la partie caudale de l’aire 8Ad qui atteignent l’aire Opt par le faisceau longitudinal supérieur II. Le faisceau chemine dans la substance blanche en profondeur par rapport à la lèvre supérieure du sillon latéral.
        mapping:
          en: HCP-MMP takes the name 8Ad from comparative architectonic work. The label shows the whole right human parcel.
          fr: La dénomination 8Ad de HCP-MMP vient de travaux d’architectonique comparative. L’étiquette couvre toute la parcelle humaine droite.
        view: right
        plane: coronal
      - id: area-pgp
        region: hcp-mmp:right:143
        source_name: R_PGp_ROI
        name: { en: Right inferior parietal area PGp, fr: Aire pariétale inférieure PGp droite }
        role: { en: Regional landmark for the traced parietal target, fr: Repère régional de la cible pariétale tracée }
        explanation:
          en: Area Opt lies at the caudal end of the macaque inferior parietal lobule. The account by Yeterian and colleagues identifies Opt as one of the parietal territories reached through the superior longitudinal fasciculus II from caudal area 8Ad.
          fr: L’aire Opt se situe à l’extrémité caudale du lobule pariétal inférieur chez le macaque. La synthèse de Yeterian et de ses collègues décrit l’aire Opt comme l’un des territoires pariétaux atteints par des fibres de la partie caudale de l’aire 8Ad empruntant le faisceau longitudinal supérieur II.
        mapping:
          en: A receptor architecture comparison found macaque Opt more similar to human cytoarchitectonic PGp than to PGa. The HCP-MMP parcel is smaller than the cytoarchitectonic PGp and gives a regional landmark for that comparison.
          fr: Les profils de récepteurs de l’aire Opt du macaque étaient plus proches de ceux de l’aire cytoarchitectonique humaine PGp que de ceux de l’aire PGa. La parcelle HCP-MMP est plus petite que l’aire cytoarchitectonique PGp et sert de repère régional pour cette comparaison.
        view: right
        plane: coronal

  - id: inferior-pulvinar-mt
    name: { en: Inferior pulvinar projection to visual area MT, fr: Projection du pulvinar inférieur vers l’aire visuelle MT }
    summary:
      en: Follow a projection from the medial subdivision of the inferior pulvinar to visual area MT identified in macaques. Locate its two endpoints using right-sided landmarks in the human atlas.
      fr: Suivez une projection de la subdivision médiale du pulvinar inférieur vers l’aire visuelle MT mise en évidence chez le macaque. Repérez ses deux extrémités à l’aide de repères de l’hémisphère droit dans l’atlas humain.
    route:
      en: Medial subdivision of the inferior pulvinar → visual area MT (macaque projection shown with right-sided landmarks in the human atlas)
      fr: Subdivision médiale du pulvinar inférieur → aire visuelle MT (projection chez le macaque, illustrée par des repères de l’hémisphère droit dans l’atlas humain).
    scope:
      en: In macaques, some neurons in this subdivision receive input from the superior colliculus and project to MT. The display follows the forward projection from PIm to MT. The superior colliculus, other pulvinar subdivisions and cortical feedback lie outside the display. In humans, diffusion tractography estimated ipsilateral streamlines between pulvinar and MT regions defined using Jülich atlas masks. The precise terminal fields and direction of transmission in humans remain undetermined.
      fr: Chez le macaque, certains neurones de cette subdivision reçoivent des afférences du colliculus supérieur et se projettent vers l’aire MT. Le parcours suit la projection de la PIm vers l’aire MT. Le colliculus supérieur, les autres subdivisions du pulvinar et les projections de retour du cortex sont hors du parcours. Chez l’humain, la tractographie de diffusion a estimé des trajectoires entre les régions du pulvinar et de l’aire MT du même hémisphère, délimitées à l’aide de masques de l’atlas de Jülich. Les champs de terminaison précis et le sens de transmission chez l’humain restent à établir.
    clinical:
      en: At follow-up, L.M. still had marked difficulty perceiving visual motion after bilateral posterior brain injury. MRI showed bilateral lesions involving the upper parts of the occipital gyri and adjacent portions of the middle temporal gyri, with occipital and occipitoparietal white-matter changes. The effect of injury limited to the inferior pulvinar or its projection to MT remains unresolved.
      fr: Au suivi, L.M. présentait toujours un trouble marqué de la perception visuelle du mouvement après des lésions cérébrales postérieures bilatérales. L’IRM montrait des lésions bilatérales de la partie supérieure des gyrus occipitaux et des portions adjacentes des gyrus temporaux moyens, ainsi que des anomalies de la substance blanche occipitale et occipitopariétale. L’effet d’une lésion limitée au pulvinar inférieur ou à sa projection vers l’aire MT reste indéterminé.
    deficit: akinetopsia
    references: [pulvinar-mt-macaque-tracing, pulvinar-mt-macaque-physiology, human-inferior-pulvinar-chemoarchitecture, pulvinar-mt-human-diffusion, cortical-parcellation, clinical-zihl-1991]
    clinical_references: [clinical-zihl-1991]
    steps:
      - id: inferior-pulvinar
        region: nextbrain:right:10519
        source_name: inferior_nucleus_of_pulvinar
        name: { en: Right inferior pulvinar, fr: Pulvinar inférieur droit }
        role: { en: Thalamic origin of the traced projection, fr: Origine thalamique de la projection étudiée }
        explanation:
          en: Retrograde tracers injected into macaque MT labelled neurons in the medial subdivision of the inferior pulvinar (PIm). The injections probably also reached part of the adjacent area FST. Histochemical staining of human tissue identified a region comparable to macaque PIm.
          fr: Des traceurs rétrogrades injectés dans l’aire MT du macaque ont marqué des neurones de la subdivision médiale du pulvinar inférieur (PIm). Les injections ont probablement aussi atteint une partie de l’aire voisine FST. Des colorations histochimiques du tissu humain ont mis en évidence une région comparable à la subdivision PIm du macaque.
        mapping:
          en: The NextBrain label outlines the right inferior pulvinar as a whole. It serves as a regional landmark for the medial subdivision studied in macaques.
          fr: L’étiquette NextBrain délimite l’ensemble du pulvinar inférieur droit. Elle sert de repère régional pour la subdivision médiale étudiée chez le macaque.
        view: posterior
        plane: coronal
      - id: mt
        region: hcp-mmp:right:23
        source_name: R_MT_ROI
        name: { en: Right middle temporal visual area (MT or V5), fr: Aire visuelle temporale moyenne droite (MT ou V5) }
        role: { en: Cortical target of the traced projection, fr: Cible corticale de la projection étudiée }
        explanation:
          en: In macaques, stimulation in MT elicited antidromic responses in pulvinar neurons, identifying axons projecting toward MT. By matching recording sites to stained sections in the right hemisphere of one macaque, the investigators localized some relay neurons from the superior colliculus to MT in PIm and others in the adjacent posterior subdivision, PIp.
          fr: Chez le macaque, la stimulation de l’aire MT a déclenché des réponses antidromiques dans des neurones du pulvinar, révélant leur projection vers cette aire. En reportant les sites d’enregistrement sur les coupes colorées de l’hémisphère droit d’un macaque, les chercheurs ont situé certains neurones relais du colliculus supérieur vers l’aire MT dans la subdivision PIm et d’autres dans la subdivision postérieure voisine, PIp.
        mapping:
          en: The HCP-MMP parcel marks MT within the wider human MT+ complex. It provides a cortical landmark for the macaque target.
          fr: La parcelle HCP-MMP situe MT au sein du complexe MT+ humain, plus étendu. Elle sert de repère cortical pour la cible étudiée chez le macaque.
        view: right
        plane: axial

  - id: rubrospinal-crossed
    name: { en: Rubrospinal descent and crossing, fr: Descente rubrospinale et décussation }
    summary:
      en: Follow the rubrospinal projection from the right red nucleus across the midline to the left upper cervical cord.
      fr: Suivez la projection rubrospinale issue du noyau rouge droit, qui franchit la ligne médiane et descend du côté gauche de la moelle cervicale haute.
    route:
      en: Right red nucleus → left upper cervical rubrospinal tract after the midbrain crossing
      fr: Noyau rouge droit → faisceau rubrospinal gauche dans la moelle cervicale haute après la décussation mésencéphalique
    scope:
      en: In macaques, tracer studies identified the origin and cervical targets of this projection. In a series of ten human anatomical cases, few rubrospinal fibres could be traced into the cord. These were usually traceable only in the upper cervical segments. The crossing, intervening brainstem course and spinal terminations lie outside the displayed landmarks.
      fr: Chez le macaque, les études de traçage ont identifié l’origine et les cibles cervicales de cette projection. Dans une série anatomique de dix cas humains, peu de fibres rubrospinales ont pu être suivies jusque dans la moelle épinière. Leur suivi se limitait généralement aux segments cervicaux supérieurs. La décussation, le trajet intermédiaire dans le tronc cérébral et les terminaisons médullaires ne font pas l’objet de repères distincts.
    clinical:
      en: In a retrospective series of 29 people with Holmes tremor, 17 had midbrain lesions. Most patients had lesions involving more than one region. In a separate case with tremor of the left arm and leg, susceptibility-weighted MRI showed a microbleed near the right red nucleus. Dopamine transporter imaging also showed markedly reduced uptake in the right basal ganglia. In another patient, Holmes tremor developed after a pontine haemorrhage accompanied by quadriparesis. T2-weighted MRI one day after the haemorrhage showed hyperintensity around the red nuclei. The authors attributed the signal to axonal oedema in cerebellothalamic fibres, with apparent sparing of nearby midbrain structures. These studies leave the role of an isolated rubrospinal tract injury unresolved.
      fr: Dans une série rétrospective de 29 personnes présentant un tremblement de Holmes, 17 avaient une lésion du mésencéphale. Chez la plupart des patients, les lésions touchaient plusieurs régions. Dans une autre observation, une personne présentait un tremblement du bras et de la jambe gauches. L’IRM pondérée en susceptibilité magnétique montrait un microsaignement près du noyau rouge droit. L’imagerie du transporteur de la dopamine montrait aussi une nette diminution de la fixation du traceur dans les noyaux gris centraux droits. Chez un autre patient, un tremblement de Holmes est apparu après une hémorragie pontique accompagnée d’une tétraparésie. L’IRM pondérée en T2 réalisée le lendemain de l’hémorragie montrait un hypersignal autour des noyaux rouges. Les auteurs ont interprété cet hypersignal comme un œdème axonal des fibres cérébellothalamiques, avec un respect apparent des structures mésencéphaliques voisines. Ces études laissent indéterminé le rôle d’une lésion isolée du faisceau rubrospinal.
    deficit: holmes-tremor
    references: [rubrospinal-human-anatomy, rubrospinal-macaque-origin, rubrospinal-macaque-cervical, rubrospinal-midbrain-crossing, rubrospinal-red-nucleus-histology, rubrospinal-human-dye-labelling, spinocerebellar-human-tractography, clinical-raina-holmes-tremor-2016, clinical-nieuwhof-holmes-tremor-2020, clinical-genc-holmes-tremor-2017]
    clinical_references: [clinical-raina-holmes-tremor-2016, clinical-nieuwhof-holmes-tremor-2020, clinical-genc-holmes-tremor-2017]
    steps:
      - id: red-nucleus
        region: nextbrain:right:10385
        source_name: red_nucleus
        name: { en: Right red nucleus, fr: Noyau rouge droit }
        role: { en: Origin of the crossed spinal projection, fr: Origine de la projection spinale croisée }
        explanation:
          en: In macaques, retrograde tracing from the spinal cord labelled neurons in the magnocellular part of the red nucleus. In human tissue, histology identified small clusters of magnocellular neurons at the caudal edge of the parvocellular part or farther caudally. In a human postmortem study, dye placed in the caudal red nucleus spread into nearby tissue and labelled fibres at the ventral tegmental decussation. The authors described the labelled crossing as a group of rubrobulbar and rubrospinal fibres.
          fr: Chez le macaque, des traceurs rétrogrades injectés dans la moelle épinière ont marqué des neurones de la partie magnocellulaire du noyau rouge. Dans le tissu humain, l’histologie a révélé de petits groupes de neurones magnocellulaires au bord caudal de la partie parvocellulaire ou plus caudalement. Dans une étude post mortem chez l’humain, un colorant déposé dans la partie caudale du noyau rouge a diffusé dans les tissus voisins et a marqué des fibres à la décussation tegmentale ventrale. Les auteurs ont attribué ce marquage à un ensemble de fibres rubrobulbaires et rubrospinales.
        mapping:
          en: NextBrain labels the right red nucleus as one region. It provides a regional landmark for the small magnocellular subdivision.
          fr: NextBrain représente le noyau rouge droit par un seul volume. Celui-ci sert de repère pour la petite subdivision magnocellulaire.
        view: left
        plane: axial
      - id: cervical-tract
        region: pam50:left:rubrospinal-tract
        source_name: left rubrospinal tract
        name: { en: Left cervical rubrospinal tract, fr: Faisceau rubrospinal cervical gauche }
        role: { en: Descent on the left after the crossing, fr: Descente à gauche après la décussation }
        explanation:
          en: Fibres from the right red nucleus cross the midline at the ventral tegmental decussation in the caudal midbrain and descend on the left. In a pilot study of four healthy volunteers, diffusion tractography using a region of interest in the mediocaudal red nucleus estimated a crossed course into the lateral funiculus of the cervical cord. These reconstructions leave the direction of signal travel and the spinal endings of individual axons unresolved. In rhesus macaques, an anterograde tracer injected into the red nucleus labelled terminals in the ventral horn of the cervical enlargement.
          fr: Les fibres issues du noyau rouge droit franchissent la ligne médiane à la décussation tegmentale ventrale du mésencéphale caudal, puis descendent à gauche. Dans une étude pilote menée chez quatre volontaires sains, une tractographie de diffusion utilisant une région d’intérêt dans la partie médiocaudale du noyau rouge a permis d’estimer un trajet croisé jusque dans le cordon latéral de la moelle cervicale. Le sens de propagation des signaux et les terminaisons médullaires des axones restent indéterminés avec cette méthode. Chez le macaque rhésus, un traceur antérograde injecté dans le noyau rouge a marqué des terminaisons dans la corne ventrale du renflement cervical.
        mapping:
          en: The registered PAM50 atlas estimates the location of the left rubrospinal territory in the lateral funiculus. The cord display spans vertebral level C1 through part of C5.
          fr: L’atlas PAM50 recalé sur la moelle situe approximativement le territoire rubrospinal gauche dans le cordon latéral. La portion de moelle affichée s’étend du niveau vertébral C1 jusqu’à une partie de C5.
        view: anterior
        plane: axial

  - id: mediodorsal-prefrontal
    name: { en: Mediodorsal thalamic projection to dorsal prefrontal cortex, fr: Projection du thalamus médiodorsal vers le cortex préfrontal dorsal }
    summary:
      en: Follow a projection from the parvocellular part of the mediodorsal thalamic nucleus to dorsal area 46, identified by tracing in macaques.
      fr: Suivez une projection de la partie parvocellulaire du noyau médiodorsal du thalamus vers la partie dorsale de l’aire 46, mise en évidence par traçage chez le macaque.
    route:
      en: Left parvocellular mediodorsal thalamic nucleus → middle portion of left dorsal area 46
      fr: Partie parvocellulaire du noyau médiodorsal gauche du thalamus → portion moyenne de la partie dorsale de l’aire 46 gauche
    scope:
      en: The two landmarks represent an ipsilateral projection traced in macaques. A human diffusion tractography study used the whole mediodorsal nucleus as its thalamic seed and estimated streamlines connecting it to area 9-46d through the anterior limb of the internal capsule. A separate human tractography study compared four regions of the mediodorsal nucleus defined by diffusion data. The estimated connectivity to area 46 in the Brainnetome atlas was stronger for the dorsal region than for the medial and central regions. The dorsal and lateral estimates did not differ significantly. That study used different boundaries for both the thalamic and cortical regions. The exact course, endpoints and direction of the corresponding human projection remain unresolved. The streamlines drawn are the whole left anterior thalamic radiation, not this projection alone. The tour omits other thalamic inputs to dorsal area 46.
      fr: Les deux repères représentent une projection ipsilatérale mise en évidence par traçage chez le macaque. Une étude de tractographie de diffusion chez l’humain a pris l’ensemble du noyau médiodorsal comme région de départ thalamique et a estimé des trajectoires reliant ce noyau à l’aire 9-46d par le bras antérieur de la capsule interne. Une autre étude de tractographie chez l’humain a comparé quatre territoires du noyau médiodorsal délimités à partir de données de diffusion. La connectivité estimée avec l’aire 46 de l’atlas Brainnetome était plus forte pour le territoire dorsal que pour les territoires médial et central. La différence entre les territoires dorsal et latéral n’atteignait pas le seuil de signification statistique. Cette étude utilisait d’autres délimitations pour les territoires thalamique et cortical. Le trajet précis, les extrémités et le sens de la projection correspondante chez l’humain restent indéterminés. Les trajectoires affichées sont l’ensemble de la radiation thalamique antérieure gauche, et non cette seule projection. Le parcours laisse de côté les autres afférences thalamiques de la partie dorsale de l’aire 46.
    clinical:
      en: Seven veterans with focal lesions involving the left dorsolateral prefrontal cortex scored below healthy veterans on letter–number sequencing. The task requires recalling digits in numerical order followed by letters in alphabetical order. The overall four-group comparison yielded p = 0.05. The only reported significant pairwise difference on this task was against healthy controls. In the broader dorsolateral prefrontal lesion sample, overlap was greatest in Brodmann area 9. In Bellebaum’s series of 13 adults with focal thalamic infarcts, one patient’s backward digit span score four months after stroke was 2.19 standard deviations below the healthy control mean. Follow-up MRI showed a left mediodorsal thalamic lesion. Initial MRI also showed oedema near the left red nucleus. The authors observed no clear pattern of neuropsychological deficits by lesion location across the series. In Geier’s separate 22-person chronic thalamic stroke group, working memory was impaired at the group level. Lesions extended into several other thalamic nuclei across the group, and the authors found no detectable association between cognitive impairment and mediodorsal damage specifically. These studies leave the effects of selective injury to this projection unresolved.
      fr: Sept anciens combattants présentant des lésions focales touchant le cortex préfrontal dorsolatéral gauche ont obtenu de moins bons résultats que des anciens combattants sans lésion cérébrale à l’épreuve de séquences lettres–chiffres. L’épreuve demande de rappeler les chiffres dans l’ordre numérique, puis les lettres dans l’ordre alphabétique. La comparaison globale des quatre groupes donnait p = 0,05. Sur cette épreuve, la seule différence significative rapportée concernait la comparaison avec les témoins sains. Dans l’ensemble du groupe présentant des lésions préfrontales dorsolatérales, le chevauchement lésionnel était maximal dans l’aire 9 de Brodmann. Dans la série de Bellebaum, qui comprenait 13 adultes présentant un infarctus thalamique focal, une patiente testée quatre mois après l’AVC a obtenu à l’épreuve d’empan de chiffres en ordre inverse un score inférieur de 2,19 écarts-types à la moyenne des témoins sains. L’IRM de suivi montrait une lésion du noyau médiodorsal gauche du thalamus. L’IRM initiale montrait aussi un œdème près du noyau rouge gauche. Dans cette série, les auteurs n’ont pas observé de profil neuropsychologique clairement lié au siège des lésions. Dans la série distincte de Geier, les 22 personnes en phase chronique après un AVC thalamique présentaient, à l’échelle du groupe, un déficit de mémoire de travail. Les lésions touchaient aussi plusieurs autres noyaux thalamiques dans ce groupe. Les auteurs n’ont pas détecté d’association spécifique entre l’atteinte du noyau médiodorsal et les troubles cognitifs. Les effets d’une lésion sélective de cette projection restent indéterminés.
    deficit: working-memory
    references: [mediodorsal-prefrontal-macaque-tracing, mediodorsal-prefrontal-human-diffusion, mediodorsal-prefrontal-human-subdivision, cortical-parcellation, clinical-barbey-working-memory-2013, clinical-bellebaum-thalamic-working-memory-2005, clinical-geier-mediodorsal-stroke-2026]
    clinical_references: [clinical-barbey-working-memory-2013, clinical-bellebaum-thalamic-working-memory-2005, clinical-geier-mediodorsal-stroke-2026]
    steps:
      - id: parvocellular-mediodorsal
        region: nextbrain:left:313
        source_name: parvocellular_(central)_division_of_md
        tract: atr-left
        name: { en: Parvocellular division of the left mediodorsal thalamic nucleus, fr: Partie parvocellulaire du noyau médiodorsal gauche du thalamus }
        role: { en: Thalamic source of the projection, fr: Origine thalamique de la projection }
        explanation:
          en: In macaques, retrograde tracer injections into dorsal area 46 labelled neurons mainly in the middle of the dorsal part of the parvocellular division.
          fr: Chez le macaque, les injections de traceur rétrograde dans l’aire 46 dorsale ont surtout marqué des neurones dans la portion moyenne de la partie dorsale de la division parvocellulaire.
        mapping:
          en: NextBrain labels the whole parvocellular division. The traced neurons were concentrated in a subregion of this division.
          fr: NextBrain délimite l’ensemble de la division parvocellulaire. Les neurones marqués se concentraient dans une région de cette division.
        view: anterior
        plane: coronal
      - id: dorsal-prefrontal
        region: hcp-mmp:left:86
        source_name: L_9-46d_ROI
        tract: atr-left
        name: { en: Left dorsolateral prefrontal cortex (9-46d), fr: Cortex préfrontal dorsolatéral gauche (9-46d) }
        role: { en: Cortical target of the traced projection, fr: Cible corticale de la projection mise en évidence par traçage }
        explanation:
          en: In one macaque, a tracer injection in the middle portion of left dorsal area 46 labelled thalamic neurons on the same side. The labelled cell bodies identify the source of fibres projecting to the injected cortical region.
          fr: Chez un macaque, une injection de traceur dans la portion moyenne de l’aire 46 dorsale gauche a marqué des neurones thalamiques du même côté. Les corps cellulaires marqués indiquent l’origine des fibres qui se projettent vers la région corticale injectée.
        mapping:
          en: HCP-MMP area 9-46d lies in the central part of the human dorsolateral prefrontal cortex. It provides a regional comparison for the injection site in the dorsal part of Walker’s area 46 in the macaque.
          fr: L’aire 9-46d de la parcellisation HCP-MMP se situe dans la partie centrale du cortex préfrontal dorsolatéral humain. Elle sert de repère régional pour le site d’injection dans la partie dorsale de l’aire 46 de Walker chez le macaque.
        view: left
        plane: coronal

  - id: dorsal-spinocerebellar
    name: { en: Dorsal spinocerebellar entry into the cerebellum, fr: Entrée cérébelleuse du faisceau spinocérébelleux dorsal }
    summary:
      en: Follow the same-side branch of the dorsal spinocerebellar tract from the inferior cerebellar peduncle to the anterior vermis. The right-sided landmarks illustrate the course described in macaques.
      fr: Suivez la branche ipsilatérale du faisceau spinocérébelleux dorsal du pédoncule cérébelleux inférieur jusqu’au vermis antérieur. Les repères droits illustrent le trajet décrit chez le macaque.
    route:
      en: Restiform body of the right inferior cerebellar peduncle → right part of the anterior cerebellar vermis
      fr: Corps restiforme du pédoncule cérébelleux inférieur droit → partie droite du vermis cérébelleux antérieur
    scope:
      en: The spinal origin and ascent, other cerebellar destinations and fibres that cross within the cerebellum lie outside the tour. A human diffusion tractography atlas estimated streamlines using two regions of interest on the same side, the inferior cerebellar peduncle at upper medullary level and the cerebellar hemisphere on the same axial slice. The reconstruction estimates the regional course and leaves the spinal origins and specific vermal terminal field unresolved.
      fr: Le parcours laisse de côté l’origine et l’ascension spinales, les autres cibles cérébelleuses et les fibres qui croisent dans le cervelet. Un atlas de tractographie de diffusion chez l’humain a estimé des trajectoires à partir de deux régions d’intérêt du même côté, le pédoncule cérébelleux inférieur à hauteur du bulbe rostral et l’hémisphère cérébelleux sur la même coupe axiale. La reconstruction donne une estimation du trajet régional et laisse indéterminés l’origine spinale des fibres et leur territoire précis de terminaison dans le vermis.
    clinical:
      en: In 21 adults examined 2–56 days after cerebellar infarction, Schoch and colleagues found the strongest association with gait ataxia in vermal lobule III. The associated area extended into vermal and paravermal white matter and the fastigial and interposed nuclei. In a series of 49 adults with acute limb ataxia after isolated unilateral brainstem infarction, Marx and colleagues associated limb ataxia on the side of the lesion with rostral dorsolateral medullary lesions overlapping the inferior cerebellar peduncle and the dorsal and ventral spinocerebellar tracts. Naoi and colleagues observed right-leg ataxia and rightward body lateropulsion in a 69-year-old man. MRI showed an infarct initially limited to the right lateral surface of the lower medulla that had enlarged by day 3. Day-4 motion analysis showed dysmetria during repeated right heel taps on the opposite knee. Finger-to-nose testing was normal. The authors inferred possible involvement of nearby dorsal spinocerebellar fibres. The effects of injury restricted to those fibres remain unresolved.
      fr: Chez 21 adultes examinés de 2 à 56 jours après un infarctus cérébelleux, Schoch et ses collègues ont relevé l’association la plus forte avec l’ataxie de la marche dans le lobule vermien III. La zone associée s’étendait à la substance blanche vermienne et paravermienne ainsi qu’aux noyaux fastigiaux et interposés. Dans une série de 49 adultes présentant une ataxie aiguë des membres après un infarctus unilatéral limité au tronc cérébral, Marx et ses collègues ont associé l’ataxie des membres du côté de la lésion à des lésions dorsolatérales du bulbe rostral chevauchant le pédoncule cérébelleux inférieur et les faisceaux spinocérébelleux dorsal et ventral. Naoi et ses collègues ont observé une ataxie du membre inférieur droit et une latéropulsion vers la droite chez un homme de 69 ans. L’IRM a montré un infarctus initialement limité à la surface latérale droite du bulbe caudal, puis une extension de l’infarctus au troisième jour. Au quatrième jour, l’analyse du mouvement a mis en évidence une dysmétrie lors de contacts répétés du talon droit avec le genou opposé. L’épreuve doigt-nez était normale. Les auteurs ont déduit de la topographie de l’infarctus une possible atteinte des fibres spinocérébelleuses dorsales voisines. Les effets d’une atteinte limitée à ces fibres restent indéterminés.
    deficit: ataxia
    references: [spinocerebellar-cord-course, spinocerebellar-macaque-peduncular-course, dorsal-spinocerebellar-human-tractography, clinical-schoch-2006, clinical-marx-2008, clinical-naoi-2025]
    clinical_references: [clinical-schoch-2006, clinical-marx-2008, clinical-naoi-2025]
    steps:
      - id: inferior-peduncle
        region: learning:right:inferior-cerebellar-peduncle
        source_name: Inferior cerebellar peduncle
        tract: icp-right
        name: { en: Right inferior cerebellar peduncle, fr: Pédoncule cérébelleux inférieur droit }
        role: { en: Entry of dorsal spinocerebellar fibres, fr: Entrée des fibres spinocérébelleuses dorsales }
        explanation:
          en: In cats, retrograde tracing after spinal cord or restiform body lesions identified dorsal spinocerebellar fibres from thoracic and upper lumbar levels passing through the restiform body. In one macaque, a lesion targeting the left dorsal tract at C2 produced degeneration that the author followed into the left inferior cerebellar peduncle.
          fr: Chez le chat, le traçage rétrograde après des lésions de la moelle épinière ou du corps restiforme a mis en évidence des fibres spinocérébelleuses dorsales issues des segments thoraciques et lombaires supérieurs qui passent par le corps restiforme. Chez un macaque, une lésion ciblant le faisceau dorsal gauche à hauteur de C2 a entraîné une dégénérescence que l’auteur a suivie jusque dans le pédoncule cérébelleux inférieur gauche.
        mapping:
          en: This teaching volume is NextBrain’s outline of the whole right inferior cerebellar peduncle. The dorsal spinocerebellar tract occupies part of this region.
          fr: Ce volume pédagogique reprend le contour de l’ensemble du pédoncule cérébelleux inférieur droit dans NextBrain. Le faisceau spinocérébelleux dorsal n’occupe qu’une partie de ce volume.
        view: posterior
        plane: axial
      - id: anterior-vermis
        region: learning:lobules-i-iv-right
        source_name: Lobules I–IV
        name: { en: Right cerebellar lobules I–IV, fr: Lobules cérébelleux I à IV droits }
        role: { en: Landmark for the same-side anterior vermal terminal field, fr: Repère du territoire de terminaison dans le vermis antérieur du même côté }
        explanation:
          en: After this left-sided lesion, degeneration of dorsal spinocerebellar fibres was greatest in vermal lobules II and III, with fewer fibres reaching lobule IV. The right-sided landmarks mirror the same-side branch documented on the left.
          fr: Après cette lésion à gauche, la dégénérescence des fibres spinocérébelleuses dorsales était surtout marquée dans les lobules vermiens II et III et atteignait le lobule IV dans une moindre mesure. Les repères droits illustrent en miroir la branche ipsilatérale observée à gauche.
        mapping:
          en: CerebNet groups the right hemispheric lobules I–IV with the corresponding part of the anterior vermis, giving a regional landmark for the more restricted vermal field.
          fr: CerebNet regroupe les lobules hémisphériques I à IV droits et la partie correspondante du vermis antérieur. Cette parcelle sert de repère pour le territoire vermien, plus restreint.
        view: superior
        plane: coronal

  - id: mdlf-parietotemporal
    name: { en: Parietotemporal branch · middle longitudinal fasciculus, fr: Branche pariétotemporale · faisceau longitudinal moyen }
    summary:
      en: Follow a projection traced in rhesus macaques from the caudal inferior parietal lobule to the upper bank of the superior temporal sulcus. Use two left-sided landmarks in the human atlas to locate the regions compared.
      fr: Suivez une projection décrite par traçage chez le macaque rhésus, de la partie caudale du lobule pariétal inférieur à la berge supérieure du sillon temporal supérieur. Repérez les régions comparées du côté gauche dans l’atlas humain.
    route:
      en: Caudal inferior parietal lobule (PG–Opt injection region) → area TPO in the upper bank of the superior temporal sulcus via the middle longitudinal fasciculus (ipsilateral projection traced in a rhesus macaque)
      fr: Partie caudale du lobule pariétal inférieur (site d’injection PG–Opt) → aire TPO de la berge supérieure du sillon temporal supérieur, par le faisceau longitudinal moyen (projection ipsilatérale étudiée par traçage chez un macaque rhésus)
    scope:
      en: One human dissection study described fibres of the middle longitudinal fasciculus between the angular gyrus and the superior and middle temporal gyri. A second dissection study found fibres of the fasciculus above the superior temporal sulcus, at the level of the superior part of the angular gyrus. A third dissection study reported superior parietal and occipital endpoints. The exact cortical endpoints and direction of the displayed branch in humans remain unresolved. The tour shows the two cortical landmarks and leaves out the connecting white matter and the other branches.
      fr: Une étude de dissection chez l’humain a décrit des fibres du faisceau longitudinal moyen entre le gyrus angulaire et les gyrus temporaux supérieur et moyen. Une deuxième étude de dissection a situé des fibres du faisceau au-dessus du sillon temporal supérieur, à hauteur de la partie supérieure du gyrus angulaire. Une troisième étude de dissection a décrit des terminaisons dans le lobule pariétal supérieur et le cortex occipital. Les extrémités corticales précises et le sens de la branche illustrée restent indéterminés chez l’humain. Le parcours présente les deux repères corticaux et laisse de côté la substance blanche qui les relie ainsi que les autres branches.
    clinical:
      en: Dronkers and colleagues studied 64 people with chronic left-hemisphere stroke. In their voxelwise analysis, poorer sentence comprehension was associated with lesions in several left-hemisphere regions, including a region spanning the posterior superior temporal sulcus and the angular gyrus. The effect of injury confined to this branch remains unresolved.
      fr: Dronkers et ses collègues ont étudié 64 personnes en phase chronique après un AVC de l’hémisphère gauche. Dans leur analyse voxel par voxel, de moins bons résultats à une épreuve de compréhension de phrases étaient associés à des lésions de plusieurs régions de l’hémisphère gauche, dont une région qui s’étend de la partie postérieure du sillon temporal supérieur au gyrus angulaire. L’effet d’une atteinte limitée à cette branche reste indéterminé.
    deficit: aphasia
    references: [mdlf-macaque-parietotemporal-tracing, slf2-macaque-pathway, mdlf-macaque-temporal-retrograde, mdlf-human-parietal-dissection, mdlf-human-superior-angular-dissection, mdlf-human-dissection-terminations, destrieux-parcellation, clinical-dronkers-2004]
    clinical_references: [clinical-dronkers-2004]
    steps:
      - id: caudal-inferior-parietal
        region: destrieux:left:25
        source_name: G_pariet_inf-Angular
        name: { en: Left angular gyrus, fr: Gyrus angulaire gauche }
        role: { en: Parietal landmark for the source of the traced projection, fr: Repère pariétal de l’origine de la projection tracée }
        explanation:
          en: Autoradiographic tracing in rhesus macaques identified the caudal inferior parietal lobule as the main parietal source of temporal projections in the series. The parietal tracer injection covered caudal area PG and area Opt. Labelled fibres coursed in the middle longitudinal fasciculus within the white matter of the superior temporal gyrus.
          fr: Chez le macaque rhésus, le traçage autoradiographique a situé la principale origine pariétale des projections temporales de la série dans la partie caudale du lobule pariétal inférieur. L’injection pariétale du traceur concernait la partie caudale de l’aire PG et l’aire Opt. Les fibres marquées empruntaient le faisceau longitudinal moyen dans la substance blanche du gyrus temporal supérieur.
        mapping:
          en: Destrieux outlines the human angular gyrus. It serves as a regional landmark for the caudal inferior parietal field traced in macaques.
          fr: Destrieux délimite le gyrus angulaire humain. Celui-ci sert de repère régional pour le territoire pariétal inférieur caudal étudié par traçage chez le macaque.
        view: left
        plane: coronal
      - id: superior-temporal-sulcus
        region: destrieux:left:74
        source_name: S_temporal_sup
        name: { en: Left superior temporal sulcus, fr: Sillon temporal supérieur gauche }
        role: { en: Temporal landmark for the receiving field, fr: Repère temporal du champ cible }
        explanation:
          en: In rhesus macaques, the traced parietal fibres reach area TPO in the upper bank of the superior temporal sulcus. A separate retrograde tracer study found inputs to middle TPO sites from the caudal inferior parietal lobule.
          fr: Chez le macaque rhésus, les fibres pariétales suivies par traçage atteignent l’aire TPO dans la berge supérieure du sillon temporal supérieur. Une autre étude par traçage rétrograde a identifié des afférences du lobule pariétal inférieur caudal vers la partie moyenne de l’aire TPO.
        mapping:
          en: The Destrieux parcel marks the human superior temporal sulcus as a regional comparison for macaque area TPO. It extends beyond the upper-bank target.
          fr: La parcelle de Destrieux délimite le sillon temporal supérieur humain, qui sert de repère régional pour l’aire TPO du macaque. Elle s’étend au-delà du territoire cible de la berge supérieure.
        view: left
        plane: coronal

  - id: septohippocampal-ca1-oriens
    name:
      en: Septohippocampal projection to CA1
      fr: Projection septohippocampique vers CA1
    summary:
      en: Follow a septal input traced in macaques from the medial septal nucleus to a layer of hippocampal field CA1.
      fr: Suivez une projection tracée chez le macaque, du noyau septal médial à une couche du champ CA1 de l’hippocampe.
    route:
      en: Medial septal nucleus → CA1 stratum oriens (macaque projection illustrated with right-sided landmarks in the human atlas)
      fr: Noyau septal médial → stratum oriens du champ CA1 (projection du macaque illustrée par des repères du côté droit dans l’atlas humain)
    scope:
      en: The tour shows the septal origin and one receiving layer. It omits the intervening white matter and other hippocampal targets. Human dissection shows the precommissural fornix reaching the septal nuclei in front of the anterior commissure. A human diffusion study estimated precommissural streamlines using a septal region and the crus of the fornix as tracking constraints. The authors located the tractography’s highest-probability hippocampal point in CA1. The precise course and rostrocaudal level of the labelled fibres in macaques, and the direction and receiving layer of a corresponding human projection, remain unresolved.
      fr: Le parcours montre l’origine septale et une couche cible. Il laisse de côté la substance blanche intermédiaire et les autres cibles hippocampiques. Chez l’humain, la dissection montre que le fornix précommissural rejoint les noyaux septaux en avant de la commissure antérieure. Une étude de tractographie par IRM de diffusion a utilisé une région septale et le pilier postérieur du fornix pour délimiter les trajectoires précommissurales estimées. Les auteurs ont situé dans le champ CA1 le point de plus forte probabilité de la reconstruction au niveau de l’hippocampe. Le trajet précis et le niveau rostrocaudal des fibres marquées chez le macaque, ainsi que le sens et la couche cible d’une projection correspondante chez l’humain, restent indéterminés.
    clinical:
      en: A patient developed predominantly anterograde amnesia after clipping of an unruptured anterior communicating artery aneurysm. MRI showed a lesion centred on the right diagonal band of Broca that extended into the septal region and anterior hypothalamus, with patchy injury on the left. In a separate MRI series of ten adults selected for amnesia after treatment of an anterior communicating artery aneurysm, infarcts involved the columns of the fornix in all ten and the diagonal band in five. Clip artefact obscured the diagonal band on both sides in one patient. Overlapping injuries and the absence of a non-amnesic comparison group in the series leave the contribution of this projection unresolved.
      fr: Un patient a présenté une amnésie à prédominance antérograde après le clippage d’un anévrisme non rompu de l’artère communicante antérieure. L’IRM montrait une lésion centrée sur la bande diagonale de Broca droite, étendue à la région septale et à l’hypothalamus antérieur, ainsi qu’une atteinte en plages à gauche. Dans une autre série d’IRM portant sur dix adultes sélectionnés pour une amnésie après traitement d’un anévrisme de l’artère communicante antérieure, les infarctus touchaient les colonnes du fornix chez les dix patients et la bande diagonale chez cinq d’entre eux. Un artéfact lié au clip masquait la bande diagonale des deux côtés chez un patient. L’atteinte de plusieurs structures et l’absence de groupe comparatif non amnésique dans la série laissent indéterminée la contribution de cette projection.
    deficit: amnesia
    references: [septohippocampal-gulyas-1991, septohippocampal-amaral-cowan-1980, septohippocampal-nyakas-1987, septohippocampal-barany-human-dissection-2024, septohippocampal-jang-yeo-human-diffusion-2017, clinical-abe-basal-forebrain-1998, clinical-mugikura-basal-forebrain-2014]
    clinical_references: [clinical-abe-basal-forebrain-1998, clinical-mugikura-basal-forebrain-2014]
    steps:
      - id: medial-septal-nucleus
        region: nextbrain:right:10103
        source_name: medial_septal_nucleus
        name: { en: Right medial septal nucleus, fr: Noyau septal médial droit }
        role: { en: Septal origin, fr: Origine septale }
        explanation:
          en: In the rhesus macaque with the strongest hippocampal labelling, the caudal injection site involved the right medial septal nucleus and the more rostral site also included the lateral septal nucleus. In another macaque, injections involving the lateral septal region and caudate nucleus produced no hippocampal labelling. A separate retrograde tracing experiment in a cynomolgus macaque labelled neurons in this nucleus on the side of a rostral hippocampal injection.
          fr: Chez le macaque rhésus dont le marquage hippocampique était le plus net, le site d’injection caudal intéressait le noyau septal médial droit et le site plus rostral incluait aussi le noyau septal latéral. Chez un autre macaque, les injections intéressant la région septale latérale et le noyau caudé n’ont produit aucun marquage hippocampique. Chez un macaque crabier, une injection de traceur rétrograde dans la formation hippocampique rostrale a marqué des neurones de ce noyau du même côté.
        mapping:
          en: The label shows the whole right medial septal nucleus. The traced neurons occupy part of this region.
          fr: Le repère englobe tout le noyau septal médial droit. Les neurones marqués n’en occupent qu’une partie.
        view: left
        plane: coronal
      - id: ca1-stratum-oriens
        region: nextbrain:right:10346
        source_name: stratum_oriens_of_rostral_ca1
        name: { en: Stratum oriens of right rostral CA1, fr: Stratum oriens du champ CA1 droit à son niveau rostral }
        role: { en: CA1 layer receiving septal fibres, fr: Couche de CA1 recevant les afférences septales }
        explanation:
          en: In macaques, anterograde tracing showed septal fibres in CA1 stratum oriens. Light microscopy showed labelled fibres apposed to parvalbumin-positive non-pyramidal cells in this layer. In a separate rat experiment, tracer injected into the lateral part of the medial septal nucleus labelled fibres in ventral CA1 stratum oriens.
          fr: Chez le macaque, le traçage antérograde a mis en évidence des fibres septales dans le stratum oriens de CA1. En microscopie optique, des fibres marquées étaient en apposition à des cellules non pyramidales positives pour la parvalbumine dans cette couche. Chez le rat, une injection de traceur dans la partie latérale du noyau septal médial a marqué des fibres du stratum oriens dans la partie ventrale du champ CA1.
        mapping:
          en: The atlas parcel shows the layer in rostral CA1 as a regional example.
          fr: Le repère de l’atlas montre un exemple de cette couche dans la partie rostrale de CA1.
        view: left
        plane: coronal

  - id: valuation
    name: { en: Comparing area 25 and the ventral pallidal relay, fr: Comparaison de l’aire 25 et du relais pallidal ventral }
    summary:
      en: Follow a cortical projection identified in macaques and a pallidal relay identified in mice, using corresponding landmarks in the human atlas.
      fr: Suivez une projection corticale décrite chez le macaque et un relais pallidal décrit chez la souris, à l’aide des repères correspondants dans l’atlas humain.
    route:
      en: Left area 25 → left accumbens core → left ventral pallidum → left ventral tegmental area
      fr: Aire 25 gauche → cœur du noyau accumbens gauche → pallidum ventral gauche → aire tegmentale ventrale gauche
    scope:
      en: The human atlas shows four left-sided regional landmarks. Macaque tracing identified the connection from area 25 to the accumbens core. Mouse tracing identified the relay from the core through the ventral pallidum to the ipsilateral ventral tegmental area. The continuity of the full sequence within one species and its presence in humans remain unresolved by these studies. The displayed route ends at the ventral tegmental area and leaves out the accumbens shell and the pallidal projection to the lateral habenula.
      fr: L’atlas humain montre quatre repères régionaux du côté gauche. Le traçage chez le macaque a mis en évidence la connexion entre l’aire 25 et le cœur du noyau accumbens. Le traçage chez la souris a mis en évidence un relais du cœur du noyau accumbens vers l’aire tegmentale ventrale ipsilatérale par le pallidum ventral. Ces études laissent ouverte la question de la continuité du parcours complet au sein d’une même espèce et de sa présence chez l’humain. Le parcours présenté s’arrête à l’aire tegmentale ventrale et laisse de côté la coquille du noyau accumbens et la projection pallidale vers l’habénula latérale.
    clinical:
      en: Gläscher and colleagues associated lower Iowa Gambling Task scores with left ventromedial prefrontal injury. Fellows and Farah also found poorer performance after dorsolateral frontal injury. These studies concern larger frontal regions and leave the contribution of this specific chain unresolved.
      fr: Gläscher et ses collègues ont associé des scores plus faibles à la tâche de jeu de l’Iowa à une lésion préfrontale ventromédiane gauche. Fellows et Farah ont aussi constaté une baisse des performances après une lésion frontale dorsolatérale. Ces études portent sur des régions frontales plus étendues et laissent ouverte la question de la contribution de cette chaîne précise.
    deficit: decision-making
    references: [valuation-area25-core-tracing, valuation-area25-efferents, olfactory-orbitofrontal-human-architecture, cortical-parcellation, valuation-pallidal-tracing, control-lesions, decision-qualifier]
    clinical_references: [control-lesions, decision-qualifier]
    steps:
      - id: ventromedial
        region: hcp-mmp:left:164
        source_name: L_25_ROI
        name: { en: Left area 25, fr: Aire 25 gauche }
        role: { en: Subgenual cortical origin, fr: Origine corticale sous-génuale }
        explanation:
          en: In macaques, infralimbic area 25 projects to the accumbens core. Retrograde tracer injections in the core labeled neurons in area 25.
          fr: Chez le macaque, l’aire infralimbique 25 se projette vers le cœur du noyau accumbens. Des injections de traceur rétrograde dans le cœur ont marqué des neurones de l’aire 25.
        mapping:
          en: The HCP-MMP parcel delineates human area 25 beneath the genu of the corpus callosum for comparison with macaque area 25.
          fr: La parcelle HCP-MMP délimite l’aire 25 humaine sous le genou du corps calleux, pour la comparer à l’aire 25 du macaque.
        view: right
        plane: sagittal
      - id: accumbens
        region: nextbrain:left:101
        source_name: core_of_nucleus_accumbens
        name: { en: Left nucleus accumbens core, fr: Cœur du noyau accumbens gauche }
        role: { en: Ventral striatal relay, fr: Relais striatal ventral }
        explanation:
          en: In mice, some neurons in the accumbens core directly innervate ventral pallidal neurons that project to the ventral tegmental area.
          fr: Chez la souris, des neurones du cœur du noyau accumbens innervent directement des neurones du pallidum ventral qui se projettent vers l’aire tegmentale ventrale.
        mapping:
          en: The NextBrain label shows the human accumbens core as an anatomical compartment.
          fr: La parcelle NextBrain représente le cœur du noyau accumbens humain comme un compartiment anatomique.
        view: anterior
        plane: coronal
      - id: ventral-pallidum
        region: nextbrain:left:120
        source_name: ventral_pallidus
        name: { en: Left ventral pallidum, fr: Pallidum ventral gauche }
        role: { en: Pallidal relay to the midbrain, fr: Relais pallidal vers le mésencéphale }
        explanation:
          en: In mice, the pallidal neurons traced in this relay express dopamine D3 receptors and project to the ventral tegmental area on the same side.
          fr: Chez la souris, les neurones pallidaux tracés dans ce relais expriment le récepteur dopaminergique D3 et projettent vers l’aire tegmentale ventrale du même côté.
        mapping:
          en: NextBrain delineates the human ventral pallidum as a regional landmark for this projection-defined cell population.
          fr: NextBrain délimite le pallidum ventral humain, qui sert de repère régional pour cette population de neurones définie par sa projection.
        view: anterior
        plane: coronal
      - id: vta
        region: nextbrain:left:435
        source_name: ventral_tegmental_area
        name: { en: Left ventral tegmental area, fr: Aire tegmentale ventrale gauche }
        role: { en: Midbrain target of the pallidal projection, fr: Cible mésencéphalique de la projection pallidale }
        explanation:
          en: In mouse brain slices, stimulating the axon terminals of pallidal neurons expressing dopamine D3 receptors evoked inhibitory postsynaptic currents in some ventral tegmental neurons.
          fr: Dans des coupes de cerveau de souris, la stimulation des terminaisons axonales de neurones pallidaux exprimant le récepteur dopaminergique D3 a déclenché des courants postsynaptiques inhibiteurs dans certains neurones de l’aire tegmentale ventrale.
        mapping:
          en: The NextBrain label delineates the human ventral tegmental area at the regional scale.
          fr: La parcelle NextBrain délimite l’aire tegmentale ventrale humaine à l’échelle régionale.
        view: anterior
        plane: axial

  - id: associative-frontocaudate
    name: { en: Associative corticostriatal projection to the caudate head, fr: Projection corticostriatale associative vers la tête du noyau caudé }
    summary:
      en: Follow a focal projection from rostral prefrontal area 46 to the head of the caudate nucleus, mapped by tracing in macaques.
      fr: Suivez une projection focale de la partie rostrale de l’aire préfrontale 46 vers la tête du noyau caudé, mise en évidence par traçage chez le macaque.
    route:
      en: Rostral part of left prefrontal area 46 → central and medial parts of the left caudate head
      fr: Partie rostrale de l’aire préfrontale 46 gauche → parties centrale et médiale de la tête du noyau caudé gauche
    scope:
      en: The left atlas landmarks illustrate an ipsilateral corticostriatal projection traced in macaques. The tour omits the intervening white matter, more caudal terminal fields, diffuse striatal projections and later basal ganglia relays. These studies leave the precise human terminal field unresolved.
      fr: Les repères gauches de l’atlas illustrent une projection corticostriatale ipsilatérale mise en évidence par traçage chez le macaque. Le parcours laisse de côté la substance blanche intermédiaire, les territoires de terminaison plus caudaux, les projections striatales diffuses et les relais suivants des noyaux gris centraux. Ces études laissent indéterminé le territoire précis des terminaisons chez l’humain.
    clinical:
      en: A group of seven veterans with focal left dorsolateral prefrontal lesions scored lower than uninjured veterans on a task that required reordering letters and numbers from memory. Lesion overlap in that group peaked in Brodmann area 9. In a separate study of 61 people with acute stroke, damage to the right caudate head was associated with a greater decline in hit rate corrected for false alarms when patients had to remember five visual locations instead of three in trials without distractors. The lesion maps also implicated the right inferior frontal gyrus, insula and frontal white matter. These studies leave the effects of selective injury to this projection unresolved.
      fr: Un groupe de sept anciens combattants présentant des lésions focales du cortex préfrontal dorsolatéral gauche a obtenu des scores inférieurs à ceux des témoins sans lésion cérébrale à une épreuve où il fallait remettre en ordre, de mémoire, des lettres et des chiffres. Dans ce groupe, le chevauchement des lésions était maximal dans l’aire 9 de Brodmann. Dans une autre étude menée chez 61 personnes en phase aiguë d’un AVC, une lésion de la tête du noyau caudé droit était associée à une baisse plus marquée du taux de détection corrigé des fausses alarmes lorsqu’il fallait retenir cinq positions visuelles au lieu de trois, dans des essais sans distracteurs. La cartographie lésionnelle impliquait aussi le gyrus frontal inférieur, l’insula et la substance blanche frontale du côté droit. Les effets d’une lésion sélective de cette projection restent indéterminés.
    deficit: working-memory
    references: [frontocaudate-macaque-tracing, frontocaudate-rhesus-topography, frontocaudate-comparative-cytoarchitecture, cortical-parcellation, clinical-barbey-working-memory-2013, clinical-baier-working-memory-2010]
    clinical_references: [clinical-barbey-working-memory-2013, clinical-baier-working-memory-2010]
    steps:
      - id: rostral-area-46
        region: hcp-mmp:left:84
        source_name: L_46_ROI
        name: { en: Left prefrontal area 46, fr: Aire préfrontale 46 gauche }
        role: { en: Cortical origin of the traced projection, fr: Origine corticale de la projection tracée }
        explanation:
          en: In a macaque, an anterograde tracer injection in rostral area 46 labelled terminals in the caudate nucleus.
          fr: Chez un macaque, l’injection d’un traceur antérograde dans la partie rostrale de l’aire 46 a marqué des terminaisons dans le noyau caudé.
        mapping:
          en: Comparative cytoarchitecture supports using the whole human HCP-MMP area 46 as an approximate landmark for the sampled rostral site in the macaque.
          fr: La cytoarchitecture comparée permet d’utiliser l’ensemble de l’aire 46 humaine de la parcellisation HCP-MMP comme repère approximatif du site rostral étudié chez le macaque.
        view: left
        plane: coronal
      - id: caudate-head
        region: nextbrain:left:48
        source_name: head_of_caudate
        name: { en: Head of the left caudate nucleus, fr: Tête du noyau caudé gauche }
        role: { en: Striatal target of the traced projection, fr: Cible striatale de la projection tracée }
        explanation:
          en: At rostral levels, the macaque tracer study located dense terminal patches in the central and medial parts of the caudate.
          fr: Aux niveaux rostraux, le traçage chez le macaque a mis en évidence des amas denses de terminaisons dans les parties centrale et médiale du noyau caudé.
        mapping:
          en: NextBrain represents the whole caudate head. The focal terminal patches occupied part of the rostral caudate in the macaque.
          fr: NextBrain représente l’ensemble de la tête du noyau caudé. Chez le macaque, les amas de terminaisons occupaient une partie du noyau caudé rostral.
        view: anterior
        plane: coronal

  - id: dorsal-cingulum-anterior-posterior
    name: { en: Anterior to posterior cingulate projection · dorsal cingulum, fr: Projection cingulaire antéropostérieure · cingulum dorsal }
    summary:
      en: Follow a projection traced in macaques from pregenual area 24 to the posterior cingulate cortex. Locate its two ends using landmarks in the left hemisphere of the human atlas.
      fr: Suivez une projection mise en évidence par traçage chez le macaque, de l’aire 24 prégénuale au cortex cingulaire postérieur. Situez ses deux extrémités à l’aide de repères dans l’hémisphère gauche de l’atlas humain.
    route:
      en: Pregenual anterior cingulate cortex → posterior cingulate cortex via the dorsal cingulum (macaque projection shown with left-sided human atlas landmarks)
      fr: Cortex cingulaire antérieur prégénual → cortex cingulaire postérieur par le cingulum dorsal (projection du macaque illustrée par des repères à gauche dans l’atlas humain)
    scope:
      en: Human fibre dissection shows longitudinal cingulum fibres above the body of the corpus callosum. Human diffusion tractography estimates streamlines between broadly defined rostral anterior and posterior cingulate regions. The precise cortical endpoints and direction of the corresponding human projection remain unresolved. The display shows the two cortical landmarks. The intervening fibres and other projections from the injection site, including those to the precuneus and the opposite hemisphere, are outside this display.
      fr: La dissection de cerveaux humains montre des fibres longitudinales du cingulum au-dessus du tronc du corps calleux. La tractographie de diffusion estime des trajectoires entre de larges territoires du cortex cingulaire antérieur rostral et du cortex cingulaire postérieur. Les extrémités corticales précises et le sens de la projection correspondante chez l’humain restent indéterminés. Le parcours montre les deux repères corticaux. Le parcours laisse de côté les fibres qui relient ces repères et les autres projections issues du site d’injection, notamment celles vers le précunéus et l’hémisphère opposé.
    clinical:
      en: In a neuropathological series, three people with akinetic mutism had bilateral lesions of the rostral anterior cingulate gyri extending into adjacent supplementary motor cortex. In a separate case of akinetic mutism after bilateral medial cortical infarcts, longitudinal diffusion MRI showed relatively persistent microstructural abnormalities in the anterior cingulate cortex and cingulum during recovery of volition. The contribution of this specific projection to the deficit remains unresolved.
      fr: Dans une série neuropathologique, trois personnes atteintes de mutisme akinétique présentaient des lésions bilatérales de la partie rostrale du gyrus cingulaire antérieur, qui s’étendaient au cortex moteur supplémentaire voisin. Dans un autre cas de mutisme akinétique après des infarctus corticaux médiaux bilatéraux, le suivi par IRM de diffusion a mis en évidence des anomalies microstructurales relativement persistantes dans le cortex cingulaire antérieur et le cingulum au cours de la récupération de l’initiative. La contribution propre de cette projection au trouble reste indéterminée.
    deficit: akinetic-mutism
    references: [thalamocingulate-cingulum-tracing, cingulum-intracingulate-tracing, cingulum-human-dissection-wu, cingulum-human-tractography-choi, cortical-parcellation, clinical-nemeth-1988, clinical-zhang-akinetic-mutism-2024]
    clinical_references: [clinical-nemeth-1988, clinical-zhang-akinetic-mutism-2024]
    steps:
      - id: pregenual
        region: hcp-mmp:left:180
        source_name: L_p24_ROI
        name: { en: Left pregenual anterior cingulate cortex, fr: Cortex cingulaire antérieur prégénual gauche }
        role: { en: Cortical origin of the traced projection, fr: Origine corticale de la projection tracée }
        explanation:
          en: In macaque case 179FR, a tracer injection in the pregenual dorsal anterior cingulate cortex labelled axons that travelled caudally through the dorsal cingulum on the same side.
          fr: Chez le macaque du cas 179FR, une injection de traceur dans la partie dorsale du cortex cingulaire antérieur prégénual a marqué des axones qui empruntaient le cingulum dorsal du même côté en direction caudale.
        mapping:
          en: HCP-MMP’s p24 parcel is the posterior division of area 24 proper, near the dorsal aspect of the callosal genu. It gives an approximate regional landmark for the macaque injection site.
          fr: La parcelle p24 de HCP-MMP représente la division postérieure de l’aire 24 proprement dite, près du versant dorsal du genou du corps calleux. Elle fournit un repère approximatif pour situer le site d’injection chez le macaque.
        view: right
        plane: sagittal
      - id: posterior
        region: hcp-mmp:left:34
        source_name: L_d23ab_ROI
        name: { en: Left dorsal posterior cingulate cortex, fr: Partie dorsale du cortex cingulaire postérieur gauche }
        role: { en: Regional landmark for the cortical target, fr: Repère régional de la cible corticale }
        explanation:
          en: In case 179FR, labelled axons reached the ipsilateral posterior cingulate cortex at the caudal end of the dorsal cingulum. In a separate rhesus macaque study, a small retrograde tracer injection involving areas 23a and 23b labelled neurons in anterior cingulate area 24a.
          fr: Dans le cas 179FR, des axones marqués atteignaient le cortex cingulaire postérieur du même côté, à l’extrémité caudale du cingulum dorsal. Dans une autre étude chez le macaque rhésus, une injection restreinte de traceur rétrograde intéressant les aires 23a et 23b a marqué des neurones dans l’aire cingulaire antérieure 24a.
        mapping:
          en: The human HCP-MMP parcel d23ab groups the dorsal portions of areas 23a and 23b on the posterior cingulate gyrus above the splenium. It provides an approximate landmark for the posterior target region.
          fr: La parcelle d23ab de l’atlas humain HCP-MMP réunit les parties dorsales des aires 23a et 23b du gyrus cingulaire postérieur au-dessus du splénium. Elle fournit un repère approximatif pour situer la région cible postérieure.
        view: right
        plane: sagittal

  - id: olivocerebellar-flocculus
    name: { en: Olivocerebellar input to the flocculus, fr: Afférences olivocérébelleuses du flocculus }
    summary:
      en: Follow the final part of a climbing-fibre projection traced in rabbits. Two left-sided landmarks in the human atlas mark its course after the medullary crossing, from the inferior cerebellar peduncle to the flocculus.
      fr: Suivez la partie terminale d’une projection de fibres grimpantes mise en évidence par traçage chez le lapin. Deux repères à gauche dans l’atlas humain situent son trajet après le croisement bulbaire, du pédoncule cérébelleux inférieur au flocculus.
    route:
      en: Left inferior cerebellar peduncle (restiform region) → left cerebellar flocculus
      fr: Pédoncule cérébelleux inférieur gauche (région du corps restiforme) → flocculus cérébelleux gauche
    scope:
      en: In the orientation shown, the projection starts in the right inferior olive and crosses the medullary midline before reaching the left inferior cerebellar peduncle. The atlas has no drawable labels for the olivary subregions that supply the flocculus or for the crossing. The tour ends in the floccular cortex.
      fr: Le trajet illustré part de l’olive inférieure droite et croise la ligne médiane du bulbe rachidien avant d’atteindre le pédoncule cérébelleux inférieur gauche. L’atlas n’offre pas de repère affichable pour les sous-régions olivaires qui projettent vers le flocculus ni pour le croisement. Le parcours s’arrête dans le cortex du flocculus.
    clinical:
      en: In one 48-year-old woman with an infarct involving the left flocculus and the midline nodulus, the entire visual scene appeared upside down for 30 minutes. Injury to both regions leaves the contribution of the flocculus and its olivary input unresolved.
      fr: Chez une femme de 48 ans, toute la scène visuelle est apparue à l’envers pendant 30 minutes lors d’un infarctus touchant le flocculus gauche et le nodule médian. L’atteinte conjointe de ces régions laisse indéterminée la contribution du flocculus et de ses afférences olivaires.
    deficit: room-tilt-illusion
    references: [olivocerebellar-rabbit-floccular-course, olivocerebellar-macaque-floccular-origins, olivocerebellar-human-peduncle-pathology, clinical-charles-1992]
    clinical_references: [clinical-charles-1992]
    steps:
      - id: inferior-peduncle
        region: learning:left:inferior-cerebellar-peduncle
        source_name: Inferior cerebellar peduncle
        tract: icp-left
        name: { en: Left inferior cerebellar peduncle, fr: Pédoncule cérébelleux inférieur gauche }
        role: { en: Passage for crossed olivocerebellar fibres, fr: Passage des fibres olivocérébelleuses croisées }
        explanation:
          en: In rabbits, an injection that included the caudal dorsal cap labelled fibres crossing the midline and following the opposite restiform body toward the flocculus. An injection that included the rostral medial accessory olive labelled fibres through the ventromedial restiform body and into the caudal flocculus. In one human pathology report, the ventromedial inferior cerebellar peduncle opposite the affected olive showed degeneration and the juxtarestiform body was spared.
          fr: Chez le lapin, une injection intéressant la partie caudale de la coiffe dorsale a marqué des fibres qui croisaient la ligne médiane et longeaient le corps restiforme opposé vers le flocculus. Une injection intéressant la partie rostrale de l’olive accessoire médiale a marqué des fibres qui traversaient la partie ventromédiale du corps restiforme et gagnaient la partie caudale du flocculus. Dans une étude anatomopathologique humaine, la partie ventromédiale du pédoncule cérébelleux inférieur opposé à l’olive atteinte présentait une dégénérescence et le corps juxtarestiforme était épargné.
        mapping:
          en: This teaching volume is NextBrain’s parcel for the whole left inferior cerebellar peduncle. The restiform region occupies part of this parcel.
          fr: Ce volume pédagogique reprend la parcelle de NextBrain qui représente l’ensemble du pédoncule cérébelleux inférieur gauche. La région du corps restiforme occupe une partie de cette parcelle.
        view: posterior
        plane: axial
      - id: flocculus
        region: learning:lobule-x-left
        source_name: Lobule X (flocculus)
        name: { en: Left cerebellar flocculus, fr: Flocculus cérébelleux gauche }
        role: { en: Cortical target of the climbing fibres, fr: Cible corticale des fibres grimpantes }
        explanation:
          en: Retrograde tracing in macaques identified the dorsal cap as the main source of olivary input to the flocculus and the medial accessory olive as a smaller source. In rabbits, labelled fibres entered the floccular white matter and terminated as climbing fibres on Purkinje cells in the molecular layer.
          fr: Chez le macaque, le traçage rétrograde a identifié la coiffe dorsale comme principale source des afférences olivaires du flocculus et l’olive accessoire médiale comme source secondaire. Chez le lapin, les fibres marquées pénétraient dans la substance blanche du flocculus et se terminaient sous forme de fibres grimpantes sur les cellules de Purkinje dans la couche moléculaire.
        mapping:
          en: The Learning atlas uses the CerebNet left flocculus label for the entire lobule. The cortical layers and terminal zones are finer than this parcel.
          fr: L’atlas pédagogique reprend l’étiquette du flocculus gauche de CerebNet pour l’ensemble du lobule. Les couches corticales et les zones de terminaison sont des subdivisions plus fines que cette parcelle.
        view: inferior
        plane: axial

  - id: basal-amygdala-area25
    name: { en: Basal amygdalar projection to subgenual area 25, fr: Projection du noyau basal de l’amygdale vers l’aire 25 sous-génuale }
    summary:
      en: Follow a direct projection from the basal nucleus of the amygdala to subgenual area 25, traced in macaques and illustrated with human atlas landmarks.
      fr: Suivez une projection directe du noyau basal de l’amygdale vers l’aire 25 sous-génuale, mise en évidence par traçage chez le macaque et illustrée par des repères de l’atlas humain.
    route:
      en: Left basal nucleus of the amygdala → left subgenual area 25
      fr: Noyau basal de l’amygdale gauche → aire 25 sous-génuale gauche
    scope:
      en: The two left-sided landmarks illustrate a same-side projection traced in macaques. Human diffusion tractography estimates a ventral amygdalofugal fibre field in the white matter beside area 25. The exact course of the traced branch and the endpoints and direction of a corresponding human projection remain unresolved. The tour leaves out the intervening white matter, the input from the accessory basal nucleus and other cortical targets.
      fr: Les deux repères gauches illustrent une projection ipsilatérale mise en évidence par traçage chez le macaque. Chez l’humain, la tractographie de diffusion estime le trajet de fibres de la voie amygdalofuge ventrale dans la substance blanche adjacente à l’aire 25. Le trajet précis de la branche mise en évidence par traçage ainsi que l’origine, la terminaison et le sens d’une projection correspondante chez l’humain restent indéterminés. Le parcours laisse de côté la substance blanche intermédiaire, les afférences issues du noyau basal accessoire et les autres cibles corticales.
    clinical:
      en: Lesion mapping associated damage to the left ventromedial prefrontal cortex with lower Iowa Gambling Task scores. The study leaves the contributions of area 25 and this amygdalar projection unresolved.
      fr: La cartographie lésionnelle a associé les lésions du cortex préfrontal ventromédian gauche à de moins bons scores à la tâche de jeu de l’Iowa. L’étude laisse indéterminée la contribution propre de l’aire 25 et de cette projection amygdalienne.
    deficit: decision-making
    references: [basal-amygdala-area25-sharma, basal-amygdala-area25-aggleton, amygdalofugal-folloni, cortical-parcellation, control-lesions]
    clinical_references: [control-lesions]
    steps:
      - id: basal-amygdala
