circuits:
  - id: hearing
    name: { en: Auditory landmarks, fr: Repères auditifs }
    summary:
      en: Explore three left-sided auditory landmarks and distinguish parallel thalamic pathways.
      fr: Explorez trois repères auditifs gauches et distinguez les voies thalamiques parallèles.
    route:
      en: Main ascending route · inferior colliculus → ventral medial geniculate → A1. Dorsal medial geniculate · a parallel branch.
      fr: Voie ascendante principale · colliculus inférieur → noyau géniculé médial ventral → A1. Noyau géniculé médial dorsal · une branche parallèle.
    scope:
      en: The ventral geniculate relay is not a separate teaching solid here. The displayed dorsal division must not be read as the relay to A1. The ears, cochlear nuclei, other brainstem relays and auditory radiations are outside this tour.
      fr: Le relais géniculé ventral n’a pas de volume pédagogique distinct ici. La division dorsale affichée ne doit pas être interprétée comme le relais vers A1. Les oreilles, les noyaux cochléaires, les autres relais du tronc cérébral et les radiations auditives sont hors de ce parcours.
    clinical:
      en: Coslett reported word deafness after bilateral auditory cortical infarcts; Maffei reported a unilateral left temporal case involving cortex and white matter. These cases do not establish a deficit at every ascending relay, a required bilateral lesion pattern or a single cortical/disconnection mechanism.
      fr: Coslett rapportait une surdité verbale après des infarctus corticaux auditifs bilatéraux ; Maffei décrivait un cas temporal gauche unilatéral impliquant le cortex et la substance blanche. Ces cas n’établissent ni un déficit à chaque relais ascendant, ni un profil lésionnel bilatéral obligatoire, ni un mécanisme cortical ou de déconnexion unique.
    deficit: word-deafness
    references: [auditory-pathways, auditory-thalamus, cortical-parcellation, clinical-coslett-1984, clinical-maffei-2017]
    clinical_references: [clinical-coslett-1984, clinical-maffei-2017]
    steps:
      - id: colliculus
        region: learning:left:inferior-colliculus
        source_name: Inferior colliculus central nucleus
        name: { en: Left inferior colliculus central nucleus, fr: Noyau central du colliculus inférieur gauche }
        role: { en: Midbrain auditory convergence, fr: Convergence auditive mésencéphalique }
        explanation:
          en: Ascending auditory pathways converge in the inferior colliculus. By this level, auditory information is not organized as one ear per hemisphere.
          fr: Les voies auditives ascendantes convergent dans le colliculus inférieur. À ce niveau, les informations auditives ne sont pas organisées selon une oreille par hémisphère.
        mapping:
          en: Only the central nucleus is highlighted, not the entire inferior colliculus or its incoming fibres.
          fr: Seul le noyau central est sélectionné, et non le colliculus inférieur entier ni ses fibres afférentes.
        view: posterior
        plane: axial
      - id: dorsal-geniculate
        region: learning:left:medial-geniculate
        source_name: Dorsal medial geniculate nucleus
        name: { en: Left dorsal medial geniculate nucleus, fr: Noyau géniculé médial dorsal gauche }
        role: { en: Parallel auditory thalamic branch, fr: Branche thalamique auditive parallèle }
        explanation:
          en: Locate the dorsal division. Geniculate subdivisions have different cortical targets; the main relay to A1 is the ventral division, not this highlighted nucleus.
          fr: Repérez la division dorsale. Les subdivisions géniculées ont des cibles corticales différentes ; le relais principal vers A1 est la division ventrale, et non ce noyau sélectionné.
        mapping:
          en: The exact source label is dorsal medial geniculate nucleus. It cannot substitute for the whole medial geniculate body or its ventral division.
          fr: L’étiquette source exacte est le noyau géniculé médial dorsal. Elle ne remplace ni le corps géniculé médial entier ni sa division ventrale.
        view: posterior
        plane: coronal
      - id: a1
        region: hcp-mmp:left:24
        source_name: L_A1_ROI
        name: { en: Left primary auditory cortex · A1, fr: Cortex auditif primaire gauche · A1 }
        role: { en: Cortical auditory landmark, fr: Repère auditif cortical }
        explanation:
          en: Now visit A1, which receives the main ventral geniculate input. This move changes branches; it does not demonstrate a serial dorsal-geniculate-to-A1 connection.
          fr: Visitez maintenant A1, qui reçoit l’entrée géniculée ventrale principale. Ce déplacement change de branche ; il ne démontre pas une connexion sérielle du noyau géniculé dorsal vers A1.
        mapping:
          en: This HCP-MMP parcel is mapped onto the individual surface. It is not a measured auditory response or an individual tonotopic map.
          fr: Cette parcelle HCP-MMP est projetée sur la surface individuelle. Elle ne constitue ni une réponse auditive mesurée ni une carte tonotopique individuelle.
        view: left
        plane: coronal

  - id: language
    name: { en: Language network landmarks, fr: Repères du réseau du langage }
    summary:
      en: Compare temporal and frontal landmarks within distributed speech and language systems.
      fr: Comparez des repères temporaux et frontaux au sein des systèmes distribués de la parole et du langage.
    route:
      en: Temporal sound analysis ↔ ventral meaning-related systems and dorsal sensorimotor systems ↔ frontal language territories.
      fr: Analyse temporale des sons ↔ systèmes ventraux liés au sens et systèmes dorsaux sensorimoteurs ↔ territoires frontaux du langage.
    scope:
      en: Four left-sided landmarks, not a serial comprehension-to-production chain. Speech processing also involves the right hemisphere, additional cortical territories and white-matter pathways that this tour does not reconstruct.
      fr: Quatre repères gauches, et non une chaîne sérielle de la compréhension vers la production. Le traitement de la parole implique aussi l’hémisphère droit, d’autres territoires corticaux et des voies de substance blanche que ce parcours ne reconstruit pas.
    clinical:
      en: Dronkers’ comprehension study and Na’s lesion meta-analysis link different language tasks to differing temporal, frontal and insular-motor injury patterns. The atlas parcels are broad references, not fixed Broca/Wernicke centres or a patient-specific language-dominance assessment. The clinical link is partial at the left temporal landmarks.
      fr: L’étude de compréhension de Dronkers et la méta-analyse lésionnelle de Na associent différentes tâches langagières à des profils d’atteinte temporale, frontale et insulo-motrice différents. Les parcelles d’atlas sont des repères larges, et non des centres fixes de Broca ou Wernicke ni une évaluation individuelle de dominance langagière. Le lien clinique est partiel au niveau des repères temporaux gauches.
    deficit: aphasia
    references: [speech-streams, speech-feedback, cortical-parcellation, clinical-dronkers-2004, clinical-na-2022]
    clinical_references: [clinical-dronkers-2004, clinical-na-2022]
    steps:
      - id: superior-temporal
        region: destrieux:left:34
        source_name: G_temp_sup-Lateral
        name: { en: Left lateral superior temporal gyrus, fr: Partie latérale du gyrus temporal supérieur gauche }
        role: { en: Temporal speech-sound landmark, fr: Repère temporal des sons de la parole }
        explanation:
          en: Temporal cortices on both sides contribute to analysing speech sounds. Begin at this left-sided anatomical landmark before comparing meaning-related and frontal territories.
          fr: Les cortex temporaux des deux côtés contribuent à l’analyse des sons de la parole. Commencez par ce repère anatomique gauche avant de comparer les territoires liés au sens et les territoires frontaux.
        mapping:
          en: The entire lateral superior temporal parcel is shown. It is broader than a speech-responsive cluster and does not define one fixed Wernicke area.
          fr: Toute la parcelle temporale supérieure latérale est affichée. Elle dépasse un foyer répondant à la parole et ne définit pas une aire de Wernicke fixe.
        view: left
        plane: coronal
      - id: middle-temporal
        region: destrieux:left:38
        source_name: G_temporal_middle
        name: { en: Left middle temporal gyrus, fr: Gyrus temporal moyen gauche }
        role: { en: Meaning-related temporal territory, fr: Territoire temporal lié au sens }
        explanation:
          en: Temporal regions contribute to linking words with meaning. Semantic processing is distributed and cannot be assigned to this gyrus alone.
          fr: Des régions temporales contribuent à relier les mots à leur sens. Le traitement sémantique est distribué et ne peut pas être attribué à ce seul gyrus.
        mapping:
          en: This Destrieux parcel covers the whole gyrus, including portions with different contributions to language tasks.
          fr: Cette parcelle Destrieux couvre le gyrus entier, y compris des portions contribuant différemment aux tâches de langage.
        view: left
        plane: coronal
      - id: area44
        region: hcp-mmp:left:74
        source_name: L_44_ROI
        name: { en: Left inferior frontal area 44, fr: Aire frontale inférieure 44 gauche }
        role: { en: Frontal speech-network landmark, fr: Repère frontal du réseau de la parole }
        explanation:
          en: Switch to a frontal landmark. Dorsal speech systems link temporal sound representations with frontal articulatory networks; this is not a direct tract traced from the preceding gyrus.
          fr: Passez à un repère frontal. Les systèmes dorsaux de la parole relient des représentations sonores temporales aux réseaux articulatoires frontaux ; aucun tractus direct depuis le gyrus précédent n’est tracé ici.
        mapping:
          en: HCP-MMP area 44 is an atlas parcel, not an individual functional localization of speech production or the whole of Broca’s region.
          fr: L’aire 44 de HCP-MMP est une parcelle d’atlas, et non une localisation fonctionnelle individuelle de la production de parole ni toute la région de Broca.
        view: left
        plane: axial
      - id: area45
        region: hcp-mmp:left:75
        source_name: L_45_ROI
        name: { en: Left inferior frontal area 45, fr: Aire frontale inférieure 45 gauche }
        role: { en: Adjacent frontal language territory, fr: Territoire frontal adjacent du langage }
        explanation:
          en: Locate the adjacent inferior frontal parcel. Frontal and temporal territories interact during language tasks; visiting them in order does not imply that each is a single-purpose language centre.
          fr: Repérez la parcelle frontale inférieure adjacente. Les territoires frontaux et temporaux interagissent pendant les tâches de langage ; les visiter dans cet ordre n’implique pas que chacun soit un centre du langage à fonction unique.
        mapping:
          en: The parcel boundary comes from HCP-MMP. The reference surface alone cannot determine this person’s language dominance or task responses.
          fr: La limite de la parcelle provient de HCP-MMP. La surface de référence seule ne permet pas de déterminer la dominance du langage ni les réponses aux tâches de cette personne.
        view: left
        plane: axial

  - id: attention
    name: { en: Spatial attention systems, fr: Systèmes de l’attention spatiale }
    summary:
      en: Compare goal-directed orienting and reorienting through three right-sided cortical landmarks.
      fr: Comparez l’orientation guidée par un objectif et la réorientation à travers trois repères corticaux droits.
    route:
      en: Dorsal system · intraparietal territories ↔ frontal eye fields. Ventral system · temporoparietal and frontal territories interact during reorienting.
      fr: Système dorsal · territoires intrapariétaux ↔ champs oculaires frontaux. Système ventral · territoires temporopariétaux et frontaux en interaction lors de la réorientation.
    scope:
      en: The dorsal attention network is bilateral; this tour shows only its right-sided landmarks. Ventral reorienting responses often show right dominance. The frontal ventral components and other network nodes are outside this tour.
      fr: Le réseau dorsal de l’attention est bilatéral ; ce parcours montre seulement ses repères droits. Les réponses ventrales de réorientation présentent souvent une dominance droite. Les composantes frontales ventrales et les autres nœuds du réseau sont hors de ce parcours.
    clinical:
      en: In 80 people with right-hemisphere stroke, Verdon and colleagues associated perceptual neglect with inferior parietal lesions and exploratory neglect with dorsolateral prefrontal lesions. Chechlacz and colleagues included that study in a meta-analysis of left visual neglect. Cortical associations differed partly between egocentric and allocentric neglect, with shared involvement of right white matter. The clinical link is tenuous at the scale of the displayed parcels.
      fr: Chez 80 personnes ayant subi un AVC de l’hémisphère droit, Verdon et ses collègues ont associé la négligence perceptive à des lésions pariétales inférieures et la négligence exploratoire à des lésions préfrontales dorsolatérales. Chechlacz et ses collègues ont inclus cette étude dans une méta-analyse de la négligence visuelle gauche. Les associations corticales différaient en partie entre les formes égocentrée et allocentrée, avec une atteinte commune de la substance blanche droite. Le lien clinique est ténu à l’échelle des parcelles représentées.
    deficit: neglect
    references: [attention-systems, attention-laterality, cortical-parcellation, clinical-verdon-2010, clinical-chechlacz-2012]
    clinical_references: [clinical-verdon-2010, clinical-chechlacz-2012]
    steps:
      - id: ips1
        region: hcp-mmp:right:17
        source_name: R_IPS1_ROI
        name: { en: Right intraparietal area IPS1, fr: Aire intrapariétale IPS1 droite }
        role: { en: Goal-directed spatial selection, fr: Sélection spatiale guidée par un objectif }
        explanation:
          en: Intraparietal territories participate in selecting locations according to current goals. Start with this right-sided landmark of the bilateral dorsal attention system.
          fr: Les territoires intrapariétaux participent à la sélection de positions selon les objectifs actuels. Commencez par ce repère droit du système dorsal bilatéral de l’attention.
        mapping:
          en: IPS1 is one HCP-MMP parcel within a larger intraparietal territory. It is not the entire dorsal attention network or an individual attention activation map.
          fr: IPS1 est une parcelle HCP-MMP dans un territoire intrapariétal plus vaste. Elle ne représente ni tout le réseau dorsal de l’attention ni une carte individuelle d’activation attentionnelle.
        view: right
        plane: axial
      - id: fef
        region: hcp-mmp:right:10
        source_name: R_FEF_ROI
        name: { en: Right frontal eye field · FEF, fr: Champ oculaire frontal droit · FEF }
        role: { en: Frontal orienting landmark, fr: Repère frontal de l’orientation }
        explanation:
          en: Frontal eye fields contribute to orienting attention and controlling eye movements. They interact with parietal territories rather than acting as an isolated attention switch.
          fr: Les champs oculaires frontaux contribuent à orienter l’attention et à contrôler les mouvements oculaires. Ils interagissent avec les territoires pariétaux plutôt que d’agir comme un interrupteur attentionnel isolé.
        mapping:
          en: The FEF atlas label supplies a cortical landmark; no eye-movement localizer or connection between these parcels was measured in this brain.
          fr: L’étiquette FEF de l’atlas fournit un repère cortical ; aucune localisation des mouvements oculaires ni connexion entre ces parcelles n’a été mesurée dans ce cerveau.
        view: right
        plane: axial
      - id: tpoj1
        region: hcp-mmp:right:139
        source_name: R_TPOJ1_ROI
        name: { en: Right temporoparietal area TPOJ1, fr: Aire temporopariétale TPOJ1 droite }
        role: { en: Landmark for reorienting territory, fr: Repère d’un territoire de réorientation }
        explanation:
          en: Change to a temporoparietal landmark near ventral attention territories. Unexpected task-relevant events can recruit reorienting interactions; this step changes systems rather than extending a serial IPS1-to-FEF chain.
          fr: Passez à un repère temporopariétal proche des territoires ventraux de l’attention. Des événements inattendus pertinents pour la tâche peuvent mobiliser des interactions de réorientation ; cette étape change de système plutôt que de prolonger une chaîne sérielle d’IPS1 vers FEF.
        mapping:
          en: TPOJ1 is an anatomical atlas landmark, not the exact temporoparietal cluster from an attention experiment or a lesion study.
          fr: TPOJ1 est un repère anatomique d’atlas, et non le foyer temporopariétal exact d’une expérience attentionnelle ou d’une étude lésionnelle.
        view: right
        plane: coronal

  - id: praxis
    name: { en: Praxis and action systems, fr: Praxies et systèmes de l’action }
    summary:
      en: Compare the Grasp and Use action systems, and temporal-lobe knowledge of tools, through six left-sided landmarks.
      fr: Comparez les systèmes d’action de saisie et d’utilisation, ainsi que les connaissances du lobe temporal sur les outils, à travers six repères gauches.
    route:
      en: Reaching and grasping · medial intraparietal and dorsal premotor cortex. Tool-related actions · area MT, anterior inferior parietal cortex and ventral premotor cortex. Tool and action knowledge · middle temporal gyrus.
      fr: Mouvements dirigés vers la cible et préhension · cortex intrapariétal médial et prémoteur dorsal. Actions liées aux outils · aire MT, cortex pariétal inférieur antérieur et prémoteur ventral. Connaissances sur les outils et les actions · gyrus temporal moyen.
    scope:
      en: The six left-sided landmarks compare the proposed Grasp and Use systems and adjoining tool-related temporal cortex. The model includes bilateral contributions to visually guided reaching and grasping. The display omits the other hemisphere, areas V6A and MST, intervening white matter and subcortical contributions. The order groups landmarks for comparison.
      fr: Les six repères gauches permettent de comparer les systèmes proposés de saisie et d’utilisation ainsi que le cortex temporal voisin lié aux outils. Le modèle attribue un rôle aux deux hémisphères dans les mouvements d’atteinte et la préhension guidés par la vision. La comparaison laisse de côté l’autre hémisphère, les aires V6A et MST, la substance blanche intermédiaire et les contributions sous-corticales. L’ordre d’affichage regroupe les repères à des fins de comparaison.
    clinical:
      en: The clinical link is partial at the left anterior inferior parietal and posterior middle temporal landmarks. A corrected lesion synthesis associated difficulty using familiar tools with anterior inferior parietal injury, including the supramarginal and PFt territory, and difficulty pantomiming tool use in response to visual cues with middle temporal and supramarginal injury. A descriptive study in a 44-person group with left stroke and aphasia compared seven adults with selective hand imitation difficulty and five with selective finger imitation difficulty. In a separate 257-person group, the two tasks had largely shared lesion associations after adjustment for lesion volume, age and time since stroke. A later reanalysis of 96 left-stroke cases found stronger evidence for different lesion patterns when it isolated selective imitation difficulties.
      fr: Le lien clinique est partiel au niveau des repères pariétal inférieur antérieur et temporal moyen postérieur gauches. Une synthèse lésionnelle corrigée associait les difficultés d’utilisation d’outils familiers à une atteinte pariétale inférieure antérieure, notamment dans le territoire supramarginal et de PFt, et les difficultés à mimer l’utilisation d’outils sur consigne visuelle à des atteintes temporales moyennes et supramarginales. Une étude descriptive dans un groupe de 44 personnes ayant subi un AVC gauche avec aphasie a comparé sept adultes ayant un déficit sélectif d’imitation de la main et cinq ayant un déficit sélectif d’imitation des doigts. Dans un autre groupe de 257 personnes, les associations lésionnelles des deux épreuves se recoupaient largement après ajustement sur le volume lésionnel, l’âge et le délai depuis l’AVC. Une réanalyse ultérieure de 96 cas d’AVC gauche a trouvé des indices plus solides de profils lésionnels distincts lorsqu’elle isolait les difficultés sélectives d’imitation.
    deficit: apraxia
    references: [action-systems, dorsal-streams, tool-network, tool-use-evolution, apraxia-parietal, cortical-parcellation, clinical-goldenberg-2006, clinical-achilles-2017, clinical-metaireau-2024-praxis, praxis-parietopremotor-model, praxis-parietopremotor-tracing, clinical-rosenzopf-2024-imitation]
    clinical_references: [clinical-goldenberg-2006, clinical-achilles-2017, clinical-metaireau-2024-praxis, clinical-rosenzopf-2024-imitation]
    steps:
      - id: mip
        region: hcp-mmp:left:50
        source_name: L_MIP_ROI
        name: { en: Left medial intraparietal area MIP, fr: Aire intrapariétale médiale MIP gauche }
        role: { en: Grasp system · online control, fr: Système de saisie · contrôle en ligne }
        explanation:
          en: In the comparative model, the dorso-dorsal system includes MIP and V6A and contributes to the visual guidance of reaching and grasping.
          fr: Dans le modèle comparatif, le système dorso-dorsal comprend les aires MIP et V6A et contribue au guidage visuel des mouvements d’atteinte et de préhension.
        mapping:
          en: The atlas area lies in the intraparietal sulcus and is a candidate counterpart of macaque MIP. V6A is outside this display.
          fr: L’aire de l’atlas se situe dans le sillon intrapariétal et correspond possiblement à l’aire MIP du macaque. L’aire V6A est hors du champ de cette comparaison.
        view: superior
        plane: coronal
      - id: dorsal-premotor
        region: hcp-mmp:left:96
        source_name: L_6a_ROI
        name: { en: Left premotor area 6a, fr: Aire prémotrice 6a gauche }
        role: { en: Grasp system · dorsal premotor, fr: Système de saisie · prémoteur dorsal }
        explanation:
          en: Macaque retrograde tracing found inputs to dorsal premotor cortex from MIP and other superior parietal regions. A model fitted to human resting-state fMRI estimated a functional influence from MIP to area 6a. Tool imagery and execution studies implicated broader superior parietal and dorsal premotor territories.
          fr: Le traçage rétrograde chez le macaque a mis en évidence des afférences au cortex prémoteur dorsal depuis l’aire MIP et d’autres régions pariétales supérieures. Un modèle ajusté à des données d’IRM fonctionnelle au repos chez l’humain a estimé une influence fonctionnelle de MIP sur l’aire 6a. Les études d’imagerie mentale et d’exécution d’actions avec des outils impliquaient des territoires pariétaux supérieurs et prémoteurs dorsaux plus étendus.
        mapping:
          en: Area 6a lies along the superior precentral and superior frontal sulci. This HCP-MMP parcel samples dorsal premotor cortex.
          fr: L’aire 6a longe les sillons précentral supérieur et frontal supérieur. Cette parcelle HCP-MMP représente une partie du cortex prémoteur dorsal.
        view: superior
        plane: axial
      - id: mt
        region: hcp-mmp:left:23
        source_name: L_MT_ROI
        name: { en: Left visual motion area MT, fr: Aire visuelle du mouvement MT gauche }
        role: { en: Visual motion landmark, fr: Repère visuel du mouvement }
        explanation:
          en: The comparative model includes MT and MST among the visual motion territories associated with the ventro-dorsal system. This step displays the human atlas area MT.
          fr: Le modèle comparatif inclut les aires MT et MST parmi les territoires visuels du mouvement associés au système ventro-dorsal. Cette étape montre l’aire MT de l’atlas humain.
        mapping:
          en: This HCP-MMP parcel is mapped onto the individual surface. It is not a motion localizer measured in this brain.
          fr: Cette parcelle HCP-MMP est projetée sur la surface individuelle. Elle ne constitue pas une localisation du mouvement mesurée dans ce cerveau.
        view: left
        plane: coronal
      - id: anterior-inferior-parietal
        region: hcp-mmp:left:116
        source_name: L_PFt_ROI
        name: { en: Left anterior inferior parietal area PFt, fr: Aire pariétale inférieure antérieure PFt gauche }
        role: { en: Use system · tool use, fr: Système d’utilisation · usage des outils }
        explanation:
          en: The proposed Use system supports learned object-related actions. Tool studies implicate left inferior parietal territories. Peeters’ human–monkey comparison reported a human rostral response under its tested conditions; this does not establish universal human exclusivity or this parcel’s necessity for tool use.
          fr: Le système d’utilisation proposé soutient les actions apprises liées aux objets. Les études d’outils impliquent des territoires pariétaux inférieurs gauches. La comparaison humain–singe de Peeters rapportait une réponse rostrale humaine dans les conditions testées ; cela n’établit ni une exclusivité humaine universelle ni la nécessité de cette parcelle pour utiliser des outils.
        mapping:
          en: PFt lies mostly in the postcentral sulcus and extends onto the anterior supramarginal gyrus. Published tool sites are group activation peaks, not this parcel’s boundary, and apraxia lesions extend beyond it.
          fr: PFt se situe surtout dans le sillon postcentral et s’étend sur la partie antérieure du gyrus supramarginal. Les sites publiés pour les outils sont des pics d’activation de groupe, et non la limite de cette parcelle ; les lésions apraxiques la dépassent.
        view: left
        plane: coronal
      - id: ventral-premotor
        region: hcp-mmp:left:56
        source_name: L_6v_ROI
        name: { en: Left ventral premotor area 6v, fr: Aire prémotrice ventrale 6v gauche }
        role: { en: Use system · ventral premotor, fr: Système d’utilisation · prémoteur ventral }
        explanation:
          en: Macaque tracer studies identify ventral premotor inputs from anterior intraparietal and inferior parietal territories. A human resting-state model estimated a functional influence from PFt to 6v. Healthy imaging found convergent activation in ventral premotor and inferior parietal territories across tool tasks.
          fr: Les études de traçage chez le macaque montrent des afférences au cortex prémoteur ventral depuis des territoires intrapariétaux antérieurs et pariétaux inférieurs. Un modèle d’activité au repos chez l’humain a estimé une influence fonctionnelle de PFt sur l’aire 6v. L’imagerie chez des personnes saines a montré des activations convergentes des territoires prémoteurs ventraux et pariétaux inférieurs dans plusieurs tâches portant sur les outils.
        mapping:
          en: Area 6v lies on the precentral gyrus. This HCP-MMP parcel samples ventral premotor cortex.
          fr: L’aire 6v se trouve sur le gyrus précentral. Cette parcelle HCP-MMP représente une partie du cortex prémoteur ventral.
        view: left
        plane: axial
      - id: middle-temporal
        region: destrieux:left:38
        source_name: G_temporal_middle
        name: { en: Left middle temporal gyrus, fr: Gyrus temporal moyen gauche }
        role: { en: Tool and action knowledge, fr: Connaissances sur les outils et les actions }
        explanation:
          en: Naming tools engages the left posterior middle temporal gyrus, and left posterior temporal damage has been associated with deficits in recognizing actions. Use representations lie close to this semantic knowledge of manipulable objects.
          fr: La dénomination d’outils sollicite la partie postérieure du gyrus temporal moyen gauche, et des lésions temporales postérieures gauches ont été associées à des déficits de reconnaissance des actions. Les représentations d’utilisation sont proches de ces connaissances sémantiques sur les objets manipulables.
        mapping:
          en: This Destrieux parcel covers the whole gyrus. The cited tool studies implicated posterior portions of it.
          fr: Cette parcelle de Destrieux couvre le gyrus entier. Les études citées sur les outils impliquaient ses parties postérieures.
        view: left
        plane: coronal

  - id: objects
    name: { en: Visual object recognition, fr: Reconnaissance visuelle des objets }
    summary:
      en: Compare early visual, lateral occipital and ventral temporal landmarks involved in seeing objects.
      fr: Comparez les repères visuels précoces, occipitaux latéraux et temporaux ventraux impliqués dans la perception des objets.
    route:
      en: V1 · lateral occipital cortex · fusiform gyrus
      fr: V1 · cortex occipital latéral · gyrus fusiforme
    scope:
      en: The three right-sided landmarks sample a bilateral visual system. Their display order is pedagogical. The comparison leaves out V2, V4, anterior ventral temporal cortex and feedback connections.
      fr: Ces trois repères de l’hémisphère droit illustrent un système visuel bilatéral. Leur ordre de présentation est pédagogique. La comparaison laisse de côté V2, V4, le cortex temporal ventral antérieur et les rétroprojections.
    clinical:
      en: The clinical link is partial at the right lateral fusiform landmark. Konen’s patient had difficulty recognizing visually presented objects after head injury at age 18. Later MRI localized a lesion to the right posterior lateral fusiform gyrus. Initial CT showed additional injuries. Compared with controls, object-related fMRI responses were reduced in regions beyond the lesion, including in the opposite hemisphere. In a separate cohort of 64 adults with posterior cerebral artery stroke, lower object scores were most strongly associated with larger total lesion volume. All patients with object deficits also had word or face deficits, or both.
      fr: Le lien clinique est partiel au niveau du repère fusiforme latéral droit. Le patient de Konen avait des difficultés à reconnaître les objets présentés visuellement après un traumatisme crânien à 18 ans. Une IRM ultérieure a situé une lésion dans la partie postérieure du gyrus fusiforme latéral droit. Le scanner initial montrait d’autres atteintes. Par rapport aux témoins, les réponses d’IRM fonctionnelle liées aux objets étaient réduites dans des régions au-delà de la lésion, y compris dans l’hémisphère opposé. Dans une cohorte distincte de 64 adultes ayant subi un AVC dans le territoire de l’artère cérébrale postérieure, les scores plus faibles aux épreuves portant sur les objets étaient surtout associés à un volume lésionnel total plus élevé. Tous les patients présentant un déficit pour les objets avaient aussi un déficit pour les mots, les visages ou les deux.
    deficit: agnosia
    references: [object-localizer, object-agnosia, cortical-parcellation, object-lo1-retinotopy, clinical-robotham-2023-objects]
    clinical_references: [object-agnosia, clinical-robotham-2023-objects]
    steps:
      - id: v1
        region: hcp-mmp:right:1
        source_name: R_V1_ROI
        name: { en: Right primary visual cortex, fr: Cortex visuel primaire droit }
        role: { en: Early visual representation, fr: Représentation visuelle précoce }
        explanation:
          en: Begin in V1 before comparing extrastriate object-related territories. Early visual responses alone do not explain recognition.
          fr: Commencez en V1 avant de comparer les territoires extrastriés liés aux objets. Les réponses visuelles précoces ne suffisent pas à expliquer la reconnaissance.
        mapping:
          en: An HCP-MMP parcel mapped onto this surface, not an individual retinotopic or object-recognition localizer.
          fr: Une parcelle HCP-MMP projetée sur cette surface, et non une localisation rétinotopique ou de reconnaissance des objets individuelle.
        view: left
        plane: coronal
      - id: lateral-occipital
        region: hcp-mmp:right:20
        source_name: R_LO1_ROI
        name: { en: Right lateral occipital area LO1, fr: Aire occipitale latérale LO1 droite }
        role: { en: Lateral occipital landmark, fr: Repère occipital latéral }
        explanation:
          en: Malach and colleagues found lateral occipital responses favouring object images over textures. Use LO1 to locate part of lateral occipital visual cortex.
          fr: Malach et ses collègues ont trouvé des réponses occipitales latérales privilégiant les images d’objets aux textures. LO1 repère une partie du cortex visuel occipital latéral.
        mapping:
          en: Human retinotopic mapping places LO1 partly within the posterior lateral occipital complex. The HCP-MMP boundary locates the atlas area. The extent of object-related fMRI responses depends on the localizer.
          fr: La cartographie rétinotopique chez l’humain situe LO1 en partie dans la portion postérieure du complexe occipital latéral. La limite HCP-MMP délimite l’aire dans l’atlas. L’étendue des réponses d’IRM fonctionnelle liées aux objets dépend du protocole de localisation.
        view: right
        plane: axial
      - id: fusiform
        region: destrieux:right:21
        source_name: G_oc-temp_lat-fusifor
        name: { en: Right fusiform gyrus, fr: Gyrus fusiforme droit }
        role: { en: Ventral temporal landmark, fr: Repère temporal ventral }
        explanation:
          en: Later MRI in Konen’s patient located a lesion in the posterior part of the right lateral fusiform gyrus. Recognition of visually presented objects was impaired, with preserved identification by sound.
          fr: Une IRM ultérieure du patient de Konen a situé une lésion dans la partie postérieure du gyrus fusiforme latéral droit. La reconnaissance des objets présentés visuellement était altérée, tandis que leur identification par le son était préservée.
        mapping:
          en: The whole gyrus exceeds the focal lesion and functional object-responsive regions. It does not identify a face-selective area or a unique object-recognition centre.
          fr: Le gyrus entier dépasse la lésion focale et les régions fonctionnelles répondant aux objets. Il ne désigne ni une aire sélective aux visages ni un centre unique de reconnaissance des objets.
        view: inferior
        plane: coronal

  - id: reading
    name: { en: Reading network landmarks, fr: Repères du réseau de la lecture }
    summary:
      en: Locate visual word recognition alongside temporal and frontal language territories.
      fr: Repérez la reconnaissance visuelle des mots et les territoires langagiers temporaux et frontaux.
    route:
      en: Visual cortex · ventral occipitotemporal cortex · temporal and inferior frontal language territories
      fr: Cortex visuel · cortex occipitotemporal ventral · territoires langagiers temporaux et frontaux inférieurs
    scope:
      en: Four left-sided landmarks illustrate visual and language contributions to reading. Their display order is for comparison. The right hemisphere, intervening visual areas such as V2, and white-matter routes are outside this comparison.
      fr: Quatre repères gauches illustrent les contributions visuelles et langagières à la lecture. L’ordre d’affichage sert à les comparer. L’hémisphère droit, les aires visuelles intermédiaires comme V2 et les voies de substance blanche dépassent le cadre de cette comparaison.
    clinical:
      en: The clinical link is partial at the left ventral occipitotemporal landmark. Letter-by-letter reading followed left ventral occipitotemporal resection for epilepsy in two adults. One resection partly overlapped word-responsive cortex, and the other extended beyond the midfusiform gyrus. In Leff’s comparison, the six patients with pure alexia had additional left posterior fusiform damage compared with seven with hemianopic alexia. The groups shared an area of medial occipital lesion overlap. In a larger series of 64 adults assessed after posterior cerebral artery stroke, six showed impaired visual recognition of words with normal-range scores for faces and objects.
      fr: Le lien clinique est partiel au niveau du repère occipitotemporal ventral gauche. Une lecture lettre à lettre est apparue chez deux adultes après une résection occipitotemporale ventrale gauche pour épilepsie. Une résection recouvrait en partie le cortex répondant aux mots, et l’autre s’étendait au-delà de la partie moyenne du gyrus fusiforme. Dans l’étude de Leff, les six patients avec alexie pure présentaient une atteinte fusiforme postérieure gauche supplémentaire par rapport aux sept patients avec alexie hémianopsique. Les deux groupes présentaient une zone de chevauchement des lésions dans la région occipitale médiale gauche. Dans une série plus importante de 64 adultes évalués après un AVC dans le territoire de l’artère cérébrale postérieure, six présentaient un déficit de reconnaissance visuelle des mots avec des résultats dans la norme pour les visages et les objets.
    deficit: alexia
    references: [reading-network, reading-causal, reading-lesions, cortical-parcellation, reading-midfusiform-resection, reading-pca-profiles, reading-vision-language]
    clinical_references: [reading-causal, reading-lesions, reading-midfusiform-resection, reading-pca-profiles]
    steps:
      - id: v1
        region: hcp-mmp:left:1
        source_name: L_V1_ROI
        name: { en: Left primary visual cortex, fr: Cortex visuel primaire gauche }
        role: { en: Visual input landmark, fr: Repère des entrées visuelles }
        explanation:
          en: V1 contributes early visual processing. Fluent reading requires additional processes beyond this initial cortical representation.
          fr: V1 contribue au traitement visuel précoce. Une lecture fluide nécessite d’autres processus au-delà de cette représentation corticale initiale.
        mapping:
          en: This parcel represents the right visual hemifield. It is not the full visual input to reading, which also involves the opposite hemisphere.
          fr: Cette parcelle représente l’hémichamp visuel droit. Elle ne constitue pas toute l’entrée visuelle de la lecture, qui implique aussi l’hémisphère opposé.
        view: right
        plane: coronal
      - id: occipitotemporal
        region: destrieux:left:61
        source_name: S_oc-temp_lat
        name: { en: Left lateral occipitotemporal sulcus, fr: Sillon occipitotemporal latéral gauche }
        role: { en: Visual word recognition landmark, fr: Repère de reconnaissance visuelle des mots }
        explanation:
          en: Gaillard’s study identified word-responsive cortex with functional MRI and intracranial recordings. A small resection partly overlapped the word-responsive region and was followed by a selective reading deficit.
          fr: L’étude de Gaillard a repéré le cortex répondant aux mots par IRM fonctionnelle et par des enregistrements intracrâniens. Une petite résection recouvrait en partie cette région et a été suivie d’un déficit sélectif de lecture.
        mapping:
          en: The whole sulcal parcel is a broad landmark beside fusiform cortex. It does not reproduce the resection or isolate an individual visual word form area.
          fr: La parcelle sulcale entière est un repère large voisin du cortex fusiforme. Elle ne reproduit pas la résection et n’isole pas une aire individuelle de la forme visuelle des mots.
        view: inferior
        plane: coronal
      - id: middle-temporal
        region: destrieux:left:38
        source_name: G_temporal_middle
        name: { en: Left middle temporal gyrus, fr: Gyrus temporal moyen gauche }
        role: { en: Meaning-related processing, fr: Traitement lié au sens }
        explanation:
          en: Middle temporal territories participate in accessing word meaning as part of distributed semantic systems.
          fr: Les territoires temporaux moyens participent à l’accès au sens des mots au sein de systèmes sémantiques distribués.
        mapping:
          en: The whole gyrus is shown; semantic responses vary with the task and do not occupy the entire parcel uniformly.
          fr: Le gyrus entier est affiché ; les réponses sémantiques varient selon la tâche et n’occupent pas uniformément toute la parcelle.
        view: left
        plane: coronal
      - id: inferior-frontal
        region: destrieux:left:12
        source_name: G_front_inf-Opercular
        name: { en: Left inferior frontal pars opercularis, fr: Partie operculaire du gyrus frontal inférieur gauche }
        role: { en: Phonological and articulatory processing, fr: Traitement phonologique et articulatoire }
        explanation:
          en: Inferior frontal regions contribute to phonological and articulatory processes, with demands differing between silent reading and reading aloud.
          fr: Des régions frontales inférieures contribuent aux processus phonologiques et articulatoires, dont les exigences diffèrent entre lecture silencieuse et lecture à voix haute.
        mapping:
          en: This gyral parcel is broader than a task-responsive cluster. It is neither the whole reading network nor a single-purpose reading module.
          fr: Cette parcelle gyrale dépasse un foyer répondant à une tâche. Elle n’est ni tout le réseau de la lecture ni un module réservé à la lecture.
        view: left
        plane: axial

  - id: reaching
    name: { en: Reaching and sensory feedback, fr: Atteinte d’une cible et rétroaction sensorielle }
    summary:
      en: Compare parietal responses during reaches to visible targets with and without sight of the hand.
      fr: Comparez les réponses pariétales pendant le pointage vers des cibles visibles, avec ou sans vision de la main.
    route:
      en: Parieto-occipital sulcus · precuneus · intraparietal sulcus
      fr: Sillon pariéto-occipital · précunéus · sillon intrapariétal
    scope:
      en: Three left landmarks compare parts of the bilateral parietal reaching system. In healthy adults, Filimon compared reaching to visible peripheral targets with the moving hand either visible or hidden. The results leave the order of signals between the landmarks unresolved. Premotor, primary motor, cerebellar and descending pathways are outside the comparison.
      fr: Trois repères gauches comparent des régions du système pariétal bilatéral qui participe au pointage. Chez des adultes sains, Filimon a comparé le pointage vers des cibles périphériques visibles, avec ou sans vision de la main en mouvement. Les résultats laissent indéterminé l’ordre de transmission des signaux entre les repères. Les voies prémotrices, motrices primaires, cérébelleuses et descendantes sont hors de la comparaison.
    clinical:
      en: The clinical link is partial at the precuneus and broader parieto-occipital region. In unilateral stroke patients with optic ataxia, lesion overlap involved the lateral parieto-occipital junction and extended medially through white matter to the precuneus. In a separate adult, inaccurate reaching followed a left parieto-occipital haemorrhage involving the superior parietal lobule, intraparietal sulcus and adjacent white matter. The affected arm also had some motor and proprioceptive difficulty.
      fr: Le lien clinique est partiel au niveau du précunéus et de la région pariéto-occipitale au sens large. Chez des patients présentant une ataxie optique après un AVC unilatéral, le chevauchement lésionnel touchait la jonction pariéto-occipitale latérale et s’étendait médialement jusqu’au précunéus par la substance blanche. Chez une autre adulte, un pointage imprécis a suivi une hémorragie pariéto-occipitale gauche touchant le lobule pariétal supérieur, le sillon intrapariétal et la substance blanche adjacente. Le bras atteint présentait aussi certaines difficultés motrices et proprioceptives.
    deficit: optic-ataxia
    references: [reach-feedback, reach-lesions, reach-left-haemorrhage]
    clinical_references: [reach-lesions, reach-left-haemorrhage]
    steps:
      - id: parieto-occipital
        region: destrieux:left:66
        source_name: S_parieto_occipital
        name: { en: Left parieto-occipital sulcus, fr: Sillon pariéto-occipital gauche }
        role: { en: Visual feedback landmark, fr: Repère de rétroaction visuelle }
        explanation:
          en: Filimon and colleagues found greater activity near the superior end of this sulcus when participants could see their reaching hand.
          fr: Filimon et ses collègues ont trouvé davantage d’activité près de l’extrémité supérieure de ce sillon lorsque les participants voyaient leur main atteindre la cible.
        mapping:
          en: The whole sulcal parcel exceeds the superior functional focus. It does not identify a single human homologue of a macaque reach area.
          fr: La parcelle sulcale entière dépasse le foyer fonctionnel supérieur. Elle ne désigne pas un homologue humain unique d’une aire d’atteinte de cible du macaque.
        view: right
        plane: sagittal
      - id: precuneus
        region: destrieux:left:30
        source_name: G_precuneus
        name: { en: Left precuneus, fr: Précunéus gauche }
        role: { en: Reaching responses with an unseen hand, fr: Réponses au pointage avec la main masquée }
        explanation:
          en: An anterior precuneus region responded when healthy participants reached toward visible targets with the hand either visible or hidden. The experiment leaves the contribution of proprioceptive input uncertain.
          fr: Une région antérieure du précunéus répondait lorsque des participants sains pointaient vers des cibles visibles, avec ou sans vision de la main. L’expérience laisse indéterminée la contribution des signaux proprioceptifs.
        mapping:
          en: This parcel includes posterior territories beyond the anterior reach-responsive focus. It is not a map of limb position or a recorded proprioceptive signal.
          fr: Cette parcelle inclut des territoires postérieurs au-delà du foyer antérieur répondant à l’atteinte de cible. Elle n’est ni une carte de position du membre ni un signal proprioceptif enregistré.
        view: right
        plane: sagittal
      - id: intraparietal
        region: destrieux:left:57
        source_name: S_intrapariet_and_P_trans
        name: { en: Left intraparietal and transverse parietal sulci, fr: Sillons intrapariétal et pariétal transverse gauches }
        role: { en: Parietal sensorimotor integration, fr: Intégration sensorimotrice pariétale }
        explanation:
          en: Anterior precuneus and nearby medial intraparietal activity were contiguous in the analysis shared by reaching with the hand visible, reaching with the hand hidden and saccades. The two foci separated at a higher statistical threshold.
          fr: L’activité du précunéus antérieur et celle près du sillon intrapariétal médial étaient contiguës dans l’analyse commune au pointage avec vision de la main, au pointage sans vision de la main et aux saccades. Les deux foyers se séparaient à un seuil statistique plus élevé.
        mapping:
          en: The combined sulcal parcel is broader than medial intraparietal cortex. Shared reach responses do not establish a direct anatomical connection between these landmarks.
          fr: La parcelle sulcale combinée dépasse le cortex intrapariétal médial. Des réponses communes à l’atteinte de cible n’établissent pas de connexion anatomique directe entre ces repères.
        view: superior
        plane: axial

  - id: control
    name: { en: Cognitive control systems, fr: Systèmes de contrôle cognitif }
    summary:
      en: Compare lateral frontoparietal control with medial frontal and anterior insular landmarks.
      fr: Comparez le contrôle frontopariétal latéral aux repères frontaux médiaux et insulaires antérieurs.
    route:
      en: Lateral prefrontal and intraparietal territories · dorsal cingulate and anterior insula
      fr: Territoires préfrontaux latéraux et intrapariétaux · cortex cingulaire dorsal et insula antérieure
    scope:
      en: Four left-hemisphere landmarks illustrate two functional networks described in studies in humans. The comparison leaves out the opposite hemisphere, anterior prefrontal regions, the frontal operculum and intervening white matter. The display order groups landmarks for comparison.
      fr: Quatre repères de l’hémisphère gauche illustrent deux réseaux fonctionnels décrits chez l’humain. La comparaison laisse de côté l’hémisphère opposé, les régions préfrontales antérieures, l’opercule frontal et la substance blanche intermédiaire. L’ordre d’affichage regroupe les repères pour les comparer.
    clinical:
      en: The clinical link is partial at the left lateral prefrontal landmark. An adult stroke patient with a left inferior frontal lesion, a smaller left middle frontal lesion and right parietal ischaemic change had increased interference in Stroop naming times compared with controls. In Gläscher’s registry analysis, longer times in the incongruent Stroop colour–word condition were associated with left middle frontal lesions. Separate Trail Making and card sorting measures involved the left rostral anterior cingulate region. Gläscher’s study did not report age at injury for the task samples.
      fr: Le lien clinique est partiel au niveau du repère préfrontal latéral gauche. Après un AVC, une patiente présentant une lésion frontale inférieure gauche, une lésion frontale moyenne gauche plus petite et des remaniements ischémiques pariétaux droits présentait un effet d’interférence plus marqué que les témoins sur le temps de dénomination au Stroop. Dans l’analyse du registre de Gläscher, des temps plus longs à la condition couleur-mot incongruente du Stroop étaient associés à des lésions frontales moyennes gauches. Des mesures distinctes du Trail Making Test et du test de classement de cartes impliquaient la région cingulaire antérieure rostrale gauche. L’étude de Gläscher ne précisait pas l’âge à la lésion pour les sous-groupes évalués à chaque épreuve.
    deficit: executive
    references: [adaptive-control, control-systems, control-lesions, cortical-parcellation, control-stroop-case, cingulo-insular-tractography]
    clinical_references: [control-lesions, control-stroop-case]
    steps:
      - id: middle-frontal
        region: destrieux:left:15
        source_name: G_front_middle
        name: { en: Left middle frontal gyrus, fr: Gyrus frontal moyen gauche }
        role: { en: Lateral prefrontal control landmark, fr: Repère de contrôle préfrontal latéral }
        explanation:
          en: Lateral prefrontal regions participate in flexible task control. Cole and colleagues found that the frontoparietal network’s brain-wide functional connectivity shifted with task demands.
          fr: Des régions préfrontales latérales participent au contrôle flexible des tâches. Cole et ses collègues ont trouvé que la connectivité fonctionnelle globale du réseau frontopariétal changeait selon les exigences de la tâche.
        mapping:
          en: The whole gyrus includes territories beyond dorsolateral prefrontal control regions. It does not reproduce a functional network assignment for this individual.
          fr: Le gyrus entier inclut des territoires au-delà des régions de contrôle préfrontales dorsolatérales. Il ne reproduit pas une attribution de réseau fonctionnel pour cet individu.
        view: left
        plane: axial
      - id: intraparietal
        region: destrieux:left:57
        source_name: S_intrapariet_and_P_trans
        name: { en: Left intraparietal and transverse parietal sulci, fr: Sillons intrapariétal et pariétal transverse gauches }
        role: { en: Frontoparietal control partner, fr: Partenaire du contrôle frontopariétal }
        explanation:
          en: Dosenbach and colleagues included intraparietal regions with dorsolateral prefrontal cortex in a network associated with adaptive task control.
          fr: Dosenbach et ses collègues ont inclus des régions intrapariétales avec le cortex préfrontal dorsolatéral dans un réseau associé au contrôle adaptatif des tâches.
        mapping:
          en: This combined sulcal parcel is broader than the study’s functional regions and also contains territories involved in other networks and tasks.
          fr: Cette parcelle sulcale combinée dépasse les régions fonctionnelles de l’étude et contient aussi des territoires impliqués dans d’autres réseaux et tâches.
        view: superior
        plane: axial
      - id: dorsal-cingulate
        region: hcp-mmp:left:62
        source_name: L_d32_ROI
        name: { en: Left dorsal cingulate area d32, fr: Aire cingulaire dorsale d32 gauche }
        role: { en: Medial control landmark, fr: Repère de contrôle médial }
        explanation:
          en: Dorsal anterior cingulate and medial superior frontal regions contributed to a separate cingulo-opercular system, associated with sustained task-set signals in Dosenbach’s study.
          fr: Des régions cingulaires antérieures dorsales et frontales supérieures médiales contribuaient à un système cingulo-operculaire distinct, associé à des signaux soutenus de maintien des règles de la tâche dans l’étude de Dosenbach.
        mapping:
          en: Area d32 locates a dorsal cingulate field. The functional region in Dosenbach’s study extended into medial superior frontal cortex. The lesion results in Gläscher’s study concern the rostral anterior cingulate region.
          fr: L’aire d32 repère un champ cingulaire dorsal. La région fonctionnelle de l’étude de Dosenbach s’étendait au cortex frontal supérieur médial. Les résultats lésionnels de Gläscher concernent la région cingulaire antérieure rostrale.
        view: right
        plane: sagittal
      - id: anterior-insula
        region: destrieux:left:18
        source_name: G_insular_short
        name: { en: Left short insular gyri, fr: Gyrus courts de l’insula gauche }
        role: { en: Anterior insular control landmark, fr: Repère de contrôle insulaire antérieur }
        explanation:
          en: Anterior insula and frontal opercular regions joined the medial frontal component in Dosenbach’s cingulo-opercular network. Tang and colleagues estimated fibre trajectories between anterior cingulate, insular and ventrolateral prefrontal territories using human diffusion MRI.
          fr: Des régions insulaires antérieures et operculaires frontales rejoignaient la composante frontale médiale dans le réseau cingulo-operculaire de Dosenbach. Tang et ses collègues ont estimé des trajectoires de fibres entre le cingulaire antérieur et des territoires insulaires et préfrontaux ventrolatéraux par IRM de diffusion chez l’humain.
        mapping:
          en: The short insular gyri are a broad anterior insular landmark. This parcel neither isolates the functional focus nor includes the adjoining frontal operculum.
          fr: Les gyrus courts de l’insula sont un repère insulaire antérieur large. Cette parcelle n’isole pas le foyer fonctionnel et n’inclut pas l’opercule frontal adjacent.
        view: left
        plane: coronal

  - id: pain
    name: { en: Pain-related cortical systems, fr: Systèmes corticaux liés à la douleur }
    summary:
      en: Compare insular and cingulate landmarks while distinguishing nociceptive input, pain experience and behavioural responses.
      fr: Comparez les repères insulaires et cingulaires en distinguant les entrées nociceptives, l’expérience douloureuse et les réponses comportementales.
    route:
      en: Posterior insula · anterior insula · anterior midcingulate cortex
      fr: Insula postérieure · insula antérieure · cortex cingulaire moyen antérieur
    scope:
      en: Three left cortical landmarks within distributed bilateral systems. Spinal, brainstem, thalamic and other cortical contributions are omitted. Mouraux’s multisensory experiment shows why activity in these broad territories cannot by itself establish pain-specific processing.
      fr: Trois repères corticaux gauches au sein de systèmes bilatéraux distribués. Les contributions spinales, du tronc cérébral, thalamiques et d’autres cortex sont omises. L’expérience multisensorielle de Mouraux montre pourquoi une activité dans ces larges territoires ne suffit pas à établir un traitement propre à la douleur.
    clinical:
      en: Berthier’s six adults recognized painful stimuli despite reduced or absent protective withdrawal and suitable emotional responses on both sides of the body. All had unilateral insular involvement, with variable neighbouring injury and cortical sensory deficits in four. The syndrome persisted in all five patients followed for at least six months. The clinical link is partial through insular involvement. The case series leaves the contributions of individual insular regions and the midcingulate landmark unresolved.
      fr: Dans la série de Berthier, les six adultes reconnaissaient les stimuli douloureux malgré des réponses de retrait protecteur et des réactions émotionnelles appropriées diminuées ou absentes des deux côtés du corps. Tous avaient une atteinte insulaire unilatérale, avec des lésions voisines d’étendue variable et des déficits sensitifs corticaux chez quatre patients. Le tableau persistait chez les cinq patients suivis pendant au moins six mois. Le lien clinique est partiel et repose sur l’atteinte insulaire. La série laisse indéterminée la contribution de chaque sous-région insulaire et du repère cingulaire moyen.
    deficit: pain-asymbolia
    references: [pain-activation, pain-specificity, pain-dissociation]
    clinical_references: [pain-dissociation]
    steps:
      - id: posterior-insula
        region: destrieux:left:17
        source_name: G_Ins_lg_and_S_cent_ins
        name: { en: Left long insular gyri and central insular sulcus, fr: Gyrus longs et sillon central de l’insula gauche }
        role: { en: Posterior insular landmark, fr: Repère insulaire postérieur }
        explanation:
          en: Duerden and Albanese’s meta-analysis identified posterior insular activation across studies using noxious stimulation.
          fr: La méta-analyse de Duerden et Albanese a identifié une activation insulaire postérieure dans des études utilisant des stimulations nocives.
        mapping:
          en: The whole posterior insular parcel exceeds the reported dorsal posterior focus. It does not identify nociceptive neurons or measure perceived pain.
          fr: La parcelle insulaire postérieure entière dépasse le foyer dorsal postérieur rapporté. Elle n’identifie pas les neurones nociceptifs et ne mesure pas la douleur perçue.
        view: left
        plane: coronal
      - id: anterior-insula
        region: destrieux:left:18
        source_name: G_insular_short
        name: { en: Left short insular gyri, fr: Gyrus courts de l’insula gauche }
        role: { en: Anterior insular landmark, fr: Repère insulaire antérieur }
        explanation:
          en: Anterior insular responses are common in noxious-stimulus studies. These regions also participate in broader responses to salient events.
          fr: Les réponses insulaires antérieures sont fréquentes dans les études de stimuli nocifs. Ces régions participent aussi à des réponses plus larges aux événements saillants.
        mapping:
          en: The short gyri do not isolate a pain-specific functional area. Their use in this and the control tour does not imply that the same neurons perform both tasks.
          fr: Les gyrus courts n’isolent pas une aire fonctionnelle propre à la douleur. Leur présence dans ce parcours et celui du contrôle n’implique pas que les mêmes neurones assurent les deux tâches.
        view: left
        plane: coronal
      - id: midcingulate
        region: destrieux:left:7
        source_name: G_and_S_cingul-Mid-Ant
        name: { en: Left anterior midcingulate cortex, fr: Cortex cingulaire moyen antérieur gauche }
        role: { en: Medial response-related landmark, fr: Repère médial lié aux réponses }
        explanation:
          en: Cingulate territories are recruited in noxious-stimulus experiments, alongside regions involved in salience and behavioural responses. Their activity is not a unique readout of pain.
          fr: Des territoires cingulaires sont recrutés dans les expériences de stimuli nocifs, avec des régions impliquées dans la saillance et les réponses comportementales. Leur activité n’est pas un indicateur unique de douleur.
        mapping:
          en: This anatomical midcingulate parcel is a selected landmark near reported cingulate activations, not their meta-analytic cluster or a pain-intensity scale.
          fr: Cette parcelle anatomique cingulaire moyenne est un repère sélectionné près des activations cingulaires rapportées, et non leur amas méta-analytique ni une échelle d’intensité douloureuse.
        view: right
        plane: sagittal

  - id: emotion
    name: { en: Faces and emotion recognition, fr: Visages et reconnaissance des émotions }
    summary:
      en: Locate temporal landmarks for face processing and both amygdalae in the context of bilateral temporal injury.
      fr: Situez les repères temporaux du traitement des visages et les deux amygdales dans le contexte d’une atteinte temporale bilatérale.
    route:
      en: Fusiform and superior temporal territories · bilateral amygdala
      fr: Territoires fusiformes et temporaux supérieurs · amygdales bilatérales
    scope:
      en: Right temporal landmarks followed by both amygdalae, within a wider bilateral system. Identity, gaze and emotional expression recruit overlapping but distinguishable processes. This tour is not a serial face-to-fear pathway or a complete emotion network.
      fr: Des repères temporaux droits suivis des deux amygdales, au sein d’un système bilatéral plus vaste. L’identité, le regard et l’expression émotionnelle mobilisent des processus qui se chevauchent mais restent distinguables. Ce parcours n’est ni une voie sérielle du visage à la peur ni un réseau émotionnel complet.
    clinical:
      en: Three adults with bilateral anterior temporal damage after herpes simplex encephalitis were less accurate as a group than healthy controls at labelling fear and sadness in photographs of faces. All three had damage involving both amygdalae, the hippocampal region and adjacent temporal cortex, so the comparison concerns combined temporal injury. The clinical link is partial at the amygdalar landmarks. The wider temporal injury leaves their individual contribution unresolved.
      fr: Après une encéphalite herpétique, trois adultes présentant des lésions temporales antérieures bilatérales identifiaient en moyenne moins bien que les témoins sains la peur et la tristesse sur des photographies de visages. Les lésions touchaient chez tous les trois les deux amygdales, la région hippocampique et le cortex temporal adjacent. La comparaison porte donc sur une atteinte temporale étendue. Le lien clinique est partiel au niveau des repères amygdaliens. L’étendue des lésions temporales laisse indéterminée la contribution propre des amygdales.
    deficit: emotion-recognition
    references: [face-system, clinical-schmolck-2001]
    clinical_references: [clinical-schmolck-2001]
    steps:
      - id: fusiform
        region: destrieux:right:21
        source_name: G_oc-temp_lat-fusifor
        name: { en: Right fusiform gyrus, fr: Gyrus fusiforme droit }
        role: { en: Face-form landmark, fr: Repère de la forme des visages }
        explanation:
          en: Haxby’s distributed model emphasizes fusiform contributions to relatively stable facial information used to recognize individuals.
          fr: Le modèle distribué de Haxby souligne les contributions fusiformes aux informations faciales relativement stables utilisées pour reconnaître les individus.
        mapping:
          en: The whole gyrus does not isolate an individual fusiform face area. Its presence in the object tour reflects a broad anatomical label, not identical functional populations.
          fr: Le gyrus entier n’isole pas une aire fusiforme des visages individuelle. Sa présence dans le parcours des objets reflète une étiquette anatomique large, et non des populations fonctionnelles identiques.
        view: inferior
        plane: coronal
      - id: superior-temporal
        region: destrieux:right:74
        source_name: S_temporal_sup
        name: { en: Right superior temporal sulcus, fr: Sillon temporal supérieur droit }
        role: { en: Changeable facial information, fr: Informations faciales changeantes }
        explanation:
          en: Superior temporal sulcal regions contribute to processing changeable aspects of faces, including gaze and expression, in Haxby’s model.
          fr: Des régions du sillon temporal supérieur contribuent au traitement des aspects changeants des visages, dont le regard et l’expression, dans le modèle de Haxby.
        mapping:
          en: The full sulcal parcel exceeds the posterior face-responsive territories. It does not measure gaze sensitivity or localize expression processing in this individual.
          fr: La parcelle sulcale entière dépasse les territoires postérieurs répondant aux visages. Elle ne mesure pas la sensibilité au regard et ne localise pas le traitement des expressions chez cet individu.
        view: right
        plane: coronal
      - id: left-amygdala
        region: learning:left:amygdala
        source_name: Amygdala and transition areas
        name: { en: Left amygdala, fr: Amygdale gauche }
        role: { en: Bilateral lesion context, fr: Contexte lésionnel bilatéral }
        explanation:
          en: Both amygdalae were involved in each patient. The left landmark represents one side of that bilateral injury.
          fr: Les deux amygdales étaient atteintes chez chacun des patients. Le repère gauche situe l’un des deux côtés de cette atteinte.
        mapping:
          en: This teaching label combines amygdalar nuclei and nearby transition areas. It marks one side of the larger bilateral temporal injury described in the study.
          fr: Ce repère pédagogique regroupe des noyaux de l’amygdale et des aires de transition voisines. Il situe un côté de l’atteinte temporale bilatérale plus étendue décrite dans l’étude.
        view: anterior
        plane: coronal
      - id: right-amygdala
        region: learning:right:amygdala
        source_name: Amygdala and transition areas
        name: { en: Right amygdala, fr: Amygdale droite }
        role: { en: Bilateral temporal injury, fr: Atteinte temporale bilatérale }
        explanation:
          en: The right amygdala was involved within a larger temporal lesion, as on the left.
          fr: À droite comme à gauche, l’amygdale était atteinte au sein d’une lésion temporale plus étendue.
        mapping:
          en: This teaching label combines amygdalar nuclei and nearby transition areas. It marks one side of the larger bilateral temporal injury described in the study.
          fr: Ce repère pédagogique regroupe des noyaux de l’amygdale et des aires de transition voisines. Il situe un côté de l’atteinte temporale bilatérale plus étendue décrite dans l’étude.
        view: anterior
        plane: coronal

  - id: spatial-hearing
    name: { en: Locating sounds in space, fr: Localisation des sons dans l’espace }
    summary:
      en: Compare temporal, parietal and frontal landmarks associated with auditory spatial judgments.
      fr: Comparez les repères temporaux, pariétaux et frontaux associés aux jugements spatiaux auditifs.
    route:
      en: Posterior temporal · parietal · superior frontal territories
      fr: Territoires temporaux postérieurs · pariétaux · frontaux supérieurs
    scope:
      en: Three right-sided cortical landmarks in a bilateral auditory system. Alain’s study contrasted location and pitch judgments of the same sounds. Brainstem binaural computations, primary auditory fields and other attention and motor contributions are omitted; the order is not a demonstrated serial pathway.
      fr: Trois repères corticaux droits dans un système auditif bilatéral. L’étude d’Alain comparait les jugements de position et de hauteur des mêmes sons. Les calculs binauraux du tronc cérébral, les champs auditifs primaires et d’autres contributions attentionnelles et motrices sont omis ; l’ordre n’est pas une voie sérielle démontrée.
    clinical:
      en: The clinical link is partial at the lateral superior temporal landmark. In Clarke’s series, four adults with right-hemisphere lesions had difficulty judging the position of sounds presented over headphones and retained environmental-sound recognition. Three showed the reverse pattern. In Adriani’s recent-lesion series, one adult with right posterior superior temporal injury and adjacent damage had selective difficulty judging sound position. Another adult performed within the expected range on all three tests despite injury involving parts of the proposed networks. In a later chronic stroke sample, loudspeaker localization and headphone lateralization could differ within the same person.
      fr: Le lien clinique est partiel au niveau du repère temporal supérieur latéral. Dans la série de Clarke, quatre adultes ayant une lésion de l’hémisphère droit avaient des difficultés à juger la position de sons présentés au casque et reconnaissaient les sons de l’environnement. Trois présentaient le profil inverse. Dans la série de lésions récentes d’Adriani, une personne adulte ayant une atteinte temporale supérieure postérieure droite et des lésions adjacentes avait une difficulté sélective à juger la position des sons. Un autre adulte obtenait des résultats dans les limites attendues aux trois épreuves auditives malgré une lésion touchant une partie des réseaux proposés. Dans un échantillon ultérieur de patients à distance de l’AVC, la localisation de sons émis par des haut-parleurs et la latéralisation au casque pouvaient différer chez une même personne.
    deficit: sound-localization
    references: [auditory-space, auditory-space-lesions, auditory-space-limits, clinical-dietz-2026-sound-localization]
    clinical_references: [auditory-space-lesions, auditory-space-limits, clinical-dietz-2026-sound-localization]
    steps:
      - id: superior-temporal
        region: destrieux:right:34
        source_name: G_temp_sup-Lateral
        name: { en: Right lateral superior temporal gyrus, fr: Partie latérale du gyrus temporal supérieur droit }
        role: { en: Posterior auditory landmark, fr: Repère auditif postérieur }
        explanation:
          en: Alain’s location-versus-pitch contrast peaked in the posterior middle temporal gyri. Activity in a separate right superior temporal region was correlated with parietal activity during the location task.
          fr: Dans la comparaison entre jugement de position et jugement de hauteur d’Alain, les pics temporaux se situaient dans les gyri temporaux moyens postérieurs. Dans une région temporale supérieure droite distincte, l’activité était corrélée à l’activité pariétale pendant le jugement de position.
        mapping:
          en: The whole lateral superior temporal gyrus approximates the cortical territory affected in some adult cases. The fMRI peak was reported in the neighbouring posterior middle temporal gyrus.
          fr: Le gyrus temporal supérieur latéral entier situe approximativement le territoire cortical atteint dans certains cas adultes. Le pic d’activation a été rapporté dans le gyrus temporal moyen postérieur voisin.
        view: right
        plane: coronal
      - id: superior-parietal
        region: destrieux:right:27
        source_name: G_parietal_sup
        name: { en: Right superior parietal lobule, fr: Lobule pariétal supérieur droit }
        role: { en: Spatial judgment landmark, fr: Repère du jugement spatial }
        explanation:
          en: Right superior parietal cortex showed a larger response during judgments of sound position than during pitch judgments.
          fr: Le cortex pariétal supérieur droit répondait davantage lors des jugements de position sonore que lors des jugements de hauteur.
        mapping:
          en: This broad superior parietal landmark does not reproduce the fMRI cluster or Clarke’s inferior parietal lesions. Those studies used different tasks and methods.
          fr: Ce large repère pariétal supérieur ne reproduit ni l’amas IRMf ni les lésions pariétales inférieures de Clarke. Ces études utilisaient des tâches et des méthodes différentes.
        view: superior
        plane: axial
      - id: superior-frontal
        region: destrieux:right:55
        source_name: S_front_sup
        name: { en: Right superior frontal sulcus, fr: Sillon frontal supérieur droit }
        role: { en: Frontal task-related landmark, fr: Repère frontal lié à la tâche }
        explanation:
          en: Alain reported greater activity near the right superior frontal sulcus during judgments of sound position. Participants held the first sound in memory and reported the position of the second relative to the first.
          fr: Alain a observé une activité plus forte près du sillon frontal supérieur droit pendant les jugements de position sonore. Les participants mémorisaient le premier son et indiquaient la position du second par rapport au premier.
        mapping:
          en: The whole sulcus is not a dedicated auditory-localization centre. Its anatomy does not determine whether a response is auditory, attentional or motor.
          fr: Le sillon entier n’est pas un centre réservé à la localisation auditive. Son anatomie ne détermine pas si une réponse est auditive, attentionnelle ou motrice.
        view: right
        plane: axial

  - id: motion
    name: { en: Visual motion landmarks, fr: Repères de la vision du mouvement }
    summary:
      en: Compare early visual cortex with two extrastriate territories sensitive to visual motion.
      fr: Comparez le cortex visuel précoce à deux territoires extrastriés sensibles au mouvement visuel.
    route:
      en: V1 · V3A · MT
      fr: V1 · V3A · MT
    scope:
      en: Three right-sided landmarks in bilateral visual systems. The sequence does not imply a direct V1-to-V3A-to-MT chain. Other motion-sensitive areas and white-matter pathways are omitted.
      fr: Trois repères droits dans des systèmes visuels bilatéraux. La séquence n’implique pas une chaîne directe V1–V3A–MT. D’autres aires sensibles au mouvement et les voies de substance blanche sont omises.
    clinical:
      en: The clinical link is partial at the lateral occipitotemporal region containing MT. L.M. had lasting difficulty perceiving visual motion after bilateral temporo-occipital injury extending into adjacent white matter. In the same patient, a comparison with previously published V5 locations suggested overlap in both hemispheres. Another adult had persistent motion blindness after a right temporoparietal subcortical haemorrhage adjacent to an earlier infarct. The effects of injury to a connection among these landmarks remain unresolved.
      fr: Le lien clinique est partiel au niveau de la région occipitotemporale latérale qui comprend MT. L.M. présentait un trouble durable de la perception visuelle du mouvement après une atteinte temporo-occipitale bilatérale s’étendant à la substance blanche adjacente. Chez la même patiente, une comparaison avec les localisations de V5 publiées auparavant suggérait un recoupement dans les deux hémisphères. Un autre adulte présentait une cécité au mouvement persistante après une hémorragie sous-corticale temporopariétale droite au voisinage d’un infarctus antérieur. Les effets d’une lésion touchant une connexion entre ces repères restent indéterminés.
    deficit: akinetopsia
    references: [motion-mapping, motion-lesions, cortical-parcellation, clinical-otsuka-hirota-2014, clinical-shipp-1994]
    clinical_references: [motion-lesions, clinical-otsuka-hirota-2014, clinical-shipp-1994]
    steps:
      - id: v1
        region: hcp-mmp:right:1
        source_name: R_V1_ROI
        name: { en: Right primary visual cortex, fr: Cortex visuel primaire droit }
        role: { en: Early visual landmark, fr: Repère visuel précoce }
        explanation:
          en: Begin with V1, a retinotopically organized reference for comparing the extrastriate areas in Tootell’s study.
          fr: Commencez par V1, une référence organisée de façon rétinotopique pour comparer les aires extrastriées de l’étude de Tootell.
        mapping:
          en: This HCP-MMP parcel locates primary visual cortex; it does not show motion responses measured in this individual.
          fr: Cette parcelle HCP-MMP situe le cortex visuel primaire ; elle n’affiche pas de réponses au mouvement mesurées chez cet individu.
        view: left
        plane: coronal
      - id: v3a
        region: hcp-mmp:right:13
        source_name: R_V3A_ROI
        name: { en: Right visual area V3A, fr: Aire visuelle V3A droite }
        role: { en: Dorsal motion-sensitive territory, fr: Territoire dorsal sensible au mouvement }
        explanation:
          en: In healthy participants, Tootell and colleagues mapped an organized representation of the opposite visual field in V3A. This region responded more strongly to moving stimuli than to stationary stimuli.
          fr: Chez des participants sains, Tootell et ses collègues ont cartographié dans V3A une représentation organisée de l’hémichamp visuel opposé. Cette région répondait davantage aux stimuli mobiles qu’aux stimuli immobiles.
        mapping:
          en: HCP-MMP V3A provides an atlas landmark rather than the study’s individual retinotopic boundary. Human and macaque area names do not establish identical functions.
          fr: V3A de HCP-MMP fournit un repère d’atlas plutôt que la limite rétinotopique individuelle de l’étude. Les noms d’aires humains et du macaque n’établissent pas des fonctions identiques.
        view: posterior
        plane: axial
      - id: mt
        region: hcp-mmp:right:23
        source_name: R_MT_ROI
        name: { en: Right middle temporal visual area MT, fr: Aire visuelle temporale moyenne MT droite }
        role: { en: Lateral motion-sensitive territory, fr: Territoire latéral sensible au mouvement }
        explanation:
          en: The moving stimuli also strongly activated the lateral motion-sensitive region that includes MT, also called V5.
          fr: Les stimuli mobiles activaient aussi fortement la région latérale sensible au mouvement qui comprend MT, également appelée V5.
        mapping:
          en: The HCP-MMP MT parcel is only part of the broader MT+ complex. It neither reproduces Zihl’s lesion nor includes every territory needed for motion perception.
          fr: La parcelle MT de HCP-MMP n’est qu’une partie du complexe MT+ plus large. Elle ne reproduit pas la lésion de Zihl et n’inclut pas tous les territoires nécessaires à la perception du mouvement.
        view: right
        plane: axial

  - id: number
    name: { en: Number and arithmetic systems, fr: Systèmes des nombres et du calcul }
    summary:
      en: Compare parietal landmarks for quantity, verbal arithmetic and spatial attention.
      fr: Comparez les repères pariétaux de la quantité, du calcul verbal et de l’attention spatiale.
    route:
      en: Intraparietal sulcus · angular gyrus · superior parietal lobule
      fr: Sillon intrapariétal · gyrus angulaire · lobule pariétal supérieur
    scope:
      en: Left-sided landmarks illustrating Dehaene and colleagues’ proposed three-system organization. Number processing also recruits the right hemisphere and frontal regions, with recruitment varying by task in Chochon’s fMRI study. These are interacting contributions rather than serial stages.
      fr: Des repères gauches illustrant l’organisation en trois systèmes proposée par Dehaene et ses collègues. Le traitement des nombres mobilise aussi l’hémisphère droit et des régions frontales, avec un recrutement variant selon la tâche dans l’étude IRMf de Chochon. Ces contributions interagissent plutôt que de former des étapes sérielles.
    clinical:
      en: The clinical link is partial at the left inferior parietal and intraparietal landmarks. Baldo and Dronkers found the strongest association for simple arithmetic in the left inferior parietal lobule, with some overlap with sentence comprehension. In Duricy and colleagues’ pooled analysis, all four approximation impairments among 25 tested cases occurred with left intraparietal involvement. Dehaene and Cohen also described a patient with left inferior parietal haemorrhage who had particular difficulty with subtraction and number bisection and retained some familiar arithmetic facts. These studies leave the connections among the landmarks unresolved.
      fr: Le lien clinique est partiel au niveau des repères pariétaux inférieurs et intrapariétaux gauches. Baldo et Dronkers ont observé l’association la plus marquée pour le calcul simple dans le lobule pariétal inférieur gauche, avec un chevauchement partiel avec la compréhension des phrases. Dans l’analyse groupée de Duricy et ses collègues, les quatre troubles d’approximation parmi les 25 cas évalués étaient tous associés à une atteinte intrapariétale gauche. Dehaene et Cohen ont aussi décrit un patient ayant subi une hémorragie pariétale inférieure gauche qui avait des difficultés particulières de soustraction et de bissection numérique, avec préservation de certains faits arithmétiques familiers. Ces études laissent indéterminées les connexions entre les repères.
    deficit: acalculia
    references: [number-systems, number-tasks, number-lesions, clinical-baldo-2007, clinical-duricy-2025]
    clinical_references: [number-lesions, clinical-baldo-2007, clinical-duricy-2025]
    steps:
      - id: intraparietal
        region: destrieux:left:57
        source_name: S_intrapariet_and_P_trans
        name: { en: Left intraparietal and transverse parietal sulci, fr: Sillons intrapariétal et pariétal transverse gauches }
        role: { en: Numerical quantity processing, fr: Traitement des quantités numériques }
        explanation:
          en: Intraparietal territories are recruited during numerical manipulation. Chochon’s experiment found their lateralization changed with comparison, multiplication and subtraction demands.
          fr: Des territoires intrapariétaux sont mobilisés pendant la manipulation numérique. Dans l’expérience de Chochon, leur latéralisation variait selon les exigences de comparaison, multiplication et soustraction.
        mapping:
          en: The combined Destrieux sulcal parcel is broader than the horizontal intraparietal segment discussed in the papers. It is not a number-specific functional localizer.
          fr: La parcelle sulcale combinée de Destrieux dépasse le segment intrapariétal horizontal décrit dans les articles. Elle n’est pas une localisation fonctionnelle spécifique aux nombres.
        view: superior
        plane: axial
      - id: angular
        region: destrieux:left:25
        source_name: G_pariet_inf-Angular
        name: { en: Left angular gyrus, fr: Gyrus angulaire gauche }
        role: { en: Verbal arithmetic contribution, fr: Contribution au calcul verbal }
        explanation:
          en: Dehaene and colleagues proposed a left angular contribution to handling numbers in verbal form, alongside other language regions.
          fr: Dehaene et ses collègues ont proposé une contribution angulaire gauche au traitement des nombres sous forme verbale, avec d’autres régions langagières.
        mapping:
          en: The whole angular gyrus includes territories serving other functions. Its border does not isolate arithmetic fact retrieval or delimit the subcortical lesion in Dehaene and Cohen’s case.
          fr: Le gyrus angulaire entier inclut des territoires assurant d’autres fonctions. Sa limite n’isole pas la récupération des faits arithmétiques et ne délimite pas la lésion sous-corticale du cas de Dehaene et Cohen.
        view: left
        plane: coronal
      - id: superior-parietal
        region: destrieux:left:27
        source_name: G_parietal_sup
        name: { en: Left superior parietal lobule, fr: Lobule pariétal supérieur gauche }
        role: { en: Spatial attention contribution, fr: Contribution de l’attention spatiale }
        explanation:
          en: Their model assigns posterior superior parietal territories a spatial attention contribution shared with nonnumerical tasks.
          fr: Leur modèle attribue aux territoires pariétaux supérieurs postérieurs une contribution d’attention spatiale partagée avec des tâches non numériques.
        mapping:
          en: The whole lobule extends beyond the posterior territories in the model. The opposite hemisphere is omitted, and no mental number line is measured on this surface.
          fr: Le lobule entier dépasse les territoires postérieurs du modèle. L’hémisphère opposé est omis et aucune ligne numérique mentale n’est mesurée sur cette surface.
        view: superior
        plane: axial

  - id: speech-planning
    name: { en: Speech apraxia lesion findings, fr: Résultats lésionnels de l’apraxie de la parole }
    summary:
      en: Compare three left frontal and insular landmarks implicated in acquired apraxia of speech.
      fr: Comparez trois repères frontaux et insulaires gauches impliqués dans l’apraxie acquise de la parole.
    route:
      en: Posterior inferior frontal cortex · anterior insula · precentral cortex
      fr: Cortex frontal inférieur postérieur · insula antérieure · cortex précentral
    scope:
      en: A comparison of lesion-study landmarks, not a serial pathway or a complete speech-production network. The studies differ in stroke timing and associated aphasia; their findings do not identify a single speech-planning centre.
      fr: Une comparaison de repères d’études lésionnelles, et non une voie sérielle ni un réseau complet de production de la parole. Les études diffèrent par le délai après AVC et l’aphasie associée ; leurs résultats n’identifient pas un centre unique de planification de la parole.
    clinical:
      en: The clinical link is partial at the three left-sided landmarks. In chronic stroke, Dronkers found lesion overlap in the left precentral gyrus of the insula in patients with apraxia of speech. In acute stroke, Hillis and colleagues associated apraxia of speech with damage or hypoperfusion of the left posterior inferior frontal gyrus. In seven selected acute cases with absent or equivocal aphasia, Graff-Radford and colleagues found maximal lesion overlap in left motor and premotor cortex. Nishio and colleagues reanalysed the same 136 patients as Itabashi and colleagues. After correction for multiple comparisons, direct lesion mapping identified no significant association with apraxia of speech at any voxel or region of interest. The studies leave the connections among these landmarks unresolved.
      fr: Le lien clinique est partiel au niveau des trois repères gauches. Dans l’AVC chronique, Dronkers a observé un chevauchement des lésions dans le gyrus précentral de l’insula gauche chez les patients présentant une apraxie de la parole. Dans l’AVC aigu, Hillis et ses collègues ont associé l’apraxie de la parole à une lésion ou à une hypoperfusion du gyrus frontal inférieur postérieur gauche. Chez sept patients sélectionnés en phase aiguë, dont l’aphasie était absente ou incertaine, Graff-Radford et ses collègues ont observé un chevauchement lésionnel maximal dans les cortex moteur et prémoteur gauches. Nishio et ses collègues ont réanalysé les données des mêmes 136 patients qu’Itabashi et ses collègues. Après correction pour comparaisons multiples, la cartographie directe des lésions n’a révélé d’association significative avec l’apraxie de la parole pour aucun voxel ni aucune région d’intérêt. Ces études laissent indéterminées les connexions entre les repères.
    deficit: speech-apraxia
    references: [speech-insula, speech-frontal, speech-motor, speech-apraxia-acute-reanalysis]
    clinical_references: [speech-insula, speech-frontal, speech-motor, speech-apraxia-acute-reanalysis]
    steps:
      - id: inferior-frontal
        region: destrieux:left:12
        source_name: G_front_inf-Opercular
        name: { en: Opercular part of the left inferior frontal gyrus, fr: Partie operculaire du gyrus frontal inférieur gauche }
        role: { en: Posterior frontal speech landmark, fr: Repère frontal postérieur de la parole }
        explanation:
          en: Hillis and colleagues associated apraxia of speech in acute stroke with posterior inferior frontal injury or reduced perfusion, rather than insular injury alone.
          fr: Hillis et ses collègues associaient l’apraxie de la parole dans l’AVC aigu à une atteinte frontale inférieure postérieure ou à une perfusion réduite, plutôt qu’à la seule atteinte insulaire.
        mapping:
          en: The Destrieux opercular parcel is a coarse posterior inferior frontal landmark. It does not reproduce the patients’ lesions or perfusion maps.
          fr: La parcelle operculaire de Destrieux est un repère frontal inférieur postérieur approximatif. Elle ne reproduit pas les lésions ni les cartes de perfusion des patients.
        view: left
        plane: axial
      - id: insula
        region: destrieux:left:18
        source_name: G_insular_short
        name: { en: Left short insular gyri, fr: Gyri courts de l’insula gauche }
        role: { en: Chronic-stroke comparison, fr: Comparaison dans l’AVC chronique }
        explanation:
          en: Dronkers’ chronic-stroke comparison implicated the left precentral insular gyrus. The other cited studies qualify an exclusive insular account.
          fr: La comparaison d’AVC chroniques de Dronkers impliquait le gyrus précentral insulaire gauche. Les autres études citées nuancent une explication exclusivement insulaire.
        mapping:
          en: This parcel groups the short insular gyri; it does not isolate the precentral insular gyrus or establish that all anterior insula plans speech.
          fr: Cette parcelle regroupe les gyri insulaires courts ; elle n’isole pas le gyrus précentral insulaire et n’établit pas que toute l’insula antérieure planifie la parole.
        view: left
        plane: coronal
      - id: precentral
        region: destrieux:left:29
        source_name: G_precentral
        name: { en: Left precentral gyrus, fr: Gyrus précentral gauche }
        role: { en: Motor and premotor comparison, fr: Comparaison motrice et prémotrice }
        explanation:
          en: Graff-Radford and colleagues found maximal lesion overlap across left motor and premotor cortex in seven selected stroke cases with absent or equivocal aphasia.
          fr: Graff-Radford et ses collègues observaient un chevauchement lésionnel maximal sur le cortex moteur et prémoteur gauche dans sept cas d’AVC sélectionnés avec aphasie absente ou équivoque.
        mapping:
          en: The whole precentral gyrus is shown. It neither isolates speech motor representations nor delineates all adjacent premotor tissue.
          fr: Le gyrus précentral entier est affiché. Il n’isole pas les représentations motrices de la parole et ne délimite pas tout le tissu prémoteur adjacent.
        view: left
        plane: coronal

  - id: writing
    name: { en: Spelling memory landmarks, fr: Repères de la mémoire orthographique }
    summary:
      en: Compare lesion-supported landmarks for long-term orthographic memory and letter-sequence working memory.
      fr: Comparez les repères étayés par des lésions pour la mémoire orthographique à long terme et la mémoire de travail des séquences de lettres.
    route:
      en: Ventral temporal cortex · inferior frontal cortex · intraparietal sulcus
      fr: Cortex temporal ventral · cortex frontal inférieur · sillon intrapariétal
    scope:
      en: The three left-sided landmarks compare two kinds of spelling difficulty. The frontal and temporal lesions associated with retrieving learned spellings occurred in separate patient subgroups. This comparison omits other implicated regions and the motor control of handwriting.
      fr: Les trois repères gauches permettent de comparer deux types de difficultés orthographiques. Les lésions frontales et temporales associées à la récupération des formes orthographiques apprises concernaient des sous-groupes distincts. La comparaison laisse de côté d’autres régions impliquées et le contrôle moteur de l’écriture manuscrite.
    clinical:
      en: The clinical link is partial at the individual landmarks. Among 33 adults selected for acquired spelling difficulty, 17 had a long-term orthographic memory deficit, ten a working-memory deficit and six both. In the corrected comparison of the 27 with one of the two memory deficit types, long-term impairment had separate left ventral temporal and posterior frontal lesion patterns. Working-memory impairment was linked to left posterior parietal and occipital regions around the intraparietal sulcus. A later study with substantial cohort overlap also linked a stronger effect of word length relative to frequency with left parietal damage.
      fr: Le lien clinique est partiel et concerne les repères pris individuellement. Parmi 33 adultes sélectionnés pour des difficultés orthographiques acquises, 17 présentaient un déficit de mémoire orthographique à long terme, dix un déficit de mémoire de travail et six les deux. Dans la comparaison statistiquement corrigée des 27 personnes présentant un seul des deux types de déficit de mémoire, l’atteinte de la mémoire à long terme correspondait à des profils lésionnels distincts, temporal ventral et frontal postérieur gauches. L’atteinte de la mémoire de travail était associée à des régions pariétales et occipitales postérieures gauches autour du sillon intrapariétal. Une étude ultérieure dont l’échantillon recoupait largement la cohorte initiale associait aussi un effet plus marqué de la longueur des mots par rapport à leur fréquence à une lésion pariétale gauche.
    deficit: agraphia
    references: [spelling-memory, spelling-memory-reanalysis]
    clinical_references: [spelling-memory, spelling-memory-reanalysis]
    steps:
      - id: ventral-temporal
        region: destrieux:left:21
        source_name: G_oc-temp_lat-fusifor
        name: { en: Left lateral occipitotemporal gyrus (fusiform gyrus), fr: Gyrus occipitotemporal latéral gauche (gyrus fusiforme) }
        role: { en: Orthographic long-term-memory landmark, fr: Repère de mémoire orthographique à long terme }
        explanation:
          en: Seven of the 17 adults with a long-term orthographic memory deficit had lesions in the left temporal and occipital lobes. The regional cluster was centred in the inferior temporal gyrus and extended into fusiform cortex.
          fr: Sept des 17 adultes présentant un déficit de mémoire orthographique à long terme avaient des lésions dans les lobes temporal et occipital gauches. L’amas régional était centré sur le gyrus temporal inférieur et s’étendait au cortex fusiforme.
        mapping:
          en: The fusiform parcel provides a broad ventral temporal landmark, not a spelling-specific area or the study’s lesion boundaries.
          fr: La parcelle fusiforme fournit un repère temporal ventral large, et non une aire spécifique à l’orthographe ni les limites lésionnelles de l’étude.
        view: inferior
        plane: coronal
      - id: inferior-frontal
        region: destrieux:left:12
        source_name: G_front_inf-Opercular
        name: { en: Left inferior frontal opercular gyrus, fr: Partie operculaire du gyrus frontal inférieur gauche }
        role: { en: Frontal orthographic-memory landmark, fr: Repère frontal de mémoire orthographique }
        explanation:
          en: Ten adults in the long-term orthographic memory group had posterior frontal lesions. One significant cluster included the opercular inferior frontal cortex, and another involved the central operculum.
          fr: Dix adultes du groupe présentant un déficit de mémoire orthographique à long terme avaient des lésions frontales postérieures. Un amas significatif comprenait la partie operculaire du gyrus frontal inférieur, et un autre touchait l’opercule central.
        mapping:
          en: The whole opercular parcel marks part of the posterior frontal result. The cluster also included neighbouring cortex and white matter.
          fr: La parcelle operculaire entière représente une partie du résultat frontal postérieur. L’amas comprenait également du cortex voisin et de la substance blanche.
        view: left
        plane: axial
      - id: intraparietal
        region: destrieux:left:57
        source_name: S_intrapariet_and_P_trans
        name: { en: Left intraparietal and transverse parietal sulci, fr: Sillons intrapariétal et pariétal transverse gauches }
        role: { en: Orthographic working-memory landmark, fr: Repère de mémoire de travail orthographique }
        explanation:
          en: In the same corrected comparison, the working-memory deficit was associated with a left posterior parietal and occipital cluster around the intraparietal sulcus.
          fr: Dans la même comparaison corrigée, le déficit de mémoire de travail était associé à un amas pariétal et occipital postérieur gauche autour du sillon intrapariétal.
        mapping:
          en: This combined sulcal parcel is broader than the implicated tissue and does not measure a person’s letter-sequence memory.
          fr: Cette parcelle sulcale combinée dépasse le tissu impliqué et ne mesure pas la mémoire des séquences de lettres d’une personne.
        view: superior
        plane: axial

  - id: music
    name: { en: Music perception landmarks, fr: Repères de la perception musicale }
    summary:
      en: Explore right temporal, insular and striatal landmarks from acquired-amusia research.
      fr: Explorez les repères temporaux, insulaires et striataux droits issus des recherches sur l’amusie acquise.
    route:
      en: Heschl’s gyrus · superior temporal gyrus · insula · putamen
      fr: Gyrus de Heschl · gyrus temporal supérieur · insula · putamen
    scope:
      en: Four right-sided landmarks illustrate findings from a stroke study in adults. Their display order is for comparison. The study assessed melody perception and implicated additional regions, including the middle temporal gyrus and other striatal structures.
      fr: Quatre repères droits illustrent les résultats d’une étude menée chez des adultes après un AVC. L’ordre d’affichage sert à les comparer. L’étude évaluait la perception des mélodies et impliquait aussi d’autres régions, dont le gyrus temporal moyen et d’autres structures striatales.
    clinical:
      en: The clinical link is partial and applies to individual landmarks. In 77 adults tested within three weeks of stroke, the lesion maps for poorer pitch and rhythm perception overlapped in right temporal, insular and striatal regions. The groups differed in lesion volume, education and visual neglect. A later analysis of overlapping stroke cohorts estimated functional connectivity to the right superior and middle temporal gyri from resting-state data in healthy adults.
      fr: Le lien clinique est partiel et concerne les repères pris individuellement. Chez 77 adultes évalués dans les trois semaines suivant un AVC, les cartes lésionnelles associées à une moins bonne perception de la hauteur et du rythme se chevauchaient dans des régions temporales, insulaires et striatales droites. Les groupes différaient par le volume lésionnel, le niveau de scolarité et la négligence visuelle. Une analyse ultérieure de cohortes d’AVC en partie communes a estimé la connectivité fonctionnelle avec les gyri temporaux supérieur et moyen droits à partir de données recueillies au repos chez des adultes sains.
    deficit: amusia
    references: [music-lesions, music-lesion-network]
    clinical_references: [music-lesions, music-lesion-network]
    steps:
      - id: heschl
        region: destrieux:right:33
        source_name: G_temp_sup-G_T_transv
        name: { en: Right transverse temporal gyrus, fr: Gyrus temporal transverse droit }
        role: { en: Auditory cortical landmark, fr: Repère cortical auditif }
        explanation:
          en: Heschl’s gyrus was part of the right-sided lesion territory associated with poorer perception of pitch and rhythm in melodies.
          fr: Le gyrus de Heschl faisait partie du territoire lésionnel droit associé à une moins bonne perception de la hauteur et du rythme dans les mélodies.
        mapping:
          en: The gyral parcel does not isolate primary auditory cortex or reproduce the study’s lesion boundaries.
          fr: La parcelle gyrale n’isole pas le cortex auditif primaire et ne reproduit pas les limites lésionnelles de l’étude.
        view: superior
        plane: coronal
      - id: superior-temporal
        region: destrieux:right:34
        source_name: G_temp_sup-Lateral
        name: { en: Right lateral superior temporal gyrus, fr: Partie latérale du gyrus temporal supérieur droit }
        role: { en: Temporal lesion-study landmark, fr: Repère temporal de l’étude lésionnelle }
        explanation:
          en: Right superior temporal damage was also associated with impaired music perception in the stroke cohort.
          fr: L’atteinte temporale supérieure droite était aussi associée à une perception musicale altérée dans la cohorte d’AVC.
        mapping:
          en: This broad lateral parcel does not reproduce the lesion map or isolate a music-specific functional field.
          fr: Cette parcelle latérale large ne reproduit pas la carte lésionnelle et n’isole pas un champ fonctionnel propre à la musique.
        view: right
        plane: coronal
      - id: insula
        region: destrieux:right:18
        source_name: G_insular_short
        name: { en: Right short insular gyri, fr: Gyri courts de l’insula droite }
        role: { en: Insular lesion-study landmark, fr: Repère insulaire de l’étude lésionnelle }
        explanation:
          en: Right insular damage also belonged to the amusia-associated lesion pattern.
          fr: L’atteinte insulaire droite appartenait aussi au profil lésionnel associé à l’amusie.
        mapping:
          en: The short gyri mark part of the insula. They neither cover the full reported lesion territory nor identify a music-specific insular centre.
          fr: Les gyri courts représentent une partie de l’insula. Ils ne couvrent pas tout le territoire lésionnel rapporté et n’identifient pas un centre insulaire propre à la musique.
        view: right
        plane: coronal
      - id: putamen
        region: learning:right:putamen
        source_name: Putamen
        name: { en: Right putamen, fr: Putamen droit }
        role: { en: Striatal lesion-study landmark, fr: Repère striatal de l’étude lésionnelle }
        explanation:
          en: The right putamen figured in the overlapping lesion maps for lower pitch and rhythm scores.
          fr: Le putamen droit figurait dans le chevauchement des cartes lésionnelles associées à des scores plus faibles aux épreuves de hauteur et de rythme.
        mapping:
          en: The display combines the putamen with its separately labelled posteroventral portion. The study identified putaminal involvement within a broader striatal lesion pattern.
          fr: Le repère regroupe le putamen et sa partie postéroventrale étiquetée séparément. L’étude a relevé une atteinte putaminale au sein d’un ensemble lésionnel striatal plus étendu.
        view: anterior
        plane: coronal

  - id: taste
    name: { en: Insular taste deficits, fr: Déficits gustatifs insulaires }
    summary:
      en: Compare bilateral insular landmarks for published taste-intensity and recognition deficits.
      fr: Comparez les repères insulaires bilatéraux des déficits publiés d’intensité et de reconnaissance gustatives.
    route:
      en: Left short insular gyri · right short insular gyri
      fr: Gyri insulaires courts gauches · gyri insulaires courts droits
    scope:
      en: Two broad insular landmarks, not a serial taste pathway or a precise localization within the insula. The study involved unilateral lesions; displaying both sides does not imply that bilateral injury is required.
      fr: Deux repères insulaires larges, et non une voie gustative sérielle ni une localisation précise dans l’insula. L’étude concernait des lésions unilatérales ; afficher les deux côtés n’implique pas qu’une atteinte bilatérale soit nécessaire.
    clinical:
      en: Pritchard’s six insular cases support an association with altered taste intensity and recognition. The sample is too small to establish universal lateralization; these impairments do not necessarily mean complete taste loss. The clinical link is partial at the insular landmarks.
      fr: Les six cas insulaires de Pritchard étayent une association avec une intensité et une reconnaissance gustatives altérées. L’échantillon est trop petit pour établir une latéralisation universelle ; ces troubles ne signifient pas nécessairement une perte complète du goût. Le lien clinique est partiel au niveau des repères insulaires.
    deficit: taste-impairment
    references: [taste-lesions]
    clinical_references: [taste-lesions]
    steps:
      - id: left-insula
        region: destrieux:left:18
        source_name: G_insular_short
        name: { en: Left short insular gyri, fr: Gyri courts de l’insula gauche }
        role: { en: Left insular lesion comparison, fr: Comparaison lésionnelle insulaire gauche }
        explanation:
          en: Left insular injury was associated with reduced ipsilateral taste intensity and impaired bilateral taste recognition in this small series.
          fr: L’atteinte insulaire gauche était associée à une intensité gustative ipsilatérale réduite et à une reconnaissance bilatérale altérée dans cette petite série.
        mapping:
          en: The short gyri provide a broad insular landmark. They do not reproduce lesion boundaries or establish a causal role for each gyrus separately.
          fr: Les gyri courts fournissent un repère insulaire large. Ils ne reproduisent pas les limites lésionnelles et n’établissent pas un rôle causal pour chaque gyrus séparément.
        view: left
        plane: coronal
      - id: right-insula
        region: destrieux:right:18
        source_name: G_insular_short
        name: { en: Right short insular gyri, fr: Gyri courts de l’insula droite }
        role: { en: Right insular lesion comparison, fr: Comparaison lésionnelle insulaire droite }
        explanation:
          en: Right insular injury was associated with ipsilateral taste-intensity and recognition deficits in the same series.
          fr: L’atteinte insulaire droite était associée à des déficits ipsilatéraux d’intensité et de reconnaissance gustatives dans la même série.
        mapping:
          en: This is the opposite insular landmark, not a second stage of taste processing. The small series does not prove that taste recognition is exclusively left-sided.
          fr: Il s’agit du repère insulaire opposé, et non d’une seconde étape du traitement gustatif. Cette petite série ne prouve pas que la reconnaissance gustative soit exclusivement gauche.
        view: right
        plane: coronal

  - id: olfaction
    name: { en: Olfactory recognition deficits, fr: Déficits de reconnaissance olfactive }
    summary:
      en: Compare orbital landmarks associated with odour-identification and recognition-memory impairments after surgery.
      fr: Comparez les repères orbitaux associés aux troubles d’identification et de mémoire de reconnaissance olfactives après chirurgie.
    route:
      en: Left orbital gyri · right orbital gyri
      fr: Gyri orbitaux gauches · gyri orbitaux droits
    scope:
      en: Two frontal landmarks from unilateral surgical-lesion studies, not an olfactory pathway. Temporal excisions also produced deficits; their extent is not reconstructed here. Detection, identification and recognition memory are distinct tasks.
      fr: Deux repères frontaux issus d’études de lésions chirurgicales unilatérales, et non une voie olfactive. Les exérèses temporales entraînaient aussi des déficits ; leur étendue n’est pas reconstruite ici. La détection, l’identification et la mémoire de reconnaissance sont des tâches distinctes.
    clinical:
      en: The clinical link is partial at the orbital landmarks. A surgical series found impaired odour identification after temporal or orbitofrontal excision despite normal group detection thresholds for n-butanol. For historical context, a later report found impaired recognition of previously presented odours after right temporal or right orbitofrontal excision. Participant overlap and ages within the later report’s surgical subgroups remain unresolved.
      fr: Le lien clinique est partiel au niveau des repères orbitaires. Une série chirurgicale a relevé une altération de l’identification des odeurs après exérèse temporale ou orbitofrontale, malgré des seuils de détection du n-butanol normaux dans les groupes. À titre de contexte historique, une publication ultérieure a fait état d’une altération de la reconnaissance d’odeurs déjà présentées après exérèse temporale droite ou orbitofrontale droite. Le recoupement des cohortes et l’âge des patients dans les sous-groupes chirurgicaux de cette dernière étude restent indéterminés.
    deficit: olfactory-recognition
    references: [olfactory-identification, olfactory-memory]
    clinical_references: [olfactory-identification]
    steps:
      - id: left-orbitofrontal
        region: destrieux:left:24
        source_name: G_orbital
        name: { en: Left orbital gyri, fr: Gyri orbitaux gauches }
        role: { en: Odour-identification lesion landmark, fr: Repère lésionnel d’identification olfactive }
        explanation:
          en: The identification study found impairment after frontal excisions involving orbital cortex on either side.
          fr: L’étude d’identification trouvait un déficit après des exérèses frontales impliquant le cortex orbital de l’un ou l’autre côté.
        mapping:
          en: The orbital parcel is a broad surgical-site landmark. It does not reproduce the excision or imply that each part of orbital cortex is necessary for identification.
          fr: La parcelle orbitale est un repère chirurgical large. Elle ne reproduit pas l’exérèse et n’implique pas que chaque partie du cortex orbital soit nécessaire à l’identification.
        view: inferior
        plane: axial
      - id: right-orbitofrontal
        region: destrieux:right:24
        source_name: G_orbital
        name: { en: Right orbital gyri, fr: Gyri orbitaux droits }
        role: { en: Identification and recognition-memory comparison, fr: Comparaison d’identification et de mémoire de reconnaissance }
        explanation:
          en: The identification study found impairment after right frontal excision involving orbital cortex. A later report linked impaired recognition of previously presented odours to right temporal or right orbitofrontal excision. Participant overlap remains unresolved.
          fr: L’étude d’identification a relevé un déficit après exérèse frontale droite touchant le cortex orbital. Une publication ultérieure a associé une altération de la reconnaissance d’odeurs déjà présentées à une exérèse temporale droite ou orbitofrontale droite. Le recoupement des cohortes reste indéterminé.
        mapping:
          en: This parcel does not isolate an odour-memory region. The right-sided memory result does not establish right dominance for every olfactory function or a left-to-right processing chain.
          fr: Cette parcelle n’isole pas une région de mémoire olfactive. Le résultat mnésique droit n’établit pas une dominance droite pour toute fonction olfactive ni une chaîne de traitement de gauche à droite.
        view: inferior
        plane: axial

  - id: mentalizing
    name: { en: Affective theory-of-mind deficits, fr: Déficits de théorie de l’esprit affective }
    summary:
      en: Locate broad ventromedial frontal landmarks for a published affective theory-of-mind lesion association.
      fr: Repérez les territoires frontaux ventromédiaux larges d’une association lésionnelle publiée de théorie de l’esprit affective.
    route:
      en: Left gyrus rectus · right gyrus rectus
      fr: Gyrus rectus gauche · gyrus rectus droit
    scope:
      en: Two anatomical landmarks for regional ventromedial lesion comparisons. Both studies grouped lesions at a broader scale. Neither resolves a connection between the landmarks, precise hemispheric dominance or a specific causal role for the gyrus rectus on each side.
      fr: Deux repères anatomiques pour comparer les lésions ventromédianes à l’échelle régionale. Les deux études regroupaient des lésions plus étendues. Elles laissent indéterminés le lien entre les repères, la dominance hémisphérique précise et le rôle causal propre du gyrus rectus de chaque hémisphère.
    clinical:
      en: Veterans with ventromedial prefrontal injury scored lower on social faux pas stories than other veterans. The left and bilateral subgroups scored lower than the right subgroup. An earlier mixed-injury study found more errors on affective irony and false-belief stories after ventromedial injury than after posterior injury, with small groups and healthy-control ceiling effects. The clinical link is tenuous at the gyrus rectus on each side because both studies grouped patients by larger lesion territories.
      fr: Les anciens combattants présentant une lésion préfrontale ventromédiane obtenaient des scores plus faibles aux récits de faux pas sociaux que les autres anciens combattants. Les sous-groupes avec lésion gauche ou bilatérale obtenaient des scores inférieurs au sous-groupe avec lésion droite. Une étude antérieure de lésions d’étiologies diverses a trouvé davantage d’erreurs dans les récits affectifs d’ironie et de fausse croyance après atteinte ventromédiane qu’après atteinte postérieure, avec de petits groupes et un effet plafond chez les témoins sains. Le lien clinique avec le gyrus rectus de chaque hémisphère est ténu car les deux études regroupaient les patients selon des territoires lésionnels plus étendus.
    deficit: theory-of-mind
    references: [mentalizing-lesions, mentalizing-veterans]
    clinical_references: [mentalizing-lesions, mentalizing-veterans]
    steps:
      - id: left-ventromedial
        region: destrieux:left:31
        source_name: G_rectus
        name: { en: Left gyrus rectus, fr: Gyrus rectus gauche }
        role: { en: Ventromedial lesion-study reference, fr: Référence ventromédiale de l’étude lésionnelle }
        explanation:
          en: Ventromedial prefrontal damage was particularly associated with difficulty inferring emotional mental states.
          fr: Les lésions préfrontales ventromédianes étaient surtout associées à une difficulté à inférer les états mentaux émotionnels.
        mapping:
          en: Gyrus rectus provides a coarse ventromedial reference, not the full lesion territory. Displaying this parcel does not establish left-only causation.
          fr: Le gyrus rectus fournit une référence ventromédiane approximative, et non tout le territoire lésionnel. Afficher cette parcelle n’établit pas une causalité exclusivement gauche.
        view: inferior
        plane: coronal
      - id: right-ventromedial
        region: destrieux:right:31
        source_name: G_rectus
        name: { en: Right gyrus rectus, fr: Gyrus rectus droit }
        role: { en: Contralateral anatomical comparison, fr: Comparaison anatomique controlatérale }
        explanation:
          en: Compare the opposite ventromedial landmark while considering the same lesion study. This is not independent evidence for a separate right-sided mechanism.
          fr: Comparez le repère ventromédial opposé en considérant la même étude lésionnelle. Ce n’est pas une preuve indépendante d’un mécanisme droit distinct.
        mapping:
          en: The paired landmarks do not reproduce patients’ lesions, require bilateral injury or establish a left-to-right pathway. The lesion study does not isolate the atlas parcel boundaries.
          fr: Les repères appariés ne reproduisent pas les lésions des patients, n’exigent pas une atteinte bilatérale et n’établissent pas une voie de gauche à droite. L’étude lésionnelle n’isole pas les limites des parcelles de l’atlas.
        view: inferior
        plane: coronal

  - id: extinction
    deficit: visual-extinction
    name:
      en: Visual extinction after right stroke
      fr: Extinction visuelle après AVC droit
    summary:
      en: Compare right temporoparietal lesion landmarks with an additional Bayesian intraparietal finding.
      fr: Comparez des repères lésionnels temporopariétaux droits au résultat intrapariétal bayésien supplémentaire.
    route:
      en: Angular · supramarginal · superior temporal · intraparietal
      fr: Angulaire · supramarginal · temporal supérieur · intrapariétal
    scope:
      en: The four right-sided parcels illustrate portions of the lesion findings. Their display order is for comparison. Human fibre dissection distinguishes short bundles across the intraparietal sulcus from separate fibres linking inferior parietal and posterior temporal cortex. The comparison omits the middle occipital gyrus, the posterior middle temporal gyrus and white matter involvement.
      fr: Les quatre parcelles droites illustrent des portions des résultats lésionnels. Leur ordre d’affichage sert à les comparer. La dissection des fibres chez l’humain distingue des faisceaux courts qui traversent le sillon intrapariétal et des fibres distinctes reliant le cortex pariétal inférieur au cortex temporal postérieur. La comparaison laisse de côté le gyrus occipital moyen, la partie postérieure du gyrus temporal moyen et l’atteinte de la substance blanche.
    clinical:
      en: The clinical link is partial at the right temporoparietal landmarks. In 108 adults assessed within seven days of a first right-hemisphere stroke, left omissions during visual competition were associated with lesions around the temporoparietal junction after accounting for spatial neglect and lesion volume. A separate Bayesian analysis of the same cohort found variable evidence within the intraparietal sulcus. In a CT study of 454 adults after subacute stroke, left visual extinction was associated with right inferior parietal, posterior temporo-occipital and middle frontal damage.
      fr: Le lien clinique est partiel au niveau des repères temporopariétaux droits. Chez 108 adultes évalués dans les sept jours suivant un premier AVC de l’hémisphère droit, les omissions à gauche lors de stimulations visuelles concurrentes étaient associées à des lésions autour de la jonction temporopariétale, après prise en compte de la négligence spatiale et du volume lésionnel. Une analyse bayésienne distincte de la même cohorte a fourni des résultats variables selon les parties du sillon intrapariétal. Dans une étude tomodensitométrique de 454 adultes en phase subaiguë après un AVC, l’extinction visuelle gauche était associée à des lésions pariétales inférieures, temporo-occipitales postérieures et frontales moyennes droites.
    references:
      - clinical-sperber-2024
      - clinical-chechlacz-2013-extinction
      - temporoparietal-short-fibres
    clinical_references:
      - clinical-sperber-2024
      - clinical-chechlacz-2013-extinction
    steps:
      - id: angular
        region: destrieux:right:25
        source_name: G_pariet_inf-Angular
        name:
          en: Right angular gyrus
          fr: Gyrus angulaire droit
        role:
          en: TPJ-adjacent lesion landmark
          fr: Repère lésionnel voisin de la JTP
        explanation:
          en: The largest multivariate cluster included angular tissue and adjacent occipital/temporal cortex.
          fr: Le plus grand foyer multivarié comprenait du tissu angulaire et occipitotemporal adjacent.
        mapping:
          en: Whole gyrus; partial cluster landmark.
          fr: Gyrus entier; repère partiel du foyer.
        view: right
        plane: axial
      - id: supramarginal
        region: destrieux:right:26
        source_name: G_pariet_inf-Supramar
        name:
          en: Right supramarginal gyrus
          fr: Gyrus supramarginal droit
        role:
          en: Inferior TPJ lesion landmark
          fr: Repère lésionnel inférieur de la JTP
        explanation:
          en: Inferior supramarginal tissue lay in another multivariate temporoparietal cluster.
          fr: Du tissu supramarginal inférieur appartenait à un autre foyer temporopariétal multivarié.
        mapping:
          en: Whole gyrus exceeds the inferior focus.
          fr: Le gyrus entier dépasse le foyer inférieur.
        view: right
        plane: axial
      - id: superior-temporal
        region: destrieux:right:34
        source_name: G_temp_sup-Lateral
        name:
          en: Right lateral superior temporal gyrus
          fr: Partie latérale du gyrus temporal supérieur droit
        role:
          en: Posterior TPJ lesion landmark
          fr: Repère lésionnel postérieur de la JTP
        explanation:
          en: Posterior superior temporal tissue appeared in multivariate clusters.
          fr: Du tissu temporal supérieur postérieur figurait dans les foyers multivariés.
        mapping:
          en: The lateral parcel does not isolate posterior tissue.
          fr: La parcelle latérale n’isole pas le tissu postérieur.
        view: right
        plane: coronal
      - id: intraparietal
        region: destrieux:right:57
        source_name: S_intrapariet_and_P_trans
        name:
          en: Right intraparietal and transverse parietal sulci
          fr: Sillons intrapariétal et pariétal transverse droits
        role:
          en: Additional Bayesian finding
          fr: Résultat bayésien supplémentaire
        explanation:
          en: The separate voxelwise Bayesian analysis found evidence for an association in parts of the intraparietal sulcus. In other parts, the evidence was inconclusive or favoured no association.
          fr: L’analyse bayésienne distincte, réalisée par voxel, a relevé des indices d’une association dans certaines parties du sillon intrapariétal. Dans d’autres parties, les résultats n’étaient pas concluants ou favorisaient l’absence d’association.
        mapping:
          en: The combined parcel includes the transverse parietal sulcus and extends beyond the probabilistic intraparietal territory examined in the study.
          fr: La parcelle combinée comprend le sillon pariétal transverse et dépasse le territoire intrapariétal probabiliste étudié.
        view: superior
        plane: axial
  - id: copying
    name:
      en: Figure-copying lesion findings
      fr: Constats lésionnels de copie de figures
    summary:
      en: Compare two cortical landmarks associated with complex figure-copying performance after stroke.
      fr: Comparez deux repères corticaux associés à la copie de figures complexes après AVC.
    route:
      en: Right fusiform · left lingual
      fr: Fusiforme droit · lingual gauche
    scope:
      en: Two cortical associations survived cluster correction in all five models of this study. Thalamic findings varied by model; the remaining lesions, task components and connections are outside this tour.
      fr: Deux associations corticales résistaient à la correction par amas dans les cinq modèles de cette étude. Les résultats thalamiques variaient selon le modèle; les autres lésions, composantes de tâche et connexions sont hors de ce parcours.
    clinical:
      en: The clinical link is partial at the right fusiform and left lingual landmarks. In Chen’s cohort of 239 patients who had been right-handed before stroke and were tested within one month of ischaemic stroke, injury in these regions was associated with lower complex figure-copy scores in all five models. The models successively adjusted for praxis, egocentric neglect, auditory attention and picture naming. In a separate stroke cohort, Biesbroek found a right fusiform association on voxelwise analysis, with an inconclusive association when testing the volume of injury in the whole region. A low copying score alone does not establish a selective constructional disorder.
      fr: Le lien clinique est partiel au niveau des repères fusiforme droit et lingual gauche. Dans la cohorte de Chen, 239 patients droitiers avant l’AVC ont été évalués dans le mois suivant un AVC ischémique. Les lésions de ces régions étaient associées à de moins bonnes performances en copie de figure complexe dans les cinq modèles. Les modèles tenaient compte successivement des praxies, de la négligence égocentrée, de l’attention auditive et de la dénomination d’images. Dans une cohorte d’AVC distincte, Biesbroek a observé une association fusiforme droite dans l’analyse par voxel. L’analyse du volume lésionnel dans la région entière est restée peu concluante. Un faible score de copie seul ne suffit pas à établir un trouble visuoconstructif sélectif.
    deficit: constructional-apraxia
    references:
      - clinical-chen-2016
      - clinical-biesbroek-2014-copying
    clinical_references:
      - clinical-chen-2016
      - clinical-biesbroek-2014-copying
    steps:
      - id: right-fusiform
        region: destrieux:right:21
        source_name: G_oc-temp_lat-fusifor
        name:
          en: Right fusiform gyrus
          fr: Gyrus fusiforme droit
        role:
          en: Right ventral visual lesion landmark
          fr: Repère lésionnel visuel ventral droit
        explanation:
          en: The right fusiform association persisted through successive adjustments for praxis, neglect, attention and naming.
          fr: L’association fusiforme droite persistait après les ajustements successifs pour les praxies, la négligence, l’attention et la dénomination.
        mapping:
          en: The whole gyrus exceeds the lesion cluster and does not isolate a copying-specific module.
          fr: Le gyrus entier dépasse l’amas lésionnel et n’isole pas un module propre à la copie.
        view: inferior
        plane: coronal
      - id: left-lingual
        region: destrieux:left:22
        source_name: G_oc-temp_med-Lingual
        name:
          en: Left lingual gyrus
          fr: Gyrus lingual gauche
        role:
          en: Left ventral visual lesion landmark
          fr: Repère lésionnel visuel ventral gauche
        explanation:
          en: The left lingual association also survived cluster correction across the five models.
          fr: L’association linguale gauche résistait aussi à la correction par amas dans les cinq modèles.
        mapping:
          en: This is a group association across patients. Paired landmarks do not require bilateral injury or establish a right-to-left pathway.
          fr: Il s’agit d’une association de groupe entre patients. Ces repères appariés n’exigent pas une atteinte bilatérale et n’établissent pas de voie de droite à gauche.
        view: inferior
        plane: coronal
  - id: cortical-hearing
    name:
      en: Cortical deafness after temporal strokes
      fr: Surdité corticale après AVC temporaux
    summary:
      en: Compare bilateral Heschl-gyrus landmarks in two reports of profound central hearing loss after stroke.
      fr: Comparez les repères bilatéraux des gyri de Heschl dans deux observations de surdité centrale profonde après AVC.
    route:
      en: Left Heschl gyrus · right Heschl gyrus
      fr: Gyrus de Heschl gauche · gyrus de Heschl droit
    scope:
      en: The stops mark parts of larger temporal lesions. Adjacent temporal and parietal injuries, auditory radiations and the ascending and callosal pathways are outside this comparison.
      fr: Les repères situent des portions de lésions temporales plus étendues. Les atteintes temporales et pariétales adjacentes, les radiations auditives et les voies ascendantes et calleuses sont hors de cette comparaison.
    clinical:
      en: The clinical link is partial at the bilateral Heschl landmarks. Two adults with strokes involving both transverse temporal gyri had profound hearing loss and normal otoacoustic emissions and brainstem auditory responses on testing. In Lachowska’s case, some sound detection returned after an acute left infarct and an older right infarct. The patient repeated none of the presented monosyllabic words at three or ten months. A separate adult developed severe bilateral hearing loss after sequential right putaminal and left thalamic haemorrhages.
      fr: Le lien clinique est partiel au niveau des repères bilatéraux des gyri de Heschl. Deux adultes ayant subi des AVC touchant les deux gyri temporaux transverses présentaient une surdité profonde, avec des otoémissions acoustiques et des réponses auditives du tronc cérébral normales aux épreuves. Dans le cas de Lachowska, la détection de certains sons est revenue après un infarctus gauche aigu et un infarctus droit ancien. Le patient n’a répété aucun des mots monosyllabiques présentés à trois ou dix mois. Un autre adulte a présenté une surdité bilatérale sévère après des hémorragies successives du putamen droit et du thalamus gauche.
    deficit: cortical-deafness
    references:
      - clinical-lachowska-2021
      - clinical-narayanan-2017-cortical-deafness
      - clinical-sasaki-2025-central-deafness
    clinical_references:
      - clinical-lachowska-2021
      - clinical-narayanan-2017-cortical-deafness
      - clinical-sasaki-2025-central-deafness
    steps:
      - id: left-heschl
        region: destrieux:left:33
        source_name: G_temp_sup-G_T_transv
        name:
          en: Left Heschl gyrus
          fr: Gyrus de Heschl gauche
        role:
          en: Acute infarct in the reported case
          fr: Infarctus aigu dans le cas rapporté
        explanation:
          en: The acute left temporal infarct involved Heschl’s gyrus after the prior right-sided injury.
          fr: L’infarctus temporal gauche aigu impliquait le gyrus de Heschl après l’atteinte droite antérieure.
        mapping:
          en: The transverse temporal parcel approximates the gyrus named on CT. The precise boundaries of the primary auditory fields and the infarct remain unresolved.
          fr: La parcelle temporale transverse représente approximativement le gyrus nommé au scanner. Les limites précises des champs auditifs primaires et de l’infarctus restent indéterminées.
        view: superior
        plane: axial
      - id: right-heschl
        region: destrieux:right:33
        source_name: G_temp_sup-G_T_transv
        name:
          en: Right Heschl gyrus
          fr: Gyrus de Heschl droit
        role:
          en: Older infarct in the reported case
          fr: Infarctus ancien dans le cas rapporté
        explanation:
          en: The older right temporal injury also extended into auditory radiations and wider temporoparietal cortex.
          fr: L’atteinte temporale droite ancienne s’étendait aussi aux radiations auditives et à un cortex temporopariétal plus large.
        mapping:
          en: The transverse temporal parcel marks the Heschl component of the older infarct. The white-matter and parietal injury extend beyond it.
          fr: La parcelle temporale transverse repère la partie de l’infarctus ancien touchant le gyrus de Heschl. Les lésions pariétales et de la substance blanche s’étendent au-delà de cette parcelle.
        view: superior
        plane: axial
  - id: oral-praxis
    name:
      en: Speech and oral apraxia findings
      fr: Apraxies de la parole et buccofaciale
    summary:
      en: Compare two broad left insular references for co-occurring speech and nonspeech oral apraxia.
      fr: Comparez deux repères insulaires gauches larges pour les apraxies associées de la parole et buccofaciale.
    route:
      en: Left short insular gyri · left long insular gyri and central insular sulcus
      fr: Gyri insulaires courts gauches · gyri longs et sillon central de l’insula gauche
    scope:
      en: Two landmarks for one overlapping insular association. They do not establish separate parcel functions, a serial connection or a necessary insular site for isolated oral apraxia.
      fr: Deux repères d’une même association insulaire. Ils n’établissent ni des fonctions parcellaires distinctes, ni une connexion sérielle, ni un site insulaire nécessaire à l’apraxie buccofaciale isolée.
    clinical:
      en: Conterno and colleagues studied 137 adults with acute left-hemisphere ischaemic stroke. Twenty-eight had both apraxia of speech and nonspeech oral apraxia. All 33 with either apraxia also had aphasia. The two apraxias co-occurred chiefly with lesions affecting broad areas of the insula, with additional associations in nearby cortex and white matter. The insula was spared in two patients with apraxia of speech without oral apraxia and three with oral apraxia without apraxia of speech. The clinical link to the two insular landmarks is tenuous.
      fr: Conterno et ses collègues ont étudié 137 adultes ayant subi un AVC ischémique aigu de l’hémisphère gauche. Vingt-huit avaient à la fois une apraxie de la parole et une apraxie buccofaciale. Les 33 patients atteints de l’une ou l’autre avaient aussi une aphasie. La cooccurrence des deux apraxies était surtout associée à des lésions touchant de larges zones de l’insula, ainsi qu’à des atteintes du cortex voisin et de la substance blanche adjacente. L’insula était épargnée chez deux patients avec apraxie de la parole sans apraxie buccofaciale et chez trois avec apraxie buccofaciale sans apraxie de la parole. Le lien clinique avec les deux repères insulaires est ténu.
    deficit: buccofacial-apraxia
    references:
      - clinical-conterno-2022
    clinical_references:
      - clinical-conterno-2022
    steps:
      - id: short-insular
        region: destrieux:left:18
        source_name: G_insular_short
        name:
          en: Left short insular gyri
          fr: Gyri insulaires courts gauches
        role:
          en: Anterior insular reference
          fr: Repère insulaire antérieur
        explanation:
          en: The cohort linked combined speech and oral apraxia to insular damage; this is one anatomical reference for that shared finding.
          fr: La cohorte associait les apraxies de la parole et buccofaciale combinées à l’atteinte insulaire; voici un repère anatomique de ce constat commun.
        mapping:
          en: Whole short gyri exceed the statistical lesion cluster and do not isolate an oral-movement programme.
          fr: Les gyri courts entiers dépassent l’amas lésionnel statistique et n’isolent pas un programme de mouvements oraux.
        view: left
        plane: axial
      - id: long-insular
        region: destrieux:left:17
        source_name: G_Ins_lg_and_S_cent_ins
        name:
          en: Left long gyri and central insular sulcus
          fr: Gyri longs et sillon central de l’insula gauche
        role:
          en: Posterior insular comparison
          fr: Comparaison insulaire postérieure
        explanation:
          en: Compare the posterior insular reference within the same co-occurring syndrome, rather than a separate processing stage.
          fr: Comparez le repère insulaire postérieur au sein du même syndrome associé, sans en faire une étape distincte du traitement.
        mapping:
          en: The parcel groups the long insular gyri and the central insular sulcus. The study did not estimate a separate effect for this parcel.
          fr: La parcelle regroupe les gyri longs de l’insula et son sillon central. L’étude n’a pas estimé d’effet propre à cette parcelle.
        view: left
        plane: axial
  - id: voices
    name:
      en: Voice-identity lesion findings
      fr: Constats lésionnels d’identité vocale
    summary:
      en: Compare a right lateral temporal lesion documented in an adult with a planum temporale landmark from a lesion-mapping study.
      fr: Comparez une lésion temporale latérale droite documentée chez un adulte avec un repère du planum temporale issu d’une étude de cartographie lésionnelle.
    route:
      en: Right lateral superior temporal gyrus · right planum temporale
      fr: Gyrus temporal supérieur latéral droit · planum temporale droit
    scope:
      en: The two landmarks approximate portions of larger lesion territories. Other affected temporal, parietal and deep regions are outside the comparison. The evidence leaves the connection between the landmarks unresolved.
      fr: Les deux repères représentent des portions de territoires lésionnels plus étendus. Les autres régions temporales, pariétales et profondes atteintes sont hors de la comparaison. Les données laissent indéterminée la connexion entre les repères.
    clinical:
      en: The clinical link is partial at the right lateral superior temporal landmark. In Van Lancker’s series, an adult had difficulty distinguishing unfamiliar voices and recognizing familiar voices nine months after an extensive right infarct involving the posterior superior temporal gyrus. Roswandowitz’s pooled study found that lower scores on a composite of newly learned and familiar voice recognition were associated with right planum temporale injury after adjustment for face recognition, hearing and lesion volume. The cluster survived correction within a region of interest. The cohort’s age-at-injury range was uncertain. The association for familiar voices alone was inconclusive after hearing and lesion-volume adjustment.
      fr: Le lien clinique est partiel au niveau du repère temporal supérieur latéral droit. Dans la série de Van Lancker, un adulte distinguait mal les voix inconnues et reconnaissait mal les voix familières neuf mois après un infarctus droit étendu touchant le gyrus temporal supérieur postérieur. Dans l’analyse groupée de Roswandowitz, des scores plus faibles de reconnaissance des voix nouvellement apprises et familières étaient associés à une atteinte du planum temporale droit après ajustement sur la reconnaissance des visages, l’audition et le volume lésionnel. L’amas persistait après correction dans une région d’intérêt. La tranche d’âge des participants lors de la lésion restait incertaine. L’association pour les seules voix familières était incertaine après ajustement sur l’audition et le volume lésionnel.
    deficit: phonagnosia
    references:
      - clinical-roswandowitz-2018
      - clinical-van-lancker-1988-phonagnosia
    clinical_references:
      - clinical-roswandowitz-2018
      - clinical-van-lancker-1988-phonagnosia
    steps:
      - id: lateral-temporal
        region: destrieux:right:34
        source_name: G_temp_sup-Lateral
        name:
          en: Right lateral superior temporal gyrus
          fr: Partie latérale du gyrus temporal supérieur droit
        role:
          en: Posterior temporal lesion reference
          fr: Repère lésionnel temporal postérieur
        explanation:
          en: The adult infarct involved the posterior lateral superior temporal gyrus and extended into other cortical and deep regions. The adjusted combined-score cluster in Roswandowitz’s separate study also extended into mid and posterior superior temporal cortex.
          fr: L’infarctus chez l’adulte touchait la partie latérale du gyrus temporal supérieur postérieur et s’étendait à d’autres régions corticales et profondes. Dans l’étude distincte de Roswandowitz, l’amas associé au score combiné ajusté s’étendait aussi au cortex temporal supérieur moyen et postérieur.
        mapping:
          en: The whole lateral parcel approximates the documented portion of the adult lesion. It also includes cortex outside the lesion.
          fr: La parcelle latérale entière repère approximativement la portion documentée de la lésion chez l’adulte. Elle comprend aussi du cortex hors de la lésion.
        view: right
        plane: coronal
      - id: planum-temporale
        region: destrieux:right:36
        source_name: G_temp_sup-Plan_tempo
        name:
          en: Right planum temporale
          fr: Planum temporale droit
        role:
          en: Landmark from the adjusted pooled analysis
          fr: Repère de l’analyse groupée ajustée
        explanation:
          en: In Roswandowitz’s cohort, the combined-score cluster was centred near the right planum temporale in the model that adjusted for face recognition, hearing and lesion volume.
          fr: Dans la cohorte de Roswandowitz, l’amas associé au score combiné était centré près du planum temporale droit dans le modèle ajusté sur la reconnaissance des visages, l’audition et le volume lésionnel.
        mapping:
          en: The anatomical parcel approximates the centre of the pooled cluster. The study did not report a separate adult-onset analysis of this result.
          fr: La parcelle anatomique repère approximativement le centre de l’amas de l’analyse groupée. L’étude ne rapporte pas d’analyse distincte de ce résultat chez les participants dont la lésion est survenue à l’âge adulte.
        view: superior
        plane: axial

  - id: face-perception
    name: { en: Face perception landmarks, fr: Repères de la perception des visages }
    summary:
      en: Compare occipital face-part processing with fusiform facial-configuration findings.
      fr: Comparez le traitement occipital des traits du visage aux résultats fusiformes sur leur configuration.
    route:
      en: Right inferior occipital · right fusiform
      fr: Occipital inférieur droit · fusiforme droit
    scope:
      en: Two landmarks in a distributed, bilateral face system. Their order does not establish a direct connection or an obligatory serial pathway. Functional face areas occupy only parts of these anatomical parcels; anterior temporal and other face regions are omitted.
      fr: Deux repères d’un système facial distribué et bilatéral. Leur ordre n’établit ni connexion directe ni voie sérielle obligatoire. Les aires faciales fonctionnelles n’occupent que des parties de ces parcelles anatomiques; les régions temporales antérieures et d’autres régions faciales sont omises.
    clinical:
      en: In Barton’s selected series, three patients whose injuries occurred in adulthood had difficulty discriminating the positions of facial features after extensive occipitotemporal injury involving the right fusiform face region. An adult with bilateral anterior temporal injury generally retained this ability. The clinical link is partial at the fusiform landmark. Pitcher’s stimulation experiments in healthy adults describe face-part discrimination.
      fr: Dans la série sélectionnée de Barton, trois patients atteints à l’âge adulte distinguaient mal la position des traits du visage après une lésion occipitotemporale étendue incluant la région fusiforme droite des visages. Cette capacité était généralement préservée chez une adulte présentant des lésions temporales antérieures bilatérales. Le lien clinique est partiel au niveau du repère fusiforme. Les expériences de stimulation de Pitcher chez des adultes sains décrivent la discrimination des traits du visage.
    deficit: agnosia
    references: [face-system, face-parts-stimulation, clinical-barton-2002]
    clinical_references: [clinical-barton-2002]
    steps:
      - id: occipital
        region: destrieux:right:2
        source_name: G_and_S_occipital_inf
        name: { en: Right inferior occipital gyrus and sulcus, fr: Gyrus et sillon occipitaux inférieurs droits }
        role: { en: Face-part processing reference, fr: Repère du traitement des traits faciaux }
        explanation:
          en: Pitcher’s right occipital face-area stimulation disrupted face-part discrimination, with no corresponding impairment for feature spacing or matched house stimuli.
          fr: La stimulation de l’aire occipitale faciale droite par Pitcher perturbait la discrimination des traits faciaux, sans déficit correspondant pour leur espacement ni pour des stimuli de maisons appariés.
        mapping:
          en: Combined inferior occipital gyrus/sulcus, not an individually localized OFA. The stimulation result does not establish a lesion causing prosopagnosia throughout this parcel.
          fr: Gyrus et sillon occipitaux inférieurs combinés, pas une aire occipitale faciale localisée individuellement. Le résultat de stimulation n’établit pas une lésion causant la prosopagnosie dans toute la parcelle.
        view: inferior
        plane: axial
      - id: fusiform
        region: destrieux:right:21
        source_name: G_oc-temp_lat-fusifor
        name: { en: Right fusiform gyrus, fr: Gyrus fusiforme droit }
        role: { en: Facial-configuration lesion landmark, fr: Repère lésionnel de la configuration faciale }
        explanation:
          en: Right fusiform involvement in Barton’s series was associated with difficulty distinguishing changes in the positions of facial features.
          fr: L’atteinte fusiforme droite dans la série de Barton était associée à une difficulté à distinguer les changements de position des traits du visage.
        mapping:
          en: Whole fusiform parcel, exceeding the functionally defined face area. It neither reproduces the patients’ lesions nor isolates all identity-recognition mechanisms.
          fr: Parcelle fusiforme entière, dépassant l’aire faciale définie fonctionnellement. Elle ne reproduit pas les lésions des patients et n’isole pas tous les mécanismes de reconnaissance de l’identité.
        view: inferior
        plane: coronal

  - id: swallowing
    name: { en: Cortical swallowing landmarks, fr: Repères corticaux de la déglutition }
    summary:
      en: Compare insular and frontal opercular landmarks on both sides with post-stroke aspiration-risk findings.
      fr: Comparez les repères insulaires et operculaires frontaux bilatéraux aux résultats sur le risque d’aspiration après AVC.
    route:
      en: Left insula · left frontal operculum · right insula · right frontal operculum
      fr: Insula gauche · opercule frontal gauche · insula droite · opercule frontal droit
    scope:
      en: Selected cortical components of a wider swallowing system, not a serial route. Internal capsular, sensorimotor, cerebellar and brainstem components are omitted. The paired landmarks do not imply equal hemispheric effects or bilateral injury in every patient.
      fr: Composantes corticales sélectionnées d’un système de déglutition plus large, pas une voie sérielle. Les composantes capsulaires, sensorimotrices, cérébelleuses et du tronc sont omises. Les repères appariés n’impliquent ni effets hémisphériques égaux ni lésion bilatérale chez chaque patient.
    clinical:
      en: In Galovic’s cohort of 94 adults after a first supratentorial ischaemic stroke, insular and internal capsular lesions were associated with acute aspiration risk on a bedside assessment. Combined insular and frontal opercular injury was associated with risk lasting at least seven days. Lesion side distributions were similar across groups. In a separate videofluoroscopy study, Wilmskoetter and colleagues associated injury in the right anterior and posterior insula with impaired laryngeal vestibule closure. Abnormal median penetration–aspiration scores were associated with other right-hemisphere sites. The clinical link is partial at the regional insular and frontal opercular landmarks.
      fr: Dans la cohorte de Galovic, 94 adultes avaient subi un premier AVC ischémique supratentoriel. Les lésions insulaires et capsulaires internes étaient associées à un risque aigu d’aspiration évalué au lit du patient. L’atteinte conjointe de l’insula et de l’opercule frontal était associée à un risque persistant au moins sept jours. La répartition des lésions selon le côté était similaire entre les groupes. Dans une étude vidéofluoroscopique distincte, Wilmskoetter et ses collègues ont associé les lésions de l’insula antérieure et postérieure droites à un défaut de fermeture du vestibule laryngé. Un score médian de pénétration–aspiration anormal était associé à d’autres sites de l’hémisphère droit. Le lien clinique est partiel au niveau des repères régionaux insulaires et operculaires frontaux.
    deficit: dysphagia
    references: [swallowing-activation, clinical-galovic-2013, clinical-wilmskoetter-2019-swallow]
    clinical_references: [clinical-galovic-2013, clinical-wilmskoetter-2019-swallow]
    steps:
      - id: left-insula
        region: destrieux:left:18
        source_name: G_insular_short
        name: { en: Left short insular gyri, fr: Gyri insulaires courts gauches }
        role: { en: Insular lesion reference, fr: Repère lésionnel insulaire }
        explanation:
          en: Galovic’s study associated insular injury with acute aspiration risk after stroke, without establishing a universal left-sided site.
          fr: L’étude de Galovic associait l’atteinte insulaire au risque aigu d’aspiration après AVC, sans établir de site gauche universel.
        mapping:
          en: Short gyri approximate only part of the insula; the study did not isolate this parcel as necessary or sufficient.
          fr: Les gyri courts ne représentent qu’une partie de l’insula; l’étude n’isolait pas cette parcelle comme nécessaire ou suffisante.
        view: left
        plane: coronal
      - id: left-operculum
        region: destrieux:left:12
        source_name: G_front_inf-Opercular
        name: { en: Left inferior frontal operculum, fr: Opercule frontal inférieur gauche }
        role: { en: Combined-injury reference, fr: Repère d’atteinte combinée }
        explanation:
          en: The recovery finding concerned combined frontal opercular and insular injury, not an independent effect of this landmark alone.
          fr: Le résultat sur la récupération concernait l’atteinte combinée de l’opercule frontal et de l’insula, pas un effet indépendant de ce seul repère.
        mapping:
          en: Anatomical opercular parcel; not the full swallowing representation or an individual lesion boundary.
          fr: Parcelle operculaire anatomique; ni représentation complète de la déglutition ni limite lésionnelle individuelle.
        view: left
        plane: coronal
      - id: right-insula
        region: destrieux:right:18
        source_name: G_insular_short
        name: { en: Right short insular gyri, fr: Gyri insulaires courts droits }
        role: { en: Opposite insular reference, fr: Repère insulaire opposé }
        explanation:
          en: Hamdy’s group PET analysis found right anterior insular recruitment during swallowing in eight healthy men; activation alone does not establish lesion necessity.
          fr: L’analyse TEP de groupe de Hamdy trouvait un recrutement insulaire antérieur droit pendant la déglutition chez huit hommes sains; l’activation seule n’établit pas une nécessité lésionnelle.
        mapping:
          en: The whole short gyri provide a regional landmark for the anterior insular PET result. Galovic’s analysis compared lesion sides between groups.
          fr: Les gyri courts entiers servent de repère régional pour la réponse insulaire antérieure observée en TEP. Galovic a comparé le côté des lésions entre les groupes.
        view: right
        plane: coronal
      - id: right-operculum
        region: destrieux:right:12
        source_name: G_front_inf-Opercular
        name: { en: Right inferior frontal operculum, fr: Opercule frontal inférieur droit }
        role: { en: Opposite combined-injury reference, fr: Repère opposé d’atteinte combinée }
        explanation:
          en: Compare the opposite frontal operculum when considering the combined insular/opercular finding; it does not establish a right-only recovery mechanism.
          fr: Comparez l’opercule frontal opposé en considérant le résultat insulo-operculaire combiné; il n’établit pas un mécanisme de récupération exclusivement droit.
        mapping:
          en: Whole opercular parcel exceeds a functional swallowing field; neither displayed side predicts an individual’s aspiration risk.
          fr: La parcelle operculaire entière dépasse un champ fonctionnel de déglutition; aucun côté affiché ne prédit le risque d’aspiration individuel.
        view: right
        plane: coronal

  - id: cerebellar-cognition
    name: { en: Posterior cerebellum and cognition, fr: Cervelet postérieur et cognition }
    summary:
      en: Compare three posterior cerebellar lobules in studies of cognitive performance after cerebellar stroke.
      fr: Comparez trois lobules cérébelleux postérieurs dans des études sur les performances cognitives après un AVC cérébelleux.
    route:
      en: Left Crus I · right Crus I · right Crus II
      fr: Crus I gauche · Crus I droit · Crus II droit
    scope:
      en: The order compares anatomical landmarks. The landmarks omit the vermis, other posterior lobules, deep nuclei, cerebellar peduncles, and the pontine, thalamic and cerebral regions of cerebro-cerebellar loops. In capuchins, tracing links contralateral Crus II with prefrontal area 46. Human serial histology maps part of the cerebellothalamic output pathway.
      fr: Cet ordre sert à comparer des repères anatomiques. La comparaison laisse de côté le vermis, les autres lobules postérieurs, les noyaux profonds, les pédoncules cérébelleux ainsi que les régions pontiques, thalamiques et cérébrales des boucles cérébro-cérébelleuses. Chez le capucin, le traçage relie le Crus II controlatéral à l’aire préfrontale 46. Chez l’humain, l’histologie sériée décrit une partie de la voie de sortie cérébello-thalamique.
    clinical:
      en: The clinical link is partial at the right posterior cerebellar landmarks. Schmahmann and Sherman described prominent cognitive and behavioural changes in adult focal cases after large or bilateral posterior inferior cerebellar artery infarcts and after one resection involving the vermis and adjacent tissue. Stoodley found exploratory naming and mental-rotation associations in 18 adults after cerebellar stroke. A separate study of 22 adults assessed after chronic cerebellar stroke linked poorer category switching to damage in lateral right Crus I, Crus II and lobule VIIb. The minimum age at stroke was unreported. A broader cognitive study in younger adults found no significant lesion location. A separate language study found lower Boston Naming Test scores than published norms at three months, with no significant association of language scores with lesion side or volume.
      fr: Le lien clinique est partiel au niveau des repères cérébelleux postérieurs droits. Schmahmann et Sherman ont décrit des changements cognitifs et comportementaux marqués dans des cas adultes avec lésion focale, après de grands infarctus ou des infarctus bilatéraux du territoire de l’artère cérébelleuse postéro-inférieure, ainsi qu’après une résection touchant le vermis et les tissus adjacents. Stoodley a relevé des associations exploratoires pour la dénomination et la rotation mentale chez 18 adultes après un AVC cérébelleux. Dans une autre étude portant sur 22 adultes en phase chronique après un AVC cérébelleux, de moins bonnes performances en alternance entre catégories sémantiques étaient associées à des lésions des parties latérales du Crus I, du Crus II et du lobule VIIb droits. L’âge minimal au moment de l’AVC n’était pas précisé. Une étude évaluant la cognition plus largement chez des adultes plus jeunes n’a relevé aucune localisation lésionnelle significative. Une étude langagière distincte a relevé des scores au test de dénomination de Boston inférieurs aux normes publiées à trois mois, sans association significative entre les scores langagiers et le côté ou le volume de la lésion.
    deficit: cerebellar-cognitive
    references: [cerebellar-motor-loops, clinical-schmahmann-1998, cerebellar-cognitive-lesions, cerebellothalamic-course, clinical-chirino-perez-2022, clinical-reumers-2024, clinical-geva-2021-cerebellar, clinical-satoer-2024-cerebellar]
    clinical_references: [clinical-schmahmann-1998, cerebellar-cognitive-lesions, clinical-chirino-perez-2022, clinical-reumers-2024, clinical-geva-2021-cerebellar, clinical-satoer-2024-cerebellar]
    steps:
      - id: left-crus-i
        region: learning:crus-i-left
        source_name: Crus I
        name: { en: Left Crus I, fr: Crus I gauche }
        role: { en: Exploratory spatial-task landmark, fr: Repère exploratoire pour une tâche spatiale }
        explanation:
          en: In Stoodley’s study, the left Crus I and II association with mental rotation appeared at the exploratory uncorrected threshold of p < .05.
          fr: Dans l’étude de Stoodley, l’association entre une atteinte du Crus I et du Crus II gauches et les résultats en rotation mentale apparaissait au seuil exploratoire non corrigé de p < 0,05.
        mapping:
          en: CerebNet outlines the whole left Crus I. The exploratory cluster also involved left Crus II.
          fr: CerebNet délimite le Crus I gauche entier. Le foyer exploratoire touchait aussi le Crus II gauche.
        view: posterior
        plane: coronal
      - id: right-crus-i
        region: learning:crus-i-right
        source_name: Crus I
        name: { en: Right Crus I, fr: Crus I droit }
        role: { en: Exploratory naming landmark, fr: Repère exploratoire pour la dénomination }
        explanation:
          en: Stoodley’s uncorrected analysis linked poorer picture naming to damage in parts of right Crus I, Crus II and lobule VIIb.
          fr: L’analyse non corrigée de Stoodley associait de moins bons résultats en dénomination d’images à des lésions de parties du Crus I, du Crus II et du lobule VIIb droits.
        mapping:
          en: CerebNet outlines the whole right Crus I. The naming cluster extended across neighbouring lobules.
          fr: CerebNet délimite le Crus I droit entier. Le foyer associé à la dénomination s’étendait aux lobules voisins.
        view: posterior
        plane: coronal
      - id: right-crus-ii
        region: learning:crus-ii-right
        source_name: Crus II
        name: { en: Right Crus II, fr: Crus II droit }
        role: { en: Category-switching lesion landmark, fr: Repère lésionnel pour l’alternance entre catégories }
        explanation:
          en: Several analyses of the same chronic-stroke cohort associated poorer category switching with damage to lateral right Crus II. Four adults with right medial posterior strokes involving Crus II and neighbouring lobules had early reported language difficulties.
          fr: Plusieurs analyses de la même cohorte en phase chronique après AVC ont associé de moins bons résultats en alternance entre catégories à une atteinte de la partie latérale du Crus II droit. Des difficultés langagières précoces ont été signalées chez quatre adultes ayant subi un AVC cérébelleux postérieur médial droit touchant le Crus II et des lobules voisins.
        mapping:
          en: CerebNet outlines the whole right Crus II. It includes the lateral task association and the more medial locations involved in the language case series.
          fr: CerebNet délimite le Crus II droit entier. Il englobe la partie latérale associée à l’épreuve ainsi que les sites plus médiaux touchés dans la série de cas sur le langage.
        view: posterior
        plane: coronal

  - id: tactile-recognition
    name: { en: Recognizing objects by touch, fr: Reconnaître les objets au toucher }
    summary:
      en: Compare postcentral texture-related and posterior parietal shape-related landmarks.
      fr: Comparez des repères postcentraux associés aux textures et pariétaux postérieurs associés aux formes.
    route:
      en: Left postcentral sulcus · superior parietal lobule · intraparietal sulcus
      fr: Sillon postcentral gauche · lobule pariétal supérieur · sillon intrapariétal
    scope:
      en: Selected left parietal landmarks from right-hand cases, not an obligatory serial route or proof of universal left dominance. Frontal, opercular and other haptic-processing regions are omitted. Anatomical parcels are not the study’s probabilistic cytoarchitectonic areas.
      fr: Repères pariétaux gauches sélectionnés dans des cas touchant la main droite, pas une voie sérielle obligatoire ni une preuve de dominance gauche universelle. Les régions frontales, operculaires et d’autres régions haptiques sont omises. Les parcelles anatomiques ne sont pas les aires cytoarchitectoniques probabilistes de l’étude.
    clinical:
      en: Hömke studied three adults with chronic left parietal lesions and difficulty recognizing objects with the right hand. Postcentral injury accompanied difficulty discriminating textures, and superior parietal and intraparietal injury accompanied difficulty discriminating shapes. One patient had both patterns. All three had impaired two-point discrimination despite preserved light touch, vibration and joint position. The cases included two infarcts and one presumed ischaemic injury after embolization of an arteriovenous malformation. The clinical link is partial at the left parietal landmarks. This small series includes adjacent lesions and difficulty with active exploration in two patients.
      fr: Hömke a étudié trois adultes ayant une lésion pariétale gauche chronique et des difficultés à reconnaître les objets de la main droite. L’atteinte postcentrale accompagnait les difficultés de discrimination des textures, et les atteintes pariétales supérieures et intrapariétales celles des formes. Un patient présentait les deux profils. Les trois avaient une discrimination à deux points altérée malgré la préservation du tact léger, de la vibration et du sens de position articulaire. Il s’agissait de deux infarctus et d’une lésion présumée ischémique après l’embolisation d’une malformation artérioveineuse. Le lien clinique est partiel au niveau des repères pariétaux gauches. Cette petite série comprend des lésions adjacentes et des difficultés d’exploration active chez deux patients.
    deficit: tactile-agnosia
    references: [tactile-parietal-imaging, clinical-homke-2009]
    clinical_references: [clinical-homke-2009]
    steps:
      - id: postcentral
        region: destrieux:left:68
        source_name: S_postcentral
        name: { en: Left postcentral sulcus, fr: Sillon postcentral gauche }
        role: { en: Texture-related lesion landmark, fr: Repère lésionnel associé aux textures }
        explanation:
          en: Postcentral lesions in Hömke’s cases were associated with impaired texture discrimination during tactile object exploration.
          fr: Les lésions postcentrales des cas de Hömke étaient associées à une discrimination altérée des textures pendant l’exploration tactile d’objets.
        mapping:
          en: Whole sulcal parcel; not an exact reconstruction of the lesions or the hand representation in somatosensory cortex.
          fr: Parcelle sulcale entière; ni reconstruction exacte des lésions ni représentation de la main dans le cortex somatosensoriel.
        view: left
        plane: axial
      - id: superior-parietal
        region: destrieux:left:27
        source_name: G_parietal_sup
        name: { en: Left superior parietal lobule, fr: Lobule pariétal supérieur gauche }
        role: { en: Shape-related parietal landmark, fr: Repère pariétal associé aux formes }
        explanation:
          en: Superior parietal and adjacent intraparietal lesions accompanied shape difficulties. In Stoeckel’s healthy volunteers, activity in the left anterior superior parietal cortex accompanied maintenance of tactile information between explorations.
          fr: Les lésions pariétales supérieures et intrapariétales adjacentes accompagnaient les difficultés de forme. Chez les volontaires sains de Stoeckel, l’activité du cortex pariétal supérieur antérieur gauche accompagnait le maintien de l’information tactile entre les explorations.
        mapping:
          en: The whole lobule exceeds both the lesion territory and the anterior functional focus. Healthy activation does not establish a necessary lesion site.
          fr: Le lobule entier dépasse le territoire lésionnel et le foyer fonctionnel antérieur. L’activation saine n’établit pas un site lésionnel nécessaire.
        view: superior
        plane: axial
      - id: intraparietal
        region: destrieux:left:57
        source_name: S_intrapariet_and_P_trans
        name: { en: Left intraparietal and transverse parietal sulci, fr: Sillons intrapariétal et pariétal transverse gauches }
        role: { en: Adjacent shape-related lesion landmark, fr: Repère lésionnel adjacent associé aux formes }
        explanation:
          en: This landmark locates the sulcal extension of the posterior parietal findings; it does not constitute an independently demonstrated third relay.
          fr: Ce repère situe l’extension sulcale des résultats pariétaux postérieurs; il ne constitue pas un troisième relais démontré indépendamment.
        mapping:
          en: Combined sulcal label, broader than the reported intraparietal involvement. The selected parcels do not display disconnection or the entire haptic network.
          fr: Étiquette sulcale combinée, plus large que l’atteinte intrapariétale rapportée. Les parcelles sélectionnées n’affichent ni déconnexion ni réseau haptique entier.
        view: superior
        plane: axial
  - id: thalamocingulate-posterior
    name: { en: Anteroventral thalamic projection to the posterior cingulate cortex, fr: Du noyau antéroventral du thalamus au cortex cingulaire postérieur }
    summary:
      en: Follow a projection traced in macaques from the rostral part of the anteroventral thalamic nucleus to posteroventral area 23b. Use two right-sided landmarks in the human atlas to locate the regions at either end.
      fr: Suivez une projection mise en évidence par traçage chez le macaque, de la partie rostrale du noyau antéroventral du thalamus à l’aire 23b postéroventrale. Repérez les régions correspondantes à droite dans l’atlas humain.
    route:
      en: Right anteroventral thalamic nucleus → right ventral posterior cingulate cortex
      fr: Noyau antéroventral droit du thalamus → partie ventrale du cortex cingulaire postérieur droit
    scope:
      en: Human fibre dissection shows that the anterior thalamic radiations reach the cingulum. The precise white-matter course of the projection to area 23b remains unresolved. Other cingulate afferents and reciprocal projections lie outside this tour.
      fr: La dissection des fibres chez l’humain montre que les radiations thalamiques antérieures rejoignent le cingulum. Le trajet précis dans la substance blanche de la projection vers l’aire 23b reste indéterminé. Les autres afférences cingulaires et les projections réciproques sortent du cadre de ce parcours.
    clinical:
      en: In a post-mortem comparison of people with alcohol-related Wernicke encephalopathy, the group with Korsakoff amnesia had lower estimated neuron counts in the anterior principal thalamic nucleus than the group without amnesia. Both groups showed neuronal loss in the medial mammillary and mediodorsal thalamic nuclei. In a separate case, a 75-year-old woman had severe anterograde memory impairment after a left anterolateral thalamic infarct, with difficulty recalling short stories immediately and after a delay. MRI one month after the stroke showed anterior and lateral left thalamic foci and extensive white-matter changes consistent with small-vessel disease. The mammillothalamic tract appeared spared on MRI, according to the authors. The contribution of the specific thalamocingulate projection remains unresolved.
      fr: Dans une comparaison post-mortem chez des personnes atteintes d’une encéphalopathie de Wernicke liée à l’alcool, le nombre estimé de neurones du noyau principal antérieur du thalamus était plus faible dans le groupe présentant une amnésie de Korsakoff que dans le groupe sans amnésie. Les deux groupes présentaient une perte neuronale dans le noyau mamillaire médial et le noyau médiodorsal du thalamus. Dans une observation distincte, une patiente de 75 ans présentait une amnésie antérograde sévère après un infarctus thalamique antérolatéral gauche, avec notamment des difficultés au rappel immédiat et différé de courts récits. L’IRM à un mois montrait des foyers thalamiques gauches, l’un antérieur et l’autre latéral, ainsi que d’importantes anomalies de la substance blanche d’allure microangiopathique. Selon les auteurs, le faisceau mamillothalamique paraissait épargné à l’IRM. La contribution propre de cette projection thalamocingulaire reste indéterminée.
    deficit: amnesia
    references: [thalamocingulate-ventral-23b-tracing, thalamocingulate-cingulum-tracing, memory-mammillothalamic-dissection, cortical-parcellation, clinical-harding-2000, clinical-grulich-anterolateral-thalamus-2025]
    clinical_references: [clinical-harding-2000, clinical-grulich-anterolateral-thalamus-2025]
    steps:
      - id: anteroventral
        region: nextbrain:right:10220
        source_name: anteroventral_nucleus_of_thalamus
        name: { en: Right anteroventral thalamic nucleus, fr: Noyau antéroventral droit du thalamus }
        role: { en: Thalamic origin of the projection to posteroventral area 23b, fr: Origine thalamique de la projection vers l’aire 23b postéroventrale }
        explanation:
          en: In a separate macaque study, a tracer injection involving both the anteroventral and laterodorsal thalamic nuclei labelled fibres that travelled through the internal capsule and dorsal cingulum to the posterior cingulate cortex. The mixed injection identifies the route of the combined projections.
          fr: Dans une autre étude chez le macaque, une injection de traceur intéressant à la fois les noyaux antéroventral et latérodorsal du thalamus a marqué des fibres qui empruntaient la capsule interne et la portion dorsale du cingulum pour atteindre le cortex cingulaire postérieur. Cette injection renseigne sur le trajet des projections issues de l’ensemble des deux noyaux.
        mapping:
          en: NextBrain displays the entire anteroventral nucleus. The macaque neurons traced from posteroventral area 23b were in its rostral part.
          fr: NextBrain représente le noyau antéroventral dans son ensemble. Chez le macaque, les neurones marqués depuis l’aire 23b postéroventrale se trouvaient dans sa partie rostrale.
        view: superior
        plane: coronal
      - id: ventral-posterior-cingulate
        region: hcp-mmp:right:33
        source_name: R_v23ab_ROI
        name: { en: Right ventral posterior cingulate cortex, fr: Partie ventrale du cortex cingulaire postérieur droit }
        role: { en: Regional landmark for the cortical target, fr: Repère régional de la cible corticale }
        explanation:
          en: In macaques, a retrograde tracer injection involving posteroventral area 23b labelled neurons in the rostral part of the anteroventral thalamic nucleus.
          fr: Chez le macaque, une injection de traceur rétrograde intéressant l’aire 23b postéroventrale a marqué des neurones dans la partie rostrale du noyau antéroventral du thalamus.
        mapping:
          en: The human HCP-MMP parcel v23ab combines the ventral parts of areas 23a and 23b. It provides a regional landmark for the traced area 23b territory.
          fr: La parcelle v23ab de l’atlas humain HCP-MMP réunit les parties ventrales des aires 23a et 23b. Elle situe approximativement le territoire de l’aire 23b étudié par traçage.
        view: left
        plane: sagittal

  - id: dorsal-cingulum-anterior-posterior
    name: { en: Anterior to posterior cingulate projection · dorsal cingulum, fr: Projection cingulaire antéropostérieure · cingulum dorsal }
    summary:
      en: Follow a projection traced in macaques from pregenual area 24 to the posterior cingulate cortex. Locate its two ends using landmarks in the left hemisphere of the human atlas.
      fr: Suivez une projection mise en évidence par traçage chez le macaque, de l’aire 24 prégénuale au cortex cingulaire postérieur. Situez ses deux extrémités à l’aide de repères dans l’hémisphère gauche de l’atlas humain.
    route:
      en: Pregenual anterior cingulate cortex → posterior cingulate cortex via the dorsal cingulum (macaque projection shown with left-sided human atlas landmarks)
      fr: Cortex cingulaire antérieur prégénual → cortex cingulaire postérieur par le cingulum dorsal (projection du macaque illustrée par des repères à gauche dans l’atlas humain)
    scope:
      en: Human fibre dissection shows longitudinal cingulum fibres above the body of the corpus callosum. Human diffusion tractography estimates streamlines between broadly defined rostral anterior and posterior cingulate regions. The precise cortical endpoints and direction of the corresponding human projection remain unresolved. The display shows the two cortical landmarks. The intervening fibres and other projections from the injection site, including those to the precuneus and the opposite hemisphere, are outside this display.
      fr: La dissection de cerveaux humains montre des fibres longitudinales du cingulum au-dessus du tronc du corps calleux. La tractographie de diffusion estime des trajectoires entre de larges territoires du cortex cingulaire antérieur rostral et du cortex cingulaire postérieur. Les extrémités corticales précises et le sens de la projection correspondante chez l’humain restent indéterminés. Le parcours montre les deux repères corticaux. Le parcours laisse de côté les fibres qui relient ces repères et les autres projections issues du site d’injection, notamment celles vers le précunéus et l’hémisphère opposé.
    clinical:
      en: In a neuropathological series, three people with akinetic mutism had bilateral lesions of the rostral anterior cingulate gyri extending into adjacent supplementary motor cortex. In a separate case of akinetic mutism after bilateral medial cortical infarcts, longitudinal diffusion MRI showed relatively persistent microstructural abnormalities in the anterior cingulate cortex and cingulum during recovery of volition. The contribution of this specific projection to the deficit remains unresolved.
      fr: Dans une série neuropathologique, trois personnes atteintes de mutisme akinétique présentaient des lésions bilatérales de la partie rostrale du gyrus cingulaire antérieur, qui s’étendaient au cortex moteur supplémentaire voisin. Dans un autre cas de mutisme akinétique après des infarctus corticaux médiaux bilatéraux, le suivi par IRM de diffusion a mis en évidence des anomalies microstructurales relativement persistantes dans le cortex cingulaire antérieur et le cingulum au cours de la récupération de l’initiative. La contribution propre de cette projection au trouble reste indéterminée.
    deficit: akinetic-mutism
    references: [thalamocingulate-cingulum-tracing, cingulum-intracingulate-tracing, cingulum-human-dissection-wu, cingulum-human-tractography-choi, cortical-parcellation, clinical-nemeth-1988, clinical-zhang-akinetic-mutism-2024]
    clinical_references: [clinical-nemeth-1988, clinical-zhang-akinetic-mutism-2024]
    steps:
      - id: pregenual
        region: hcp-mmp:left:180
        source_name: L_p24_ROI
        name: { en: Left pregenual anterior cingulate cortex, fr: Cortex cingulaire antérieur prégénual gauche }
        role: { en: Cortical origin of the traced projection, fr: Origine corticale de la projection tracée }
        explanation:
          en: In macaque case 179FR, a tracer injection in the pregenual dorsal anterior cingulate cortex labelled axons that travelled caudally through the dorsal cingulum on the same side.
          fr: Chez le macaque du cas 179FR, une injection de traceur dans la partie dorsale du cortex cingulaire antérieur prégénual a marqué des axones qui empruntaient le cingulum dorsal du même côté en direction caudale.
        mapping:
          en: HCP-MMP’s p24 parcel is the posterior division of area 24 proper, near the dorsal aspect of the callosal genu. It gives an approximate regional landmark for the macaque injection site.
          fr: La parcelle p24 de HCP-MMP représente la division postérieure de l’aire 24 proprement dite, près du versant dorsal du genou du corps calleux. Elle fournit un repère approximatif pour situer le site d’injection chez le macaque.
        view: right
        plane: sagittal
      - id: posterior
        region: hcp-mmp:left:34
        source_name: L_d23ab_ROI
        name: { en: Left dorsal posterior cingulate cortex, fr: Partie dorsale du cortex cingulaire postérieur gauche }
        role: { en: Regional landmark for the cortical target, fr: Repère régional de la cible corticale }
        explanation:
          en: In case 179FR, labelled axons reached the ipsilateral posterior cingulate cortex at the caudal end of the dorsal cingulum. In a separate rhesus macaque study, a small retrograde tracer injection involving areas 23a and 23b labelled neurons in anterior cingulate area 24a.
          fr: Dans le cas 179FR, des axones marqués atteignaient le cortex cingulaire postérieur du même côté, à l’extrémité caudale du cingulum dorsal. Dans une autre étude chez le macaque rhésus, une injection restreinte de traceur rétrograde intéressant les aires 23a et 23b a marqué des neurones dans l’aire cingulaire antérieure 24a.
        mapping:
          en: The human HCP-MMP parcel d23ab groups the dorsal portions of areas 23a and 23b on the posterior cingulate gyrus above the splenium. It provides an approximate landmark for the posterior target region.
          fr: La parcelle d23ab de l’atlas humain HCP-MMP réunit les parties dorsales des aires 23a et 23b du gyrus cingulaire postérieur au-dessus du splénium. Elle fournit un repère approximatif pour situer la région cible postérieure.
        view: right
        plane: sagittal

  - id: vertical-occipital-v3a-v4
    name: { en: V3A to ventral V4 · comparison with the vertical occipital fasciculus, fr: De V3A à V4 ventrale · comparaison avec le faisceau occipital vertical }
    summary:
      en: Follow a projection from dorsal V3A to ventral V4 traced in macaques. Compare its cortical landmarks with the regions described in human studies of the vertical occipital fasciculus.
      fr: Suivez une projection de V3A dorsale vers V4 ventrale mise en évidence par traçage chez le macaque. Comparez ses repères corticaux aux régions décrites dans les études du faisceau occipital vertical chez l’humain.
    route:
      en: Dorsal V3A → peripheral upper-field sector of ventral V4 (macaque projection shown with left-sided landmarks in the human atlas)
      fr: V3A dorsale → secteur de V4 ventrale qui représente la périphérie du champ visuel supérieur (projection du macaque illustrée par des repères à gauche dans l’atlas humain)
    scope:
      en: In macaques, diffusion tractography places some estimated endpoints of the vertical occipital fasciculus near dorsal V3A and others near ventral V4. Human dissection follows the fasciculus toward the transverse occipital sulcus dorsally and the posterior fusiform gyrus ventrally. Human diffusion tractography estimates streamlines between the V3A and V4 atlas parcels. Using individual retinotopic maps, another study found estimated endpoints near V3A and V3B dorsally and near hV4 and VO-1 ventrally. The precise course of the traced macaque axons and the existence of the same directed projection in humans remain unresolved. The tour shows two cortical landmarks and describes the fasciculus for comparison.
      fr: Chez le macaque, la tractographie de diffusion situe des extrémités estimées du faisceau occipital vertical près de V3A dorsale et d’autres près de V4 ventrale. Chez l’humain, la dissection permet de suivre le faisceau vers le sillon occipital transverse dorsalement et vers le gyrus fusiforme postérieur ventralement. La tractographie de diffusion estime des trajectoires entre les parcelles V3A et V4 de l’atlas. Une autre étude a utilisé des cartes rétinotopiques individuelles pour situer des extrémités estimées près de V3A et de V3B dorsalement et près de hV4 et de VO-1 ventralement. Il reste à déterminer le trajet précis des axones marqués chez le macaque et à établir si la même projection existe dans le même sens chez l’humain. Le parcours présente deux repères corticaux et décrit le faisceau à titre de comparaison.
    clinical:
      en: Leff and colleagues compared structural MRI in six people with pure alexia and seven with hemianopic alexia after left occipital stroke. They selected patients with contrasting reading profiles. Both groups had damage in the medial left occipital lobe. The pure alexia group had additional damage in the posterior fusiform gyrus and adjacent tissue. In a separate case, letter-by-letter reading began during insertion of a tubular retractor to access a left occipitotemporal metastasis. At onset, intraoperative imaging localized the retractor to the course of the fasciculus estimated from preoperative diffusion MRI. The specific fibres affected in that case and the role of the V3A-to-V4 projection in reading remain unresolved.
      fr: Leff et ses collègues ont comparé les IRM structurelles de six personnes atteintes d’alexie pure et de sept personnes atteintes d’alexie hémianopsique après un AVC occipital gauche. Ils ont sélectionné des profils de lecture contrastés. Les deux groupes présentaient des lésions dans la partie médiale du lobe occipital gauche. Le groupe atteint d’alexie pure présentait aussi des lésions du gyrus fusiforme postérieur et des tissus adjacents. Dans un autre cas, une lecture lettre par lettre est apparue lors de l’insertion d’un écarteur tubulaire pour accéder à une métastase occipitotemporale gauche. À l’apparition du trouble, l’imagerie peropératoire situait l’écarteur sur le trajet du faisceau estimé par tractographie préopératoire. Les fibres atteintes dans ce cas et le rôle de la projection de V3A vers V4 dans la lecture restent indéterminés.
    deficit: alexia
    references: [visual-v3a-v4-tracing, vof-human-macaque, vof-vervet-histology, vof-human-dissection, vof-human-retinotopic-maps, cortical-parcellation, reading-lesions, clinical-sabsevitz-vof-alexia]
    clinical_references: [reading-lesions, clinical-sabsevitz-vof-alexia]
    steps:
      - id: v3a
        region: hcp-mmp:left:13
        source_name: L_V3A_ROI
        name: { en: Left visual area V3A, fr: Aire visuelle V3A gauche }
        role: { en: Dorsal source of the traced projection, fr: Origine dorsale de la projection tracée }
        explanation:
          en: A retrograde tracer injected into ventral V4 in a macaque labelled neurons in V3A. Polarized-light microscopy in vervet tissue identifies fibres of the vertical occipital fasciculus in the white matter near V3A and neighbouring dorsal visual areas.
          fr: Chez un macaque, un traceur rétrograde injecté dans V4 ventrale a marqué des neurones de V3A. Chez le vervet, la microscopie en lumière polarisée repère des fibres du faisceau occipital vertical dans la substance blanche près de V3A et des aires visuelles dorsales voisines.
        mapping:
          en: The HCP-MMP parcel covers left V3A in the human atlas. It gives an approximate landmark for the macaque region where neurons were labelled.
          fr: La parcelle HCP-MMP couvre V3A gauche dans l’atlas humain. Elle sert de repère approximatif pour la région où des neurones ont été marqués chez le macaque.
        view: posterior
        plane: axial
      - id: v4
        region: hcp-mmp:left:6
        source_name: L_V4_ROI
        name: { en: Left visual area V4, fr: Aire visuelle V4 gauche }
        role: { en: Ventral target of the traced projection, fr: Cible ventrale de la projection tracée }
        explanation:
          en: In macaque case 6p, the tracer was injected into ventral V4 at a site representing the upper visual field at 20° eccentricity. Human dissection follows fibres of the fasciculus toward the posterior transverse collateral sulcus, an anatomical landmark for the hV4/VO-1 boundary.
          fr: Chez le macaque du cas 6p, le site d’injection dans V4 ventrale correspondait à une excentricité de 20° dans le champ visuel supérieur. La dissection chez l’humain suit des fibres du faisceau jusqu’au sillon collatéral transverse postérieur, un repère anatomique de la limite entre hV4 et VO-1.
        mapping:
          en: The inferior part of HCP-MMP V4 largely overlaps hV4 as mapped by retinotopic fMRI in humans. The atlas shows the entire parcel, including its superior part.
          fr: La partie inférieure de V4 dans HCP-MMP recouvre largement hV4, délimitée par cartographie rétinotopique en IRM fonctionnelle chez l’humain. L’atlas montre la parcelle entière, y compris sa partie supérieure.
        view: inferior
        plane: coronal

  - id: piriform-orbitofrontal
    name: { en: Piriform–orbitofrontal olfactory pathway, fr: Voie olfactive piriforme–orbitofrontale }
    summary:
      en: Use two right-sided landmarks to follow the direct olfactory projection traced from the piriform cortex to orbitofrontal area 13a in macaques.
      fr: Suivez, à l’aide de deux repères dans l’hémisphère droit, la projection olfactive directe que le traçage a mise en évidence chez le macaque entre le cortex piriforme et l’aire orbitofrontale 13a.
    route:
      en: Right piriform cortex → right posterior orbitofrontal cortex
      fr: Cortex piriforme droit → cortex orbitofrontal postérieur droit
    scope:
      en: The tour starts downstream of the olfactory bulb and lateral olfactory tract and covers one of several piriform projections. The two human atlas parcels approximate the origin and target of the branch traced in macaques. The exact course and endings of the projection in humans remain unresolved.
      fr: Le parcours débute en aval du bulbe et du tractus olfactif latéral et suit l’une des projections du cortex piriforme. Les deux parcelles de l’atlas humain situent approximativement l’origine et la cible de la branche tracée chez le macaque. Le trajet précis et les terminaisons de cette projection chez l’humain restent indéterminés.
    clinical:
      en: In an adult-indexed surgical series, patients with frontal excisions involving orbital cortex or temporal excisions performed more poorly on odour identification. Group n-butanol detection thresholds were normal. Adults with unilateral temporal lobe epilepsy scored lower overall than matched controls on odour identification and delayed odour matching. In the subsets tested before and after anterior temporal resection, scores on both tests fell overall after surgery. The clinical link to the depicted projection is tenuous because the lesions and resections cover broader orbital and temporal regions.
      fr: Dans une série chirurgicale indexée chez l’adulte, les résultats d’identification des odeurs étaient moins bons après exérèse frontale touchant le cortex orbital ou exérèse temporale. Les seuils de détection du n-butanol étaient normaux dans les groupes. Les adultes ayant une épilepsie temporale unilatérale obtenaient globalement de moins bons résultats que les témoins appariés en identification et en appariement différé des odeurs. Dans les sous-groupes examinés avant et après résection temporale antérieure, les scores aux deux épreuves diminuaient globalement après l’intervention. Le lien clinique avec la projection présentée demeure ténu, car les lésions et les résections couvrent des régions orbitaires et temporales plus étendues.
    deficit: olfactory-recognition
    references: [olfactory-piriform-orbitofrontal-tracing, cortical-parcellation, olfactory-orbitofrontal-human-architecture, olfactory-identification, olfactory-temporal-resection]
    clinical_references: [olfactory-identification, olfactory-temporal-resection]
    steps:
      - id: piriform
        region: hcp-mmp:right:110
        source_name: R_Pir_ROI
        name: { en: Right piriform cortex, fr: Cortex piriforme droit }
        role: { en: Cortical origin of the projection, fr: Origine corticale de la projection }
        explanation:
          en: In macaques, an anterograde tracer injection confined to the anterior piriform cortex just behind the limen insulae labelled fibres in the caudal orbital cortex.
          fr: Chez le macaque, une injection de traceur antérograde limitée au cortex piriforme antérieur, juste en arrière du seuil de l’insula, a marqué des fibres dans le cortex orbital caudal.
        mapping:
          en: HCP-MMP locates Pir at the limen insulae and identifies it as a likely region of piriform cortex. The parcel provides an approximate human landmark for the origin traced in macaques.
          fr: Au seuil de l’insula, la parcelle Pir de HCP-MMP correspond vraisemblablement au cortex piriforme. Elle situe approximativement chez l’humain l’origine de la projection tracée chez le macaque.
        view: inferior
        plane: coronal
      - id: posterior-orbitofrontal
        region: hcp-mmp:right:166
        source_name: R_pOFC_ROI
        name: { en: Right posterior orbitofrontal cortex, fr: Cortex orbitofrontal postérieur droit }
        role: { en: Cortical target of piriform fibres, fr: Cible corticale des fibres piriformes }
        explanation:
          en: In macaques, a retrograde tracer injection in orbitofrontal area 13a labelled neurons in the anterior piriform cortex.
          fr: Chez le macaque, une injection de traceur rétrograde dans l’aire orbitofrontale 13a a marqué des neurones du cortex piriforme antérieur.
        mapping:
          en: The human HCP-MMP posterior orbitofrontal complex overlaps areas 13a and 14c. It provides a broader landmark for area 13a, a small field in the olfactory sulcus near the attachment of the olfactory stalk.
          fr: Le complexe orbitofrontal postérieur de HCP-MMP chevauche les aires 13a et 14c décrites chez l’humain. Il sert de repère plus large pour l’aire 13a, un petit territoire du sillon olfactif près de l’attache du pédoncule olfactif.
        view: inferior
        plane: coronal

