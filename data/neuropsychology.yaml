    mapping_note:
      en: Rectus gyri provide coarse ventromedial landmarks on both sides. They do not reproduce the lesion boundaries or imply that bilateral injury is necessary.
      fr: Les gyri rectus fournissent des repères ventromédiaux approximatifs des deux côtés. Ils ne reproduisent pas les limites lésionnelles et n’impliquent pas qu’une atteinte bilatérale soit nécessaire.
