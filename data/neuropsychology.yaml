  - id: visual-anosognosia-occipital
    deficit: visual-anosognosia
    title: {en: Occipital injury with unawareness of visual loss, fr: Lésion occipitale avec méconnaissance de la perte visuelle}
    network: {en: Visual systems and deficit awareness, fr: Systèmes visuels et conscience du déficit}
    laterality: bilateral
    finding:
      en: Four adult cases linked Anton syndrome to bilateral occipital injury, sometimes with additional temporal or thalamic damage. Analysis of 16 published cases identified striate and extrastriate occipital injury, usually bilateral. A further case had bilateral occipital infarcts together with right frontal and parietal hemorrhagic lesions.
      fr: Quatre cas adultes associaient le syndrome d’Anton à des lésions occipitales bilatérales, parfois avec une atteinte temporale ou thalamique supplémentaire. L’analyse de 16 cas publiés identifiait une atteinte occipitale striée et extrastriée, habituellement bilatérale. Un autre cas avait des infarctus occipitaux bilatéraux associés à des lésions hémorragiques frontales et pariétales droites.
    limitation:
      en: Blindness can occur with preserved awareness. The literature cases can overlap across reports; one of the 16 had unilateral occipital injury with contralateral hypoperfusion. The lesion comparison used mirrored unilateral visual-control lesions as synthetic bilateral controls. These findings do not isolate a parcel whose injury alone produces visual anosognosia.
      fr: La cécité peut survenir avec une conscience préservée. Les cas publiés peuvent se chevaucher entre rapports; l’un des 16 avait une lésion occipitale unilatérale avec hypoperfusion controlatérale. La comparaison lésionnelle utilisait des lésions visuelles témoins unilatérales reflétées comme témoins bilatéraux synthétiques. Ces résultats n’isolent pas une parcelle dont la lésion seule produit une anosognosie visuelle.
    mapping_note:
      en: The bilateral calcarine sulci are landmarks for the striate component of the described injury. They do not show the full striate/extrastriate lesions, associated white matter or a unique awareness centre. Frontal and parietal lesions in the individual case are not generalized to the whole profile.
      fr: Les sillons calcarins bilatéraux servent de repères à la composante striée de l’atteinte décrite. Ils ne représentent ni les lésions striées et extrastriées complètes, ni la substance blanche associée, ni un centre unique de la conscience. Les lésions frontales et pariétales du cas individuel ne sont pas généralisées à tout le profil.
    mappings:
      - {region: 'destrieux:left:45', source_name: S_calcarine}
      - {region: 'destrieux:right:45', source_name: S_calcarine}
    evidence:
      - {reference: chaudhry-2019, role: supporting}
      - {reference: monai-2024, role: supporting}
      - {reference: barojas-alvarez-2021, role: qualifying}

  - id: visual-anosognosia-disconnection
    deficit: visual-anosognosia
    title: {en: Predicted disconnection beyond visual cortex, fr: Déconnexion prédite au-delà du cortex visuel}
    network: {en: Normative visual and frontoparietal connections, fr: Connexions visuelles et frontopariétales normatives}
    laterality: bilateral
    finding:
      en: Embedding the Anton-syndrome lesions in healthy structural and functional atlases predicted greater disconnection toward dorsal frontoparietal attention and control systems than for the synthetic visual controls. Visual and motor anosognosia showed partly shared predicted disconnection despite different direct lesion locations.
      fr: L’intégration des lésions du syndrome d’Anton dans des atlas structurels et fonctionnels de sujets sains prédisait une déconnexion plus importante vers les systèmes frontopariétaux dorsaux d’attention et de contrôle que chez les témoins visuels synthétiques. Les anosognosies visuelle et motrice présentaient une déconnexion prédite en partie commune malgré des localisations lésionnelles directes différentes.
    limitation:
      en: These are atlas-based estimates, not measured disconnections in each patient, and the comparison groups differ in how lesions were obtained. The additional frontal/parietal injury in the individual 2021 case does not prove that direct damage to those regions is universally required.
      fr: Il s’agit d’estimations fondées sur des atlas, et non de déconnexions mesurées chez chaque patient, et les groupes comparés diffèrent par le mode d’obtention des lésions. L’atteinte frontale et pariétale supplémentaire du cas individuel de 2021 ne prouve pas qu’une lésion directe de ces régions soit toujours nécessaire.
    mapping_note:
      en: No parcel is coloured because the frontoparietal results describe predicted remote disconnection. Only the separate direct-injury finding supplies coloured visual landmarks.
      fr: Aucune parcelle n’est colorée car les résultats frontopariétaux décrivent une déconnexion distante prédite. Seul le résultat distinct d’atteinte directe fournit des repères visuels colorés.
