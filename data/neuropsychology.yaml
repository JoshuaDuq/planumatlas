  - id: amnesia-diencephalic
    deficit: amnesia
    title: {en: Korsakoff amnesia and the anterior thalamus, fr: Amnésie de Korsakoff et thalamus antérieur}
    network: {en: Mammillothalamic memory circuit, fr: Circuit mnésique mamillo-thalamique}
    laterality: bilateral
    finding:
      en: Neuronal loss in the anterior thalamic nuclei was found consistently only in alcoholics with Korsakoff amnesia, whereas the mammillary and mediodorsal thalamic nuclei degenerated substantially in amnesic and non-amnesic alcoholics with Wernicke’s encephalopathy alike.
      fr: La perte neuronale des noyaux thalamiques antérieurs n’était constante que chez les alcooliques avec amnésie de Korsakoff, alors que les noyaux mamillaires et médiodorsaux dégénéraient fortement chez les alcooliques amnésiques comme non amnésiques avec encéphalopathie de Wernicke.
    limitation:
      en: A post-mortem study of nutritional injury, not of a focal lesion. Mammillary damage did not distinguish amnesic from non-amnesic alcoholics in this sample, but after colloid cyst removal greater mammillary atrophy went with impaired recall, so the mammillary bodies are not excluded from the amnesia.
      fr: Étude post-mortem d’une atteinte nutritionnelle, et non d’une lésion focale. L’atteinte mamillaire ne distinguait pas les alcooliques amnésiques des non amnésiques dans cet échantillon, mais après ablation d’un kyste colloïde une atrophie mamillaire plus marquée allait de pair avec un rappel altéré; les corps mamillaires ne sont donc pas exclus de l’amnésie.
    mapping_note:
      en: The anteroventral nucleus is the anterior thalamic nucleus available on both sides; the mammillary nuclei are shown as the site damaged in both groups of this study. The mediodorsal nucleus, also damaged in both groups, is not coloured.
      fr: Le noyau antéroventral est le noyau thalamique antérieur disponible des deux côtés; les noyaux mamillaires sont affichés comme site atteint dans les deux groupes de cette étude. Le noyau médiodorsal, également atteint dans les deux groupes, n’est pas coloré.
