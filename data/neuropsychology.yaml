  - id: central-pain-thalamus
    deficit: central-pain
    title: {en: The ventral posterior–pulvinar border, fr: La frontière ventral postérieur–pulvinar}
    network: {en: Posterolateral thalamic somatosensory relay, fr: Relais somatosensoriel thalamique postérolatéral}
    laterality: bilateral
    finding:
      en: Lesions of nine of ten pain patients overlapped at the ventral posterior–pulvinar border, with an odds ratio of 81 in this case–control sample. The study’s atlas-based assignment placed this region at the ventrocaudalis portae nucleus.
      fr: Les lésions de neuf patients douloureux sur dix se chevauchaient à la frontière ventrale postérieure–pulvinar, avec un rapport de cotes de 81 dans cet échantillon cas-témoins. L’attribution fondée sur l’atlas de l’étude situait cette région au noyau ventrocaudalis portae.
    limitation:
      en: Ten patients per group, with nuclei assigned by atlas registration. Non-thalamic pain was not studied. Karoam’s larger study supported ventrocaudal thalamic involvement but lacked the resolution to identify the precise thalamic nucleus, limiting nucleus-specific claims.
      fr: Dix patients par groupe, avec noyaux attribués par recalage sur un atlas. La douleur non thalamique n’était pas étudiée. La plus grande étude de Karoam soutenait l’implication thalamique ventrocaudale sans résoudre le noyau thalamique précis, ce qui limite les affirmations spécifiques à un noyau.
    mapping_note:
      en: The caudal ventral posterolateral nucleus and the anterior pulvinar nucleus bracket the reported border on each side. Pain is contralateral to the lesion.
      fr: Le noyau ventral postérolatéral caudal et le noyau antérieur du pulvinar encadrent la frontière rapportée de chaque côté. La douleur est controlatérale à la lésion.
