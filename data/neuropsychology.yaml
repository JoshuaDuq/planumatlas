  - id: olfactory-memory-right-orbital
    deficit: olfactory-recognition
    title: {en: Remembering previously presented smells, fr: Reconnaissance d’odeurs déjà présentées}
    network: {en: Right orbitofrontal and temporal odour memory, fr: Mémoire olfactive orbitofrontale et temporale droite}
    laterality: right
    finding:
      en: Odour recognition memory was impaired after right temporal or right orbitofrontal excision. Naming the odours improved recognition across groups.
      fr: La mémoire de reconnaissance olfactive était altérée après exérèse temporale droite ou orbitofrontale droite. Nommer les odeurs améliorait la reconnaissance dans les différents groupes.
    limitation:
      en: This memory task differs from smell detection and identification. Its right-sided result does not imply that all olfactory functions are right-lateralized.
      fr: Cette tâche mnésique diffère de la détection et de l’identification des odeurs. Son résultat droit ne signifie pas que toutes les fonctions olfactives sont latéralisées à droite.
    mapping_note:
      en: The right orbital parcel marks one reported surgical site. It neither defines a memory-specific subregion nor represents the temporal excisions.
      fr: La parcelle orbitale droite représente un des sites chirurgicaux rapportés. Elle ne délimite pas une sous-région propre à la mémoire et ne représente pas les exérèses temporales.
    mappings:
      - {region: 'destrieux:right:24', source_name: G_orbital}
    evidence:
      - {reference: jones-gotman-1993, role: supporting}

