  - id: semantic-anterior-temporal
    deficit: semantic-memory
    title: {en: Conceptual knowledge and the anterior temporal lobes, fr: Connaissances conceptuelles et lobes temporaux antérieurs}
    network: {en: Bilateral anterior temporal semantic system, fr: Système sémantique temporal antérieur bilatéral}
    laterality: bilateral
    finding:
      en: Four patients with semantic deficits after herpes simplex encephalitis, most marked for living things, had grey-matter loss mainly in antero-medial temporal cortex on both sides. After unilateral anterior temporal resection for epilepsy, 20 patients scored normally on simple semantic tasks, but harder tests of specific, less frequent or abstract concepts and response times showed impairment in every individual. A later group of 17 found mild impairment after left or right resection, with minimal differences between sides.
      fr: Quatre patients ayant des déficits sémantiques après une encéphalite herpétique, plus marqués pour les êtres vivants, présentaient une perte de substance grise surtout dans le cortex temporal antéro-médial des deux côtés. Après une résection temporale antérieure unilatérale pour épilepsie, 20 patients obtenaient des scores normaux aux tâches sémantiques simples, mais des épreuves plus difficiles portant sur des concepts spécifiques, moins fréquents ou abstraits, et les temps de réponse révélaient une atteinte chez chacun. Un groupe ultérieur de 17 patients montrait une atteinte légère après résection gauche ou droite, avec des différences minimes entre les côtés.
    limitation:
      en: Unilateral damage produced only mild, often subclinical deficits; in another series of 20 unilateral temporal lesions, only one patient showed even mild receptive semantic impairment. Severe loss across all categories is documented mainly in semantic dementia, a progressive disease rather than an acquired lesion, which served only as a comparison. In encephalitis, the left-sided damage extended into the amygdala.
      fr: L’atteinte unilatérale produisait seulement des déficits légers, souvent infracliniques; dans une autre série de 20 lésions temporales unilatérales, un seul patient montrait même une atteinte sémantique réceptive légère. Une perte sévère touchant toutes les catégories est documentée surtout dans la démence sémantique, maladie évolutive plutôt que lésion acquise, qui servait seulement de comparaison. Dans l’encéphalite, l’atteinte gauche s’étendait à l’amygdale.
    mapping_note:
      en: Both temporal poles are coarse landmarks for the anterior temporal region. They do not delineate the antero-medial encephalitis damage or the extent of individual resections.
      fr: Les deux pôles temporaux sont des repères grossiers de la région temporale antérieure. Ils ne délimitent ni l’atteinte antéro-médiale de l’encéphalite ni l’étendue de chaque résection.
