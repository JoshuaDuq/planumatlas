  - id: fregoli-connectivity
    deficit: fregoli-syndrome
    title: {en: Broader delusional-misidentification connectivity, fr: Connectivité plus générale des fausses identifications délirantes}
    network: {en: Normative familiarity and belief-evaluation connections, fr: Connexions normatives de familiarité et d’évaluation des croyances}
    laterality: bilateral
    finding:
      en: In 17 published lesion-induced misidentification cases, all lesion sites were functionally connected to left retrosplenial cortex and 16 to right frontal cortex using normative connectivity. These connected regions were related to familiarity and expectation violation in functional-imaging meta-analyses.
      fr: Dans 17 cas publiés de fausse identification après lésion, tous les sites lésionnels étaient fonctionnellement connectés au cortex rétrosplénial gauche et 16 au cortex frontal droit selon la connectivité normative. Ces régions connectées étaient liées à la familiarité et à la violation des attentes dans des méta-analyses d’imagerie fonctionnelle.
    limitation:
      en: Mixed misidentification syndromes rather than a Fregoli-only sample; connectivity and task meta-analyses do not measure injury at these remote nodes in each patient. The direct stroke study is more specific to Fregoli but does not independently validate this network model.
      fr: L’échantillon comprenait divers syndromes de fausse identification plutôt que seulement Frégoli; la connectivité et les méta-analyses de tâches ne mesurent pas une lésion de ces nœuds distants chez chaque patient. L’étude directe après AVC est plus spécifique à Frégoli sans valider indépendamment ce modèle de réseau.
    mapping_note:
      en: No parcel is coloured from normative connectivity or healthy task activation. The separate stroke finding supplies an observed-injury landmark without turning the connected retrosplenial or frontal nodes into lesion sites.
      fr: Aucune parcelle n’est colorée à partir de la connectivité normative ou de l’activation de sujets sains. Le résultat distinct après AVC fournit un repère de lésion observée sans transformer les nœuds rétrospléniaux ou frontaux connectés en sites lésionnels.
    mappings: []
    evidence:
      - {reference: darby-2017, role: supporting}
      - {reference: kakegawa-2020, role: qualifying}

  - id: acquired-anxiety-temporal-limbic
    deficit: acquired-anxiety
    title: {en: Temporal-limbic lesions and observed anxiety, fr: Lésions temporolimbiques et anxiété observée}
    network: {en: Temporal and limbic regions, fr: Régions temporales et limbiques}
    laterality: bilateral
    finding:
      en: In 182 veterans, higher observer-rated anxiety was associated with predominantly left temporal-limbic lesions, including hippocampal injury, and a small right temporal cluster after correction for multiple comparisons. Informant ratings showed overlapping left-sided associations. An independent 26-patient stroke cohort associated right superior and middle temporal injury with anxiety at one month.
      fr: Chez 182 anciens combattants, une anxiété évaluée par observateur plus élevée était associée surtout à des lésions temporolimbiques gauches, dont l’hippocampe, et à un petit foyer temporal droit après correction des comparaisons multiples. Les évaluations par les proches montraient des associations gauches communes. Une cohorte indépendante de 26 patients après AVC associait les lésions temporales supérieures et moyennes droites à l’anxiété à un mois.
    limitation:
      en: No lesion association appeared for self-reported anxiety in the veterans. Their overall anxiety did not differ from controls; the affected-region versus control comparison was only a trend (p=.059). Veterans with lesions in the associated regions had greater brain-volume loss than those with lesions elsewhere. Ku was reviewed in abstract, limiting assessment of its methods. These findings do not establish new onset or a universal anxiety localization.
      fr: Aucune association lésionnelle n’apparaissait pour l’anxiété autoévaluée chez les anciens combattants. Leur anxiété globale ne différait pas des témoins; la comparaison du groupe avec régions atteintes aux témoins n’était qu’une tendance (p=0,059). Les anciens combattants avec lésions dans les régions associées avaient une perte de volume cérébral plus importante que ceux avec lésions ailleurs. Seul le résumé de Ku a été examiné, limitant l’évaluation des méthodes. Ces résultats n’établissent ni une apparition nouvelle ni une localisation universelle de l’anxiété.
    mapping_note:
      en: Left hippocampus and both middle temporal gyri mark parts of the reported injured regions. These parcels neither reconstruct the lesions nor identify every significant region.
      fr: L’hippocampe gauche et les deux gyri temporaux moyens repèrent des parties des régions lésées rapportées. Ces parcelles ne reconstruisent pas les lésions et n’identifient pas toutes les régions significatives.
    mappings:
      - {region: 'aseg:left:17', source_name: Left-Hippocampus}
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
      - {region: 'destrieux:right:38', source_name: G_temporal_middle}
    evidence:
      - {reference: knutson-2013, role: supporting}
      - {reference: ku-2013, role: supporting}

  - id: acquired-anxiety-thalamic
    deficit: acquired-anxiety
    title: {en: Anxiety after focal thalamic infarction, fr: Anxiété après infarctus thalamique focal}
    network: {en: Thalamic regions, fr: Régions thalamiques}
    laterality: bilateral
    finding:
      en: In a prospective 37-patient cohort, four of five anterior thalamic stroke patients met the HADS anxiety screening threshold at one month. Corrected lesion mapping associated anxiety with left thalamic injury covering ventral lateral and ventral medial nuclei. In a separate 68-patient cohort with past thalamic stroke, the 11 infarctions involving the posterior thalamus were associated with more emotional disturbance and anxiety than more anterior lesions; the authors proposed damage to connections of the medial pulvinar.
      fr: Dans une cohorte prospective de 37 patients, quatre des cinq patients avec AVC thalamique antérieur atteignaient le seuil de dépistage de l’anxiété de la HADS à un mois. La cartographie lésionnelle corrigée associait l’anxiété à une atteinte thalamique gauche couvrant les noyaux ventral latéral et ventral médial. Dans une cohorte distincte de 68 patients avec antécédent d’AVC thalamique, les 11 infarctus touchant le thalamus postérieur étaient associés à davantage de perturbations émotionnelles et d’anxiété que les lésions plus antérieures; les auteurs proposaient une atteinte des connexions du pulvinar médian.
    limitation:
      en: The prospective anterior subgroup was very small and most strokes were left-sided; prestroke anxiety was not formally measured. The thalamic cohort did not differ overall from TIA controls and showed no effect of lesion side; Liebermann’s results were read in the abstract and its methods only in a partial author copy. Different lesion definitions, timing and analyses limit comparison; a screening score does not establish an anxiety diagnosis or direct causation.
      fr: Le sous-groupe antérieur prospectif était très petit et la plupart des AVC étaient gauches; l’anxiété avant AVC n’était pas mesurée formellement. La cohorte thalamique ne différait pas globalement des témoins avec AIT et ne montrait pas d’effet du côté lésé; les résultats de Liebermann ont été lus dans le résumé et ses méthodes seulement dans une copie partielle des auteurs. Les définitions lésionnelles, délais et analyses différents limitent la comparaison; un score de dépistage n’établit ni un diagnostic anxieux ni une causalité directe.
    mapping_note:
      en: The whole left thalamus is a coarse landmark for Scharf’s corrected lesion result; it does not represent the complete lesion or a sufficient anxiety site. The anterior nuclear group is not substituted for the ventral nuclei reported by Scharf. Liebermann’s reviewed text gives no side for the posterior result and offers the medial pulvinar only as a proposed mechanism, so no pulvinar parcel is coloured.
      fr: Le thalamus gauche entier est un repère grossier du résultat lésionnel corrigé de Scharf; il ne représente ni la lésion complète ni un site suffisant de l’anxiété. Le groupe nucléaire antérieur ne remplace pas les noyaux ventraux rapportés par Scharf. Le texte examiné de Liebermann n’indique aucun côté pour le résultat postérieur et ne propose le pulvinar médian que comme mécanisme; aucune parcelle du pulvinar n’est donc colorée.
    mappings:
      - {region: 'aseg:left:10', source_name: Left-Thalamus-Proper}
    evidence:
      - {reference: scharf-2023, role: supporting}
      - {reference: liebermann-2013, role: supporting}

  - id: reduplicative-right-mca-case
    deficit: reduplicative-paramnesia
    title: {en: Hospital misidentified as home after right stroke, fr: Hôpital identifié comme domicile après AVC droit}
    network: {en: Observed right middle cerebral artery injury, fr: Lésion observée dans le territoire sylvien droit}
    laterality: right
    finding:
      en: After right middle cerebral artery infarction, a woman insisted that the hospital was her home in another city despite counterevidence, and pointed out where her kitchen, bathroom, living room and front door were. Diffusion-weighted imaging documented injury including the right precentral and supramarginal gyri, inferior frontal gyrus and insula, and to a lesser extent the internal capsule and lentiform nucleus. Nearly two months later she recognized hospitalization but still reported the wrong city.
      fr: Après un infarctus sylvien droit, une femme affirmait que l’hôpital était son domicile dans une autre ville malgré les preuves contraires, et indiquait où se trouvaient sa cuisine, sa salle de bains, son salon et sa porte d’entrée. L’imagerie de diffusion documentait une atteinte comprenant les gyri précentral et supramarginal droits, le gyrus frontal inférieur et l’insula, et dans une moindre mesure la capsule interne et le noyau lenticulaire. Près de deux mois plus tard, elle reconnaissait l’hospitalisation mais indiquait encore la mauvaise ville.
    limitation:
      en: One patient with a large infarct and several coexisting deficits. The case documents injured anatomy associated with the phenotype; it cannot isolate which region caused the spatial delusion or establish a necessary or sufficient site.
      fr: Une patiente avec un infarctus étendu et plusieurs troubles coexistants. Le cas documente l’anatomie lésée associée au phénotype; il ne peut isoler la région responsable du délire spatial ni établir un site nécessaire ou suffisant.
    mapping_note:
      en: The precentral and supramarginal parcels are selected explicitly named injured gyri in this case’s diffusion-imaging caption. Whole gyri exceed the affected tissue and display neither the full infarct nor selective localization of reduplicative paramnesia. The inferior frontal gyrus and insula are not coloured because the report does not specify which of their atlas subdivisions were injured; the less affected internal capsule and lentiform nucleus are also omitted.
      fr: Les parcelles précentrale et supramarginale sont des gyri lésés sélectionnés et explicitement nommés dans la légende d’imagerie de diffusion de ce cas. Les gyri entiers dépassent le tissu atteint et ne montrent ni l’infarctus complet ni une localisation sélective de la paramnésie réduplicative. Le gyrus frontal inférieur et l’insula ne sont pas colorés, car le rapport ne précise pas lesquelles de leurs subdivisions de l’atlas étaient atteintes; la capsule interne et le noyau lenticulaire, moins atteints, sont aussi omis.
    mappings:
      - {region: 'destrieux:right:29', source_name: G_precentral}
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
    evidence:
      - {reference: carlisle-2021, role: supporting}
      - {reference: diamantaras-2023, role: qualifying}

  - id: reduplicative-right-dlpfc
    deficit: reduplicative-paramnesia
    title: {en: Controlled focal-lesion comparison, fr: Comparaison contrôlée de lésions focales}
    network: {en: Right dorsolateral prefrontal cortex, fr: Cortex préfrontal dorsolatéral droit}
    laterality: right
    finding:
      en: In 11 cases, direct lesions overlapped right dorsolateral prefrontal cortex in seven patients. A voxelwise comparison with 11 spatial-disorientation controls identified a right prefrontal association near BA46. Moderate-to-severe executive impairment was more frequent in tested cases than controls; memory and visuospatial impairments were common in both groups.
      fr: Chez 11 cas, les lésions directes se chevauchaient dans le cortex préfrontal dorsolatéral droit chez sept patients. Une comparaison voxelique avec 11 témoins ayant une désorientation spatiale identifiait une association préfrontale droite près de BA46. Une atteinte exécutive modérée à sévère était plus fréquente chez les cas testés que chez les témoins; les troubles mnésiques et visuospatiaux étaient fréquents dans les deux groupes.
    limitation:
      en: Small sample selected from clinical records, with mixed etiologies and differing histories of prolonged unconsciousness. The acute-stroke study instead found spared dorsal frontoparietal tissue predictive. Different designs, phenotypes and etiologies limit comparison; these findings do not establish a replicated frontal lesion or a necessary site.
      fr: Petit échantillon sélectionné à partir de dossiers cliniques, d’étiologies diverses, avec des antécédents différents de perte de conscience prolongée. L’étude après AVC aigu trouvait plutôt le tissu frontopariétal dorsal préservé prédictif. Les différences de plans, de phénotypes et d’étiologies limitent la comparaison; ces résultats n’établissent ni une lésion frontale répliquée ni un site nécessaire.
    mapping_note:
      en: The direct DLPFC result reports BA46 and MNI coordinates without naming an atlas gyrus; it remains unmapped rather than assuming equivalence to middle frontal gyrus. Connected insular/cingulate regions are not coloured. The anterior temporal overlap was not specific to cases in the direct comparison and is omitted.
      fr: Le résultat préfrontal dorsolatéral direct indique BA46 et des coordonnées MNI sans nommer un gyrus de l’atlas; il reste sans carte plutôt que de supposer une équivalence avec le gyrus frontal moyen. Les régions insulaires/cingulaires connectées ne sont pas colorées. Le chevauchement temporal antérieur n’était pas spécifique aux cas dans la comparaison directe et est omis.
    mappings: []
    evidence:
      - {reference: diamantaras-2023, role: supporting}
      - {reference: alves-2021, role: qualifying}

  - id: reduplicative-stroke-disconnection
    deficit: reduplicative-paramnesia
    title: {en: Spatial delusions in acute right stroke, fr: Délires spatiaux après AVC droit aigu}
    network: {en: Estimated right frontothalamic and occipitotemporal disconnection, fr: Déconnexion frontothalamique et occipitotemporale droite estimée}
    laterality: right
    finding:
      en: In the prospective stroke study, structural disconnection along two distinct right-hemisphere streams, one frontothalamic and one occipitotemporal, was the strongest predictor of spatial delusions. Sparing of dorsal right frontoparietal tissue, age and anosognosia also independently predicted the syndrome. The expanded clinical subanalysis documented persistent beliefs of mislocation, duplication or place fusion after systematic presentation of counterevidence.
      fr: Dans l’étude prospective après AVC, la déconnexion structurelle le long de deux voies distinctes de l’hémisphère droit, l’une frontothalamique et l’autre occipitotemporale, était le meilleur prédicteur des délires spatiaux. La préservation du tissu frontopariétal dorsal droit, l’âge et l’anosognosie prédisaient aussi indépendamment le syndrome. La sous-analyse clinique élargie documentait des croyances persistantes de fausse localisation, de duplication ou de fusion des lieux après présentation systématique de preuves contraires.
    limitation:
      en: Disconnection and remote network estimates do not demonstrate injury at every implicated node. The 2023 clinical study partly reused the 2021 cohort; these reports are not independent replication. Their selected acute-stroke sample differs from the mixed focal-lesion study showing DLPFC injury, limiting a unified anatomical claim.
      fr: Les estimations de déconnexion et de réseau distant ne démontrent pas une lésion de chaque nœud impliqué. L’étude clinique de 2023 réutilisait une partie de la cohorte de 2021; ces rapports ne constituent pas des réplications indépendantes. Leur échantillon sélectionné après AVC aigu diffère de l’étude de lésions focales mixtes montrant une atteinte préfrontale dorsolatérale, ce qui limite une conclusion anatomique commune.
    mapping_note:
      en: No parcel is coloured from spared tissue, structural disconnection or normative functional connectivity. The separate stroke case supplies explicitly named observed-injury landmarks.
      fr: Aucune parcelle n’est colorée à partir du tissu préservé, de la déconnexion structurelle ou de la connectivité fonctionnelle normative. Le cas distinct d’AVC fournit des repères lésionnels observés et explicitement nommés.
    mappings: []
    evidence:
      - {reference: alves-2021, role: supporting}
      - {reference: alves-2023, role: supporting}
      - {reference: diamantaras-2023, role: qualifying}

  - id: working-memory-frontal-manipulation
    deficit: working-memory
    title: {en: Reordering letters and numbers after frontal injury, fr: Réorganisation de lettres et de chiffres après lésion frontale}
    network: {en: Left dorsolateral prefrontal contributions to manipulation, fr: Contributions préfrontales dorsolatérales gauches à la manipulation}
    laterality: left
    finding:
      en: Seven veterans with focal left dorsolateral prefrontal lesions performed worse than healthy controls on Letter–Number Sequencing, which requires recalling digits in numerical order followed by letters alphabetically. Forward spans, monitoring and N-back performance showed no reliable deficits in the focal prefrontal groups.
      fr: Sept vétérans avec lésions préfrontales dorsolatérales gauches focales réussissaient moins bien que les témoins sains l’épreuve de séquences lettres–chiffres, qui demande de rappeler les chiffres par ordre numérique puis les lettres par ordre alphabétique. Les empans directs, le suivi et les performances N-back ne montraient pas de déficit fiable dans les groupes préfrontaux focaux.
    limitation:
      en: Small focal subgroups and multiple task comparisons limit inference, and no multiple-comparison correction was reported. The Letter–Number Sequencing group effect was p=.05, the left group differed from healthy controls but not from the other prefrontal cases, and the spatial-backward result was only a trend. The cohort comes from the same Vietnam Head Injury Study registry as Koenigs’s parietal study and the catalogued intelligence study. Koenigs’s discussion stated, without presenting the analysis, that 21 veterans with dorsolateral prefrontal lesions had no significant working-memory impairment; these reports are not independent replications. Right-sided deficits concerned reasoning tasks.
      fr: Les petits sous-groupes focaux et les comparaisons entre plusieurs tâches limitent l’interprétation, et aucune correction pour comparaisons multiples n’était rapportée. L’effet de groupe en séquences lettres–chiffres était p=0,05, le groupe gauche différait des témoins sains mais pas des autres cas préfrontaux, et le résultat spatial inverse n’était qu’une tendance. La cohorte provient du même registre de la Vietnam Head Injury Study que l’étude pariétale de Koenigs et l’étude d’intelligence déjà répertoriée. La discussion de Koenigs indiquait, sans présenter l’analyse, que 21 vétérans avec lésions préfrontales dorsolatérales n’avaient pas de déficit significatif de mémoire de travail; ces rapports ne sont pas des réplications indépendantes. Les déficits droits concernaient le raisonnement.
    mapping_note:
      en: The study reports dorsolateral prefrontal BA 9/46, with greatest overlap in BA 9, without identifying a specific human frontal gyrus. No parcel is selected. Atlas-based descriptions of adjacent white-matter pathways do not establish selective injury to individual tracts.
      fr: L’étude rapporte les aires préfrontales dorsolatérales 9/46, avec chevauchement maximal dans l’aire 9, sans identifier de gyrus frontal humain précis. Aucune parcelle n’est sélectionnée. Les descriptions des voies de substance blanche adjacentes fondées sur des atlas n’établissent pas de lésion sélective de faisceaux individuels.
    mappings: []
    evidence:
      - {reference: barbey-2013-working-memory, role: supporting}
      - {reference: baier-2010-working-memory, role: qualifying}
      - {reference: koenigs-2009, role: qualifying}

  - id: working-memory-distractor-filtering
    deficit: working-memory
    title: {en: Filtering simultaneous visual distractors, fr: Filtrage de distracteurs visuels simultanés}
    network: {en: Left putamen and adjacent white matter, fr: Putamen gauche et substance blanche adjacente}
    laterality: left
    finding:
      en: In the acute stroke cohort, damage to the left putamen and adjacent white matter was associated with a larger distractor cost after false-discovery-rate correction. Patients remembered three red-dot locations either alone or alongside two irrelevant yellow dots; the outcome was the change in hits minus false alarms.
      fr: Dans la cohorte d’AVC aigus, l’atteinte du putamen gauche et de la substance blanche adjacente était associée à un coût accru des distracteurs après correction du taux de fausses découvertes. Les patients mémorisaient trois positions de points rouges, seuls ou accompagnés de deux points jaunes non pertinents; la mesure était la variation des réponses correctes moins les fausses alarmes.
    limitation:
      en: The retention finding below comes from the same 61 patients, not an independent cohort. Post hoc regional subgroups differed in lesion volume, and structural lesions cannot exclude distant functional effects. This visual filtering contrast differs from the letter–number manipulation task and does not establish a universal left-sided filter.
      fr: Le résultat de maintien ci-dessous provient des mêmes 61 patients, et non d’une cohorte indépendante. Les sous-groupes régionaux définis a posteriori différaient par le volume lésionnel et les lésions structurelles n’excluent pas des effets fonctionnels à distance. Ce contraste de filtrage visuel diffère de la manipulation de lettres et de chiffres et n’établit pas de filtre universellement gauche.
    mapping_note:
      en: The whole left putamen is a coarse landmark for the reported association. It neither reproduces the lesion cluster nor represents the adjacent white-matter contribution; no individual tract is inferred.
      fr: Le putamen gauche entier est un repère grossier de l’association rapportée. Il ne reproduit pas l’amas lésionnel et ne représente pas la contribution de la substance blanche adjacente; aucun faisceau individuel n’est déduit.
    mappings:
      - {region: 'aseg:left:12', source_name: Left-Putamen}
    evidence:
      - {reference: baier-2010-working-memory, role: supporting}
      - {reference: barbey-2013-working-memory, role: qualifying}

  - id: working-memory-load-sensitive-retention
    deficit: working-memory
    title: {en: Retaining more visual locations without distractors, fr: Maintien d’un nombre accru de positions visuelles sans distracteurs}
    network: {en: Right frontal–insular and caudate contributions to retention, fr: Contributions fronto-insulaires et caudées droites au maintien}
    laterality: right
    finding:
      en: In the same stroke cohort, a larger accuracy cost when memory load increased from three to five target locations without distractors was associated with right frontal white matter, inferior frontal gyrus, caudate head and insular damage after false-discovery-rate correction. Excluding patients with neglect or extinction did not change the anatomical result.
      fr: Dans la même cohorte d’AVC, une baisse accrue de l’exactitude lorsque la charge mnésique passait de trois à cinq positions cibles sans distracteurs était associée à l’atteinte de la substance blanche frontale, du gyrus frontal inférieur, de la tête du caudé et de l’insula droits après correction du taux de fausses découvertes. L’exclusion des patients avec négligence ou extinction ne modifiait pas le résultat anatomique.
    limitation:
      en: These are the same 61 acute stroke patients as in the filtering finding. The prefrontal lesions mainly affected subgyral white matter, regional coverage favoured inferior frontal and insular sites, and post hoc subgroups differed in lesion volume. Retention of visual locations differs from the manipulation tasks used in the prefrontal veteran study; the results do not isolate a single cortical storage site.
      fr: Il s’agit des mêmes 61 patients après AVC aigu que pour le filtrage. Les lésions préfrontales touchaient surtout la substance blanche sous-gyrale, la couverture régionale favorisait les sites frontaux inférieurs et insulaires et les sous-groupes définis a posteriori différaient par le volume lésionnel. Le maintien de positions visuelles diffère des tâches de manipulation de l’étude préfrontale chez les vétérans; ces résultats n’isolent pas un site cortical unique de stockage.
    mapping_note:
      en: The whole right caudate and whole right insula are coarse landmarks for the reported caudate-head and insular associations. The paper does not specify an inferior-frontal subdivision, so none is selected. Frontal white matter is not represented, and these parcels do not reconstruct the significant clusters.
      fr: Le caudé droit entier et l’insula droite entière sont des repères grossiers des associations rapportées à la tête du caudé et à l’insula. L’article ne précise pas de subdivision frontale inférieure; aucune n’est donc sélectionnée. La substance blanche frontale n’est pas représentée et ces parcelles ne reconstruisent pas les amas significatifs.
    mappings:
      - {region: 'aseg:right:50', source_name: Right-Caudate}
      - {region: 'nextbrain:right:12035', source_name: insula}
    evidence:
      - {reference: baier-2010-working-memory, role: supporting}
      - {reference: barbey-2013-working-memory, role: qualifying}

  - id: amnesia-basal-forebrain
    deficit: amnesia
    title: {en: Basal-forebrain injury and memory impairment, fr: Atteinte du prosencéphale basal et trouble mnésique}
    network: {en: Septal–diagonal-band and nearby memory pathways, fr: Région septale et bande diagonale et voies mnésiques voisines}
    laterality: bilateral
    finding:
      en: One patient developed predominantly anterograde amnesia after aneurysm clipping, with injury centred on the right diagonal band and patchy contralateral basal-forebrain damage. A separate ten-patient postoperative series found infarcts across several regions of the subcallosal-artery territory, including the fornix columns in every patient.
      fr: Un patient développait une amnésie surtout antérograde après clippage d’anévrisme, avec lésion centrée sur la bande diagonale droite et atteinte du prosencéphale basal controlatéral en plages. Une série postopératoire distincte de dix patients trouvait des infarctus de plusieurs régions du territoire de l’artère sous-calleuse, comprenant les colonnes du fornix chez chaque patient.
    limitation:
      en: The single case had additional septal/hypothalamic injury and an earlier left external-capsule hemorrhage. The series selected only amnesic patients without a non-amnesic control group; neighboring fornix injury prevents an isolated diagonal-band explanation. Neither study establishes a necessary nucleus or a specific neurotransmitter mechanism.
      fr: Le cas unique avait d’autres atteintes septales/hypothalamiques et une hémorragie antérieure de la capsule externe gauche. La série ne sélectionnait que des patients amnésiques sans groupe témoin non amnésique; l’atteinte voisine du fornix empêche une explication limitée à la bande diagonale. Aucune étude n’établit de noyau nécessaire ni de mécanisme neurotransmetteur précis.
    mapping_note:
      en: The whole right diagonal band is an orientation landmark for the case’s reported lesion centre, not a registered lesion mask. Bilateral laterality acknowledges accompanying left injury, which is not precisely mapped. The minimally affected nucleus basalis is not coloured. In the series, the diagonal band was infarcted in five of ten patients.
      fr: La bande diagonale droite entière sert de repère au centre lésionnel rapporté du cas, et non de masque lésionnel recalé. La latéralité bilatérale tient compte de l’atteinte gauche associée, qui n’est pas cartographiée précisément. Le noyau basal, peu atteint, n’est pas coloré. Dans la série, la bande diagonale était infarcie chez cinq des dix patients.
    mappings:
      - {region: 'nextbrain:right:10111', source_name: diagonal_band}
    evidence:
      - {reference: abe-1998, role: supporting}
      - {reference: mugikura-2014, role: qualifying}

  - id: semantic-controlled-retrieval
    deficit: semantic-memory
    title: {en: Controlled retrieval after left-hemisphere stroke, fr: Récupération contrôlée après AVC hémisphérique gauche}
    network: {en: Frontal and posterior semantic-control systems, fr: Systèmes frontaux et postérieurs de contrôle sémantique}
    laterality: left
    finding:
      en: Patients with semantic aphasia had difficulty selecting context-relevant meaning across verbal and nonverbal tasks. In a 23-patient series, 16 had some opercular inferior frontal injury. A separate comparison found retrieval-control difficulties in both prefrontal and temporoparietal groups, including eight patients whose prefrontal cortex was spared.
      fr: Les patients avec aphasie sémantique avaient du mal à sélectionner le sens pertinent au contexte dans des tâches verbales et non verbales. Dans une série de 23 patients, 16 présentaient au moins une atteinte partielle de la partie operculaire du gyrus frontal inférieur. Une comparaison distincte trouvait des difficultés de contrôle de la récupération dans les groupes préfrontal et temporopariétal, dont huit patients avec cortex préfrontal préservé.
    limitation:
      en: Selected chronic cases do not establish that knowledge is wholly intact or that every semantic impairment reflects poor control. The studies share investigators and reuse earlier cases; independence is not established. The 23-patient study’s symptom composite was not specific to semantic control, and its t>2.6 symptom maps are not used for colouring.
      fr: Des cas chroniques sélectionnés n’établissent ni une intégrité complète des connaissances ni que tout trouble sémantique relève d’un mauvais contrôle. Les études partagent des chercheurs et réutilisent des cas antérieurs; leur indépendance n’est pas établie. Le score composite de l’étude de 23 patients n’était pas propre au contrôle sémantique et ses cartes de symptômes à t>2,6 ne servent pas à la coloration.
    mapping_note:
      en: The whole left opercular inferior frontal parcel is a descriptive landmark for a commonly injured region in the 23-patient cohort, not a control-specific or necessary centre. Posterior cases show that frontal injury is not required. In the exploratory maps, clusters for poorer semantic scores included anterior inferior frontal cortex, whereas posterior inferior frontal clusters were associated with a nonverbal executive test. Normative disconnection nodes and exploratory symptom clusters are not coloured.
      fr: La parcelle frontale inférieure operculaire gauche entière est un repère descriptif d’une région fréquemment lésée dans la cohorte de 23 patients, et non un centre propre au contrôle ou nécessaire. Les cas postérieurs montrent que l’atteinte frontale n’est pas obligatoire. Dans les cartes exploratoires, les amas associés aux scores sémantiques faibles comprenaient le cortex frontal inférieur antérieur, tandis que les amas frontaux inférieurs postérieurs étaient associés à une épreuve exécutive non verbale. Les nœuds de déconnexion normative et les amas exploratoires de symptômes ne sont pas colorés.
