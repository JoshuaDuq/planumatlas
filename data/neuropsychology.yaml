      fr: [discrimination des images en miroir, agnosie pour les stimuli en miroir, discrimination des objets réfléchis, confusion entre images réfléchies, erreurs de réflexion]

  - id: emotional-facial-paresis
    name: {en: Emotional facial paresis, fr: Parésie faciale émotionnelle}
    domain: {en: Producing spontaneous emotional facial movement, fr: Production de mouvements faciaux émotionnels spontanés}
    group: sensorimotor
    summary:
      en: Weak or asymmetric facial activation during spontaneous emotional expression despite preserved movement on command. This acquired motor dissociation is different from difficulty recognizing emotions, reduced emotional experience or weakness during every type of facial movement.
      fr: Activation faciale faible ou asymétrique lors d’une expression émotionnelle spontanée malgré des mouvements sur commande préservés. Cette dissociation motrice acquise diffère d’un trouble de reconnaissance des émotions, d’une réduction du vécu émotionnel ou d’une faiblesse pour tous les mouvements faciaux.
