  - id: olfactory-identification-orbital
    deficit: olfactory-recognition
    title: {en: Identifying familiar smells, fr: Identification des odeurs familières}
    network: {en: Orbitofrontal olfactory recognition system, fr: Système orbitofrontal de reconnaissance olfactive}
    laterality: bilateral
    finding:
      en: Odour identification was impaired after temporal excision or frontal excision involving orbital cortex. Detection thresholds remained normal in all patient groups.
      fr: L’identification des odeurs était altérée après exérèse temporale ou frontale impliquant le cortex orbital. Les seuils de détection restaient normaux dans tous les groupes de patients.
    limitation:
      en: Surgical groups and an identification task do not establish a universal smell-loss map. This is not evidence of complete anosmia.
      fr: Les groupes chirurgicaux et une tâche d’identification n’établissent pas une carte universelle de la perte olfactive. Ces résultats ne démontrent pas une anosmie complète.
    mapping_note:
      en: Orbital gyri mark the frontal finding only. Temporal removals also caused impairment; their extent is not mapped from the abstract. Patients had unilateral excisions.
      fr: Les gyri orbitaux représentent seulement le constat frontal. Les exérèses temporales entraînaient aussi un trouble; leur étendue n’est pas cartographiée à partir du résumé. Les exérèses étaient unilatérales.
    mappings:
