  - id: amusia-network
    deficit: amusia
    title: {en: A music-processing network distinct from language, fr: Un réseau de traitement musical distinct du langage}
    network: {en: Distributed music network centred on right superior temporal cortex, fr: Réseau musical distribué centré sur le cortex temporal supérieur droit}
    laterality: bilateral
    finding:
      en: Heterogeneous lesions in 24 published cases shared functional connections. In the 97-patient stroke sample, the amusia-associated network centred on right superior temporal cortex and differed from the aphasia-associated network after accounting for their co-occurrence.
      fr: Les lésions hétérogènes de 24 cas publiés partageaient des connexions fonctionnelles. Dans l’échantillon de 97 patients avec AVC, le réseau associé à l’amusie était centré sur le cortex temporal supérieur droit et différait du réseau associé à l’aphasie après prise en compte de leur coexistence.
    limitation:
      en: The stroke sample validated the case-derived network using selected music-perception tests; it does not cover all musical skills. The 2016 and 2024 reports draw from Helsinki/Turku recruitment cohorts in the same periods, so their 77 and 97 patients should not be summed as independent samples.
      fr: L’échantillon d’AVC validait le réseau dérivé des cas avec des tests sélectionnés de perception musicale; il ne couvre pas toutes les capacités musicales. Les rapports de 2016 et 2024 proviennent de cohortes recrutées à Helsinki/Turku aux mêmes périodes; leurs 77 et 97 patients ne doivent donc pas être additionnés comme échantillons indépendants.
    mapping_note:
      en: No parcel is selected for this connectivity finding. A right temporal network peak is not evidence that this cortex was directly injured in every case. Lesions occurred in both hemispheres; the separate stroke lesion-mapping finding supplies the selected temporal landmarks.
      fr: Aucune parcelle n’est sélectionnée pour ce constat de connectivité. Un pic de réseau temporal droit ne prouve pas que ce cortex était directement lésé dans chaque cas. Les lésions survenaient dans les deux hémisphères; le constat distinct de cartographie lésionnelle après AVC fournit les repères temporaux sélectionnés.
    mappings: []
    evidence:
      - {reference: sihvonen-2024, role: supporting}

  - id: simultanagnosia-posterior
    deficit: simultanagnosia
    title: {en: Posterior visual attention and disconnection, fr: Attention visuelle postérieure et déconnexion}
    network: {en: Bilateral parieto-occipital attention network, fr: Réseau attentionnel pariéto-occipital bilatéral}
    laterality: bilateral
