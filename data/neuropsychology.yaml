      - {reference: koenigs-2009, role: qualifying}

  - id: interval-timing-inferior-frontal
    deficit: interval-timing
    title: {en: Variable judgments of short and longer intervals, fr: Jugements variables d’intervalles courts et plus longs}
    network: {en: Right frontal contributions to duration discrimination, fr: Contributions frontales droites à la discrimination des durées}
    laterality: right
    finding:
      en: In a 47-patient lesion study, right inferior frontal BA 44 damage was associated with increased variability of duration judgments at both 600 and 2,000 ms after false-discovery-rate correction. The voxelwise analysis found no significant associations for the average-duration accuracy measure.
      fr: Dans une étude lésionnelle de 47 patients, l’atteinte frontale inférieure droite BA 44 était associée à une variabilité accrue des jugements de durée à 600 et 2 000 ms après correction du taux de fausses découvertes. L’analyse voxel par voxel ne trouvait pas d’association significative pour la mesure d’exactitude de la durée moyenne.
    limitation:
      en: Comparing durations also requires attention, memory and decisions; this is not evidence of a single internal clock. Six very poor performers required assigned extreme scores because their psychometric curves could not be estimated. Lesion coverage was uneven.
      fr: Comparer des durées sollicite aussi l’attention, la mémoire et les décisions; cela ne démontre pas une horloge interne unique. Six participants très déficitaires ont reçu des scores extrêmes attribués car leurs courbes psychométriques ne pouvaient pas être estimées. La couverture lésionnelle était inégale.
    mapping_note:
      en: The whole right opercular inferior frontal parcel is a coarse BA 44 landmark. It exceeds the significant voxels, does not reproduce their boundaries and omits other reported regions. The earlier auditory study supports a broader right frontoparietal contribution rather than this exact parcel.
      fr: La parcelle operculaire frontale inférieure droite entière est un repère grossier de BA 44. Elle dépasse les voxels significatifs, ne reproduit pas leurs limites et omet d’autres régions rapportées. L’étude auditive antérieure appuie une contribution frontopariétale droite plus large plutôt que cette parcelle précise.
    mappings:
      - {region: 'destrieux:right:12', source_name: G_front_inf-Opercular}
    evidence:
      - {reference: gooch-2011, role: supporting}
      - {reference: harrington-1998, role: qualifying}

  - id: interval-timing-middle-frontal
    deficit: interval-timing
    title: {en: A middle frontal finding at two seconds, fr: Un constat frontal moyen à deux secondes}
    network: {en: Duration-dependent frontal associations, fr: Associations frontales dépendant de la durée}
    laterality: right
    finding:
      en: The detailed results of the same study report an additional right middle frontal BA 9 association with judgment variability at 2,000 ms, comprising 73 significant voxels. That additional region is not listed in the 600 ms results.
      fr: Les résultats détaillés de la même étude rapportent une association supplémentaire de BA 9 frontale moyenne droite avec la variabilité des jugements à 2 000 ms, comprenant 73 voxels significatifs. Cette région supplémentaire ne figure pas dans les résultats à 600 ms.
    limitation:
      en: The abstract and discussion generalize frontal involvement more broadly than the duration-specific results. This finding follows those detailed results. It is not an independent cohort or proof of separate timing systems; the earlier auditory study tested shorter intervals with another method.
      fr: Le résumé et la discussion généralisent l’atteinte frontale plus largement que les résultats propres à chaque durée. Ce constat suit les résultats détaillés. Il ne s’agit ni d’une cohorte indépendante ni d’une preuve de systèmes temporels distincts; l’étude auditive antérieure testait des intervalles plus courts avec une autre méthode.
    mapping_note:
      en: The right middle frontal parcel marks the reported BA 9 region at 2,000 ms only. The parcel is much larger than the small significant cluster; no subsecond middle frontal association is inferred from the abstract.
      fr: La parcelle frontale moyenne droite repère la région BA 9 rapportée à 2 000 ms uniquement. La parcelle est bien plus grande que le petit amas significatif; aucune association frontale moyenne infraseconde n’est déduite du résumé.
    mappings:
      - {region: 'destrieux:right:15', source_name: G_front_middle}
    evidence:
      - {reference: gooch-2011, role: supporting}
      - {reference: harrington-1998, role: qualifying}

  - id: gesture-recognition-correctness
    deficit: gesture-recognition
    title: {en: Judging whether a familiar gesture is correct, fr: Juger si un geste familier est correct}
    network: {en: Frontal contributions to gesture judgments, fr: Contributions frontales aux jugements gestuels}
    laterality: left
    finding:
      en: In a study of 33 left- and eight right-brain-injured patients, impaired judgments of correct versus incorrect meaningful gestures correlated with left inferior frontal opercular and triangular damage. Recognition was more impaired in the limb-apraxic group.
      fr: Dans une étude de 33 patients avec lésion gauche et huit avec lésion droite, les jugements déficitaires de gestes significatifs corrects ou incorrects étaient corrélés aux lésions frontales inférieures gauches operculaires et triangulaires. La reconnaissance était plus altérée dans le groupe avec apraxie gestuelle.
    limitation:
      en: This does not establish a single necessary site for understanding actions. In a separate 43-patient stroke study, inferior frontal damage did not predict semantic or spatial gesture recognition after comprehension and lesion-volume controls. The tasks are related but different.
      fr: Cela n’établit pas un site unique nécessaire à la compréhension des actions. Dans une étude distincte de 43 patients après AVC, l’atteinte frontale inférieure ne prédisait pas la reconnaissance gestuelle sémantique ou spatiale après contrôle de la compréhension et du volume lésionnel. Les tâches sont apparentées mais différentes.
    mapping_note:
      en: Left opercular and triangular parcels mark the frontal subdivisions named in the first study. They are broad anatomical landmarks, not lesion masks, and do not transfer this result to all action-recognition tasks or equate recognition with execution.
      fr: Les parcelles operculaire et triangulaire gauches repèrent les subdivisions frontales nommées dans la première étude. Ce sont des repères anatomiques larges, pas des masques lésionnels; elles ne généralisent pas ce résultat à toute tâche de reconnaissance d’actions et n’assimilent pas reconnaissance et exécution.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
      - {region: 'destrieux:left:14', source_name: G_front_inf-Triangul}
    evidence:
      - {reference: pazzaglia-2008, role: supporting}
      - {reference: kalenine-2010, role: qualifying}

  - id: gesture-recognition-meaning
    deficit: gesture-recognition
    title: {en: Matching actions to their meanings, fr: Associer les actions à leur sens}
    network: {en: Posterior temporal action semantics, fr: Sémantique des actions temporale postérieure}
    laterality: left
    finding:
      en: In 43 left-stroke patients, posterior temporal damage predicted selecting the action matching a verb against a semantically related alternative, after controlling comprehension and lesion volume. Voxelwise results implicated posterior middle temporal cortex; the spatial task had a different parietal association.
      fr: Chez 43 patients après AVC gauche, l’atteinte temporale postérieure prédisait la sélection de l’action correspondant à un verbe face à une alternative sémantiquement apparentée, après contrôle de la compréhension et du volume lésionnel. Les résultats voxel par voxel impliquaient le cortex temporal moyen postérieur; la tâche spatiale avait une association pariétale différente.
    limitation:
      en: Word-to-video matching still samples a specific language-linked action task. The frontal correctness-judgment study used a different paradigm and lesion distribution. These findings support task-dependent associations rather than interchangeable measures of a unitary action-understanding faculty.
      fr: L’association mot-vidéo reste une tâche d’action précise liée au langage. L’étude frontale de jugement de correction utilisait un autre paradigme et une autre distribution lésionnelle. Ces résultats appuient des associations dépendantes de la tâche plutôt que des mesures interchangeables d’une faculté unique de compréhension des actions.
    mapping_note:
      en: The whole left middle temporal gyrus is a broad landmark for its reported posterior portion. No inferior parietal parcel is inferred from the spatial-task region model, and the temporal parcel is not a complete map of gesture recognition.
      fr: Le gyrus temporal moyen gauche entier est un repère large de sa portion postérieure rapportée. Aucune parcelle pariétale inférieure n’est déduite du modèle régional de la tâche spatiale et la parcelle temporale n’est pas une carte complète de la reconnaissance gestuelle.
    mappings:
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
    evidence:
      - {reference: kalenine-2010, role: supporting}
      - {reference: pazzaglia-2008, role: qualifying}

  - id: sustained-attention-vigilance
    deficit: sustained-attention
    title: {en: Declining target detection over time, fr: Déclin de la détection des cibles au fil du temps}
    network: {en: Distributed frontal and posterior attention systems, fr: Systèmes attentionnels frontaux et postérieurs distribués}
    laterality: right
    finding:
      en: Right frontal lesion patients were slower and missed more targets, with deterioration over time on a continuous-performance task. A separate posterior-lesion study also found increasing missed targets over time, especially at faster stimulus presentation rates.
      fr: Les patients avec lésion frontale droite étaient plus lents et omettaient davantage de cibles, avec dégradation au fil du temps sur une tâche de performance continue. Une étude distincte de lésions postérieures retrouvait aussi des omissions croissantes au fil du temps, surtout avec une présentation plus rapide des stimuli.
    limitation:
      en: A vigilance decrement is not specific to frontal injury, and slower responding alone does not demonstrate decline over time. Presentation rate and task content alter the observed impairment. The consulted abstracts do not specify sample sizes or sufficiently narrow lesion subdivisions.
      fr: Un déclin de vigilance n’est pas spécifique aux lésions frontales et un ralentissement seul ne démontre pas de déclin au fil du temps. La cadence de présentation et le contenu de la tâche modifient le déficit observé. Les résumés consultés ne précisent ni les effectifs ni des subdivisions lésionnelles assez étroites.
    mapping_note:
      en: No parcel is selected for broad frontal or posterior cortical categories. The separate spatial-vigilance finding supplies a more specific parietal landmark without assigning all forms of sustained attention to that region.
      fr: Aucune parcelle n’est sélectionnée pour les catégories corticales frontales ou postérieures larges. Le constat distinct de vigilance spatiale fournit un repère pariétal plus précis sans attribuer toutes les formes d’attention soutenue à cette région.
    mappings: []
    evidence:
      - {reference: rueckert-1996, role: supporting}
      - {reference: rueckert-1998, role: qualifying}
      - {reference: malhotra-2009, role: qualifying}

  - id: sustained-attention-spatial
    deficit: sustained-attention
    title: {en: Maintaining attention to spatial locations, fr: Maintenir l’attention envers des positions spatiales}
    network: {en: Right posterior parietal spatial vigilance, fr: Vigilance spatiale pariétale postérieure droite}
    laterality: right
    finding:
      en: In right-stroke patients with neglect, performance declined over time when attention had to be maintained on spatial locations, but not verbal material or difficulty-matched visual patterns. Lesioned voxels between the right intraparietal sulcus and inferior parietal lobe were associated with this spatial decrement.
      fr: Chez des patients après AVC droit avec négligence, les performances déclinaient lorsque l’attention devait être maintenue envers des positions spatiales, mais pas envers du matériel verbal ou des motifs visuels de difficulté comparable. Des voxels lésés entre le sillon intrapariétal droit et le lobe pariétal inférieur étaient associés à ce déclin spatial.
    limitation:
      en: The finding concerns spatial vigilance in a selected neglect population, not every form of concentration or every neglect patient. Frontal and broader posterior studies provide complementary task evidence; they do not independently replicate this exact spatial lesion result.
      fr: Ce constat concerne la vigilance spatiale dans une population sélectionnée avec négligence, pas toute forme de concentration ni tout patient négligent. Les études frontales et postérieures plus larges fournissent des données complémentaires de tâches; elles ne répliquent pas indépendamment ce résultat lésionnel spatial précis.
    mapping_note:
      en: The right intraparietal/transverse parietal sulcus parcel is a coarse landmark for the reported sulcal-to-inferior-parietal territory. It does not reproduce the voxelwise cluster, isolate a sulcal bank or imply that the entire parcel has a uniform attention function.
      fr: La parcelle droite des sillons intrapariétal et pariétal transverse est un repère grossier du territoire rapporté entre sillon et région pariétale inférieure. Elle ne reproduit pas l’amas voxel par voxel, n’isole pas une berge sulcale et n’implique pas de fonction attentionnelle uniforme dans toute la parcelle.
    mappings:
      - {region: 'destrieux:right:57', source_name: S_intrapariet_and_P_trans}
    evidence:
      - {reference: malhotra-2009, role: supporting}
      - {reference: rueckert-1996, role: qualifying}
      - {reference: rueckert-1998, role: qualifying}

  - id: astasia-thalamic
    deficit: astasia
    title: {en: Standing failure with preserved limb strength, fr: Échec de la station debout avec force des membres préservée}
    network: {en: Thalamic and distributed postural control, fr: Contrôle postural thalamique et distribué}
    laterality: right
    finding:
      en: A 15-patient series described inability to stand after unilateral thalamic-region injury despite good or near-normal strength. A separate patient had a discrete right posterolateral thalamic infarct with marked unsupported-stance instability.
      fr: Une série de 15 patients décrivait une incapacité à tenir debout après lésion unilatérale de la région thalamique malgré une force bonne ou presque normale. Une patiente distincte avait un infarctus thalamique postérolatéral droit circonscrit avec instabilité marquée de la station debout sans soutien.
    limitation:
      en: The series included variable sensory loss and different lesion causes; it does not establish a required thalamic nucleus. A later isolated astasia case had a right suprathalamic white-matter infarct with preserved sensation and limb coordination, so direct thalamic injury is not universal.
      fr: La série comprenait une perte sensitive variable et différentes causes lésionnelles; elle n’établit pas de noyau thalamique requis. Un cas ultérieur d’astasie isolée avait un infarctus de la substance blanche suprathalamique droite avec sensibilité et coordination des membres préservées; l’atteinte thalamique directe n’est donc pas universelle.
    mapping_note:
      en: The whole right thalamus marks the separate MRI-defined case, not all 15 lesions. It exceeds the posterolateral infarct and does not identify a nucleus. No cortex is coloured from the white-matter case’s proposed disconnection mechanism.
      fr: Le thalamus droit entier repère le cas distinct défini en IRM, pas les 15 lésions. Il dépasse l’infarctus postérolatéral et n’identifie pas de noyau. Aucun cortex n’est coloré à partir du mécanisme de déconnexion proposé pour le cas de substance blanche.
    mappings:
      - {region: 'aseg:right:49', source_name: Right-Thalamus-Proper}
    evidence:
      - {reference: masdeu-1988, role: supporting}
      - {reference: lee-astasia-2005, role: supporting}
      - {reference: takahashi-2017, role: qualifying}

  - id: visual-verticality-cortical
    deficit: visual-verticality
    title: {en: Cortical lesions and tilted visual vertical, fr: Lésions corticales et inclinaison de la verticale visuelle}
    network: {en: Cortical integration of graviceptive signals, fr: Intégration corticale des signaux graviceptifs}
    laterality: bilateral
    finding:
      en: In the 71-patient infarct study, pathological visual vertical tilts occurred in 23 of 52 middle cerebral artery infarcts, with overlap centred on posterior insula. A later 54-patient study associated tilts with insular and inferior frontal injury in both hemispheres, with different regional weights by side.
      fr: Dans l’étude de 71 patients avec infarctus, une inclinaison pathologique de la verticale visuelle survenait dans 23 des 52 infarctus du territoire de l’artère cérébrale moyenne, avec chevauchement centré sur l’insula postérieure. Une étude ultérieure de 54 patients associait ces inclinaisons aux lésions insulaires et frontales inférieures des deux hémisphères, avec des poids régionaux différents selon le côté.
    limitation:
      en: Ten patients with isolated insular strokes in a separate study had no visual vertical tilt or other measured otolith deficit. The insula is therefore not established as a sufficient lesion site; adjacent cortex and connections may matter. These tasks do not measure every aspect of balance or perceived body orientation.
      fr: Dix patients avec AVC insulaire isolé dans une étude distincte n’avaient ni inclinaison de la verticale visuelle ni autre déficit otolithique mesuré. L’insula n’est donc pas établie comme site lésionnel suffisant; le cortex adjacent et les connexions peuvent compter. Ces tâches ne mesurent pas tous les aspects de l’équilibre ou de l’orientation corporelle perçue.
    mapping_note:
      en: Long-insular/central-insular-sulcus parcels are broad posterior-insular landmarks, not reconstructed infarct overlap. Both sides represent separate unilateral cases. No inferior frontal subdivision is selected from the abstract’s whole-gyrus label, and the landmarks do not imply that isolated damage causes the deficit.
      fr: Les parcelles des gyri longs de l’insula et du sillon central insulaire sont des repères insulaires postérieurs larges, pas des chevauchements d’infarctus reconstruits. Les deux côtés représentent des cas unilatéraux distincts. Aucune subdivision frontale inférieure n’est sélectionnée à partir du gyrus entier nommé dans le résumé, et ces repères n’impliquent pas qu’une lésion isolée cause le déficit.
    mappings:
      - {region: 'destrieux:left:17', source_name: G_Ins_lg_and_S_cent_ins}
      - {region: 'destrieux:right:17', source_name: G_Ins_lg_and_S_cent_ins}
    evidence:
      - {reference: brandt-1994, role: supporting}
      - {reference: baier-cortical-2012, role: supporting}
      - {reference: baier-2013, role: qualifying}

  - id: visual-verticality-brainstem
    deficit: visual-verticality
    title: {en: Brainstem pathways and tilt direction, fr: Voies du tronc cérébral et direction de l’inclinaison}
    network: {en: Brainstem graviceptive pathways, fr: Voies graviceptives du tronc cérébral}
    laterality: bilateral
    finding:
      en: In 79 acute unilateral brainstem strokes, ipsiversive tilts were associated with medial longitudinal fasciculus and medial vestibular nucleus lesions. Contraversive tilts were associated with rostral interstitial medial longitudinal fasciculus nucleus, superior cerebellar peduncle, oculomotor nucleus and interstitial nucleus of Cajal lesions.
      fr: Dans 79 AVC unilatéraux aigus du tronc cérébral, les inclinaisons ipsiversives étaient associées aux lésions du faisceau longitudinal médial et du noyau vestibulaire médial. Les inclinaisons contraversives étaient associées aux lésions du noyau interstitiel rostral du faisceau longitudinal médial, du pédoncule cérébelleux supérieur, du noyau oculomoteur et du noyau interstitiel de Cajal.
    limitation:
      en: These are associations from a selected acute-stroke sample, not a rule predicting every patient’s tilt direction. Cortical strokes can also disturb visual verticality; the profile does not identify a single necessary brainstem site or equate a visual tilt with lateropulsion.
      fr: Il s’agit d’associations dans un échantillon sélectionné d’AVC aigus, pas d’une règle prédisant la direction d’inclinaison de chaque patient. Des AVC corticaux peuvent aussi perturber la verticale visuelle; ce profil n’identifie pas un site unique nécessaire du tronc cérébral et n’assimile pas une inclinaison visuelle à une latéropulsion.
    mapping_note:
      en: No parcel is selected because the named nuclei and pathways lack defensible matching subdivisions in the current atlas. Whole pons or midbrain parcels would overstate the localization; bilateral scope covers separate unilateral lesions.
      fr: Aucune parcelle n’est sélectionnée car les noyaux et voies nommés n’ont pas de subdivisions correspondantes défendables dans l’atlas actuel. Des parcelles entières du pont ou du mésencéphale exagéreraient la localisation; la portée bilatérale couvre des lésions unilatérales distinctes.
    mappings: []
    evidence:
      - {reference: baier-brainstem-2012, role: supporting}
      - {reference: baier-cortical-2012, role: qualifying}

  - id: source-memory-lateral-frontal
    deficit: source-memory
    title: {en: Remembering a word’s source after lateral frontal injury, fr: Mémoire de la source d’un mot après lésion frontale latérale}
    network: {en: Source retrieval and memory monitoring, fr: Récupération de la source et contrôle mnésique}
    laterality: bilateral
    finding:
      en: Nine lateral prefrontal lesion patients were less accurate than nine age-matched controls at identifying which voice had spoken recognized words. Lesions were centred in posterior BA 9/46, with variable extension. Earlier frontal-lesion experiments also found source errors despite preserved fact recall.
      fr: Neuf patients avec lésion préfrontale latérale étaient moins précis que neuf témoins appariés en âge pour identifier la voix ayant prononcé des mots reconnus. Les lésions étaient centrées sur les régions postérieures des aires 9/46, avec des extensions variables. Des expériences antérieures sur les lésions frontales retrouvaient aussi des erreurs de source malgré un rappel des faits préservé.
    limitation:
      en: In the voice study, item recognition was also impaired, and the full patient group did not show a significant disproportionate source deficit versus older controls; a four-patient item-matched subset did. Another focal-lesion study found preserved source memory across its groups, so frontal injury does not invariably cause this deficit.
      fr: Dans l’étude des voix, la reconnaissance des éléments était aussi déficitaire et le groupe entier de patients ne présentait pas de déficit de source significativement disproportionné par rapport aux témoins âgés; un sous-groupe de quatre patients apparié sur la reconnaissance le présentait. Une autre étude de lésions focales retrouvait une mémoire de source préservée dans ses groupes; une lésion frontale ne cause donc pas systématiquement ce déficit.
    mapping_note:
      en: Whole middle frontal gyri are coarse landmarks for the posterior lateral BA 9/46 lesion centres, not exact cytoarchitectonic fields or the full lesion extent. Seven patients had left and two right lesions; colouring both sides does not imply bilateral injury or an ERP generator confined to these parcels.
      fr: Les gyri frontaux moyens entiers sont des repères grossiers pour les centres lésionnels latéraux postérieurs des aires 9/46, pas des champs cytoarchitectoniques exacts ni toute l’étendue lésionnelle. Sept patients avaient une lésion gauche et deux une droite; colorer les deux côtés n’implique ni lésion bilatérale ni générateur des potentiels évoqués limité à ces parcelles.
    mappings:
      - {region: 'destrieux:left:15', source_name: G_front_middle}
      - {region: 'destrieux:right:15', source_name: G_front_middle}
    evidence:
      - {reference: swick-2006, role: supporting}
      - {reference: janowsky-1989, role: supporting}
      - {reference: stamenova-2017, role: qualifying}

  - id: source-memory-context-stability
    deficit: source-memory
    title: {en: Context retrieval depends on the task and frontal site, fr: Récupération du contexte selon la tâche et le site frontal}
    network: {en: Frontal contributions to mnemonic context retrieval, fr: Contributions frontales à la récupération du contexte mnésique}
    laterality: bilateral
    finding:
      en: Right ventrolateral prefrontal lesion patients were impaired when words had appeared in multiple contexts, while left dorsomedial frontal lesion patients were impaired for both unique and multiple contexts. Frontal lesions sparing these regions did not impair context retrieval; only temporal-excision patients showed impaired basic recognition in this experiment.
      fr: Les patients avec lésion préfrontale ventrolatérale droite étaient déficitaires lorsque les mots avaient figuré dans plusieurs contextes, tandis que les patients avec lésion frontale dorsomédiale gauche l’étaient pour les contextes uniques et multiples. Les lésions frontales épargnant ces régions n’altéraient pas la récupération du contexte; seuls les patients avec exérèse temporale avaient une reconnaissance élémentaire déficitaire dans cette expérience.
    limitation:
      en: This specific word-context task does not establish a universal right-sided source-memory system. A separate study found no group impairment in auditory-versus-visual source memory at 30 minutes or 24 hours, despite some recollection deficits. Different tasks, lesion samples and recognition measures are not interchangeable.
      fr: Cette tâche particulière de mots et de contextes n’établit pas un système universel droit de mémoire de source. Une étude distincte ne retrouvait aucun déficit de groupe de mémoire de source auditive ou visuelle à 30 minutes ou 24 heures, malgré certains déficits de recollection. Les tâches, échantillons lésionnels et mesures de reconnaissance ne sont pas interchangeables.
    mapping_note:
      en: No parcel is selected. The consulted abstract distinguishes right ventrolateral from left dorsomedial frontal regions but does not resolve their borders within available gyri or sulci. Their different task effects are retained without substituting whole frontal lobes.
      fr: Aucune parcelle n’est sélectionnée. Le résumé consulté distingue les régions frontales ventrolatérales droites des dorsomédiales gauches mais ne précise pas leurs limites dans les gyri ou sillons disponibles. Leurs effets différents selon la tâche sont conservés sans substituer des lobes frontaux entiers.
    mappings: []
    evidence:
      - {reference: chapados-2015, role: supporting}
      - {reference: stamenova-2017, role: qualifying}

  - id: micrographia-pallidal
    deficit: micrographia
    title: {en: Small handwriting after lenticular injury, fr: Petite écriture après lésion lenticulaire}
    network: {en: Motor scaling of handwriting, fr: Ajustement moteur de la taille de l’écriture}
    laterality: left
    finding:
      en: Four left lenticular infarct cases developed micrographia, two without and two with writer’s cramp. A separate MRI-defined case had predominantly right-hand micrographia after an acute/subacute left pallidal infarct. Another traumatic case centred in the left basal ganglia supports a graphomotor impairment beyond degenerative parkinsonism.
      fr: Quatre cas d’infarctus lenticulaire gauche développaient une micrographie, deux sans et deux avec crampe de l’écrivain. Un cas distinct défini en IRM avait une micrographie surtout de la main droite après infarctus pallidal gauche aigu/subaigu. Un autre cas traumatique centré sur les noyaux gris centraux gauches soutient l’existence d’un trouble graphomoteur au-delà du parkinsonisme dégénératif.
    limitation:
      en: Evidence for focal structural injury is limited to small series and cases. The pallidal case also had an old right pallidal infarct, broader cognitive/language deficits and possible unresolved thalamic involvement; formal follow-up was unavailable. It is not proof that an isolated left pallidal lesion is sufficient or that micrographia identifies Parkinson’s disease.
      fr: Les données sur les lésions structurales focales se limitent à de petites séries et des cas. Le cas pallidal avait aussi un ancien infarctus pallidal droit, des déficits cognitifs/langagiers plus larges et une possible atteinte thalamique non résolue; le suivi formel était indisponible. Il ne prouve ni qu’une lésion pallidale gauche isolée suffit ni que la micrographie identifie la maladie de Parkinson.
    mapping_note:
      en: The whole left pallidum marks only the acute/subacute infarct in the separate case. It does not reconstruct the lesions, distinguish pallidal segments, or represent all four lenticular infarcts. The older right lesion and uncertain thalamic extension prevent treating this landmark as the full causal lesion pattern.
      fr: Le pallidum gauche entier repère uniquement l’infarctus aigu/subaigu du cas distinct. Il ne reconstruit pas les lésions, ne distingue pas les segments pallidaux et ne représente pas les quatre infarctus lenticulaires. L’ancienne lésion droite et l’extension thalamique incertaine empêchent de traiter ce repère comme tout le profil lésionnel causal.
    mappings:
      - {region: 'aseg:left:13', source_name: Left-Pallidum}
    evidence:
      - {reference: derkinderen-2002, role: supporting}
      - {reference: nelson-2014, role: supporting}
      - {reference: denes-2005, role: qualifying}

  - id: hypersomnia-thalamic
    deficit: hypersomnia
    title: {en: Thalamic sleep–wake disturbance and its evolution, fr: Trouble veille-sommeil thalamique et son évolution}
    network: {en: Thalamic regulation of sleep and arousal, fr: Régulation thalamique du sommeil et de l’éveil}
    laterality: bilateral
    finding:
      en: A 12-patient paramedian thalamic stroke series documented prolonged sleep behaviour with reduced sleep spindles and altered NREM sleep. In a later consecutive 46-patient series, hypersomnia was initially reported in all patients, with 31 undergoing polysomnography. Sleep need improved over follow-up and almost disappeared after unilateral lesions at one year.
      fr: Une série de 12 AVC thalamiques paramédians documentait un comportement de sommeil prolongé avec réduction des fuseaux de sommeil et modification du sommeil non paradoxal. Dans une série consécutive ultérieure de 46 patients, une hypersomnie était rapportée initialement chez tous les patients, dont 31 avec polysomnographie. Le besoin de sommeil s’améliorait au suivi et disparaissait presque après les lésions unilatérales à un an.
    limitation:
      en: These findings do not imply permanent hypersomnia after every thalamic stroke or identify a single necessary nucleus. A later persistent-hypersomnia case involved posterior right thalamus, but its main case description also reports cerebellar infarcts despite a discussion claiming no other structural changes. It cannot establish an isolated pulvinar cause or a treatment response rule.
      fr: Ces constats n’impliquent pas une hypersomnie permanente après tout AVC thalamique et n’identifient pas un noyau unique nécessaire. Un cas ultérieur d’hypersomnie persistante touchait le thalamus postérieur droit, mais sa description clinique principale rapporte aussi des infarctus cérébelleux malgré une discussion affirmant l’absence d’autres modifications structurales. Il n’établit ni cause pulvinarienne isolée ni règle de réponse thérapeutique.
    mapping_note:
      en: Whole thalamic parcels are coarse landmarks for the 46-patient series, which included 16 left, 16 right and 14 bilateral lesions. They exceed the paramedian territory and do not assign a precise nucleus. No pulvinar-only or connected cortical parcel is inferred from the later case.
      fr: Les parcelles thalamiques entières sont des repères grossiers pour la série de 46 patients, qui comprenait 16 lésions gauches, 16 droites et 14 bilatérales. Elles dépassent le territoire paramédian et n’attribuent pas un noyau précis. Aucune parcelle pulvinarienne seule ou corticale connectée n’est inférée du cas ultérieur.
    mappings:
      - {region: 'aseg:left:10', source_name: Left-Thalamus-Proper}
      - {region: 'aseg:right:49', source_name: Right-Thalamus-Proper}
    evidence:
      - {reference: bassetti-1996, role: supporting}
      - {reference: hermann-2008, role: supporting}
      - {reference: hansen-2020, role: qualifying}

  - id: saccadic-dysmetria-fastigial
    deficit: saccadic-dysmetria
    title: {en: Saccadic overshoot with midline cerebellar injury, fr: Dépassement saccadique après lésion cérébelleuse médiane}
    network: {en: Cerebellar calibration of rapid eye movements, fr: Calibration cérébelleuse des mouvements oculaires rapides}
    laterality: bilateral
    finding:
      en: Two patients with midline cerebellar lesions including both fastigial nuclei had overshooting saccades despite well-preserved smooth pursuit. A separate 24-patient cerebellar/connection study found several abnormal amplitude and corrective-saccade patterns, with hypermetria in at least one direction in 15 patients.
      fr: Deux patients avec lésions cérébelleuses médianes incluant les deux noyaux fastigiaux avaient des saccades dépassant la cible malgré une poursuite lente bien préservée. Une étude distincte de 24 patients avec atteinte cérébelleuse/de ses connexions retrouvait plusieurs profils anormaux d’amplitude et de corrections, avec hypermétrie dans au moins une direction chez 15 patients.
    limitation:
      en: The two cases do not isolate the fastigial nuclei from adjacent midline structures or establish prevalence. The larger study also found hypometria, abnormal corrections despite initially normal saccades, and two patients with normal saccades under all tested conditions. Mild undershoot occurs in controls; a small endpoint error alone is not a universal diagnostic criterion.
      fr: Les deux cas n’isolent pas les noyaux fastigiaux des structures médianes voisines et n’établissent pas de prévalence. L’étude plus grande retrouvait aussi une hypométrie, des corrections anormales malgré des saccades initiales normales et deux patients avec saccades normales dans toutes les conditions testées. Un léger sous-dépassement survient chez les témoins; une petite erreur finale seule n’est pas un critère diagnostique universel.
    mapping_note:
      en: Whole fastigial nuclei mark structures explicitly involved in the two bilateral cases, not the full lesions or a selectively damaged oculomotor subregion. Learning and histological parcels depict the same nuclei in different atlas views; no vermal lobule is inferred from the abstract’s broad midline description.
      fr: Les noyaux fastigiaux entiers repèrent des structures explicitement atteintes dans les deux cas bilatéraux, pas toutes les lésions ni une sous-région oculomotrice sélectivement lésée. Les parcelles pédagogiques et histologiques représentent les mêmes noyaux dans des vues d’atlas différentes; aucun lobule vermien n’est inféré de la description médiane large du résumé.
    mappings:
      - {region: 'learning:left:fastigial', source_name: Fastigial nucleus}
      - {region: 'learning:right:fastigial', source_name: Fastigial nucleus}
      - {region: 'nextbrain:left:715', source_name: 'fastigial_(medial)_nucleus'}
      - {region: 'nextbrain:right:10715', source_name: 'fastigial_(medial)_nucleus'}
    evidence:
      - {reference: buttner-1994, role: supporting}
      - {reference: botzel-1993, role: qualifying}

  - id: smooth-pursuit-vermis
    deficit: smooth-pursuit
    title: {en: Vermal lesions and reduced smooth-tracking gain, fr: Lésions vermiennes et réduction du gain de poursuite}
    network: {en: Cerebellar smooth-pursuit system, fr: Système cérébelleux de poursuite oculaire lente}
    laterality: bilateral
    finding:
      en: Comparing 11 patients with deficient pursuit gain and 17 with intact gain after acute cerebellar infarcts associated reduced horizontal sinusoidal pursuit gain with the uvula and partly the vermal pyramid. Similar areas were implicated in impaired optokinetic slow phases and fixation suppression of the vestibulo-ocular reflex.
      fr: La comparaison de 11 patients avec gain de poursuite déficitaire et 17 avec gain préservé après infarctus cérébelleux aigu associait la réduction du gain de poursuite horizontale sinusoïdale à l’uvule et en partie à la pyramide vermienne. Des régions similaires étaient impliquées dans les phases lentes optocinétiques et la suppression du réflexe vestibulo-oculaire par fixation déficitaires.
    limitation:
      en: These selected cerebellar-stroke comparisons concern particular eye-movement tasks and do not establish one site for every pursuit disorder. Bilateral fastigial-region cases with preserved pursuit qualify any claim that all cerebellar ocular motor damage affects tracking; cerebral lesions provide other routes to reduced gain.
      fr: Ces comparaisons sélectionnées d’AVC cérébelleux concernent des tâches oculomotrices particulières et n’établissent pas un site pour tout trouble de poursuite. Des cas d’atteinte fastigiale bilatérale avec poursuite préservée nuancent l’idée que toute atteinte oculomotrice cérébelleuse altère le suivi; des lésions cérébrales peuvent aussi réduire le gain.
    mapping_note:
      en: Vermis IX and VIII are midline reference landmarks for the reported uvula and partial pyramid involvement, not exact lesion clusters. Whole VIII exceeds the partial overlap. Hemispheric lobule IX is not substituted for the vermal uvula, and bilateral scope does not require bilateral infarction.
      fr: Les vermis IX et VIII sont des repères médians pour l’atteinte rapportée de l’uvule et partielle de la pyramide, pas des amas lésionnels exacts. Le lobule VIII entier dépasse le chevauchement partiel. Le lobule IX hémisphérique ne remplace pas l’uvule vermienne et la portée bilatérale n’exige pas d’infarctus bilatéral.
    mappings:
      - {region: 'learning:vermis-ix', source_name: Vermis IX (uvula)}
      - {region: 'learning:vermis-viii', source_name: Vermis VIII (pyramis)}
    evidence:
      - {reference: baier-ocular-2009, role: supporting}
      - {reference: buttner-1994, role: qualifying}
      - {reference: lekwuwa-1996, role: qualifying}

  - id: smooth-pursuit-cerebral
    deficit: smooth-pursuit
    title: {en: Distributed cerebral lesions and directional pursuit deficits, fr: Lésions cérébrales distribuées et déficits directionnels de poursuite}
    network: {en: Cerebral pursuit and attention pathways, fr: Voies cérébrales de poursuite et d’attention}
    laterality: bilateral
    finding:
      en: In 72 focal cerebral lesion patients, 20 had normal pursuit across tested frequencies while others showed different unilateral or bilateral directional deficits. Lesion overlap involved a distributed occipitotemporal-to-frontal pathway and regions related to directed attention; impairments increased at higher target frequencies.
      fr: Parmi 72 patients avec lésion cérébrale focale, 20 avaient une poursuite normale aux fréquences testées tandis que les autres présentaient différents déficits directionnels unilatéraux ou bilatéraux. Le chevauchement lésionnel impliquait une voie occipitotemporale-frontale distribuée et des régions liées à l’attention dirigée; les déficits augmentaient aux fréquences de cible élevées.
    limitation:
      en: Broad lesion-overlap categories, neighbouring white-matter injury and different directional patterns do not isolate a single cortical pursuit centre. These findings and the cerebellar study concern different lesion samples, not a direct replication or a rule predicting each patient’s eye movements.
      fr: Les catégories larges de chevauchement lésionnel, l’atteinte de substance blanche voisine et les différents profils directionnels n’isolent pas un centre cortical unique de poursuite. Ces constats et l’étude cérébelleuse concernent des échantillons lésionnels différents, pas une réplication directe ni une règle prédisant les mouvements oculaires de chaque patient.
    mapping_note:
      en: No parcel is selected. The consulted abstract describes distributed cortical and subcortical overlap without borders that identify defensible subdivisions in this atlas. Frontal eye fields, V5 and connected attention-network areas are not translated into whole gyral parcels.
      fr: Aucune parcelle n’est sélectionnée. Le résumé consulté décrit un chevauchement cortical et sous-cortical distribué sans limites identifiant des subdivisions défendables dans cet atlas. Les champs oculaires frontaux, V5 et les régions connectées du réseau attentionnel ne sont pas traduits en parcelles gyrales entières.
    mappings: []
    evidence:
      - {reference: lekwuwa-1996, role: supporting}
      - {reference: baier-ocular-2009, role: qualifying}

  - id: phonological-alexia-sublexical
    deficit: phonological-alexia
    title: {en: Reading novel letter strings and motor phonology, fr: Lecture de suites de lettres nouvelles et phonologie motrice}
    network: {en: Sublexical reading and speech-motor representations, fr: Lecture sublexicale et représentations motrices de la parole}
    laterality: left
    finding:
      en: In 30 left-stroke participants, motor-phonological impairment was associated with a greater disadvantage for reading pseudowords versus matched familiar words. A corrected lesion cluster involved ventral precentral/frontal opercular cortex and adjacent insular, striatal and white-matter regions; structural disconnections also contributed.
      fr: Chez 30 participants après AVC gauche, l’atteinte phonologique motrice était associée à un désavantage accru pour la lecture de pseudomots par rapport aux mots familiers appariés. Un amas lésionnel corrigé impliquait le cortex précentral ventral/operculaire frontal et des régions insulaires, striatales et de substance blanche voisines; les déconnexions structurales contribuaient aussi.
    limitation:
      en: This is a reading-aloud result with short pronounceable pseudowords; generalization to silent reading remains open. The motor-phonology interaction was modest, and the lesion cluster was not confined to one gyrus. Earlier perisylvian-lesion evidence supports broader shared phonological contributions to reading, spelling and repetition rather than a uniquely reading-specific centre.
      fr: Ce résultat concerne la lecture à voix haute de pseudomots courts prononçables; la généralisation à la lecture silencieuse reste ouverte. L’interaction avec la phonologie motrice était modeste et l’amas lésionnel ne se limitait pas à un gyrus. Des données antérieures de lésions périsylviennes soutiennent des contributions phonologiques partagées à la lecture, à l’orthographe et à la répétition plutôt qu’un centre uniquement consacré à la lecture.
    mapping_note:
      en: The whole left precentral gyrus is a coarse landmark for the reported ventral precentral involvement, not the cluster centre, its full extent or a reconstructed lesion mask. Disconnected endpoints and additional implicated regions are not automatically painted as directly injured cortex.
      fr: Le gyrus précentral gauche entier est un repère grossier pour l’atteinte précentrale ventrale rapportée, pas le centre de l’amas, toute son étendue ou un masque lésionnel reconstruit. Les extrémités déconnectées et les autres régions impliquées ne sont pas automatiquement colorées comme cortex directement lésé.
    mappings:
      - {region: 'destrieux:left:29', source_name: G_precentral}
    evidence:
      - {reference: dickens-2021, role: supporting}
      - {reference: rapcsak-2009, role: qualifying}

  - id: phonological-alexia-general-reading
    deficit: phonological-alexia
    title: {en: General reading accuracy and sensory–motor integration, fr: Précision générale de lecture et intégration sensorimotrice}
    network: {en: Shared phonological processing across tasks, fr: Traitement phonologique partagé entre les tâches}
    laterality: left
    finding:
      en: Poorer pseudoword repetition was related to reduced reading accuracy for both familiar words and pseudowords, whereas motor-phonological impairment preferentially affected pseudowords. The study found temporoparietal structural-disconnection associations, but the voxelwise overall-reading cluster did not reach the corrected cluster threshold.
      fr: Une répétition de pseudomots moins bonne était liée à une précision réduite de lecture des mots familiers comme des pseudomots, tandis que l’atteinte phonologique motrice touchait préférentiellement les pseudomots. L’étude retrouvait des associations avec des déconnexions structurales temporopariétales, mais l’amas voxel par voxel de lecture générale n’atteignait pas le seuil corrigé par amas.
    limitation:
      en: The overall-reading lesion cluster had corrected P = 0.056 and is not presented as a positive corrected localization. A lexicality effect can occur in controls and does not alone establish a selective reading deficit; non-orthographic phonological performance and task difficulty matter.
      fr: L’amas lésionnel de lecture générale avait une valeur corrigée P = 0,056 et n’est pas présenté comme localisation positive après correction. Un effet de lexicalité peut survenir chez les témoins et n’établit pas seul un déficit sélectif de lecture; les performances phonologiques sans orthographe et la difficulté des tâches comptent.
    mapping_note:
      en: No parcel is selected. Neither a below-threshold direct-lesion result nor significant disconnection endpoints justify painting whole temporoparietal gyri as directly damaged sites for this finding.
      fr: Aucune parcelle n’est sélectionnée. Ni un résultat lésionnel direct sous le seuil ni des extrémités de déconnexions significatives ne justifient de colorer des gyri temporopariétaux entiers comme sites directement lésés pour ce constat.
    mappings: []
    evidence:
      - {reference: dickens-2021, role: supporting}
      - {reference: rapcsak-2009, role: qualifying}

  - id: post-stroke-depressive-symptoms-limbic
    deficit: post-stroke-depressive-symptoms
    title: {en: Replicated regional associations with depressive symptom scores, fr: Associations régionales répliquées avec les scores de symptômes dépressifs}
    network: {en: Limbic and basal ganglia contributions to mood, fr: Contributions limbiques et des noyaux gris centraux à l’humeur}
    laterality: right
    finding:
      en: In 553 ischemic-stroke patients, right amygdala, hippocampal and pallidal infarcts were associated with Geriatric Depression Scale scores. An independent 459-patient cohort confirmed the amygdala and pallidal associations, but not the hippocampal result.
      fr: Chez 553 patients après AVC ischémique, les infarctus amygdaliens, hippocampiques et pallidaux droits étaient associés aux scores de l’échelle de dépression gériatrique. Une cohorte indépendante de 459 patients confirmait les associations amygdaliennes et pallidales, mais pas le résultat hippocampique.
    limitation:
      en: These are group-level symptom-score associations, not a depressive-disorder diagnosis or proof of a sufficient lesion site. Two other prospective cohorts totalling 377 participants found no significant direct lesion association. Different scales, follow-up times, lesion coverage and psychosocial factors limit a universal right-sided model.
      fr: Il s’agit d’associations de scores symptomatiques au niveau des groupes, pas d’un diagnostic de trouble dépressif ni de la preuve d’un site lésionnel suffisant. Deux autres cohortes prospectives totalisant 377 participants ne retrouvaient pas d’association lésionnelle directe significative. Les échelles, temps de suivi, couvertures lésionnelles et facteurs psychosociaux différents limitent un modèle universel droit.
    mapping_note:
      en: Whole right amygdala and pallidum parcels are coarse landmarks for regions supported by external validation, not reconstructed significant voxels or a prediction for this subject. The unreplicated hippocampal result and inferred disconnection sites are not painted.
      fr: Les parcelles entières de l’amygdale et du pallidum droits sont des repères grossiers pour les régions soutenues par la validation externe, pas des voxels significatifs reconstruits ni une prédiction pour ce sujet. Le résultat hippocampique non répliqué et les sites de déconnexion inférés ne sont pas colorés.
    mappings:
      - {region: 'aseg:right:54', source_name: Right-Amygdala}
      - {region: 'aseg:right:52', source_name: Right-Pallidum}
    evidence:
      - {reference: weaver-2023, role: supporting}
      - {reference: rios-2025, role: qualifying}

  - id: post-stroke-depressive-symptoms-network
    deficit: post-stroke-depressive-symptoms
    title: {en: Inconsistent lesion and network markers across cohorts, fr: Marqueurs lésionnels et de réseau inconstants entre les cohortes}
    network: {en: Distributed mood-related connectivity, fr: Connectivité distribuée liée à l’humeur}
    laterality: bilateral
    finding:
      en: In two prospective stroke cohorts totalling 377 participants, direct lesion mapping found no significant association with depressive symptoms. Normative lesion-network similarity had a weak pooled relationship with symptom scores, but the association did not replicate across the two datasets.
      fr: Dans deux cohortes prospectives d’AVC totalisant 377 participants, la cartographie lésionnelle directe ne retrouvait pas d’association significative avec les symptômes dépressifs. La similarité de réseau lésionnel normative avait une faible relation regroupée avec les scores symptomatiques, mais l’association ne se répliquait pas entre les deux jeux de données.
    limitation:
      en: A null regional result does not prove that all anatomy is irrelevant, just as pooled network significance does not establish a validated biomarker. The externally validated amygdala/pallidum study used a different sample and symptom scale. Neither result supports individual diagnosis or treatment selection from this atlas.
      fr: Un résultat régional nul ne prouve pas que toute anatomie est sans importance, pas plus qu’une significativité de réseau regroupée n’établit un biomarqueur validé. L’étude amygdale/pallidum avec validation externe utilisait un autre échantillon et une autre échelle symptomatique. Aucun résultat ne soutient un diagnostic individuel ou un choix thérapeutique à partir de cet atlas.
    mapping_note:
      en: No parcel is selected. Connected cortical and thalamic regions are not treated as directly damaged sites, and a pooled association that failed cross-dataset replication is not converted into a coloured depression circuit.
      fr: Aucune parcelle n’est sélectionnée. Les régions corticales et thalamiques connectées ne sont pas traitées comme des sites directement lésés et une association regroupée sans réplication entre jeux de données n’est pas transformée en circuit dépressif coloré.
    mappings: []
    evidence:
      - {reference: rios-2025, role: supporting}
      - {reference: weaver-2023, role: qualifying}

  - id: surface-alexia-regularization
    deficit: surface-alexia
    title: {en: Regularization errors after posterior temporal injury, fr: Erreurs de régularisation après lésion temporale postérieure}
    network: {en: Word-specific phonological access from print, fr: Accès à la phonologie propre aux mots à partir de l’écrit}
    laterality: left
    finding:
      en: In 45 chronic left-stroke patients, regularization errors were associated with a corrected posterior middle temporal cluster extending into adjacent occipital and white-matter regions. Error rates were not correlated with the tested semantic-matching measures. A separate 59-patient study associated surface reading impairment predominantly with left temporal lesions.
      fr: Chez 45 patients après AVC gauche chronique, les erreurs de régularisation étaient associées à un amas corrigé temporal moyen postérieur s’étendant aux régions occipitales et de substance blanche voisines. Les taux d’erreur n’étaient pas corrélés aux mesures d’appariement sémantique testées. Une étude distincte de 59 patients associait le trouble de lecture de surface surtout aux lésions temporales gauches.
    limitation:
      en: The positive result concerns a particular error type. Overall irregular-word accuracy, controlling for nonword reading, had no surviving corrected lesion cluster. Semantic deficits were generally mild and anterior temporal coverage was limited; the result does not prove all semantic processing intact. Unpredictable stress in Italian and irregular spelling-to-sound mappings in English are different task demands.
      fr: Le résultat positif concerne un type particulier d’erreur. La précision globale sur mots irréguliers, contrôlée pour la lecture de non-mots, n’avait aucun amas lésionnel survivant à la correction. Les déficits sémantiques étaient généralement légers et la couverture temporale antérieure limitée; le résultat ne prouve pas toute la sémantique intacte. L’accentuation imprévisible en italien et les correspondances orthographe-son irrégulières en anglais imposent des exigences différentes.
    mapping_note:
      en: The whole left middle temporal gyrus is a coarse landmark for the posterior cortical portion of the regularization-error result. It exceeds that portion and does not reproduce the white-matter or occipital extension, or identify a universal site for the entire surface-alexia syndrome.
      fr: Le gyrus temporal moyen gauche entier est un repère grossier pour la portion corticale postérieure du résultat sur les erreurs de régularisation. Il dépasse cette portion et ne reproduit pas l’extension en substance blanche ou occipitale, ni un site universel pour tout le syndrome d’alexie de surface.
    mappings:
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
    evidence:
      - {reference: binder-2016, role: supporting}
      - {reference: ripamonti-2014, role: qualifying}

  - id: personal-neglect-parietal
    deficit: personal-neglect
    title: {en: Body-space neglect and parietal lesion associations, fr: Négligence de l’espace corporel et associations lésionnelles pariétales}
    network: {en: Attention to the body and its spatial representation, fr: Attention au corps et à sa représentation spatiale}
    laterality: right
    finding:
      en: In 52 right-stroke patients, lesion analyses associated personal neglect with supramarginal and postcentral regions and especially the white matter medial to them, differing from the frontal/superior temporal pattern for extrapersonal neglect.
      fr: Chez 52 patients après AVC droit, les analyses lésionnelles associaient la négligence personnelle aux régions supramarginales et postcentrales et surtout à leur substance blanche médiale, avec un profil différent du profil frontal/temporal supérieur de la négligence extrapersonnelle.
    limitation:
      en: The all-right-lesion sample cannot establish that left-sided injury spares body attention. Revised Fluff-test scoring in 243 patients found personal neglect after either lesion side, with greater severity but no significant frequency difference after right injury. A later adjusted lesion study emphasized different medial structures, limiting a uniquely parietal account; test demands and co-occurring motor/spatial deficits matter.
      fr: L’échantillon uniquement lésionnel droit n’établit pas que les lésions gauches épargnent l’attention corporelle. Une cotation révisée du Fluff test chez 243 patients retrouvait une négligence personnelle après lésion de chaque côté, plus sévère mais sans différence significative de fréquence après atteinte droite. Une étude lésionnelle ajustée ultérieure mettait l’accent sur d’autres structures médiales, limitant une explication uniquement pariétale; les exigences des tests et les déficits moteurs/spatiaux associés comptent.
    mapping_note:
      en: Whole right supramarginal and postcentral parcels are broad cortical landmarks for the 52-patient finding. They do not reconstruct lesion clusters or the particularly implicated subjacent white matter, and are not a required lesion pattern for every personal-neglect case.
      fr: Les parcelles supramarginale et postcentrale droites entières sont des repères corticaux larges pour le constat chez 52 patients. Elles ne reconstruisent ni les amas lésionnels ni la substance blanche sous-jacente particulièrement impliquée et ne constituent pas un profil lésionnel requis dans chaque cas de négligence personnelle.
    mappings:
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
      - {region: 'destrieux:right:28', source_name: G_postcentral}
    evidence:
      - {reference: committeri-2007, role: supporting}
      - {reference: bertagnoli-2022, role: qualifying}
      - {reference: cocchini-2022, role: qualifying}

  - id: personal-neglect-medial
    deficit: personal-neglect
    title: {en: Adjusted regional associations and indirect disconnection estimates, fr: Associations régionales ajustées et estimations indirectes de déconnexion}
    network: {en: Proposed medial network for body-space attention, fr: Réseau médial proposé pour l’attention à l’espace corporel}
    laterality: right
    finding:
      en: In 104 right-stroke patients, continuous Comb-test scores were related to lesions in several regions and to atlas-estimated tract disconnection. After adjustment for lesion size, timing, motor deficit, anosognosia and line bisection, Heschl’s gyrus, thalamus and estimated fornix disconnection retained associations in the reported regression models.
      fr: Chez 104 patients après AVC droit, les scores continus au test du peigne étaient liés à des lésions de plusieurs régions et à des déconnexions de faisceaux estimées par atlas. Après ajustement pour la taille lésionnelle, le délai, le déficit moteur, l’anosognosie et la bissection de lignes, le gyrus de Heschl, le thalamus et la déconnexion estimée du fornix conservaient des associations dans les modèles de régression rapportés.
    limitation:
      en: These exploratory models tested many candidate regions/tracts and reported modest nominal associations. Most scans were CT, some clinical data were imputed, and the head-focused Comb task is not a complete test of body attention. The results differ from earlier parietal findings and do not establish a unique causal circuit or an episodic-memory mechanism.
      fr: Ces modèles exploratoires testaient de nombreuses régions/voies candidates et rapportaient des associations nominales modestes. La majorité des examens étaient des TDM, certaines données cliniques étaient imputées et le test du peigne centré sur la tête n’évalue pas toute l’attention corporelle. Les résultats diffèrent des constats pariétaux antérieurs et n’établissent ni circuit causal unique ni mécanisme de mémoire épisodique.
    mapping_note:
      en: The exploratory integrated-network finding remains uncoloured. Atlas-derived fornix disconnection is not a directly measured tract lesion, and the combined pattern and proposed thalamic subdivisions are not treated as an independently validated lesion map. The earlier cortical result is available separately with its own limits.
      fr: Le constat exploratoire de réseau intégré reste non coloré. La déconnexion du fornix issue d’un atlas n’est pas une lésion du faisceau directement mesurée et le profil combiné et les subdivisions thalamiques proposées ne sont pas traités comme une carte lésionnelle validée indépendamment. Le résultat cortical antérieur est disponible séparément avec ses propres limites.
    mappings: []
    evidence:
      - {reference: bertagnoli-2022, role: supporting}
      - {reference: committeri-2007, role: qualifying}

  - id: auditory-motion-temporal
    deficit: auditory-motion
    title: {en: Moving sounds versus stationary location and identity, fr: Sons mobiles versus position fixe et identité}
    network: {en: Auditory motion and spatial processing, fr: Traitement du mouvement et de l’espace auditifs}
    laterality: bilateral
    finding:
      en: After right anterior temporal and posterior superior temporal resection, one patient had selective auditory-motion impairment with preserved sound identity and stationary localization. In a separate surgical series, three hemispherectomy patients could not perceive auditory motion, while an anterior temporal resection patient had normal motion judgments despite impaired stationary localization. Left-lesion cases also showed motion deficits with differing recognition profiles.
      fr: Après résection temporale antérieure et temporale supérieure postérieure droite, un patient avait un déficit sélectif du mouvement auditif avec identité sonore et localisation fixe préservées. Dans une série chirurgicale distincte, trois patients avec hémisphérectomie ne percevaient pas le mouvement auditif, tandis qu’un patient avec résection temporale antérieure avait des jugements de mouvement normaux malgré une localisation fixe déficitaire. Des cas lésionnels gauches montraient aussi des déficits de mouvement avec différents profils de reconnaissance.
    limitation:
      en: These small, heterogeneous case studies do not establish prevalence or a unique right-sided auditory-motion module. The selective surgical case also had anterior temporal resection, while hemispherectomy is extensive and long-standing. Stationary localization was mildly or moderately impaired in the hemispherectomy cases, not uniformly intact; stimulus cues and task demands limit generalization to everyday hearing.
      fr: Ces petites études de cas hétérogènes n’établissent ni prévalence ni module unique droit du mouvement auditif. Le cas chirurgical sélectif avait aussi une résection temporale antérieure, tandis que l’hémisphérectomie est étendue et ancienne. La localisation fixe était légèrement ou modérément déficitaire après hémisphérectomie, pas uniformément intacte; les indices des stimuli et les exigences des tâches limitent la généralisation à l’audition quotidienne.
    mapping_note:
      en: The whole right lateral superior temporal gyrus marks the posterior STG resection in the selective case only. It exceeds the posterior resection and does not represent the anterior temporal operation or the full surgical pattern. Broad left-sided and hemispherectomy lesions are not converted into additional cortical parcels; bilateral scope reflects cases on either side.
      fr: Le gyrus temporal supérieur latéral droit entier repère la résection du STG postérieur du seul cas sélectif. Il dépasse la résection postérieure et ne représente ni l’opération temporale antérieure ni tout le profil chirurgical. Les lésions gauches larges et les hémisphérectomies ne sont pas converties en parcelles corticales supplémentaires; la portée bilatérale reflète des cas de chaque côté.
    mappings:
      - {region: 'destrieux:right:34', source_name: G_temp_sup-Lateral}
    evidence:
      - {reference: ducommun-2004, role: supporting}
      - {reference: lewald-2009, role: supporting}
      - {reference: clarke-2000, role: qualifying}

  - id: horizontal-gaze-palsy-pontine
    deficit: horizontal-gaze-palsy
    title: {en: Conjugate horizontal gaze limitation with dorsal pontine lesions, fr: Limitation conjuguée du regard horizontal avec lésions pontiques dorsales}
    network: {en: Pontine horizontal gaze pathways, fr: Voies pontiques du regard horizontal}
    laterality: bilateral
    finding:
      en: Seventeen adults with unilateral dorsal pontine lesions had complete or partial horizontal gaze palsy, with differing saccadic, pursuit and vestibular profiles. Three other adults had bilateral horizontal paresis with solitary presumed inflammatory pontine lesions. These observations support pontine gaze dysfunction while distinguishing selective saccadic impairment from loss of several conjugate movement types.
      fr: Dix-sept adultes avec lésions pontiques dorsales unilatérales avaient une paralysie complète ou partielle du regard horizontal et différents profils saccadiques, de poursuite et vestibulaires. Trois autres adultes avaient une parésie horizontale bilatérale avec lésions pontiques uniques présumées inflammatoires. Ces observations soutiennent un trouble pontique du regard en distinguant l’atteinte saccadique sélective de la perte de plusieurs types de mouvements conjugués.
    limitation:
      en: Small referral-based retrospective samples do not estimate incidence. MRI and bedside eye-movement patterns do not reliably separate the adjacent abducens nucleus, PPRF and connecting fibres. The three inflammatory cases do not establish a new antibody-defined disease, treatment efficacy or uniformly normal vertical movements.
      fr: De petits échantillons rétrospectifs de centres de recours n’estiment pas l’incidence. L’IRM et les profils oculomoteurs cliniques ne séparent pas fiablement le noyau de l’abducens, la PPRF et leurs fibres adjacentes. Les trois cas inflammatoires n’établissent ni nouvelle maladie définie par un anticorps, ni efficacité thérapeutique, ni normalité verticale uniforme.
    mapping_note:
      en: Whole left and right pontine territories are broad landmarks for documented dorsal lesions on either side, not a reconstruction of their small tegmental extent. They do not identify the abducens nucleus or PPRF separately; showing both sides does not mean every patient had bilateral pontine injury.
      fr: Les territoires pontiques gauche et droit entiers sont des repères larges pour les lésions dorsales documentées de chaque côté, sans reconstruire leur petite étendue tegmentale. Ils n’identifient pas séparément le noyau de l’abducens ou la PPRF; représenter les deux côtés ne signifie pas que chaque patient avait une atteinte pontique bilatérale.
    mappings:
      - {region: 'learning:left:pons', source_name: Pontine territory}
      - {region: 'learning:right:pons', source_name: Pontine territory}
    evidence:
      - {reference: choi-gaze-2025, role: supporting}
      - {reference: ewe-2017, role: supporting}

  - id: vertical-gaze-palsy-midbrain
    deficit: vertical-gaze-palsy
    title: {en: Upward and downward gaze palsy with a focal rostral midbrain infarct, fr: Paralysie du regard vers le haut et le bas avec infarctus mésencéphalique rostral focal}
    network: {en: Rostral midbrain vertical gaze pathways, fr: Voies mésencéphaliques rostrales du regard vertical}
    laterality: left
    finding:
      en: One patient had complete upward and downward gaze palsy with a small left rostral midbrain lesion on diffusion-weighted MRI. The case supports focal midbrain involvement without making bilateral structural injury a requirement for the bilateral eye-movement deficit.
      fr: Un patient avait une paralysie complète du regard vers le haut et le bas avec petite lésion mésencéphalique rostrale gauche en IRM de diffusion. Le cas soutient l’implication mésencéphalique focale sans faire d’une lésion structurelle bilatérale une condition du déficit oculomoteur bilatéral.
    limitation:
      en: A single case does not determine prevalence, a universally sufficient lesion or the exact injured nucleus. Separate thalamic cases show that visible midbrain infarction is not present in every vertical gaze palsy. Different vertical saccadic, pursuit and vestibular components require separate examination.
      fr: Un cas unique ne détermine ni prévalence, ni lésion universellement suffisante, ni noyau exact atteint. Des cas thalamiques distincts montrent qu’un infarctus mésencéphalique visible n’est pas présent dans chaque paralysie verticale. Les composantes saccadiques, de poursuite et vestibulaires verticales doivent être examinées séparément.
    mapping_note:
      en: The whole left midbrain territory marks the side and brainstem level in the focal report. It greatly exceeds the rostral lesion and does not resolve the riMLF, interstitial nucleus of Cajal or posterior commissure. It is not a map of all vertical gaze palsy.
      fr: Le territoire mésencéphalique gauche entier repère le côté et le niveau du tronc dans le cas focal. Il dépasse largement la lésion rostrale et ne délimite ni la riMLF, ni le noyau interstitiel de Cajal, ni la commissure postérieure. Il ne cartographie pas toutes les paralysies du regard vertical.
    mappings:
      - {region: 'learning:left:midbrain', source_name: Midbrain territory}
    evidence:
      - {reference: yokose-2018, role: supporting}
      - {reference: clark-1995, role: qualifying}
      - {reference: moon-2021, role: qualifying}

  - id: vertical-gaze-palsy-thalamic
    deficit: vertical-gaze-palsy
    title: {en: Thalamic stroke observations and unresolved pathways, fr: Observations après AVC thalamique et voies non résolues}
    network: {en: Supranuclear inputs to vertical gaze pathways, fr: Afférences supranucléaires des voies du regard vertical}
    laterality: bilateral
    finding:
      en: Three patients with vertical gaze paralysis had medial thalamic infarcts without visible midbrain involvement on repeated MRI; two were right-sided and one bilateral. A later thalamic-stroke registry found vertical gaze palsy in 19 of 342 patients, within a broader group of overlapping neuro-ophthalmologic manifestations.
      fr: Trois patients avec paralysie du regard vertical avaient des infarctus thalamiques médiaux sans atteinte mésencéphalique visible sur IRM répétées; deux étaient droits et un bilatéral. Un registre ultérieur d’AVC thalamiques retrouvait une paralysie verticale chez 19 des 342 patients, au sein d’un groupe plus large de manifestations neuro-ophtalmologiques se chevauchant.
    limitation:
      en: Absence of visible midbrain damage does not exclude small or transient injury beyond MRI resolution. The registry includes cases with rostral midbrain involvement and does not make all 19 gaze-palsy cases isolated thalamic lesions. Its persistence figures concern mixed oculomotor deficits, not vertical gaze alone; interruption of descending inputs remains an interpretation.
      fr: L’absence de lésion mésencéphalique visible n’exclut pas une atteinte petite ou transitoire sous la résolution de l’IRM. Le registre comprend des cas avec atteinte mésencéphalique rostrale et ne fait pas des 19 paralysies verticales des lésions thalamiques isolées. Ses chiffres de persistance concernent divers déficits oculomoteurs, pas le seul regard vertical; l’interruption d’afférences descendantes reste une interprétation.
    mapping_note:
      en: No thalamic parcel is selected. Broad medial and paramedian territories do not isolate a nucleus or the proposed descending fibres. The focal left-midbrain case is available separately and is not used to replace these different lesion observations.
      fr: Aucune parcelle thalamique n’est sélectionnée. Les territoires médiaux et paramédians larges n’isolent ni un noyau ni les fibres descendantes proposées. Le cas mésencéphalique gauche focal est présenté séparément et ne remplace pas ces observations lésionnelles différentes.
    mappings: []
    evidence:
      - {reference: clark-1995, role: supporting}
      - {reference: moon-2021, role: supporting}
      - {reference: yokose-2018, role: qualifying}

  - id: gaze-evoked-nystagmus-cerebellar
    deficit: gaze-evoked-nystagmus
    title: {en: Gaze-holding failure after unilateral cerebellar infarction, fr: Déficit de maintien du regard après infarctus cérébelleux unilatéral}
    network: {en: Cerebellar contributions to gaze holding, fr: Contributions cérébelleuses au maintien du regard}
    laterality: bilateral
    finding:
      en: Among 47 selected cerebellar-stroke patients with gaze-evoked nystagmus, 25 had direction-changing bilateral and 22 unilateral-direction nystagmus. Lesion overlays implicated overlapping lower and midline cerebellar regions without separating the two patterns. In a nine-patient quantitative study, drift asymmetry varied with caudal vermis/dentate involvement versus hemispheric injury.
      fr: Parmi 47 patients sélectionnés après AVC cérébelleux avec nystagmus évoqué par le regard, 25 avaient un nystagmus bilatéral changeant de direction et 22 dans une seule direction. Les superpositions lésionnelles impliquaient des régions cérébelleuses inférieures et médianes communes sans séparer les deux profils. Dans une étude quantitative de neuf patients, l’asymétrie de dérive variait avec l’atteinte vermienne caudale/dentelée ou hémisphérique.
    limitation:
      en: The 47 patients were selected from 229 cerebellar infarcts and are not an unselected prevalence sample for every stroke. Retrospective overlap/subtraction is not a corrected voxelwise causal map. Spontaneous vestibular nystagmus can mimic unilateral GEN, while the nine-patient study’s combined vermis/dentate lesions do not isolate either structure’s independent effect.
      fr: Les 47 patients étaient sélectionnés parmi 229 infarctus cérébelleux et ne constituent pas un échantillon non sélectionné de prévalence pour tout AVC. Une superposition/soustraction rétrospective n’est pas une carte causale voxel par voxel corrigée. Un nystagmus vestibulaire spontané peut imiter un GEN unilatéral et les lésions vermiennes/dentelées combinées des neuf patients n’isolent pas l’effet indépendant de chaque structure.
    mapping_note:
      en: No cerebellar parcel is selected. Co-injured lower/midline regions and exploratory asymmetry results do not define one sufficient lobule or nucleus. Flipping left lesions to the right for overlays does not establish right-hemisphere dominance, and healthy/animal floccular physiology is not substituted for a directly injured human site.
      fr: Aucune parcelle cérébelleuse n’est sélectionnée. Les régions inférieures/médianes colésées et les résultats exploratoires d’asymétrie ne définissent pas un lobule ou noyau suffisant unique. Retourner les lésions gauches à droite pour les superpositions n’établit pas de dominance droite et la physiologie flocculaire saine/animale ne remplace pas un site humain directement lésé.
    mappings: []
    evidence:
      - {reference: lee-gaze-2020, role: supporting}
      - {reference: romano-2021, role: qualifying}
      - {reference: choi-gaze-2025, role: qualifying}

  - id: gaze-evoked-nystagmus-pontine
    deficit: gaze-evoked-nystagmus
    title: {en: Gaze-evoked nystagmus accompanying pontine gaze palsy, fr: Nystagmus évoqué par le regard associé à une paralysie pontique du regard}
    network: {en: Pontine connections of horizontal gaze-holding pathways, fr: Connexions pontiques des voies de maintien horizontal du regard}
    laterality: bilateral
    finding:
      en: Fourteen of 17 patients with unilateral dorsal pontine lesions and horizontal gaze palsy had gaze-evoked nystagmus. Its direction could be contralesional, bilateral or ipsilesional. Lesion overlays emphasized the vicinity of the abducens nucleus, supporting a pontine association rather than an exclusively cerebellar localization.
      fr: Quatorze des 17 patients avec lésions pontiques dorsales unilatérales et paralysie horizontale avaient un nystagmus évoqué par le regard. Sa direction pouvait être controlésionnelle, bilatérale ou ipsilésionnelle. Les superpositions lésionnelles soulignaient le voisinage du noyau de l’abducens, soutenant une association pontique plutôt qu’une localisation exclusivement cérébelleuse.
    limitation:
      en: Only seven patients had video-oculography; gaze palsy limited calibration and most assessments were bedside. Some apparent GEN could reflect enhancement of spontaneous nystagmus, and one patient also had bilateral cerebellar infarcts. Overlays do not prove a unique nucleus or the proposed fibre mechanism.
      fr: Seuls sept patients avaient une vidéo-oculographie; la paralysie limitait l’étalonnage et la majorité des examens étaient cliniques. Certains GEN apparents pouvaient refléter un renforcement du nystagmus spontané et un patient avait aussi des infarctus cérébelleux bilatéraux. Les superpositions ne prouvent pas un noyau unique ou le mécanisme fibrillaire proposé.
    mapping_note:
      en: Whole left and right pontine territories mark documented dorsal lesions on either side. They greatly exceed the small lesions and do not reconstruct the overlap or separately identify the abducens nucleus, vestibular nuclei or proposed integrator connections. Both sides reflect different cases, not obligatory bilateral damage.
      fr: Les territoires pontiques gauche et droit entiers repèrent les lésions dorsales documentées de chaque côté. Ils dépassent largement les petites lésions et ne reconstruisent ni la superposition ni séparément le noyau de l’abducens, les noyaux vestibulaires ou les connexions intégratrices proposées. Les deux côtés reflètent des cas différents, pas une atteinte bilatérale obligatoire.
    mappings:
      - {region: 'learning:left:pons', source_name: Pontine territory}
      - {region: 'learning:right:pons', source_name: Pontine territory}
    evidence:
      - {reference: choi-gaze-2025, role: supporting}
      - {reference: lee-gaze-2020, role: qualifying}

  - id: language-self-awareness-naming
    deficit: language-self-awareness
    title: {en: Naming self-appraisal and anterior inferior frontal lesions, fr: Autoévaluation de la dénomination et lésions frontales inférieures antérieures}
    network: {en: Intellectual appraisal of word-finding ability, fr: Évaluation intellectuelle des capacités d’accès aux mots}
    laterality: left
    finding:
      en: In 53 chronic left-stroke participants with relatively preserved comprehension, 24 had inaccurate or unreliable naming self-ratings by the study’s criteria. The effective 43-person lesion analysis associated this combined group with a cluster-corrected anterior orbital inferior frontal region. The self-rating groups did not differ in spontaneous speech-error detection in this sample.
      fr: Chez 53 participants après AVC gauche chronique avec compréhension relativement préservée, 24 avaient des autoévaluations de dénomination inexactes ou instables selon les critères de l’étude. L’analyse lésionnelle effective de 43 personnes associait ce groupe combiné à une région frontale inférieure orbitaire antérieure après correction par amas. Les groupes définis par l’autoévaluation ne différaient pas quant à la détection spontanée des erreurs de parole dans cet échantillon.
    limitation:
      en: The combined group included 14 unreliable raters, six reliable overestimators and four reliable underestimators of ability; these are not all denial of impairment. Cutoffs, task selection and premorbid self-perceptions matter. Severe comprehension impairment was excluded, and general word-finding ratings were compared with picture naming, limiting generalization to every aphasia or everyday conversation.
      fr: Le groupe combiné comprenait 14 évaluateurs instables, six surestimant fiablement leurs capacités et quatre les sous-estimant; il ne s’agit pas toujours d’un déni du déficit. Seuils, tâches et perceptions prémorbides comptent. Les troubles sévères de compréhension étaient exclus et les évaluations générales d’accès aux mots comparées à la dénomination d’images, limitant la généralisation à toute aphasie ou conversation quotidienne.
    mapping_note:
      en: The whole left orbital inferior frontal parcel is a coarse landmark for the anterior pars orbitalis cluster, not its exact extent or a universal awareness centre. A separate superior temporal association concerned preserved awareness and is not painted as a deficit site; the unthresholded anterior–posterior gradient is not a corrected lesion map.
      fr: La parcelle frontale inférieure orbitaire gauche entière est un repère grossier pour l’amas de la pars orbitalis antérieure, pas son étendue exacte ou un centre universel de conscience. Une association temporale supérieure distincte concernait une conscience préservée et n’est pas colorée comme site de déficit; le gradient antéropostérieur non seuillé n’est pas une carte lésionnelle corrigée.
    mappings:
      - {region: 'destrieux:left:13', source_name: G_front_inf-Orbital}
    evidence:
      - {reference: van-der-stelt-2021, role: supporting}
      - {reference: cocchini-vata-2010, role: qualifying}
      - {reference: facchetti-2026, role: qualifying}

  - id: language-self-awareness-communication
    deficit: language-self-awareness
    title: {en: Communication ratings and awareness measurement, fr: Évaluations de la communication et mesure de la conscience}
    network: {en: Appraisal of everyday language limitations, fr: Évaluation des limitations langagières quotidiennes}
    laterality: left
    finding:
      en: A visually supported patient/caregiver rating study retained 53 of 65 acquired brain-injury patients and identified ten with clear underrecognition of language difficulties and three borderline cases. A later 66-person left-lesion study found distorted awareness that was not explained solely by the statistical biases examined and found no significant severity–awareness relationship in its sample.
      fr: Une étude d’évaluations patient/aidant avec soutien visuel retenait 53 des 65 patients avec lésions acquises et identifiait dix cas de sous-reconnaissance nette des difficultés langagières et trois cas limites. Une étude ultérieure de 66 personnes avec lésion gauche retrouvait des distorsions de conscience non expliquées par les seuls biais statistiques examinés, sans relation significative sévérité–conscience dans son échantillon.
    limitation:
      en: Caregiver disagreement is not an objective diagnosis by itself. Language comprehension, attention, compliance, rating floors/ceilings and caregiver bias can affect scores. The older study found a severity relationship whereas the newer study did not; different samples and measures preclude treating either as a universal rule or pooling their frequencies.
      fr: Un désaccord avec l’aidant n’est pas en soi un diagnostic objectif. Compréhension, attention, participation, effets plancher/plafond et biais des aidants peuvent affecter les scores. L’ancienne étude trouvait une relation avec la sévérité, contrairement à la récente; échantillons et mesures différents empêchent une règle universelle ou le regroupement des fréquences.
    mapping_note:
      en: No parcel is selected. These communication-rating studies support a clinical phenomenon after predominantly left-sided injury without resolving a focal cortical site. Their questionnaire constructs are not substituted for the separate naming-task lesion result.
      fr: Aucune parcelle n’est sélectionnée. Ces études d’évaluation de la communication soutiennent un phénomène clinique après atteinte surtout gauche sans délimiter un site cortical focal. Leurs construits de questionnaire ne remplacent pas le résultat lésionnel distinct de la tâche de dénomination.
    mappings: []
    evidence:
      - {reference: cocchini-vata-2010, role: supporting}
      - {reference: facchetti-2026, role: supporting}
      - {reference: van-der-stelt-2021, role: qualifying}

  - id: mirror-image-discrimination-parietal
    deficit: mirror-image-discrimination
    title: {en: Reflected-image discrimination after posterior injury, fr: Discrimination des images réfléchies après atteinte postérieure}
    network: {en: Object-based visual directionality, fr: Directionnalité visuelle centrée sur l’objet}
    laterality: right
    finding:
      en: A woman with a small right occipitoparietal hematoma had marked mirror-discrimination slowing at ten days and reduced accuracy at five years, with other experimental orientation conditions preserved at follow-up. A separate right temporoparietal case showed selective mirror errors despite preserved object recognition and orientation judgments. A 34-person parietal-stroke cohort further distinguished mirror from rotation deficits.
      fr: Une femme avec petit hématome occipitopariétal droit avait un ralentissement marqué de discrimination en miroir à dix jours et une précision réduite à cinq ans, avec autres conditions expérimentales d’orientation préservées au suivi. Un cas temporopariétal droit distinct montrait des erreurs sélectives en miroir malgré reconnaissance et jugements d’orientation préservés. Une cohorte de 34 AVC pariétaux distinguait aussi déficits de miroir et de rotation.
    limitation:
      en: The focal case had only four controls, other visuospatial difficulties and a speed–accuracy tradeoff; initial mirror accuracy was not abnormal and rotation conditions were first tested at follow-up; the follow-up accuracy difference was borderline (P = .05). Her dressing difficulty improved despite residual mirror-test impairment, so causation is not established. Small cases and broad cohort associations do not identify a sufficient unique locus.
      fr: Le cas focal n’avait que quatre témoins, d’autres difficultés visuospatiales et un compromis vitesse–précision; la précision initiale en miroir n’était pas anormale et les conditions de rotation étaient testées au suivi seulement; la différence de précision au suivi était limite (P = .05). Les difficultés d’habillage s’amélioraient malgré l’atteinte résiduelle au test du miroir, sans causalité établie. Petits cas et associations de cohorte larges n’identifient pas de site unique suffisant.
    mapping_note:
      en: The whole right intraparietal/transverse parietal sulcal parcel is a coarse landmark for posterior intraparietal involvement in the focal hematoma only. It exceeds the sulcal component and does not reconstruct the extrastriate/angular extension. The broader cohort’s temporal/parietal associations are not converted into additional whole gyri.
      fr: La parcelle des sillons intrapariétal/pariétal transverse droits entière est un repère grossier pour l’atteinte intrapariétale postérieure du seul hématome focal. Elle dépasse la composante sulcale et ne reconstruit pas l’extension extrastriée/angulaire. Les associations temporales/pariétales de la cohorte plus large ne sont pas converties en gyri entiers supplémentaires.
    mappings:
      - {region: 'destrieux:right:57', source_name: S_intrapariet_and_P_trans}
    evidence:
      - {reference: martinaud-2014, role: supporting}
      - {reference: priftis-2003, role: supporting}
      - {reference: martinaud-2016, role: qualifying}

  - id: emotional-facial-paresis-network
    deficit: emotional-facial-paresis
    title: {en: Spontaneous emotional weakness across heterogeneous lesions, fr: Faiblesse émotionnelle spontanée avec lésions hétérogènes}
    network: {en: Emotional facial motor control, fr: Contrôle moteur facial émotionnel}
    laterality: bilateral
    finding:
      en: Seven patients showed impaired emotional facial activation with preserved voluntary movement after heterogeneous frontal white-matter, striatocapsular, thalamic, insular/opercular or mesial temporal injury. A separate right dorsolateral pontine/cerebellar infarct produced left emotional facial paresis despite symmetric activation when showing the teeth on command.
      fr: Sept patients avaient une activation faciale émotionnelle déficitaire avec mouvement volontaire préservé après atteintes hétérogènes de substance blanche frontale, striatocapsulaires, thalamiques, insulaires/operculaires ou temporales médiales. Un infarctus pontique dorsolatéral/cérébelleux droit distinct produisait une parésie émotionnelle gauche malgré une activation symétrique sur commande de montrer les dents.
    limitation:
      en: The cases do not establish a unique emotional-expression centre or a universal side preference. The pontine infarct also involved cerebellum and other pathways and was not an isolated facial-motor lesion. Weak spontaneous facial activation alone does not diagnose impaired emotion recognition, loss of feeling or a particular mood disorder.
      fr: Les cas n’établissent ni centre unique d’expression émotionnelle ni préférence latérale universelle. L’infarctus pontique touchait aussi le cervelet et d’autres voies, sans lésion motrice faciale isolée. Une faible activation faciale spontanée ne diagnostique pas à elle seule un trouble de reconnaissance des émotions, une perte de ressenti ou un trouble particulier de l’humeur.
    mapping_note:
      en: The whole right pontine territory marks only the documented brainstem component of the focal report. It greatly exceeds the dorsolateral tegmental injury and does not reconstruct the cerebellar extension or identify a separate emotional facial tract. The heterogeneous cerebral cases are not converted into additional nuclei or whole gyri.
      fr: Le territoire pontique droit entier repère seulement la composante du tronc documentée dans le cas focal. Il dépasse largement l’atteinte tegmentale dorsolatérale et ne reconstruit ni l’extension cérébelleuse ni un faisceau facial émotionnel distinct. Les cas cérébraux hétérogènes ne deviennent pas des noyaux ou gyri entiers supplémentaires.
    mappings:
      - {region: 'learning:right:pons', source_name: Pontine territory}
    evidence:
      - {reference: hopf-facial-1992, role: supporting}
      - {reference: hopf-emotional-2000, role: supporting}
      - {reference: topper-1995, role: qualifying}

  - id: urinary-retention-medullary
    deficit: post-stroke-urinary-retention
    title: {en: Acute retention with lateral medullary infarction, fr: Rétention aiguë avec infarctus bulbaire latéral}
    network: {en: Medullary course of descending bladder-control pathways, fr: Trajet bulbaire des voies descendantes de contrôle vésical}
    laterality: bilateral
    finding:
      en: Among 31 retrospectively identified isolated lateral medullary infarcts, six cases had neurologically attributed acute retention after local urological exclusions. Four retention cases had right and two left lesions. Lesion analysis associated retention with lateral medullary tegmentum using false-discovery-rate correction.
      fr: Parmi 31 infarctus bulbaires latéraux isolés identifiés rétrospectivement, six cas avaient une rétention aiguë attribuée neurologiquement après exclusions urologiques locales. Quatre cas de rétention avaient des lésions droites et deux gauches. L’analyse lésionnelle associait la rétention au tegmentum bulbaire latéral avec correction du taux de fausses découvertes.
    limitation:
      en: Only one retention case had urodynamics, so detrusor underactivity was not directly verified in all six. Two other patients had prostatic outlet dysfunction and were excluded from neurological attribution. Small retrospective samples and limited recovery data do not support prognosis, a universal right-sided mechanism or attribution of every post-stroke retention episode to the brainstem.
      fr: Un seul cas de rétention avait une urodynamique, donc une hypoactivité détrusorienne n’était pas directement vérifiée chez les six. Deux autres patients avaient une obstruction prostatique et étaient exclus de l’attribution neurologique. Petits échantillons rétrospectifs et suivi limité n’établissent ni pronostic, ni mécanisme universellement droit, ni attribution de toute rétention après AVC au tronc.
    mapping_note:
      en: Whole left and right medullary territories are broad landmarks for lateral tegmental lesions reported on either side. They greatly exceed the corrected cluster and do not directly resolve the proposed descending pontine-to-sacral fibres. Flipping lesions to the left for analysis does not demonstrate left-sided dominance.
      fr: Les territoires bulbaires gauche et droit entiers sont des repères larges pour les lésions tegmentales latérales rapportées de chaque côté. Ils dépassent largement l’amas corrigé et ne délimitent pas directement les fibres pontosacrées descendantes proposées. Retourner les lésions à gauche pour l’analyse ne démontre pas de dominance gauche.
    mappings:
      - {region: 'learning:left:medulla', source_name: Medullary territory}
      - {region: 'learning:right:medulla', source_name: Medullary territory}
    evidence:
      - {reference: prabhakar-2019, role: supporting}
      - {reference: umemura-2016, role: qualifying}
      - {reference: tish-2022, role: qualifying}

  - id: urinary-retention-pontine
    deficit: post-stroke-urinary-retention
    title: {en: Total retention after right pontine tegmental hemorrhage, fr: Rétention totale après hémorragie tegmentale pontique droite}
    network: {en: Pontine contributions to bladder emptying, fr: Contributions pontiques à la vidange vésicale}
    laterality: right
    finding:
      en: A 70-year-old man developed new total retention after right pontine tegmental hemorrhage with midbrain extension. He sensed bladder fullness but failed two voiding trials with residual volumes above one litre. Volitional voiding recovered by about one month; this is a single observed course, not a general recovery estimate.
      fr: Un homme de 70 ans développait une nouvelle rétention totale après hémorragie tegmentale pontique droite avec extension mésencéphalique. Il sentait le remplissage mais échouait à deux essais mictionnels avec résidus supérieurs à un litre. La miction volontaire récupérait vers un mois; ce trajet observé unique n’est pas une estimation générale de récupération.
    limitation:
      en: The hemorrhage and edema extended beyond a small pontine focus, including partly across the midline. One case cannot isolate Barrington’s nucleus or prove exclusive right lateralization. Retention also occurs with medullary, cerebral and cerebellar stroke; non-neurological causes and the clinical context remain relevant.
      fr: L’hémorragie et l’œdème dépassaient un petit foyer pontique et traversaient partiellement la ligne médiane. Un cas n’isole pas le noyau de Barrington et ne prouve pas une latéralisation exclusivement droite. La rétention survient aussi après AVC bulbaires, cérébraux et cérébelleux; causes non neurologiques et contexte clinique restent pertinents.
    mapping_note:
      en: The whole right pontine territory is a coarse landmark for the case’s dominant pontine injury, not an isolated micturition nucleus. It does not reconstruct the midbrain, edema or ventricular extension, and no healthy activation site or animal nucleus is added as a demonstrated human lesion.
      fr: Le territoire pontique droit entier est un repère grossier pour l’atteinte pontique prédominante du cas, pas un noyau mictionnel isolé. Il ne reconstruit ni extension mésencéphalique, ni œdème, ni extension ventriculaire et aucun site d’activation saine ou noyau animal n’est ajouté comme lésion humaine démontrée.
    mappings:
      - {region: 'learning:right:pons', source_name: Pontine territory}
    evidence:
      - {reference: tish-2022, role: supporting}
      - {reference: prabhakar-2019, role: qualifying}
      - {reference: umemura-2016, role: qualifying}

  - id: verbal-memory-left-temporal-surgery
    deficit: material-specific-memory
    title: {en: Verbal memory after left temporal surgery, fr: Mémoire verbale après chirurgie temporale gauche}
    network: {en: Left medial temporal memory system, fr: Système mnésique temporal médial gauche}
    laterality: left
    finding:
      en: Pooled estimates from 23 surgical studies put the risk of verbal memory decline at 44% after left temporal surgery, twice the 20% after right-sided surgery. In an 85-patient cohort followed for six years, verbal learning kept declining for up to two years after left resections, then levelled off.
      fr: Des estimations regroupant 23 études chirurgicales situaient le risque de déclin de la mémoire verbale à 44 % après une chirurgie temporale gauche, soit le double des 20 % après une chirurgie droite. Dans une cohorte de 85 patients suivis six ans, l’apprentissage verbal continuait de décliner jusqu’à deux ans après les résections gauches, puis se stabilisait.
    limitation:
      en: Surgery removes tissue in people whose temporal lobe was already diseased, and the resections combined hippocampus, amygdala and neocortex, so the decline cannot be assigned to one structure. A fifth of patients also declined after right-sided surgery, and self-reported memory sometimes improved where tests showed losses. These estimates describe epilepsy surgery, not stroke or other causes.
      fr: La chirurgie retire du tissu chez des personnes dont le lobe temporal était déjà atteint, et les résections associaient hippocampe, amygdale et néocortex, de sorte que le déclin ne peut être attribué à une seule structure. Un cinquième des patients déclinaient aussi après une chirurgie droite, et la mémoire autoévaluée s’améliorait parfois là où les tests montraient des pertes. Ces estimations décrivent la chirurgie de l’épilepsie, pas l’AVC ni d’autres causes.
    mapping_note:
      en: The whole left hippocampus and temporal pole mark the core of an anterior temporal resection. The six-year cohort's resections also included the amygdala and 2.5 to 8 cm of lateral temporal neocortex, which these parcels do not reconstruct.
      fr: L’hippocampe gauche entier et le pôle temporal gauche repèrent le cœur d’une résection temporale antérieure. Les résections de la cohorte suivie six ans incluaient aussi l’amygdale et 2,5 à 8 cm de néocortex temporal latéral, que ces parcelles ne reconstruisent pas.
    mappings:
      - {region: 'aseg:left:17', source_name: Left-Hippocampus}
      - {region: 'destrieux:left:44', source_name: Pole_temporal}
    evidence:
      - {reference: sherman-2011, role: supporting}
      - {reference: alpherts-2006, role: supporting}

  - id: spatial-memory-right-hippocampus
    deficit: material-specific-memory
    title: {en: Remembering where objects were, fr: Mémoire de l’emplacement des objets}
    network: {en: Right hippocampal spatial memory system, fr: Système mnésique spatial hippocampique droit}
    laterality: right
    finding:
      en: After right temporal-lobe removals that included extensive hippocampal tissue, patients encoded object locations normally but forgot them abnormally fast after a delay. Small right hippocampal thermal lesions impaired object-location recall even for a single object. A meta-analysis of 27 studies found spatial memory impaired after hippocampal damage, with hemisphere effects only for maze learning and object-location memory.
      fr: Après des ablations temporales droites incluant une large part de l’hippocampe, les patients encodaient normalement l’emplacement des objets mais l’oubliaient anormalement vite après un délai. De petites thermolésions hippocampiques droites altéraient le rappel de l’emplacement même pour un seul objet. Une méta-analyse de 27 études montrait une mémoire spatiale altérée après une atteinte hippocampique, avec des effets d’hémisphère seulement pour l’apprentissage de labyrinthes et la localisation d’objets.
    limitation:
      en: Left hippocampal lesions also impaired object-location memory, though less consistently, so spatial memory is not exclusively right-sided. The thermal-lesion groups were small, with four left and ten right cases, and the meta-analysis pooled studies using different tasks.
      fr: Les lésions hippocampiques gauches altéraient aussi la mémoire de localisation, quoique de façon moins constante, donc la mémoire spatiale n’est pas exclusivement droite. Les groupes de thermolésions étaient petits, avec quatre cas gauches et dix droits, et la méta-analyse regroupait des études utilisant des tâches différentes.
    mapping_note:
      en: The whole right hippocampus is a landmark for the resections and thermal lesions. Additional right perirhinal or parahippocampal damage did not add to the thermal-lesion impairment, so those cortices are not coloured.
