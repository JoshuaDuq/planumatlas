      en: The two anterior FreeSurfer callosal subdivisions provide coarse landmarks for the reported anterior injury; their boundaries do not reconstruct the lesions. The bilateral label describes a midline interhemispheric structure, not a requirement for bilateral cortical injury.
      fr: Les deux subdivisions calleuses antérieures FreeSurfer fournissent des repères approximatifs de l’atteinte antérieure rapportée; leurs limites ne reconstruisent pas les lésions. L’étiquette bilatérale décrit une structure interhémisphérique médiane, pas une condition de lésion corticale bilatérale.
