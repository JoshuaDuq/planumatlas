  - id: decision-ventromedial
    deficit: decision-making
    title: {en: Weighing future consequences, fr: Peser les conséquences futures}
    network: {en: Ventromedial prefrontal valuation system, fr: Système de valorisation préfrontal ventromédian}
    laterality: bilateral
    finding:
      en: On a new task simulating real-life decisions under uncertainty, reward and punishment, patients with ventromedial prefrontal damage, unlike controls, seemed oblivious to future consequences and guided by immediate prospects only. In a 344-patient lesion map, value-based decision-making deficits localized to ventromedial prefrontal and orbitofrontal cortex, apart from cognitive control.
      fr: Dans une nouvelle tâche simulant les décisions de la vie réelle sous incertitude, avec récompenses et punitions, les patients avec atteinte préfrontale ventromédiane, contrairement aux témoins, semblaient ignorer les conséquences futures et n’être guidés que par les perspectives immédiates. Dans une cartographie lésionnelle de 344 patients, les déficits de décision fondée sur la valeur se localisaient au cortex préfrontal ventromédian et orbitofrontal, à part du contrôle cognitif.
    limitation:
      en: The 1994 abstract gives no sample size. Fellows and Farah later found that dorsolateral frontal damage also impaired the Iowa gambling task, and that the ventromedial impairment was largely explained by a reversal-learning deficit.
      fr: Le résumé de 1994 n’indique pas l’effectif. Fellows et Farah ont ensuite montré qu’une atteinte frontale dorsolatérale altérait aussi la tâche de jeu de l’Iowa, et que le déficit ventromédian s’expliquait largement par un trouble de l’apprentissage par inversion.
    mapping_note:
      en: The gyrus rectus and medial orbital sulcus approximate ventromedial prefrontal cortex on each side. The supporting studies’ lesion maps do not follow these parcel borders.
      fr: Le gyrus droit et le sillon orbitaire médial représentent approximativement le cortex préfrontal ventromédian de chaque côté. Les cartes lésionnelles des études à l’appui ne suivent pas ces limites de parcelles.
    mappings:
