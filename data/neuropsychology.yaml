  - id: constructional-visual-thalamic
    deficit: constructional-apraxia
    title: {en: Complex figure copying, fr: Copie de figures complexes}
    network: {en: Distributed visuoconstruction network, fr: Réseau distribué de visuoconstruction}
    laterality: bilateral
    finding:
      en: Poor copying had cluster-corrected associations with right fusiform and left lingual damage in every model. Thalamic findings depended on the model; right lingual involvement was weaker or part of a larger fusiform cluster. The right parietal association fell below threshold after neglect adjustment.
      fr: La mauvaise copie était associée aux atteintes fusiforme droite et linguale gauche après correction par amas dans chaque modèle. Les résultats thalamiques dépendaient du modèle; l’implication linguale droite était plus faible ou intégrée à un amas fusiforme plus large. L’association pariétale droite passait sous le seuil après ajustement pour la négligence.
    limitation:
      en: Copying combines several abilities; a low score alone does not establish a selective constructional disorder. Regional findings depended on covariates and cluster correction.
      fr: La copie combine plusieurs capacités; un score faible ne suffit pas à établir un trouble constructif sélectif. Les résultats régionaux dépendaient des covariables et de la correction par amas.
    mapping_note:
      en: Whole thalamic, lingual and right fusiform parcels are approximate landmarks across patients; bilateral injury is not required. Right lingual evidence is model dependent. Component-specific maps are not displayed.
      fr: Les parcelles thalamiques, linguales et fusiforme droite entières sont des repères approximatifs entre patients; une atteinte bilatérale n’est pas requise. Les données linguales droites dépendent du modèle. Les cartes propres aux composantes ne sont pas affichées.
    mappings:
      - {region: 'aseg:left:10', source_name: Left-Thalamus-Proper}
      - {region: 'aseg:right:49', source_name: Right-Thalamus-Proper}
      - {region: 'destrieux:left:22', source_name: G_oc-temp_med-Lingual}
      - {region: 'destrieux:right:22', source_name: G_oc-temp_med-Lingual}
      - {region: 'destrieux:right:21', source_name: G_oc-temp_lat-fusifor}
    evidence:
