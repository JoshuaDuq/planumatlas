    network: {en: Left anterior temporal lexical–semantic system, fr: Système lexico-sémantique temporal antérieur gauche}
    laterality: left
    finding:
      en: In 64 people with post-stroke aphasia, semantic naming errors (horse for goat) were most strongly predicted by lesions of the left anterior to mid middle temporal gyrus, an effect that survived controlling for pre-lexical conceptual deficits.
      fr: Chez 64 personnes avec aphasie post-AVC, les erreurs sémantiques de dénomination (cheval pour chèvre) étaient le mieux prédites par des lésions du gyrus temporal moyen antérieur à moyen gauche, effet persistant après contrôle des déficits conceptuels prélexicaux.
    limitation:
      en: The authors note this casts doubt on the classical linkage of semantic errors to Wernicke’s area. Stroke rarely damages the temporal pole itself, so its contribution is under-sampled.
      fr: Les auteurs soulignent que ce résultat met en doute le lien classique entre erreurs sémantiques et aire de Wernicke. L’AVC touche rarement le pôle temporal lui-même, dont la contribution est donc sous-échantillonnée.
    mapping_note:
      en: The whole middle temporal parcel is shown; the finding concerns its anterior and middle portions, unlike the posterior focus of the comprehension and naming claims above.
      fr: La parcelle temporale moyenne entière est affichée; le résultat concerne ses portions antérieure et moyenne, contrairement au foyer postérieur des associations de compréhension et de dénomination ci-dessus.
