  - id: aprosodia-frontal-parietal
    deficit: aprosodia
    title: {en: Acoustic features of emotional speech after acute stroke, fr: Caractéristiques acoustiques de la parole émotionnelle après AVC aigu}
    network: {en: Right frontal–parietal prosody expression network, fr: Réseau frontal-pariétal droit d’expression prosodique}
    laterality: right
    finding:
      en: Damage to right inferior frontal pars opercularis, supramarginal gyrus and associated white-matter pathways predicted selected acoustic features of emotional speech in regional lesion-load models. Healthy listeners rated the patients’ picture descriptions for emotional expression.
      fr: L’atteinte de la pars opercularis frontale inférieure droite, du gyrus supramarginal et des voies de substance blanche associées prédisait certaines caractéristiques acoustiques de la parole émotionnelle dans des modèles de charge lésionnelle régionale. Des auditeurs sains cotaient l’expression émotionnelle des descriptions d’image des patients.
    limitation:
      en: The 41-patient study assessed selected regions within 48 hours of stroke. No healthy-control speech recordings were analyzed; acoustic abnormalities were defined by the lowest quartile within the patient sample. The small sample and many model predictors limit generalization.
      fr: L’étude de 41 patients évaluait des régions sélectionnées dans les 48 heures suivant l’AVC. Aucun enregistrement de parole témoin n’était analysé; les anomalies acoustiques étaient définies par le quartile inférieur de l’échantillon de patients. Le petit effectif et les nombreux prédicteurs des modèles limitent la généralisation.
    mapping_note:
      en: Right opercular inferior frontal and supramarginal parcels mark the named cortical regions. They do not reproduce lesion-load measurements or delineate the associated white-matter tracts.
      fr: Les parcelles frontale inférieure operculaire et supramarginale droites repèrent les régions corticales nommées. Elles ne reproduisent pas les mesures de charge lésionnelle et ne délimitent pas les faisceaux de substance blanche associés.
    mappings:
      - {region: 'destrieux:right:12', source_name: G_front_inf-Opercular}
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
    evidence:
