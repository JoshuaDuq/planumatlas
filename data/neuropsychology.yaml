  - id: central-pain-pathway
    deficit: central-pain
    title: {en: Pain after disruption of a broader nociceptive pathway, fr: Douleur après atteinte d’une voie nociceptive plus large}
    network: {en: Spinothalamic–thalamocortical nociceptive pathway, fr: Voie nociceptive spinothalamique-thalamocorticale}
    laterality: bilateral
    finding:
      en: Pain-associated lesions overlapped a predefined brainstem-to-cortex nociceptive pathway more than stroke comparison lesions. The ventrocaudal thalamic and adjacent white-matter association was supported in an independent cohort; the combined lesion map also extended to posterior insula and motor cortex.
      fr: Les lésions associées à la douleur chevauchaient davantage une voie nociceptive prédéfinie du tronc au cortex que les lésions témoins d’AVC. L’association avec le thalamus ventrocaudal et la substance blanche voisine était soutenue dans une cohorte indépendante; la carte lésionnelle combinée s’étendait aussi à l’insula postérieure et au cortex moteur.
    limitation:
      en: Discovery controls were identified using one pain-questionnaire item and were not matched for age or lesion side. Network-map validation required relaxed, uncorrected thresholds and was weaker than lesion-location validation. Neither the pathway overlap nor its connected regions constitute a patient-level diagnostic test.
      fr: Les témoins de découverte étaient identifiés par un seul item de questionnaire sur la douleur et n’étaient pas appariés pour l’âge ou le côté lésionnel. La validation des cartes de réseau exigeait des seuils assouplis non corrigés et était plus faible que celle des localisations lésionnelles. Ni le chevauchement de la voie ni ses régions connectées ne constituent un test diagnostique individuel.
    mapping_note:
      en: These bilateral nuclear landmarks bracket the ventrocaudal thalamic finding; they do not isolate VMpo or show the whole pathway. Validation lesions were represented on the right for analysis, so the display does not establish hemispheric dominance.
      fr: Ces repères nucléaires bilatéraux encadrent le constat thalamique ventrocaudal; ils n’isolent pas VMpo et ne montrent pas la voie entière. Les lésions de validation étaient représentées à droite pour l’analyse; l’affichage n’établit donc pas de dominance hémisphérique.
