  - id: parkinsonism-lentiform
    deficit: parkinsonism
    title: {en: Parkinsonism after bilateral lentiform lesions, fr: Syndrome parkinsonien après lésions lenticulaires bilatérales}
    network: {en: Globus pallidus and putamen, fr: Globus pallidus et putamen}
    laterality: bilateral
    finding:
      en: Bilateral lesions of the lentiform nuclei, of the globus pallidus or the putamen, caused parkinsonism in 19% and dystonia-parkinsonism in 6% of cases with bilateral lentiform lesions; across all 240 cases, parkinsonism was uncommon (6%).
      fr: Les lésions bilatérales des noyaux lenticulaires, du globus pallidus ou du putamen, causaient un syndrome parkinsonien dans 19 % et une dystonie-parkinsonisme dans 6 % des cas avec lésions lenticulaires bilatérales; sur l’ensemble des 240 cas, le syndrome parkinsonien restait rare (6 %).
    limitation:
      en: A review of published cases. The abstract does not separate pallidal from putaminal lesions for this outcome.
      fr: Revue de cas publiés. Le résumé ne distingue pas les lésions pallidales des lésions putaminales pour ce résultat.
    mapping_note:
      en: Whole pallidum and putamen mark the lentiform nuclei on both sides, corresponding to the bilateral lesions described for this outcome in the review. This does not establish a bilateral-injury requirement for all lesion-induced parkinsonism.
      fr: Le pallidum et le putamen entiers repèrent les noyaux lenticulaires des deux côtés, conformément aux lésions bilatérales décrites pour ce résultat dans la revue. Cela n’établit pas de condition d’atteinte bilatérale pour tout syndrome parkinsonien d’origine lésionnelle.
