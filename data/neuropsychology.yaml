  - id: fregoli-right-insula
    deficit: fregoli-syndrome
    title: {en: Fregoli syndrome in right-stroke rehabilitation, fr: Syndrome de Frégoli en réadaptation après AVC droit}
    network: {en: Right insular and frontotemporal systems, fr: Systèmes insulaires et frontotemporaux droits}
    laterality: right
    finding:
      en: Ten patients with Fregoli syndrome all had right-hemisphere strokes and left neglect. Compared with 24 patients with right stroke and neglect without misidentification, lesion associations peaked in anterior-inferior right insula and adjacent white matter within a broader frontotemporal and subcortical pattern.
      fr: Dix patients présentant un syndrome de Frégoli avaient tous un AVC hémisphérique droit et une négligence gauche. Comparées à celles de 24 patients avec AVC droit et négligence sans fausse identification, les associations lésionnelles culminaient dans l’insula antéro-inférieure droite et la substance blanche voisine au sein d’un profil frontotemporal et sous-cortical plus large.
    limitation:
      en: Only 10 cases in two rehabilitation hospitals; cases had lower global cognitive scores and more pusher syndrome than controls. Monitoring depended on spontaneous statements, and no Capgras case was detected. These cases involved nonthreatening acquaintance misidentification rather than the full classical disguise presentation. The broader network study concerns mixed misidentification syndromes, not independent replication of this Fregoli-specific insular association.
      fr: Seulement 10 cas dans deux hôpitaux de réadaptation; les cas avaient des scores cognitifs globaux plus bas et davantage de syndrome de poussée que les témoins. Le repérage dépendait des propos spontanés et aucun cas de Capgras n’était détecté. Ces cas impliquaient une fausse reconnaissance non menaçante de connaissances plutôt que l’ensemble de la présentation classique de déguisement. L’étude de réseau plus générale porte sur divers syndromes de fausse identification et ne réplique pas indépendamment cette association insulaire propre à Frégoli.
    mapping_note:
      en: The whole short-insular parcel is a coarse anterior-insular landmark, not the voxel peak or the full lesion pattern. White matter around the uncinate fasciculus and the other implicated regions are not coloured; this map does not apply to all delusional misidentification syndromes.
      fr: La parcelle insulaire courte entière est un repère antérieur approximatif, et non le pic voxelique ni le profil lésionnel complet. La substance blanche autour du faisceau unciné et les autres régions impliquées ne sont pas colorées; cette carte ne s’applique pas à tous les syndromes de fausse identification délirante.
    mappings:
