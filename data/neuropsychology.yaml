  - id: hemianopia-occipital
    deficit: hemianopia
    title: {en: Visual field loss from retrochiasmal lesions, fr: Perte du champ visuel par lésion rétrochiasmatique}
    network: {en: Retrochiasmal visual pathway and occipital cortex, fr: Voie visuelle rétrochiasmatique et cortex occipital}
    laterality: bilateral
    finding:
      en: In 904 homonymous hemianopias, lesions were most often in the occipital lobes (45%) and the optic radiations (32%). Stroke accounted for about 70% of cases, followed by trauma and tumour.
      fr: Sur 904 hémianopsies homonymes, les lésions siégeaient le plus souvent dans les lobes occipitaux (45 %) et les radiations optiques (32 %). L’AVC expliquait environ 70 % des cas, suivi des traumatismes et des tumeurs.
    limitation:
      en: A retrospective neuro-ophthalmology series. The authors note that the shape of a field defect does not reliably indicate a specific lesion site along the pathway.
      fr: Série rétrospective de neuro-ophtalmologie. Les auteurs soulignent que la forme du déficit campimétrique n’indique pas de façon fiable un site lésionnel précis le long de la voie.
    mapping_note:
      en: The calcarine sulcus and occipital pole mark primary visual cortex on each side; a lesion there affects the opposite visual field. The optic radiations have no parcel.
      fr: Le sillon calcarin et le pôle occipital repèrent le cortex visuel primaire de chaque côté; une lésion y affecte le champ visuel opposé. Les radiations optiques n’ont pas de parcelle.
    mappings:
      - {region: 'destrieux:left:45', source_name: S_calcarine}
      - {region: 'destrieux:right:45', source_name: S_calcarine}
      - {region: 'destrieux:left:43', source_name: Pole_occipital}
      - {region: 'destrieux:right:43', source_name: Pole_occipital}
    evidence:
      - {reference: zhang-2006, role: supporting}

  - id: ataxia-nuclei
    deficit: ataxia
    title: {en: 'Limb, posture and gait ataxia from the deep nuclei', fr: 'Ataxie des membres, de la posture et de la marche par les noyaux profonds'}
    network: {en: Cerebellar output nuclei, fr: Noyaux de sortie du cervelet}
    laterality: bilateral
    finding:
      en: Limb ataxia correlated with lesions of the interposed nuclei and part of the dentate nucleus; ataxia of posture and gait with the fastigial nuclei including the interposed nuclei. Nuclear lesions were not fully compensated at any age.
      fr: L’ataxie des membres était corrélée aux lésions des noyaux interposés et d’une partie du noyau dentelé; l’ataxie posturale et de la marche, à celles des noyaux fastigiaux incluant les noyaux interposés. Les lésions nucléaires n’étaient entièrement compensées à aucun âge.
    limitation:
      en: The strongest correlations came from the acute ischaemic subgroup. Ischaemic and surgical lesions, adults and patients operated in childhood were pooled.
      fr: Les corrélations les plus fortes provenaient du sous-groupe ischémique aigu. Lésions ischémiques et chirurgicales, adultes et patients opérés dans l’enfance étaient regroupés.
    mapping_note:
      en: Dentate and interposed nuclei come from the histological reference. The fastigial nucleus has no separate solid here, and cerebellar deficits are ipsilateral to the lesion.
      fr: Les noyaux dentelé et interposés proviennent de la référence histologique. Le noyau fastigial n’a pas de solide distinct ici, et les déficits cérébelleux sont ipsilatéraux à la lésion.
    mappings:
      - {region: 'learning:left:dentate', source_name: Cerebellar dentate nucleus}
      - {region: 'learning:right:dentate', source_name: Cerebellar dentate nucleus}
      - {region: 'learning:left:interposed', source_name: Interposed nuclei}
      - {region: 'learning:right:interposed', source_name: Interposed nuclei}
    evidence:
      - {reference: schoch-2006, role: supporting}

  - id: ataxia-cortex
    deficit: ataxia
    title: {en: Somatotopy of the superior cerebellar cortex, fr: Somatotopie du cortex cérébelleux supérieur}
    network: {en: Anterior and superior cerebellar lobules, fr: Lobules cérébelleux antérieurs et supérieurs}
    laterality: bilateral
    finding:
      en: Cortical correlations were weaker and confined to the superior cerebellum. Upper limb ataxia followed lobules IV–VI, lower limb lobules III and VI, dysarthria paravermal and hemispheral lobules V–VI, and posture and gait vermal lobules II–IV.
      fr: Les corrélations corticales étaient plus faibles et limitées au cervelet supérieur. L’ataxie du membre supérieur suivait les lobules IV–VI, celle du membre inférieur les lobules III et VI, la dysarthrie les lobules paravermiens et hémisphériques V–VI, et la posture et la marche les lobules vermiens II–IV.
    limitation:
      en: Chronic lesions showed far fewer cortical correlations, consistent with compensation. CerebNet’s lobules are drawn whole, so the somatotopy within them is not.
      fr: Les lésions chroniques montraient beaucoup moins de corrélations corticales, ce qui suggère une compensation. Les lobules CerebNet sont affichés entiers, sans la somatotopie qu’ils contiennent.
    mapping_note:
      en: CerebNet lobules I–VI on each side and vermis VI mark the superior cerebellum. Lobules I–V include their vermis, and the paravermal zone is not delineated.
      fr: Les lobules CerebNet I–VI de chaque côté et le vermis VI repèrent le cervelet supérieur. Les lobules I–V incluent leur vermis, et la zone paravermienne n’est pas délimitée.
