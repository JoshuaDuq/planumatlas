    summary:
      en: Difficulty giving reasonable numerical estimates of everyday quantities when the exact answer is unknown. These tasks draw on knowledge and strategic monitoring as well as numerical skills; frontal and right temporal lesion findings are compared separately.
      fr: Difficulté à fournir des estimations numériques plausibles de quantités quotidiennes lorsque la réponse exacte est inconnue. Ces tâches mobilisent les connaissances et le contrôle stratégique ainsi que les habiletés numériques; les résultats lésionnels frontaux et temporaux droits sont comparés séparément.
    aliases:
      en: [cognitive estimation, numerical estimates, implausible estimates, magnitude knowledge, CET-A]
      fr: [estimation cognitive, estimations numériques, estimations invraisemblables, connaissances des grandeurs, CET-A]

  - id: fregoli-syndrome
    name: {en: Fregoli syndrome, fr: Syndrome de Frégoli}
    domain: {en: Person identification and belief, fr: Identification des personnes et croyances}
    group: social-emotional
    summary:
      en: Persistent delusional misidentification of unfamiliar people as known individuals; classical descriptions can involve beliefs about disguise. This profile concerns acquired cases after brain injury, keeping a stroke-specific lesion result separate from broader network evidence about delusional misidentification.
      fr: Fausse identification délirante persistante de personnes inconnues comme des individus connus; les descriptions classiques peuvent impliquer des croyances de déguisement. Ce profil concerne les cas acquis après une lésion cérébrale et distingue un résultat lésionnel après AVC des données de réseau plus générales sur les fausses identifications délirantes.
    aliases:
      en: [Fregoli syndrome, hyperidentification, person misidentification, familiar person in disguise]
      fr: [syndrome de Frégoli, hyperidentification, fausse identification des personnes, personne connue déguisée]

  - id: acquired-anxiety
    name: {en: Anxiety symptoms after brain injury, fr: Symptômes anxieux après une lésion cérébrale}
    domain: {en: Anxiety following acquired structural lesions, fr: Anxiété après des lésions structurelles acquises}
    group: social-emotional
    summary:
      en: Anxiety symptoms after acquired brain injury have associations with temporal-limbic and thalamic lesions. Results depend on the symptom measure, injury population and time since injury; they do not identify one necessary or sufficient anxiety site.
      fr: Les symptômes anxieux après une lésion cérébrale acquise sont associés à des atteintes temporolimbiques et thalamiques. Les résultats dépendent de la mesure, de la population et du délai depuis la lésion; ils ne désignent pas un site nécessaire ou suffisant de l’anxiété.
    aliases:
      en: [acquired anxiety, poststroke anxiety, post-stroke anxiety, post-traumatic anxiety, worry, apprehension, restlessness]
      fr: [anxiété acquise, anxiété après AVC, anxiété post-traumatique, inquiétude, appréhension, agitation anxieuse]

  - id: reduplicative-paramnesia
    name: {en: Reduplicative paramnesia for places, fr: Paramnésie réduplicative des lieux}
    domain: {en: Place identification and belief, fr: Identification des lieux et croyances}
    group: social-emotional
    summary:
      en: Acquired conviction that a place has been duplicated, relocated or merged with another location, maintained despite clear counterevidence. This is a delusional misidentification of place, distinct from ordinary navigational disorientation and from misidentification of people.
      fr: Conviction acquise qu’un lieu a été dupliqué, déplacé ou fusionné avec un autre endroit, maintenue malgré des preuves contraires claires. Cette fausse identification délirante des lieux se distingue d’une désorientation de navigation ordinaire et d’une fausse identification des personnes.
    aliases:
      en: [reduplicative paramnesia, spatial delusions, place reduplication, confabulatory mislocation, chimeric assimilation]
      fr: [paramnésie réduplicative, délires spatiaux, duplication des lieux, fausse localisation confabulatoire, assimilation chimérique]

