  - id: moral-attempted-harm
    deficit: moral-judgement
    title: {en: Judging failed attempts to harm, fr: Juger les tentatives de nuire ayant échoué}
    network: {en: Ventromedial prefrontal valuation system, fr: Système préfrontal ventromédian d’évaluation}
    laterality: bilateral
    finding:
      en: Nine patients with bilateral ventromedial prefrontal damage judged attempted harms, including attempted murder, more permissible than controls did, and more permissible than accidental harms. In an independent group, patients likewise judged attempted harm more permissible and accidental harm less permissible than controls, relying on outcomes rather than intentions.
      fr: Neuf patients ayant une atteinte préfrontale ventromédiane bilatérale jugeaient les tentatives de nuire, y compris une tentative de meurtre, plus permises que les témoins, et plus permises que les torts accidentels. Dans un groupe indépendant, les patients jugeaient de même la tentative de nuire plus permise et le tort accidentel moins permis que les témoins, en se fondant sur l’issue plutôt que sur l’intention.
    limitation:
      en: Five of the nine Iowa patients had also taken part in the earlier dilemma study. Patients still distinguished harmful from neutral intentions in other conditions, so the deficit concerns weighing intentions against outcomes, not a general failure to understand beliefs. The scenarios were hypothetical.
      fr: Cinq des neuf patients de l’Iowa avaient aussi participé à l’étude antérieure sur les dilemmes. Les patients distinguaient encore les intentions nuisibles des intentions neutres dans d’autres conditions, donc le déficit concerne la pondération des intentions par rapport à l’issue, pas une incapacité générale à comprendre les croyances. Les scénarios étaient hypothétiques.
    mapping_note:
      en: The same gyrus rectus landmarks are used; neither study's lesion overlap is reconstructed by these parcels.
      fr: Les mêmes repères du gyrus droit sont utilisés; ces parcelles ne reconstruisent le recouvrement lésionnel d’aucune des deux études.
