      en: [verbal memory, word-list learning, spatial memory, object location, temporal lobectomy, epilepsy surgery]
      fr: [mémoire verbale, apprentissage de listes de mots, mémoire spatiale, localisation d’objets, lobectomie temporale, chirurgie de l’épilepsie]

  - id: semantic-memory
    name: {en: Semantic memory impairment, fr: Trouble de la mémoire sémantique}
    domain: {en: Conceptual knowledge, fr: Connaissances conceptuelles}
