  - id: mania-right-thalamus
    deficit: acquired-mania
    title: {en: Mania after right thalamic infarction, fr: Manie après un infarctus thalamique droit}
    network: {en: Thalamic and distributed mood systems, fr: Systèmes thalamiques et distribués de l’humeur}
    laterality: right
    finding:
      en: Two patients developed secondary mania after right thalamic infarction, with hemisensory loss, denial of illness and amnesia for the manic episode. A pooled analysis of published lesional-mania cases also identified right thalamic involvement among preferential locations.
      fr: Deux patients ont développé une manie secondaire après un infarctus thalamique droit, avec déficit hémisensitif, déni de la maladie et amnésie de l’épisode maniaque. Une analyse groupée de cas publiés de manie lésionnelle identifiait aussi une atteinte thalamique droite parmi les localisations préférentielles.
    limitation:
      en: Selected cases do not establish incidence, a specific thalamic nucleus or that right thalamic injury invariably causes mania. Larger series include heterogeneous right, left and bilateral lesions. The pooled and network literature samples may overlap, and the 2020 studies share investigators; they are not independent replications of the two thalamic cases.
      fr: Des cas sélectionnés n’établissent ni l’incidence, ni un noyau thalamique précis, ni qu’une lésion thalamique droite cause invariablement une manie. Les grandes séries comprennent des lésions hétérogènes droites, gauches et bilatérales. Les échantillons publiés des analyses groupées et de réseau peuvent se chevaucher, et les études de 2020 partagent des chercheurs; ce ne sont pas des réplications indépendantes des deux cas thalamiques.
    mapping_note:
      en: The whole right thalamus marks the infarct location in the two primary cases. No thalamic nucleus is selected, and this landmark is neither a universal mania site nor a map of primary bipolar disorder.
      fr: Le thalamus droit entier repère la localisation de l’infarctus des deux cas primaires. Aucun noyau thalamique n’est sélectionné, et ce repère n’est ni un site universel de la manie ni une carte du trouble bipolaire primaire.
