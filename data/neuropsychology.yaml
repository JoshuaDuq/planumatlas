  - id: adaptation-prism-throwing
    deficit: motor-adaptation
    title: {en: Adapting throws to prism glasses, fr: Adapter le lancer aux lunettes prismatiques}
    network: {en: Olivocerebellar adaptation pathways, fr: Voies olivocérébelleuses d’adaptation}
    laterality: bilateral
    finding:
      en: Patients with focal infarcts in the posterior inferior cerebellar artery territory, the inferior or middle cerebellar peduncle or the contralateral basal pons had impaired or absent prism adaptation when throwing, often with little ataxia. Damage in the superior cerebellar artery territory or cerebellar thalamus usually caused ataxia but spared adaptation.
      fr: Les patients ayant des infarctus focaux du territoire de l’artère cérébelleuse postéro-inférieure, du pédoncule cérébelleux inférieur ou moyen ou de la base du pont controlatérale avaient une adaptation prismatique altérée ou absente lors du lancer, souvent avec peu d’ataxie. Une atteinte du territoire de l’artère cérébelleuse supérieure ou du thalamus cérébelleux causait habituellement une ataxie mais épargnait l’adaptation.
    limitation:
      en: This contrasts with the reaching studies, where superior cerebellar artery infarcts impaired adaptation more; the tasks differ. The abstract gives no patient count, and the study also included generalized cerebellar atrophy.
      fr: Ce résultat contraste avec les études d’atteinte de cibles, où les infarctus de l’artère cérébelleuse supérieure altéraient davantage l’adaptation; les tâches diffèrent. Le résumé n’indique pas l’effectif, et l’étude incluait aussi des atrophies cérébelleuses généralisées.
    mapping_note:
      en: No region is coloured. Arterial territories, cerebellar peduncles and pontine nuclei are not reconstructed by the atlas parcels.
      fr: Aucune région n’est colorée. Les territoires artériels, les pédoncules cérébelleux et les noyaux pontiques ne sont pas reconstruits par les parcelles de l’atlas.
    mappings: []
    evidence:
      - {reference: martin-1996, role: supporting}

  - id: sign-aphasia-left-temporal
    deficit: sign-language-aphasia
    title: {en: Understanding and producing signed language, fr: Comprendre et produire la langue des signes}
    network: {en: Left perisylvian language system, fr: Système langagier périsylvien gauche}
    laterality: left
    finding:
      en: In 23 signers with unilateral lesions, left-hemisphere damage impaired sign language much more than right-hemisphere damage, although signing relies on visuospatial rather than rapid auditory information. In 19 lifelong signers, those with left lesions comprehended worse than those with right lesions on all tasks, and left temporal lobe involvement impaired even single-sign comprehension. In 15 British Sign Language users, left-hemisphere damage impaired every comprehension test. Among 21 deaf signers, sentence comprehension deficits were associated with left temporal-parietal damage, not with left frontal damage.
      fr: Chez 23 signeurs ayant des lésions unilatérales, l’atteinte de l’hémisphère gauche altérait la langue des signes bien plus que l’atteinte droite, bien que la langue des signes repose sur une information visuospatiale plutôt qu’auditive rapide. Chez 19 signeurs de longue date, ceux ayant des lésions gauches comprenaient moins bien que ceux ayant des lésions droites dans toutes les tâches, et l’atteinte du lobe temporal gauche altérait même la compréhension de signes isolés. Chez 15 utilisateurs de la langue des signes britannique, l’atteinte de l’hémisphère gauche altérait toutes les épreuves de compréhension. Parmi 21 signeurs sourds, les déficits de compréhension de phrases étaient associés à une atteinte temporo-pariétale gauche, et non frontale gauche.
    limitation:
      en: Samples were small, and three of the studies come from one research programme whose patients probably overlap. Lesions were classified by hemisphere and lobe or mapped by overlap, without voxelwise statistics, and production and gesture were analysed in only one study. The later lesion analysis found single-sign comprehension spared after left damage, unlike the earlier group study.
      fr: Les échantillons étaient petits, et trois des études proviennent d’un même programme de recherche dont les patients se recoupent probablement. Les lésions étaient classées par hémisphère et par lobe ou cartographiées par recouvrement, sans statistiques voxel par voxel, et la production et les gestes n’étaient analysés que dans une étude. L’analyse lésionnelle ultérieure trouvait la compréhension de signes isolés épargnée après atteinte gauche, contrairement à l’étude de groupe antérieure.
    mapping_note:
      en: The left lateral superior temporal and middle temporal parcels mark the temporal involvement. The temporal-parietal extent and frontal regions are not coloured, and whole parcels exceed the lesions.
      fr: Les parcelles temporale supérieure latérale et temporale moyenne gauches repèrent l’atteinte temporale. L’extension temporo-pariétale et les régions frontales ne sont pas colorées, et les parcelles entières dépassent les lésions.
    mappings:
      - {region: 'destrieux:left:34', source_name: G_temp_sup-Lateral}
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
    evidence:
      - {reference: hickok-1996, role: supporting}
      - {reference: hickok-2002, role: supporting}
      - {reference: atkinson-2005, role: supporting}
      - {reference: rogalsky-2013, role: supporting}

  - id: sign-aphasia-right-spatial
    deficit: sign-language-aphasia
    title: {en: Spatial grammar after right-hemisphere damage, fr: Grammaire spatiale après atteinte de l’hémisphère droit}
    network: {en: Right hemisphere spatial processing, fr: Traitement spatial de l’hémisphère droit}
    laterality: right
    finding:
      en: British Sign Language users with right-hemisphere damage understood nouns, verbs and sentences well but were impaired on sentences describing locations and on classifier constructions, which use signing space to represent spatial relations. In American signers, right-hemisphere damage affected only complex multistep commands, to a degree comparable with hearing patients after right-hemisphere damage.
      fr: Les utilisateurs de la langue des signes britannique ayant une atteinte de l’hémisphère droit comprenaient bien noms, verbes et phrases mais étaient altérés pour les phrases décrivant des positions et les constructions à classificateurs, qui utilisent l’espace de signation pour représenter des relations spatiales. Chez des signeurs américains, l’atteinte droite n’affectait que les consignes complexes à plusieurs étapes, à un degré comparable à celui des patients entendants après une atteinte droite.
    limitation:
      en: The right-hemisphere groups were small, and the abstracts do not localize the damage within the hemisphere.
      fr: Les groupes avec atteinte droite étaient petits, et les résumés ne localisent pas l’atteinte dans l’hémisphère.
    mapping_note:
      en: No region is coloured, because the studies report only hemisphere.
      fr: Aucune région n’est colorée, car les études ne rapportent que l’hémisphère.
    mappings: []
    evidence:
      - {reference: atkinson-2005, role: supporting}
      - {reference: hickok-2002, role: supporting}

  - id: cognitive-impairment-left-thalamus
    deficit: post-stroke-cognitive-impairment
    title: {en: Strategic infarct locations across pooled cohorts, fr: Localisations d’infarctus stratégiques dans des cohortes regroupées}
    network: {en: Distributed strategic locations for cognition, fr: Localisations stratégiques distribuées pour la cognition}
    laterality: left
    finding:
      en: In 2,950 patients pooled from 12 acute ischaemic stroke cohorts, 43.6% had cognitive impairment, and infarcts in the left frontotemporal lobes, left thalamus and right parietal lobe were most strongly associated with it after false-discovery-rate correction. A score of the infarct's location predicted impairment across cohorts about as well as a model adding age, education and infarct volume. In 428 consecutive patients, stroke location was the strongest independent predictor of Montreal Cognitive Assessment scores at three months, confirmed in a replication sample, whereas it did not independently predict disability.
      fr: Chez 2 950 patients regroupés à partir de 12 cohortes d’AVC ischémique aigu, 43,6 % avaient un trouble cognitif, et les infarctus des lobes frontotemporaux gauches, du thalamus gauche et du lobe pariétal droit y étaient le plus fortement associés après correction du taux de fausses découvertes. Un score de localisation de l’infarctus prédisait le trouble d’une cohorte à l’autre presque aussi bien qu’un modèle ajoutant l’âge, la scolarité et le volume de l’infarctus. Chez 428 patients consécutifs, la localisation de l’AVC était le plus fort prédicteur indépendant des scores au Montreal Cognitive Assessment à trois mois, confirmé dans un échantillon de réplication, alors qu’elle ne prédisait pas indépendamment l’incapacité.
    limitation:
      en: Impairment was defined as a low score in at least one domain or on a screening test, so it groups different deficits. Predictions concern risk across groups, not an individual patient's outcome. A published correction replaced one domain-specific image in the pooled study; the global map was unaffected.
      fr: Le trouble était défini par un score faible dans au moins un domaine ou à un test de dépistage, ce qui regroupe des déficits différents. Les prédictions portent sur un risque à l’échelle des groupes, non sur le devenir d’un patient. Une correction publiée remplaçait une image propre à un domaine dans l’étude regroupée; la carte globale n’était pas modifiée.
    mapping_note:
      en: The whole left thalamus marks the thalamic location. The left frontotemporal and right parietal locations are broad lobar descriptions and are not coloured.
      fr: Le thalamus gauche entier repère la localisation thalamique. Les localisations frontotemporale gauche et pariétale droite sont des descriptions lobaires larges et ne sont pas colorées.
    mappings:
      - {region: 'aseg:left:10', source_name: Left-Thalamus-Proper}
    evidence:
      - {reference: weaver-2021, role: supporting}
      - {reference: munsch-2016, role: supporting}

  - id: cognitive-impairment-left-angular
    deficit: post-stroke-cognitive-impairment
    title: {en: Left angular gyrus and basal ganglia, fr: Gyrus angulaire et noyaux gris centraux gauches}
    network: {en: Distributed strategic locations for cognition, fr: Localisations stratégiques distribuées pour la cognition}
    laterality: left
    finding:
      en: In 410 patients with acute ischaemic stroke assessed three to six months later, voxel-level and region-level multivariate analyses both identified the left angular gyrus, left basal ganglia structures and the white matter around the left basal ganglia as strategic for global cognitive impairment.
      fr: Chez 410 patients ayant un AVC ischémique aigu évalués trois à six mois plus tard, les analyses multivariées au niveau des voxels et des régions identifiaient toutes deux le gyrus angulaire gauche, des structures des noyaux gris centraux gauches et la substance blanche qui les entoure comme stratégiques pour le trouble cognitif global.
    limitation:
      en: This cohort may also contribute to the pooled analysis. Global cognition was measured with a screening test, and each cognitive domain had its own, partly overlapping network.
      fr: Cette cohorte peut aussi contribuer à l’analyse regroupée. La cognition globale était mesurée par un test de dépistage, et chaque domaine cognitif avait son propre réseau, en partie chevauchant.
    mapping_note:
      en: The left angular gyrus is coloured. The basal ganglia structures are not specified in the abstract and, with the surrounding white matter, are not coloured.
      fr: Le gyrus angulaire gauche est coloré. Les structures des noyaux gris centraux ne sont pas précisées dans le résumé et, comme la substance blanche environnante, ne sont pas colorées.
    mappings:
      - {region: 'destrieux:left:25', source_name: G_pariet_inf-Angular}
    evidence:
      - {reference: zhao-2018, role: supporting}

  - id: restless-legs-subcortical
    deficit: post-stroke-restless-legs
    title: {en: Restless legs after subcortical and pontine stroke, fr: Jambes sans repos après AVC sous-cortical et pontique}
    network: {en: Subcortical motor and sleep pathways, fr: Voies motrices et du sommeil sous-corticales}
    laterality: bilateral
    finding:
      en: Among 137 ischaemic stroke patients assessed at one month, 17 (12.4%) developed restless legs, including 10 of 33 with basal ganglia or corona radiata infarcts and 4 of 18 with pontine lesions, but only 1 of 54 with cortical lesions. In 244 prospectively assessed patients, 14 (5.7%) developed it, 12 after subcortical and 2 after cortical stroke, most often with pontine, basal ganglia or corona radiata lesions. Among 244 lacunar infarcts it occurred in 5.33%, mainly with pontine, centrum semiovale and basal ganglia lesions. A systematic review of 19 brainstem-stroke cases found mostly pontine infarcts, usually with symptoms on the side opposite the lesion.
      fr: Parmi 137 patients ayant un AVC ischémique évalués à un mois, 17 (12,4 %) développaient des jambes sans repos, dont 10 des 33 ayant un infarctus des noyaux gris centraux ou de la couronne rayonnante et 4 des 18 ayant une lésion pontique, mais seulement 1 des 54 ayant une lésion corticale. Chez 244 patients évalués prospectivement, 14 (5,7 %) le développaient, 12 après un AVC sous-cortical et 2 après un AVC cortical, le plus souvent avec des lésions pontiques, des noyaux gris centraux ou de la couronne rayonnante. Parmi 244 infarctus lacunaires, il survenait dans 5,33 % des cas, surtout avec des lésions pontiques, du centre semi-ovale et des noyaux gris centraux. Une revue systématique de 19 cas d’AVC du tronc cérébral trouvait surtout des infarctus pontiques, avec des symptômes généralement du côté opposé à la lésion.
    limitation:
      en: Case numbers were small, diagnosis relied on clinical criteria and one cohort was retrospective. Symptoms were often one-sided and frequently resolved within weeks to three months, unlike idiopathic restless legs. Location categories were broad, and diabetes was proposed as a risk factor in one cohort.
      fr: Les cas étaient peu nombreux, le diagnostic reposait sur des critères cliniques et une cohorte était rétrospective. Les symptômes étaient souvent unilatéraux et disparaissaient fréquemment en quelques semaines à trois mois, contrairement aux jambes sans repos idiopathiques. Les catégories de localisation étaient larges, et le diabète était proposé comme facteur de risque dans une cohorte.
    mapping_note:
      en: Left and right pontine territories mark the brainstem lesions. The basal ganglia and corona radiata category is too broad to assign to a nucleus and is not coloured.
      fr: Les territoires pontiques gauche et droit repèrent les lésions du tronc cérébral. La catégorie noyaux gris centraux et couronne rayonnante est trop large pour être attribuée à un noyau et n’est pas colorée.
    mappings:
      - {region: 'learning:left:pons', source_name: Pontine territory}
      - {region: 'learning:right:pons', source_name: Pontine territory}
    evidence:
      - {reference: lee-2009, role: supporting}
      - {reference: zorgor-2022, role: supporting}
      - {reference: tuo-2019, role: supporting}
      - {reference: kalampokini-2022, role: supporting}

  - id: tga-hippocampal-ca1
    deficit: transient-global-amnesia
    title: {en: Punctate CA1 lesions during the episode, fr: Lésions ponctuelles de CA1 pendant l’épisode}
    network: {en: Hippocampal memory system, fr: Système mnésique hippocampique}
    laterality: bilateral
    finding:
      en: In 41 patients imaged serially at 3 T, 29 had 36 hippocampal diffusion lesions within 48 hours, 34 of them (94%) in the CA1 sector; verbal memory deficits went with lesions in the dominant hemisphere and visuospatial deficits with the non-dominant side. In 31 consecutive patients, 26 developed a small punctate lesion in the lateral hippocampus (15 left, 6 right, 5 bilateral), rarely visible in the first hours but regularly by 48 hours. In 38 consecutive patients reviewed retrospectively, 47% had hippocampal lesions, mostly in CA1.
      fr: Chez 41 patients imagés en série à 3 T, 29 présentaient 36 lésions hippocampiques en diffusion dans les 48 heures, dont 34 (94 %) dans le secteur CA1; les déficits de mémoire verbale accompagnaient les lésions de l’hémisphère dominant et les déficits visuospatiaux celles du côté non dominant. Chez 31 patients consécutifs, 26 développaient une petite lésion ponctuelle de l’hippocampe latéral (15 gauches, 6 droites, 5 bilatérales), rarement visible dans les premières heures mais régulièrement à 48 heures. Chez 38 patients consécutifs revus rétrospectivement, 47 % avaient des lésions hippocampiques, surtout dans CA1.
    limitation:
      en: The lesions mark the episode; they do not show that it is a stroke or that the lesion alone causes the amnesia, and their cause remains unknown. Detection varied from about half to most patients with timing and imaging. At four to six months there were neither residual lesions nor persistent memory deficits, so the episode is not a model of permanent amnesia.
      fr: Les lésions signalent l’épisode; elles ne montrent pas qu’il s’agit d’un AVC ni que la lésion seule cause l’amnésie, et leur cause reste inconnue. La détection variait d’environ la moitié à la plupart des patients selon le moment et l’imagerie. À quatre à six mois, il n’y avait ni lésion résiduelle ni déficit mnésique persistant, de sorte que l’épisode n’est pas un modèle d’amnésie permanente.
    mapping_note:
      en: Whole left and right hippocampi mark the CA1 lesions on either side, which are only millimetres across.
      fr: Les hippocampes gauche et droit entiers repèrent les lésions de CA1 de chaque côté, qui ne mesurent que quelques millimètres.
    mappings:
      - {region: 'aseg:left:17', source_name: Left-Hippocampus}
      - {region: 'aseg:right:53', source_name: Right-Hippocampus}
    evidence:
      - {reference: bartsch-2006, role: supporting}
      - {reference: sedlaczek-2004, role: supporting}
      - {reference: golenia-2023, role: supporting}

  - id: tga-autobiographical
    deficit: transient-global-amnesia
    title: {en: Recalling one's own past during the episode, fr: Se rappeler son propre passé pendant l’épisode}
    network: {en: Hippocampal memory system, fr: Système mnésique hippocampique}
    laterality: bilateral
    finding:
      en: In 16 patients tested during the episode, 14 with CA1 lesions, retrieval of autobiographical memories was impaired across all life periods, and the loss of episodic detail showed a temporal gradient extending 30 to 40 years into the past.
      fr: Chez 16 patients évalués pendant l’épisode, dont 14 avec des lésions de CA1, le rappel des souvenirs autobiographiques était altéré pour toutes les périodes de vie, et la perte des détails épisodiques suivait un gradient temporel remontant 30 à 40 ans en arrière.
    limitation:
      en: A single study from the same group as the largest lesion series, tested during a transient state; it does not show permanent loss of remote memories.
      fr: Une seule étude du même groupe que la plus grande série lésionnelle, réalisée pendant un état transitoire; elle ne montre pas de perte permanente des souvenirs anciens.
    mapping_note:
      en: The same whole hippocampi mark the CA1 lesions.
      fr: Les mêmes hippocampes entiers repèrent les lésions de CA1.
    mappings:
      - {region: 'aseg:left:17', source_name: Left-Hippocampus}
      - {region: 'aseg:right:53', source_name: Right-Hippocampus}
    evidence:
      - {reference: bartsch-2011, role: supporting}

  - id: pure-sensory-thalamus
    deficit: pure-sensory-stroke
    title: {en: Lateral thalamic lacunes, fr: Lacunes thalamiques latérales}
    network: {en: Thalamic somatosensory relay, fr: Relais somatosensoriel thalamique}
    laterality: bilateral
    finding:
      en: In a prospective registry of 2,500 acute strokes, 99 patients (4.7%) had pure sensory stroke, most often from thalamic lacunar infarcts. Of 21 cases with visible lesions, 11 were thalamic, nine with lacunes confined to the posterolateral thalamus; loss of all sensory modalities went with larger lateral thalamic lesions, and restricted loss with very small ones. In 25 patients with thalamic stroke and only sensory signs, the inferolateral thalamus was involved in all, and paresthesias and pain went with damage to the ventrocaudal nucleus. Two cases studied pathologically had lacunes in the sensory nucleus of the thalamus opposite the symptoms.
      fr: Dans un registre prospectif de 2 500 AVC aigus, 99 patients (4,7 %) avaient un AVC sensitif pur, le plus souvent dû à un infarctus lacunaire thalamique. Sur 21 cas avec lésion visible, 11 étaient thalamiques, dont neuf avec des lacunes limitées au thalamus postérolatéral; la perte de toutes les modalités sensitives accompagnait des lésions thalamiques latérales plus grandes, et une perte restreinte de très petites lésions. Chez 25 patients ayant un AVC thalamique avec des signes uniquement sensitifs, le thalamus inférolatéral était touché chez tous, et paresthésies et douleur accompagnaient l’atteinte du noyau ventrocaudal. Deux cas étudiés en neuropathologie présentaient des lacunes du noyau sensitif du thalamus opposé aux symptômes.
    limitation:
      en: Pure sensory stroke also followed lenticulocapsular, corona radiata, pontine and small cortical lesions, so a thalamic cause is not certain in an individual. Small lesions can be missed on imaging, and the thalamic nuclear names follow an older nomenclature.
      fr: L’AVC sensitif pur suivait aussi des lésions lenticulocapsulaires, de la couronne rayonnante, pontiques et corticales de petite taille, de sorte qu’une cause thalamique n’est pas certaine chez un individu. De petites lésions peuvent échapper à l’imagerie, et les noms des noyaux thalamiques suivent une ancienne nomenclature.
    mapping_note:
      en: NextBrain's caudal ventral posterior lateral and ventral posterior medial nuclei approximate the ventrocaudal nucleus and are shown in the histological view. The other locations are not coloured.
      fr: Les noyaux ventral postérieur latéral caudal et ventral postérieur médian de NextBrain représentent approximativement le noyau ventrocaudal et sont visibles dans la vue histologique. Les autres localisations ne sont pas colorées.
    mappings:
      - {region: 'nextbrain:left:458', source_name: caudal_division_of_ventral_posterior_lateral_nucleus}
      - {region: 'nextbrain:right:10458', source_name: caudal_division_of_ventral_posterior_lateral_nucleus}
      - {region: 'nextbrain:left:423', source_name: ventral_posterior_medial_nucleus}
      - {region: 'nextbrain:right:10423', source_name: ventral_posterior_medial_nucleus}
    evidence:
      - {reference: arboix-2005, role: supporting}
      - {reference: kim-1992, role: supporting}
      - {reference: paciaroni-1998, role: supporting}
      - {reference: fisher-1978, role: supporting}

  - id: ataxic-hemiparesis-deep
    deficit: ataxic-hemiparesis
    title: {en: Small deep infarcts in varied locations, fr: Petits infarctus profonds de localisations variées}
    network: {en: Corticospinal and cerebellar pathways, fr: Voies corticospinales et cérébelleuses}
    laterality: bilateral
    finding:
      en: Among 100 consecutive first strokes with ataxic hemiparesis from two registries, lesions lay in the internal capsule (39%), pons (19%), thalamus (13%), corona radiata (13%), lentiform nucleus (8%), cerebellum (4%) and frontal cortex (4%), with almost identical clinical features across locations. In 45 new cases reviewed with the literature, the syndrome predicted a small deep infarction, most often in the pons or internal capsule, and only sensory loss predicted a capsular location.
      fr: Parmi 100 premiers AVC consécutifs avec hémiparésie ataxique issus de deux registres, les lésions siégeaient dans la capsule interne (39 %), le pont (19 %), le thalamus (13 %), la couronne rayonnante (13 %), le noyau lenticulaire (8 %), le cervelet (4 %) et le cortex frontal (4 %), avec des signes cliniques presque identiques d’une localisation à l’autre. Dans 45 nouveaux cas examinés avec la littérature, le syndrome prédisait un petit infarctus profond, le plus souvent pontique ou capsulaire, et seule une perte sensitive prédisait une localisation capsulaire.
    limitation:
      en: No single location is established. In the 100-patient series, 14% had no visible lesion, a quarter had a potential embolic source, and only about half met criteria for a lacunar infarct. About two-thirds of the 45 new cases had other ischaemic lesions on imaging.
      fr: Aucune localisation unique n’est établie. Dans la série de 100 patients, 14 % n’avaient pas de lésion visible, un quart avait une source embolique potentielle, et environ la moitié seulement répondait aux critères d’infarctus lacunaire. Environ les deux tiers des 45 nouveaux cas avaient d’autres lésions ischémiques à l’imagerie.
    mapping_note:
      en: Left and right pontine territories mark the pontine lesions. The internal capsule, the most common location, is white matter without its own parcel here, and it and the other sites are not coloured.
      fr: Les territoires pontiques gauche et droit repèrent les lésions pontiques. La capsule interne, localisation la plus fréquente, est de la substance blanche sans parcelle propre ici, et elle comme les autres sites ne sont pas colorés.
    mappings:
      - {region: 'learning:left:pons', source_name: Pontine territory}
      - {region: 'learning:right:pons', source_name: Pontine territory}
    evidence:
      - {reference: moulin-1995, role: supporting}
      - {reference: gorman-1998, role: supporting}

  - id: sma-motor
    deficit: sma-syndrome
    title: {en: Reduced spontaneous movement after resection, fr: Réduction des mouvements spontanés après résection}
    network: {en: Medial frontal motor initiation system, fr: Système frontal médian d’initiation motrice}
    laterality: bilateral
    finding:
      en: Of 23 patients undergoing medial frontal resection, 11 developed a global reduction of spontaneous movement on the side opposite the surgery, which occurred when the activated posterior part of the supplementary motor area was removed; all recovered within weeks or months. In 28 patients followed prospectively, 25 had new deficits immediately after surgery that depended on the extent of resection and resolved within 3 to 42 days. In 11 patients, the pattern of deficit followed a posterior-to-anterior order of leg, arm, face and, on the left, language representation.
      fr: Sur 23 patients opérés d’une lésion frontale médiane, 11 développaient une réduction globale des mouvements spontanés du côté opposé à la chirurgie, survenant lorsque la partie postérieure activée de l’aire motrice supplémentaire était retirée; tous récupéraient en quelques semaines ou mois. Chez 28 patients suivis prospectivement, 25 avaient de nouveaux déficits immédiatement après la chirurgie, dépendant de l’étendue de la résection et disparaissant en 3 à 42 jours. Chez 11 patients, le profil du déficit suivait un ordre postéro-antérieur de représentation de la jambe, du bras, du visage et, à gauche, du langage.
    limitation:
      en: These are surgical series in patients with tumours or epilepsy, whose function may already have reorganized; three of the papers come from one surgical group. The deficit is transient, so it does not describe a lasting stroke syndrome, and minor slowing of fine movements could persist on demanding tasks.
      fr: Il s’agit de séries chirurgicales de patients ayant une tumeur ou une épilepsie, dont la fonction a pu se réorganiser; trois des articles proviennent d’un même groupe chirurgical. Le déficit est transitoire, donc il ne décrit pas un syndrome d’AVC durable, et un léger ralentissement des mouvements fins pouvait persister lors de tâches exigeantes.
    mapping_note:
      en: The superior frontal gyri on both sides mark the supplementary motor area on the medial surface for resections on either side. The parcels also include dorsolateral cortex and do not separate the posterior supplementary motor area from the pre-supplementary area.
      fr: Les gyri frontaux supérieurs des deux côtés repèrent l’aire motrice supplémentaire sur la face médiane pour des résections de chaque côté. Les parcelles incluent aussi le cortex dorsolatéral et ne séparent pas l’aire motrice supplémentaire postérieure de l’aire présupplémentaire.
    mappings:
      - {region: 'destrieux:left:16', source_name: G_front_sup}
      - {region: 'destrieux:right:16', source_name: G_front_sup}
    evidence:
      - {reference: krainik-2001, role: supporting}
      - {reference: zentner-1996, role: supporting}
      - {reference: fontaine-2002, role: supporting}

  - id: sma-speech
    deficit: sma-syndrome
    title: {en: Reduced spontaneous speech after dominant-side resection, fr: Réduction de la parole spontanée après résection du côté dominant}
    network: {en: Dominant medial frontal speech initiation, fr: Initiation de la parole frontale médiane dominante}
    laterality: left
    finding:
      en: Of 12 patients with medial frontal glioma, six developed a global reduction of spontaneous speech, from mutism to milder reduction, recovering within weeks or months; it was related to removing the supplementary motor area activated in the language-dominant hemisphere.
      fr: Sur 12 patients ayant un gliome frontal médian, six développaient une réduction globale de la parole spontanée, du mutisme à une réduction plus légère, avec récupération en quelques semaines ou mois; elle était liée au retrait de l’aire motrice supplémentaire activée dans l’hémisphère dominant pour le langage.
    limitation:
      en: A small surgical sample from the same group as the motor and somatotopy studies; language dominance was established with fMRI, and some patients had increased activation in the opposite hemisphere before surgery.
      fr: Petit échantillon chirurgical du même groupe que les études motrice et somatotopique; la dominance langagière était établie par IRMf, et certains patients avaient une activation accrue dans l’hémisphère opposé avant la chirurgie.
    mapping_note:
      en: The left superior frontal gyrus marks the dominant supplementary motor area in the usual case of left-hemisphere language dominance.
      fr: Le gyrus frontal supérieur gauche repère l’aire motrice supplémentaire dominante dans le cas habituel d’une dominance langagière gauche.
    mappings:
      - {region: 'destrieux:left:16', source_name: G_front_sup}
    evidence:
      - {reference: krainik-2003, role: supporting}
      - {reference: fontaine-2002, role: supporting}

  - id: recollection-hippocampus
    deficit: recollection-familiarity
    title: {en: Recollection after hippocampal damage, fr: Recollection après atteinte hippocampique}
    network: {en: Hippocampal recollection system, fr: Système hippocampique de recollection}
    laterality: bilateral
    finding:
      en: Patients with mild hypoxia, which disrupts the hippocampus, showed impaired recollection, whereas familiarity-based recognition depended on the surrounding temporal lobe, by three convergent methods. After left- or right-sided stereotactic amygdalohippocampotomy, 10 patients showed isolated recollection impairments with preserved familiarity.
      fr: Des patients ayant une hypoxie légère, qui perturbe l’hippocampe, présentaient une recollection altérée, alors que la reconnaissance fondée sur la familiarité dépendait du lobe temporal environnant, selon trois méthodes convergentes. Après une amygdalo-hippocampotomie stéréotaxique gauche ou droite, 10 patients présentaient des déficits isolés de recollection avec une familiarité préservée.
    limitation:
      en: Another group found that patients with limited hippocampal lesions showed the same receiver-operating pattern as controls once overall memory strength was matched, arguing that the hippocampus supports both processes. The dissociation depends on how recollection and familiarity are estimated.
      fr: Un autre groupe trouvait que des patients ayant des lésions hippocampiques limitées présentaient le même profil de courbes ROC que les témoins une fois la force mnésique globale égalisée, ce qui suggère que l’hippocampe soutient les deux processus. La dissociation dépend de la façon d’estimer recollection et familiarité.
    mapping_note:
      en: Whole left and right hippocampi mark the hypoxic and surgical damage. Hypoxic injury is not confined to the hippocampus.
      fr: Les hippocampes gauche et droit entiers repèrent l’atteinte hypoxique et chirurgicale. L’atteinte hypoxique ne se limite pas à l’hippocampe.
    mappings:
      - {region: 'aseg:left:17', source_name: Left-Hippocampus}
      - {region: 'aseg:right:53', source_name: Right-Hippocampus}
    evidence:
      - {reference: yonelinas-2002, role: supporting}
      - {reference: bowles-2010, role: supporting}
      - {reference: wais-2006, role: qualifying}

  - id: recollection-mammillary
    deficit: recollection-familiarity
    title: {en: Recall after mammillary body atrophy, fr: Rappel après atrophie des corps mamillaires}
    network: {en: Extended hippocampal system, fr: Système hippocampique étendu}
    laterality: bilateral
    finding:
      en: After colloid cyst removal, nine patients with more mammillary body atrophy were impaired on recall and recall-based recognition but had intact familiarity, whereas nine with less atrophy were not; a dual-process model best explained the memory pattern of all 62 patients.
      fr: Après ablation d’un kyste colloïde, neuf patients ayant une atrophie plus marquée des corps mamillaires étaient altérés pour le rappel et la reconnaissance fondée sur le rappel mais avaient une familiarité intacte, contrairement à neuf patients moins atrophiés; un modèle à double processus expliquait le mieux le profil mnésique des 62 patients.
    limitation:
      en: Atrophy was graded rather than lesions being focal, the fornix is also affected after colloid cyst surgery, and the study shares an author with the hypoxia study.
      fr: L’atrophie était graduée plutôt que les lésions focales, le fornix est aussi touché après chirurgie d’un kyste colloïde, et l’étude partage un auteur avec l’étude sur l’hypoxie.
    mapping_note:
      en: The mammillary nuclei on both sides mark the atrophied structures; the fornix is not coloured here.
      fr: Les noyaux mamillaires des deux côtés repèrent les structures atrophiées; le fornix n’est pas coloré ici.
    mappings:
      - {region: 'learning:left:mammillary', source_name: Mammillary nuclei}
      - {region: 'learning:right:mammillary', source_name: Mammillary nuclei}
    evidence:
      - {reference: vann-2009, role: supporting}

  - id: familiarity-perirhinal
    deficit: recollection-familiarity
    title: {en: Familiarity after perirhinal resection, fr: Familiarité après résection périrhinale}
    network: {en: Perirhinal familiarity system, fr: Système périrhinal de familiarité}
    laterality: left
    finding:
      en: A woman whose left anterior temporal resection removed much of perirhinal cortex but spared the hippocampus showed impaired familiarity with preserved recollection across four experiments using three procedures. The amygdalohippocampotomy group showed the reverse at comparable overall memory strength.
      fr: Une femme dont la résection temporale antérieure gauche avait retiré une grande partie du cortex périrhinal en épargnant l’hippocampe présentait une familiarité altérée avec une recollection préservée dans quatre expériences utilisant trois procédures. Le groupe ayant subi une amygdalo-hippocampotomie présentait le profil inverse à force mnésique globale comparable.
    limitation:
      en: The familiarity deficit rests on a single patient with long-standing epilepsy.
      fr: Le déficit de familiarité repose sur une seule patiente ayant une épilepsie ancienne.
    mapping_note:
      en: The left parahippocampal gyrus parcel is a coarse landmark for perirhinal cortex, which has no separate parcel here.
      fr: La parcelle du gyrus parahippocampique gauche est un repère grossier du cortex périrhinal, qui n’a pas de parcelle distincte ici.
    mappings:
      - {region: 'destrieux:left:23', source_name: G_oc-temp_med-Parahip}
    evidence:
      - {reference: bowles-2007, role: supporting}
      - {reference: bowles-2010, role: supporting}

  - id: action-naming-left-frontal
    deficit: action-naming
    title: {en: Naming actions with verbs, fr: Nommer des actions par des verbes}
    network: {en: Left frontotemporal verb retrieval system, fr: Système frontotemporal gauche de récupération des verbes}
    laterality: left
    finding:
      en: Of 78 patients from a focal-lesion registry, 16 failed a test of naming actions shown in video clips, 15 with left-hemisphere damage; the left frontal operculum was the most frequently damaged area, and posterolateral temporal-occipital damage near MT was specifically related to naming dynamic actions. Performance on dynamic and static action naming was highly correlated. In 16 left-hemisphere stroke patients, voxel-based mapping associated verb naming with a region from left prefrontal to superior temporal cortex, larger than the superior temporal region for nouns.
      fr: Sur 78 patients d’un registre de lésions focales, 16 échouaient à un test de dénomination d’actions présentées en vidéo, dont 15 avec une atteinte de l’hémisphère gauche; l’opercule frontal gauche était la zone la plus souvent atteinte, et une atteinte temporo-occipitale postérolatérale proche de MT était spécifiquement liée à la dénomination d’actions dynamiques. Les performances de dénomination d’actions dynamiques et statiques étaient fortement corrélées. Chez 16 patients ayant un AVC gauche, la cartographie voxel par voxel associait la dénomination de verbes à une région allant du cortex préfrontal au cortex temporal supérieur gauches, plus étendue que la région temporale supérieure des noms.
    limitation:
      en: The registry analysis described the most frequent damage among failing patients rather than testing each voxel, and the voxel-based study had only 16 patients. Verb naming also depends on overall aphasia severity.
      fr: L’analyse du registre décrivait l’atteinte la plus fréquente chez les patients en échec plutôt que de tester chaque voxel, et l’étude voxel par voxel ne comptait que 16 patients. La dénomination de verbes dépend aussi de la sévérité globale de l’aphasie.
    mapping_note:
      en: The left opercular inferior frontal parcel marks the frontal operculum. The temporal-occipital area near MT and the superior temporal extent are not coloured.
      fr: La parcelle frontale inférieure operculaire gauche repère l’opercule frontal. La zone temporo-occipitale proche de MT et l’extension temporale supérieure ne sont pas colorées.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
    evidence:
      - {reference: tranel-2008, role: supporting}
      - {reference: piras-2007, role: supporting}

  - id: object-colour-knowledge-temporal
    deficit: object-colour-knowledge
    title: {en: Knowing an object’s typical colour, fr: Connaître la couleur habituelle d’un objet}
    network: {en: Temporal and occipital colour-knowledge systems, fr: Systèmes temporaux et occipitaux des connaissances chromatiques}
    laterality: bilateral
    finding:
      en: Two brain-injured patients had impaired object-colour knowledge despite preserved colour perception and naming; one also retained knowledge of object form, size and function. An independent stroke case, AC, showed the same colour-knowledge dissociation with injury including left lingual and medial fusiform cortex.
      fr: Deux patients cérébrolésés avaient des connaissances altérées sur la couleur des objets malgré une perception et une dénomination des couleurs préservées; l’un conservait aussi les connaissances sur la forme, la taille et la fonction des objets. Un cas indépendant d’AVC, AC, présentait la même dissociation des connaissances chromatiques avec une lésion comprenant les cortex lingual et fusiforme médial gauches.
    limitation:
      en: These are selected cases, not a focal lesion map. The first report gives only a broad left mesial temporal localization in its abstract, and one patient had other knowledge deficits. AC also had white-matter and bilateral cingulate-isthmus injury, alexia, naming problems and visual-field impairment. Neither coloured parcel is established as an isolated colour-knowledge centre.
      fr: Il s’agit de cas sélectionnés, et non d’une cartographie lésionnelle focale. Le résumé du premier rapport donne seulement une localisation temporale mésiale gauche large, et un patient avait d’autres déficits de connaissances. AC avait aussi une atteinte de la substance blanche et de l’isthme cingulaire bilatéral, une alexie, des difficultés de dénomination et un déficit du champ visuel. Aucune parcelle colorée n’est établie comme centre isolé des connaissances chromatiques.
    mapping_note:
      en: The whole left fusiform and lingual parcels mark portions of AC’s larger lesion. Bilateral laterality acknowledges accompanying bilateral cingulate injury; the right homologues are not coloured. The map does not display the complete lesion or a necessary and sufficient substrate for the deficit.
      fr: Les parcelles fusiforme et linguale gauches entières repèrent des portions de la lésion plus étendue d’AC. La latéralité bilatérale tient compte de l’atteinte cingulaire bilatérale associée; les homologues droits ne sont pas colorés. La carte ne représente ni la lésion complète ni un substrat nécessaire et suffisant du déficit.
    mappings:
      - {region: 'destrieux:left:21', source_name: G_oc-temp_lat-fusifor}
      - {region: 'destrieux:left:22', source_name: G_oc-temp_med-Lingual}
    evidence:
      - {reference: miceli-2001, role: supporting}
      - {reference: stasenko-2014, role: supporting}

  - id: spatial-relations-categorical
    deficit: spatial-relations
    title: {en: Matching categorical spatial relations, fr: Apparier des relations spatiales catégorielles}
    network: {en: Frontoparietal spatial-relation systems, fr: Systèmes frontopariétaux des relations spatiales}
    laterality: left
    finding:
      en: In 34 chronic unilateral-lesion patients, categorical picture-matching deficits were associated with left angular and supramarginal, posterior frontal and subjacent temporal white-matter damage. A separate 78-patient study of locative-preposition knowledge found greatest lesion overlap in the left frontal operculum, supramarginal gyrus and subjacent white matter.
      fr: Chez 34 patients ayant une lésion unilatérale chronique, les déficits d’appariement catégoriel d’images étaient associés à une atteinte des gyri angulaire et supramarginal gauches, de régions frontales postérieures et de la substance blanche temporale sous-jacente. Une étude distincte de 78 patients portant sur les prépositions locatives trouvait le chevauchement lésionnel maximal dans l’opercule frontal gauche, le gyrus supramarginal et la substance blanche sous-jacente.
    limitation:
      en: Nonverbal matching and spatial-language tests are complementary tasks, not exact replications. The first study also found right-sided associations and shared categorical/metric contributions; its residual categorical-only association involved left temporal white matter. The focused six-patient analysis in the preposition study is not an additional independent sample.
      fr: L’appariement non verbal et les tests de langage spatial sont des tâches complémentaires, pas des réplications exactes. La première étude trouvait aussi des associations droites et des contributions communes aux relations catégorielles et métriques; son association résiduelle propre aux relations catégorielles concernait la substance blanche temporale gauche. L’analyse ciblée de six patients dans l’étude des prépositions n’est pas un échantillon indépendant supplémentaire.
    mapping_note:
      en: The whole left angular and supramarginal parcels orient the reader to the categorical-task associations. They are not uniquely categorical centres. Frontal subdivisions and temporal white matter are not coloured; this finding selects left-sided associations without asserting an exclusively left-sided system.
      fr: Les parcelles angulaire et supramarginale gauches entières servent de repères aux associations de la tâche catégorielle. Ce ne sont pas des centres exclusivement catégoriels. Les subdivisions frontales et la substance blanche temporale ne sont pas colorées; ce résultat sélectionne les associations gauches sans affirmer que le système est exclusivement gauche.
    mappings:
      - {region: 'destrieux:left:25', source_name: G_pariet_inf-Angular}
