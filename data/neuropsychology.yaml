  - id: kluver-bucy-hippocampus
    deficit: kluver-bucy
    title: {en: Hippocampal injury after encephalitis and status epilepticus, fr: Atteinte hippocampique après encéphalite et état de mal épileptique}
    network: {en: Bilateral hippocampal regions, fr: Régions hippocampiques bilatérales}
    laterality: bilateral
    finding:
      en: Park’s patient developed hyperphagia, altered sexual behavior, hypermetamorphosis and severe memory impairment after seizure recovery. Serial MRI showed bilateral hippocampal swelling followed by atrophy; cognitive dysfunction persisted at six months.
      fr: Après récupération de l’état de mal, le patient de Park présentait hyperphagie, comportement sexuel modifié, hypermétamorphose et trouble mnésique sévère. Les IRM montraient un gonflement puis une atrophie hippocampique bilatérale; les troubles cognitifs persistaient à six mois.
    limitation:
      en: One case of unidentified encephalitis and prolonged seizures. MRI could not exclude microscopic or functional injury elsewhere; FDG-PET was not performed. Hayman’s broader injury pattern also limits generalization. Hippocampal injury alone was not shown necessary or sufficient.
      fr: Cas unique d’encéphalite indéterminée et de crises prolongées. L’IRM n’excluait pas d’atteinte microscopique ou fonctionnelle ailleurs; aucune TEP-FDG n’a été réalisée. Les lésions plus étendues de Hayman limitent aussi la généralisation. La nécessité ou la suffisance d’une atteinte hippocampique isolée n’est pas démontrée.
    mapping_note:
      en: Whole hippocampi mark the reported atrophy without isolating initial CA1-predominant changes. The two findings do not imply that hippocampi and amygdalae must all be damaged together.
      fr: Les hippocampes entiers repèrent l’atrophie rapportée sans isoler les anomalies initiales prédominant dans CA1. Les deux constats n’impliquent pas une atteinte nécessairement conjointe des hippocampes et des amygdales.
