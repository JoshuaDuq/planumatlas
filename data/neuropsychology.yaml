  - id: topographical-medial-temporal
    deficit: topographical-disorientation
    title: {en: Familiar-route navigation after medial temporal injury, fr: Navigation en terrain familier après atteinte temporale médiale}
    network: {en: Right medial temporal and distributed navigation network, fr: Réseau temporal médial droit et réseau distribué de navigation}
    laterality: right
    finding:
      en: Seven patients lost their way in familiar environments despite preserved general spatial orientation. Descriptive lesion overlap centred on right posterior parahippocampal cortex, with lingual, retrosplenial and fusiform involvement. A separate analysis of 65 published lesions supported a distributed navigation network.
      fr: Sept patients se perdaient dans des environnements familiers malgré une orientation spatiale générale préservée. Le chevauchement lésionnel descriptif était centré sur le cortex parahippocampique postérieur droit, avec atteintes linguale, rétrospléniale et fusiforme. Une analyse distincte de 65 lésions publiées soutenait un réseau distribué de navigation.
    limitation:
      en: The seven-patient study was retrospective and did not statistically compare direct-lesion overlap with its seven controls. Normative network connections, including bilateral sites, do not show that each connected region was injured or that one site alone explains disorientation.
      fr: L’étude de sept patients était rétrospective et ne comparait pas statistiquement le chevauchement des lésions directes à celui des sept témoins. Les connexions normatives du réseau, notamment bilatérales, ne montrent pas que chaque région connectée était lésée ni qu’un seul site explique la désorientation.
    mapping_note:
      en: Right parahippocampal and lingual parcels mark selected directly involved regions in Blondiaux’s cohort. They exceed the focal lesions, do not isolate posterior parahippocampal cortex, and do not display the broader connectivity maps from either study.
      fr: Les parcelles parahippocampique et linguale droites repèrent des régions directement atteintes sélectionnées dans la cohorte de Blondiaux. Elles dépassent les lésions focales, n’isolent pas le cortex parahippocampique postérieur et n’affichent pas les cartes de connectivité plus larges des deux études.
    mappings:
      - {region: 'destrieux:right:23', source_name: G_oc-temp_med-Parahip}
      - {region: 'destrieux:right:22', source_name: G_oc-temp_med-Lingual}
    evidence:
      - {reference: blondiaux-2024, role: supporting}
      - {reference: roseman-2024, role: qualifying}

  - id: cerebellar-cognitive-posterior
    deficit: cerebellar-cognitive
    title: {en: Posterior lobe and vermis, fr: Lobe postérieur et vermis}
    network: {en: Cerebellar posterior lobe and cerebro-cerebellar loops, fr: Lobe cérébelleux postérieur et boucles cérébro-cérébelleuses}
    laterality: bilateral
    finding:
      en: In 20 patients with disease confined to the cerebellum, executive, visuospatial, linguistic and personality changes were prominent with posterior lobe and vermis involvement, whereas anterior lobe lesions produced only minor executive and visuospatial changes.
      fr: Chez 20 patients avec maladie limitée au cervelet, des changements exécutifs, visuospatiaux, langagiers et de personnalité étaient marqués en cas d’atteinte du lobe postérieur et du vermis, alors que les lésions du lobe antérieur ne produisaient que des changements exécutifs et visuospatiaux mineurs.
    limitation:
      en: The abstract does not break down the cerebellar diseases. Assessment relied on neurological examination, bedside mental state tests, neuropsychological studies and anatomical imaging rather than voxelwise mapping.
      fr: Le résumé ne détaille pas les maladies cérébelleuses. L’évaluation reposait sur l’examen neurologique, des tests de l’état mental au lit du malade, des études neuropsychologiques et l’imagerie anatomique plutôt que sur une cartographie voxel par voxel.
    mapping_note:
      en: CerebNet’s posterior lobe (lobules VI–IX on each side) and vermis VI–X are shown. The anterior vermis is part of lobules I–V there, so it is not shown, and the flocculus is left out.
