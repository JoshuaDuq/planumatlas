  - id: tactile-agnosia-persistence
    deficit: tactile-agnosia
    title: {en: Persistent tactile object-recognition loss after stroke, fr: Trouble persistant de reconnaissance tactile des objets après AVC}
    network: {en: Supramarginal cortex and haptic exploration pathways, fr: Cortex supramarginal et voies d’exploration haptique}
    laterality: right
    finding:
      en: Of 14 patients with early tactile object-recognition impairment, seven remained impaired at nine months. Persistent impairment was associated with rostral inferior parietal injury and greater estimated disruption of the anterior arcuate and superior longitudinal III pathways linking parietal and premotor regions.
      fr: Parmi 14 patients avec trouble précoce de reconnaissance tactile des objets, sept restaient déficitaires à neuf mois. Le trouble persistant était associé à une atteinte pariétale inférieure rostrale et à une déconnexion estimée plus importante des voies arquée antérieure et longitudinale supérieure III reliant les régions pariétales et prémotrices.
    limitation:
      en: Patients were selected for hand paresis, so the study does not isolate agnosia from elementary sensorimotor impairment. Tracts were estimated from ten healthy participants. Small subgroup analyses and permutation-based prediction estimates do not constitute validation in an independent patient cohort.
      fr: Les patients étaient sélectionnés pour parésie de la main; l’étude n’isole donc pas l’agnosie d’un trouble sensorimoteur élémentaire. Les faisceaux étaient estimés chez dix participants sains. Les petits sous-groupes et les estimations prédictives par permutation ne constituent pas une validation dans une cohorte indépendante.
    mapping_note:
      en: The right supramarginal parcel marks the named cortical region in the reported right-hemisphere subgroup. It does not isolate area PFt or display tract disconnection. The cohort also included left-sided strokes; this landmark does not establish right-hemisphere dominance for tactile recognition.
      fr: La parcelle supramarginale droite repère la région corticale nommée dans le sous-groupe hémisphérique droit rapporté. Elle n’isole pas l’aire PFt et n’affiche pas la déconnexion des faisceaux. La cohorte comprenait aussi des AVC gauches; ce repère n’établit pas de dominance droite pour la reconnaissance tactile.
    mappings:
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
    evidence:
      - {reference: missimer-2022, role: supporting}

  - id: word-deafness-auditory
    deficit: word-deafness
    title: {en: Auditory cortical injury and spoken words, fr: Atteinte corticale auditive et mots entendus}
    network: {en: Temporal auditory speech network, fr: Réseau temporal auditif de la parole}
    laterality: bilateral
    finding:
      en: A patient with bilateral primary auditory cortical infarcts had impaired speech comprehension and repetition but preserved environmental-sound recognition, reading, writing and spontaneous speech.
      fr: Un patient avec infarctus corticaux auditifs primaires bilatéraux présentait une compréhension orale et une répétition altérées, avec reconnaissance des bruits, lecture, écriture et parole spontanée préservées.
    limitation:
      en: Single-case evidence. Maffei’s unilateral left temporal case had partial cortical and pathway damage; bilateral cortical destruction is not required in every case.
      fr: Données de cas unique. Le cas temporal gauche unilatéral de Maffei associait atteintes partielles du cortex et des voies; la destruction corticale bilatérale n’est pas nécessaire dans tous les cas.
    mapping_note:
      en: Transverse temporal gyri mark the bilateral auditory territories in the first report. These anatomical parcels do not define primary auditory cortex exactly or map the qualifying case’s disconnections.
      fr: Les gyrus temporaux transverses repèrent les territoires auditifs bilatéraux du premier rapport. Ces parcelles anatomiques ne définissent pas exactement le cortex auditif primaire et ne cartographient pas les déconnexions du cas contrastant.
    mappings:
      - {region: 'destrieux:left:33', source_name: G_temp_sup-G_T_transv}
      - {region: 'destrieux:right:33', source_name: G_temp_sup-G_T_transv}
    evidence:
      - {reference: coslett-1984, role: supporting}
      - {reference: maffei-2017, role: qualifying}

