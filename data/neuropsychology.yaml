  - id: spatial-relations-metric
    deficit: spatial-relations
    title: {en: Matching metric distances between objects, fr: Apparier les distances métriques entre objets}
    network: {en: Temporal spatial-relation systems, fr: Systèmes temporaux des relations spatiales}
    laterality: right
    finding:
      en: In the same 34-patient lesion experiment, impaired matching of metric distances was associated with right middle temporal damage, including after accounting for categorical-task performance. Left angular and inferior frontal damage also contributed to metric-task deficits.
      fr: Dans la même expérience lésionnelle de 34 patients, un appariement altéré des distances métriques était associé à une atteinte temporale moyenne droite, y compris après prise en compte de la performance catégorielle. Une atteinte angulaire et frontale inférieure gauche contribuait aussi aux déficits de la tâche métrique.
    limitation:
      en: This is a task-specific association from one cohort, not a universal right-hemisphere rule. Tranel and Kemmerer’s patients could have impaired spatial-preposition knowledge without basic spatial-processing impairment; their verbal task does not independently replicate this metric localization.
      fr: Il s’agit d’une association propre à une tâche dans une seule cohorte, et non d’une règle universelle de l’hémisphère droit. Les patients de Tranel et Kemmerer pouvaient avoir des connaissances altérées des prépositions spatiales sans déficit du traitement spatial élémentaire; leur tâche verbale ne réplique pas indépendamment cette localisation métrique.
    mapping_note:
      en: The whole right middle temporal gyrus is a coarse landmark for the reported association, not a lesion mask. Left-sided contributions and white-matter anatomy are not represented by this selected right-sided finding.
      fr: Le gyrus temporal moyen droit entier est un repère grossier de l’association rapportée, et non un masque lésionnel. Les contributions gauches et l’anatomie de la substance blanche ne sont pas représentées par ce résultat droit sélectionné.
