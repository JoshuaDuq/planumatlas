    laterality: bilateral
    finding:
      en: Forty-one literature lesions associated with mania had heterogeneous locations but a shared normative connectivity pattern involving right orbitofrontal cortex, inferior temporal gyrus and frontal pole. The pattern was reproduced in an independent 15-patient clinical cohort.
      fr: Quarante et une lésions publiées associées à une manie avaient des localisations hétérogènes mais un profil commun de connectivité normative impliquant le cortex orbitofrontal, le gyrus temporal inférieur et le pôle frontal droits. Le profil était reproduit dans une cohorte clinique indépendante de 15 patients.
    limitation:
      en: Connectivity came from healthy participants rather than measurements in each patient. Connected nodes were not necessarily injured. A separate pooled analysis supports right-sided predominance with exceptions, but shares investigators and potentially published cases; its counts must not be added as an independent cohort.
      fr: La connectivité provenait de sujets sains plutôt que de mesures chez chaque patient. Les nœuds connectés n’étaient pas nécessairement lésés. Une analyse groupée distincte soutient une prédominance droite avec des exceptions, mais partage des chercheurs et potentiellement des cas publiés; ses effectifs ne doivent pas être ajoutés comme une cohorte indépendante.
    mapping_note:
      en: No parcel is coloured. The right orbitofrontal, inferior temporal and frontal-pole nodes describe normative connections, not direct lesion sites; the separate thalamic finding supplies the profile’s anatomical landmark.
      fr: Aucune parcelle n’est colorée. Les nœuds orbitofrontal, temporal inférieur et polaire frontal droits décrivent des connexions normatives, et non des sites directement lésés; le résultat thalamique distinct fournit le repère anatomique du profil.
