  - id: moral-personal-dilemmas
    deficit: moral-judgement
    title: {en: Endorsing personal harm in moral dilemmas, fr: Approuver un tort personnel dans les dilemmes moraux}
    network: {en: Ventromedial prefrontal valuation system, fr: Système préfrontal ventromédian d’évaluation}
    laterality: bilateral
    finding:
      en: Six patients with bilateral ventromedial prefrontal damage more often endorsed harming one person to save several in high-conflict personal dilemmas, with normal judgements on other dilemma types. An independent group of seven patients approved personal moral violations more often and more quickly; a later study from that group found that patients lacked the anticipatory skin-conductance responses controls showed before such approvals. A further Iowa sample showed the pattern for indirect harms and for dilemmas framed from another person's perspective.
      fr: Six patients ayant une atteinte préfrontale ventromédiane bilatérale approuvaient plus souvent de nuire à une personne pour en sauver plusieurs dans des dilemmes personnels très conflictuels, avec des jugements normaux pour les autres types de dilemmes. Un groupe indépendant de sept patients approuvait plus souvent et plus rapidement des transgressions morales personnelles; une étude ultérieure de cette équipe montrait que les patients n’avaient pas les réponses anticipatoires de conductance cutanée que les témoins présentaient avant de telles approbations. Un autre échantillon de l’Iowa montrait ce profil pour les torts indirects et pour les dilemmes formulés du point de vue d’une autre personne.
    limitation:
      en: Samples were small, and the Iowa studies draw on one patient registry, so their patients may overlap. Judgements concerned hypothetical scenarios and do not show how patients act in real situations. The pattern was selective, with normal judgements on impersonal and other dilemma types, and in the further Iowa sample every group judged harm by another person more acceptable than harm by themselves.
      fr: Les échantillons étaient petits, et les études de l’Iowa proviennent d’un même registre de patients, qui peuvent donc se recouper. Les jugements portaient sur des scénarios hypothétiques et ne montrent pas comment les patients agissent en situation réelle. Le profil était sélectif, avec des jugements normaux pour les dilemmes impersonnels et d’autres types de dilemmes, et dans l’autre échantillon de l’Iowa tous les groupes jugeaient un tort commis par autrui plus acceptable qu’un tort commis par eux-mêmes.
    mapping_note:
      en: Both gyri recti mark the ventromedial prefrontal region where the lesions overlapped. The lesions, from orbitofrontal meningioma resection or anterior communicating artery aneurysm rupture in one sample, varied in extent and are not reconstructed by these parcels.
      fr: Les deux gyri droits repèrent la région préfrontale ventromédiane où les lésions se recoupaient. Les lésions, dues à la résection d’un méningiome orbitofrontal ou à la rupture d’un anévrisme de l’artère communicante antérieure dans un échantillon, variaient en étendue et ne sont pas reconstruites par ces parcelles.
    mappings:
      - {region: 'destrieux:left:31', source_name: G_rectus}
      - {region: 'destrieux:right:31', source_name: G_rectus}
    evidence:
