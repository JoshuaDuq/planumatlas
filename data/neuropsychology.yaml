      fr: Difficultés langagières acquises chez des personnes sourdes signeuses après une lésion cérébrale. Ce profil montre qu’une atteinte de l’hémisphère gauche perturbe la langue des signes comme elle perturbe la langue orale, alors que certains aspects spatiaux de la langue des signes dépendent de l’hémisphère droit.
