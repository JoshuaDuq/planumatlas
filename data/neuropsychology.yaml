    group: sensorimotor
    summary:
      en: Brief involuntary lapses in sustained muscle contraction. This profile concerns asterixis after focal brain injury; the same sign can also accompany metabolic illness or medication effects.
      fr: Interruptions brèves et involontaires d’une contraction musculaire soutenue. Ce profil concerne l’astérixis après lésion cérébrale focale; le même signe peut aussi accompagner une maladie métabolique ou un effet médicamenteux.
    aliases:
