  - id: fear-conditioning-amygdala
    deficit: fear-conditioning
    title: {en: Learning a conditioned fear response, fr: Apprentissage d’une réponse de peur conditionnée}
    network: {en: Amygdala emotional learning system, fr: Système amygdalien d’apprentissage émotionnel}
    laterality: bilateral
    finding:
      en: A patient with selective bilateral amygdala damage did not acquire conditioned autonomic responses but learned which stimulus was paired with the aversive event; a patient with bilateral hippocampal damage showed the reverse. After unilateral temporal lobectomy, patients acquired conditioned responses less well than controls, which sensory, autonomic or declarative-memory differences did not explain. In 30 lobectomy patients, conditioning was impaired regardless of the side operated on.
      fr: Un patient ayant une atteinte bilatérale sélective de l’amygdale n’acquérait pas de réponses autonomes conditionnées mais apprenait quel stimulus était associé à l’événement aversif; un patient ayant une atteinte hippocampique bilatérale montrait le profil inverse. Après une lobectomie temporale unilatérale, les patients acquéraient moins bien les réponses conditionnées que les témoins, sans que des différences sensorielles, autonomes ou de mémoire déclarative l’expliquent. Chez 30 patients opérés, le conditionnement était altéré quel que soit le côté opéré.
    limitation:
      en: The evidence comes from single cases and epilepsy-surgery cohorts. Lobectomy removes more than the amygdala, and in the 30-patient study those who became aware of the stimulus pairing showed normal skin-conductance discrimination but no fear-potentiated startle, so the result depends on the response measured. Laboratory conditioning does not show how fear or anxiety behave in daily life.
      fr: Les données proviennent de cas uniques et de cohortes de chirurgie de l’épilepsie. La lobectomie retire davantage que l’amygdale, et dans l’étude de 30 patients ceux qui prenaient conscience de l’association montraient une discrimination normale de la conductance cutanée mais aucune potentialisation du sursaut par la peur, donc le résultat dépend de la réponse mesurée. Le conditionnement en laboratoire ne montre pas comment la peur ou l’anxiété se manifestent au quotidien.
    mapping_note:
      en: Both whole amygdalae mark the structure common to these lesions. The lobectomies were unilateral and also removed hippocampus and anterior temporal cortex; the hippocampal comparison case is not coloured.
      fr: Les deux amygdales entières repèrent la structure commune à ces lésions. Les lobectomies étaient unilatérales et retiraient aussi l’hippocampe et le cortex temporal antérieur; le cas hippocampique de comparaison n’est pas coloré.
