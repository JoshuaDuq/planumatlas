  - id: fluid-multiple-demand
    deficit: fluid-intelligence
    title: {en: Novel problem solving and multiple-demand cortex, fr: Résolution de problèmes nouveaux et cortex à demandes multiples}
    network: {en: Frontoparietal multiple-demand system, fr: Système frontopariétal à demandes multiples}
    laterality: bilateral
    finding:
      en: In 80 patients with focal frontal or posterior cortical lesions, fluid intelligence loss relative to estimated premorbid ability increased with damage to multiple-demand regions and not with damage elsewhere. These regions are the lateral prefrontal cortex around the inferior frontal sulcus, anterior insula and frontal operculum, dorsal anterior cingulate and pre-supplementary motor area, anterior frontal cortex and intraparietal sulcus. In 44 frontal patients, deficits on Wisconsin card sorting and similar classic executive tests were fully explained by lower fluid intelligence.
      fr: Chez 80 patients ayant des lésions corticales focales frontales ou postérieures, la perte d’intelligence fluide par rapport au niveau prémorbide estimé augmentait avec l’atteinte des régions à demandes multiples, et non avec l’atteinte d’autres régions. Ces régions sont le cortex préfrontal latéral autour du sillon frontal inférieur, l’insula antérieure et l’opercule frontal, le cingulaire antérieur dorsal et l’aire prémotrice supplémentaire, le cortex frontal antérieur et le sillon intrapariétal. Chez 44 patients frontaux, les déficits au tri de cartes du Wisconsin et à des tests exécutifs classiques semblables s’expliquaient entièrement par une intelligence fluide plus faible.
    limitation:
      en: A published correction weakens the frontal-group result. Multiple-demand damage predicted the deficit in 44 frontal patients but not after damage outside those regions was partialled out; the authors state the conclusions are unaffected. The regions were defined from healthy imaging, and both studies drew patients from the same research panels. Patients with overt aphasia or visual field loss were excluded.
      fr: Une correction publiée affaiblit le résultat du groupe frontal. L’atteinte des régions à demandes multiples prédisait le déficit chez 44 patients frontaux, mais plus après avoir neutralisé l’atteinte hors de ces régions; les auteurs indiquent que les conclusions ne sont pas modifiées. Les régions étaient définies par l’imagerie de sujets sains, et les deux études recrutaient leurs patients dans les mêmes panels de recherche. Les patients ayant une aphasie manifeste ou une perte du champ visuel étaient exclus.
    mapping_note:
      en: The inferior frontal and intraparietal sulci on both sides mark two of the five multiple-demand regions. The insular-opercular, cingulate, pre-supplementary motor and anterior frontal regions are not coloured, and the regions were mirrored to both hemispheres by design rather than found bilaterally.
      fr: Les sillons frontal inférieur et intrapariétal des deux côtés repèrent deux des cinq régions à demandes multiples. Les régions insulo-operculaire, cingulaire, prémotrice supplémentaire et frontale antérieure ne sont pas colorées, et les régions étaient reproduites dans les deux hémisphères par construction plutôt que trouvées bilatéralement.
