  - id: holmes-tremor-thalamic-case
    deficit: holmes-tremor
    title: {en: Thalamic injury within a varied lesion series, fr: Lésion thalamique dans une série anatomiquement variée}
    network: {en: Distributed motor control, fr: Contrôle moteur distribué}
    laterality: right
    finding:
      en: A 29-person series found frequent midbrain, thalamic and cerebellar involvement, often affecting several regions. One explicitly described case had a small right lateral thalamic lesion with Holmes tremor, weakness, sensory loss and dystonia.
      fr: Une série de 29 personnes retrouvait fréquemment des atteintes mésencéphaliques, thalamiques et cérébelleuses, souvent plurirégionales. Un cas explicitement décrit avait une petite lésion thalamique latérale droite avec tremblement de Holmes, faiblesse, perte sensitive et dystonie.
    limitation:
      en: This retrospective mixed-age series does not isolate a necessary tremor site. Associated deficits and multi-region injuries limit attribution; thalamic involvement was absent in some cases. The network study is complementary evidence and may reuse published cases.
      fr: Cette série rétrospective d’âges variés n’isole pas de site nécessaire au tremblement. Les déficits associés et les lésions plurirégionales limitent l’attribution; certains cas n’avaient pas d’atteinte thalamique. L’étude de réseau est complémentaire et peut réutiliser des cas publiés.
    mapping_note:
      en: The whole right thalamus marks the focal case described in the main text. It exceeds the lateral lesion, does not identify a particular nucleus and does not imply right-hemisphere specialization or reproduce the other patients’ injuries.
      fr: Le thalamus droit entier repère le cas focal décrit dans le texte principal. Il dépasse la lésion latérale, n’identifie pas de noyau précis et n’implique ni spécialisation de l’hémisphère droit ni reproduction des lésions des autres patients.
    mappings:
      - {region: 'aseg:right:49', source_name: Right-Thalamus-Proper}
    evidence:
      - {reference: raina-2016, role: supporting}
      - {reference: joutsa-2019, role: qualifying}

  - id: holmes-tremor-network
    deficit: holmes-tremor
    title: {en: Connectivity of stroke-associated tremor lesions, fr: Connectivité des lésions associées au tremblement après AVC}
    network: {en: 'Thalamic, pallidal, brainstem and cerebellar connectivity', fr: 'Connectivité thalamique, pallidale, du tronc cérébral et cérébelleuse'}
    laterality: bilateral
    finding:
      en: Lesions from 36 published stroke cases shared normative connectivity to eight regions, including red nucleus, internal pallidum, thalamic nuclei and cerebellar territories. These were connected nodes, not eight sites directly injured in every patient.
      fr: Les lésions de 36 cas publiés après AVC partageaient une connectivité normative avec huit régions, dont le noyau rouge, le pallidum interne, des noyaux thalamiques et des territoires cérébelleux. Il s’agissait de nœuds connectés, pas de huit sites directement lésés chez chaque patient.
    limitation:
      en: Lesions were reconstructed from published two-dimensional images and connectivity came from healthy volunteers. Selection and publication bias remain; neither network membership nor a treatment response proves that damaging a node will produce the syndrome.
      fr: Les lésions étaient reconstruites à partir d’images bidimensionnelles publiées et la connectivité provenait de volontaires sains. Les biais de sélection et de publication persistent; ni l’appartenance au réseau ni une réponse thérapeutique ne prouvent qu’une lésion d’un nœud produira le syndrome.
    mapping_note:
      en: No parcel is coloured for normative connectivity alone. Direct thalamic injury is represented separately by the clinical-series finding; network nodes are not added to the lesion-overlap report as directly injured regions.
      fr: Aucune parcelle n’est colorée pour la seule connectivité normative. L’atteinte thalamique directe est représentée séparément par le constat de la série clinique; les nœuds du réseau ne sont pas ajoutés au rapport de chevauchement lésionnel comme régions directement lésées.
    mappings: []
    evidence:
      - {reference: joutsa-2019, role: supporting}

  - id: asterixis-thalamic
    deficit: asterixis
    title: {en: Thalamic and other focal lesions, fr: Lésions thalamiques et autres lésions focales}
    network: {en: Posture-maintenance systems, fr: Systèmes de maintien postural}
    laterality: left
    finding:
      en: Two structural-lesion series found frequent thalamic involvement, while also reporting other sites. A separate illustrated case described right arm asterixis with a left anterior thalamic haemorrhage.
      fr: Deux séries de lésions structurales retrouvaient fréquemment une atteinte thalamique, tout en rapportant d’autres sites. Un cas illustré distinct décrivait un astérixis du bras droit avec hémorragie thalamique antérieure gauche.
    limitation:
      en: Selected lesion series do not establish prevalence or a necessary thalamic site. A separate 103-person study found systemic and medication-related causes as well. Unilateral stroke can produce bilateral asterixis; cerebellar cases can be ipsilateral.
      fr: Des séries lésionnelles sélectionnées n’établissent ni prévalence ni site thalamique nécessaire. Une étude distincte de 103 personnes retrouvait aussi des causes systémiques et médicamenteuses. Un AVC unilatéral peut produire un astérixis bilatéral; les cas cérébelleux peuvent être ipsilatéraux.
    mapping_note:
      en: The left thalamus marks only the anatomically explicit haemorrhage case. The whole parcel exceeds the anterior lesion and its intraventricular extension is omitted. Unspecified sides and frontal subdivisions in the series are not assigned parcels.
      fr: Le thalamus gauche repère seulement le cas hémorragique anatomiquement explicite. La parcelle entière dépasse la lésion antérieure et son extension intraventriculaire est omise. Les côtés non précisés et les subdivisions frontales des séries ne reçoivent pas de parcelles.
    mappings:
      - {region: 'aseg:left:10', source_name: Left-Thalamus-Proper}
    evidence:
      - {reference: kim-asterixis-2001, role: supporting}
      - {reference: rio-1995, role: supporting}
      - {reference: klos-2006, role: supporting}
      - {reference: pal-2014, role: qualifying}

  - id: biological-motion-temporal
    deficit: biological-motion
    title: {en: Superior temporal and premotor lesion associations, fr: Associations lésionnelles temporales supérieures et prémotrices}
    network: {en: Biological-motion perception, fr: Perception du mouvement biologique}
    laterality: bilateral
    finding:
      en: In 60 unilateral stroke patients, both lesion-side groups were impaired relative to controls. Superior temporal and premotor lesions had the strongest voxelwise associations, with independent effects of the two regions.
      fr: Chez 60 patients avec AVC unilatéral, les deux groupes de côté lésionnel étaient déficitaires par rapport aux témoins. Les lésions temporales supérieures et prémotrices avaient les associations voxel par voxel les plus fortes, avec des effets indépendants des deux régions.
    limitation:
      en: Point-light tasks do not establish loss of all everyday action recognition. A separate four-patient study described temporal lesions and broader perceptual testing; anatomical variability prevents treating one small cortical site as the sole substrate.
      fr: Les tâches de points lumineux n’établissent pas une perte de toute reconnaissance des actions quotidiennes. Une étude distincte de quatre patients décrivait des lésions temporales et une évaluation perceptive plus large; la variabilité anatomique empêche d’attribuer la fonction à un seul petit site cortical.
    mapping_note:
      en: Superior temporal sulcus parcels are broad reference landmarks for the reported temporal/STS association, not reconstructed clusters. The abstract does not resolve a defensible premotor subdivision, so no frontal parcel is selected. Both sides represent separate unilateral patients.
      fr: Les parcelles du sillon temporal supérieur sont des repères larges pour l’association temporale/STS rapportée, pas des amas reconstruits. Le résumé ne précise pas de subdivision prémotrice défendable; aucune parcelle frontale n’est donc sélectionnée. Les deux côtés représentent des patients unilatéraux distincts.
    mappings:
      - {region: 'destrieux:left:74', source_name: S_temporal_sup}
      - {region: 'destrieux:right:74', source_name: S_temporal_sup}
    evidence:
      - {reference: saygin-2007, role: supporting}
      - {reference: vaina-2004, role: qualifying}

  - id: working-memory-manipulation
    deficit: working-memory
    title: {en: Manipulating information rather than simple rehearsal, fr: Manipulation des informations plutôt que simple répétition}
    network: {en: Superior parietal contributions to working memory, fr: Contributions pariétales supérieures à la mémoire de travail}
    laterality: bilateral
    finding:
      en: Patients with superior parietal lesions performed worse on tasks requiring manipulation and rearrangement of information, while simple rehearsal/retrieval and long-term memory were relatively preserved compared with the comparison groups.
      fr: Les patients avec lésions pariétales supérieures réussissaient moins bien les tâches de manipulation et de réorganisation des informations, tandis que la répétition/récupération simple et la mémoire à long terme étaient relativement préservées par rapport aux groupes comparatifs.
    limitation:
      en: This does not mean every working-memory component is impaired after parietal injury. The spatial-precision study used a different, sensitive eye-movement task and detected deficits despite normal standardized working-memory scores; task demands matter.
      fr: Cela ne signifie pas que toute composante de mémoire de travail est déficitaire après lésion pariétale. L’étude de précision spatiale utilisait une tâche oculomotrice différente et sensible, détectant des déficits malgré des scores standardisés de mémoire de travail normaux; les exigences de la tâche comptent.
    mapping_note:
      en: The superior parietal parcels are coarse landmarks for lesions represented in both hemispheres. They do not reproduce individual lesions or separate cortical injury from damage to underlying connections; bilateral colouring does not require bilateral injury.
      fr: Les parcelles pariétales supérieures sont des repères grossiers pour des lésions représentées dans les deux hémisphères. Elles ne reproduisent pas les lésions individuelles et ne séparent pas l’atteinte corticale de celle des connexions sous-jacentes; la coloration bilatérale n’exige pas une lésion bilatérale.
    mappings:
      - {region: 'destrieux:left:27', source_name: G_parietal_sup}
      - {region: 'destrieux:right:27', source_name: G_parietal_sup}
    evidence:
      - {reference: koenigs-2009, role: supporting}
      - {reference: mackey-2016, role: qualifying}

  - id: working-memory-spatial-precision
    deficit: working-memory
    title: {en: Reduced precision for remembered locations, fr: Précision réduite des positions mémorisées}
    network: {en: Intraparietal spatial working memory, fr: Mémoire de travail spatiale intrapariétale}
    laterality: bilateral
    finding:
      en: Three patients with intraparietal resections made slower, less accurate memory-guided eye movements despite preserved visually guided performance. Their standard working-memory scores were normal; the deficit concerned spatial precision rather than complete loss of the remembered target.
      fr: Trois patientes avec résections intrapariétales produisaient des mouvements oculaires guidés par la mémoire plus lents et moins précis malgré des performances visuellement guidées préservées. Leurs scores standardisés de mémoire de travail étaient normaux; le déficit concernait la précision spatiale plutôt qu’une perte complète de la cible mémorisée.
    limitation:
      en: Three chronic surgical cases cannot establish prevalence or a uniquely necessary site. Controls were younger on average, and surgery for tumours or focal epilepsy differs from stroke. The manipulation study addresses another working-memory component rather than directly replicating this precision result.
      fr: Trois cas chirurgicaux chroniques n’établissent ni prévalence ni site uniquement nécessaire. Les témoins étaient en moyenne plus jeunes et la chirurgie de tumeurs ou d’épilepsie focale diffère de l’AVC. L’étude de manipulation concerne une autre composante de mémoire de travail plutôt qu’une réplication directe de ce résultat de précision.
    mapping_note:
      en: Intraparietal sulcus parcels mark resections in one left and two right hemispheres. They exceed the probabilistic IPS1–IPS5 overlap and include the transverse parietal sulcus; they do not identify functional maps in this subject or imply bilateral injury.
      fr: Les parcelles du sillon intrapariétal repèrent les résections d’un hémisphère gauche et de deux droits. Elles dépassent le chevauchement probabiliste IPS1–IPS5 et incluent le sillon pariétal transverse; elles n’identifient pas de cartes fonctionnelles chez ce sujet et n’impliquent pas de lésion bilatérale.
    mappings:
      - {region: 'destrieux:left:57', source_name: S_intrapariet_and_P_trans}
      - {region: 'destrieux:right:57', source_name: S_intrapariet_and_P_trans}
    evidence:
