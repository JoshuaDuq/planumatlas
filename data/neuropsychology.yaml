  - id: speech-apraxia-insula
    deficit: speech-apraxia
    title: {en: The precentral gyrus of the insula, fr: Le gyrus précentral de l’insula}
    network: {en: Left anterior insula, fr: Insula antérieure gauche}
    laterality: left
    finding:
      en: All 25 chronic stroke patients with articulatory planning deficits had lesions including a discrete region of the left precentral gyrus of the insula, which was spared in all 19 patients without the deficit.
      fr: Les 25 patients avec AVC chronique et déficit de planification articulatoire avaient tous une lésion incluant une région circonscrite du gyrus précentral de l’insula gauche, épargnée chez les 19 patients sans ce déficit.
    limitation:
      en: Hillis found no insular association in 80 acute strokes and noted middle-cerebral-artery lesion bias. In Graff-Radford’s selected acute series with little or no aphasia, only two of seven cases involved the insula. These findings limit a universal insular localization.
      fr: Hillis ne trouvait pas d’association insulaire dans 80 AVC aigus et soulignait le biais lésionnel du territoire sylvien. Dans la série aiguë sélectionnée de Graff-Radford avec peu ou pas d’aphasie, seuls deux cas sur sept impliquaient l’insula. Ces constats limitent une localisation insulaire universelle.
    mapping_note:
      en: The short insular gyri parcel contains the precentral insular gyrus. The reported region is a small part of this parcel.
      fr: La parcelle des gyrus courts de l’insula contient le gyrus précentral insulaire. La région rapportée n’en occupe qu’une petite partie.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
    evidence:
      - {reference: dronkers-1996, role: supporting}
      - {reference: hillis-2004, role: qualifying}
      - {reference: graff-radford-2014, role: qualifying}

  - id: speech-apraxia-frontal
    deficit: speech-apraxia
    title: {en: Posterior inferior frontal gyrus in acute stroke, fr: Gyrus frontal inférieur postérieur dans l’AVC aigu}
    network: {en: Left posterior inferior frontal cortex, fr: Cortex frontal inférieur postérieur gauche}
    laterality: left
    finding:
      en: In 40 acute left-hemisphere strokes with insular damage and 40 without, apraxia of speech was associated with structural damage or hypoperfusion of the left posterior inferior frontal gyrus, not with the insula.
      fr: Chez 40 AVC gauches aigus avec atteinte insulaire et 40 sans, l’apraxie de la parole était associée à une lésion structurelle ou à une hypoperfusion du gyrus frontal inférieur postérieur gauche, et non à l’insula.
    limitation:
      en: Acute perfusion abnormalities may be transient. Dronkers’ chronic series implicated the insula, while Graff-Radford’s cases with little or no aphasia overlapped motor/premotor cortex. Differences in timing, aphasia and lesion extent complicate localization.
      fr: Les anomalies aiguës de perfusion peuvent être transitoires. La série chronique de Dronkers impliquait l’insula, tandis que les cas de Graff-Radford avec peu ou pas d’aphasie se chevauchaient sur le cortex moteur/prémoteur. Les différences de délai, d’aphasie et d’étendue lésionnelle compliquent la localisation.
    mapping_note:
      en: The opercular part of the inferior frontal gyrus is the closest parcel to the reported posterior inferior frontal region.
      fr: La partie operculaire du gyrus frontal inférieur est la parcelle la plus proche de la région frontale inférieure postérieure rapportée.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
    evidence:
      - {reference: hillis-2004, role: supporting}
      - {reference: dronkers-1996, role: qualifying}
      - {reference: graff-radford-2014, role: qualifying}

  - id: speech-apraxia-motor
    deficit: speech-apraxia
    title: {en: Speech apraxia with little or no aphasia, fr: Apraxie de la parole avec peu ou pas d’aphasie}
    network: {en: Left motor and premotor speech regions, fr: Régions motrices et prémotrices gauches de la parole}
    laterality: left
    finding:
      en: In seven selected acute cases, lesion overlap centred on left motor and adjacent premotor cortex. All seven involved motor area 4 and six involved premotor area 6; only two involved the insula and three area 44.
      fr: Dans sept cas aigus sélectionnés, le chevauchement lésionnel était centré sur le cortex moteur gauche et le cortex prémoteur adjacent. Les sept impliquaient l’aire motrice 4 et six l’aire prémotrice 6; seuls deux impliquaient l’insula et trois l’aire 44.
    limitation:
      en: This rare, retrospectively selected series had five pure cases and two with equivocal aphasia. Perfusion imaging was not performed, so additional functional impairment of inferior frontal cortex could not be excluded. Limited follow-up prevents extending the acute pattern to persistent or degenerative speech apraxia.
      fr: Cette série rare sélectionnée rétrospectivement comprenait cinq cas purs et deux avec aphasie équivoque. L’imagerie de perfusion n’était pas réalisée; une atteinte fonctionnelle supplémentaire du cortex frontal inférieur ne pouvait donc pas être exclue. Le suivi limité empêche d’étendre ce profil aigu à l’apraxie persistante ou dégénérative de la parole.
    mapping_note:
      en: The entire left precentral gyrus provides a coarse motor landmark. It does not isolate speech representations, reproduce the area 4/6 boundary or delineate all adjacent premotor tissue.
      fr: Le gyrus précentral gauche entier fournit un repère moteur approximatif. Il n’isole pas les représentations de la parole, ne reproduit pas la frontière des aires 4/6 et ne délimite pas tout le tissu prémoteur adjacent.
    mappings:
      - {region: 'destrieux:left:29', source_name: G_precentral}
    evidence:
      - {reference: graff-radford-2014, role: supporting}
      - {reference: hillis-2004, role: qualifying}
      - {reference: dronkers-1996, role: qualifying}

  - id: emotion-amygdala
    deficit: emotion-recognition
    title: {en: Recognizing fear in faces, fr: Reconnaître la peur sur les visages}
    network: {en: Bilateral amygdala, fr: Amygdale bilatérale}
    laterality: bilateral
    finding:
      en: Under the original testing conditions, S.M., with bilateral amygdala damage, was markedly impaired at recognizing fear and emotional blends in faces while still identifying people. Nine bilateral-lesion patients varied widely in fear recognition. In a later follow-up, S.M.’s fear recognition became normal when explicitly instructed to look at the eyes.
      fr: Dans les conditions d’évaluation initiales, S.M., avec lésions amygdaliennes bilatérales, reconnaissait très mal la peur et les mélanges émotionnels des visages tout en identifiant les personnes. Neuf patients avec lésions bilatérales variaient fortement dans la reconnaissance de la peur. Lors d’un suivi ultérieur, la reconnaissance de la peur de S.M. devenait normale sur instruction explicite de regarder les yeux.
    limitation:
      en: The 2005 study revisited S.M.; it is not an independent lesion case. Gaze-dependent improvement in this patient and wide variability in the nine-patient series limit claims that amygdala damage invariably abolishes facial fear recognition.
      fr: L’étude de 2005 réexaminait S.M.; ce n’est pas un cas lésionnel indépendant. L’amélioration dépendant du regard chez cette patiente et la grande variabilité de la série de neuf patients limitent l’idée qu’une atteinte amygdalienne abolit invariablement la reconnaissance faciale de la peur.
    mapping_note:
      en: Whole amygdalae are shown. The reported cases involved bilateral damage; a unilateral lesion is not equivalent.
      fr: Les amygdales entières sont affichées. Les cas rapportés impliquaient une atteinte bilatérale; une lésion unilatérale n’est pas équivalente.
    mappings:
      - {region: 'aseg:left:18', source_name: Left-Amygdala}
      - {region: 'aseg:right:54', source_name: Right-Amygdala}
    evidence:
      - {reference: adolphs-1994, role: supporting}
      - {reference: adolphs-1999, role: supporting}
      - {reference: adolphs-2005, role: qualifying}

  - id: optic-ataxia-junction
    deficit: optic-ataxia
    title: {en: Reaching under visual guidance, fr: Atteinte sous guidage visuel}
    network: {en: Occipito-parietal junction and precuneus, fr: Jonction occipito-pariétale et précunéus}
    laterality: bilateral
    finding:
      en: Lesion overlap centred on the lateral occipito-parietal junction between the inferior parietal lobule and superior occipital cortex, extending medially to the precuneus, rather than on the superior parietal lobule convexity.
      fr: Le chevauchement lésionnel se centrait sur la jonction occipito-pariétale latérale entre le lobule pariétal inférieur et le cortex occipital supérieur, s’étendant médialement au précunéus, plutôt que sur la convexité du lobule pariétal supérieur.
    limitation:
      en: Lesion overlap in patients selected for optic ataxia; the abstract does not report a comparison with patients lacking the deficit. In the left hemisphere the overlap also reached the junction of occipital cortex and superior parietal lobule.
      fr: Chevauchement lésionnel chez des patients sélectionnés pour une ataxie optique; le résumé ne rapporte pas de comparaison avec des patients sans ce déficit. Dans l’hémisphère gauche, le chevauchement atteignait aussi la jonction entre cortex occipital et lobule pariétal supérieur.
    mapping_note:
      en: Angular, superior occipital and precuneus parcels bracket the reported junction on each side. The overlap crossed parcel borders and involved underlying white matter.
      fr: Les parcelles angulaire, occipitale supérieure et du précunéus encadrent la jonction rapportée de chaque côté. Le chevauchement traversait les limites des parcelles et impliquait la substance blanche sous-jacente.
    mappings:
      - {region: 'destrieux:left:25', source_name: G_pariet_inf-Angular}
      - {region: 'destrieux:right:25', source_name: G_pariet_inf-Angular}
      - {region: 'destrieux:left:20', source_name: G_occipital_sup}
      - {region: 'destrieux:right:20', source_name: G_occipital_sup}
