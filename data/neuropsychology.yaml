  - id: estimation-right-temporal-frontal
    deficit: cognitive-estimation
    title: {en: Right temporal and frontal estimation associations, fr: Associations temporales et frontales droites de l’estimation}
    network: {en: Temporal knowledge and frontal monitoring systems, fr: Systèmes temporaux des connaissances et frontaux du contrôle}
    laterality: right
    finding:
      en: Stroke patients with left neglect made less plausible everyday estimates than controls without the predicted general overestimation bias. Voxel mapping implicated right anterior temporal tissue; region-based tests implicated the right superior temporal pole and orbital inferior frontal gyrus, together with two white-matter pathways.
      fr: Les patients après AVC avec négligence gauche donnaient des estimations quotidiennes moins plausibles que les témoins sans le biais général de surestimation prédit. La cartographie voxel par voxel impliquait le tissu temporal antérieur droit; les tests régionaux impliquaient le pôle temporal supérieur et le gyrus frontal inférieur orbital droits, ainsi que deux voies de substance blanche.
    limitation:
      en: Only right-sided strokes with neglect were studied; this cannot establish right-hemisphere exclusivity or isolate semantic knowledge from executive contributions. Coverage favoured middle cerebral artery injury. The separate frontal series supports task impairment, not an independent replication of these regional results.
      fr: Seuls des AVC droits avec négligence étaient étudiés; cela n’établit ni une exclusivité hémisphérique droite ni une séparation des connaissances sémantiques et des contributions exécutives. La couverture favorisait les lésions de l’artère cérébrale moyenne. La série frontale distincte étaye le déficit à la tâche sans répliquer indépendamment ces résultats régionaux.
    mapping_note:
      en: Whole right temporal-pole and orbital inferior frontal parcels mark the reported corrected region-based associations. They do not reproduce the voxel cluster or claim that every part of each parcel is essential. The uncinate fasciculus and anterior commissure remain uncoloured.
      fr: Les parcelles entières du pôle temporal et du gyrus frontal inférieur orbital droits repèrent les associations régionales corrigées rapportées. Elles ne reproduisent pas l’amas voxelique et n’affirment pas que chaque partie de chaque parcelle est essentielle. Le faisceau unciné et la commissure antérieure restent non colorés.
