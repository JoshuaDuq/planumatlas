  - id: hemichorea-subthalamic
    deficit: hemichorea
    title: {en: The subthalamic nucleus and its exceptions, fr: Le noyau sous-thalamique et ses exceptions}
    network: {en: Subthalamic nucleus, fr: Noyau sous-thalamique}
    laterality: bilateral
    finding:
      en: Of 17 reported cases with ballism-chorea after thalamic or subthalamic lesions, 15 had a unilateral lesion of the subthalamic nucleus or region, all with contralateral hemichorea or hemiballism.
      fr: Sur 17 cas rapportés de ballisme-chorée après lésion thalamique ou sous-thalamique, 15 avaient une lésion unilatérale du noyau ou de la région sous-thalamique, tous avec hémichorée ou hémiballisme controlatéral.
    limitation:
      en: Published cases do not establish a unique lesion site. Dewey found non-stroke causes in 10 of 21 patients. Laganiere’s 29 stroke lesions, replicated in ten additional cases, were anatomically heterogeneous but commonly connected to posterolateral putamen; connectivity does not mean the putamen was directly injured.
      fr: Des cas publiés n’établissent pas de site lésionnel unique. Dewey trouvait des causes autres qu’un AVC chez 10 patients sur 21. Les 29 lésions d’AVC de Laganiere, avec réplication dans dix cas supplémentaires, étaient anatomiquement hétérogènes mais souvent connectées au putamen postérolatéral; cette connectivité ne signifie pas que le putamen était directement lésé.
    mapping_note:
      en: Subthalamic landmarks on both sides represent possible unilateral lesion sites, with contralateral movements. They do not display the heterogeneous lesions or connected putaminal site from the network study.
      fr: Les repères sous-thalamiques des deux côtés représentent des sites lésionnels unilatéraux possibles, avec mouvements controlatéraux. Ils n’affichent ni les lésions hétérogènes ni le site putaminal connecté de l’étude de réseau.
