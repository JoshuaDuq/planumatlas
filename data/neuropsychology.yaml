  - id: apraxia-pantomime-frontal
    deficit: apraxia
    title: {en: Pantomiming tool use after frontal damage, fr: Pantomime de l’utilisation d’outils après atteinte frontale}
    network: {en: Left inferior frontal praxis system, fr: Système praxique frontal inférieur gauche}
    laterality: left
    finding:
      en: In patients with left-brain damage and aphasia, defective pantomime of tool use was associated with inferior frontal damage extending into the adjacent insula and precentral gyrus, also after equating comprehension and lesion size; parietal lesions had no specific effect. In 150 patients with left- or right-hemisphere damage, both scored types of pantomime error were associated with left inferior frontal damage.
      fr: Chez des patients avec lésion cérébrale gauche et aphasie, un pantomime déficitaire de l’utilisation d’outils était associé à une atteinte frontale inférieure s’étendant à l’insula et au gyrus précentral adjacents, y compris après appariement sur la compréhension et la taille lésionnelle; les lésions pariétales n’avaient pas d’effet spécifique. Chez 150 patients avec atteinte de l’hémisphère gauche ou droit, les deux types d’erreurs de pantomime évalués étaient associés à une atteinte frontale inférieure gauche.
    limitation:
      en: The subtraction study included only aphasic patients, and the 150-patient study described the frontal role as unspecific to the type of error. A 96-patient acute stroke study instead associated pantomime with supramarginal and ventral-stream damage, so inferior frontal cortex is not the only site where lesions disrupt pantomime.
      fr: L’étude par soustraction n’incluait que des patients aphasiques, et l’étude de 150 patients décrivait le rôle frontal comme non spécifique du type d’erreur. Une étude de 96 patients en phase aiguë d’AVC associait plutôt le pantomime à une atteinte supramarginale et de la voie ventrale; le cortex frontal inférieur n’est donc pas le seul site où une lésion perturbe le pantomime.
    mapping_note:
      en: The opercular and triangular parcels mark the left inferior frontal gyrus; the consulted abstracts do not name a subdivision. The adjacent insula and precentral gyrus are not coloured.
      fr: Les parcelles operculaire et triangulaire repèrent le gyrus frontal inférieur gauche; les résumés consultés ne nomment pas de subdivision. L’insula et le gyrus précentral adjacents ne sont pas colorés.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
      - {region: 'destrieux:left:14', source_name: G_front_inf-Triangul}
    evidence:
      - {reference: goldenberg-2007, role: supporting}
      - {reference: manuel-2013, role: supporting}
      - {reference: hoeren-2014, role: qualifying}

  - id: apraxia-pantomime-posterior
    deficit: apraxia
    title: {en: Pantomiming tool use after parietal and temporal damage, fr: Pantomime de l’utilisation d’outils après atteinte pariétale et temporale}
    network: {en: Left parietotemporal praxis system, fr: Système praxique pariétotemporal gauche}
    laterality: left
    finding:
      en: In 96 consecutive acute left-hemisphere strokes, pantomime of tool use, unlike imitation of meaningless postures, was associated with supramarginal and ventral-stream damage; content errors related to anterior temporal damage. In 71 left-hemisphere strokes, gesturing to the sight of tools was associated with a large posterior temporal region extending toward extrastriate cortex, with smaller inferior parietal and frontal regions.
      fr: Chez 96 patients consécutifs en phase aiguë d’AVC gauche, le pantomime de l’utilisation d’outils, contrairement à l’imitation de postures sans signification, était associé à une atteinte supramarginale et de la voie ventrale; les erreurs de contenu étaient liées à une atteinte temporale antérieure. Chez 71 patients avec AVC gauche, les gestes produits à la vue d’outils étaient associés à une vaste région temporale postérieure s’étendant vers le cortex extrastrié, avec des régions pariétales inférieures et frontales plus petites.
    limitation:
      en: Both studies elicited pantomime from pictured or viewed tools rather than verbal command, and movement errors had no consistent lesion location. In an aphasic sample, a subtraction study found no specific parietal effect, so the location depends on the task, the type of error and the sample.
      fr: Les deux études suscitaient le pantomime par des outils dessinés ou vus plutôt que par une consigne verbale, et les erreurs de mouvement n’avaient pas de localisation lésionnelle constante. Dans un échantillon aphasique, une étude par soustraction ne trouvait pas d’effet pariétal spécifique; la localisation dépend donc de la tâche, du type d’erreur et de l’échantillon.
    mapping_note:
      en: The supramarginal parcel marks the parietal result. The whole middle temporal gyrus is a broad landmark for the posterior temporal region, which also extends into inferior temporal and occipital cortex. The extreme capsule and anterior temporal lobe are not coloured.
      fr: La parcelle supramarginale repère le résultat pariétal. Le gyrus temporal moyen entier est un repère large de la région temporale postérieure, qui s’étend aussi au cortex temporal inférieur et occipital. La capsule extrême et le lobe temporal antérieur ne sont pas colorés.
    mappings:
      - {region: 'destrieux:left:26', source_name: G_pariet_inf-Supramar}
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
    evidence:
      - {reference: hoeren-2014, role: supporting}
      - {reference: buxbaum-2014, role: supporting}
      - {reference: goldenberg-2007, role: qualifying}

  - id: apraxia-tool-use
    deficit: apraxia
    title: {en: Using real tools, fr: Utilisation d’outils réels}
    network: {en: Left parietal tool-use system, fr: Système pariétal gauche d’utilisation des outils}
    laterality: left
    finding:
      en: In 136 acute left-hemisphere strokes, deficits in using real tools and in selecting a tool’s recipient were both associated with inferior parietal damage; selection deficits were additionally related to anterior temporal damage. In 38 patients with left-brain damage and aphasia, parietal lesions extending from the supramarginal gyrus impaired the use of common and novel tools but not the retrieval of functional associations.
      fr: Chez 136 patients en phase aiguë d’AVC gauche, les déficits d’utilisation d’outils réels et de sélection du destinataire d’un outil étaient tous deux associés à une atteinte pariétale inférieure; les déficits de sélection étaient en outre liés à une atteinte temporale antérieure. Chez 38 patients avec lésion cérébrale gauche et aphasie, les lésions pariétales s’étendant depuis le gyrus supramarginal altéraient l’utilisation d’outils courants et nouveaux, mais pas la récupération d’associations fonctionnelles.
    limitation:
      en: The second study included only aphasic patients, and its frontal lesion region impaired every test, including the aphasia test, so it is not shown as specific to tool use. In 58 left- and 51 right-hemisphere strokes, lesion foci were more ventral for familiar and more dorsal for novel tools, and more anterior for selecting than for applying them, so real tool use does not depend on a single parietal site.
      fr: La seconde étude n’incluait que des patients aphasiques, et sa région lésionnelle frontale altérait tous les tests, y compris le test d’aphasie; elle n’est donc pas présentée comme spécifique de l’utilisation d’outils. Chez 58 patients avec AVC gauche et 51 avec AVC droit, les foyers lésionnels étaient plus ventraux pour les outils familiers et plus dorsaux pour les outils nouveaux, et plus antérieurs pour leur sélection que pour leur application; l’utilisation réelle d’outils ne dépend donc pas d’un site pariétal unique.
    mapping_note:
      en: The supramarginal parcel marks the common parietal landmark. In the second study the lesion region extended through the inferior to the superior parietal lobule; the frontal and anterior temporal results are not coloured.
      fr: La parcelle supramarginale repère le site pariétal commun. Dans la seconde étude, la région lésionnelle s’étendait du lobule pariétal inférieur au lobule pariétal supérieur; les résultats frontaux et temporaux antérieurs ne sont pas colorés.
    mappings:
      - {region: 'destrieux:left:26', source_name: G_pariet_inf-Supramar}
    evidence:
      - {reference: martin-2016, role: supporting}
      - {reference: goldenberg-2009, role: supporting}
      - {reference: stoll-2022, role: qualifying}

  - id: apraxia-deep
    deficit: apraxia
    title: {en: Apraxia after deep lesions, fr: Apraxie après lésions profondes}
    network: {en: Deep left-hemisphere praxis pathways, fr: Voies praxiques profondes de l’hémisphère gauche}
    laterality: left
    finding:
      en: In 82 published cases of apraxia after deep lesions, apraxia was most often seen when lenticular or putaminal lesions extended into adjacent capsular, periventricular or peristriatal white matter; lesions confined to the basal ganglia rarely, if ever, caused it, whereas thalamic lesions sometimes did.
      fr: Dans 82 cas publiés d’apraxie après lésions profondes, l’apraxie survenait surtout quand des lésions lenticulaires ou putaminales s’étendaient à la substance blanche capsulaire, périventriculaire ou péristriée adjacente; les lésions limitées aux noyaux gris centraux en causaient rarement, voire jamais, alors que les lésions thalamiques en causaient parfois.
    limitation:
      en: The review pooled published case reports, mostly imaged with CT. Among 14 patients whose CT lesions were confined to the left basal ganglia or thalamus, sparing cortex and adjacent white matter, five were severely impaired in imitation and pantomime, so the deep nuclei themselves may contribute. Neither source establishes how often deep lesions cause apraxia.
      fr: La revue regroupait des cas publiés, surtout imagés par TDM. Parmi 14 patients dont les lésions en TDM étaient limitées aux noyaux gris centraux gauches ou au thalamus, épargnant le cortex et la substance blanche adjacente, cinq étaient sévèrement altérés en imitation et en pantomime; les noyaux profonds eux-mêmes pourraient donc contribuer. Aucune source n’établit la fréquence de l’apraxie après lésions profondes.
    mapping_note:
      en: No parcel is coloured. The review attributes most cases to white matter adjacent to the lenticular nucleus, which is not drawn as a parcel, and colouring the basal ganglia would contradict its conclusion that damage confined to them rarely suffices.
      fr: Aucune parcelle n’est colorée. La revue attribue la plupart des cas à la substance blanche adjacente au noyau lenticulaire, qui n’est pas dessinée comme parcelle, et colorer les noyaux gris centraux contredirait sa conclusion qu’une atteinte limitée à ces noyaux suffit rarement.
    mappings: []
    evidence:
      - {reference: pramstaller-1996, role: supporting}
      - {reference: de-renzi-1986, role: qualifying}

  - id: callosal-apraxia-anterior
    deficit: callosal-apraxia
    title: {en: Left-hand apraxia after callosal injury, fr: Apraxie de la main gauche après atteinte calleuse}
    network: {en: Interhemispheric praxis transfer, fr: Transfert praxique interhémisphérique}
    laterality: bilateral
    finding:
      en: After a callosal infarct later limited to the body, one patient had apraxia confined to the left hand. A second patient, with damage to the genu and most of the body that spared the splenium and both supplementary motor areas, had left-hand apraxia that persisted longest on verbal commands. Three patients with complete callosotomy made apraxic errors only with the left hand when pantomiming to visually presented objects, while actual object use was intact.
      fr: Après un infarctus calleux finalement limité au corps, une patiente avait une apraxie limitée à la main gauche. Une seconde patiente, avec atteinte du genou et de la majeure partie du corps épargnant le splénium et les deux aires motrices supplémentaires, avait une apraxie de la main gauche persistant le plus longtemps sur consigne verbale. Trois patients avec callosotomie complète faisaient des erreurs apraxiques uniquement de la main gauche en pantomime à la présentation visuelle d’objets, alors que l’utilisation réelle des objets était préservée.
    limitation:
      en: Two single cases and three surgical patients. Left medial frontal infarcts that include the supplementary motor area can cause apraxia of both hands, so medial frontal damage accompanying callosal lesions may contribute. Left-hemisphere dominance for praxis varied with the test and between individuals.
      fr: Deux cas isolés et trois patients opérés. Des infarctus frontaux médiaux gauches incluant l’aire motrice supplémentaire peuvent causer une apraxie des deux mains; une atteinte frontale médiale associée aux lésions calleuses peut donc contribuer. La dominance gauche pour les praxies variait selon le test et d’une personne à l’autre.
    mapping_note:
      en: The anterior, mid-anterior and central FreeSurfer callosal subdivisions approximate the genu and body named in the case reports; their boundaries do not reconstruct the lesions, and the callosotomies divided the whole callosum. The bilateral label describes a midline structure; the deficit affects the left hand.
      fr: Les subdivisions calleuses antérieure, moyenne antérieure et centrale de FreeSurfer approchent le genou et le corps nommés dans les cas rapportés; leurs limites ne reconstruisent pas les lésions, et les callosotomies sectionnaient le corps calleux entier. L’étiquette bilatérale décrit une structure médiane; le déficit touche la main gauche.
    mappings:
      - {region: 'aseg:midline:255', source_name: CC_Anterior}
      - {region: 'aseg:midline:254', source_name: CC_Mid_Anterior}
      - {region: 'aseg:midline:253', source_name: CC_Central}
    evidence:
      - {reference: watson-1983, role: supporting}
      - {reference: graff-radford-1987, role: supporting}
      - {reference: lausberg-2003, role: supporting}
      - {reference: watson-1986, role: qualifying}

  - id: agnosia-face
