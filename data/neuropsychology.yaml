  - id: alexia-occipitotemporal
    deficit: alexia
    title: {en: Visual word recognition, fr: Reconnaissance visuelle des mots}
    network: {en: Left ventral occipitotemporal reading system, fr: Système de lecture occipito-temporal ventral gauche}
    laterality: left
    finding:
      en: After surgical removal of a small word-responsive portion of left occipitotemporal cortex, the patient developed a marked reading deficit while recognition of faces, houses and tools stayed intact, and only word-specific fMRI activations disappeared.
      fr: Après l’ablation chirurgicale d’une petite portion du cortex occipito-temporal gauche répondant aux mots, le patient a développé un déficit marqué de lecture alors que la reconnaissance des visages, des maisons et des outils restait intacte, et seules les activations IRMf spécifiques aux mots ont disparu.
    limitation:
      en: A single epilepsy-surgery case with imaging before and after resection. A later diffusion study by the same group of a patient with pure alexia after a small resection beside the word form area, which reviews treat as this case, found that area anatomically intact while the inferior longitudinal fasciculus progressively degenerated, so disconnection may contribute to the deficit. Neither study describes the range of lesions producing alexia after stroke.
      fr: Cas unique de chirurgie de l’épilepsie avec imagerie avant et après la résection. Une étude ultérieure de diffusion du même groupe, chez un patient avec alexie pure après une petite résection à côté de l’aire de la forme visuelle des mots, que des revues considèrent comme ce cas, montrait cette aire anatomiquement intacte alors que le faisceau longitudinal inférieur dégénérait progressivement; une déconnexion peut donc contribuer au déficit. Aucune des deux études ne décrit l’éventail des lésions produisant une alexie après un AVC.
    mapping_note:
      en: The fusiform gyrus and lateral occipitotemporal sulcus are shown whole. The word-responsive region is a small part of this territory.
      fr: Le gyrus fusiforme et le sillon occipito-temporal latéral sont affichés en entier. La région répondant aux mots n’est qu’une petite partie de ce territoire.
    mappings:
