    summary:
      en: Difficulty using knowledge about the meaning of words, objects, people and places. This profile compares temporal-lobe injury affecting conceptual knowledge with difficulty controlling semantic retrieval after stroke; neither pattern is assumed to explain every semantic deficit.
      fr: Difficulté à utiliser les connaissances sur le sens des mots, des objets, des personnes et des lieux. Ce profil compare les atteintes temporales touchant les connaissances conceptuelles aux difficultés de contrôle de la récupération sémantique après AVC; aucun de ces tableaux n’est supposé expliquer tous les déficits sémantiques.
    aliases:
      en: [conceptual knowledge, word meaning, object knowledge, person knowledge, anterior temporal lobe, herpes simplex encephalitis, semantic control, controlled semantic retrieval, semantic aphasia]
      fr: [connaissances conceptuelles, sens des mots, connaissance des objets, connaissance des personnes, lobe temporal antérieur, encéphalite herpétique, contrôle sémantique, récupération sémantique contrôlée, aphasie sémantique]

  - id: verbal-fluency
    name: {en: Reduced verbal fluency, fr: Diminution de la fluence verbale}
    domain: {en: Word generation, fr: Production de mots}
    group: language-number
    summary:
      en: Producing fewer words than expected when asked, within a time limit, to list members of a category or words beginning with a given letter. This profile separates letter fluency, category fluency and a general reduction after superior medial frontal damage.
      fr: Production de moins de mots qu’attendu lorsqu’il faut énumérer en temps limité des éléments d’une catégorie ou des mots commençant par une lettre donnée. Ce profil distingue la fluence littérale, la fluence catégorielle et une baisse générale après une atteinte frontale médiale supérieure.
