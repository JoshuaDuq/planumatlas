  - id: aphasia-repetition
    deficit: aphasia
    title: {en: Repeating words and sentences, fr: Répétition de mots et de phrases}
    network: {en: Left dorsal language pathway, fr: Voie langagière dorsale gauche}
    laterality: left
    finding:
      en: In this pooled analysis, the repetition-selective lesion association was localized to the left posterior superior temporal gyrus.
      fr: Dans cette analyse regroupée, l’association lésionnelle sélective de la répétition se situait dans le gyrus temporal supérieur postérieur gauche.
    limitation:
      en: Pooled coordinates from post-stroke aphasia do not establish a necessary lesion site in every patient. Repetition is one task among several, and pooling cannot resolve subregions within a gyrus.
      fr: Les coordonnées regroupées d’aphasies post-AVC ne démontrent pas qu’une lésion de ce site est nécessaire chez chaque patient. La répétition n’est qu’une tâche parmi d’autres, et le regroupement ne peut distinguer les sous-régions d’un gyrus.
    mapping_note:
