      en: Ten of 14 consecutive patients with amnesia after anterior communicating artery aneurysm surgery, enrolled because their memory quotient was more than 15 points below their IQ; examined with 3D MRI a median of four months after treatment.
      fr: Dix de 14 patients consécutifs avec amnésie après chirurgie d’un anévrisme de l’artère communicante antérieure, retenus parce que leur quotient mnésique était inférieur de plus de 15 points à leur QI; examinés par IRM 3D à une médiane de quatre mois après traitement.

  - id: souter-2022
    title: Mapping lesion, structural disconnection, and functional disconnection to symptoms in semantic aphasia
    authors: Souter NE, Wang X, Thompson H, Krieger-Redwood K, Halai AD, Lambon Ralph MA, Thiebaut de Schotten M, Jefferies E
    year: 2022
    journal: Brain Structure and Function
    doi: 10.1007/s00429-022-02526-6
    pmid: '35786743'
    method: lesion-mapping
    scope: full-text
    population:
      en: 23 chronic left-stroke patients selected for multimodal semantic impairment; descriptive lesion coverage and normative disconnection analyses, with symptom mapping in 20 patients.
      fr: 23 patients avec AVC gauche chronique sélectionnés pour trouble sémantique multimodal; couverture lésionnelle descriptive et analyses de déconnexion normative, avec cartographie des symptômes chez 20 patients.

  - id: thompson-2022-semantic-control
    title: Damage to temporoparietal cortex is sufficient for impaired semantic control
    authors: Thompson HE, Noonan KA, Halai AD, Hoffman P, Stampacchia S, Hallam G, Rice GE, De Dios Perez B, Lambon Ralph MA, Jefferies E
    year: 2022
    journal: Cortex
    doi: 10.1016/j.cortex.2022.05.022
    pmid: '36183573'
    method: case-series
    scope: full-text
    population:
      en: 30 semantic-aphasia stroke patients, 22 with prefrontal plus often posterior injury and eight with temporoparietal injury sparing prefrontal cortex; comparisons with semantic-dementia data. Much of the sample came from earlier studies.
      fr: 30 patients avec aphasie sémantique après AVC, 22 avec atteinte préfrontale et souvent postérieure et huit avec atteinte temporopariétale épargnant le cortex préfrontal; comparaisons avec des données de démence sémantique. Une grande partie de l’échantillon provenait d’études antérieures.

