  - id: fluency-letter
    deficit: verbal-fluency
    title: {en: Generating words from a letter, fr: Générer des mots à partir d’une lettre}
    network: {en: Left lateral frontal word-retrieval system, fr: Système frontal latéral gauche de récupération lexicale}
    laterality: left
    finding:
      en: In 1,231 acute stroke patients, both fluency tasks depended on left frontotemporal, parietal and thalamic regions, while letter fluency was distinctly associated with the anterior middle and inferior frontal gyri. Voxel-based mapping in 48 left-hemisphere stroke patients linked letter fluency to frontal cortex, and a 93-patient study found a left inferior frontal and insular correlate shared with category fluency, plus middle frontal and rolandic opercular correlates for letters. In 47 frontal-lesion patients, letter fluency was most severely impaired after left inferior frontal damage.
      fr: Chez 1 231 patients ayant un AVC aigu, les deux tâches de fluence dépendaient de régions frontotemporales, pariétales et thalamiques gauches, tandis que la fluence littérale était associée de façon distincte aux parties antérieures des gyri frontaux moyen et inférieur. La cartographie voxel par voxel chez 48 patients ayant un AVC gauche reliait la fluence littérale au cortex frontal, et une étude de 93 patients trouvait un corrélat frontal inférieur et insulaire gauche partagé avec la fluence catégorielle, ainsi que des corrélats frontal moyen et operculaire rolandique propres aux lettres. Chez 47 patients ayant des lésions frontales, la fluence littérale était la plus altérée après une atteinte frontale inférieure gauche.
    limitation:
      en: Fluency tasks also depend on speed, language and executive control, so a low score does not identify one process. In 74 focal-lesion patients, left dorsolateral frontal, striatal and parietal lesions all impaired letter fluency. Patients with severe aphasia were often not tested, which lowered left-hemisphere lesion coverage in the 93-patient study.
      fr: Les tâches de fluence dépendent aussi de la vitesse, du langage et du contrôle exécutif, si bien qu’un score faible n’identifie pas un seul processus. Chez 74 patients ayant des lésions focales, les lésions frontales dorsolatérales, striatales et pariétales gauches altéraient toutes la fluence littérale. Les patients ayant une aphasie sévère étaient souvent non évalués, ce qui réduisait la couverture lésionnelle gauche dans l’étude de 93 patients.
    mapping_note:
      en: Left opercular and triangular inferior frontal and middle frontal parcels mark the frontal correlates. The whole parcels exceed the anterior portions reported in the largest study, and the rolandic opercular, insular, thalamic and parietal correlates are not coloured.
      fr: Les parcelles frontales inférieures operculaire et triangulaire et la parcelle frontale moyenne gauches repèrent les corrélats frontaux. Les parcelles entières dépassent les portions antérieures rapportées dans la plus grande étude, et les corrélats operculaires rolandiques, insulaires, thalamiques et pariétaux ne sont pas colorés.
