      en: Simultanagnosia was associated with bilateral parieto-occipital white-matter disconnection, bilateral cortical damage including the cuneus, calcarine cortex, parieto-occipital sulcus and middle frontal area 46, and right intraparietal and postcentral damage.
      fr: La simultanagnosie était associée à une déconnexion pariéto-occipitale bilatérale de substance blanche, à des lésions corticales bilatérales incluant le cunéus, le cortex calcarin, le sillon pariéto-occipital et l’aire frontale moyenne 46, et à une atteinte intrapariétale et postcentrale droite.
    limitation:
      en: Network-level evidence; no displayed cortical parcel alone establishes the syndrome. The study did not classify patients as dorsal or ventral; its bilateral parieto-occipital lesions match the pattern usually called dorsal simultanagnosia, and it does not address ventral cases.
      fr: Données portant sur un réseau; aucune parcelle corticale affichée ne suffit à établir le syndrome. L’étude ne classait pas les patients en formes dorsale ou ventrale; ses lésions pariéto-occipitales bilatérales correspondent au profil habituellement appelé simultanagnosie dorsale, et elle ne traite pas des formes ventrales.
    mapping_note:
      en: Bilateral cortical landmarks are shown. The implicated white-matter disconnections and full lesion distribution are not reconstructed.
      fr: Des repères corticaux bilatéraux sont affichés. Les déconnexions de substance blanche impliquées et la distribution lésionnelle complète ne sont pas reconstruites.
