  - id: reversal-orbitofrontal
    deficit: reversal-learning
    title: {en: Updating choices when rewards reverse, fr: Ajuster ses choix quand les récompenses s’inversent}
    network: {en: Orbitofrontal reward-learning system, fr: Système orbitofrontal d’apprentissage par la récompense}
    laterality: bilateral
    finding:
      en: Ventromedial frontal damage impaired reversal learning while leaving initial stimulus–reward learning intact; dorsolateral damage did not. After surgical excisions, patients with bilateral orbitofrontal lesions were severely impaired on a probabilistic reversal task, often failing to switch after a large loss, whereas patients with unilateral orbitofrontal lesions were not. Among 39 frontal patients, orbitofrontal damage disrupted both initial and reversal learning from probabilistic feedback. Ventromedial patients' impairment on the Iowa gambling task appeared largely explained by a reversal learning deficit.
      fr: L’atteinte frontale ventromédiane altérait l’apprentissage par inversion tout en épargnant l’apprentissage initial stimulus-récompense; l’atteinte dorsolatérale ne l’altérait pas. Après excision chirurgicale, les patients ayant des lésions orbitofrontales bilatérales étaient sévèrement altérés dans une tâche d’inversion probabiliste, ne changeant souvent pas de choix après une forte perte, contrairement aux patients ayant des lésions orbitofrontales unilatérales. Chez 39 patients frontaux, l’atteinte orbitofrontale perturbait l’apprentissage initial et l’inversion avec une rétroaction probabiliste. L’altération des patients ventromédians à la tâche de jeu de l’Iowa semblait largement expliquée par un déficit d’apprentissage par inversion.
    limitation:
      en: Bilateral damage was required in the surgical series, and whether initial learning was spared depended on the task. In the 39-patient study the orbitofrontal effect came from a group comparison; its voxelwise map did not survive correction for multiple comparisons. Some dorsolateral patients also failed the probabilistic task, but only those who ignored the feedback. Samples from the same laboratory may overlap.
      fr: Une atteinte bilatérale était nécessaire dans la série chirurgicale, et l’épargne de l’apprentissage initial dépendait de la tâche. Dans l’étude de 39 patients, l’effet orbitofrontal provenait d’une comparaison de groupes; sa carte voxel par voxel ne survivait pas à la correction pour comparaisons multiples. Certains patients dorsolatéraux échouaient aussi à la tâche probabiliste, mais seulement ceux qui ignoraient la rétroaction. Les échantillons d’un même laboratoire peuvent se recouper.
    mapping_note:
      en: Orbital and gyrus rectus parcels on both sides mark the orbitofrontal and ventromedial region. They do not separate medial and lateral orbitofrontal sectors, which the studies did not resolve consistently.
      fr: Les parcelles orbitaires et du gyrus droit des deux côtés repèrent la région orbitofrontale et ventromédiane. Elles ne séparent pas les secteurs orbitofrontaux médian et latéral, que les études ne distinguaient pas de façon cohérente.
