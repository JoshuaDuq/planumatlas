    mapping_note:
      en: The rectus gyri are broad medial orbitofrontal landmarks. Basal forebrain, perirhinal and hypothalamic involvement is not delineated; both sides are shown without a claim that bilateral damage is required.
      fr: Les gyri rectus sont des repères orbitofrontaux médiaux larges. Les atteintes du prosencéphale basal, périrhinales et hypothalamiques ne sont pas délimitées; les deux côtés sont affichés sans supposer une atteinte bilatérale nécessaire.
