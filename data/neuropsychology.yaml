    finding:
      en: Three patients with small haemorrhages from the right retrosplenial region into the medial parietal lobe could identify familiar buildings and landscapes but could not recall the direction from one familiar place to another.
      fr: Trois patients avec petites hémorragies de la région rétrospléniale droite vers le lobe pariétal médial identifiaient bâtiments et paysages familiers mais ne pouvaient pas rappeler la direction d’un lieu familier à un autre.
    limitation:
      en: Three cases. Landmark agnosia after medial temporo-occipital lesions is a distinct form of topographical disorientation not covered here.
      fr: Trois cas. L’agnosie des repères après lésion temporo-occipitale médiale est une forme distincte de désorientation topographique non couverte ici.
    mapping_note:
      en: The ventral and dorsal posterior cingulate parcels contain the retrosplenial region; the precuneus stands for the medial parietal extension.
      fr: Les parcelles cingulaires postérieures ventrale et dorsale contiennent la région rétrospléniale; le précunéus tient lieu d’extension pariétale médiale.
    mappings:
      - {region: 'destrieux:right:10', source_name: G_cingul-Post-ventral}
      - {region: 'destrieux:right:9', source_name: G_cingul-Post-dorsal}
