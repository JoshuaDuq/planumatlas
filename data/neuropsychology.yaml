  - id: fluid-general-left
    deficit: fluid-intelligence
    title: {en: General ability across Wechsler subtests, fr: Aptitude générale aux sous-tests de Wechsler}
    network: {en: Left frontoparietal white-matter system, fr: Système frontopariétal gauche de substance blanche}
    laterality: left
    finding:
      en: Voxel-based mapping in 241 patients linked a general factor derived from Wechsler subtests to left-hemisphere damage, centred on white matter including the superior longitudinal and arcuate fasciculi, with a left frontal pole region specific to the general factor. In 182 patients with focal brain damage, the general factor and executive function shared a left frontal and parietal network and its connecting white matter.
      fr: La cartographie voxel par voxel chez 241 patients reliait un facteur général dérivé des sous-tests de Wechsler à une atteinte de l’hémisphère gauche, centrée sur la substance blanche dont les faisceaux longitudinal supérieur et arqué, avec une région du pôle frontal gauche propre au facteur général. Chez 182 patients ayant une lésion cérébrale focale, le facteur général et les fonctions exécutives partageaient un réseau frontal et pariétal gauche et sa substance blanche de connexion.
    limitation:
      en: Wechsler subtests are partly verbal, so left-hemisphere language damage may contribute, although the authors argue against a purely verbal account. Visuospatial subtests were affected by much larger right-hemisphere regions. Both studies emphasize white-matter tracts that a cortical atlas cannot show.
      fr: Les sous-tests de Wechsler sont en partie verbaux, de sorte qu’une atteinte du langage à gauche peut contribuer, bien que les auteurs contestent une explication purement verbale. Les sous-tests visuospatiaux étaient touchés par des régions droites beaucoup plus étendues. Les deux études soulignent des faisceaux de substance blanche qu’un atlas cortical ne peut montrer.
    mapping_note:
      en: The left transverse frontopolar parcel marks the frontal pole region unique to the general factor. The main white-matter findings and the distributed frontal and parietal cortex are not coloured.
      fr: La parcelle frontopolaire transverse gauche repère la région du pôle frontal propre au facteur général. Les principaux résultats de substance blanche et le cortex frontal et pariétal distribué ne sont pas colorés.
    mappings:
      - {region: 'destrieux:left:5', source_name: G_and_S_transv_frontopol}
    evidence:
      - {reference: glascher-2010, role: supporting}
      - {reference: barbey-2012, role: supporting}

  - id: multitasking-rostral-prefrontal
    deficit: multitasking
    title: {en: Managing several open-ended tasks, fr: Gérer plusieurs tâches ouvertes}
    network: {en: Rostral prefrontal goal-management system, fr: Système préfrontal rostral de gestion des buts}
    laterality: right
    finding:
      en: Three patients with traumatic prefrontal injury scored well on perception, language and intelligence tests but failed open-ended tasks with multiple subgoals, typically spending too long on single tasks. Frontal patients whose lesions involved area 10 were impaired on multitasking, which correlated with damage to right lateral area 10. In 44 frontal patients, deficits on the Hotel multitasking task were not fully explained by fluid intelligence and were associated with right anterior frontal lesions.
      fr: Trois patients ayant un traumatisme préfrontal réussissaient les tests de perception, de langage et d’intelligence mais échouaient à des tâches ouvertes à sous-buts multiples, passant généralement trop de temps sur une seule tâche. Les patients frontaux dont les lésions touchaient l’aire 10 étaient altérés en multitâche, ce qui corrélait avec l’atteinte de l’aire 10 latérale droite. Chez 44 patients frontaux, les déficits à la tâche multitâche de l’hôtel ne s’expliquaient pas entièrement par l’intelligence fluide et étaient associés à des lésions frontales antérieures droites.
    limitation:
      en: A later study with new naturalistic tasks found deficits that fluid intelligence did not explain but that were associated with diverse lesions rather than one region. Samples were small, and the area 10 studies drew on overlapping research panels.
      fr: Une étude ultérieure utilisant de nouvelles tâches naturalistes trouvait des déficits non expliqués par l’intelligence fluide, mais associés à des lésions diverses plutôt qu’à une seule région. Les échantillons étaient petits, et les études sur l’aire 10 provenaient de panels de recherche qui se recoupent.
    mapping_note:
      en: The right transverse frontopolar parcel marks lateral area 10. It is a coarse landmark that does not separate lateral from medial area 10 or reproduce the measured lesion volumes.
      fr: La parcelle frontopolaire transverse droite repère l’aire 10 latérale. C’est un repère grossier qui ne sépare pas l’aire 10 latérale de l’aire 10 médiane et ne reproduit pas les volumes lésionnels mesurés.
    mappings:
      - {region: 'destrieux:right:5', source_name: G_and_S_transv_frontopol}
    evidence:
      - {reference: shallice-1991, role: supporting}
      - {reference: roca-2011, role: supporting}
      - {reference: roca-2010, role: supporting}
      - {reference: smith-2022, role: qualifying}

  - id: multitasking-posterior-cingulate
    deficit: multitasking
    title: {en: Remembering task rules, fr: Se souvenir des règles d’une tâche}
    network: {en: Left cingulate retrospective-memory system, fr: Système cingulaire gauche de mémoire rétrospective}
    laterality: left
    finding:
      en: Among 60 patients with circumscribed lesions and 60 matched controls, left posterior cingulate and forceps major lesions impaired every multitasking measure except planning. Rule-breaking and task-switching failures were also linked to medial and polar areas 8, 9 and 10, and planning deficits to right dorsolateral prefrontal lesions.
      fr: Chez 60 patients ayant des lésions circonscrites et 60 témoins appariés, les lésions cingulaires postérieures gauches et du forceps majeur altéraient toutes les mesures de multitâche sauf la planification. Les transgressions de règles et les échecs d’alternance étaient aussi liés aux aires 8, 9 et 10 médianes et polaires, et les déficits de planification aux lésions préfrontales dorsolatérales droites.
    limitation:
      en: This is a single study, and its division into retrospective memory, prospective memory and planning is a structural equation model fitted to its own data.
      fr: Il s’agit d’une seule étude, et sa division en mémoire rétrospective, mémoire prospective et planification est un modèle d’équations structurelles ajusté à ses propres données.
    mapping_note:
      en: The left dorsal and ventral posterior cingulate parcels mark the posterior cingulate lesions. The forceps major, a white-matter tract, and the medial, polar and right dorsolateral frontal findings are not coloured.
      fr: Les parcelles cingulaires postérieures dorsale et ventrale gauches repèrent les lésions cingulaires postérieures. Le forceps majeur, un faisceau de substance blanche, et les constats frontaux médians, polaires et dorsolatéraux droits ne sont pas colorés.
    mappings:
      - {region: 'destrieux:left:9', source_name: G_cingul-Post-dorsal}
      - {region: 'destrieux:left:10', source_name: G_cingul-Post-ventral}
    evidence:
      - {reference: burgess-2000, role: supporting}

  - id: grasping-medial-frontal
    deficit: pathological-grasping
    title: {en: Grasp reflex after medial frontal damage, fr: Réflexe de préhension après atteinte frontale médiane}
    network: {en: Medial frontal motor control system, fr: Système frontal médian de contrôle moteur}
    laterality: bilateral
    finding:
      en: Among 491 consecutive neurological admissions, grasping was found in 8% of brain-damaged patients, always with frontal or deep lesions and never with damage confined behind the central sulcus. In a second group of 44 patients, grasping occurred in 70% of those with medial frontal involvement and was always associated with cingulate damage. In 28 unilateral stroke patients, lesions largely confined to the supplementary motor area produced a grasp reflex mainly in the opposite hand, whereas anterior cingulate damage produced groping.
      fr: Parmi 491 admissions neurologiques consécutives, une préhension était trouvée chez 8 % des patients cérébrolésés, toujours avec des lésions frontales ou profondes et jamais avec une atteinte limitée en arrière du sillon central. Dans un second groupe de 44 patients, la préhension survenait chez 70 % de ceux ayant une atteinte frontale médiane et s’associait toujours à une atteinte cingulaire. Chez 28 patients ayant un AVC unilatéral, les lésions surtout limitées à l’aire motrice supplémentaire produisaient un réflexe de préhension surtout dans la main opposée, tandis que l’atteinte cingulaire antérieure produisait un groping.
    limitation:
      en: The two series disagree on the critical structure. One found cingulate damage in every case, with the supplementary motor area less consistently involved; the other tied the grasp reflex to the supplementary motor area. Grasping also followed lateral premotor and deep lesions, and often affected both hands after a one-sided lesion. Subgroups were small, with four supplementary motor area cases.
      fr: Les deux séries divergent sur la structure critique. L’une trouvait une atteinte cingulaire dans chaque cas, l’aire motrice supplémentaire étant touchée de façon moins constante; l’autre reliait le réflexe de préhension à l’aire motrice supplémentaire. La préhension suivait aussi des lésions prémotrices latérales et profondes, et touchait souvent les deux mains après une lésion unilatérale. Les sous-groupes étaient petits, avec quatre cas limités à l’aire motrice supplémentaire.
    mapping_note:
      en: The superior frontal gyri mark the supplementary motor area on the medial surface, and the anterior midcingulate parcels the adjacent cingulate cortex. Both exceed the lesions, and the reports do not resolve cingulate subdivisions.
      fr: Les gyri frontaux supérieurs repèrent l’aire motrice supplémentaire sur la face médiane, et les parcelles cingulaires moyennes antérieures le cortex cingulaire adjacent. Les deux dépassent les lésions, et les rapports ne distinguent pas les subdivisions cingulaires.
    mappings:
      - {region: 'destrieux:left:16', source_name: G_front_sup}
      - {region: 'destrieux:right:16', source_name: G_front_sup}
      - {region: 'destrieux:left:7', source_name: G_and_S_cingul-Mid-Ant}
      - {region: 'destrieux:right:7', source_name: G_and_S_cingul-Mid-Ant}
    evidence:
      - {reference: de-renzi-1992, role: supporting}
      - {reference: hashimoto-1998, role: supporting}

  - id: vertigo-medial-cerebellum
    deficit: cerebellar-vertigo
    title: {en: Isolated vertigo mimicking vestibular neuritis, fr: Vertige isolé imitant une névrite vestibulaire}
    network: {en: Vestibulocerebellar system, fr: Système vestibulocérébelleux}
    laterality: bilateral
    finding:
      en: Among 240 consecutive isolated cerebellar infarctions, 25 (10.4%) presented like vestibular neuritis, and 24 of these involved the medial branch territory of the posterior inferior cerebellar artery. Eight patients with isolated nodular infarction presented with vertigo and moderate to severe imbalance, usually with ipsilesional nystagmus and falling to the opposite side, but with normal head impulse and caloric tests.
      fr: Parmi 240 infarctus cérébelleux isolés consécutifs, 25 (10,4 %) se présentaient comme une névrite vestibulaire, dont 24 touchaient le territoire de la branche médiale de l’artère cérébelleuse postéro-inférieure. Huit patients ayant un infarctus nodulaire isolé présentaient un vertige et un déséquilibre modéré à sévère, généralement avec un nystagmus ipsilésionnel et une chute du côté opposé, mais avec des tests d’impulsion céphalique et caloriques normaux.
    limitation:
      en: In 101 high-risk patients with acute vestibular syndrome, initial diffusion-weighted MRI missed 12% of strokes, all within 48 hours of onset, while a bedside examination of head impulse, nystagmus and skew was more sensitive. Imaging-defined series may therefore under-count such strokes, and vertigo alone does not distinguish a cerebellar from an inner-ear cause.
      fr: Chez 101 patients à haut risque ayant un syndrome vestibulaire aigu, l’IRM de diffusion initiale manquait 12 % des AVC, tous dans les 48 heures suivant le début, alors qu’un examen au chevet de l’impulsion céphalique, du nystagmus et de la déviation oblique était plus sensible. Les séries définies par l’imagerie peuvent donc sous-estimer ces AVC, et le vertige seul ne distingue pas une cause cérébelleuse d’une cause de l’oreille interne.
    mapping_note:
      en: The nodulus (vermis X) marks the isolated nodular infarcts. The medial posterior inferior cerebellar artery territory in the larger series is wider than the nodulus and is not reconstructed.
      fr: Le nodule (vermis X) repère les infarctus nodulaires isolés. Le territoire médial de l’artère cérébelleuse postéro-inférieure de la plus grande série dépasse le nodule et n’est pas reconstruit.
    mappings:
      - {region: 'learning:vermis-x', source_name: Vermis X (nodulus)}
    evidence:
      - {reference: lee-2006, role: supporting}
      - {reference: moon-2009, role: supporting}
      - {reference: kattah-2009, role: qualifying}

  - id: line-orientation-right-hemisphere
    deficit: line-orientation
    title: {en: Judging the angle of lines, fr: Juger l’angle des lignes}
    network: {en: Right hemisphere visuospatial system, fr: Système visuospatial de l’hémisphère droit}
    laterality: right
    finding:
      en: Among 181 patients from a focal-lesion registry, 23 were impaired on the Judgment of Line Orientation test, and failure was most strongly associated with right posterior parietal lesions. In 111 patients with first-ever ischaemic stroke, poor line orientation shared right frontal, superior temporal and supramarginal correlates with figure copying but, unlike copying, was not associated with the right superior parietal lobule or the angular and middle occipital gyri.
      fr: Parmi 181 patients d’un registre de lésions focales, 23 étaient altérés au test de jugement d’orientation de lignes, et l’échec était le plus fortement associé aux lésions pariétales postérieures droites. Chez 111 patients ayant un premier AVC ischémique, une orientation de lignes déficitaire partageait avec la copie de figure des corrélats frontaux, temporaux supérieurs et supramarginaux droits mais, contrairement à la copie, n’était pas associée au lobule pariétal supérieur droit ni aux gyri angulaire et occipital moyen.
    limitation:
      en: The two studies place the critical damage differently, posterior parietal in one and frontal, superior temporal and supramarginal in the other, so no single region is established. Like figure copying, the test also draws on perceptual, attentional and decision components.
      fr: Les deux études situent différemment l’atteinte critique, pariétale postérieure dans l’une et frontale, temporale supérieure et supramarginale dans l’autre, donc aucune région unique n’est établie. Comme la copie de figure, le test fait aussi appel à des composantes perceptives, attentionnelles et décisionnelles.
    mapping_note:
      en: The right supramarginal gyrus is the parietal parcel consistent with both studies' descriptions. The stroke study's frontal and superior temporal correlates, and any posterior parietal damage outside the supramarginal gyrus, are not coloured.
      fr: Le gyrus supramarginal droit est la parcelle pariétale compatible avec les descriptions des deux études. Les corrélats frontaux et temporaux supérieurs de l’étude sur l’AVC, et toute atteinte pariétale postérieure hors du gyrus supramarginal, ne sont pas colorés.
    mappings:
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
    evidence:
      - {reference: tranel-2009, role: supporting}
      - {reference: biesbroek-2014, role: supporting}

  - id: agrammatism-inferior-frontal
    deficit: agrammatism
    title: {en: 'Simplified, telegraphic sentences', fr: Phrases simplifiées et télégraphiques}
    network: {en: Left inferior frontal grammar system, fr: Système frontal inférieur gauche de la grammaire}
    laterality: left
    finding:
      en: Among 53 patients with chronic left-hemisphere stroke rated from a story retelling, agrammatism was associated with damage to Broca's area but not to posterior temporal cortex, also after accounting for speech rate. In 71 stroke survivors, morphosyntactically reduced speech was predicted by left inferior frontal lesions, and automated analysis of connected speech in another study linked reduced syntactic complexity to the posterior inferior frontal gyrus. In an independent group of 50, shorter utterances were associated with anterior insula and inferior frontal damage.
      fr: Parmi 53 patients ayant un AVC gauche chronique évalués sur le récit d’une histoire, l’agrammatisme était associé à l’atteinte de l’aire de Broca mais non du cortex temporal postérieur, y compris après prise en compte du débit de parole. Chez 71 survivants d’AVC, un discours morphosyntaxiquement réduit était prédit par des lésions frontales inférieures gauches, et l’analyse automatisée du discours continu dans une autre étude reliait une complexité syntaxique réduite au gyrus frontal inférieur postérieur. Dans un groupe indépendant de 50 personnes, des énoncés plus courts étaient associés à une atteinte de l’insula antérieure et du gyrus frontal inférieur.
    limitation:
      en: The first three studies come from one research consortium with partly overlapping patients. In the independent study, utterance length tracked overall amount of speech closely, so grammar and fluency are hard to separate. Agrammatic production was not associated with impaired syntactic comprehension.
      fr: Les trois premières études proviennent d’un même consortium de recherche dont les patients se recoupent en partie. Dans l’étude indépendante, la longueur des énoncés suivait de près la quantité globale de discours, de sorte que grammaire et fluence sont difficiles à séparer. La production agrammatique n’était pas associée à une compréhension syntaxique altérée.
    mapping_note:
      en: Left opercular and triangular inferior frontal parcels mark Broca's area. The anterior insula and the frontoparietal white matter are not coloured.
      fr: Les parcelles frontales inférieures operculaire et triangulaire gauches repèrent l’aire de Broca. L’insula antérieure et la substance blanche frontopariétale ne sont pas colorées.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
      - {region: 'destrieux:left:14', source_name: G_front_inf-Triangul}
    evidence:
      - {reference: matchin-2020, role: supporting}
      - {reference: den-ouden-2019, role: supporting}
      - {reference: gleichgerrcht-2021, role: supporting}
      - {reference: borovsky-2007, role: supporting}
      - {reference: matchin-2023, role: qualifying}

  - id: paragrammatism-posterior-temporal
    deficit: agrammatism
    title: {en: Fluent speech with misused grammar, fr: Discours fluide à la grammaire mal employée}
    network: {en: Left posterior temporal syntax system, fr: Système temporal postérieur gauche de la syntaxe}
    laterality: left
    finding:
      en: In the same 53 patients, paragrammatism was associated with damage to the left posterior superior and middle temporal gyri but not to Broca's area. In partly overlapping groups of 130 and 218, paragrammatism, unlike agrammatism, was associated with impaired syntactic comprehension, which also depended on temporal lobe damage.
      fr: Chez les mêmes 53 patients, le paragrammatisme était associé à l’atteinte des gyri temporaux supérieur et moyen postérieurs gauches mais non de l’aire de Broca. Dans des groupes partiellement chevauchants de 130 et 218 personnes, le paragrammatisme, contrairement à l’agrammatisme, était associé à une compréhension syntaxique altérée, qui dépendait aussi de l’atteinte du lobe temporal.
    limitation:
      en: The lesion correlates of paragrammatism come from one group of 53 classified by expert consensus, and the whole-brain confirmation was uncorrected. The comprehension analyses reused overlapping patients from the same consortium.
      fr: Les corrélats lésionnels du paragrammatisme proviennent d’un seul groupe de 53 personnes classées par consensus d’experts, et la confirmation sur le cerveau entier n’était pas corrigée. Les analyses de compréhension réutilisaient des patients du même consortium qui se recoupent.
    mapping_note:
      en: The left lateral superior temporal and middle temporal parcels mark the posterior temporal correlates. Both whole parcels extend far forward of the reported damage.
      fr: Les parcelles temporale supérieure latérale et temporale moyenne gauches repèrent les corrélats temporaux postérieurs. Les deux parcelles entières s’étendent bien en avant de l’atteinte rapportée.
    mappings:
      - {region: 'destrieux:left:34', source_name: G_temp_sup-Lateral}
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
    evidence:
      - {reference: matchin-2020, role: supporting}
      - {reference: matchin-2023, role: supporting}

  - id: crossed-sensory-lateral-medulla
    deficit: crossed-sensory-loss
    title: {en: Face and body sensory loss on opposite sides, fr: Perte sensitive du visage et du corps de côtés opposés}
    network: {en: Lateral medullary sensory pathways, fr: Voies sensitives bulbaires latérales}
    laterality: bilateral
    finding:
      en: In 33 consecutive patients with lateral medullary syndrome, contralateral hypalgesia was found in 85%, alongside Horner's syndrome in 91% and ipsilateral ataxia in 85%. In 50 consecutive patients studied with MRI, the classic pattern of ipsilateral facial and contralateral body sensory loss occurred in only 13 (26%), with lesions confined to the most posterolateral part of the caudal-middle medulla. Sensory loss on both sides of the face went with large, ventrally extending lesions.
      fr: Chez 33 patients consécutifs ayant un syndrome bulbaire latéral, une hypoalgésie controlatérale était trouvée chez 85 %, avec un syndrome de Claude Bernard-Horner chez 91 % et une ataxie ipsilatérale chez 85 %. Chez 50 patients consécutifs étudiés par IRM, le tableau classique de perte sensitive faciale ipsilatérale et corporelle controlatérale ne survenait que chez 13 (26 %), avec des lésions limitées à la partie la plus postérolatérale du bulbe caudal-moyen. Une perte sensitive des deux côtés du visage accompagnait de grandes lésions s’étendant vers l’avant.
    limitation:
      en: Sensory patterns were diverse and did not always match MRI findings; very small lesions could produce isolated facial or body loss, and some deficits appeared only after a delay. In the first series, only 22 of 33 patients had MRI, and two scans were normal.
      fr: Les tableaux sensitifs étaient variés et ne concordaient pas toujours avec l’IRM; de très petites lésions pouvaient produire une perte faciale ou corporelle isolée, et certains déficits n’apparaissaient qu’après un délai. Dans la première série, seuls 22 des 33 patients avaient une IRM, et deux examens étaient normaux.
    mapping_note:
      en: The left and right medullary territories mark lesions on either side. They far exceed the lateral and posterolateral infarcts and do not resolve the spinothalamic tract or the trigeminal nucleus.
      fr: Les territoires bulbaires gauche et droit repèrent les lésions de chaque côté. Ils dépassent largement les infarctus latéraux et postérolatéraux et ne délimitent ni le faisceau spinothalamique ni le noyau trijumeau.
    mappings:
      - {region: 'learning:left:medulla', source_name: Medullary territory}
      - {region: 'learning:right:medulla', source_name: Medullary territory}
    evidence:
      - {reference: sacco-1993, role: supporting}
      - {reference: kim-1997, role: supporting}

  - id: smoking-insula
    deficit: smoking-addiction-disruption
    title: {en: Losing the urge to smoke after insular damage, fr: Perte de l’envie de fumer après une atteinte insulaire}
    network: {en: Insular interoceptive system, fr: Système insulaire intéroceptif}
    laterality: bilateral
    finding:
      en: Among 19 smokers with insular damage and 50 with damage elsewhere, those with insular damage were more likely to quit easily, immediately and without relapse or persisting urges. In 156 smokers with acute ischaemic stroke, insular infarcts reduced smoking urges more than other infarcts, immediately and at three months. In 63 stroke patients followed for a year, 75% with combined basal ganglia and insular damage had stopped smoking, compared with 37% after basal ganglia damage alone and 14.3% after damage elsewhere.
      fr: Parmi 19 fumeurs ayant une atteinte insulaire et 50 ayant une atteinte ailleurs, ceux ayant une atteinte insulaire arrêtaient plus souvent de fumer facilement, immédiatement, sans rechute ni envie persistante. Chez 156 fumeurs ayant un AVC ischémique aigu, les infarctus insulaires réduisaient davantage l’envie de fumer que les autres infarctus, immédiatement et à trois mois. Chez 63 patients suivis un an après un AVC, 75 % de ceux ayant une atteinte combinée des noyaux gris centraux et de l’insula avaient cessé de fumer, contre 37 % après une atteinte des noyaux gris centraux seule et 14,3 % après une atteinte ailleurs.
    limitation:
      en: A prospective study of 87 smokers after first-ever stroke found no association between insular or any other lesion site and smoking at three months, and no sudden disruption of addiction. The first study relied on patients' recollection of quitting, the first and third come from the same patient registry, and urges before stroke were rated retrospectively. Damage to the basal ganglia alone also increased quitting.
      fr: Une étude prospective de 87 fumeurs après un premier AVC ne trouvait aucune association entre l’atteinte insulaire ou tout autre site lésionnel et le tabagisme à trois mois, ni d’interruption soudaine de la dépendance. La première étude reposait sur le souvenir de l’arrêt par les patients, la première et la troisième proviennent du même registre de patients, et l’envie avant l’AVC était évaluée rétrospectivement. L’atteinte isolée des noyaux gris centraux augmentait aussi l’arrêt.
    mapping_note:
      en: The long and short insular gyri on both sides mark the insula. Insular lesions often extended into neighbouring regions, and the basal ganglia contribution in the one-year study is not coloured.
      fr: Les gyri insulaires longs et courts des deux côtés repèrent l’insula. Les lésions insulaires s’étendaient souvent aux régions voisines, et la contribution des noyaux gris centraux dans l’étude d’un an n’est pas colorée.
    mappings:
      - {region: 'destrieux:left:17', source_name: G_Ins_lg_and_S_cent_ins}
      - {region: 'destrieux:right:17', source_name: G_Ins_lg_and_S_cent_ins}
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:right:18', source_name: G_insular_short}
    evidence:
      - {reference: naqvi-2007, role: supporting}
      - {reference: abdolahi-2017, role: supporting}
      - {reference: gaznick-2014, role: supporting}
      - {reference: bienkowski-2010, role: qualifying}

  - id: cardiac-right-insula
    deficit: insular-cardiac-dysfunction
    title: {en: Arrhythmia and myocardial injury after right insular stroke, fr: Arythmie et atteinte myocardique après AVC insulaire droit}
    network: {en: Insular central autonomic network, fr: Réseau autonome central insulaire}
    laterality: right
    finding:
      en: In 103 consecutive first-ever ischaemic strokes, right insular damage was associated with lower heart rate variability and more complex arrhythmias than other locations. Among 179 acute strokes, right insular lesions were related to atrial fibrillation, atrioventricular block and frequent ectopic beats, and increased the odds of death within three months (odds ratio 6.2). In 493 infarcts compared with matched controls, insular involvement was associated with abnormal repolarization, and right insular infarcts with two-year all-cause death (hazard ratio 2.11). Voxel-based mapping linked rising troponin in 299 patients to the right dorsal anterior insula, and reduced left ventricular ejection fraction in 231 patients to the right insula, amygdala and operculum.
      fr: Chez 103 patients consécutifs ayant un premier AVC ischémique, l’atteinte insulaire droite était associée à une variabilité de la fréquence cardiaque plus faible et à des arythmies plus complexes que les autres localisations. Parmi 179 AVC aigus, les lésions insulaires droites étaient liées à la fibrillation auriculaire, au bloc auriculoventriculaire et aux extrasystoles fréquentes, et augmentaient la probabilité de décès à trois mois (rapport de cotes 6,2). Dans 493 infarctus comparés à des témoins appariés, l’atteinte insulaire était associée à une repolarisation anormale, et les infarctus insulaires droits au décès toutes causes à deux ans (rapport de risque 2,11). La cartographie voxel par voxel reliait la hausse de la troponine chez 299 patients à l’insula antérieure dorsale droite, et la baisse de la fraction d’éjection ventriculaire gauche chez 231 patients à l’insula, à l’amygdale et à l’opercule droits.
    limitation:
      en: These are associations in observational stroke cohorts. Insular infarcts are often large and involve neighbouring cortex, and pre-existing heart disease, atrial fibrillation as a cause of stroke and treatment can confound them. The mortality associations do not show that the cardiac changes caused the deaths, and troponin on admission was not related to lesion location. One study's authors note that their sample was small and needs confirmation.
      fr: Il s’agit d’associations dans des cohortes observationnelles d’AVC. Les infarctus insulaires sont souvent étendus et touchent le cortex voisin, et une cardiopathie préexistante, une fibrillation auriculaire à l’origine de l’AVC et les traitements peuvent les confondre. Les associations avec la mortalité ne montrent pas que les changements cardiaques ont causé les décès, et la troponine à l’admission n’était pas liée à la localisation lésionnelle. Les auteurs d’une étude notent que leur échantillon était petit et demande confirmation.
    mapping_note:
      en: The right long and short insular gyri mark the insular lesions. The studies did not consistently resolve insular subdivisions, and the dorsal anterior focus of the troponin study and the amygdala and opercular findings of the ejection-fraction study are not separately coloured.
      fr: Les gyri insulaires longs et courts droits repèrent les lésions insulaires. Les études ne distinguaient pas de façon cohérente les subdivisions insulaires, et le foyer antérieur dorsal de l’étude sur la troponine ainsi que les constats amygdaliens et operculaires de l’étude sur la fraction d’éjection ne sont pas colorés séparément.
    mappings:
      - {region: 'destrieux:right:17', source_name: G_Ins_lg_and_S_cent_ins}
      - {region: 'destrieux:right:18', source_name: G_insular_short}
    evidence:
      - {reference: colivicchi-2004, role: supporting}
      - {reference: christensen-2005, role: supporting}
      - {reference: abboud-2006, role: supporting}
      - {reference: krause-2017, role: supporting}
      - {reference: winder-2023, role: supporting}

  - id: cardiac-left-insula
    deficit: insular-cardiac-dysfunction
    title: {en: Adverse cardiac outcome after left insular stroke, fr: Évolution cardiaque défavorable après AVC insulaire gauche}
    network: {en: Insular central autonomic network, fr: Réseau autonome central insulaire}
    laterality: left
    finding:
      en: In a prospective study of 32 patients with left insular stroke and 84 with non-insular stroke or transient ischaemic attack, left insular stroke predicted adverse cardiac outcomes over one year (relative risk 1.75) and impaired cardiac wall motion; right insular stroke did not.
      fr: Dans une étude prospective de 32 patients ayant un AVC insulaire gauche et 84 ayant un AVC non insulaire ou un accident ischémique transitoire, l’AVC insulaire gauche prédisait une évolution cardiaque défavorable sur un an (risque relatif 1,75) et une altération de la cinétique pariétale cardiaque; l’AVC insulaire droit non.
    limitation:
      en: This conflicts with the right-sided associations in other cohorts. The confidence interval reached down to 1.02, the effect was concentrated in patients without symptomatic coronary disease, and the authors' explanation through cardioprotective medication is a hypothesis. In another cohort, abnormal repolarization after insular infarction showed no interaction with side.
      fr: Ce résultat contredit les associations droites d’autres cohortes. L’intervalle de confiance descendait à 1,02, l’effet se concentrait chez les patients sans coronaropathie symptomatique, et l’explication des auteurs par une médication cardioprotectrice reste une hypothèse. Dans une autre cohorte, la repolarisation anormale après infarctus insulaire ne montrait pas d’interaction avec le côté.
    mapping_note:
      en: The left long and short insular gyri mark the left insular strokes; their extent beyond the insula is not reconstructed.
      fr: Les gyri insulaires longs et courts gauches repèrent les AVC insulaires gauches; leur extension au-delà de l’insula n’est pas reconstruite.
    mappings:
      - {region: 'destrieux:left:17', source_name: G_Ins_lg_and_S_cent_ins}
      - {region: 'destrieux:left:18', source_name: G_insular_short}
    evidence:
      - {reference: laowattana-2006, role: supporting}
      - {reference: abboud-2006, role: qualifying}

  - id: hiccups-medulla
    deficit: post-stroke-hiccups
    title: {en: Hiccups after lateral medullary infarction, fr: Hoquet après infarctus bulbaire latéral}
    network: {en: Medullary respiratory reflex circuits, fr: Circuits bulbaires des réflexes respiratoires}
    laterality: bilateral
    finding:
      en: Seven of 51 patients with lateral medullary infarction imaged within three days developed hiccups, all with lesions at the middle medullary level, most often dorsolateral. In 31 lateral medullary infarcts, 11 had hiccups, and voxel-based mapping associated them with the dorsolateral middle medulla. Among 5,309 consecutive admissions for ischaemic stroke or transient ischaemic attack, hiccups were recorded in 16, nine of them with lateral medullary infarcts.
      fr: Sept des 51 patients ayant un infarctus bulbaire latéral examinés dans les trois jours développaient un hoquet, tous avec des lésions au niveau moyen du bulbe, le plus souvent dorsolatérales. Parmi 31 infarctus bulbaires latéraux, 11 s’accompagnaient de hoquet, et la cartographie voxel par voxel l’associait au bulbe moyen dorsolatéral. Parmi 5 309 admissions consécutives pour AVC ischémique ou accident ischémique transitoire, un hoquet était noté chez 16 patients, dont neuf avec un infarctus bulbaire latéral.
    limitation:
      en: Hiccup cases were few, and two of the studies were retrospective. The other seven of the 16 hiccup cases had supratentorial infarcts, six right-sided, including insular, temporal and subcortical damage, so hiccups do not localize to the medulla alone. All hiccup patients in the 51-patient series also had vertigo, nausea, vomiting and dysphagia.
      fr: Les cas de hoquet étaient peu nombreux, et deux des études étaient rétrospectives. Les sept autres des 16 cas avaient des infarctus sus-tentoriels, six à droite, touchant notamment l’insula, le lobe temporal et la substance sous-corticale, de sorte que le hoquet ne se localise pas au seul bulbe. Tous les patients avec hoquet de la série de 51 avaient aussi vertige, nausées, vomissements et dysphagie.
    mapping_note:
      en: The left and right medullary territories mark lesions on either side; they far exceed the dorsolateral middle-level focus. The supratentorial cases are not coloured.
      fr: Les territoires bulbaires gauche et droit repèrent les lésions de chaque côté; ils dépassent largement le foyer dorsolatéral de niveau moyen. Les cas sus-tentoriels ne sont pas colorés.
    mappings:
      - {region: 'learning:left:medulla', source_name: Medullary territory}
      - {region: 'learning:right:medulla', source_name: Medullary territory}
    evidence:
      - {reference: park-2005, role: supporting}
      - {reference: prabhakar-2021, role: supporting}
      - {reference: itabashi-2019, role: qualifying}

  - id: adaptation-cerebellar-lobules
    deficit: motor-adaptation
    title: {en: Adapting reaching to rotations and force fields, fr: Adapter l’atteinte de cibles aux rotations et champs de force}
    network: {en: Cerebellar arm-area adaptation system, fr: Système cérébelleux d’adaptation de la zone du bras}
    laterality: bilateral
    finding:
      en: In 19 patients with focal cerebellar infarcts, adaptation to force fields depended mainly on lobules IV and V and adaptation to visuomotor rotation on lobule VI extending into V, with Crus I and II contributing to both. With nine posterior inferior and six superior cerebellar artery infarcts, adaptive improvement under a 60° visual rotation was degraded in both groups, more after superior infarcts, with overlap in Crus I and lobule V. Only superior infarcts, involving lobules V and VI, impaired aftereffects.
      fr: Chez 19 patients ayant des infarctus cérébelleux focaux, l’adaptation aux champs de force dépendait surtout des lobules IV et V, et l’adaptation à la rotation visuomotrice du lobule VI s’étendant au V, les Crus I et II contribuant aux deux. Avec neuf infarctus de l’artère cérébelleuse postéro-inférieure et six de l’artère cérébelleuse supérieure, l’amélioration adaptative sous une rotation visuelle de 60° était altérée dans les deux groupes, davantage après les infarctus supérieurs, avec un recouvrement dans le Crus I et le lobule V. Seuls les infarctus supérieurs, touchant les lobules V et VI, altéraient les effets consécutifs.
    limitation:
      en: Both studies come from one centre and may share patients, groups were small, and mapping relied on lesion overlap and subtraction. Performance in the two tasks did not correlate, so adaptation is not a single ability.
      fr: Les deux études proviennent d’un même centre et peuvent partager des patients, les groupes étaient petits, et la cartographie reposait sur le recouvrement et la soustraction lésionnels. Les performances aux deux tâches ne corrélaient pas, donc l’adaptation n’est pas une capacité unique.
    mapping_note:
      en: Lobules V and VI and Crus I and II on both sides mark the reported regions for lesions on either side. Lobules I–IV form a single parcel in this atlas and are not coloured.
      fr: Les lobules V et VI et les Crus I et II des deux côtés repèrent les régions rapportées pour des lésions de chaque côté. Les lobules I à IV forment une seule parcelle dans cet atlas et ne sont pas colorés.
