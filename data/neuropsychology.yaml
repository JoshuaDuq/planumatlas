      - {region: 'destrieux:right:17', source_name: 'G_Ins_lg&S_cent_ins'}
    evidence:
      - {reference: pritchard-1999, role: supporting}

  - id: somatoparaphrenia-subcortical
    deficit: somatoparaphrenia
    title: {en: Subcortical components of limb disownership, fr: Composantes sous-corticales de la désappropriation corporelle}
    network: {en: Distributed right cortical–subcortical ownership network, fr: Réseau distribué cortico-sous-cortical droit d’appartenance corporelle}
    laterality: right
    finding:
      en: Compared with matched patients, somatoparaphrenia involved additional white-matter and subcortical damage, including thalamus and amygdala, alongside distributed cortical injury.
      fr: Par rapport aux patients appariés, la somatoparaphrénie impliquait des lésions supplémentaires de substance blanche et sous-corticales, dont le thalamus et l’amygdale, avec atteinte corticale distribuée.
    limitation:
      en: Localization is disputed. Feinberg’s comparison instead emphasized additional orbitofrontal damage; neither study establishes one sufficient lesion site.
      fr: La localisation est débattue. La comparaison de Feinberg soulignait plutôt une atteinte orbitofrontale supplémentaire; aucune étude n’établit un site lésionnel suffisant à lui seul.
    mapping_note:
      en: Whole right thalamus and amygdala are selected landmarks only. Cortical injury and white-matter disconnection in the reported network are not represented by these two structures.
      fr: Le thalamus et l’amygdale droits entiers sont seulement des repères sélectionnés. Les lésions corticales et la déconnexion de substance blanche du réseau rapporté ne sont pas représentées par ces deux structures.
