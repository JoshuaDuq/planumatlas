  - id: palinopsia-occipital
    deficit: palinopsia
    title: {en: Persistent images with posterior cortical injury, fr: Images persistantes avec atteinte corticale postérieure}
    network: {en: Posterior visual processing, fr: Traitement visuel postérieur}
    laterality: left
    finding:
      en: A woman with a left inferior occipital and occipitotemporal tumour had recurring afterimages and pure alexia. Earlier CT cases described repetitive images of previously viewed scenes with large occipital lesions.
      fr: Une femme avec tumeur occipitale inférieure et occipitotemporale gauche avait des images rémanentes répétées et une alexie pure. Des cas antérieurs en TDM décrivaient des images répétées de scènes déjà vues avec de larges lésions occipitales.
    limitation:
      en: The lesion cases had variable anatomy and associated symptoms. Hughes reported dose-related palinopsia with trazodone in three patients, so the symptom is not specific to a structural posterior lesion or this side of the brain.
      fr: Les cas lésionnels avaient une anatomie et des symptômes associés variables. Hughes rapportait une palinopsie dose-dépendante sous trazodone chez trois patients; le symptôme n’est donc pas spécifique d’une lésion postérieure structurale ou de ce côté du cerveau.
    mapping_note:
      en: The left inferior occipital parcel marks the anatomically specified tumour case only. It does not delineate the full mass, the adjacent word-recognition territory, or the broad lesions in the older series.
      fr: La parcelle occipitale inférieure gauche repère seulement le cas tumoral anatomiquement précisé. Elle ne délimite ni toute la masse, ni le territoire adjacent de reconnaissance des mots, ni les larges lésions de la série ancienne.
