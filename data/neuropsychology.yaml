      fr: [astérixis, myoclonies négatives, flapping tremor, interruptions du maintien postural, astérixis unilatéral]

  - id: biological-motion
    name: {en: Impaired biological-motion perception, fr: Trouble de la perception du mouvement biologique}
    domain: {en: Recognizing human movement, fr: Reconnaissance du mouvement humain}
    group: perception
    summary:
      en: Difficulty recognizing human movement from moving point-light displays after brain injury. The evidence concerns specific experimental tasks rather than all action understanding or motion perception.
      fr: Difficulté à reconnaître le mouvement humain dans des animations de points lumineux après lésion cérébrale. Les données concernent des tâches expérimentales précises plutôt que toute compréhension des actions ou perception du mouvement.
    aliases:
      en: [biological motion, point-light walker, human movement recognition, point-light actions]
      fr: [mouvement biologique, marcheur en points lumineux, reconnaissance du mouvement humain, actions en points lumineux]

  - id: working-memory
    name: {en: Working-memory impairment, fr: Trouble de la mémoire de travail}
    domain: {en: Temporary retention and mental manipulation, fr: Maintien temporaire et manipulation mentale}
    group: memory
    summary:
      en: Difficulty holding or reorganizing information over brief delays. This profile distinguishes spatial precision, mental manipulation, distractor filtering and load-sensitive retention; results vary with the task, lesion distribution and time since injury.
      fr: Difficulté à maintenir ou réorganiser des informations pendant un court délai. Ce profil distingue la précision spatiale, la manipulation mentale, le filtrage des distracteurs et le maintien sensible à la charge; les résultats varient selon la tâche, la distribution lésionnelle et le délai depuis la lésion.
    aliases:
      en: [working memory, spatial working memory, visuospatial working memory, mental manipulation, backward span]
      fr: [mémoire de travail, mémoire de travail spatiale, mémoire de travail visuospatiale, manipulation mentale, empan inverse]

  - id: interval-timing
    name: {en: Impaired interval timing, fr: Trouble de l’estimation des durées}
    domain: {en: Discriminating brief durations, fr: Discrimination de durées brèves}
    group: attention-executive
    summary:
      en: Reduced ability to distinguish durations in the range of milliseconds to seconds after brain injury. This profile separates variability in duration judgments from errors in average perceived duration.
      fr: Capacité réduite à distinguer des durées de l’ordre de la milliseconde à la seconde après lésion cérébrale. Ce profil sépare la variabilité des jugements de durée des erreurs de durée moyenne perçue.
    aliases:
      en: [interval timing, time perception, duration discrimination, temporal discrimination, subsecond timing, suprasecond timing]
      fr: [estimation des durées, perception du temps, discrimination des durées, discrimination temporelle, durées infrasecondes, durées suprasecondes]

  - id: gesture-recognition
    name: {en: Impaired gesture recognition, fr: Trouble de la reconnaissance des gestes}
    domain: {en: Recognizing meaningful actions, fr: Reconnaissance d’actions significatives}
    group: perception
    summary:
      en: Difficulty judging the meaning or correct execution of familiar gestures after brain injury. Recognition tasks differ from performing gestures and from detecting biological motion in point-light displays.
      fr: Difficulté à juger le sens ou la bonne exécution de gestes familiers après lésion cérébrale. Les tâches de reconnaissance diffèrent de la réalisation des gestes et de la détection du mouvement biologique dans des animations de points lumineux.
    aliases:
      en: [gesture recognition, gesture comprehension, action recognition, action understanding, pantomime recognition]
      fr: [reconnaissance des gestes, compréhension des gestes, reconnaissance des actions, compréhension des actions, reconnaissance des pantomimes]

  - id: sustained-attention
    name: {en: Sustained-attention impairment, fr: Trouble de l’attention soutenue}
    domain: {en: Maintaining attention over time, fr: Maintien de l’attention dans le temps}
    group: attention-executive
    summary:
      en: Difficulty maintaining task performance over time after brain injury. This profile distinguishes broad vigilance deficits from a decline specific to maintaining attention to spatial locations.
      fr: Difficulté à maintenir les performances au fil du temps après lésion cérébrale. Ce profil distingue les déficits généraux de vigilance d’un déclin spécifique au maintien de l’attention envers des positions spatiales.
    aliases:
      en: [sustained attention, vigilance, vigilance decrement, maintaining concentration, time on task]
      fr: [attention soutenue, vigilance, déclin de vigilance, maintien de la concentration, durée de la tâche]

  - id: astasia
    name: {en: Astasia after focal brain injury, fr: Astasie après lésion cérébrale focale}
    domain: {en: Maintaining upright stance, fr: Maintien de la station debout}
    group: sensorimotor
    summary:
      en: Inability to stand unsupported despite good or near-normal limb strength. This profile concerns documented focal structural lesions and distinguishes thalamic cases from a suprathalamic white-matter case.
      fr: Incapacité à tenir debout sans soutien malgré une force des membres bonne ou presque normale. Ce profil concerne des lésions structurales focales documentées et distingue les cas thalamiques d’un cas de substance blanche suprathalamique.
    aliases:
      en: [astasia, thalamic astasia, inability to stand, stance instability, postural instability]
      fr: [astasie, astasie thalamique, incapacité à tenir debout, instabilité en station debout, instabilité posturale]

  - id: visual-verticality
    name: {en: Impaired visual verticality perception, fr: Trouble de la perception de la verticale visuelle}
    domain: {en: Perceiving orientation relative to gravity, fr: Perception de l’orientation par rapport à la gravité}
    group: perception
    summary:
      en: A tilted judgment of what is visually upright after brain injury. This profile concerns subjective visual vertical measurements and distinguishes cortical from brainstem findings; it does not equate visual verticality with the ability to stand.
      fr: Jugement incliné de ce qui est visuellement vertical après lésion cérébrale. Ce profil concerne la verticale visuelle subjective et distingue les constats corticaux de ceux du tronc cérébral; il n’assimile pas la verticale visuelle à la capacité de tenir debout.
    aliases:
      en: [subjective visual vertical, visual verticality, SVV tilt, gravity perception, tilted vertical]
      fr: [verticale visuelle subjective, perception de la verticale, inclinaison de la verticale, perception de la gravité]

  - id: source-memory
    name: {en: Source-memory impairment, fr: Trouble de la mémoire de source}
    domain: {en: Remembering the origin and context of information, fr: Mémoire de l’origine et du contexte des informations}
    group: memory
    summary:
      en: Difficulty remembering where information came from or the context in which it was learned. Remembering an item and remembering its source can be affected differently; the pattern depends on the task and lesion location.
      fr: Difficulté à se souvenir de l’origine d’une information ou du contexte de son apprentissage. La mémoire d’un élément et celle de sa source peuvent être touchées différemment; le profil dépend de la tâche et de la localisation lésionnelle.
    aliases:
      en: [source memory, source amnesia, context memory, who said what, memory for information origin]
      fr: [mémoire de source, amnésie de source, mémoire du contexte, qui a dit quoi, origine des informations]

  - id: micrographia
    name: {en: Micrographia after acquired brain injury, fr: Micrographie après lésion cérébrale acquise}
    domain: {en: Scaling the size of handwriting, fr: Ajustement de la taille de l’écriture manuscrite}
    group: sensorimotor
    summary:
      en: Acquired reduction in handwriting size, sometimes accompanied by abnormal slowing or writer’s cramp. This profile concerns structural brain injury and separates the motor size of letters from selecting and spelling the intended words.
      fr: Réduction acquise de la taille de l’écriture, parfois accompagnée d’un ralentissement anormal ou d’une crampe de l’écrivain. Ce profil concerne les lésions cérébrales structurales et distingue la taille motrice des lettres du choix et de l’orthographe des mots voulus.
    aliases:
      en: [micrographia, small handwriting, reduced letter size, miniature handwriting]
      fr: [micrographie, petite écriture, réduction de la taille des lettres, écriture miniature]

  - id: hypersomnia
    name: {en: Hypersomnia after thalamic stroke, fr: Hypersomnie après AVC thalamique}
    domain: {en: Maintaining wakefulness and regulating sleep duration, fr: Maintien de l’éveil et régulation de la durée du sommeil}
    group: attention-executive
    summary:
      en: Excessive sleep or markedly increased sleep need after thalamic stroke. This profile concerns measured sleep–wake disturbances and their evolution over time, rather than treating prolonged sleep as equivalent to coma, fatigue or loss of motivation.
      fr: Sommeil excessif ou besoin de sommeil fortement accru après AVC thalamique. Ce profil concerne les troubles veille-sommeil mesurés et leur évolution, sans assimiler le sommeil prolongé au coma, à la fatigue ou à une perte de motivation.
    aliases:
      en: [hypersomnia, hypersomnolence, excessive sleep, increased sleep need, poststroke sleepiness]
      fr: [hypersomnie, hypersomnolence, sommeil excessif, besoin accru de sommeil, somnolence après AVC]

  - id: saccadic-dysmetria
    name: {en: Saccadic dysmetria, fr: Dysmétrie saccadique}
    domain: {en: Accuracy of rapid eye movements, fr: Précision des mouvements oculaires rapides}
    group: sensorimotor
    summary:
      en: Rapid eye movements that overshoot or undershoot their intended target, or require an abnormal pattern of corrections. This profile concerns saccadic accuracy, which can be impaired even when smooth tracking of moving targets is preserved.
      fr: Mouvements oculaires rapides qui dépassent leur cible ou ne l’atteignent pas, ou nécessitent un profil anormal de corrections. Ce profil concerne la précision des saccades, qui peut être altérée malgré une poursuite fluide des cibles mobiles préservée.
    aliases:
      en: [saccadic dysmetria, saccadic hypermetria, saccadic hypometria, inaccurate saccades, overshooting eye movements]
      fr: [dysmétrie saccadique, hypermétrie saccadique, hypométrie saccadique, saccades imprécises, dépassement de la cible oculaire]

  - id: smooth-pursuit
    name: {en: Impaired smooth pursuit, fr: Trouble de la poursuite oculaire lente}
    domain: {en: Tracking a moving visual target, fr: Suivi oculaire d’une cible visuelle mobile}
    group: sensorimotor
    summary:
      en: Difficulty smoothly following a moving target with the eyes. This profile separates cerebellar findings from distributed cerebral lesion associations and distinguishes tracking speed from the accuracy or initiation of rapid saccades.
      fr: Difficulté à suivre une cible mobile de façon fluide avec les yeux. Ce profil distingue les constats cérébelleux des associations avec des lésions cérébrales distribuées et sépare la vitesse de poursuite de la précision ou de l’initiation des saccades rapides.
    aliases:
      en: [smooth pursuit, pursuit gain, tracking eye movements, saccadic pursuit, ocular tracking]
      fr: [poursuite oculaire lente, poursuite lisse, gain de poursuite, suivi oculaire, poursuite saccadée]

  - id: phonological-alexia
    name: {en: Phonological alexia, fr: Alexie phonologique}
    domain: {en: Reading unfamiliar letter strings aloud, fr: Lecture à voix haute de suites de lettres inconnues}
    group: language-number
    summary:
      en: Acquired difficulty reading pronounceable unfamiliar letter strings relative to familiar words. This profile concerns phonological decoding and its links to spoken language, distinct from the visual word-recognition impairment of pure alexia.
      fr: Difficulté acquise à lire des suites de lettres inconnues prononçables par rapport aux mots familiers. Ce profil concerne le décodage phonologique et ses liens avec le langage oral, distincts du trouble de reconnaissance visuelle des mots de l’alexie pure.
    aliases:
      en: [phonological alexia, phonological dyslexia, acquired dyslexia, pseudoword reading, nonword reading, sublexical reading]
      fr: [alexie phonologique, dyslexie phonologique acquise, dyslexie acquise, lecture de pseudomots, lecture de non-mots, lecture sublexicale]

  - id: post-stroke-depressive-symptoms
    name: {en: Post-stroke depressive symptoms, fr: Symptômes dépressifs après AVC}
    domain: {en: Depressive mood symptoms following stroke, fr: Symptômes de l’humeur dépressive après AVC}
    group: social-emotional
    summary:
      en: Depressive symptoms measured after stroke, including low mood and reduced interest or pleasure. The cited studies use symptom scales, which do not by themselves establish a depressive-disorder diagnosis or prove that one lesion location caused a person’s mood change.
      fr: Symptômes dépressifs mesurés après AVC, notamment humeur triste et diminution de l’intérêt ou du plaisir. Les études citées utilisent des échelles symptomatiques, qui n’établissent à elles seules ni un diagnostic de trouble dépressif ni la preuve qu’une localisation lésionnelle a causé le changement d’humeur d’une personne.
    aliases:
      en: [poststroke depression, post-stroke depression, depressive symptoms, depressed mood after stroke, loss of pleasure after stroke]
      fr: [dépression après AVC, dépression post-AVC, symptômes dépressifs, humeur dépressive après AVC, perte de plaisir après AVC]

  - id: surface-alexia
    name: {en: Surface alexia, fr: Alexie de surface}
    domain: {en: Accessing word-specific pronunciations, fr: Accès aux prononciations propres aux mots}
    group: language-number
    summary:
      en: Acquired reading errors in which an irregular word is pronounced using more typical spelling-to-sound rules. This profile focuses on regularization errors, distinguishing them from difficulty decoding unfamiliar letter strings or visually recognizing words.
      fr: Erreurs acquises de lecture dans lesquelles un mot irrégulier est prononcé selon des règles de conversion orthographe-son plus habituelles. Ce profil concerne les erreurs de régularisation, distinctes des difficultés de décodage de suites de lettres inconnues ou de reconnaissance visuelle des mots.
    aliases:
      en: [surface alexia, acquired surface dyslexia, acquired dyslexia, regularization errors, irregular word reading, whole-word reading]
      fr: [alexie de surface, dyslexie de surface acquise, dyslexie acquise, erreurs de régularisation, lecture de mots irréguliers, lecture lexicale]

  - id: personal-neglect
    name: {en: Personal neglect, fr: Négligence personnelle}
    domain: {en: Attending to and exploring one’s own body, fr: Attention et exploration de son propre corps}
    group: attention-executive
    summary:
      en: Failure to attend to or explore one side of one’s own body after brain injury, for example during grooming or searching for targets attached to clothing. It can differ from neglect of external space and does not require denying ownership of the affected limb.
      fr: Défaut d’attention ou d’exploration d’un côté de son propre corps après lésion cérébrale, par exemple lors de la toilette ou de la recherche de cibles fixées aux vêtements. Il peut se distinguer de la négligence de l’espace extérieur et n’exige pas de nier l’appartenance du membre atteint.
    aliases:
      en: [personal neglect, body neglect, neglect of personal space, grooming asymmetry, neglect of one side of the body]
      fr: [négligence personnelle, négligence corporelle, négligence de l’espace personnel, asymétrie de toilette, négligence d’un côté du corps]

  - id: auditory-motion
    name: {en: Impaired auditory-motion perception, fr: Trouble de la perception du mouvement auditif}
    domain: {en: Perceiving moving sound sources, fr: Perception des sources sonores en mouvement}
    group: perception
    summary:
      en: Difficulty perceiving or discriminating movement of a sound source after brain injury or surgery. This profile separates auditory motion from sound identity and stationary location; the abilities can be affected differently depending on the lesion and task.
      fr: Difficulté à percevoir ou discriminer le mouvement d’une source sonore après lésion ou chirurgie cérébrale. Ce profil distingue le mouvement auditif de l’identité d’un son et de sa position fixe; ces capacités peuvent être touchées différemment selon la lésion et la tâche.
    aliases:
      en: [auditory motion, motion deafness, cortical motion deafness, moving sound perception, auditory motion discrimination]
      fr: [mouvement auditif, surdité au mouvement, surdité corticale au mouvement, perception de sons mobiles, discrimination du mouvement auditif]

  - id: horizontal-gaze-palsy
    name: {en: Horizontal gaze palsy, fr: Paralysie du regard horizontal}
    domain: {en: Moving both eyes together horizontally, fr: Mouvements conjugués horizontaux des yeux}
    group: sensorimotor
    summary:
      en: Reduced ability to move both eyes together toward one or both sides after acquired brain injury. This profile concerns pontine cases and distinguishes conjugate gaze limitation from isolated weakness of one eye muscle and from inaccurate saccade size.
      fr: Réduction de la capacité à déplacer ensemble les deux yeux vers un côté ou les deux après atteinte cérébrale acquise. Ce profil concerne des cas pontiques et distingue la limitation conjuguée du regard d’une faiblesse isolée d’un muscle oculaire et d’une amplitude saccadique inexacte.
    aliases:
      en: [horizontal gaze palsy, horizontal gaze paresis, conjugate horizontal gaze paralysis, pontine gaze palsy, lateral gaze palsy]
      fr: [paralysie du regard horizontal, parésie du regard horizontal, paralysie conjuguée horizontale, paralysie pontique du regard, paralysie du regard latéral]

  - id: vertical-gaze-palsy
    name: {en: Vertical gaze palsy, fr: Paralysie du regard vertical}
    domain: {en: Directing the eyes upward or downward, fr: Orientation des yeux vers le haut ou le bas}
    group: sensorimotor
    summary:
      en: Reduced ability to direct the eyes upward, downward or both after acquired brain injury. This profile concerns focal midbrain and thalamic stroke observations; the affected movements and accompanying signs vary, so it does not imply an entire dorsal-midbrain syndrome.
      fr: Réduction de la capacité à orienter les yeux vers le haut, le bas ou les deux après atteinte cérébrale acquise. Ce profil concerne des observations d’AVC focaux mésencéphaliques et thalamiques; les mouvements touchés et signes associés varient et n’impliquent pas un syndrome mésencéphalique dorsal complet.
    aliases:
      en: [vertical gaze palsy, vertical gaze paresis, upgaze palsy, downgaze palsy, vertical gaze paralysis]
      fr: [paralysie du regard vertical, parésie du regard vertical, paralysie de l’élévation du regard, paralysie de l’abaissement du regard]

  - id: gaze-evoked-nystagmus
    name: {en: Gaze-evoked nystagmus, fr: Nystagmus évoqué par le regard}
    domain: {en: Holding the eyes steadily away from centre, fr: Maintien stable des yeux en position excentrée}
    group: sensorimotor
    summary:
      en: Involuntary eye drift and corrective movements while trying to hold an eccentric gaze. This profile concerns acquired gaze-holding dysfunction after cerebellar or pontine injury and distinguishes it from impaired tracking of a moving target; spontaneous vestibular nystagmus can complicate interpretation.
      fr: Dérive oculaire involontaire et mouvements correcteurs lors du maintien d’un regard excentré. Ce profil concerne un trouble acquis du maintien du regard après atteinte cérébelleuse ou pontique et le distingue d’un déficit de suivi d’une cible mobile; un nystagmus vestibulaire spontané peut compliquer l’interprétation.
    aliases:
      en: [gaze-evoked nystagmus, gaze-holding impairment, gaze holding failure, GEN, eccentric gaze instability]
      fr: [nystagmus évoqué par le regard, déficit de maintien du regard, instabilité du regard excentré, nystagmus du regard excentré]

  - id: language-self-awareness
    name: {en: Impaired language self-awareness, fr: Trouble de l’autoévaluation des capacités langagières}
    domain: {en: Judging one’s own language abilities, fr: Jugement de ses propres capacités langagières}
    group: attention-executive
    summary:
      en: Inaccurate or inconsistent appraisal of one’s language abilities after acquired brain injury. Underrecognition of a deficit, underconfidence and unreliable self-ratings are distinguished within this profile; general self-appraisal is also different from detecting individual speech errors.
      fr: Évaluation inexacte ou instable de ses capacités langagières après lésion cérébrale acquise. Ce profil distingue la sous-reconnaissance d’un déficit, le manque de confiance et les autoévaluations peu fiables; l’autoévaluation générale diffère aussi de la détection d’erreurs de parole individuelles.
    aliases:
      en: [language self-awareness, awareness of aphasia, anosognosia for aphasia, naming self-appraisal, intellectual awareness of naming]
      fr: [conscience des troubles langagiers, anosognosie de l’aphasie, autoévaluation des capacités langagières, conscience des difficultés de dénomination, autoévaluation de la dénomination]

  - id: mirror-image-discrimination
    name: {en: Impaired mirror-image discrimination, fr: Trouble de la discrimination des images en miroir}
    domain: {en: Distinguishing an object from its reflected image, fr: Distinction entre un objet et son image réfléchie}
    group: perception
    summary:
      en: Difficulty distinguishing an object from its mirror image despite preserved object identification in selected acquired cases. This profile concerns reflected visual stimuli, not failure to recognize oneself in a real mirror; mirror discrimination can differ from judging object rotations.
      fr: Difficulté à distinguer un objet de son image en miroir malgré une identification préservée dans certains cas acquis. Ce profil concerne des stimuli visuels réfléchis, pas la méconnaissance de soi dans un miroir réel; la discrimination en miroir peut différer du jugement des rotations d’objets.
