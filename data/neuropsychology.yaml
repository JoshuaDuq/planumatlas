    network: {en: Bilateral central auditory pathways, fr: Voies auditives centrales bilatérales}
    laterality: bilateral
    finding:
      en: An acute left temporal infarct after an old right infarct damaged both Heschl gyri, causing profound hearing loss despite normal otoacoustic emissions and brainstem responses. Sound detection partly recovered, but no presented monosyllable was discriminated at three or ten months.
      fr: Un infarctus temporal gauche aigu après un ancien infarctus droit atteignait les deux gyri de Heschl, entraînant une surdité profonde malgré des otoémissions et des réponses du tronc cérébral normales. La détection sonore récupérait partiellement, mais aucun monosyllabe présenté n’était discriminé à trois ou dix mois.
    limitation:
      en: This is one cortical case. A separate three-patient series found bilateral auditory radiation damage, showing that severe central deafness can also arise from subcortical disconnection.
      fr: Il s’agit d’un seul cas cortical. Une série distincte de trois patients trouvait une atteinte bilatérale des radiations auditives, montrant qu’une surdité centrale sévère peut aussi résulter d’une déconnexion sous-corticale.
    mapping_note:
      en: Transverse temporal parcels mark Heschl’s gyri on each side, not the full infarcts or auditory radiations. This case involved bilateral injury.
      fr: Les parcelles temporales transverses représentent les gyri de Heschl de chaque côté, sans délimiter les infarctus entiers ni les radiations auditives. Ce cas comportait une atteinte bilatérale.
    mappings:
      - {region: 'destrieux:left:33', source_name: G_temp_sup-G_T_transv}
      - {region: 'destrieux:right:33', source_name: G_temp_sup-G_T_transv}
    evidence:
      - {reference: lachowska-2021, role: supporting}
      - {reference: akiyoshi-2021, role: qualifying}

  - id: auditory-agnosia-temporoparietal
    deficit: auditory-agnosia
    title: {en: Environmental sound recognition after unilateral stroke, fr: Reconnaissance des sons après AVC unilatéral}
    network: {en: Bilateral temporal and inferior parietal auditory processing, fr: Traitement auditif temporal et pariétal inférieur bilatéral}
    laterality: bilateral
    finding:
      en: Impaired sound recognition followed superior temporal, inferior parietal and opercular damage on either side. Right-lesion patients confused acoustically similar sounds; left-lesion patients more often confused semantically related sources.
      fr: La reconnaissance sonore était altérée après atteinte temporale supérieure, pariétale inférieure et operculaire de chaque côté. Les patients avec lésion droite confondaient des sons acoustiquement similaires; ceux avec lésion gauche confondaient davantage des sources sémantiquement proches.
    limitation:
      en: These group error patterns are not invariant. Saygin’s later left-lesion case retained severe nonverbal auditory agnosia after speech comprehension recovered.
      fr: Ces profils d’erreurs de groupe ne sont pas invariants. Le cas ultérieur de Saygin conservait une agnosie auditive non verbale sévère après récupération de la compréhension de la parole malgré une lésion gauche.
    mapping_note:
      en: Superior temporal and planum temporale parcels mark selected cortical sites on each side. The inferior parietal, opercular and full lesion extents are not reproduced. The strokes were unilateral.
      fr: Les parcelles temporales supérieures et du planum temporale repèrent certains sites corticaux de chaque côté. Les atteintes pariétales inférieures, operculaires et l’étendue complète des lésions ne sont pas reproduites. Les AVC étaient unilatéraux.
    mappings:
      - {region: 'destrieux:left:34', source_name: G_temp_sup-Lateral}
      - {region: 'destrieux:right:34', source_name: G_temp_sup-Lateral}
      - {region: 'destrieux:left:36', source_name: G_temp_sup-Plan_tempo}
      - {region: 'destrieux:right:36', source_name: G_temp_sup-Plan_tempo}
    evidence:
      - {reference: schnider-1994, role: supporting}
      - {reference: saygin-2010, role: qualifying}

  - id: auditory-agnosia-selective-left
    deficit: auditory-agnosia
    title: {en: Persistent nonverbal impairment with recovered speech comprehension, fr: Trouble non verbal persistant après récupération de la compréhension orale}
    network: {en: Left posterior temporal auditory recognition, fr: Reconnaissance auditive temporale postérieure gauche}
    laterality: left
    finding:
      en: Patient M had severe environmental sound agnosia with preserved speech comprehension and no peripheral hearing problem after an extensive left temporoparietal infarct. Mild word-finding difficulty persisted.
      fr: Le patient M présentait une agnosie sévère des sons de l’environnement avec compréhension orale préservée et sans trouble auditif périphérique après un infarctus temporopariétal gauche étendu. Un léger manque du mot persistait.
    limitation:
      en: One chronic case shows that nonverbal auditory impairment can persist independently of speech-comprehension failure. The extensive lesion and recovery prevent assigning the dissociation to a single gyrus.
      fr: Un cas chronique montre qu’un trouble auditif non verbal peut persister indépendamment d’un trouble de compréhension de la parole. La lésion étendue et la récupération empêchent d’attribuer cette dissociation à un seul gyrus.
    mapping_note:
      en: The whole lateral superior temporal parcel provides a posterior temporal landmark. It does not reproduce the parietal damage or the reorganized responses seen with functional MRI.
      fr: La parcelle temporale supérieure latérale entière fournit un repère temporal postérieur. Elle ne reproduit ni l’atteinte pariétale ni les réponses réorganisées observées en IRM fonctionnelle.
    mappings:
      - {region: 'destrieux:left:34', source_name: G_temp_sup-Lateral}
    evidence:
      - {reference: saygin-2010, role: supporting}

  - id: auditory-short-term-memory-temporal
    deficit: auditory-short-term-memory
    title: {en: Digit span and posterior temporal integrity, fr: Empan de chiffres et intégrité temporale postérieure}
    network: {en: Left posterior superior temporal retention and comprehension, fr: Rétention et compréhension temporales supérieures postérieures gauches}
    laterality: left
    finding:
      en: Posterior left superior temporal gyrus and sulcus integrity predicted digit span after other language scores and stroke volume were accounted for. The same region also predicted spoken sentence comprehension.
      fr: L’intégrité du gyrus et du sillon temporaux supérieurs postérieurs gauches prédisait l’empan de chiffres après prise en compte d’autres scores langagiers et du volume de l’AVC. La même région prédisait aussi la compréhension des phrases entendues.
    limitation:
      en: Digit span samples one component of short-term memory. The result supports a shared substrate with speech comprehension, rather than a unique store for every form of working memory.
      fr: L’empan de chiffres évalue une composante de la mémoire à court terme. Le résultat soutient un substrat partagé avec la compréhension orale, plutôt qu’un stockage unique pour toutes les formes de mémoire de travail.
    mapping_note:
      en: The whole lateral superior temporal parcel is a coarse landmark for the posterior cluster and adjacent sulcus. It exceeds the statistically associated region.
      fr: La parcelle temporale supérieure latérale entière est un repère approximatif pour l’amas postérieur et le sillon adjacent. Elle dépasse la région statistiquement associée.
    mappings:
      - {region: 'destrieux:left:34', source_name: G_temp_sup-Lateral}
    evidence:
      - {reference: leff-2009, role: supporting}

  - id: finger-agnosia-parietal-disconnection
    deficit: finger-agnosia
    title: {en: Finger identification and parietal disconnection, fr: Identification digitale et déconnexion pariétale}
    network: {en: Left intraparietal body-representation connections, fr: Connexions intrapariétales gauches de représentation corporelle}
    laterality: left
    finding:
      en: A patient with Gerstmann’s four signs, including finger agnosia, had predominantly superior parietal damage and disruption of intraparietal connections. Angular-to-superior-parietal tracts crossed the implicated subcortical area.
      fr: Un patient avec les quatre signes de Gerstmann, dont l’agnosie digitale, avait une atteinte surtout pariétale supérieure et une déconnexion intrapariétale. Des faisceaux reliant les gyri angulaire et pariétal supérieur traversaient la zone sous-corticale impliquée.
    limitation:
      en: This mixed syndrome does not isolate finger identification. Anema’s three angular-lesion cases had selective identification problems despite intact touch localization on their own hand, so one site or mechanism cannot cover every presentation.
      fr: Ce syndrome mixte n’isole pas l’identification digitale. Les trois cas de lésions angulaires d’Anema avaient un trouble sélectif d’identification malgré une localisation tactile préservée sur leur propre main; un seul site ou mécanisme ne couvre donc pas toutes les présentations.
    mapping_note:
      en: The left superior parietal parcel marks the main cortical lesion in the Gerstmann case. It does not reproduce white-matter disconnection or map the angular-lesion cases, whose side is unspecified in the abstract.
      fr: La parcelle pariétale supérieure gauche repère la lésion corticale principale du cas de Gerstmann. Elle ne reproduit pas la déconnexion de substance blanche et ne cartographie pas les cas angulaires, dont le côté n’est pas précisé dans le résumé.
    mappings:
      - {region: 'destrieux:left:27', source_name: G_parietal_sup}
    evidence:
      - {reference: ranzini-2023, role: supporting}
      - {reference: anema-2008, role: qualifying}

  - id: motor-neglect-parietal
    deficit: motor-neglect
    title: {en: Reduced spontaneous movement with preserved motor conduction, fr: Mouvement spontané réduit avec conduction motrice préservée}
    network: {en: Left posterior parietal motor intention, fr: Intention motrice pariétale postérieure gauche}
    laterality: left
    finding:
      en: A left posterior parietal infarct produced right-sided motor neglect without sensory or visuospatial neglect. Primary sensorimotor cortex was spared, with normal central motor conduction and comparable stimulation thresholds on both sides.
      fr: Un infarctus pariétal postérieur gauche entraînait une négligence motrice droite sans négligence sensitive ou visuospatiale. Le cortex sensorimoteur primaire était épargné, avec conduction motrice centrale normale et seuils de stimulation comparables des deux côtés.
    limitation:
      en: One case demonstrates a possible intentional disorder with intact motor output. It does not establish the most common lesion site or exclude frontal and subcortical causes.
      fr: Un cas démontre un trouble intentionnel possible avec commande motrice préservée. Il n’établit pas le site lésionnel le plus fréquent et n’exclut pas des causes frontales ou sous-corticales.
    mapping_note:
      en: No parcel is selected. The consulted abstract identifies posterior parietal damage without assigning a gyrus; it cannot justify selecting the superior parietal parcel.
      fr: Aucune parcelle n’est sélectionnée. Le résumé consulté identifie une atteinte pariétale postérieure sans attribuer de gyrus; il ne justifie pas de sélectionner la parcelle pariétale supérieure.
    mappings: []
    evidence:
      - {reference: triggs-1994, role: supporting}

  - id: motor-neglect-putamen
    deficit: motor-neglect
    title: {en: Competing movement plans after right-hemisphere stroke, fr: Compétition entre programmes moteurs après AVC droit}
    network: {en: Right putamen and motor association network, fr: Putamen droit et réseau d’association motrice}
    laterality: right
    finding:
      en: Seven patients with left motor neglect underused the limb despite no significant weakness on examination. A masked-prime task linked interference from right-hand movement plans to right putamen and nearby white-matter damage; every motor-neglect case involved some part of the putamen.
      fr: Sept patients avec négligence motrice gauche sous-utilisaient le membre malgré l’absence de faiblesse significative à l’examen. Une tâche d’amorçage masqué reliait l’interférence des programmes moteurs de la main droite à une atteinte du putamen droit et de la substance blanche voisine; chaque cas impliquait une partie du putamen.
    limitation:
      en: Lesion analyses included only 13 stroke patients. The movement-planning interference measure and the bedside neglect-severity score were analyzed separately; severity-related sites were scattered. This small study does not establish a unique motor-neglect centre or validate its severity score as a diagnostic test.
      fr: Les analyses lésionnelles ne comprenaient que 13 patients avec AVC. La mesure d’interférence entre programmes moteurs et le score clinique de sévérité de négligence étaient analysés séparément; les sites associés à la sévérité étaient dispersés. Cette petite étude n’établit pas de centre unique de la négligence motrice et ne valide pas son score comme test diagnostique.
    mapping_note:
      en: The whole right putamen is a coarse landmark for directly injured tissue. It does not reproduce the significant clusters, surrounding white-matter injury or the broader motor association network. Motor underuse was left-sided.
      fr: Le putamen droit entier est un repère approximatif du tissu directement lésé. Il ne reproduit ni les amas significatifs, ni l’atteinte de substance blanche voisine, ni le réseau d’association motrice plus large. La sous-utilisation motrice était gauche.
    mappings:
      - {region: 'aseg:right:51', source_name: Right-Putamen}
    evidence:
      - {reference: coulthard-2008, role: supporting}

  - id: tactile-extinction-opercular
    deficit: tactile-extinction
    title: {en: Tactile competition and the right parietal operculum, fr: Compétition tactile et opercule pariétal droit}
    network: {en: Right operculo-insular tactile awareness, fr: Conscience tactile operculo-insulaire droite}
    laterality: right
    finding:
      en: Right-lesion comparisons linked tactile extinction to rostral parietal operculum and posterior insula damage. These sites co-localized with sustained tactile responses recorded in a separate epilepsy cohort.
      fr: Les comparaisons de lésions droites reliaient l’extinction tactile à une atteinte de l’opercule pariétal rostral et de l’insula postérieure. Ces sites coïncidaient avec des réponses tactiles soutenues enregistrées dans une cohorte épileptique distincte.
    limitation:
      en: The lesion analysis focused on right-sided strokes because only four left-lesion patients had extinction. Co-localization with stereo-EEG responses across cohorts does not prove that tonic activity alone causes awareness.
      fr: L’analyse lésionnelle portait sur les AVC droits car seuls quatre patients avec lésion gauche avaient une extinction. La coïncidence avec les réponses stéréo-EEG de l’autre cohorte ne prouve pas que l’activité tonique suffit à produire la conscience.
    mapping_note:
      en: Subcentral and long-insular parcels provide coarse landmarks for the opercular and posterior insular sites. They do not isolate OP3 or the significant lesion clusters. Extinction affected the contralesional hand.
      fr: Les parcelles subcentrale et insulaire longue fournissent des repères approximatifs des sites operculaire et insulaire postérieur. Elles n’isolent ni OP3 ni les amas lésionnels significatifs. L’extinction touchait la main controlatérale.
    mappings:
      - {region: 'destrieux:right:4', source_name: G_and_S_subcentral}
      - {region: 'destrieux:right:17', source_name: 'G_Ins_lg&S_cent_ins'}
    evidence:
      - {reference: del-vecchio-2021, role: supporting}

  - id: akinetic-mutism-cingulate
    deficit: akinetic-mutism
    title: {en: Bilateral anterior cingulate injury and loss of initiation, fr: Atteinte cingulaire antérieure bilatérale et perte d’initiative}
    network: {en: Medial frontal volitional network, fr: Réseau frontal médial de la volition}
    laterality: bilateral
    finding:
      en: Three neuropathological cases shared bilateral rostral anterior cingulate damage extending into neighbouring supplementary motor regions, with near-total loss of speech and movement.
      fr: Trois cas neuropathologiques partageaient une atteinte cingulaire antérieure rostrale bilatérale s’étendant aux régions motrices supplémentaires voisines, avec perte quasi totale de la parole et du mouvement.
    limitation:
      en: These cases describe one anatomical pattern. Darby’s 28 lesions were heterogeneous but connected to anterior cingulate cortex; network connectivity does not mean this cortex was directly damaged in every case.
      fr: Ces cas décrivent un profil anatomique. Les 28 lésions de Darby étaient hétérogènes mais connectées au cortex cingulaire antérieur; cette connectivité ne signifie pas que ce cortex était directement lésé dans chaque cas.
    mapping_note:
      en: Whole anterior cingulate parcels mark the bilateral cortical finding. The supplementary motor extension, other injuries and lesion-network connections are not delineated.
      fr: Les parcelles cingulaires antérieures entières repèrent le constat cortical bilatéral. L’extension motrice supplémentaire, les autres lésions et les connexions du réseau lésionnel ne sont pas délimitées.
    mappings:
      - {region: 'destrieux:left:6', source_name: 'G_and_S_cingul-Ant'}
      - {region: 'destrieux:right:6', source_name: 'G_and_S_cingul-Ant'}
    evidence:
      - {reference: nemeth-1988, role: supporting}
      - {reference: darby-2018, role: qualifying}

  - id: locked-in-pontine
    deficit: locked-in
    title: {en: Ventral pontine injury with preserved consciousness, fr: Atteinte pontique ventrale avec conscience préservée}
    network: {en: Pontine descending motor pathways, fr: Voies motrices descendantes pontiques}
    laterality: bilateral
    finding:
      en: Seven patients with locked-in syndrome had ventral pontine injury and diffuse white-matter abnormalities on diffusion MRI, even with little or no supratentorial injury visible on conventional images.
      fr: Sept patients avec syndrome d’enfermement avaient une atteinte pontique ventrale et des anomalies diffuses de substance blanche en IRM de diffusion, malgré peu ou pas de lésion supratentorielle visible sur les images conventionnelles.
    limitation:
      en: This selected imaging series is not a universal lesion map. In the national vascular cohort, 39 of 49 patients with radiology reports had lesions outside the brainstem, and seven had no pontine injury. Entry required preserved orientation, not normal performance in every cognitive domain.
      fr: Cette série d’imagerie sélectionnée n’est pas une carte lésionnelle universelle. Dans la cohorte vasculaire nationale, 39 des 49 patients avec comptes rendus radiologiques avaient des lésions hors du tronc cérébral et sept n’avaient pas d’atteinte pontique. L’inclusion exigeait une orientation préservée, non des performances normales dans chaque domaine cognitif.
    mapping_note:
      en: The two pontine territories provide a coarse landmark for the pons. They do not isolate its ventral motor pathways, the tegmentum, or diffuse white-matter abnormalities.
      fr: Les deux territoires pontiques fournissent un repère approximatif du pont. Ils n’isolent ni ses voies motrices ventrales, ni le tegmentum, ni les anomalies diffuses de substance blanche.
    mappings:
      - {region: 'learning:left:pons', source_name: Pontine territory}
      - {region: 'learning:right:pons', source_name: Pontine territory}
    evidence:
      - {reference: leonard-2019, role: supporting}
      - {reference: nilsen-2023, role: qualifying}

  - id: prospective-memory-time-based
    deficit: prospective-memory
    title: {en: Remembering to act at a particular time, fr: Se rappeler d’agir à un moment précis}
    network: {en: Right rostral prefrontal intention retrieval, fr: Rappel des intentions préfrontal rostral droit}
    laterality: right
    finding:
      en: Right polar prefrontal damage was associated with impaired time-based prospective memory for words and pictures, with event-based performance preserved in that subgroup. Time estimation was also impaired.
      fr: L’atteinte préfrontale polaire droite était associée à une mémoire prospective fondée sur le temps altérée pour les mots et les images, avec performance événementielle préservée dans ce sous-groupe. L’estimation du temps était aussi altérée.
    limitation:
      en: Only eight patients had rostral prefrontal lesions, and lesion coverage was uneven. Uretzky’s case had impaired event-cue detection after right polar damage, so the time/event distinction is not universal.
      fr: Seuls huit patients avaient des lésions préfrontales rostrales et la couverture lésionnelle était inégale. Le cas d’Uretzky avait une détection des indices événementiels altérée après atteinte polaire droite; la distinction temps/événement n’est donc pas universelle.
    mapping_note:
      en: The transverse frontopolar parcel is a coarse landmark for right polar area 10. It does not reproduce the lesion cluster, all of area 10, or the other prefrontal findings.
      fr: La parcelle frontopolaire transverse est un repère approximatif de l’aire polaire droite 10. Elle ne reproduit ni l’amas lésionnel, ni toute l’aire 10, ni les autres constats préfrontaux.
    mappings:
      - {region: 'destrieux:right:5', source_name: G_and_S_transv_frontopol}
    evidence:
      - {reference: volle-2011, role: supporting}
      - {reference: uretzky-2010, role: qualifying}

  - id: prospective-memory-cue-detection
    deficit: prospective-memory
    title: {en: Detecting the cue for an intended action, fr: Détection du signal d’une action prévue}
    network: {en: Right polar prefrontal prospective cue processing, fr: Traitement préfrontal polaire droit des indices prospectifs}
    laterality: right
    finding:
      en: Z.P. struggled to detect prospective-memory cues during ongoing tasks, while implicit advantages for intended actions remained intact. Other tested cognitive functions, including memory, were preserved.
      fr: Z.P. avait des difficultés à détecter les indices de mémoire prospective pendant une tâche en cours, alors que les avantages implicites pour les actions prévues restaient intacts. Les autres fonctions cognitives testées, dont la mémoire, étaient préservées.
    limitation:
      en: A single chronic case separates cue detection from the tested representation of intentions. It does not show that all prospective-memory failures have this mechanism or location.
      fr: Un cas chronique distingue la détection des indices de la représentation des intentions testée. Il ne montre pas que tous les troubles de mémoire prospective partagent ce mécanisme ou cette localisation.
    mapping_note:
      en: The frontopolar parcel is a reference landmark for the polar component of a lesion involving areas 10 and 9. Its full extent and the component in area 9 are not reconstructed.
      fr: La parcelle frontopolaire est un repère de la composante polaire d’une lésion impliquant les aires 10 et 9. Son étendue complète et la composante dans l’aire 9 ne sont pas reconstruites.
    mappings:
      - {region: 'destrieux:right:5', source_name: G_and_S_transv_frontopol}
    evidence:
      - {reference: uretzky-2010, role: supporting}

  - id: alexithymia-anterior-insula
    deficit: alexithymia
    title: {en: Emotional self-awareness after anterior insula injury, fr: Conscience émotionnelle après atteinte insulaire antérieure}
    network: {en: Anterior insular emotional awareness, fr: Conscience émotionnelle insulaire antérieure}
    laterality: bilateral
    finding:
      en: Greater anterior insula damage predicted higher alexithymia questionnaire scores after accounting for anterior cingulate damage and total lesion volume. The most extensively damaged subgroup had the highest scores.
      fr: Une atteinte insulaire antérieure plus importante prédisait des scores d’alexithymie plus élevés après prise en compte des lésions cingulaires antérieures et du volume lésionnel total. Le sous-groupe le plus atteint avait les scores les plus élevés.
    limitation:
      en: The most damaged subgroup contained nine men, assessed decades after penetrating injury. Cross-sectional self-reports do not measure within-person change; Hobson’s stroke study also linked alexithymia to reported communication difficulties.
      fr: Le sous-groupe le plus atteint comptait neuf hommes, évalués des décennies après une lésion pénétrante. Les autoquestionnaires transversaux ne mesurent pas le changement individuel; l’étude d’AVC de Hobson reliait aussi l’alexithymie aux difficultés de communication rapportées.
    mapping_note:
      en: Short insular parcels provide broad anterior insula landmarks. The study’s region of interest and damage proportions are not reproduced, and these landmarks do not establish hemispheric dominance or require bilateral injury.
      fr: Les parcelles insulaires courtes fournissent des repères larges de l’insula antérieure. La région d’intérêt et les proportions de lésion de l’étude ne sont pas reproduites; ces repères n’établissent pas de dominance hémisphérique et n’exigent pas une atteinte bilatérale.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:right:18', source_name: G_insular_short}
    evidence:
      - {reference: hogeveen-2016, role: supporting}
      - {reference: hobson-2020, role: qualifying}

  - id: hemiparesis-subcortical
    deficit: hemiparesis
    title: {en: Voluntary arm movement after hemispheric stroke, fr: Mouvement volontaire du bras après AVC hémisphérique}
    network: {en: Corticospinal and distributed motor pathways, fr: Voies corticospinales et réseau moteur distribué}
    laterality: bilateral
    finding:
      en: Upper-limb movement scores were associated with damage to corticospinal pathways, putamen, pallidum and other regions. These findings survived correction for multiple comparisons; the corticospinal association also appeared with acute measures in a separate 60-patient study.
      fr: Les scores de mouvement du membre supérieur étaient associés à des lésions des voies corticospinales, du putamen, du pallidum et d’autres régions. Ces résultats résistaient à la correction des comparaisons multiples; l’association corticospinale apparaissait aussi avec des mesures aiguës dans une étude distincte de 60 patients.
    limitation:
      en: The 41-patient cohort was selected for arm paresis and spasticity after middle-cerebral-artery stroke. Lesion coverage was incomplete; pooled, flipped hemispheres cannot establish dominance. Acute and chronic lesion maps differ with recovery.
      fr: La cohorte de 41 patients était sélectionnée pour parésie du bras et spasticité après AVC sylvien. La couverture lésionnelle était incomplète; le regroupement des hémisphères retournés n’établit pas de dominance. Les cartes aiguës et chroniques diffèrent avec la récupération.
    mapping_note:
      en: Whole putamen and pallidum provide selected subcortical landmarks. The central corticospinal finding, including corona radiata and internal capsule, is not delineated by these parcels. Weakness affects the contralesional limb.
      fr: Le putamen et le pallidum entiers fournissent des repères sous-corticaux sélectionnés. Le constat corticospinal central, incluant la couronne rayonnante et la capsule interne, n’est pas délimité par ces parcelles. La faiblesse touche le membre controlatéral.
    mappings:
      - {region: 'aseg:left:12', source_name: Left-Putamen}
      - {region: 'aseg:right:51', source_name: Right-Putamen}
      - {region: 'aseg:left:13', source_name: Left-Pallidum}
      - {region: 'aseg:right:52', source_name: Right-Pallidum}
    evidence:
      - {reference: frenkel-toledo-2022, role: supporting}
      - {reference: karnath-2017, role: supporting}

  - id: spasticity-putamen
    deficit: spasticity
    title: {en: Putaminal lesions and upper-limb spasticity, fr: Lésions putaminales et spasticité du membre supérieur}
    network: {en: Distributed regulation of muscle tone, fr: Régulation distribuée du tonus musculaire}
    laterality: bilateral
    finding:
      en: In 97 stroke patients, the putamen was the region most frequently damaged in those with upper-limb spasticity after lesion subtraction and statistical comparison. Greater spasticity was associated with larger lesions.
      fr: Chez 97 patients avec AVC, le putamen était la région la plus fréquemment lésée chez ceux présentant une spasticité du membre supérieur après soustraction lésionnelle et comparaison statistique. Une spasticité plus importante était associée à des lésions plus volumineuses.
    limitation:
      en: Modified Ashworth ratings include resistance to passive movement and differ from a reflex-threshold measure. Frenkel-Toledo’s elbow-flexor spasticity map did not survive multiple-comparison correction and is exploratory; it cannot establish a definitive spasticity network.
      fr: Les cotations d’Ashworth modifiée incluent la résistance au mouvement passif et diffèrent d’une mesure du seuil réflexe. La carte de spasticité des fléchisseurs du coude de Frenkel-Toledo ne résistait pas à la correction des comparaisons multiples et reste exploratoire; elle n’établit pas un réseau définitif de la spasticité.
    mapping_note:
      en: Whole putamina are coarse landmarks on each side, not the significant voxels or a requirement for bilateral injury. Their overlap with the hemiparesis landmarks does not mean that the same voxels or mechanisms underlie both impairments.
      fr: Les putamens entiers sont des repères approximatifs de chaque côté, pas les voxels significatifs ni une exigence de lésion bilatérale. Leur chevauchement avec les repères de l’hémiparésie ne signifie pas que les mêmes voxels ou mécanismes sous-tendent les deux troubles.
    mappings:
      - {region: 'aseg:left:12', source_name: Left-Putamen}
      - {region: 'aseg:right:51', source_name: Right-Putamen}
    evidence:
      - {reference: cheung-2016, role: supporting}
      - {reference: frenkel-toledo-2022, role: qualifying}

  - id: pain-asymbolia-insular
    deficit: pain-asymbolia
    title: {en: Reduced protective and emotional responses to pain, fr: Réponses protectrices et émotionnelles à la douleur réduites}
    network: {en: Insular sensory-affective integration, fr: Intégration sensoriaffective insulaire}
    laterality: bilateral
    finding:
      en: Six patients had absent or inadequate withdrawal and emotional responses to painful stimuli despite preserved primary sensation. All six had insular damage; four lesions were left-sided and two right-sided.
      fr: Six patients avaient des réponses de retrait et émotionnelles absentes ou inadéquates aux stimuli douloureux malgré une sensibilité primaire préservée. Les six avaient une atteinte insulaire; quatre lésions étaient gauches et deux droites.
    limitation:
      en: This selected case series had variable lesion extent and associated neurological signs. It does not establish that insular damage alone is sufficient or that one insular subregion explains every sensory-affective dissociation.
      fr: Cette série sélectionnée avait des étendues lésionnelles variables et des signes neurologiques associés. Elle n’établit pas qu’une lésion insulaire seule suffit ni qu’une sous-région insulaire explique toutes les dissociations sensoriaffectives.
    mapping_note:
      en: Short and long insular parcels provide broad landmarks on both sides. The source does not isolate an anterior or posterior insular subregion, and the patients had unilateral injuries.
      fr: Les parcelles insulaires courtes et longues fournissent des repères larges de chaque côté. La source n’isole pas de sous-région insulaire antérieure ou postérieure et les patients avaient des atteintes unilatérales.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:right:18', source_name: G_insular_short}
      - {region: 'destrieux:left:17', source_name: 'G_Ins_lg&S_cent_ins'}
      - {region: 'destrieux:right:17', source_name: 'G_Ins_lg&S_cent_ins'}
    evidence:
      - {reference: berthier-1988, role: supporting}

  - id: sound-localization-right-network
    deficit: sound-localization
    title: {en: Locating sounds with preserved recognition, fr: Localisation des sons avec reconnaissance préservée}
    network: {en: Right auditory spatial network, fr: Réseau spatial auditif droit}
    laterality: right
    finding:
      en: Four patients with right-hemisphere lesions localized sounds poorly despite preserved recognition. Their lesions involved inferior parietal and frontal cortex and superior temporal gyrus; three other patients showed the reverse dissociation.
      fr: Quatre patients avec lésion hémisphérique droite localisaient mal les sons malgré une reconnaissance préservée. Leurs lésions impliquaient les cortex pariétal inférieur et frontal et le gyrus temporal supérieur; trois autres patients présentaient la dissociation inverse.
    limitation:
      en: A separate 30-patient acute study found that damage within specialized auditory networks did not consistently produce the corresponding deficit. Network dysfunction and lesion coverage limit a simple one-region interpretation.
      fr: Une étude aiguë distincte de 30 patients trouvait qu’une lésion des réseaux auditifs spécialisés ne produisait pas systématiquement le trouble correspondant. Le dysfonctionnement des réseaux et la couverture lésionnelle limitent une interprétation fondée sur une région unique.
    mapping_note:
      en: Whole angular, supramarginal and lateral superior temporal parcels provide selected posterior landmarks. They do not reproduce individual lesions, resolve their inferior parietal boundaries or represent the frontal involvement.
      fr: Les parcelles angulaire, supramarginale et temporale supérieure latérale entières fournissent des repères postérieurs sélectionnés. Elles ne reproduisent pas les lésions individuelles, ne précisent pas leurs limites pariétales inférieures et ne représentent pas l’atteinte frontale.
    mappings:
      - {region: 'destrieux:right:25', source_name: G_pariet_inf-Angular}
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
      - {region: 'destrieux:right:34', source_name: G_temp_sup-Lateral}
    evidence:
      - {reference: clarke-2002, role: supporting}
      - {reference: adriani-2003, role: qualifying}

  - id: temporal-disorientation-thalamic
    deficit: temporal-disorientation
    title: {en: Date and elapsed-time disorientation after thalamic stroke, fr: Désorientation dans la date et le temps écoulé après AVC thalamique}
    network: {en: Mediodorsal thalamic and prefrontal timing circuits, fr: Circuits temporels thalamiques médiodorsaux et préfrontaux}
    laterality: bilateral
    finding:
      en: Five patients with thalamic stroke misjudged the date, time of day or elapsed time. All had left mediodorsal involvement, three with bilateral lesions. A later case had a right medial thalamic infarct and right frontal hypoperfusion.
      fr: Cinq patients avec AVC thalamique jugeaient mal la date, l’heure ou le temps écoulé. Tous avaient une atteinte médiodorsale gauche, dont trois bilatérale. Un cas ultérieur avait un infarctus thalamique médial droit et une hypoperfusion frontale droite.
    limitation:
      en: A five-case series and one later case do not establish diagnostic accuracy or a unique timing centre. The proposed contribution of remote frontal dysfunction in the right-sided case is an interpretation, not proof of a causal pathway.
      fr: Une série de cinq cas et un cas ultérieur n’établissent ni la précision diagnostique ni un centre temporel unique. La contribution proposée d’un dysfonctionnement frontal à distance dans le cas droit est une interprétation, pas la preuve d’une voie causale.
    mapping_note:
      en: Whole thalami are landmarks for the medial thalamic findings; the mediodorsal nuclei and remote frontal dysfunction are not delineated. Cases occurred with unilateral as well as bilateral lesions.
      fr: Les thalamus entiers sont des repères des constats thalamiques médiaux; les noyaux médiodorsaux et le dysfonctionnement frontal à distance ne sont pas délimités. Les cas comportaient des lésions unilatérales ou bilatérales.
    mappings:
      - {region: 'aseg:left:10', source_name: Left-Thalamus-Proper}
      - {region: 'aseg:right:49', source_name: Right-Thalamus-Proper}
    evidence:
      - {reference: kumral-2007, role: supporting}
      - {reference: hayashi-2018, role: supporting}

  - id: buccofacial-apraxia-insular
    deficit: buccofacial-apraxia
    title: {en: Co-occurring speech and nonspeech oral apraxia, fr: Apraxies associées de la parole et buccofaciale}
    network: {en: Left insular oral-praxis network, fr: Réseau insulaire gauche des praxies orales}
    laterality: left
    finding:
      en: In 137 acute left-stroke patients, co-occurring speech and oral apraxia was predominantly associated with insular damage. The five patients with only one of these apraxias had spared insulae and different lesion patterns.
      fr: Chez 137 patients avec AVC gauche aigu, les apraxies associées de la parole et orale étaient surtout liées à une atteinte insulaire. Les cinq patients avec une seule de ces apraxies avaient des insulas préservées et des profils lésionnels différents.
    limitation:
      en: All 33 patients with either oral or speech apraxia also had aphasia, and the tests overlap with language and praxis demands. This association does not isolate a necessary insular site for nonspeech oral movements; Kwon reported pure buccofacial apraxia after premotor injury.
      fr: Les 33 patients avec apraxie orale ou de la parole avaient aussi une aphasie et les tests sollicitent également le langage et les praxies. Cette association n’isole pas un site insulaire nécessaire aux mouvements oraux non verbaux; Kwon rapportait une apraxie buccofaciale pure après atteinte prémotrice.
    mapping_note:
      en: Short and long left insular parcels are broad landmarks for the co-occurring syndrome. They exceed the lesion clusters and do not map every isolated oral-apraxia case.
      fr: Les parcelles insulaires courtes et longues gauches sont des repères larges du syndrome associé. Elles dépassent les amas lésionnels et ne cartographient pas tous les cas d’apraxie orale isolée.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:left:17', source_name: 'G_Ins_lg&S_cent_ins'}
    evidence:
      - {reference: conterno-2022, role: supporting}
      - {reference: kwon-2013, role: qualifying}

  - id: buccofacial-apraxia-premotor
    deficit: buccofacial-apraxia
    title: {en: Isolated oral apraxia after premotor infarction, fr: Apraxie orale isolée après infarctus prémoteur}
    network: {en: Left ventral premotor orofacial control, fr: Contrôle orofacial prémoteur ventral gauche}
    laterality: left
    finding:
      en: Kwon described pure buccofacial apraxia after a left ventral premotor infarct, demonstrating that nonspeech oral impairment can occur independently of the usual accompanying speech or language disorders.
      fr: Kwon décrivait une apraxie buccofaciale pure après infarctus prémoteur ventral gauche, montrant qu’un trouble oral non verbal peut survenir indépendamment des troubles habituels associés de la parole ou du langage.
    limitation:
      en: One rare case establishes a possible dissociation, not a universal lesion site. Conterno’s isolated oral-apraxia cases instead had temporoparietal or striatocapsular lesions.
      fr: Un cas rare établit une dissociation possible, pas un site lésionnel universel. Les cas d’apraxie orale isolée de Conterno avaient plutôt des lésions temporopariétales ou striatocapsulaires.
    mapping_note:
      en: The whole precentral parcel provides a broad landmark for the ventral premotor finding. It does not separate the ventral premotor territory from primary motor cortex or reproduce the infarct boundaries.
      fr: La parcelle précentrale entière fournit un repère large du constat prémoteur ventral. Elle ne sépare pas le territoire prémoteur ventral du cortex moteur primaire et ne reproduit pas les limites de l’infarctus.
    mappings:
      - {region: 'destrieux:left:29', source_name: G_precentral}
    evidence:
      - {reference: kwon-2013, role: supporting}
      - {reference: conterno-2022, role: qualifying}

  - id: foreign-accent-precentral
    deficit: foreign-accent
    title: {en: Heterogeneous lesions and a connected speech network, fr: Lésions hétérogènes et réseau de parole connecté}
    network: {en: Distributed motor-speech and phonation network, fr: Réseau distribué de motricité de la parole et de phonation}
    laterality: left
    finding:
      en: Among 25 selected cases without aphasia, direct lesion overlap peaked in the lower left precentral gyrus but included only five cases. A larger overlap of functional connections involved bilateral precentral and medial frontal regions.
      fr: Parmi 25 cas sélectionnés sans aphasie, le chevauchement lésionnel direct culminait dans le gyrus précentral inférieur gauche mais ne concernait que cinq cas. Un chevauchement plus étendu des connexions fonctionnelles impliquait les régions précentrales bilatérales et frontales médiales.
    limitation:
      en: Lesions were reconstructed from published two-dimensional images, and connectivity came from healthy participants. Connected network sites were not necessarily damaged. This selected sample does not cover every cause of acquired accent change.
      fr: Les lésions étaient reconstruites à partir d’images bidimensionnelles publiées et la connectivité provenait de participants sains. Les sites connectés n’étaient pas nécessairement lésés. Cet échantillon sélectionné ne couvre pas toutes les causes de changement acquis de l’accent.
    mapping_note:
      en: The left precentral parcel marks the limited direct-overlap finding, not the entire connected network. It does not isolate the lower or laryngeal motor representations, and most lesions lay elsewhere.
      fr: La parcelle précentrale gauche repère le chevauchement lésionnel direct limité, pas l’ensemble du réseau connecté. Elle n’isole pas les représentations motrices inférieures ou laryngées et la plupart des lésions étaient ailleurs.
    mappings:
      - {region: 'destrieux:left:29', source_name: G_precentral}
    evidence:
      - {reference: higashiyama-2021, role: supporting}
      - {reference: abel-2009, role: qualifying}

  - id: foreign-accent-somatosensory
    deficit: foreign-accent
    title: {en: Accent change with a somatosensory cortical lesion, fr: Changement d’accent avec lésion corticale somatosensorielle}
    network: {en: Left anterior parietal speech-feedback territory, fr: Territoire pariétal antérieur gauche du retour sensoriel de la parole}
    laterality: left
    finding:
      en: A woman with a left anterior parietal metastasis had dysarthric, newly accented speech. Intraoperative stimulation mapping placed the lesion within somatosensory cortex.
      fr: Une femme avec métastase pariétale antérieure gauche avait une parole dysarthrique avec accent nouvellement modifié. La cartographie par stimulation peropératoire situait la lésion dans le cortex somatosensoriel.
    limitation:
      en: One tumour case with accompanying weakness and dysarthria cannot isolate the mechanism of accent change or establish that somatosensory damage is necessary.
      fr: Un cas tumoral avec faiblesse et dysarthrie associées n’isole pas le mécanisme du changement d’accent et n’établit pas qu’une atteinte somatosensorielle soit nécessaire.
    mapping_note:
      en: The whole postcentral parcel provides a somatosensory landmark. It is not a reproduction of the tumour or a claim that the entire gyrus controls accent.
      fr: La parcelle postcentrale entière fournit un repère somatosensoriel. Elle ne reproduit pas la tumeur et n’affirme pas que le gyrus entier contrôle l’accent.
    mappings:
      - {region: 'destrieux:left:28', source_name: G_postcentral}
    evidence:
      - {reference: abel-2009, role: supporting}

  - id: phonagnosia-posterior-temporal
    deficit: phonagnosia
    title: {en: Learning and identifying voices, fr: Apprentissage et identification des voix}
    network: {en: Right posterior temporal voice-identity processing, fr: Traitement de l’identité vocale temporal postérieur droit}
    laterality: right
    finding:
      en: In 58 patients, right posterior and mid-temporal lesions were associated with poorer voice-identity performance after accounting for face recognition. Right inferior parietal involvement depended on associating voices with faces rather than names.
      fr: Chez 58 patients, les lésions temporales postérieures et moyennes droites étaient associées à une identification vocale moins bonne après prise en compte de la reconnaissance faciale. L’implication pariétale inférieure droite dépendait de l’association des voix aux visages plutôt qu’aux noms.
    limitation:
      en: Corrected results were strongest for newly learned or combined voice-identity scores. The familiar-voice-only association did not survive adjustment for hearing and lesion volume; one localization cannot cover all forms of phonagnosia.
      fr: Les résultats corrigés étaient les plus solides pour les scores de voix nouvellement apprises ou combinés. L’association limitée aux voix familières ne résistait pas à l’ajustement pour l’audition et le volume lésionnel; une localisation unique ne couvre pas toutes les formes de phonagnosie.
    mapping_note:
      en: Lateral superior temporal and planum temporale parcels mark the selected posterior temporal findings. Whole parcels exceed the clusters; task-dependent parietal involvement is not drawn.
      fr: Les parcelles temporale supérieure latérale et du planum temporale repèrent les constats temporaux postérieurs sélectionnés. Les parcelles entières dépassent les amas; l’implication pariétale dépendante de la tâche n’est pas représentée.
    mappings:
      - {region: 'destrieux:right:34', source_name: G_temp_sup-Lateral}
      - {region: 'destrieux:right:36', source_name: G_temp_sup-Plan_tempo}
    evidence:
      - {reference: roswandowitz-2018, role: supporting}
      - {reference: luzzi-2018, role: qualifying}

  - id: phonagnosia-familiar-voices
    deficit: phonagnosia
    title: {en: Selective loss of familiar-voice recognition, fr: Perte sélective de reconnaissance des voix familières}
    network: {en: Right anterior temporal person-identity processing, fr: Traitement de l’identité des personnes temporal antérieur droit}
    laterality: right
    finding:
      en: A patient failed to recognize famous voices after right temporal-pole and subcortical infarcts, despite preserved voice perception, face recognition and other tested cognitive functions.
      fr: Un patient ne reconnaissait plus les voix célèbres après des infarctus du pôle temporal et des structures sous-corticales droits, malgré une perception vocale, une reconnaissance faciale et d’autres fonctions cognitives testées préservées.
    limitation:
      en: One case with temporal and subcortical lesions cannot isolate the temporal pole’s contribution. The larger cohort implicated posterior temporal sites, especially for newly learned voices, so this is not a universal voice-recognition centre.
      fr: Un cas avec lésions temporales et sous-corticales n’isole pas la contribution du pôle temporal. La cohorte plus large impliquait des sites temporaux postérieurs, surtout pour les voix nouvellement apprises; il ne s’agit donc pas d’un centre universel de reconnaissance vocale.
    mapping_note:
      en: The right temporal-pole parcel marks the reported cortical site only. It does not reproduce the lenticular and caudate injury or separate familiarity from other person-knowledge processes.
      fr: La parcelle du pôle temporal droit repère seulement le site cortical rapporté. Elle ne reproduit pas l’atteinte lenticulaire et caudée et ne sépare pas la familiarité des autres processus de connaissance des personnes.
    mappings:
      - {region: 'destrieux:right:44', source_name: Pole_temporal}
    evidence:
      - {reference: luzzi-2018, role: supporting}
      - {reference: roswandowitz-2018, role: qualifying}

  - id: emotional-empathy-inferior-frontal
    deficit: emotional-empathy
    title: {en: Emotional empathy and cognitive perspective-taking, fr: Empathie émotionnelle et prise de perspective cognitive}
    network: {en: Inferior frontal affective-sharing system, fr: Système frontal inférieur de partage affectif}
    laterality: bilateral
    finding:
      en: Inferior frontal lesions were associated with reduced emotional empathy, while ventromedial prefrontal lesions affected cognitive empathy. Lesion mapping particularly implicated area 44 in the emotional component.
      fr: Les lésions frontales inférieures étaient associées à une empathie émotionnelle réduite, tandis que les lésions préfrontales ventromédianes affectaient l’empathie cognitive. La cartographie impliquait particulièrement l’aire 44 dans la composante émotionnelle.
    limitation:
      en: Small groups, mostly head injuries, and predominantly CT-based localization limit anatomical specificity. Possible diffuse injury and uncertain correspondence to cytoarchitectonic areas remain.
      fr: Les petits groupes, les traumatismes crâniens majoritaires et la localisation surtout en TDM limitent la spécificité anatomique. Une atteinte diffuse possible et une correspondance incertaine aux aires cytoarchitectoniques persistent.
    mapping_note:
      en: Opercular parcels approximate area 44. The inferior frontal group comprised five right and three left lesions; both landmarks are shown without implying bilateral injury.
      fr: Les parcelles operculaires représentent approximativement l’aire 44. Le groupe frontal inférieur comprenait cinq lésions droites et trois gauches; les deux repères sont montrés sans impliquer une atteinte bilatérale.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
      - {region: 'destrieux:right:12', source_name: G_front_inf-Opercular}
    evidence:
      - {reference: shamay-tsoory-2009, role: supporting}

  - id: emotional-empathy-pain-insula
    deficit: emotional-empathy
    title: {en: Processing another person’s pain, fr: Traitement de la douleur d’autrui}
    network: {en: Anterior insular empathetic pain processing, fr: Traitement insulaire antérieur de la douleur empathique}
    laterality: bilateral
    finding:
      en: Patients with anterior insular lesions were less accurate and slower when judging others’ pain and lacked the usual implicit interference from pain images. These effects were not found in the anterior cingulate lesion comparison group.
      fr: Les patients avec lésions insulaires antérieures étaient moins précis et plus lents pour juger la douleur d’autrui et ne présentaient pas l’interférence implicite habituelle des images douloureuses. Ces effets n’étaient pas observés dans le groupe comparatif avec lésions cingulaires antérieures.
    limitation:
      en: Three insular cases and a task-specific comparison do not establish every mechanism of emotional empathy. Performance on pain judgments cannot by itself measure everyday empathic concern or the full range of emotional sharing.
      fr: Trois cas insulaires et une comparaison ciblée n’établissent pas tous les mécanismes de l’empathie émotionnelle. Les jugements de douleur ne mesurent pas à eux seuls la sollicitude empathique quotidienne ou toute l’étendue du partage émotionnel.
    mapping_note:
      en: Short insular parcels mark the anterior region broadly. Two insular lesions were left-sided and one right-sided; displaying both landmarks does not imply that bilateral damage is required.
      fr: Les parcelles insulaires courtes repèrent largement la région antérieure. Deux lésions insulaires étaient gauches et une droite; l’affichage des deux repères n’implique pas qu’une atteinte bilatérale soit nécessaire.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:right:18', source_name: G_insular_short}
    evidence:
      - {reference: gu-2012, role: supporting}

  - id: disinhibition-orbitofrontal
    deficit: disinhibition
    title: {en: Caregiver-reported disinhibition after traumatic injury, fr: Désinhibition rapportée par les proches après traumatisme}
    network: {en: Orbitofrontal and distributed social-control regions, fr: Régions orbitofrontales et réseau distribué de contrôle social}
    laterality: bilateral
    finding:
      en: Greater reported disinhibition was associated with damage mainly in right orbitofrontal cortex, with additional bilateral rectus and insular, right temporal and left frontal regions. The voxelwise results survived false-discovery-rate correction.
      fr: Une désinhibition rapportée plus importante était associée surtout à une atteinte orbitofrontale droite, avec d’autres régions rectus et insulaires bilatérales, temporales droites et frontales gauches. Les résultats voxel par voxel résistaient à la correction du taux de fausses découvertes.
    limitation:
      en: The study measured caregiver reports decades after injury in male veterans. Lesion groups differed in total volume loss, and a single assessment cannot reconstruct the time course or establish that one region alone causes disinhibition.
      fr: L’étude mesurait les observations des proches des décennies après la lésion chez des vétérans masculins. Les groupes différaient par la perte de volume totale et une évaluation unique ne reconstitue pas l’évolution ni n’établit qu’une seule région cause la désinhibition.
    mapping_note:
      en: The right orbital and both rectus parcels provide selected frontal landmarks. They exceed the significant clusters and omit the additional temporal, insular and lateral frontal findings.
      fr: Les parcelles orbitale droite et rectus bilatérales fournissent des repères frontaux sélectionnés. Elles dépassent les amas significatifs et omettent les autres constats temporaux, insulaires et frontaux latéraux.
    mappings:
      - {region: 'destrieux:right:24', source_name: G_orbital}
      - {region: 'destrieux:left:31', source_name: G_rectus}
      - {region: 'destrieux:right:31', source_name: G_rectus}
    evidence:
      - {reference: knutson-2015, role: supporting}

  - id: left-right-parietal-disconnection
    deficit: left-right-disorientation
    title: {en: Left–right confusion within a parietal syndrome, fr: Confusion droite-gauche dans un syndrome pariétal}
    network: {en: Parietal spatial and body-representation connections, fr: Connexions pariétales des représentations spatiales et corporelles}
    laterality: left
    finding:
      en: A patient with left superior parietal damage had left–right orientation problems together with finger agnosia, agraphia and acalculia. Tract analyses indicated disruption of intraparietal and frontoparietal connections.
      fr: Un patient avec atteinte pariétale supérieure gauche avait des difficultés d’orientation droite-gauche associées à une agnosie digitale, une agraphie et une acalculie. Les analyses de faisceaux indiquaient une déconnexion intrapariétale et frontopariétale.
    limitation:
      en: The combined syndrome does not isolate left–right discrimination. Moore reported the same tetrad after right parietal stroke with evidence of reversed cerebral dominance, so fixed left-sided localization is not universal.
      fr: Le syndrome associé n’isole pas la discrimination droite-gauche. Moore rapportait la même tétrade après AVC pariétal droit avec arguments de dominance cérébrale inversée; une localisation gauche fixe n’est donc pas universelle.
    mapping_note:
      en: The left superior parietal parcel marks the main cortical lesion in the disconnection case. White-matter pathways and the precise boundaries of the right-sided comparison case are not mapped.
      fr: La parcelle pariétale supérieure gauche repère la lésion corticale principale du cas de déconnexion. Les voies de substance blanche et les limites précises du cas comparatif droit ne sont pas cartographiées.
    mappings:
      - {region: 'destrieux:left:27', source_name: G_parietal_sup}
    evidence:
      - {reference: ranzini-2023, role: supporting}
      - {reference: moore-1991, role: qualifying}

  - id: aphantasia-occipitotemporal
    deficit: aphantasia
    title: {en: Acquired imagery loss after posterior stroke, fr: Perte acquise d’imagerie après AVC postérieur}
    network: {en: Ventral visual imagery network, fr: Réseau ventral d’imagerie visuelle}
    laterality: bilateral
    finding:
      en: An architect lost visual imagery after bilateral posterior stroke. Comparisons with four other patients identified small selectively damaged areas in left fusiform and right lingual cortex. A later 12-case analysis found heterogeneous lesions connected to a left fusiform imagery node.
      fr: Un architecte perdait l’imagerie visuelle après AVC postérieur bilatéral. Les comparaisons avec quatre autres patients identifiaient de petites zones sélectivement lésées des cortex fusiforme gauche et lingual droit. Une analyse ultérieure de 12 cas trouvait des lésions hétérogènes connectées à un nœud fusiforme gauche d’imagerie.
    limitation:
      en: The architect also had other visual deficits, and case comparisons cannot establish a sufficient lesion. Only five of the 12 lesions directly intersected the imagery node; normative functional connectivity is not evidence of direct fusiform damage in every case.
      fr: L’architecte avait aussi d’autres déficits visuels et les comparaisons de cas n’établissent pas de lésion suffisante. Seules cinq des 12 lésions intersectaient directement le nœud d’imagerie; la connectivité fonctionnelle normative ne prouve pas une atteinte fusiforme directe dans chaque cas.
    mapping_note:
      en: Whole left fusiform and right lingual parcels mark the small selective areas in the architect comparison. They do not reproduce the full infarcts, isolate the imagery node, or map every lesion in the network study.
      fr: Les parcelles fusiforme gauche et linguale droite entières repèrent les petites zones sélectives de la comparaison de l’architecte. Elles ne reproduisent pas les infarctus entiers, n’isolent pas le nœud d’imagerie et ne cartographient pas chaque lésion de l’étude de réseau.
    mappings:
