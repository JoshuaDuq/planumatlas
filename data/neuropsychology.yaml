  - id: taste-insular
    deficit: taste-impairment
    title: {en: Taste intensity and identification, fr: Intensité et identification gustatives}
    network: {en: Insular gustatory processing, fr: Traitement gustatif insulaire}
    laterality: bilateral
    finding:
      en: Right insular injury impaired ipsilateral taste intensity and recognition. Left injury impaired ipsilateral intensity but bilateral recognition in this small series.
      fr: L’atteinte insulaire droite altérait l’intensité et la reconnaissance gustatives ipsilatérales. L’atteinte gauche altérait l’intensité ipsilatérale mais la reconnaissance bilatérale dans cette petite série.
    limitation:
      en: Six insular cases do not establish universal gustatory lateralization. Impaired intensity or recognition is not necessarily complete loss of taste.
      fr: Six cas insulaires n’établissent pas une latéralisation gustative universelle. Une intensité ou une reconnaissance altérée n’équivaut pas nécessairement à une perte complète du goût.
    mapping_note:
      en: Short and long insular parcels provide broad landmarks on either side, not a delineation of primary taste cortex. The patients had unilateral lesions.
      fr: Les parcelles insulaires courtes et longues fournissent des repères larges de chaque côté, sans délimiter le cortex gustatif primaire. Les patients avaient des lésions unilatérales.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:right:18', source_name: G_insular_short}
