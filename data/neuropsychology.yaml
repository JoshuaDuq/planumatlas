    laterality: bilateral
    finding:
      en: The frontal stroke/tumour group made more estimation errors and very extreme responses than posterior-lesion patients and healthy controls. Differences from controls persisted after accounting for arithmetic and fluid-intelligence scores; overall estimation scores did not distinguish left from right frontal groups.
      fr: Le groupe avec AVC ou tumeur frontale faisait davantage d’erreurs d’estimation et de réponses très extrêmes que les patients avec lésion postérieure et les témoins sains. Les différences avec les témoins persistaient en tenant compte de l’arithmétique et de l’intelligence fluide; les scores globaux d’estimation ne distinguaient pas les groupes frontaux gauche et droit.
    limitation:
      en: Mixed etiologies, a small imaging subset and lesion overlap precluded precise frontal localization. The abstract and final methods give different sample counts. The independent right-stroke study shows that this task is not exclusively a test of frontal injury.
      fr: Les étiologies mixtes, le petit sous-groupe d’imagerie et le chevauchement des lésions empêchaient une localisation frontale précise. Le résumé et les méthodes finales donnent des effectifs différents. L’étude indépendante des AVC droits montre que cette tâche ne mesure pas exclusivement une atteinte frontale.
    mapping_note:
      en: No parcel is coloured from a broad frontal group comparison. Bilateral laterality represents separate left- and right-lesion groups, not obligatory bilateral damage. The separate temporal/frontal finding supplies the profile’s specific landmarks.
      fr: Aucune parcelle n’est colorée à partir d’une comparaison frontale globale. La latéralité bilatérale représente des groupes avec lésion gauche ou droite distincts, et non une atteinte bilatérale obligatoire. Le résultat temporal/frontal distinct fournit les repères précis du profil.
