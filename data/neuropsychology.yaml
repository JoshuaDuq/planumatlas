      en: [emotional facial paresis, emotional facial palsy, mimetic facial weakness, asymmetric spontaneous smile, impaired emotional smile]
      fr: [parésie faciale émotionnelle, paralysie faciale émotionnelle, faiblesse faciale mimétique, sourire spontané asymétrique, déficit du sourire émotionnel]

  - id: post-stroke-urinary-retention
    name: {en: Post-stroke urinary retention, fr: Rétention urinaire après AVC}
    domain: {en: Emptying the bladder, fr: Vidange de la vessie}
    group: sensorimotor
    summary:
      en: Failure to empty the bladder adequately after stroke, sometimes despite a sensation of fullness. Selected brainstem cases support a neurological contribution, while obstruction, medication effects and other non-neurological causes remain important alternatives; retention can coexist with overflow leakage.
      fr: Incapacité à vider suffisamment la vessie après AVC, parfois malgré une sensation de remplissage. Certains cas du tronc cérébral soutiennent une contribution neurologique, tandis qu’obstruction, médicaments et autres causes non neurologiques restent des explications alternatives importantes; la rétention peut coexister avec des fuites par regorgement.
    aliases:
      en: [post stroke urinary retention, urinary retention, bladder emptying dysfunction, inability to void, postvoid residual urine]
      fr: [rétention urinaire après AVC, rétention urinaire, trouble de vidange vésicale, incapacité à uriner, résidu urinaire postmictionnel]

  - id: material-specific-memory
    name: {en: Material-specific memory impairment, fr: Trouble mnésique spécifique au matériel}
    domain: {en: Memory, fr: Mémoire}
    group: memory
    summary:
      en: Memory loss that affects one kind of material more than another, such as words more than locations, after damage to one temporal lobe. This profile compares verbal memory after left temporal surgery with spatial memory after right hippocampal damage.
      fr: Perte de mémoire touchant davantage un type de matériel qu’un autre, par exemple les mots plus que les emplacements, après une atteinte d’un seul lobe temporal. Ce profil compare la mémoire verbale après une chirurgie temporale gauche et la mémoire spatiale après une atteinte hippocampique droite.
