  - id: fluency-superior-medial
    deficit: verbal-fluency
    title: {en: Reduced output across fluency tasks, fr: Production réduite dans toutes les tâches de fluence}
    network: {en: Superior medial frontal energization system, fr: Système frontal médial supérieur d’énergisation}
    laterality: bilateral
    finding:
      en: Among 47 frontal and 20 posterior focal-lesion patients, only those with superior medial frontal lesions were impaired on all eight verbal and non-verbal fluency tasks, which the authors interpret as an energization deficit. In 74 focal-lesion patients, superior medial frontal damage on either side moderately impaired letter fluency.
      fr: Parmi 47 patients ayant des lésions focales frontales et 20 des lésions postérieures, seuls ceux ayant des lésions frontales médiales supérieures étaient altérés dans les huit tâches de fluence verbales et non verbales, ce que les auteurs interprètent comme un déficit d’énergisation. Chez 74 patients ayant des lésions focales, une atteinte frontale médiale supérieure droite ou gauche altérait modérément la fluence littérale.
    limitation:
      en: The abstracts do not give the number of superior medial cases, and lesions were grouped into broad frontal subdivisions. A general reduction in output is not specific to language.
      fr: Les résumés ne précisent pas le nombre de cas médiaux supérieurs, et les lésions étaient regroupées en grandes subdivisions frontales. Une baisse générale de production n’est pas propre au langage.
    mapping_note:
      en: The superior frontal gyri on both sides approximate the superior medial frontal region. The parcels also cover dorsolateral superior frontal cortex and do not reproduce the studies' lesion classification.
