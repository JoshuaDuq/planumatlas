    limitation:
      en: One case with uncertain injury etiology and substantial cortical involvement. Aphasia and visual impairment limited memory assessment and establishing hypermetamorphosis; this does not isolate amygdala causation. Park’s different MRI pattern qualifies any claim of necessity.
