  - id: dysarthria-corticobulbar
    deficit: dysarthria
    title: {en: Along the corticobulbar tract, fr: Le long du faisceau cortico-bulbaire}
    network: {en: 'Lower motor cortex, striatocapsular region and pontine base', fr: 'Cortex moteur inférieur, région striato-capsulaire et base du pont'}
    laterality: bilateral
    finding:
      en: In 62 acute dysarthrias from a single infarct, extracerebellar lesions lay in the lower motor cortex (14.5%), striatocapsular region (46.8%) or base of the pons (24.2%), all along the corticobulbar fibres. Left-sided lesions produced more severe articulatory impairment regardless of site.
      fr: Chez 62 dysarthries aiguës dues à un infarctus unique, les lésions extracérébelleuses siégeaient dans le cortex moteur inférieur (14,5 %), la région striato-capsulaire (46,8 %) ou la base du pont (24,2 %), toutes le long des fibres cortico-bulbaires. Les lésions gauches produisaient une atteinte articulatoire plus sévère quel que soit le site.
    limitation:
      en: Patients selected for dysarthria, so the lesion sites do not show how often each site produces it. Speech normalized within weeks in about 40% of those followed.
      fr: Patients sélectionnés pour la dysarthrie; les sites lésionnels n’indiquent donc pas la fréquence avec laquelle chacun la produit. La parole se normalisait en quelques semaines chez environ 40 % des patients suivis.
    mapping_note:
      en: The precentral gyrus, putamen and pontine territory mark three levels of the tract on each side; the internal capsule has no parcel.
      fr: Le gyrus précentral, le putamen et le territoire pontique repèrent trois niveaux du faisceau de chaque côté; la capsule interne n’a pas de parcelle.
    mappings:
      - {region: 'destrieux:left:29', source_name: G_precentral}
      - {region: 'destrieux:right:29', source_name: G_precentral}
      - {region: 'aseg:left:12', source_name: Left-Putamen}
      - {region: 'aseg:right:51', source_name: Right-Putamen}
      - {region: 'learning:left:pons', source_name: Pontine territory}
      - {region: 'learning:right:pons', source_name: Pontine territory}
    evidence:
      - {reference: urban-2006, role: supporting}

  - id: dysarthria-cerebellar
    deficit: dysarthria
    title: {en: Rostral paravermal cerebellum, fr: Cervelet paravermien rostral}
    network: {en: Anterior lobe articulatory representation, fr: Représentation articulatoire du lobe antérieur}
    laterality: bilateral
    finding:
      en: In seven isolated cerebellar infarcts with dysarthria, the common site was the rostral paravermal anterior lobe in the superior cerebellar artery territory, six on the right. Voxel-based mapping in a separate series linked dysarthria to paravermal and hemispheral lobules V and VI.
      fr: Dans sept infarctus cérébelleux isolés avec dysarthrie, le site commun était le lobe antérieur paravermien rostral dans le territoire de l’artère cérébelleuse supérieure, six à droite. Une cartographie voxel par voxel dans une autre série reliait la dysarthrie aux lobules paravermiens et hémisphériques V et VI.
    limitation:
      en: Small numbers, and 11 of 18 patients also had brainstem involvement. All patients were right-handed, so the right-sided predominance may not generalise.
      fr: Petits effectifs, et 11 des 18 patients avaient aussi une atteinte du tronc cérébral. Tous les patients étaient droitiers; la prédominance droite pourrait donc ne pas se généraliser.
    mapping_note:
      en: CerebNet lobules I–V mark the anterior lobe and lobule VI the voxelwise site, on each side. The paravermal zone is not delineated, and lobules I–V include their vermis.
      fr: Les lobules CerebNet I–V repèrent le lobe antérieur et le lobule VI le site voxel par voxel, de chaque côté. La zone paravermienne n’est pas délimitée, et les lobules I–V incluent leur vermis.
    mappings:
