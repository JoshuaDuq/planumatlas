  - id: hand-paresis-precentral
    deficit: hand-paresis
    title: {en: Precentral hand representation, fr: Représentation précentrale de la main}
    network: {en: Cortical hand motor system, fr: Système moteur cortical de la main}
    laterality: bilateral
    finding:
      en: A series selected for hand-knob infarction documented contralateral hand weakness; 21 of 29 patients had infarcts confined to that cortical area.
      fr: Une série sélectionnée pour infarctus du bouton de la main documentait une faiblesse controlatérale; 21 des 29 patients avaient des infarctus limités à cette aire corticale.
    limitation:
      en: Selection by lesion and symptom prevents estimating diagnostic specificity. Chen’s six-patient series included a postcentral infarct sparing precentral cortex, so this is not the only possible cortical site.
      fr: La sélection par lésion et symptôme empêche d’estimer la spécificité diagnostique. La série de six patients de Chen incluait un infarctus postcentral épargnant le cortex précentral; ce n’est donc pas le seul site cortical possible.
    mapping_note:
      en: Each entire precentral gyrus is shown; the hand knob and individual finger representations are not separately delineated. Bilateral landmarks do not imply bilateral injury is required.
      fr: Chaque gyrus précentral entier est affiché; le bouton de la main et les représentations digitales ne sont pas délimités séparément. Les repères bilatéraux n’impliquent pas qu’une atteinte bilatérale soit nécessaire.
    mappings:
