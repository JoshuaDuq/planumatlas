      fr: Erreurs grammaticales dans le discours spontané après un AVC, soit des phrases simplifiées et télégraphiques (agrammatisme), soit un discours fluide aux structures grammaticales mal employées (paragrammatisme). Ce profil compare leurs corrélats lésionnels frontaux et temporaux.
