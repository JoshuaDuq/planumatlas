  - id: agnosia-object-recognition
    deficit: agnosia
    title: {en: Visual recognition of objects, fr: Reconnaissance visuelle des objets}
    network: {en: Ventral occipitotemporal object recognition, fr: Reconnaissance des objets occipitotemporale ventrale}
    laterality: bilateral
    finding:
      en: One patient lost visual object and word recognition with a left posterior inferior temporal metastasis. Another had object agnosia with a right lateral fusiform lesion, accompanied by reduced object-related responses beyond the visible lesion and in the opposite hemisphere.
      fr: Une patiente perdait la reconnaissance visuelle des objets et des mots avec une métastase temporale inférieure postérieure gauche. Un autre avait une agnosie des objets avec lésion fusiforme latérale droite, accompagnée de réponses liées aux objets réduites au-delà de la lésion visible et dans l’hémisphère opposé.
    limitation:
      en: Two different case profiles do not establish a single necessary object-recognition site or fixed hemispheric dominance. In the metastasis case symptoms improved with corticosteroids; functional responses and structural lesion location need not coincide.
      fr: Deux profils de cas différents n’établissent ni un site unique nécessaire à la reconnaissance des objets ni une dominance hémisphérique fixe. Dans le cas métastatique les symptômes s’amélioraient sous corticoïdes; les réponses fonctionnelles et la localisation lésionnelle structurale ne coïncident pas nécessairement.
    mapping_note:
      en: Left inferior temporal and right fusiform parcels mark separate reported cases. They exceed the focal lesions and do not imply that bilateral cortical injury is required or that the same fusiform subregions support faces and objects.
      fr: Les parcelles temporale inférieure gauche et fusiforme droite repèrent des cas distincts. Elles dépassent les lésions focales et n’impliquent ni la nécessité d’une atteinte corticale bilatérale ni que les mêmes sous-régions fusiformes traitent les visages et les objets.
    mappings:
