<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="An open 3D atlas of the human brain, where cortical and deep parcellations, tractography and the published findings for each region are read on the same anatomy."
    />
    <title>Planum · Interactive 3D Human Brain Atlas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Every view here is a shareable link, so a share that renders as a bare
      URL is a view nobody opens. The absolute URL is the published site: a
      relative one resolves against the sharing service, not against this page.
    -->
    <link rel="canonical" href="https://planumatlas.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Planum" />
    <meta property="og:title" content="Planum, an open 3D atlas of the human brain" />
    <meta
      property="og:description"
      content="Cortical and deep parcellations, tractography and the published findings for each region, read on the same anatomy. Built from real MRI data, free, with nothing to install."
    />
    <meta property="og:url" content="https://planumatlas.com/" />
    <meta property="og:image" content="https://planumatlas.com/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="One person's MRI-reconstructed brain on a dark field: a translucent cortex, each Destrieux region in its own colour, over diffusion tract bundles coloured by local direction, with the cerebellar lobules below."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <!-- What Planum is, for search engines: data, not a script the browser runs. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Planum",
        "alternateName": "Planum Atlas",
        "url": "https://planumatlas.com/",
        "image": "https://planumatlas.com/preview.png",
        "description": "An open 3D atlas of the human brain, where cortical and deep parcellations, tractography and the published findings for each region are read on the same anatomy. It is built from real MRI data, with the surface, the sections and the white-matter tracts all taken from the same brain, and a standard MNI template can be used as the anatomy instead.",
        "applicationCategory": "EducationalApplication",
        "browserRequirements": "Requires WebGL 2",
        "operatingSystem": "Any",
        "inLanguage": ["en", "fr"],
        "isAccessibleForFree": true,
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "author": { "@type": "Person", "name": "Joshua Duquette" },
        "identifier": ["https://doi.org/10.5281/zenodo.24428325", "RRID:SCR_029332"],
        "sameAs": [
          "https://github.com/JoshuaDuq/planumatlas",
          "https://doi.org/10.5281/zenodo.24428325",
          "https://www.wikidata.org/wiki/Q142239517",
          "https://bio.tools/planum"
        ]
      }
    </script>
    <!--
      The reader's theme and language, applied before the first paint so neither flashes the
      other's value. Each rule is the app's own, restated here because the
      app has not loaded: theme is `resolveTheme` (src/lib/state/theme.svelte.ts), language is
      `startLanguage` with the link's `lang` and the browser's languages
      (src/lib/state/language.svelte.ts), an embedded frame is the link's `embed=1` as decodeState
      reads it (src/lib/core/state/url-state.ts), keys are PREF_KEYS
      (src/lib/state/prefs.ts) and the two theme-color values are --surface-base in tokens.css.
      src/app/head-script.test.ts holds them equal. Site data can be blocked, which makes reading
      localStorage throw.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        var saved = null;
        try {
          theme = localStorage.getItem('planum.theme');
          saved = localStorage.getItem('planum-lang');
        } catch (blocked) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        // A repeated `lang` is rejected by decodeState, so it decides nothing here either.
        var link = new URLSearchParams(location.hash.replace(/^#/, ''));
        var values = link.getAll('lang');
        var linked = values.length === 1 ? values[0] : null;
        root.dataset.theme = theme;
        // An embedded frame is the stage alone, so the frame painted before the app leaves its rails out.
        var frames = link.getAll('embed');
        if (frames.length === 1 && frames[0] === '1') root.dataset.embed = '';
        // The reader's saved choice wins over a link's.
        var lang = saved === 'en' || saved === 'fr' ? saved : linked;
        for (var i = 0; lang !== 'en' && lang !== 'fr' && i < navigator.languages.length; i++) {
          lang = navigator.languages[i].toLowerCase().split('-')[0];
        }
        root.lang = lang === 'fr' ? 'fr' : 'en';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#1b1e21' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <!--
      Only ever painted when scripts are off. It is plain HTML, so it is English; the app's own
      strings are bilingual because the app can read the reader's language.
    -->
    <noscript>
      <div class="noscript-notice">
        <h1>Planum</h1>
        <p>
          An open 3D atlas of the human brain, where cortical and deep parcellations, tractography
          and the published findings for each region are read on the same anatomy.
        </p>
        <p>
          It is built from real MRI data, with the surface, the sections and the white-matter tracts
          all taken from the same brain, so they agree with one another.
        </p>
        <p>
          It renders the anatomy in your browser with WebGL 2, so it needs JavaScript enabled. The
          published model assets and their provenance are available without it:
          <a href="models/anatomies.json">the anatomy index</a>, and the source and method are
          documented in the project's README.
        </p>
      </div>
    </noscript>
    <div id="app" data-status="loading"></div>
    <!-- In the initial HTML, so it exists before the first message; announcer.svelte.ts takes it over. -->
    <p id="announcer" role="status" aria-live="polite" class="visually-hidden"></p>
    <script type="module" src="/src/main.ts"></script>
    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "3bdcca187be6446e9e9d245415a8e1b4"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
