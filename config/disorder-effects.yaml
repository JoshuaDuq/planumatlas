# Fixed before the derivation was written. The epilepsy checks were measured on these tables
# 2026-11-12 (left −1.73, right −1.91) before any of this was built; the derivation stops when one fails.
validation:
  # Whelan et al. 2018: the sclerotic side's hippocampus is the largest volume loss.
  - {disorder: tle-left, measure: volume, most_negative: [left, hippo]}
  - {disorder: tle-right, measure: volume, most_negative: [right, hippo]}
  # van Erp et al. 2016: smaller hippocampi and larger lateral ventricles in schizophrenia.
  - {disorder: schizophrenia, measure: volume, negative: [[left, hippo], [right, hippo]], positive: [[left, LatVent], [right, LatVent]]}
  # Where a table publishes both, Benjamini–Hochberg over its uncorrected p must reproduce its own
  # FDR decisions in at least this share of rows (measured 0.875 to 1).
  - {fdr_agreement_at_least: 0.85}
