# Case–control differences in cortical thickness and subcortical volume from the ENIGMA consortium's
# working groups, as the ENIGMA Toolbox (Larivière et al. 2021) republishes their summary statistics:
# Cohen's d per Desikan-Killiany region and per FreeSurfer structure, patients minus controls,
# adjusted for intracranial volume. scripts/fetch_disorder_effects.py reads the tables pinned here
# into data/disorder-effects.json; the build carries each row to the region of its name.
label: Brain differences in disorders (ENIGMA consortium)
license: BSD 3-Clause (ENIGMA Toolbox repository)
source:
  short: ENIGMA Toolbox
  citation: "Larivière S, Paquola C, Park B-y, et al. (2021) The ENIGMA Toolbox: multiscale neural contextualization of multisite neuroimaging datasets. Nature Methods 18:698–700"
  pmid: 34194050
  repository: https://github.com/MICA-MNI/ENIGMA
  commit: b08974b55243060cbc1fad12c87048037446e8f7
  directory: enigmatoolbox/datasets/summary_statistics
  license: [LICENSE, aecec6f9b8e75153c441e8332d349407df4082aaf367775df49553cb07f424fe]
# A region is painted and listed only where its difference survives a false discovery rate of 5%
# within its table: the table's own FDR-corrected p where every row has one, otherwise
# Benjamini–Hochberg over the table's uncorrected p ("<0.001" read as 0.001). The tables' SE and CI
# columns are not used: several give them in millimetres, not in units of d.
false_discovery_rate: 0.05
# Two steps each way, split at Cohen's conventional small effect, 0.2: three steps each way cannot
# stay apart from the cortex, deep grey and ventricle colours under dichromacy. Chosen 2026-11-12
# after measuring the significant |d| (median 0.24, 90th percentile 0.47, maximum 1.91): every
# colour differs from those three tissue colours by an OKLab ΔE of at least 13.0 and from the others
# by at least 28.2, under normal vision and simulated protanopia and deuteranopia (Machado 2009,
# severity 1).
d_scale:
  split: 0.2
  smaller: [[105, 130, 245], [10, 25, 130]]
  larger: [[252, 190, 25], [175, 90, 0]]
# The tables' subcortical names, to FreeSurfer's aseg labels.
structures:
  accumb: {left: 26, right: 58}
  amyg: {left: 18, right: 54}
  caud: {left: 11, right: 50}
  hippo: {left: 17, right: 53}
  pal: {left: 13, right: 52}
  put: {left: 12, right: 51}
  thal: {left: 10, right: 49}
  LatVent: {left: 4, right: 43}
# One case–control comparison per disorder and measure. `population` says whom a table compares when
# it is narrower than the disorder's name.
