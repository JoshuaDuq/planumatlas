# Predicted retinotopy of V1–V3: the Benson anatomical template (v4.0), which
# neuropythy publishes on fsaverage, fitted to the group average of the 181 HCP
# 7T retinotopy participants. scripts/fetch_retinotopy.py downloads it; the build
# carries it onto this brain through the registered spheres. It is a prediction
# from folding, not a measurement of this brain: no retinotopy was scanned here.
label: Predicted retinotopy (Benson template v4.0)
citation: Benson NC, Jamison KW, Arcaro MJ, Vu AT, Glasser MF, Coalson TS, Van Essen DC, Yacoub E, Ugurbil K, Winawer J, Kay K (2018) The Human Connectome Project 7 Tesla retinotopy dataset. J Vis 18(13):23
