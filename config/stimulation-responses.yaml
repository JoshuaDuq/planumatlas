# Responses to single-pulse electrical stimulation, recorded with stereo-EEG in
# 27 people with focal epilepsy (Lyu et al. 2025). Each stimulation–recording
# pair of bipolar channels was classed by the authors as responding, not
# responding, or excluded (artefact or bad channel). Nothing here is measured in
# the anatomy shown: a region takes the authors' anatomical label, and the rates
# are pooled over the cohort, by side (same or opposite hemisphere).
# scripts/fetch_stimulation_responses.py reads the files below, pinned by
# checksum, into data/stimulation-responses.json; the build reads that file.
label: Stimulation responses (Lyu et al. 2025)
license: CC BY 4.0
source:
