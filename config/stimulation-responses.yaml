# HCP's fs_LR 32k sphere deformed to fsaverage: carries a channel's vertex to the
# nearest fsaverage vertex, and so to its Destrieux parcel, by surface registration.
spheres:
  base: https://raw.githubusercontent.com/Washington-University/HCPpipelines/0aef592a9128b6f2090f6be0f495f310419bba3c/global/templates/standard_mesh_atlases/resample_fsaverage
  lh: [fs_LR-deformed_to-fsaverage.L.sphere.32k_fs_LR.surf.gii, 31987d139b6cdf1040188d1795bf23c213c57f8e84fb45f2c04823d996b0defc]
  rh: [fs_LR-deformed_to-fsaverage.R.sphere.32k_fs_LR.surf.gii, 8c1f67fa8fb3024ad3b292be995d5c9bae07dc4dbdd53fbac48e511e1366553d]
# A Destrieux parcel takes the label most of the cortical channels landing in it
# carry, only past all three. Set before any parcel was assigned (2026-11-03).
assignment:
  min_channels: 10
  min_subjects: 3
  min_share: 0.6
# A response rate is drawn only from pairs tested in this many people; fewer
# show their counts alone.
rates:
  min_subjects: 3
# The authors' labels, assigned by hand on each person's own T1 scan, in display
# order. CLT and FP are not spelled out in the paper; their contacts lie at the
# claustrum (MNI305 x ±32–38, z ≈ 0 mm) and the frontal pole (y ≈ 70 mm).
# The thalamus is labelled by position, not nucleus, as the authors chose; its
# sites carry a short name for the choice between them.
labels:
  - {id: FP, name: Frontal pole, name_fr: Pôle frontal, cortical: true}
  - {id: LFC, name: Lateral frontal cortex, name_fr: Cortex frontal latéral, cortical: true}
  - {id: OFC, name: Orbitofrontal cortex, name_fr: Cortex orbitofrontal, cortical: true}
  - {id: MFC, name: Medial frontal cortex, name_fr: Cortex frontal médial, cortical: true}
  - {id: ACC, name: Anterior cingulate cortex, name_fr: Cortex cingulaire antérieur, cortical: true}
  - {id: MCC, name: Midcingulate cortex, name_fr: Cortex cingulaire moyen, cortical: true}
  - {id: SM, name: Sensorimotor cortex, name_fr: Cortex sensorimoteur, cortical: true}
  - {id: INS, name: Insula, name_fr: Insula, cortical: true}
  - {id: INSULA/LFC, name: Insula–lateral frontal border, name_fr: Limite insula–cortex frontal latéral, cortical: false}
  - {id: PMC, name: Posteromedial cortex, name_fr: Cortex postéro-médian, cortical: true}
  - {id: SPL, name: Superior parietal lobule, name_fr: Lobule pariétal supérieur, cortical: true}
  - {id: IPL, name: Inferior parietal lobule, name_fr: Lobule pariétal inférieur, cortical: true}
  - {id: OCC, name: Occipital cortex, name_fr: Cortex occipital, cortical: true}
  - {id: STG, name: Superior temporal gyrus, name_fr: Gyrus temporal supérieur, cortical: true}
  - {id: MTG, name: Middle temporal gyrus, name_fr: Gyrus temporal moyen, cortical: true}
  - {id: ITG, name: Inferior temporal gyrus, name_fr: Gyrus temporal inférieur, cortical: true}
  - {id: TP, name: Temporal pole, name_fr: Pôle temporal, cortical: true}
  - {id: FG, name: Fusiform gyrus, name_fr: Gyrus fusiforme, cortical: true}
  - {id: PHG, name: Parahippocampal gyrus, name_fr: Gyrus parahippocampique, cortical: true}
  - {id: HPC, name: Hippocampus, name_fr: Hippocampe, cortical: false}
  - {id: AMY, name: Amygdala, name_fr: Amygdale, cortical: false}
  - {id: BG, name: Basal ganglia, name_fr: Ganglions de la base, cortical: false}
  - {id: CLT, name: Claustrum, name_fr: Claustrum, cortical: false}
  - {id: antTH, name: Anterior thalamus, name_fr: Thalamus antérieur, short: Anterior, short_fr: Antérieur, cortical: false}
  - {id: midTH, name: Middle thalamus, name_fr: Thalamus moyen, short: Middle, short_fr: Moyen, cortical: false}
  - {id: pstTH, name: Posterior thalamus, name_fr: Thalamus postérieur, short: Posterior, short_fr: Postérieur, cortical: false}
# Deep structures take labels by name; an aseg name is matched with its
# hemisphere prefix, and a learning unit passes its labels to its NextBrain
# constituents. "Basal ganglia" is read as the authors describe it (putamen,
# pallidum) with the caudate; the accumbens is left out.
targets:
  - {labels: [HPC], regions: [{atlas: aseg, name: Hippocampus}, {atlas: learning, name: Hippocampal formation}]}
  - {labels: [AMY], regions: [{atlas: aseg, name: Amygdala}, {atlas: learning, name: Amygdala and transition areas}]}
  - {labels: [BG], regions: [{atlas: aseg, name: Caudate}, {atlas: aseg, name: Putamen}, {atlas: aseg, name: Pallidum},
                              {atlas: learning, name: Caudate nucleus}, {atlas: learning, name: Putamen},
                              {atlas: learning, name: Globus pallidus — external}, {atlas: learning, name: Globus pallidus — internal}]}
  - {labels: [CLT], regions: [{atlas: learning, name: Claustrum}]}
  - {labels: [antTH, midTH, pstTH], regions: [{atlas: aseg, name: Thalamus-Proper}, {atlas: learning, name: Thalamus}]}
