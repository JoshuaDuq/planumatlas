# Harvard Ascending Arousal Network Atlas, version 2.0 (Edlow and Kinney 2023):
# ten brainstem nuclei traced by hand in FSL's MNI152 at 1 mm from histology and
# ex-vivo MRI of other brains. scripts/register_arousal_nuclei.py places them on
# this brain, by template registration or by FreeSurfer's SegmentAAN, whichever
# passes the checks below; the build meshes each as a supplemental structure.
label: Harvard Ascending Arousal Network Atlas 2.0
citations:
  - https://doi.org/10.5061/dryad.zw3r228d2
  - https://doi.org/10.1097/NEN.0b013e3182588293
  - https://doi.org/10.1126/scitranslmed.adj4303
# Edlow et al. 2012 (version 1.0) and 2024 (version 2.0), checked through E-utilities.
pmids: [22592840, 38691619]
# What the published nuclei are distributed under and credited to, by the method that placed them.
methods:
  synthmorph:
    license: CC0 1.0
    license_file: Harvard-AAN-Atlas-CC0-1.0.txt
    attribution: Harvard Ascending Arousal Network Atlas 2.0 (Edlow and Kinney 2023, Dryad), registered to this brain with SynthMorph
    citations: [https://doi.org/10.1162/imag_a_00197]
  segment-aan:
    # Olchanyi et al. 2025, PMID 41074651, checked through E-utilities.
    license: FreeSurfer Software License
    license_file: FreeSurfer.html
    attribution: Arousal nuclei segmented on this brain with FreeSurfer 8.2's SegmentAAN (Olchanyi et al. 2025)
    citations: [https://doi.org/10.1002/hbm.70357]
source:
  doi: https://doi.org/10.5061/dryad.zw3r228d2
  # Dryad's API serves files only with a bearer token, and its download links only
  # to a browser, so the archive is downloaded by hand and checked here.
  manual: >-
    Open https://datadryad.org/dataset/doi:10.5061/dryad.zw3r228d2 in a browser,
    choose "Download dataset", and unzip the archive into data/cache/arousal-nuclei/.
  directory: data/cache/arousal-nuclei
  archive: [doi_10_5061_dryad_zw3r228d2__v20230718.zip, 289ffa726dfca2eca4353dbce0fd72ded4354dbd409997c080a9ff8ac1962a9a, 187763635]
  # Each file used, as Dryad's API lists it (version 245119, 2023-07-18), with its SHA-256;
  # the API's listing of all 25 is kept beside them as dryad-file-list.json.
  files:
    combined: [AAN_Brainstem_MNI152_1mm_v2p0.nii, e6a7746f13a8c5e3f79aa3701e3a088fcc9f7b7365fc6fed7249884a64e2eb47]
