    DR: [AAN_DR_MNI152_1mm_v2p0.nii, 7b1bf0ad0148536327b19491d2e2b6ff51b3d8a2b9e621e8c0bdcc93a07d3c00]
    MnR: [AAN_MnR_MNI152_1mm_v2p0.nii, 483ad7edbdcfa4669936094c7b4ecbad1af93a8f98101cfb417fdda2dafbd5c4]
    PAG: [AAN_PAG_MNI152_1mm_v2p0.nii, fd4cd8cfe60694252a429540252b53a1ef8bfcdf9fd44ea64853889cdbe25fde]
    VTA: [AAN_VTA_MNI152_1mm_v2p0.nii, 3561f5d0b56d65da97f7ebb073573189c8dca786c7c18b9b9046879b2a3024fa]
    LC_L: [AAN_LC_L_MNI152_1mm_v2p0.nii, 0a2b14a1a7ab1725d48fe3524b33b242e1a27186d7a947aefee80abb29024977]
    LC_R: [AAN_LC_R_MNI152_1mm_v2p0.nii, 103bac9e8723a36d6d457a898b3f4a8ef93d4b7e4e11b904b732e04224ea9475]
    LDTg_L: [AAN_LDTg_L_MNI152_1mm_v2p0.nii, 692a897993d926debd58b894ac48bff5d8695d3802c4c049f187db131c194b7b]
    LDTg_R: [AAN_LDTg_R_MNI152_1mm_v2p0.nii, 7df6137d5514e8a99c4567ef2717b912f77f6b7f6b5710147eabbd2f5096e17e]
    mRt_L: [AAN_mRt_L_MNI152_1mm_v2p0.nii, 93bd272520268621f710ec54b2bd362649a6c6eacc4ff42704a57733e77b57ba]
    mRt_R: [AAN_mRt_R_MNI152_1mm_v2p0.nii, 11cca2079edf034aa7ad3286572af1e5a1295a10aff9a43f99bee1fd433f4ad9]
    PBC_L: [AAN_PBC_L_MNI152_1mm_v2p0.nii, 2bd1a79f9f024934de74e3da550d3ed7e73eab7567a76d6affef19c3ce1ac3c5]
    PBC_R: [AAN_PBC_R_MNI152_1mm_v2p0.nii, 41647f4b333e4088211af0cfa3e8d1026a56de529f8249171050b2a11ade0a5f]
