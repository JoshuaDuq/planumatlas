    # bilateral PTg file; the left nucleus is it less the right file.
    PTg_L: [AAN_PTg_L_MNI152_1mm_v2p0.nii, 0ded846187192ea4cc803760afbc40aa3192c429a11a3408199936688e83e64d]
    PTg_R: [AAN_PTg_R_MNI152_1mm_v2p0.nii, 2ad455344ed3e63d91055b809eb0c8d198be51ed5bca9eb0e17188506ab5c4d7]
# FSL's MNI152 (MNI152NLin6Asym), pinned and cached as config/striatal-networks.yaml has it.
template:
  base: https://templateflow.s3.amazonaws.com/tpl-MNI152NLin6Asym
  directory: data/cache/striatal-networks
  files:
    t1: [tpl-MNI152NLin6Asym_res-01_T1w.nii.gz, f675946c0a077e0682885c3d6085f10acb0dd22b2274a6cbbf04969c08a77258]
    mask: [tpl-MNI152NLin6Asym_res-01_desc-brain_mask.nii.gz, 6d540075dac093fa5070a929dc5ea52795d54cc9ab57fe1272086dc70314b428]
# What the carried nuclei must lie in, and are then kept to: aseg's Brain-Stem and
# left and right VentralDC, where aseg puts the ventral midbrain (decision 0013,
# 2026-11-17; the first runs used Brain-Stem alone).
envelope_labels: [16, 28, 60]
# Fixed before the run (2026-11-16). Three nuclei are labelled on this brain by its
# own NextBrain segmentation, each side apart, so both sides are taken together.
# Each carried nucleus must have its centroid within the distance of NextBrain's,
# and every nucleus must lie mostly inside the envelope before it is kept to it.
acceptance:
  centroid_distance_max_mm: 3
  inside_envelope_min: 0.95
  # Decision 0014 (2026-11-17), made after the results: the periaqueductal grey's rim
  # falls in aseg's label for the aqueduct it surrounds. Disclosed as a limitation.
  inside_envelope_exceptions:
    aan:midline:periaqueductal-grey: 0.90
  nextbrain:
    dorsal-raphe: dorsal_raphe_nucleus
    ventral-tegmental-area: ventral_tegmental_area
    periaqueductal-grey: periaqueductal_gray_substance
# Between methods that pass: the smaller mean centroid distance over the three; a
# difference under the tie margin goes to the higher mean Dice over the three.
selection:
  tie_margin_mm: 0.25
# Catalog subgroup under Brainstem.
family: {en: Arousal nuclei (Harvard atlas), fr: Noyaux de l’éveil (atlas de Harvard)}
# The ten nuclei: the release's file stems, its combined-volume codes and
# FreeSurfer SegmentAAN's labels, [left, right] for the paired ones. Colours are the
# release's own colour table.
