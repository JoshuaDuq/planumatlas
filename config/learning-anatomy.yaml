      en: >-
        Combines the globose and emboliform nuclei, also called the medial and lateral
        interposed nuclei.
      fr: >-
        Réunit les noyaux globuleux et emboliforme, également appelés noyaux interposés
        médial et latéral.
  - {id: fastigial, color: [116, 168, 150], name: Fastigial nucleus, name_fr: Noyau fastigial, system: Cerebellum, system_fr: Cervelet, labels: [715]}
aseg:
  # NextBrain labels no medulla below its lowest medullary voxels, though the scan and
  # aseg do. This unit is aseg's brainstem below the higher side's lowest voxel, so the
  # medulla meets the cord; above it, the NextBrain units stand alone.
  - id: caudal-medulla
    color: [128, 134, 168]
    hemisphere: midline
    name: Caudal medulla
    name_fr: Bulbe caudal
    system: Brainstem
    system_fr: Tronc cérébral
    labels: [16]
    below_nextbrain: medulla
    notes:
      en: >-
        Uses the part of FreeSurfer’s brainstem label below the NextBrain medullary coverage
        to continue toward the spinal cord. This boundary is a source-coverage boundary, not
        a distinct anatomical subdivision or a traced decussation.
      fr: >-
        Utilise la partie de l’étiquette du tronc cérébral de FreeSurfer située sous la
        couverture bulbaire de NextBrain pour prolonger le volume vers la moelle. Cette
        limite correspond à la couverture des sources, et non à une subdivision anatomique
        distincte ou à une décussation tracée.
  - id: ventricles-left
    color: [87, 139, 194]
    hemisphere: left
    name: Lateral ventricle
    name_fr: Ventricule latéral
    system: Ventricles and CSF
    system_fr: Ventricules et LCR
    labels: [4, 5]
    notes:
      en: >-
        Combines the lateral ventricle and inferior lateral ventricle labels. This solid
        represents a fluid space, not neural tissue.
      fr: >-
        Réunit les étiquettes du ventricule latéral et de sa partie inférieure. Ce volume
        représente un espace liquidien, et non du tissu nerveux.
  - id: ventricles-right
    color: [87, 139, 194]
    hemisphere: right
    name: Lateral ventricle
    name_fr: Ventricule latéral
    system: Ventricles and CSF
    system_fr: Ventricules et LCR
    labels: [43, 44]
    notes:
      en: >-
        Combines the lateral ventricle and inferior lateral ventricle labels. This solid
        represents a fluid space, not neural tissue.
      fr: >-
        Réunit les étiquettes du ventricule latéral et de sa partie inférieure. Ce volume
        représente un espace liquidien, et non du tissu nerveux.
  - {id: third-ventricle, color: [87, 139, 194], hemisphere: midline, name: Third ventricle, name_fr: Troisième ventricule, system: Ventricles and CSF, system_fr: Ventricules et LCR, labels: [14]}
  - {id: fourth-ventricle, color: [87, 139, 194], hemisphere: midline, name: Fourth ventricle, name_fr: Quatrième ventricule, system: Ventricles and CSF, system_fr: Ventricules et LCR, labels: [15]}
  - {id: choroid-plexus-left, color: [171, 114, 155], hemisphere: left, name: Choroid plexus, name_fr: Plexus choroïde, system: Ventricles and CSF, system_fr: Ventricules et LCR, labels: [31]}
  - {id: choroid-plexus-right, color: [171, 114, 155], hemisphere: right, name: Choroid plexus, name_fr: Plexus choroïde, system: Ventricles and CSF, system_fr: Ventricules et LCR, labels: [63]}
  - id: corpus-callosum
    color: [214, 197, 160]
    hemisphere: midline
    name: Corpus callosum
    name_fr: Corps calleux
    system: White matter pathways
    system_fr: Voies de substance blanche
    labels: [251, 252, 253, 254, 255]
    notes:
      en: >-
        Combines FreeSurfer’s five corpus callosum labels. This is segmented tissue, not a
        reconstruction of individual callosal fibres.
      fr: >-
        Réunit les cinq étiquettes du corps calleux de FreeSurfer. Il s’agit de tissu
        segmenté, et non d’une reconstruction des fibres calleuses individuelles.
  # NextBrain has no cerebellar cortex, so the mantle comes from aseg. Its
  # cerebellar white matter stays out: the deep nuclei sit inside that label.
  - {id: cerebellar-cortex-left, color: [138, 122, 110], hemisphere: left, name: Cerebellar cortex, name_fr: Cortex cérébelleux, system: Cerebellum, system_fr: Cervelet, labels: [8]}
  - {id: cerebellar-cortex-right, color: [138, 122, 110], hemisphere: right, name: Cerebellar cortex, name_fr: Cortex cérébelleux, system: Cerebellum, system_fr: Cervelet, labels: [47]}
# FastSurfer CerebNet's lobules (SUIT nomenclature) for anatomies declaring
# cerebellar_lobules. They subdivide the cortical mantle aseg publishes whole,
# so those units are replaced. SUIT folds vermis I–V into lobules I–IV and V.
cerebnet:
  replaces_aseg_units: [cerebellar-cortex-left, cerebellar-cortex-right]
  units:
    - id: lobules-i-iv-left
      color: [176, 120, 92]
      hemisphere: left
      name: Lobules I–IV
      name_fr: Lobules I–IV
      system: Cerebellum
      system_fr: Cervelet
      labels: [601]
      notes:
        en: >-
          CerebNet’s SUIT-based labels include the corresponding anterior vermis within the
          hemispheric lobules. Vermis I–V cannot be isolated as separate units in this set.
        fr: >-
          Les étiquettes de CerebNet fondées sur SUIT incluent le vermis antérieur
          correspondant dans les lobules hémisphériques. Le vermis I–V ne peut pas être
          isolé en unités distinctes dans cet ensemble.
    - id: lobules-i-iv-right
      color: [176, 120, 92]
      hemisphere: right
      name: Lobules I–IV
      name_fr: Lobules I–IV
      system: Cerebellum
      system_fr: Cervelet
      labels: [602]
      notes:
        en: >-
          CerebNet’s SUIT-based labels include the corresponding anterior vermis within the
          hemispheric lobules. Vermis I–V cannot be isolated as separate units in this set.
        fr: >-
          Les étiquettes de CerebNet fondées sur SUIT incluent le vermis antérieur
          correspondant dans les lobules hémisphériques. Le vermis I–V ne peut pas être
          isolé en unités distinctes dans cet ensemble.
    - id: lobule-v-left
      color: [92, 140, 176]
