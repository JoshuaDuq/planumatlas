    notes:
      en: >-
        Combines the medial septal nucleus and diagonal band labels. This is not a
        segmentation of all septal nuclei.
      fr: >-
        Réunit les étiquettes du noyau septal médial et de la bande diagonale. Il ne s’agit
        pas d’une segmentation de tous les noyaux septaux.
  - id: innominata
