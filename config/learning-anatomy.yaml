        fr: >-
          Les étiquettes de CerebNet fondées sur SUIT incluent le vermis antérieur
          correspondant dans les lobules hémisphériques. Le vermis I–V ne peut pas être
          isolé en unités distinctes dans cet ensemble.
    - {id: lobule-vi-left, color: [190, 168, 96], hemisphere: left, name: Lobule VI, name_fr: Lobule VI, system: Cerebellum, system_fr: Cervelet, labels: [605]}
    - {id: lobule-vi-right, color: [190, 168, 96], hemisphere: right, name: Lobule VI, name_fr: Lobule VI, system: Cerebellum, system_fr: Cervelet, labels: [607]}
    - {id: vermis-vi, color: [136, 182, 168], hemisphere: midline, name: Vermis VI (declive), name_fr: Vermis VI (déclive), system: Cerebellum, system_fr: Cervelet, labels: [606]}
