  - {id: zona-incerta, color: [116, 161, 147], name: Zona incerta, name_fr: Zona incerta, system: Diencephalon, system_fr: Diencéphale, labels: [226]}
  - id: lateral-geniculate
    color: [81, 147, 192]
    name: Lateral geniculate nucleus
    name_fr: Noyau géniculé latéral
    system: Diencephalon
    system_fr: Diencéphale
    labels: [484]
    notes:
      en: >-
        Uses the dorsal lateral geniculate nucleus label. The optic tract is a separate
        teaching unit.
      fr: >-
        Utilise l’étiquette du noyau géniculé latéral dorsal. Le tractus optique constitue
        une unité pédagogique distincte.
  # This unit uses only the explicitly named dorsal medial geniculate label.
  - id: medial-geniculate
    color: [153, 166, 88]
    name: Dorsal medial geniculate nucleus
    name_fr: Noyau géniculé médial dorsal
    system: Diencephalon
    system_fr: Diencéphale
    labels: [504]
    notes:
      en: >-
        Uses only the dorsal medial geniculate nucleus label (504). It does not represent
        the entire medial geniculate body or its ventral division.
      fr: >-
        Utilise uniquement l’étiquette du noyau géniculé médial dorsal (504). Cette unité ne
        représente ni le corps géniculé médial entier ni sa division ventrale.
  - id: hippocampus
    color: [94, 164, 158]
    name: Hippocampal formation
    name_fr: Formation hippocampique
    system: Limbic
    system_fr: Limbique
    notes:
      en: Combines the labelled CA fields, dentate gyrus, subiculum and alveus across uncal, rostral
        and caudal portions. The fimbria is shown separately; entorhinal cortex is not included.
      fr: Réunit les champs CA, le gyrus denté, le subiculum et l’alvéus étiquetés dans les portions
        uncale, rostrale et caudale. La fimbria est représentée séparément ; le cortex entorhinal n’est
        pas inclus.
    labels: [326, 339, 340, 341, 342, 343, 344, 345, 346, 347, 354, 364, 365, 367, 368, 369, 370, 371, 372, 373, 374, 375, 404, 405, 407, 408, 409, 410, 411, 418, 419, 420, 421, 422, 432, 558, 559, 561, 562, 563, 564, 565, 566, 567, 568, 569, 571, 572, 573, 574, 575, 576]
  - id: amygdala
    color: [196, 126, 147]
    name: Amygdala and transition areas
    name_fr: Amygdale et aires de transition
    system: Limbic
    system_fr: Limbique
    notes:
      en: Includes the selected amygdaloid nuclei and amygdalocortical, amygdalostriatal and amygdalohippocampal
