# Derived display units, not a new segmentation. Labels are explicit unions.
# NextBrain indices below are the published base (left) labels; right = +10000.
# No voxel is shared by two units from the same source.
# Colours distinguish display units; they are not the source LUT or tissue colours.
label: Learning anatomy
smoothing:
  iterations: 16
  maximum_displacement_mm: 0.6
nextbrain:
  - id: caudate
    color: [64, 142, 172]
    name: Caudate nucleus
    name_fr: Noyau caudé
    system: Basal ganglia
    system_fr: Ganglions de la base
    labels: [48, 118, 393]
    notes:
      en: >-
        Combines the labelled head, body and tail of the caudate. The nucleus accumbens is
        shown separately.
      fr: >-
        Réunit la tête, le corps et la queue du noyau caudé étiquetés dans l’atlas. Le noyau
        accumbens est représenté séparément.
  - id: putamen
    color: [210, 150, 67]
    name: Putamen
    name_fr: Putamen
    system: Basal ganglia
    system_fr: Ganglions de la base
    labels: [79, 349]
    notes:
      en: >-
        Combines the putamen and its separately labelled posteroventral portion. This unit
        does not distinguish functional territories.
      fr: >-
        Réunit le putamen et sa portion postéroventrale étiquetée séparément. Cette unité ne
        distingue pas les territoires fonctionnels.
  - {id: pallidum-external, color: [132, 110, 180], name: Globus pallidus — external, name_fr: Globus pallidus externe, system: Basal ganglia, system_fr: Ganglions de la base, labels: [119]}
  - {id: pallidum-internal, color: [180, 91, 131], name: Globus pallidus — internal, name_fr: Globus pallidus interne, system: Basal ganglia, system_fr: Ganglions de la base, labels: [206]}
  - id: accumbens
    color: [96, 159, 105]
    name: Nucleus accumbens core
    name_fr: Cœur du noyau accumbens
    system: Basal ganglia
    system_fr: Ganglions de la base
    labels: [101]
    notes:
      en: >-
        Represents the labelled core of the nucleus accumbens, not the entire nucleus. The
        shell is not included in this unit.
      fr: >-
        Représente le cœur étiqueté du noyau accumbens, et non le noyau entier. La coquille
        n’est pas incluse dans cette unité.
  - id: subthalamic
    color: [209, 112, 65]
    name: Subthalamic nucleus
    name_fr: Noyau sous-thalamique
    system: Basal ganglia
    system_fr: Ganglions de la base
    labels: [315, 316, 321]
    notes:
      en: >-
        Combines the labelled medial, laterodorsal and lateroventral portions of the
        subthalamic nucleus.
      fr: >-
        Réunit les portions médiale, latérodorsale et latéroventrale étiquetées du noyau
        sous-thalamique.
  - id: substantia-nigra
    color: [83, 106, 143]
    name: Substantia nigra
    name_fr: Substance noire
    system: Basal ganglia
    system_fr: Ganglions de la base
    labels: [310, 352]
    notes:
      en: >-
        Combines the pars compacta and pars reticulata. Their separate labels are available
        among the constituents in NextBrain.
      fr: >-
        Réunit la pars compacta et la pars reticulata. Leurs étiquettes distinctes figurent
        parmi les constituants dans NextBrain.
  - id: claustrum
    color: [135, 166, 104]
    name: Claustrum
    name_fr: Claustrum
    system: Basal forebrain
    system_fr: Prosencéphale basal
    labels: [102, 174]
    notes:
      en: >-
        Combines the claustrum and temporal claustrum labels. Fragmentation of this thin
        structure reflects the segmentation; the display does not fill the gaps.
      fr: >-
        Réunit les étiquettes du claustrum et du claustrum temporal. La fragmentation de
        cette structure fine reflète la segmentation ; l’affichage ne comble pas les
        lacunes.
  - {id: ventral-pallidum, color: [184, 136, 83], name: Ventral pallidum, name_fr: Pallidum ventral, system: Basal forebrain, system_fr: Prosencéphale basal, labels: [120]}
  - id: septal
