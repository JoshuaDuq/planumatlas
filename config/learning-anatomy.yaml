    name_fr: Territoire bulbaire
    system: Brainstem
    system_fr: Tronc cérébral
    labels: [662, 654, 765]
    notes:
      en: >-
        Combines the medulla, principal inferior olivary nucleus and medullary central grey
        labels. Its caudal continuation is shown separately using FreeSurfer; the pyramidal
        decussation is not separately delineated.
      fr: >-
        Réunit les étiquettes du bulbe, du noyau principal de l’olive inférieure et de la
        substance grise centrale bulbaire. Son prolongement caudal est représenté séparément
        à partir de FreeSurfer ; la décussation pyramidale n’est pas délimitée séparément.
