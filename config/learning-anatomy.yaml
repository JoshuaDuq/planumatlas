      fr: >-
        Réunit l’étiquette générale du mésencéphale avec la substance grise périaqueducale,
        la région prétectale, le noyau péripédonculaire et le raphé dorsal. Les noyaux
        représentés séparément sont exclus ; il ne s’agit pas d’un faisceau corticospinal
