  - {id: bnST, color: [160, 150, 94], name: Bed nucleus of stria terminalis, name_fr: Noyau du lit de la strie terminale, system: Limbic, system_fr: Limbique, labels: [117]}
  - id: fornix
    color: [210, 188, 125]
    name: Fornix
    name_fr: Fornix
    system: White matter pathways
    system_fr: Voies de substance blanche
    labels: [199]
    notes:
      en: >-
        Shows the tissue labelled as fornix; the fimbria is a separate unit. A segmented
        tract label does not show individual axons or establish connectivity in this person.
      fr: >-
        Montre le tissu étiqueté comme fornix ; la fimbria constitue une unité distincte.
        Une étiquette de faisceau segmenté ne montre pas les axones individuels et n’établit
        pas la connectivité chez cette personne.
  - {id: fimbria, color: [161, 180, 132], name: Fimbria, name_fr: Fimbria, system: White matter pathways, system_fr: Voies de substance blanche, labels: [461]}
  - {id: anterior-commissure, color: [206, 149, 100], name: Anterior commissure, name_fr: Commissure antérieure, system: White matter pathways, system_fr: Voies de substance blanche, labels: [130]}
  - {id: optic-tract, color: [111, 170, 194], name: Optic tract, name_fr: Tractus optique, system: White matter pathways, system_fr: Voies de substance blanche, labels: [208]}
  - id: optic-chiasm
