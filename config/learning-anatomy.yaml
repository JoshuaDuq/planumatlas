    color: [115, 155, 190]
    name: Optic chiasm
    name_fr: Chiasma optique
    system: White matter pathways
    system_fr: Voies de substance blanche
    labels: [161]
    notes:
      en: >-
        Combines both hemisphere labels into one midline structure. The solid shows labelled
        tissue, not the paths of crossing and uncrossed fibres.
      fr: >-
        Réunit les étiquettes des deux hémisphères en une structure médiane. Le volume
        montre le tissu étiqueté, et non les trajets des fibres croisées et non croisées.
  - {id: stria-terminalis, color: [177, 145, 183], name: Stria terminalis, name_fr: Strie terminale, system: White matter pathways, system_fr: Voies de substance blanche, labels: [184]}
  - {id: mammillothalamic, color: [204, 174, 96], name: Mammillothalamic tract, name_fr: Faisceau mamillo-thalamique, system: White matter pathways, system_fr: Voies de substance blanche, labels: [276]}
  - {id: superior-cerebellar-peduncle, color: [152, 153, 119], name: Superior cerebellar peduncle, name_fr: Pédoncule cérébelleux supérieur, system: White matter pathways, system_fr: Voies de substance blanche, labels: [531]}
  - {id: inferior-cerebellar-peduncle, color: [194, 156, 138], name: Inferior cerebellar peduncle, name_fr: Pédoncule cérébelleux inférieur, system: White matter pathways, system_fr: Voies de substance blanche, labels: [697]}
  - id: midbrain
    color: [112, 147, 173]
    name: Midbrain territory
    name_fr: Territoire mésencéphalique
    system: Brainstem
    system_fr: Tronc cérébral
    labels: [384, 465, 496, 498, 521]
    notes:
      en: >-
        Combines the broad midbrain label with periaqueductal grey, pretectal region,
        peripeduncular nucleus and dorsal raphe. Separately displayed nuclei are excluded;
