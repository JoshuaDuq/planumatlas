    name: Pontine territory
    name_fr: Territoire pontique
    system: Brainstem
    system_fr: Tronc cérébral
    labels: [580, 414]
    notes:
      en: >-
        Combines the broad pons and pontine nucleus labels. This territory does not
        delineate individual cranial nerve nuclei or fibre pathways.
      fr: >-
        Réunit les étiquettes générales du pont et du noyau pontique. Ce territoire ne
        délimite pas individuellement les noyaux des nerfs crâniens ou les voies de fibres.
  - id: medulla
