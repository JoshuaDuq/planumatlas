# Cortical layers from BigBrain, one post-mortem brain (a man of 65): the six layers Wagstyl et al.
# (2020) segmented with a neural network on its cell-stained 20 µm sections, as BigBrainWarp
# (Paquola et al. 2021) resampled their thicknesses to fsaverage. scripts/fetch_cortical_layers.py
# copies the twelve files below unchanged into fsaverage's surf directory; the build averages them
# over each cortical atlas's fsaverage parcels and carries a parcel's shares to this brain's parcel
# of the same name. Nothing here is measured in the anatomy shown.
#
# Terms, read 2026-11-16. BigBrain is CC BY-NC-SA 4.0 (the BigBrain FTP's License.txt). The
# BigBrainWarp share holds no licence file; the paper's data statement puts its data "in the
# BigBrainWarp repository", whose LICENSE (GPL-3.0) covers its code. Nothing forbids
# redistribution, so BigBrain's terms, share-alike, carry over to the derived files.
label: Cortical layers (BigBrain, one histological brain)
license: CC BY-NC-SA 4.0
source:
  short: Wagstyl et al. (2020)
  citation: "Wagstyl K, Larocque S, Cucurull G, et al. (2020) BigBrain 3D atlas of cortical layers: cortical and laminar thickness gradients diverge in sensory and motor cortices. PLoS Biology 18:e3000678"
  doi: https://doi.org/10.1371/journal.pbio.3000678
  pmid: 32243449
collection:
  short: BigBrainWarp
