# BigBrain's mask leaves its medial wall at zero in every layer, and it reaches further on the left
# (left HCP-MMP PHA1 98%, EC 75%). A parcel is published only where the layers cover this share of
# its fsaverage area.
minimum_coverage: 0.5
# Cortex without six layers is left out by name, whatever the network assigned there: the
# hippocampal formation's allocortex (hippocampus, dentate gyrus, subicular complex) and the
# olfactory (piriform) cortex. The entorhinal cortex is kept. Destrieux, Desikan-Killiany and
# Schaefer name no such parcel.
excluded:
  hcp-mmp: [L_H_ROI, R_H_ROI, L_PreS_ROI, R_PreS_ROI, L_Pir_ROI, R_Pir_ROI]
  julich:
    - CA1 (Hippocampus)
    - CA2 (Hippocampus)
    - CA3 (Hippocampus)
    - DG (Hippocampus)
    - Subc (Hippocampus, Subicular complex)
    - TrS (Hippocampus, Transsubiculum)
# Layer IV's share painted across the cortex in four rising steps, lilac to deep crimson, away from
# the functions' blue, connectivity's violet and the disorders' blue and orange. Chosen 2026-11-16
# from the published shares (median 7.6%, 90th percentile 10.3%, V1 20–25%) so that area 4 (7–8%),
# area 3b (10–12%) and V1 fall in different steps. Measured: every colour differs from the cortex,
# deep grey and ventricle colours by an OKLab ΔE of at least 14.5 under normal vision (12.7
# simulated protanopia, 7.8 deuteranopia, against the ventricle) and from the others by at least
# 17.1 (Machado 2009, severity 1).
layer_iv_scale:
  - {from: 0, color: [231, 225, 239]}
  - {from: 0.07, color: [185, 120, 205]}
  - {from: 0.09, color: [165, 0, 95]}
  - {from: 0.12, color: [80, 0, 28]}
# Layer-specific distributions of segmented cells (Dickscheid, Bludau, Paquola, Schiffer, Upschulte
# and Amunts; EBRAINS, CC BY-NC-SA 4.0): image patches of twelve Julich-Brain areas cut from
# BigBrain's sections, layers drawn by hand, cell bodies segmented by a contour proposal network.
# scripts/fetch_cortical_layers.py reads each pinned patch's cells per layer and layer areas into
# data/cortical-layer-cells.json. Each patch is [section, patch, segments.txt, layerinfo.txt and
# 0.json (the pial line, whose "QC ok" the fetch requires), each file's sha256].
cells:
  bucket: https://data-proxy.ebrains.eu/api/v1/buckets/p22717-hbp-d000061_BB-CorticalCellDistribution_pub
  version: v1.0
  method_doi: https://doi.org/10.1016/j.media.2022.102371
  # The data descriptors: 20 µm sections, a volumetric shrinkage factor of 1.931 that the counts
  # per volume in their reports take into account.
  section_thickness_um: 20
  volumetric_shrinkage: 1.931
